experimental = ["wrapper-scripts"]

[scripts.wrapper.local-docker-ci]
command = ["sh", "-c", 'unset VELNOR_MBX_REPORTS; if [ "${GITHUB_ACTIONS:-}" = true ] && [ "${VELNOR_TEST_DOCKER_HOST+x}" != x ]; then export VELNOR_TEST_DOCKER_HOST=unix:///var/run/docker.sock; fi; exec "$@"', "local-docker-ci"]

[scripts.wrapper.no-programs]
command = ["/usr/bin/env", "-u", "VELNOR_MBX_REPORTS", "PATH=/nonexistent"]

[scripts.wrapper.no-mbx-reports]
command = ["/usr/bin/env", "-u", "VELNOR_MBX_REPORTS"]
target-runner = "within-wrapper"

[test-groups]
docker-networks = { max-threads = 4 }
velnor-ci-serial = { max-threads = 1 }
probe-cleanup-observer-serial = { max-threads = 1 }
setup-action = { max-threads = 2 }
sandbox-disk = { max-threads = 1 }
sandbox-net = { max-threads = 1 }

[profile.default]
default-filter = 'not test(=audit::bounds::limit_env::a_tree_above_100000_entries_passes_under_the_default_limit)'

[[profile.default.overrides]]
filter = 'binary(sandbox_live) and test(~limits::)'
test-group = 'sandbox-disk'

[[profile.default.overrides]]
filter = 'binary(sandbox_live) and test(~network::)'
test-group = 'sandbox-net'

[[profile.default.overrides]]
filter = 'binary(sandbox_live) and (test(=cleanup::every_dead_sandbox_is_swept_with_its_cgroup_and_directories) or test(=limits::a_fork_bomb_is_contained_and_the_job_is_killed_cleanly) or test(=limits::a_tree_nested_1_000_000_levels_is_removed_in_under_a_minute_with_flat_descriptors) or test(=start::the_sandbox_parent_and_its_chain_use_under_100_ms_of_cpu_at_the_median))'
threads-required = "num-cpus"

[profile.slow]
default-filter = 'test(=audit::bounds::limit_env::a_tree_above_100000_entries_passes_under_the_default_limit)'

[[profile.slow.overrides]]
filter = 'test(=audit::bounds::limit_env::a_tree_above_100000_entries_passes_under_the_default_limit)'
slow-timeout = { period = "400s", terminate-after = 1 }

[profile.ci]
retries = 0
test-threads = "num-cpus"
status-level = "all"
final-status-level = "flaky"

[[profile.default.scripts]]
filter = "package(=velnor-gen) or package(=velnor-model) or package(=velnor-release) or package(=velnor-render) or package(=velnor-rust)"
list-wrapper = "no-programs"
run-wrapper = "no-programs"

[[profile.ci.scripts]]
filter = "package(=velnor-gen) or package(=velnor-model) or package(=velnor-release) or package(=velnor-render) or package(=velnor-rust)"
list-wrapper = "no-programs"
run-wrapper = "no-programs"

[[profile.ci.scripts]]
filter = 'package(=velnor-runner-host) and (binary(=local_pair_public) or binary(=local_host_public))'
platform = 'cfg(target_os = "linux")'
run-wrapper = 'local-docker-ci'

[[profile.ci.scripts]]
filter = 'package(=velnor-local) and binary(=it) and test(removal_audit::)'
platform = 'cfg(target_os = "linux")'
run-wrapper = 'local-docker-ci'

[[profile.default.scripts]]
filter = "all()"
run-wrapper = "no-mbx-reports"

[[profile.ci.scripts]]
