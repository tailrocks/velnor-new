# Nextest profiles (Gate 0 skeleton).
# Empty-run behavior is enforced via CLI `--no-tests fail` (contract §4);
# nextest has no profile-level equivalent, so it is not set here.
experimental = ["wrapper-scripts"]

[scripts.wrapper.local-docker-ci]
command = ["sh", "-c", 'if [ "${GITHUB_ACTIONS:-}" = true ] && [ "${VELNOR_TEST_DOCKER_HOST+x}" != x ]; then export VELNOR_TEST_DOCKER_HOST=unix:///var/run/docker.sock; fi; exec "$@"', "local-docker-ci"]

[scripts.wrapper.no-programs]
command = ["/usr/bin/env", "PATH=/nonexistent"]

[test-groups]
docker-networks = { max-threads = 4 }
velnor-ci-serial = { max-threads = 1 }

[profile.ci]
retries = 0
test-threads = "num-cpus"
status-level = "all"
final-status-level = "flaky"

[[profile.default.scripts]]
filter = "package(=velnor-gen) or package(=velnor-model) or package(=velnor-release) or package(=velnor-render) or package(=velnor-rust)"
list-wrapper = "no-programs"
run-wrapper = "no-programs"

[[profile.ci.scripts]]
filter = "package(=velnor-gen) or package(=velnor-model) or package(=velnor-release) or package(=velnor-render) or package(=velnor-rust)"
list-wrapper = "no-programs"
run-wrapper = "no-programs"

[[profile.ci.scripts]]
filter = 'package(=velnor-runner-host) and (binary(=local_pair_public) or binary(=local_host_public))'
platform = 'cfg(target_os = "linux")'
run-wrapper = 'local-docker-ci'

[[profile.ci.scripts]]
filter = 'package(=velnor-local) and binary(=it) and test(removal_audit::)'
platform = 'cfg(target_os = "linux")'
run-wrapper = 'local-docker-ci'

[[profile.ci.overrides]]
filter = 'package(=velnor-actions-orchestrator) and binary(=runner_image_build_public)'
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.ci.overrides]]
filter = 'package(=velnor-archive-guard) and binary(=golden_collector_public) and (test(=bounded::caps_stdout_after_successful_entry_and_retains_the_prefix) or test(=bounded::times_out_after_guard_mutation_and_cleans_only_its_owned_group) or test(=bounded::retains_stderr_prefix_and_reports_source_mutation_with_output_overflow) or test(=executable_custody::replaces_external_original_after_nested_plan_and_keeps_all_goldens_matching) or test(=executable_custody::rejects_candidate_changes_to_fixture_or_dogfood_source) or test(=gate::repository_golden_gate_accepts_matching_and_rejects_changed_oracle) or test(=oracle_snapshot::capture_creates_an_absent_oracle_identical_to_the_checked_in_goldens) or test(=oracle_snapshot::capture_rejects_candidate_created_destination) or test(=oracle_snapshot::rejects_a_candidate_that_forges_the_oracle_to_match_its_output) or test(=oracle_snapshot::capture_rejects_changes_to_unmanaged_oracle_files) or test(=tree_inventory::rejects_a_golden_file_whose_executable_mode_changed) or test(=tree_inventory::rejects_an_invalid_manifest_before_capture_without_changing_cases))'
threads-required = "num-test-threads"

# Start the measured longest CI tests first to reduce the scheduling tail.
# Main a85 timings were 41.840s, 21.264s, and 14.880s respectively;
# this ordering does not guarantee the hosted job's total duration.
[[profile.ci.overrides]]
filter = 'package(=velnor-actions-orchestrator) and test(=impl_tofu_t24_scale::tofu_generate_scales_with_root_count)'
priority = 100

[[profile.ci.overrides]]
filter = 'package(=velnor-actions-orchestrator) and test(=impl_perf_p13::generate_scales_to_workflow_file_limit_then_fails_closed)'
priority = 90

[[profile.ci.overrides]]
filter = 'package(=velnor-actions-orchestrator) and test(=impl_generate_p09_atomic::atomic_commit_never_exposes_missing_tree)'
priority = 80

[[profile.ci.overrides]]
filter = 'package(velnor-actions-orchestrator) and test(bench_concurrent_lanes_2_and_4)'
success-output = "immediate"

[[profile.ci.overrides]]
filter = 'package(velnor-actions-orchestrator) and test(bench_empty_caches_cold_plan)'
success-output = "immediate"

[[profile.default.overrides]]
filter = 'package(=velnor-archive-guard) and binary(=golden_collector_public) and (test(=bounded::caps_stdout_after_successful_entry_and_retains_the_prefix) or test(=bounded::times_out_after_guard_mutation_and_cleans_only_its_owned_group) or test(=bounded::retains_stderr_prefix_and_reports_source_mutation_with_output_overflow))'
threads-required = "num-test-threads"

[[profile.default.overrides]]
filter = 'package(=velnor-actions-orchestrator) and binary(=runner_image_build_public)'
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.ci.overrides]]
filter = 'package(=velnor-gen) and binary(=it) and (test(=release_cargo_include::a_cargo_config_include_is_refused_in_every_form_in_a_real_repository) or test(=release_cargo_include::a_cargo_config_key_off_the_harmless_list_is_refused_in_a_real_repository) or test(=release_cargo_include::a_cargo_config_of_harmless_keys_is_accepted_in_a_real_repository) or test(=release_symlink::a_committed_cargo_symlink_hiding_a_credential_provider_is_refused_in_a_real_repository) or test(=release_nested_toolchain::a_root_toolchain_taken_from_a_path_is_refused_in_a_real_repository) or test(=golden_env::the_update_switch_leaves_the_expected_files_alone_when_it_is_zero) or test(=golden_env::the_update_switch_rewrites_the_expected_files_when_it_is_one) or test(=golden_env::the_update_switch_leaves_the_ruleset_alone_when_it_is_zero) or test(=golden_env::the_update_switch_rewrites_the_ruleset_when_it_is_one))'
slow-timeout = { period = "10s", terminate-after = 1 }

[[profile.default.overrides]]
filter = 'package(=velnor-gen) and binary(=it) and (test(=release_cargo_include::a_cargo_config_include_is_refused_in_every_form_in_a_real_repository) or test(=release_cargo_include::a_cargo_config_key_off_the_harmless_list_is_refused_in_a_real_repository) or test(=release_cargo_include::a_cargo_config_of_harmless_keys_is_accepted_in_a_real_repository) or test(=release_symlink::a_committed_cargo_symlink_hiding_a_credential_provider_is_refused_in_a_real_repository) or test(=release_nested_toolchain::a_root_toolchain_taken_from_a_path_is_refused_in_a_real_repository) or test(=golden_env::the_update_switch_leaves_the_expected_files_alone_when_it_is_zero) or test(=golden_env::the_update_switch_rewrites_the_expected_files_when_it_is_one) or test(=golden_env::the_update_switch_leaves_the_ruleset_alone_when_it_is_zero) or test(=golden_env::the_update_switch_rewrites_the_ruleset_when_it_is_one))'
slow-timeout = { period = "10s", terminate-after = 1 }

[[profile.default.overrides]]
filter = 'package(=velnor-gen) and test(=helper_tool_paths::setup_records_non_default_tools_and_rendered_calls_use_them)'
slow-timeout = { period = "10s", terminate-after = 1 }

[[profile.ci.overrides]]
filter = 'package(=velnor-gen) and test(=helper_tool_paths::setup_records_non_default_tools_and_rendered_calls_use_them)'
