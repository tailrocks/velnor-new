[package]
name = "velnor-archive-guard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[package.metadata.velnor]
v1-task-owner = "repository-maintenance"

[lib]
path = "src/lib.rs"

[[bin]]
name = "velnor-archive-guard"
path = "src/bin/velnor_archive_guard.rs"

[[test]]
name = "archive_guard_cli"
path = "tests/archive_guard_cli.rs"

[dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }

[build-dependencies]
sha2 = { version = "=0.11.0", default-features = false }

[dev-dependencies]
sha2 = { version = "=0.11.0", default-features = false }

[lints]
workspace = true
