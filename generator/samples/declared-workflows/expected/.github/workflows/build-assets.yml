name: Build assets
on:
  workflow_call:
    inputs:
      version:
        description: Version to build
        required: true
        type: string
      dry_run:
        description: Build without publishing
        required: false
        type: boolean
        default: true
    outputs:
      artifact_id:
        description: Artifact that holds the assets
        value: '${{ jobs.build.outputs.artifact_id }}'
permissions: {}
jobs:
  build:
    permissions:
      attestations: write
      contents: read
      id-token: write
    cache-mode: read
    outputs:
      artifact_id: '${{ steps.upload.outputs.artifact-id }}'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a
        with:
          cache: false
          cache_save: false
      - name: Build
        env:
          VERSION: '${{ inputs.version }}'
        run: cargo build --release --locked
      - id: upload
        name: upload-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: assets
          path: target/release/app
      - name: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: target/release/app
          push-to-registry: false
  smoke:
    needs:
      - build
    if: '${{ needs.build.result == ''success'' }}'
    permissions: {}
    cache-mode: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
        profile:
          - debug
          - release
    timeout-minutes: 10
    steps:
      - name: Smoke test
        env:
          OS: '${{ matrix.os }}'
          PROFILE: '${{ matrix.profile }}'
        run: echo smoke
