# Generated by velnor-gen. Change .velnor/workflows.toml and run `velnor-gen generate`.
name: Release checks
on:
  workflow_dispatch:
    inputs:
      mode:
        description: How much to check
        required: false
        type: choice
        default: quick
        options:
          - quick
          - full
  schedule:
    - cron: '23 4 * * 1'
  push:
    branches:
      - main
    tags:
      - 'rust-ci-v*'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
  merge_group: {}
permissions: {}
jobs:
  plan:
    permissions:
      contents: read
    runs-on: '${{ (!startsWith(github.event_name, ''pull_request'') || github.event.pull_request.head.repo.full_name == github.repository) && ''velnor-linux-x64'' || ''ubuntu-latest'' }}'
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Show the mode
        env:
          MODE: '${{ inputs.mode }}'
        run: printenv MODE
  assets:
    needs:
      - plan
    if: '${{ github.event_name == ''push'' || github.event_name == ''workflow_dispatch'' }}'
    permissions:
      attestations: write
      contents: read
      id-token: write
    uses: './.github/workflows/build-assets.yml'
    with:
      dry_run: false
      version: '${{ github.sha }}'
  verify:
    needs:
      - assets
    environment: release
    permissions:
      contents: read
    runs-on: '${{ (!startsWith(github.event_name, ''pull_request'') || github.event.pull_request.head.repo.full_name == github.repository) && ''velnor-linux-x64'' || ''ubuntu-latest'' }}'
    timeout-minutes: 15
    steps:
      - name: download-artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: '${{ needs.assets.outputs.artifact_id }}'
      - name: Check the assets
        continue-on-error: true
        run: ls -l
