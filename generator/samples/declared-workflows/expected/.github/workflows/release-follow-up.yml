name: Release follow-up
on:
  workflow_run:
    workflows:
      - Release checks
    types:
      - completed
    branches:
      - main
permissions: {}
concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: false
jobs:
  notify:
    if: '${{ github.event.workflow_run.conclusion == ''success'' }}'
    permissions: {}
    cache-mode: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
