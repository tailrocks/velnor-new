    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fail when a Rust job failed or was cancelled
        if: '${{ contains(needs.*.result, ''failure'') || contains(needs.*.result, ''cancelled'') }}'
        run: exit 1
