# Generated by velnor-gen. Change .velnor/rust-ci.toml and run `velnor-gen generate`.
name: Rust cache cleanup
on:
  # jactionlint ignore=dangerous-triggers
  workflow_run:
    workflows:
      - Rust CI
    types:
      - completed
permissions: {}
concurrency:
  group: 'velnor-pr-delta-cleanup-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}'
  cancel-in-progress: false
jobs:
  rust-trim:
    if: '${{ github.event.workflow_run.event == ''pull_request'' && github.event.workflow_run.path == ''.github/workflows/rust-ci.yml'' && github.event.workflow_run.head_repository.id == github.event.repository.id }}'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install velnor-ci 0.1.81
        uses: tailrocks/velnor-new/actions/setup-velnor@1793cf84b5924e2542a03b0fb2580e7395b2f4cb  # rust-ci-v0.1.81
        with:
          version: '0.1.81'
          sha256-linux-x64: a82f2edacbd781debf2da851d3b3380e81fce9fdec216c1101ca5ce91afe7386
          sha256-linux-arm64: '05b16546fa0d95c67b61bd041e59dfbcda527ca89f9350ae75d5be3219eaf98b'
          sha256-macos-arm64: '91b0214fc2a5713bf7c962842636eecb899bbb052646a396818526e528a713f4'
      - name: Delete older PR delta entries
        env:
          GITHUB_TOKEN: '${{ github.token }}'
          RUN_ID: '${{ github.event.workflow_run.id }}'
        run: 'velnor-ci cache trim-deltas --run-id "$RUN_ID"'
