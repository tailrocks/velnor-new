# Generated by velnor-gen. Change .velnor/rust-ci.toml and run `velnor-gen generate`.
name: Rust CI
on:
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: '${{ github.workflow_ref }}'
  cancel-in-progress: true
jobs:
  # one job: .velnor/rust-ci-timings.json has no build times for this workspace
  rust-root:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
        with:
          version: '2026.11.1'
          cache: false
          install_args: 'rust aqua:nextest-rs/nextest/cargo-nextest'
      - name: Add rustfmt and clippy
        run: rustup component add rustfmt clippy
      - name: Format
        if: '${{ !cancelled() }}'
        run: cargo-fmt --all --check
      - name: Lint
        if: '${{ !cancelled() }}'
        run: cargo-clippy clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        if: '${{ !cancelled() }}'
        run: 'cargo-nextest nextest run --workspace --locked --no-fail-fast -E ''all()'''
      - name: Doctests
        if: '${{ !cancelled() }}'
        run: cargo test --doc --workspace --locked
      - name: Documentation
        if: '${{ !cancelled() }}'
        run: 'cargo doc --workspace --no-deps --locked --config ''build.rustdocflags=["-D","warnings"]'''
      - name: Check app alone
        if: '${{ !cancelled() }}'
        run: cargo check -p app --locked
      - name: Check core alone
        if: '${{ !cancelled() }}'
        run: cargo check -p core --locked
      - name: Check lib alone
        if: '${{ !cancelled() }}'
        run: cargo check -p lib --locked
      - name: Check macros alone
        if: '${{ !cancelled() }}'
        run: cargo check -p macros --locked
      - name: Check tool alone
        if: '${{ !cancelled() }}'
        run: cargo check -p tool --locked
  # one job: .velnor/rust-ci-timings.json has no build times for this workspace
  rust-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
        with:
          version: '2026.11.1'
          cache: false
          install_args: 'rust aqua:nextest-rs/nextest/cargo-nextest'
      - name: Add rustfmt and clippy
        working-directory: lab
        run: rustup component add rustfmt clippy
      - name: Format
        if: '${{ !cancelled() }}'
        working-directory: lab
        run: cargo-fmt --all --check
      - name: Lint
        if: '${{ !cancelled() }}'
        working-directory: lab
        run: cargo-clippy clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        if: '${{ !cancelled() }}'
        working-directory: lab
        run: 'cargo-nextest nextest run --workspace --locked --no-fail-fast -E ''all()'''
      - name: Documentation
        if: '${{ !cancelled() }}'
        working-directory: lab
        run: 'cargo doc --workspace --no-deps --locked --config ''build.rustdocflags=["-D","warnings"]'''
      - name: Check lab alone
        if: '${{ !cancelled() }}'
        working-directory: lab
        run: cargo check -p lab --locked
  required:
    name: Required
    needs:
      - rust-root
      - rust-lab
    if: '${{ !cancelled() }}'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fail when a Rust job failed or was cancelled
        if: '${{ contains(needs.*.result, ''failure'') || contains(needs.*.result, ''cancelled'') }}'
        run: exit 1
