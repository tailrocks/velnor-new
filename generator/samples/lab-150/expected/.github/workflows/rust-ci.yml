      - name: Install tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
        with:
          version: '2026.11.1'
          cache: false
          install_args: 'rust aqua:nextest-rs/nextest/cargo-nextest'
      - name: Add Rust components
        run: rustup component add clippy rustfmt
      - name: Add Rust targets
        run: rustup target add aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu
      - name: Format
        if: '${{ !cancelled() }}'
        run: cargo-fmt --all --check
      - name: Lint
        if: '${{ !cancelled() }}'
        run: cargo-clippy clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
