          restore-keys: |
            velnor-tgt-rust-inputs-audit-lab-${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.compat }}-${{ hashFiles('lab/Cargo.lock') }}-
            velnor-tgt-rust-inputs-audit-lab-${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.compat }}-
      - id: restored
        name: velnor-ci restored
        run: velnor-ci restored
      - name: velnor-ci inputs restore
        run: velnor-ci inputs restore
      - name: velnor-ci inputs restore
        working-directory: lab
        run: velnor-ci inputs restore
      - name: Build every target
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' }}'
        env:
          CARGO_LOG: '${{ vars.VELNOR_CACHE_DEBUG == ''1'' && ''cargo::core::compiler::fingerprint=info'' || '''' }}'
        run: velnor-ci run -- cargo build --workspace --all-targets --locked
      - name: Build every target
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' }}'
        working-directory: lab
        env:
          CARGO_LOG: '${{ vars.VELNOR_CACHE_DEBUG == ''1'' && ''cargo::core::compiler::fingerprint=info'' || '''' }}'
        run: velnor-ci run -- cargo build --workspace --all-targets --locked
      - name: velnor-ci inputs audit
        run: velnor-ci inputs audit
      - name: Upload the cargo fingerprint log
        if: '${{ !cancelled() && vars.VELNOR_CACHE_DEBUG == ''1'' && steps.restored.outcome == ''success'' }}'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 'velnor-cargo-log-${{ github.job }}'
          path: '${{ runner.temp }}/velnor-run.log'
          if-no-files-found: ignore
          retention-days: 3
          overwrite: true
  required:
    name: Required
    needs:
      - rust-plan
      - rust-root
      - rust-lab
      - rust-inputs-audit
    if: '${{ !cancelled() }}'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fail when a Rust job failed or was cancelled
        if: '${{ contains(needs.*.result, ''failure'') || contains(needs.*.result, ''cancelled'') }}'
        run: exit 1
