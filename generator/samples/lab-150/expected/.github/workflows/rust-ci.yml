          if-no-files-found: error
          retention-days: 3
          overwrite: true
  # one job: .velnor/rust-ci-timings.json has no build times for this workspace
  rust-lab:
    needs:
      - rust-plan
      - rust-inputs-audit
    if: '${{ (github.event_name != ''pull_request'' || (startsWith(github.ref, ''refs/pull/'') && github.event.pull_request.state != ''closed'')) && (!cancelled() && needs.rust-plan.result == ''success'' && needs.rust-plan.outputs.rust_lab_mode != ''none'') && (needs.rust-inputs-audit.result == ''success'' || needs.rust-inputs-audit.result == ''skipped'') }}'
    permissions:
      actions: read
      contents: read
    outputs:
      # jactionlint ignore=unused-job-output
      tests_run: '${{ steps.test.outputs.tests_run }}'
      # jactionlint ignore=unused-job-output
      tests_listed: '${{ steps.test.outputs.tests_listed }}'
      # jactionlint ignore=unused-job-output
      tests_by_package: '${{ steps.test.outputs.tests_by_package }}'
      base_prefix: 'velnor-tgt-rust-lab.lab.${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.compat }}-'
      base_save: '${{ steps.base.outputs.save }}'
      target_key: '${{ steps.target_key.outputs.key }}'
      sources_prefix: 'velnor-src-${{ runner.os }}-${{ runner.arch }}-lab-'
      sources_saved: '${{ steps.sources_save_lab.outcome == ''success'' }}'
      sources_key: '${{ steps.sources_lab_key.outputs.key }}'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve released helper tools
        env:
          VELNOR_HELPER_INSTALL_TOOLS: *velnor_0
        run: 'eval "$VELNOR_HELPER_INSTALL_TOOLS"'
      - name: Install velnor-ci 0.1.81
        uses: tailrocks/velnor-new/actions/setup-velnor@1793cf84b5924e2542a03b0fb2580e7395b2f4cb  # rust-ci-v0.1.81
        with:
          version: '0.1.81'
          sha256-linux-x64: '10e3511ab3d2f211366c6fd3633474f4a74ee6750b16b52c90758c0e8321dd3e'
          sha256-linux-arm64: '56d836fd2ae8135b5306f154b3287dfe81328f7a89b0528b3b912fab6e6916a6'
          sha256-macos-arm64: '39431db3aeccf193088fa8845896c627e3da004f683d4d4699d3d697c808c607'
      - name: Install the released helper launcher
        env:
          VELNOR_HELPER_INSTALL_LAUNCHER: *velnor_1
          VELNOR_HELPER_LAUNCHER: *velnor_2
          VELNOR_HELPER_SHA256: *velnor_3
        run: 'eval "$VELNOR_HELPER_INSTALL_LAUNCHER"'
      - id: tools
        name: Restore the tools cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.local/share/mise
            ~/.rustup
          key: 'velnor-tools-${{ runner.os }}-${{ runner.arch }}-mise2026.11.10-${{ hashFiles(''mise.lock'') }}'
      - name: Install tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
        with:
          version: '2026.11.10'
          cache: false
      - name: Add Rust components
        working-directory: lab
        run: rustup component add clippy rustfmt
      - name: Add Rust targets
        working-directory: lab
        run: rustup target add aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu
      - id: save_tools
        name: Save the tools cache
        if: '${{ github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch) && steps.tools.outputs.cache-hit != ''true'' }}'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.local/share/mise
            ~/.rustup
          key: 'velnor-tools-${{ runner.os }}-${{ runner.arch }}-mise2026.11.10-${{ hashFiles(''mise.lock'') }}'
      - id: prepare
        name: velnor-ci prepare
        run: '. "$VELNOR_EXEC" prepare'
      - name: velnor-ci check-metadata
        working-directory: lab
        run: '. "$VELNOR_EXEC" check-metadata'
      - id: sources_lab
        name: Restore the sources cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: 'velnor-src-${{ runner.os }}-${{ runner.arch }}-lab-${{ hashFiles(''lab/Cargo.lock'') }}'
          restore-keys: 'velnor-src-${{ runner.os }}-${{ runner.arch }}-lab-'
      - id: target_lab
        name: Restore the target cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: lab/target
          key: 'velnor-tgt-rust-lab.lab.${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.compat }}-${{ hashFiles(''lab/Cargo.lock'') }}-${{ github.sha }}-${{ github.run_id }}'
          restore-keys: |
            velnor-tgt-rust-lab.lab.${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.compat }}-${{ hashFiles('lab/Cargo.lock') }}-
            velnor-tgt-rust-lab.lab.${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.compat }}-
      - name: velnor-ci inputs restore
        working-directory: lab
        run: '. "$VELNOR_EXEC" inputs restore --target-dir ../lab/target'
      - id: restored
        name: velnor-ci restored
        env:
          VELNOR_BASE_MAX_AGE_DAYS: '${{ github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch) && ''7'' || ''0'' }}'
          VELNOR_CACHE_TARGETS: |
            target
            lab/target
        run: '. "$VELNOR_EXEC" restored'
      - id: replan
        name: velnor-ci plan --full
        if: '${{ steps.restored.outputs.expired == ''true'' }}'
        run: '. "$VELNOR_EXEC" plan --full'
      - name: Format
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' }}'
        working-directory: lab
        run: '. "$VELNOR_EXEC" run -- cargo-fmt --all --check'
      - name: Lint
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' }}'
        working-directory: lab
        env:
          CARGO_TARGET_DIR: '${{ github.workspace }}/lab/target'
        run: '. "$VELNOR_EXEC" run -- cargo-clippy clippy --workspace --all-targets --locked --message-format=json-render-diagnostics -- -D warnings'
      - name: Documentation
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' && (steps.replan.outputs.rust_lab_mode || needs.rust-plan.outputs.rust_lab_mode) != ''none'' && (steps.replan.outputs.rust_lab_docs || needs.rust-plan.outputs.rust_lab_docs) == ''run'' && (steps.replan.outputs.rust_lab_package_args || needs.rust-plan.outputs.rust_lab_package_args) != '''' }}'
        working-directory: lab
        env:
          CARGO_TARGET_DIR: '${{ github.workspace }}/lab/target'
        run: '. "$VELNOR_EXEC" run -- cargo doc --workspace --no-deps --locked --config ''build.rustdocflags=["-D","warnings"]'' --message-format=json-render-diagnostics'
      - name: Check lab alone
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' && (contains(format('' {0} '', (steps.replan.outputs.rust_lab_package_args || needs.rust-plan.outputs.rust_lab_package_args)), '' -p lab '') || contains(format('' {0} '', (steps.replan.outputs.rust_lab_package_args || needs.rust-plan.outputs.rust_lab_package_args)), '' --workspace '')) }}'
        working-directory: lab
        env:
          CARGO_TARGET_DIR: '${{ github.workspace }}/lab/target'
        run: '. "$VELNOR_EXEC" run -- cargo check -p lab --locked --message-format=json-render-diagnostics'
      - name: Build the tests
        if: '${{ github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch) && (github.event_name == ''push'' || github.event_name == ''schedule'' || github.event_name == ''workflow_dispatch'') }}'
        working-directory: lab
        env:
          CARGO_TARGET_DIR: '${{ github.workspace }}/lab/target'
        run: '. "$VELNOR_EXEC" run -- cargo-nextest nextest run --workspace --locked --cargo-message-format=json-render-diagnostics --ignore-default-filter --no-run'
      - id: test
        name: Test
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' }}'
        working-directory: lab
        env:
          CARGO_TARGET_DIR: '${{ github.workspace }}/lab/target'
          TEST_FILTER: '${{ steps.replan.outputs.rust_lab_test_filter || needs.rust-plan.outputs.rust_lab_test_filter }}'
