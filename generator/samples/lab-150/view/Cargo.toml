[workspace]
members = [
  "core",
  "lib",
  "app",
  "tool",
  "macros",
  "grow/*",
]
exclude = ["lab"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.0.0"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt"] }
fnv = "1"
