[workspace]
resolver = "3"
members = [
    "crates/fixture-types",
    "crates/recorder",
    "crates/mock-server",
    "crates/rpc-binding",
    "crates/proto-locator",
    "vendor/codec",
]

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rust]
unsafe_code = "forbid"
