name: Rust CI
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
  push:
    branches:
      - main
  merge_group: {}
  workflow_dispatch: {}
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: 'ci-${{ github.workflow_ref }}-${{ github.event_name == ''pull_request'' && github.event.pull_request.number || github.run_id }}'
  cancel-in-progress: '${{ github.event_name == ''pull_request'' }}'
jobs:
  # one job: .velnor/rust-ci-timings.json has no build times for this workspace
  rust-root:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install velnor-ci 0.1.79
        uses: tailrocks/velnor-new/actions/setup-velnor@1793cf84b5924e2542a03b0fb2580e7395b2f4cb  # rust-ci-v0.1.79
        with:
          version: '0.1.79'
          sha256-linux-x64: '10e3511ab3d2f211366c6fd3633474f4a74ee6750b16b52c90758c0e8321dd3e'
          sha256-linux-arm64: '56d836fd2ae8135b5306f154b3287dfe81328f7a89b0528b3b912fab6e6916a6'
          sha256-macos-arm64: '39431db3aeccf193088fa8845896c627e3da004f683d4d4699d3d697c808c607'
      - name: Install tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
        with:
          version: '2026.11.1'
          cache: false
      - name: Add Rust components
        run: rustup component add clippy rustfmt
      - name: Format
        if: '${{ !cancelled() }}'
        run: cargo-fmt --all --check
      - name: Lint
        if: '${{ !cancelled() }}'
        run: cargo-clippy clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        if: '${{ !cancelled() }}'
        run: 'cargo-nextest nextest run --workspace --locked --no-fail-fast --ignore-default-filter -E ''all()'''
      - name: Documentation
        if: '${{ !cancelled() }}'
        run: 'cargo doc --workspace --no-deps --locked --config ''build.rustdocflags=["-D","warnings"]'''
      - name: Check app alone
        if: '${{ !cancelled() }}'
        run: cargo check -p app --locked
  # one job: .velnor/rust-ci-timings.json has no build times for this workspace
  rust-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install velnor-ci 0.1.79
        uses: tailrocks/velnor-new/actions/setup-velnor@1793cf84b5924e2542a03b0fb2580e7395b2f4cb  # rust-ci-v0.1.79
        with:
          version: '0.1.79'
          sha256-linux-x64: '10e3511ab3d2f211366c6fd3633474f4a74ee6750b16b52c90758c0e8321dd3e'
          sha256-linux-arm64: '56d836fd2ae8135b5306f154b3287dfe81328f7a89b0528b3b912fab6e6916a6'
          sha256-macos-arm64: '39431db3aeccf193088fa8845896c627e3da004f683d4d4699d3d697c808c607'
      - name: Install tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
        with:
          version: '2026.11.1'
          cache: false
      - name: Add Rust components
        working-directory: tools
        run: rustup component add clippy rustfmt
      - name: Format
        if: '${{ !cancelled() }}'
        working-directory: tools
        run: cargo-fmt --all --check
      - name: Lint
        if: '${{ !cancelled() }}'
        working-directory: tools
        run: cargo-clippy clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        if: '${{ !cancelled() }}'
        working-directory: tools
        run: 'cargo-nextest nextest run --workspace --locked --no-fail-fast --ignore-default-filter -E ''all()'''
      - name: Documentation
        if: '${{ !cancelled() }}'
        working-directory: tools
        run: 'cargo doc --workspace --no-deps --locked --config ''build.rustdocflags=["-D","warnings"]'''
      - name: Check tools alone
        if: '${{ !cancelled() }}'
        working-directory: tools
        run: cargo check -p tools --locked
  required:
    name: Required
    needs:
      - rust-root
      - rust-tools
    if: '${{ !cancelled() }}'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fail when a Rust job failed or was cancelled
        if: '${{ contains(needs.*.result, ''failure'') || contains(needs.*.result, ''cancelled'') }}'
        run: exit 1
