          CARGO_LOG: '${{ vars.VELNOR_CACHE_DEBUG == ''1'' && ''cargo::compiler::fingerprint=info,cargo::core::compiler::fingerprint=info'' || '''' }}'
          TEST_FILTER: '${{ steps.replan.outputs.rust_tools_test_filter || needs.rust-plan.outputs.rust_tools_test_filter }}'
        run: 'velnor-ci run -- cargo-nextest nextest run --workspace --locked --no-fail-fast --ignore-default-filter -E "$TEST_FILTER" --no-tests=pass'
      - id: inputs_save
        name: velnor-ci inputs save
        if: '${{ !cancelled() && success() && steps.restored.outcome == ''success'' && steps.replan.outcome != ''failure'' && github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch) && (github.event_name == ''push'' || github.event_name == ''schedule'' || github.event_name == ''workflow_dispatch'') }}'
        working-directory: tools
        run: 'velnor-ci inputs save --target-dir ../tools/target --scope-cache "${RUNNER_TEMP}/velnor-input-scopes-${GITHUB_JOB}.json"'
      - id: base
        name: Decide whether to save the build directory
        if: '${{ ((steps.inputs_save.outcome == ''success'') && (!cancelled() && success() && steps.restored.outcome == ''success'' && steps.replan.outcome != ''failure'' && github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch) && (github.event_name == ''push'' || github.event_name == ''schedule'' || github.event_name == ''workflow_dispatch''))) && (steps.restored.outputs.expired != ''true'' || needs.rust-inputs-audit.result == ''success'') }}'
        env:
          VELNOR_CACHE_MANIFESTS: |
            Cargo.toml
            tools/Cargo.toml
        run: velnor-ci cache decide --target-dir tools/target
      - name: Save the target cache
        if: '${{ (!cancelled() && success() && steps.restored.outcome == ''success'' && steps.replan.outcome != ''failure'' && github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch) && (github.event_name == ''push'' || github.event_name == ''schedule'' || github.event_name == ''workflow_dispatch'') && steps.base.outputs.save == ''true'') && (steps.restored.outputs.expired != ''true'' || needs.rust-inputs-audit.result == ''success'') }}'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: tools/target
          key: 'velnor-tgt-rust-tools.tools.${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.compat }}-${{ hashFiles(''tools/Cargo.lock'') }}-${{ github.sha }}-${{ github.run_id }}'
      - id: target_key
        name: Record the target cache key
        if: '${{ (!cancelled() && success() && steps.restored.outcome == ''success'' && steps.replan.outcome != ''failure'' && github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch) && (github.event_name == ''push'' || github.event_name == ''schedule'' || github.event_name == ''workflow_dispatch'') && steps.base.outputs.save == ''true'') && (steps.restored.outputs.expired != ''true'' || needs.rust-inputs-audit.result == ''success'') }}'
        env:
          CACHE_KEY: 'velnor-tgt-rust-tools.tools.${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.compat }}-${{ hashFiles(''tools/Cargo.lock'') }}-${{ github.sha }}-${{ github.run_id }}'
        run: 'echo "key=$CACHE_KEY" >> "$GITHUB_OUTPUT"'
      - id: sources_save_tools
        name: Save the sources cache
        if: '${{ !cancelled() && success() && steps.restored.outcome == ''success'' && steps.replan.outcome != ''failure'' && github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch) && (github.event_name == ''push'' || github.event_name == ''schedule'' || github.event_name == ''workflow_dispatch'') && steps.base.outputs.sources == ''true'' && steps.sources_tools.outputs.cache-hit != ''true'' }}'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: 'velnor-src-${{ runner.os }}-${{ runner.arch }}-tools-${{ hashFiles(''tools/Cargo.lock'') }}'
      - id: sources_tools_key
        name: Record the sources cache key
        if: '${{ !cancelled() && success() && steps.restored.outcome == ''success'' && steps.replan.outcome != ''failure'' && github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch) && (github.event_name == ''push'' || github.event_name == ''schedule'' || github.event_name == ''workflow_dispatch'') && steps.base.outputs.sources == ''true'' && steps.sources_tools.outputs.cache-hit != ''true'' }}'
        env:
          CACHE_KEY: 'velnor-src-${{ runner.os }}-${{ runner.arch }}-tools-${{ hashFiles(''tools/Cargo.lock'') }}'
        run: 'echo "key=$CACHE_KEY" >> "$GITHUB_OUTPUT"'
      - name: Upload the cargo fingerprint log
        if: '${{ !cancelled() && vars.VELNOR_CACHE_DEBUG == ''1'' && steps.restored.outcome == ''success'' }}'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 'velnor-cargo-log-${{ github.job }}'
          path: '${{ runner.temp }}/velnor-run.log'
          if-no-files-found: ignore
          retention-days: 3
          overwrite: true
  rust-inputs-audit:
    needs:
      - rust-plan
    if: '${{ (github.event_name != ''pull_request'' || (startsWith(github.ref, ''refs/pull/'') && github.event.pull_request.state != ''closed'')) && ((github.event_name == ''schedule'' || github.event_name == ''workflow_dispatch'')) }}'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install velnor-ci 0.1.81
        uses: tailrocks/velnor-new/actions/setup-velnor@46f7a043952f82ef1a78d8ebb63143faca8f268c  # rust-ci-v0.1.81
        with:
          version: '0.1.81'
          sha256-linux-x64: '659a551f2dbc7cd34c745dce2a787717aa8b8214841e4b9f9fa3a6334ebe8e3c'
          sha256-linux-arm64: de279a7db363cf6943489b379e2c9360786156245ba7a3ae0fc85467ea860c2c
          sha256-macos-arm64: '21015c7f0244d7fda84e36f26945ad11a811122b183224467ba4b8ed9bf68d51'
      - id: tools
        name: Restore the tools cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.local/share/mise
            ~/.rustup
          key: 'velnor-tools-${{ runner.os }}-${{ runner.arch }}-mise2026.11.1-${{ hashFiles(''mise.lock'') }}'
      - name: Install tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
        with:
          version: '2026.11.1'
          cache: false
      - name: Add Rust components
        run: rustup component add clippy rustfmt
      - name: Save the tools cache
        if: '${{ github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch) && steps.tools.outputs.cache-hit != ''true'' }}'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.local/share/mise
            ~/.rustup
          key: 'velnor-tools-${{ runner.os }}-${{ runner.arch }}-mise2026.11.1-${{ hashFiles(''mise.lock'') }}'
      - id: prepare
        name: velnor-ci prepare
        run: velnor-ci prepare
      - name: velnor-ci check-metadata
        run: velnor-ci check-metadata
      - id: sources_root
        name: Restore the sources cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: 'velnor-src-${{ runner.os }}-${{ runner.arch }}-root-${{ hashFiles(''Cargo.lock'') }}'
          restore-keys: 'velnor-src-${{ runner.os }}-${{ runner.arch }}-root-'
      - name: Restore the target cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: 'velnor-tgt-rust-root.root.${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.compat }}-${{ hashFiles(''Cargo.lock'') }}-${{ github.sha }}-${{ github.run_id }}'
          restore-keys: |
            velnor-tgt-rust-root.root.${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.compat }}-${{ hashFiles('Cargo.lock') }}-
            velnor-tgt-rust-root.root.${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.compat }}-
      - name: velnor-ci check-metadata
        working-directory: tools
        run: velnor-ci check-metadata
      - id: sources_tools
        name: Restore the sources cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: 'velnor-src-${{ runner.os }}-${{ runner.arch }}-tools-${{ hashFiles(''tools/Cargo.lock'') }}'
          restore-keys: 'velnor-src-${{ runner.os }}-${{ runner.arch }}-tools-'
      - name: Restore the target cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: tools/target
          key: 'velnor-tgt-rust-tools.tools.${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.compat }}-${{ hashFiles(''tools/Cargo.lock'') }}-${{ github.sha }}-${{ github.run_id }}'
          restore-keys: |
            velnor-tgt-rust-tools.tools.${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.compat }}-${{ hashFiles('tools/Cargo.lock') }}-
            velnor-tgt-rust-tools.tools.${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.compat }}-
      - name: velnor-ci inputs restore
        run: 'velnor-ci inputs restore-all --root-target "${GITHUB_WORKSPACE}"/. "${GITHUB_WORKSPACE}"/target --root-target "${GITHUB_WORKSPACE}"/tools "${GITHUB_WORKSPACE}"/tools/target --scope-cache "${RUNNER_TEMP}/velnor-input-scopes-${GITHUB_JOB}.json"'
      - id: restored
        name: velnor-ci restored
        env:
          VELNOR_BASE_MAX_AGE_DAYS: '${{ github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch) && ''7'' || ''0'' }}'
        run: 'velnor-ci restored --target-dir "${GITHUB_WORKSPACE}"/target --target-dir "${GITHUB_WORKSPACE}"/tools/target'
      - id: replan
        name: velnor-ci plan --full
        if: '${{ steps.restored.outputs.expired == ''true'' }}'
        run: velnor-ci plan --full
      - name: Build every target
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' }}'
        env:
          CARGO_LOG: '${{ vars.VELNOR_CACHE_DEBUG == ''1'' && ''cargo::compiler::fingerprint=info,cargo::core::compiler::fingerprint=info'' || '''' }}'
        run: velnor-ci run -- velnor-ci inputs build -- cargo build --workspace --all-targets --locked
      - name: Build every target
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' }}'
        working-directory: tools
        env:
          CARGO_LOG: '${{ vars.VELNOR_CACHE_DEBUG == ''1'' && ''cargo::compiler::fingerprint=info,cargo::core::compiler::fingerprint=info'' || '''' }}'
        run: velnor-ci run -- velnor-ci inputs build -- cargo build --workspace --all-targets --locked
      - name: velnor-ci inputs audit
        run: velnor-ci inputs audit
      - name: Upload the cargo fingerprint log
        if: '${{ !cancelled() && vars.VELNOR_CACHE_DEBUG == ''1'' && steps.restored.outcome == ''success'' }}'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 'velnor-cargo-log-${{ github.job }}'
          path: '${{ runner.temp }}/velnor-run.log'
          if-no-files-found: ignore
          retention-days: 3
          overwrite: true
  rust-trim:
    name: Cache
    needs:
      - rust-root
      - rust-tools
    if: '${{ (github.event_name != ''pull_request'' || (startsWith(github.ref, ''refs/pull/'') && github.event.pull_request.state != ''closed'')) && (!cancelled() && github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch) && (github.event_name == ''push'' || github.event_name == ''schedule'' || github.event_name == ''workflow_dispatch'')) && (needs.rust-root.outputs.base_save == ''true'' || (needs.rust-root.outputs.sources_saved == ''true'' || needs.rust-root.outputs.sources_key != '''') || needs.rust-tools.outputs.base_save == ''true'' || (needs.rust-tools.outputs.sources_saved == ''true'' || needs.rust-tools.outputs.sources_key != '''')) }}'
    permissions:
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install velnor-ci 0.1.81
        uses: tailrocks/velnor-new/actions/setup-velnor@46f7a043952f82ef1a78d8ebb63143faca8f268c  # rust-ci-v0.1.81
        with:
          version: '0.1.81'
          sha256-linux-x64: '659a551f2dbc7cd34c745dce2a787717aa8b8214841e4b9f9fa3a6334ebe8e3c'
          sha256-linux-arm64: de279a7db363cf6943489b379e2c9360786156245ba7a3ae0fc85467ea860c2c
          sha256-macos-arm64: '21015c7f0244d7fda84e36f26945ad11a811122b183224467ba4b8ed9bf68d51'
      - name: Delete the older rust-root entries
        if: '${{ needs.rust-root.outputs.base_save == ''true'' }}'
        env:
          CACHE_PREFIX: '${{ needs.rust-root.outputs.base_prefix }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: 'velnor-ci cache trim --prefix "$CACHE_PREFIX"'
      - name: Delete the older rust-root sources entries
        if: '${{ needs.rust-root.outputs.sources_prefix != '''' }}'
        env:
          CACHE_PREFIX: '${{ needs.rust-root.outputs.sources_prefix }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: 'velnor-ci cache trim --prefix "$CACHE_PREFIX"'
      - name: Delete the older rust-tools entries
        if: '${{ needs.rust-tools.outputs.base_save == ''true'' }}'
        env:
          CACHE_PREFIX: '${{ needs.rust-tools.outputs.base_prefix }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: 'velnor-ci cache trim --prefix "$CACHE_PREFIX"'
      - name: Delete the older rust-tools sources entries
        if: '${{ needs.rust-tools.outputs.sources_prefix != '''' }}'
        env:
          CACHE_PREFIX: '${{ needs.rust-tools.outputs.sources_prefix }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: 'velnor-ci cache trim --prefix "$CACHE_PREFIX"'
      - id: verify-rust-root-target_key
        name: Verify the rust-root target cache upload
        if: '${{ needs.rust-root.outputs.target_key != '''' }}'
        continue-on-error: true
        env:
          CACHE_KEY: '${{ needs.rust-root.outputs.target_key }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: 'velnor-ci cache verify --key "$CACHE_KEY"'
      - id: verify-rust-root-sources_key
        name: Verify the rust-root sources cache upload
        if: '${{ needs.rust-root.outputs.sources_key != '''' }}'
        continue-on-error: true
        env:
          CACHE_KEY: '${{ needs.rust-root.outputs.sources_key }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: 'velnor-ci cache verify --key "$CACHE_KEY"'
      - id: verify-rust-tools-target_key
        name: Verify the rust-tools target cache upload
        if: '${{ needs.rust-tools.outputs.target_key != '''' }}'
        continue-on-error: true
        env:
          CACHE_KEY: '${{ needs.rust-tools.outputs.target_key }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: 'velnor-ci cache verify --key "$CACHE_KEY"'
      - id: verify-rust-tools-sources_key
        name: Verify the rust-tools sources cache upload
        if: '${{ needs.rust-tools.outputs.sources_key != '''' }}'
        continue-on-error: true
        env:
          CACHE_KEY: '${{ needs.rust-tools.outputs.sources_key }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: 'velnor-ci cache verify --key "$CACHE_KEY"'
      - name: Require verified cache uploads
        env:
          CACHE_OK: '${{ steps.verify-rust-root-target_key.outcome != ''failure'' && steps.verify-rust-root-sources_key.outcome != ''failure'' && steps.verify-rust-tools-target_key.outcome != ''failure'' && steps.verify-rust-tools-sources_key.outcome != ''failure'' }}'
        run: 'velnor-ci cache check --success "$CACHE_OK"'
  required:
    name: Required
    needs:
      - rust-plan
      - rust-root
      - rust-tools
      - rust-inputs-audit
    if: '${{ (github.event_name != ''pull_request'' || (startsWith(github.ref, ''refs/pull/'') && github.event.pull_request.state != ''closed'')) && (always()) }}'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install velnor-ci 0.1.81
        uses: tailrocks/velnor-new/actions/setup-velnor@46f7a043952f82ef1a78d8ebb63143faca8f268c  # rust-ci-v0.1.81
        with:
          version: '0.1.81'
          sha256-linux-x64: '659a551f2dbc7cd34c745dce2a787717aa8b8214841e4b9f9fa3a6334ebe8e3c'
          sha256-linux-arm64: de279a7db363cf6943489b379e2c9360786156245ba7a3ae0fc85467ea860c2c
          sha256-macos-arm64: '21015c7f0244d7fda84e36f26945ad11a811122b183224467ba4b8ed9bf68d51'
      - name: velnor-ci gate
        env:
          NEEDS_JSON: '${{ toJSON(needs) }}'
          GATE_SPEC: '--plan rust-plan --job rust-plan=always --job rust-root=lane:root --job rust-tools=lane:tools --job rust-inputs-audit=schedule-or-dispatch --tests rust-root=root --tests rust-tools=tools'
        run: velnor-ci gate --spec-env GATE_SPEC
