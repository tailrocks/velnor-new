        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: app-linux-x64
          path: dist
      - name: Download app-linux-arm64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: app-linux-arm64
          path: dist
      - name: Download app-macos-arm64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: app-macos-arm64
          path: dist
      - name: Download app-sums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: app-sums
          path: dist
      - name: Publish the release of app
        env:
          GITHUB_TOKEN: '${{ github.token }}'
          REPOSITORY: '${{ github.repository }}'
          TAG: '${{ needs.tag.outputs.app }}'
        run: 'velnor-ci release publish --repo="$REPOSITORY" --tag="$TAG" --app=velnor-release --dir=dist app-x86_64-unknown-linux-musl.tar.gz app-aarch64-unknown-linux-musl.tar.gz app-aarch64-apple-darwin.tar.gz'
  build-tools-linux-x64:
    needs:
      - gate
      - tag
    if: '${{ needs.gate.outputs.ready == ''true'' && github.event.workflow_run.event == ''push'' && github.event.workflow_run.conclusion == ''success'' && github.event.workflow_run.head_branch == github.event.repository.default_branch && needs.tag.outputs.tools != '''' }}'
    permissions:
      contents: read
    cache-mode: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - id: source
        name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 'refs/tags/${{ needs.tag.outputs.tools }}'
          fetch-depth: 1
          persist-credentials: false
      - name: Check that the tag is on the verified commit itself
        env:
          COMMIT: '${{ needs.tag.outputs.tools_commit }}'
          CHECKED_OUT: '${{ steps.source.outputs.commit }}'
        run: 'test -n "$COMMIT" -a "$CHECKED_OUT" = "$COMMIT"'
      - name: Install the musl C compiler
        run: sudo apt-get install --yes musl-tools
      - name: Install tools
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d
        with:
          version: '2026.11.10'
          cache: false
      - name: Add the x86_64-unknown-linux-musl target
        run: rustup target add x86_64-unknown-linux-musl
      - name: Build tools for linux-x64
        env:
          TARGET_CC: musl-gcc
          VELNOR_COMMIT: '${{ github.sha }}'
        run: cargo build --release --locked --manifest-path Cargo.toml --package tools --bin tools --target x86_64-unknown-linux-musl --target-dir target
      - name: Pack tools-x86_64-unknown-linux-musl.tar.gz
        run: 'tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -czf tools-x86_64-unknown-linux-musl.tar.gz -C target/x86_64-unknown-linux-musl/release tools'
      - name: Upload tools-linux-x64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: tools-linux-x64
          path: tools-x86_64-unknown-linux-musl.tar.gz
          if-no-files-found: error
          retention-days: 1
  build-tools-macos-arm64:
    needs:
      - gate
      - tag
    if: '${{ needs.gate.outputs.ready == ''true'' && github.event.workflow_run.event == ''push'' && github.event.workflow_run.conclusion == ''success'' && github.event.workflow_run.head_branch == github.event.repository.default_branch && needs.tag.outputs.tools != '''' }}'
    permissions:
      contents: read
    cache-mode: read
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - id: source
        name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 'refs/tags/${{ needs.tag.outputs.tools }}'
          fetch-depth: 1
          persist-credentials: false
      - name: Check that the tag is on the verified commit itself
        env:
          COMMIT: '${{ needs.tag.outputs.tools_commit }}'
          CHECKED_OUT: '${{ steps.source.outputs.commit }}'
        run: 'test -n "$COMMIT" -a "$CHECKED_OUT" = "$COMMIT"'
      - name: Install tools
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d
        with:
          version: '2026.11.10'
          cache: false
      - name: Add the aarch64-apple-darwin target
        run: rustup target add aarch64-apple-darwin
      - name: Build tools for macos-arm64
        env:
          VELNOR_COMMIT: '${{ github.sha }}'
        run: cargo build --release --locked --manifest-path Cargo.toml --package tools --bin tools --target aarch64-apple-darwin --target-dir target
      - name: Stage tools-aarch64-apple-darwin.tar.gz
        run: 'mkdir -p "$RUNNER_TEMP/pack"'
      - name: Copy tools-aarch64-apple-darwin.tar.gz members
        run: 'cp -p target/aarch64-apple-darwin/release/tools "$RUNNER_TEMP/pack/"'
      - name: Normalise tools-aarch64-apple-darwin.tar.gz mtimes
        run: 'TZ=UTC touch -h -t 197001010000 "$RUNNER_TEMP/pack/tools"'
      - name: Pack tools-aarch64-apple-darwin.tar.gz
        run: 'COPYFILE_DISABLE=1 tar -cf "$RUNNER_TEMP/pack.tar" -n --uid 0 --gid 0 --uname '''' --gname '''' --no-xattrs --no-mac-metadata -C "$RUNNER_TEMP/pack" tools'
      - name: Compress tools-aarch64-apple-darwin.tar.gz
        run: 'gzip -n -c "$RUNNER_TEMP/pack.tar" > tools-aarch64-apple-darwin.tar.gz'
      - name: Upload tools-macos-arm64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: tools-macos-arm64
          path: tools-aarch64-apple-darwin.tar.gz
          if-no-files-found: error
          retention-days: 1
  sums-tools:
    needs:
      - gate
      - tag
      - build-tools-linux-x64
      - build-tools-macos-arm64
    if: '${{ needs.gate.outputs.ready == ''true'' && github.event.workflow_run.event == ''push'' && github.event.workflow_run.conclusion == ''success'' && github.event.workflow_run.head_branch == github.event.repository.default_branch && needs.tag.outputs.tools != '''' }}'
    permissions: {}
    cache-mode: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download tools-linux-x64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: tools-linux-x64
          path: dist
      - name: Download tools-macos-arm64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: tools-macos-arm64
          path: dist
      - name: Write SHA256SUMS
        if: '${{ runner.os != ''macOS'' }}'
        working-directory: dist
        run: 'sha256sum tools-x86_64-unknown-linux-musl.tar.gz tools-aarch64-apple-darwin.tar.gz > SHA256SUMS'
      - name: Write SHA256SUMS
        if: '${{ runner.os == ''macOS'' }}'
        working-directory: dist
        run: 'shasum -a 256 tools-x86_64-unknown-linux-musl.tar.gz tools-aarch64-apple-darwin.tar.gz > SHA256SUMS'
      - name: Upload tools-sums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: tools-sums
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
  publish-tools:
    needs:
      - gate
      - tag
      - sums-tools
    if: '${{ needs.gate.outputs.ready == ''true'' && github.event.workflow_run.event == ''push'' && github.event.workflow_run.conclusion == ''success'' && github.event.workflow_run.head_branch == github.event.repository.default_branch && needs.tag.outputs.tools != '''' }}'
    permissions:
