# Generated by velnor-gen. Change release-plz.toml or .velnor/release.toml and run `velnor-gen generate`.
name: Release
on:
  # jactionlint ignore=dangerous-triggers
  workflow_run:
    workflows:
      - CI
      - Qualification
    types:
      - completed
    branches:
      - main
permissions: {}
concurrency:
  group: 'release-${{ github.event.workflow_run.head_sha }}'
  cancel-in-progress: false
jobs:
  gate:
    if: '${{ github.event.workflow_run.event == ''push'' && github.event.workflow_run.conclusion == ''success'' }}'
    permissions:
      actions: read
      contents: read
      statuses: read
    outputs:
      ready: '${{ steps.gate.outputs.ready }}'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install velnor-ci 0.1.79
        uses: tailrocks/velnor-new/actions/setup-velnor@1793cf84b5924e2542a03b0fb2580e7395b2f4cb  # rust-ci-v0.1.79
        with:
          version: '0.1.79'
          sha256-linux-x64: '10e3511ab3d2f211366c6fd3633474f4a74ee6750b16b52c90758c0e8321dd3e'
          sha256-linux-arm64: '56d836fd2ae8135b5306f154b3287dfe81328f7a89b0528b3b912fab6e6916a6'
          sha256-macos-arm64: '39431db3aeccf193088fa8845896c627e3da004f683d4d4699d3d697c808c607'
      - id: gate
        name: Check that every required check passed on the commit
        env:
          GITHUB_TOKEN: '${{ github.token }}'
          REPOSITORY: '${{ github.repository }}'
          COMMIT: '${{ github.event.workflow_run.head_sha }}'
        run: 'velnor-ci release-gate --repo "$REPOSITORY" --sha "$COMMIT"'
  release-pr:
    needs:
      - gate
    if: '${{ needs.gate.outputs.ready == ''true'' && github.event.workflow_run.event == ''push'' && github.event.workflow_run.conclusion == ''success'' }}'
    environment: release
    permissions:
      contents: read
    concurrency:
      group: release-pr
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: '${{ github.sha }}'
          fetch-depth: 0
          persist-credentials: false
      - name: Install release-plz
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
        with:
          version: '2026.11.1'
          install_args: release-plz
          cache: false
      - id: app
        name: Create the release App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: '${{ secrets.RELEASE_APP_ID }}'
          private-key: '${{ secrets.RELEASE_APP_PRIVATE_KEY }}'
          owner: '${{ github.repository_owner }}'
          repositories: '${{ github.event.repository.name }}'
          permission-contents: write
          permission-pull-requests: write
      - name: Open the release pull request of the repository root
        env:
          GITHUB_TOKEN: '${{ steps.app.outputs.token }}'
        run: 'release-plz release-pr --forge github --git-token "$GITHUB_TOKEN" --manifest-path Cargo.toml --config release-plz.toml'
      - name: Open the release pull request of tools
        env:
          GITHUB_TOKEN: '${{ steps.app.outputs.token }}'
        run: 'release-plz release-pr --forge github --git-token "$GITHUB_TOKEN" --manifest-path tools/Cargo.toml --config tools/release-plz.toml'
  tag:
    needs:
      - gate
    if: '${{ needs.gate.outputs.ready == ''true'' && github.event.workflow_run.event == ''push'' && github.event.workflow_run.conclusion == ''success'' }}'
    environment: release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: '${{ github.event.workflow_run.head_sha }}'
          fetch-depth: 0
          persist-credentials: false
      - name: Install release-plz
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
        with:
          version: '2026.11.1'
          install_args: release-plz
          cache: false
      - name: Install velnor-ci 0.1.79
        uses: tailrocks/velnor-new/actions/setup-velnor@1793cf84b5924e2542a03b0fb2580e7395b2f4cb  # rust-ci-v0.1.79
        with:
          version: '0.1.79'
          sha256-linux-x64: '10e3511ab3d2f211366c6fd3633474f4a74ee6750b16b52c90758c0e8321dd3e'
          sha256-linux-arm64: '56d836fd2ae8135b5306f154b3287dfe81328f7a89b0528b3b912fab6e6916a6'
          sha256-macos-arm64: '39431db3aeccf193088fa8845896c627e3da004f683d4d4699d3d697c808c607'
      - id: app
        name: Create the release App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: '${{ secrets.RELEASE_APP_ID }}'
          private-key: '${{ secrets.RELEASE_APP_PRIVATE_KEY }}'
          owner: '${{ github.repository_owner }}'
          repositories: '${{ github.event.repository.name }}'
          permission-contents: write
          permission-pull-requests: read
      - name: Tag the releases of the repository root
        env:
          GITHUB_TOKEN: '${{ steps.app.outputs.token }}'
        run: 'release-plz release --forge github --git-token "$GITHUB_TOKEN" --manifest-path Cargo.toml --config release-plz.toml -o json > "$RUNNER_TEMP/release-0.json"'
      - name: Tag the releases of tools
        env:
          GITHUB_TOKEN: '${{ steps.app.outputs.token }}'
        run: 'release-plz release --forge github --git-token "$GITHUB_TOKEN" --manifest-path tools/Cargo.toml --config tools/release-plz.toml -o json > "$RUNNER_TEMP/release-1.json"'
      - id: record
        name: Record the released packages
        run: 'velnor-ci release record "$RUNNER_TEMP/release-0.json" "$RUNNER_TEMP/release-1.json"'
