        run: 'shasum -a 256 app-linux-x64 app-linux-x64.sha256 app-linux-x64.provenance.json app-linux-arm64 app-linux-arm64.sha256 app-linux-arm64.provenance.json app-macos-arm64 app-macos-arm64.sha256 app-macos-arm64.provenance.json > SHA256SUMS'
      - name: Upload app-sums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: app-sums
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
  publish-app:
    needs:
      - gate
      - tag
      - sums-app
    if: '${{ needs.gate.outputs.ready == ''true'' && github.event.workflow_run.event == ''push'' && github.event.workflow_run.conclusion == ''success'' && github.event.workflow_run.head_branch == github.event.repository.default_branch && needs.tag.outputs.app != '''' }}'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install velnor-ci 0.1.81
        uses: tailrocks/velnor-new/actions/setup-velnor@46f7a043952f82ef1a78d8ebb63143faca8f268c  # rust-ci-v0.1.81
        with:
          version: '0.1.81'
          sha256-linux-x64: '659a551f2dbc7cd34c745dce2a787717aa8b8214841e4b9f9fa3a6334ebe8e3c'
          sha256-linux-arm64: de279a7db363cf6943489b379e2c9360786156245ba7a3ae0fc85467ea860c2c
          sha256-macos-arm64: '21015c7f0244d7fda84e36f26945ad11a811122b183224467ba4b8ed9bf68d51'
      - name: Download app-linux-x64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: app-linux-x64
          path: dist
      - name: Download app-linux-arm64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: app-linux-arm64
          path: dist
      - name: Download app-macos-arm64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: app-macos-arm64
          path: dist
      - name: Download app-sums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: app-sums
          path: dist
      - name: Publish the release of app
        env:
          GITHUB_TOKEN: '${{ github.token }}'
          REPOSITORY: '${{ github.repository }}'
          TAG: '${{ needs.tag.outputs.app }}'
        run: 'velnor-ci release publish --repo="$REPOSITORY" --tag="$TAG" --app=velnor-release --dir=dist app-linux-x64 app-linux-x64.sha256 app-linux-x64.provenance.json app-linux-arm64 app-linux-arm64.sha256 app-linux-arm64.provenance.json app-macos-arm64 app-macos-arm64.sha256 app-macos-arm64.provenance.json'
