  publish-family:
    needs:
      - gate
      - family
      - verify-family
    if: '${{ needs.gate.outputs.ready == ''true'' && github.ref_type == ''tag'' && needs.family.outputs.build == ''true'' }}'
    permissions:
      contents: write
    cache-mode: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install velnor-ci 0.1.98
        uses: tailrocks/velnor-new/actions/setup-velnor@a87c35aed5b68dd3e82b36df3e8d7364311abba8  # tools-v0.1.98
        with:
          version: '0.1.98'
          sha256-linux-x64: '659a551f2dbc7cd34c745dce2a787717aa8b8214841e4b9f9fa3a6334ebe8e3c'
          sha256-linux-arm64: de279a7db363cf6943489b379e2c9360786156245ba7a3ae0fc85467ea860c2c
          sha256-macos-arm64: '21015c7f0244d7fda84e36f26945ad11a811122b183224467ba4b8ed9bf68d51'
      - name: Download app-linux-x64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: app-linux-x64
          path: dist
      - name: Download app-linux-arm64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: app-linux-arm64
          path: dist
      - name: Download tools-linux-x64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: tools-linux-x64
          path: dist
      - name: Download tools-linux-arm64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: tools-linux-arm64
          path: dist
      - name: Download family-sums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: family-sums
          path: dist
      - name: Publish the family release
        env:
          GITHUB_TOKEN: '${{ github.token }}'
          REPOSITORY: '${{ github.repository }}'
          TAG: '${{ needs.family.outputs.tag }}'
        run: 'velnor-ci release publish --repo="$REPOSITORY" --tag="$TAG" --app=velnor-release --dir=dist app-x86_64-unknown-linux-musl.tar.gz app-aarch64-unknown-linux-musl.tar.gz tools-x86_64-unknown-linux-musl.tar.gz tools-aarch64-unknown-linux-musl.tar.gz COMMIT BINARY-SHA256SUMS'
