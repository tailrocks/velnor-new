runner = "ubuntu-26.04-scale-set"
hosted = false
fork_runner = "ubuntu-latest"

[[image]]
name = "multi-bin-svc"
bins = ["legacy-server", "legacy-migration"]
root = "backend-rust"
features = ["tls"]
dockerfile = "docker/Dockerfile"
context = "."
glibc = "2.36"
openssl = "sysroot"
pr_build = "inputs"
publish_runner = "ubuntu-26.04-scale-set-publish"

[[image.registry]]
host = "docker.io"
repository = "acme/multi-bin-svc"
username = "secrets.DOCKERHUB_USERNAME"
token = "secrets.DOCKERHUB_TOKEN"

[[image]]
name = "migrate-job"
bins = ["legacy-migration"]
root = "backend-rust"
features = ["tls"]
dockerfile = "docker/Dockerfile.migrate"
stage = "dist-migrate"
glibc = "2.36"
openssl = "sysroot"
pr_build = "inputs"
publish_runner = "ubuntu-26.04-scale-set-publish"

[[image.registry]]
host = "docker.io"
repository = "acme/migrate-job"
username = "secrets.DOCKERHUB_USERNAME"
token = "secrets.DOCKERHUB_TOKEN"
