  rust-trim:
    name: Cache maintenance
    needs:
      - rust
    if: '${{ (github.event_name != ''pull_request'' || (startsWith(github.ref, ''refs/pull/'') && github.event.pull_request.state != ''closed'')) && (!cancelled() && github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch) && (github.event_name == ''push'' || github.event_name == ''schedule'' || github.event_name == ''workflow_dispatch'')) }}'
    permissions:
      pull-requests: read
      actions: write
    cache-mode: read
    runs-on: '${{ (!startsWith(github.event_name, ''pull_request'') || github.event.pull_request.head.repo.full_name == github.repository) && ''ubuntu-26.04-scale-set'' || ''ubuntu-latest'' }}'
    timeout-minutes: 30
    steps:
      - name: Resolve released helper tools
        env:
          VELNOR_HELPER_INSTALL_TOOLS: *velnor_0
        run: 'eval "$VELNOR_HELPER_INSTALL_TOOLS"'
      - name: Install velnor-ci 0.1.116
        uses: tailrocks/velnor-new/actions/setup-velnor@a87c35aed5b68dd3e82b36df3e8d7364311abba8  # tools-v0.1.116
        with:
          version: '0.1.116'
          sha256-linux-x64: '659a551f2dbc7cd34c745dce2a787717aa8b8214841e4b9f9fa3a6334ebe8e3c'
          sha256-linux-arm64: de279a7db363cf6943489b379e2c9360786156245ba7a3ae0fc85467ea860c2c
          sha256-macos-arm64: '21015c7f0244d7fda84e36f26945ad11a811122b183224467ba4b8ed9bf68d51'
      - name: Install the released helper launcher
        env:
          VELNOR_HELPER_INSTALL_LAUNCHER: *velnor_1
          VELNOR_HELPER_LAUNCHER: *velnor_2
          VELNOR_HELPER_SHA256: *velnor_3
        run: 'eval "$VELNOR_HELPER_INSTALL_LAUNCHER"'
      # jactionlint ignore=shellcheck
      - name: Delete the older rust entries
        if: '${{ needs.rust.outputs.base_save == ''true'' }}'
        env:
          CACHE_PREFIX: '${{ needs.rust.outputs.base_prefix }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache trim --prefix "$CACHE_PREFIX"'
      # jactionlint ignore=shellcheck
      - name: Delete the older rust sources entries
        if: '${{ needs.rust.outputs.sources_prefix != '''' && (needs.rust.outputs.sources_saved == ''true'' || needs.rust.outputs.sources_key != '''') }}'
        env:
          CACHE_PREFIX: '${{ needs.rust.outputs.sources_prefix }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache trim --prefix "$CACHE_PREFIX"'
      # jactionlint ignore=shellcheck
      - id: verify-rust-target_key
        name: Verify the rust target cache upload
        if: '${{ needs.rust.outputs.target_key != '''' }}'
        continue-on-error: true
        env:
          CACHE_KEY: '${{ needs.rust.outputs.target_key }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache verify --key "$CACHE_KEY"'
      # jactionlint ignore=shellcheck
      - id: verify-rust-sources_key
        name: Verify the rust sources cache upload
        if: '${{ needs.rust.outputs.sources_key != '''' }}'
        continue-on-error: true
        env:
          CACHE_KEY: '${{ needs.rust.outputs.sources_key }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache verify --key "$CACHE_KEY"'
      # jactionlint ignore=shellcheck
      - name: Require verified cache uploads
        env:
          CACHE_OK: '${{ steps.verify-rust-target_key.outcome != ''failure'' && steps.verify-rust-sources_key.outcome != ''failure'' }}'
        run: '. "$VELNOR_EXEC" cache check --success "$CACHE_OK"'
      # jactionlint ignore=shellcheck
      - name: Enforce the repository cache budget
        env:
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache budget --budget-bytes 8000000000'
      # jactionlint ignore=shellcheck
      - name: Delete the private-base caches unless the repository is private
        if: '${{ !cancelled() }}'
        env:
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache purge-private --if-public'
