        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 'ci-metrics-${{ github.job }}'
          path: '${{ runner.temp }}/ci-metrics.json'
          if-no-files-found: error
          retention-days: 3
          overwrite: true
  rust-trim:
    name: Cache maintenance
    needs:
      - rust
      - policy
    if: '${{ (github.event_name != ''pull_request'' || (startsWith(github.ref, ''refs/pull/'') && github.event.pull_request.state != ''closed'')) && (!cancelled() && github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch) && (github.event_name == ''push'' || github.event_name == ''schedule'' || github.event_name == ''workflow_dispatch'')) }}'
    permissions:
      pull-requests: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve released helper tools
        env:
          VELNOR_HELPER_INSTALL_TOOLS: *velnor_0
        run: 'eval "$VELNOR_HELPER_INSTALL_TOOLS"'
      - name: Install velnor-ci 0.1.81
        uses: tailrocks/velnor-new/actions/setup-velnor@a87c35aed5b68dd3e82b36df3e8d7364311abba8  # rust-ci-v0.1.81
        with:
          version: '0.1.81'
          sha256-linux-x64: '10e3511ab3d2f211366c6fd3633474f4a74ee6750b16b52c90758c0e8321dd3e'
          sha256-linux-arm64: '56d836fd2ae8135b5306f154b3287dfe81328f7a89b0528b3b912fab6e6916a6'
          sha256-macos-arm64: '39431db3aeccf193088fa8845896c627e3da004f683d4d4699d3d697c808c607'
      - name: Install the released helper launcher
        env:
          VELNOR_HELPER_INSTALL_LAUNCHER: *velnor_1
          VELNOR_HELPER_LAUNCHER: *velnor_2
          VELNOR_HELPER_SHA256: *velnor_3
        run: 'eval "$VELNOR_HELPER_INSTALL_LAUNCHER"'
      - name: Delete the older rust entries
        if: '${{ needs.rust.outputs.base_save == ''true'' }}'
        env:
          CACHE_PREFIX: '${{ needs.rust.outputs.base_prefix }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache trim --prefix "$CACHE_PREFIX"'
      - name: Delete the older rust sources entries
        if: '${{ needs.rust.outputs.sources_prefix != '''' && (needs.rust.outputs.sources_saved == ''true'' || needs.rust.outputs.sources_key != '''') }}'
        env:
          CACHE_PREFIX: '${{ needs.rust.outputs.sources_prefix }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache trim --prefix "$CACHE_PREFIX"'
      - id: verify-rust-target_key
        name: Verify the rust target cache upload
        if: '${{ needs.rust.outputs.target_key != '''' }}'
        continue-on-error: true
        env:
          CACHE_KEY: '${{ needs.rust.outputs.target_key }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache verify --key "$CACHE_KEY"'
      - id: verify-rust-sources_key
        name: Verify the rust sources cache upload
        if: '${{ needs.rust.outputs.sources_key != '''' }}'
        continue-on-error: true
        env:
          CACHE_KEY: '${{ needs.rust.outputs.sources_key }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache verify --key "$CACHE_KEY"'
      - name: Require verified cache uploads
        env:
          CACHE_OK: '${{ steps.verify-rust-target_key.outcome != ''failure'' && steps.verify-rust-sources_key.outcome != ''failure'' }}'
        run: '. "$VELNOR_EXEC" cache check --success "$CACHE_OK"'
      - name: Enforce the repository cache budget
        env:
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache budget --budget-bytes 8000000000'
  required:
    name: Required
    needs:
      - rust
      - policy
    if: '${{ (github.event_name != ''pull_request'' || (startsWith(github.ref, ''refs/pull/'') && github.event.pull_request.state != ''closed'')) && (always()) }}'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve released helper tools
        env:
          VELNOR_HELPER_INSTALL_TOOLS: *velnor_0
        run: 'eval "$VELNOR_HELPER_INSTALL_TOOLS"'
      - name: Install velnor-ci 0.1.81
        uses: tailrocks/velnor-new/actions/setup-velnor@a87c35aed5b68dd3e82b36df3e8d7364311abba8  # rust-ci-v0.1.81
        with:
          version: '0.1.81'
          sha256-linux-x64: '10e3511ab3d2f211366c6fd3633474f4a74ee6750b16b52c90758c0e8321dd3e'
          sha256-linux-arm64: '56d836fd2ae8135b5306f154b3287dfe81328f7a89b0528b3b912fab6e6916a6'
          sha256-macos-arm64: '39431db3aeccf193088fa8845896c627e3da004f683d4d4699d3d697c808c607'
      - name: Install the released helper launcher
        env:
          VELNOR_HELPER_INSTALL_LAUNCHER: *velnor_1
          VELNOR_HELPER_LAUNCHER: *velnor_2
          VELNOR_HELPER_SHA256: *velnor_3
        run: 'eval "$VELNOR_HELPER_INSTALL_LAUNCHER"'
      - name: velnor-ci gate
        env:
          NEEDS_JSON: '${{ toJSON(needs) }}'
          GATE_SPEC: '--plan rust --job rust=always --job policy=always --tests rust=root'
        run: '. "$VELNOR_EXEC" gate --spec-env GATE_SPEC'
  cache:
    name: Cache
    needs:
      - rust
      - policy
      - rust-trim
    if: '${{ (github.event_name != ''pull_request'' || (startsWith(github.ref, ''refs/pull/'') && github.event.pull_request.state != ''closed'')) && (!cancelled()) }}'
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve released helper tools
        env:
          VELNOR_HELPER_INSTALL_TOOLS: *velnor_0
        run: 'eval "$VELNOR_HELPER_INSTALL_TOOLS"'
      - name: Install velnor-ci 0.1.81
        uses: tailrocks/velnor-new/actions/setup-velnor@a87c35aed5b68dd3e82b36df3e8d7364311abba8  # rust-ci-v0.1.81
        with:
          version: '0.1.81'
          sha256-linux-x64: '10e3511ab3d2f211366c6fd3633474f4a74ee6750b16b52c90758c0e8321dd3e'
          sha256-linux-arm64: '56d836fd2ae8135b5306f154b3287dfe81328f7a89b0528b3b912fab6e6916a6'
          sha256-macos-arm64: '39431db3aeccf193088fa8845896c627e3da004f683d4d4699d3d697c808c607'
      - name: Install the released helper launcher
        env:
          VELNOR_HELPER_INSTALL_LAUNCHER: *velnor_1
          VELNOR_HELPER_LAUNCHER: *velnor_2
          VELNOR_HELPER_SHA256: *velnor_3
        run: 'eval "$VELNOR_HELPER_INSTALL_LAUNCHER"'
      - name: Download cache metrics
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: 'ci-metrics-*'
          path: '${{ runner.temp }}/ci-metrics'
      - name: Check cache waste
        env:
          VELNOR_REPORT_NEEDS: '${{ toJSON(needs) }}'
          GITHUB_TOKEN: '${{ (github.event_name != ''pull_request'' || github.event.pull_request.head.repo.full_name == github.repository) && github.token || '''' }}'
          VELNOR_REPORT_DEFAULT_BRANCH: '${{ github.event.repository.default_branch }}'
        run: '. "$VELNOR_EXEC" report --check "$RUNNER_TEMP/ci-metrics"'
