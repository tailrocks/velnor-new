  publish-family:
    needs:
      - gate
      - family
      - verify-family
    if: '${{ needs.gate.outputs.ready == ''true'' && github.ref_type == ''tag'' && needs.family.outputs.build == ''true'' }}'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install velnor-ci 0.1.100
        uses: tailrocks/velnor-new/actions/setup-velnor@d0106675ece265d1675e681841f93f11adb5b52d  # tools-v0.1.100
        with:
          version: '0.1.100'
          sha256-linux-x64: '33eda2bcb4d3a093fbf955291d75776dd3fe319c00f48884a45cfda4576ad010'
          sha256-linux-arm64: '962f18c2a0b6c96e0ce841ce276b2eb5d7efe34dc0203b987bf8659586dbacb8'
      - name: Download velnor-ci-linux-x64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: velnor-ci-linux-x64
          path: dist
      - name: Download velnor-ci-linux-arm64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: velnor-ci-linux-arm64
          path: dist
      - name: Download velnor-gen-linux-x64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: velnor-gen-linux-x64
          path: dist
      - name: Download velnor-gen-linux-arm64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: velnor-gen-linux-arm64
          path: dist
      - name: Download family-sums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: family-sums
          path: dist
      - name: Publish the family release
        env:
          GITHUB_TOKEN: '${{ github.token }}'
          REPOSITORY: '${{ github.repository }}'
          TAG: '${{ needs.family.outputs.tag }}'
        run: 'velnor-ci release publish --repo="$REPOSITORY" --tag="$TAG" --app=velnor-release --dir=dist velnor-ci-x86_64-unknown-linux-musl.tar.gz velnor-ci-aarch64-unknown-linux-musl.tar.gz velnor-gen-x86_64-unknown-linux-musl.tar.gz velnor-gen-aarch64-unknown-linux-musl.tar.gz COMMIT BINARY-SHA256SUMS'
