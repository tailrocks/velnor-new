# Hand-maintained. Rust CI, Alint, Jactionlint, Cargo Deny and Cargo Machete are generated into
# rust-ci.yml (velnor-gen, .velnor/rust-ci.toml). What stays here: the workflow_dispatch contract
# inputs (the qualification code addresses this workflow path) and the helper-gates check.
name: CI
"on":
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      campaign:
        type: string
        required: true
      phase:
        type: choice
        required: true
        options:
          - cold
          - control
          - third
          - useful_delta
          - warm
      predecessor_run_attempt:
        type: string
        required: false
      predecessor_run_id:
        type: string
        required: false
  merge_group:
permissions:
  contents: read
cache-mode: read
env:
  ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
  ACTIONS_ID_TOKEN_REQUEST_URL: ""
  ACTIONS_RUNTIME_TOKEN: ""
  CARGO_REGISTRY_TOKEN: ""
  GH_CONFIG_DIR: ""
  GH_HOST: ""
  GH_TOKEN: ""
  GITHUB_TOKEN: ""
  MISE_AUTO_INSTALL: "false"
  MISE_EXEC_AUTO_INSTALL: "false"
  MISE_GITHUB_TOKEN: ""
  MISE_LOCKFILE: "0"
  MISE_NO_CONFIG: "1"
  MISE_NO_ENV: "1"
  MISE_NO_HOOKS: "1"
  MISE_QUIET: "1"
  NODE_AUTH_TOKEN: ""
  NPM_TOKEN: ""
concurrency:
  group: velnor-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  helper-gates:
    name: Helper gates
    runs-on: [velnor, ubuntu-26.04-scale-set]
    timeout-minutes: 5
    defaults:
      run:
        shell: bash -e {0}
    env:
      VELNOR_RUN_KEY_ATTEMPT: ${{ github.run_attempt }}
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "0"
          persist-credentials: "false"
      - name: Fetch release tags
        run: git fetch --force --tags --quiet origin
      - name: Self-test the gate check
        run: |
          fixtures=scripts/fixtures
          if bash scripts/check-helper-gates.sh --diff "$fixtures/gate-bad.diff" --current 0.1.100; then
            echo "the check accepted a gate that is already released" >&2
            exit 1
          fi
          if bash scripts/check-helper-gates.sh --diff "$fixtures/gate-correction-unmarked.diff" --current 0.1.100; then
            echo "the check accepted an unmarked correction of a released gate" >&2
            exit 1
          fi
          if bash scripts/check-helper-gates.sh --diff "$fixtures/gate-correction-wrong-tag.diff" --current 0.1.100; then
            echo "the check accepted a correction marker that names the wrong tag" >&2
            exit 1
          fi
          if bash scripts/check-helper-gates.sh --diff "$fixtures/gate-correction-previous.diff" --current 0.1.100; then
            echo "the check accepted a correction whose commit already shipped in the previous release" >&2
            exit 1
          fi
          bash scripts/check-helper-gates.sh --diff "$fixtures/gate-good.diff" --current 0.1.100
          bash scripts/check-helper-gates.sh --diff "$fixtures/gate-correction-good.diff" --current 0.1.100
      - name: Check the added gates against the base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/check-helper-gates.sh "origin/$BASE_REF"
