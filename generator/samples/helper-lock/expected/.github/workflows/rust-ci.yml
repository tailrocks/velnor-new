          restore-keys: |
            velnor-tgt-rust.root.${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.compat }}-${{ hashFiles('Cargo.lock') }}-
            velnor-tgt-rust.root.${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.compat }}-
      - id: restored
        name: velnor-ci restored
        if: '${{ steps.plan.outcome == ''success'' && steps.plan.outputs.rust_root_mode != ''none'' }}'
        run: '. "$VELNOR_EXEC" restored'
      - name: Format
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' && steps.plan.outcome == ''success'' && steps.plan.outputs.rust_root_mode != ''none'' }}'
        run: '. "$VELNOR_EXEC" run -- cargo-fmt --all --check'
      - name: Lint
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' && steps.plan.outcome == ''success'' && steps.plan.outputs.rust_root_mode != ''none'' }}'
        env:
          CARGO_TARGET_DIR: '${{ github.workspace }}/target'
        run: '. "$VELNOR_EXEC" run -- cargo-clippy clippy --workspace --all-targets --locked -- -D warnings'
