# Generated by velnor-gen. Change .velnor/rust-ci.toml and run `velnor-gen generate`.
name: Rust CI
on:
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: '${{ github.workflow_ref }}'
  cancel-in-progress: true
jobs:
  # one job: .velnor/rust-ci-timings.json has no build times for this workspace
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch velnor-ci 0.1.79
        env:
          # jactionlint ignore=obfuscation
          SHA: '${{ fromJSON(''{"Linux-X64":"10e3511ab3d2f211366c6fd3633474f4a74ee6750b16b52c90758c0e8321dd3e","Linux-ARM64":"56d836fd2ae8135b5306f154b3287dfe81328f7a89b0528b3b912fab6e6916a6","macOS-ARM64":"39431db3aeccf193088fa8845896c627e3da004f683d4d4699d3d697c808c607"}'')[format(''{0}-{1}'', runner.os, runner.arch)] }}'
          # jactionlint ignore=obfuscation
          URL: '${{ fromJSON(''{"Linux-X64":"https://github.com/tailrocks/velnor-new/releases/download/rust-ci-v0.1.79/velnor-ci-linux-x64","Linux-ARM64":"https://github.com/tailrocks/velnor-new/releases/download/rust-ci-v0.1.79/velnor-ci-linux-arm64","macOS-ARM64":"https://github.com/tailrocks/velnor-new/releases/download/rust-ci-v0.1.79/velnor-ci-macos-arm64"}'')[format(''{0}-{1}'', runner.os, runner.arch)] }}'
        run: |
          curl -fsSL --create-dirs -o "$RUNNER_TEMP/vbin/velnor-ci" "$URL"
          echo "$SHA  $RUNNER_TEMP/vbin/velnor-ci" > "$RUNNER_TEMP/velnor-ci.sha"
          shasum -a 256 -c "$RUNNER_TEMP/velnor-ci.sha"
          chmod +x "$RUNNER_TEMP/vbin/velnor-ci"
          echo "$RUNNER_TEMP/vbin" >> "$GITHUB_PATH"
      - name: Install tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
        with:
          version: '2026.11.1'
          cache: false
          install_args: 'rust aqua:nextest-rs/nextest/cargo-nextest'
      - name: Add rustfmt and clippy
        run: rustup component add rustfmt clippy
      - name: Format
        if: '${{ !cancelled() }}'
        run: cargo-fmt --all --check
      - name: Lint
        if: '${{ !cancelled() }}'
        run: cargo-clippy clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        if: '${{ !cancelled() }}'
        run: 'cargo-nextest nextest run --workspace --locked --no-fail-fast --no-tests=pass -E ''all()'''
      - name: Doctests
        if: '${{ !cancelled() }}'
        run: cargo test --doc --workspace --locked
      - name: Documentation
        if: '${{ !cancelled() }}'
        run: 'cargo doc --workspace --no-deps --locked --config ''build.rustdocflags=["-D","warnings"]'''
      - name: Check helper-sample alone
        if: '${{ !cancelled() }}'
        run: cargo check -p helper-sample --locked
  required:
    name: Required
    needs:
      - rust
    if: '${{ !cancelled() }}'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fail when a Rust job failed or was cancelled
        if: '${{ contains(needs.*.result, ''failure'') || contains(needs.*.result, ''cancelled'') }}'
        run: exit 1
