        run: |
          curl -fsSL --create-dirs -o "$RUNNER_TEMP/vbin/velnor-ci" "$URL"
          echo "$SHA  $RUNNER_TEMP/vbin/velnor-ci" > "$RUNNER_TEMP/velnor-ci.sha"
          shasum -a 256 -c "$RUNNER_TEMP/velnor-ci.sha"
          chmod +x "$RUNNER_TEMP/vbin/velnor-ci"
          echo "$RUNNER_TEMP/vbin" >> "$GITHUB_PATH"
      - name: velnor-ci plan
        id: plan
        env:
          GITHUB_TOKEN: '${{ github.token }}'
        run: velnor-ci plan
      - name: Install tools
        if: '${{ steps.plan.outcome == ''success'' && steps.plan.outputs.rust_root_mode != ''none'' }}'
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
        with:
          version: '2026.11.1'
          cache: false
      - name: Add Rust components
        if: '${{ steps.plan.outcome == ''success'' && steps.plan.outputs.rust_root_mode != ''none'' }}'
        run: rustup component add clippy rustfmt
      - name: velnor-ci prepare
        id: prepare
        if: '${{ steps.plan.outcome == ''success'' && steps.plan.outputs.rust_root_mode != ''none'' }}'
        run: velnor-ci prepare
      - name: velnor-ci restored
        if: '${{ steps.plan.outcome == ''success'' && steps.plan.outputs.rust_root_mode != ''none'' }}'
        run: velnor-ci restored
      - name: Format
        if: '${{ !cancelled() && steps.plan.outcome == ''success'' && steps.plan.outputs.rust_root_mode != ''none'' }}'
        run: velnor-ci run -- cargo-fmt --all --check
      - name: Lint
        if: '${{ !cancelled() && steps.plan.outcome == ''success'' && steps.plan.outputs.rust_root_mode != ''none'' }}'
        run: velnor-ci run -- cargo-clippy clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        id: test
        if: '${{ !cancelled() && steps.plan.outcome == ''success'' && steps.plan.outputs.rust_root_mode != ''none'' }}'
        run: 'velnor-ci run -- cargo-nextest nextest run --workspace --locked --no-fail-fast --ignore-default-filter -E ''all()'' --no-tests=pass'
