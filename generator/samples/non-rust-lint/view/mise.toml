[tools]
mr-boxington = { version = "v1.30.0", workflow = "release.yml@refs/heads/main" }
rust = { version = "1.99.1", mr_boxington = true }
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.151"
"github:asamarts/alint" = "0.22.1"
jactionlint = "2.4.0"
shellcheck = "0.11.0"

[settings]
lockfile = true

[tasks.lint-generator-samples]
description = "Lint the workflows in the expected output of the generator samples"
run = "jactionlint --format gcc --strict-exit --no-online"

[wrappers.cargo]
command = "mbx"
env = { MBX_CARGO_SHIM_MODE = "1" }
