# Generated by velnor-gen. Change .velnor/rust-ci.toml and run `velnor-gen generate`.
name: Rust CI
on:
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: '${{ github.workflow_ref }}'
  cancel-in-progress: true
jobs:
  # one job: .velnor/rust-ci-timings.json has no build times for this workspace
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
        with:
          cache: false
          install_args: 'rust aqua:nextest-rs/nextest/cargo-nextest'
      - name: Format
        if: '${{ !cancelled() }}'
        run: cargo-fmt --all --check
      - name: Lint
        if: '${{ !cancelled() }}'
        run: cargo-clippy clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        if: '${{ !cancelled() }}'
        env:
          FILTER: 'all()'
        run: 'cargo-nextest nextest run --workspace --locked --no-fail-fast -E "$FILTER"'
      - name: Documentation
        if: '${{ !cancelled() }}'
        env:
          RUSTDOCFLAGS: '-D warnings'
        run: cargo doc --workspace --no-deps --locked
      - name: Check single-crate alone
        if: '${{ !cancelled() }}'
        run: cargo check -p single-crate --locked
  required:
    name: Required
    needs:
      - rust
    if: '${{ !cancelled() }}'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fail when a Rust job failed or was cancelled
        if: '${{ contains(needs.*.result, ''failure'') || contains(needs.*.result, ''cancelled'') }}'
        run: exit 1
