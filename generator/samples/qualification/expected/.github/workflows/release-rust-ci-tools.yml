# velnor-gen-sha256: 95eaf7b805368f3cf4e6ba15aa5ca3a06f1237d7bf458564940c05477a009b2c
name: Release Rust CI tools
on:
  workflow_dispatch: {}
  push:
    tags:
      - 'rust-ci-v*'
      - 'tools-v*'
permissions: {}
concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: false
jobs:
  gate:
    name: Gate
    if: '${{ github.event_name == ''push'' && (startsWith(github.ref, ''refs/tags/rust-ci-v'') || startsWith(github.ref, ''refs/tags/tools-v'')) }}'
    permissions:
      checks: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - id: default_branch
        name: Read the default branch
        env:
          GH_TOKEN: '${{ github.token }}'
        run: 'gh api "repos/$GITHUB_REPOSITORY" --jq ''"name=\(.default_branch)"'' >> "$GITHUB_OUTPUT"'
      - name: Check that the tagged commit is on the default branch
        env:
          DEFAULT_BRANCH: '${{ steps.default_branch.outputs.name }}'
          GH_TOKEN: '${{ github.token }}'
        run: 'gh api "repos/$GITHUB_REPOSITORY/compare/$DEFAULT_BRANCH...$GITHUB_SHA" --jq ''.status == "behind" or .status == "identical" or error("the tagged commit is not on the default branch")'''
  build-linux-x64:
    name: Build linux-x64
    needs:
      - gate
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: '1'
          persist-credentials: false
      - name: Install the musl C compiler
        run: sudo apt-get install --yes musl-tools
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Add the target
        run: 'rustup target add "$TARGET"'
      - name: Build velnor-ci
        env:
          TARGET_CC: musl-gcc
          VELNOR_COMMIT: '${{ github.sha }}'
        run: 'cargo build --profile release-tools --locked --target "$TARGET" --package velnor-ci'
      - name: Build velnor-gen
        env:
          TARGET_CC: musl-gcc
          VELNOR_COMMIT: '${{ github.sha }}'
        run: 'cargo build --profile release-tools --locked --target "$TARGET" --package velnor-gen'
      - name: Create the folders of binaries and release files
        run: mkdir stage dist
      - name: Stage velnor-ci
        run: 'cp "target/$TARGET/release-tools/velnor-ci" stage/velnor-ci'
      - name: Stage velnor-gen
        run: 'cp "target/$TARGET/release-tools/velnor-gen" stage/velnor-gen'
      - name: Run velnor-ci
        run: env -C stage ./velnor-ci --version
      - name: Run velnor-gen
        run: env -C stage ./velnor-gen --version
      - name: Check the tag against the version of velnor-ci
        run: 'env -C stage ./velnor-ci check-tag "$GITHUB_REF_NAME"'
      - name: Check the tag against the version of velnor-gen
        run: 'env -C stage ./velnor-gen check-tag "$GITHUB_REF_NAME"'
      - name: Archive velnor-ci
        run: 'tar -czf "dist/velnor-ci-$TARGET.tar.gz" -C stage velnor-ci'
      - name: Archive velnor-gen
        run: 'tar -czf "dist/velnor-gen-$TARGET.tar.gz" -C stage velnor-gen'
      - name: Show the file sizes
        run: ls -l dist
      - name: Upload the archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: binaries-linux-x64
          path: dist/
          retention-days: '1'
  build-linux-arm64:
    name: Build linux-arm64
    needs:
      - gate
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      TARGET: aarch64-unknown-linux-musl
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: '1'
          persist-credentials: false
      - name: Install the musl C compiler
        run: sudo apt-get install --yes musl-tools
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Add the target
        run: 'rustup target add "$TARGET"'
      - name: Build velnor-ci
        env:
          TARGET_CC: musl-gcc
          VELNOR_COMMIT: '${{ github.sha }}'
        run: 'cargo build --profile release-tools --locked --target "$TARGET" --package velnor-ci'
      - name: Build velnor-gen
        env:
          TARGET_CC: musl-gcc
          VELNOR_COMMIT: '${{ github.sha }}'
        run: 'cargo build --profile release-tools --locked --target "$TARGET" --package velnor-gen'
      - name: Create the folders of binaries and release files
        run: mkdir stage dist
      - name: Stage velnor-ci
        run: 'cp "target/$TARGET/release-tools/velnor-ci" stage/velnor-ci'
      - name: Stage velnor-gen
        run: 'cp "target/$TARGET/release-tools/velnor-gen" stage/velnor-gen'
      - name: Run velnor-ci
        run: env -C stage ./velnor-ci --version
      - name: Run velnor-gen
        run: env -C stage ./velnor-gen --version
      - name: Check the tag against the version of velnor-ci
        run: 'env -C stage ./velnor-ci check-tag "$GITHUB_REF_NAME"'
      - name: Check the tag against the version of velnor-gen
        run: 'env -C stage ./velnor-gen check-tag "$GITHUB_REF_NAME"'
      - name: Archive velnor-ci
        run: 'tar -czf "dist/velnor-ci-$TARGET.tar.gz" -C stage velnor-ci'
      - name: Archive velnor-gen
        run: 'tar -czf "dist/velnor-gen-$TARGET.tar.gz" -C stage velnor-gen'
      - name: Show the file sizes
        run: ls -l dist
      - name: Upload the archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: binaries-linux-arm64
          path: dist/
          retention-days: '1'
  checksums:
    name: Checksums
    needs:
      - build-linux-x64
      - build-linux-arm64
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          merge-multiple: 'true'
          path: dist
          pattern: 'binaries-*'
      - name: Record the commit of the release
        run: 'echo "$GITHUB_SHA" > dist/COMMIT'
      - name: Make the folders to unpack the archives in
        run: mkdir -p binary/velnor-ci-x86_64-unknown-linux-musl.tar.gz binary/velnor-ci-aarch64-unknown-linux-musl.tar.gz binary/velnor-gen-x86_64-unknown-linux-musl.tar.gz binary/velnor-gen-aarch64-unknown-linux-musl.tar.gz
      - name: Unpack velnor-ci-x86_64-unknown-linux-musl.tar.gz
        run: tar -xzf dist/velnor-ci-x86_64-unknown-linux-musl.tar.gz -C binary/velnor-ci-x86_64-unknown-linux-musl.tar.gz velnor-ci
      - name: Unpack velnor-ci-aarch64-unknown-linux-musl.tar.gz
        run: tar -xzf dist/velnor-ci-aarch64-unknown-linux-musl.tar.gz -C binary/velnor-ci-aarch64-unknown-linux-musl.tar.gz velnor-ci
      - name: Unpack velnor-gen-x86_64-unknown-linux-musl.tar.gz
        run: tar -xzf dist/velnor-gen-x86_64-unknown-linux-musl.tar.gz -C binary/velnor-gen-x86_64-unknown-linux-musl.tar.gz velnor-gen
      - name: Unpack velnor-gen-aarch64-unknown-linux-musl.tar.gz
        run: tar -xzf dist/velnor-gen-aarch64-unknown-linux-musl.tar.gz -C binary/velnor-gen-aarch64-unknown-linux-musl.tar.gz velnor-gen
      - name: Write BINARY-SHA256SUMS
        run: 'env -C binary sha256sum velnor-ci-x86_64-unknown-linux-musl.tar.gz/velnor-ci velnor-ci-aarch64-unknown-linux-musl.tar.gz/velnor-ci velnor-gen-x86_64-unknown-linux-musl.tar.gz/velnor-gen velnor-gen-aarch64-unknown-linux-musl.tar.gz/velnor-gen > dist/BINARY-SHA256SUMS'
      - name: Write SHA256SUMS
        run: 'env -C dist sha256sum COMMIT velnor-ci-x86_64-unknown-linux-musl.tar.gz velnor-ci-aarch64-unknown-linux-musl.tar.gz velnor-gen-x86_64-unknown-linux-musl.tar.gz velnor-gen-aarch64-unknown-linux-musl.tar.gz BINARY-SHA256SUMS > dist/SHA256SUMS'
      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: SHA256SUMS
          path: |
            dist/SHA256SUMS
            dist/BINARY-SHA256SUMS
            dist/COMMIT
          retention-days: '1'
  release:
    name: Release
    needs:
      - checksums
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          merge-multiple: 'true'
          path: dist
          pattern: 'binaries-*'
      - name: Download SHA256SUMS
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: SHA256SUMS
          path: dist
      - name: Verify every file against SHA256SUMS
        run: env -C dist sha256sum --check --strict SHA256SUMS
      - name: Create the pre-release
        env:
          GH_TOKEN: '${{ github.token }}'
        run: 'gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "$GITHUB_REF_NAME" --notes "Prebuilt velnor-ci and velnor-gen archives. Verify every download against SHA256SUMS." dist/SHA256SUMS dist/BINARY-SHA256SUMS dist/COMMIT dist/velnor-ci-x86_64-unknown-linux-musl.tar.gz dist/velnor-ci-aarch64-unknown-linux-musl.tar.gz dist/velnor-gen-x86_64-unknown-linux-musl.tar.gz dist/velnor-gen-aarch64-unknown-linux-musl.tar.gz'
