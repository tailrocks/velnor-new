    runs-on: '${{ (!startsWith(github.event_name, ''pull_request'') || github.event.pull_request.head.repo.full_name == github.repository) && ''ubuntu-26.04-scale-set'' || ''ubuntu-26.04'' }}'
    services:
      redis:
        image: 'redis:8.10.2-alpine@sha256:2d3814be5e9b06a30a0be54770b7e12052e7e79ec85271aefd34875c1f393b23'
        ports:
          - '6379:6379'
        options: '--health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12'
    timeout-minutes: 5
    steps:
      - name: Probe service
