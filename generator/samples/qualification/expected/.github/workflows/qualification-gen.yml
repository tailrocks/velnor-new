      - name: Announce service
        run: echo service-up
      - name: Sleep until cancelled
        run: sleep 900
  verify-hosted:
    name: Verify / GitHub hosted / Linux x64
    if: '${{ inputs.mode == ''both'' }}'
    permissions: {}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Qualify hosted lane
        run: echo qualification-hosted
  verify-scale-set:
    name: Verify / Velnor Scale Set / Linux x64
    if: '${{ inputs.mode == ''both'' }}'
    permissions: {}
    runs-on: '${{ (!startsWith(github.event_name, ''pull_request'') || github.event.pull_request.head.repo.full_name == github.repository) && ''ubuntu-26.04-scale-set'' || ''ubuntu-26.04'' }}'
