      proof: '${{ steps.emit.outputs.proof }}'
    runs-on: '${{ (!startsWith(github.event_name, ''pull_request'') || github.event.pull_request.head.repo.full_name == github.repository) && ''ubuntu-26.04-scale-set'' || ''ubuntu-26.04'' }}'
    timeout-minutes: 5
    steps:
      - name: Create bin directory
        run: 'mkdir -p "$RUNNER_TEMP/g4-bin"'
      - name: Write path probe
        run: 'printf ''%s\n'' ''#!/bin/sh'' ''echo path-ok'' > "$RUNNER_TEMP/g4-bin/g4-path-ok"'
      - name: Make probe executable
        run: 'chmod +x "$RUNNER_TEMP/g4-bin/g4-path-ok"'
      - id: emit
        name: Write output
        run: 'echo proof=outputs-ok >> "$GITHUB_OUTPUT"'
      - name: Write env
        run: 'echo G4_ENV=outputs-ok >> "$GITHUB_ENV"'
      - name: Write path
        run: 'echo "$RUNNER_TEMP/g4-bin" >> "$GITHUB_PATH"'
      - name: Check env
        run: 'test "$G4_ENV" = outputs-ok'
      - name: Run path probe
        run: 'g4-path-ok > "$RUNNER_TEMP/g4-path-out"'
      - name: Check path probe
        run: 'grep -qx path-ok "$RUNNER_TEMP/g4-path-out"'
