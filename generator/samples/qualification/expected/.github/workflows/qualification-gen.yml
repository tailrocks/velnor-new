    name: Mask / Velnor Scale Set
    if: '${{ inputs.mode == ''mask'' }}'
    permissions: {}
    runs-on: '${{ (!startsWith(github.event_name, ''pull_request'') || github.event.pull_request.head.repo.full_name == github.repository) && ''ubuntu-26.04-scale-set'' || ''ubuntu-26.04'' }}'
