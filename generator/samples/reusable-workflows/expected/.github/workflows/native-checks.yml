name: Native checks
on:
  workflow_call:
    inputs:
      sdk_version:
        description: SDK version to check
        required: true
        type: string
      transition_id:
        description: Transition to check
        required: true
        type: string
permissions: {}
jobs:
  plan:
    permissions: {}
    outputs:
      matrix: '${{ steps.plan.outputs.matrix }}'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install velnor-ci 0.1.81
        uses: tailrocks/velnor-new/actions/setup-velnor@1793cf84b5924e2542a03b0fb2580e7395b2f4cb  # rust-ci-v0.1.81
        with:
          version: '0.1.81'
          sha256-linux-x64: '10e3511ab3d2f211366c6fd3633474f4a74ee6750b16b52c90758c0e8321dd3e'
          sha256-linux-arm64: '56d836fd2ae8135b5306f154b3287dfe81328f7a89b0528b3b912fab6e6916a6'
          sha256-macos-arm64: '39431db3aeccf193088fa8845896c627e3da004f683d4d4699d3d697c808c607'
      - id: plan
        name: Plan the checks
        env:
          GH_TOKEN: '${{ github.token }}'
          SDK_VERSION: '${{ inputs.sdk_version }}'
        run: velnor-ci plan
  check:
    needs:
      - plan
    permissions: {}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: '${{ fromJSON(needs.plan.outputs.matrix) }}'
    timeout-minutes: 30
    steps:
      - name: Warm the cache
        continue-on-error: true
        env:
          TARGET: '${{ matrix.target }}'
        run: velnor-ci warm
      - name: Run the check
        run: velnor-ci check
