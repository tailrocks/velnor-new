[[test_groups]]
name = "database"
filter = "package(app) and test(/^db_/)"
needs = ["docker"]
test_threads = 2
timeout_minutes = 45
runner = "velnor-box"
paths = ["app/migrations/**"]
events = ["push", "schedule"]
root = "."

[[test_groups]]
name = "shell"
filter = "package(tool) and test(~cargo_)"
needs = ["cargo"]
restore_cache = true
root = "."

[[test_groups]]
name = "slow"
filter = "all()"
test_threads = 1
root = "lab"
