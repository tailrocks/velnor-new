    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VELNOR_MBX_REPORTS: 'true'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve released helper tools
        env:
          VELNOR_HELPER_INSTALL_TOOLS: *velnor_0
        run: 'eval "$VELNOR_HELPER_INSTALL_TOOLS"'
      - name: Install velnor-ci 0.1.112
        uses: tailrocks/velnor-new/actions/setup-velnor@1c5a9d9accbb9d8d3beb8431a42e291dda915f5d  # tools-v0.1.112
        with:
          version: '0.1.112'
          sha256-linux-x64: eb5e6b5822e32bfd97ddbad8e337cb0990958def32c128ae52d8ae8178ee79bc
          sha256-linux-arm64: '18b816edc005d27cff25f724856301dcf44c6181f0ac51b345acd04b3a47c5b3'
      - name: Install the released helper launcher
        env:
          VELNOR_HELPER_INSTALL_LAUNCHER: *velnor_1
          VELNOR_HELPER_LAUNCHER: *velnor_2
          VELNOR_HELPER_SHA256: *velnor_3
        run: 'eval "$VELNOR_HELPER_INSTALL_LAUNCHER"'
      - name: Private mbx store
        run: 'echo "MBX_CACHE_DIR=$RUNNER_TEMP/mbx" >> "$GITHUB_ENV"'
      - name: Keep mbx build-script outputs in target
        run: 'echo "MBX_SHARE_OUT_DIR=0" >> "$GITHUB_ENV"'
      - id: toolsanchor
        name: Find the anchor
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: *velnor_5
          key: *velnor_6
          restore-keys: *velnor_7
      # jactionlint ignore=shellcheck
      - id: toolsread
        name: Read the anchor
        env:
          VELNOR_ANCHOR_MATCHED: *velnor_8
        run: '. "$VELNOR_EXEC" tools-verify read'
      # jactionlint ignore=shellcheck
      - name: Clear the tools directories
        run: '. "$VELNOR_EXEC" tools-local clear'
      - id: tools
        name: Restore the tools cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.local/share/mise
            ~/.rustup
          key: 'velnor-tools-${{ runner.os }}-${{ runner.arch }}-mise2026.11.10-${{ hashFiles(''mise.lock'') }}-${{ steps.toolsread.outputs.anchor }}'
      # jactionlint ignore=shellcheck
      - id: toolsverify
        name: Verify tools
        env:
          VELNOR_TOOLS_ANCHOR: &velnor_23 '${{ steps.toolsread.outputs.anchor }}'
          VELNOR_ANCHOR_CACHE_KEY: *velnor_8
          VELNOR_TOOLS_CACHE_KEY: *velnor_12
        run: '. "$VELNOR_EXEC" tools-verify check'
      - name: Install tools
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d
        with:
          version: '2026.11.10'
          sha256: b603a4f48563fc379a794d9ea2cf9f709ed276c9141068604cb0c59fa3e674a9
          cache: false
      - name: Add Rust components
        working-directory: tools/gen
        run: rustup component add clippy rustfmt
      # jactionlint ignore=shellcheck
      - id: toolsrecord
        name: Record anchor
        env:
          VELNOR_TOOLS_ANCHOR: *velnor_23
          VELNOR_TOOLS_VERIFIED: *velnor_13
        run: '. "$VELNOR_EXEC" tools-verify record'
      - name: Save anchor
        if: *velnor_14
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: *velnor_5
          key: *velnor_6
      - id: save_tools
        name: Save the tools cache
        if: *velnor_15
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.local/share/mise
            ~/.rustup
          key: *velnor_16
      - id: tools_saved_key
        name: Record the tools cache key
        if: '${{ !cancelled() && steps.save_tools.outcome != ''skipped'' }}'
        env:
          CACHE_KEY: 'velnor-tools-${{ runner.os }}-${{ runner.arch }}-mise2026.11.10-${{ hashFiles(''mise.lock'') }}-${{ steps.toolsrecord.outputs.digest }}'
        run: 'echo "key=$CACHE_KEY" >> "$GITHUB_OUTPUT"'
      # jactionlint ignore=shellcheck
      - name: Check the generated workflow with velnor-gen built from the checkout
        working-directory: tools/gen
        env:
          CARGO_TARGET_DIR: '${{ github.workspace }}/target/velnor-roots/tools_gen'
        run: '. "$VELNOR_EXEC" run -- cargo run --locked --target host-tuple --package velnor-gen --bin velnor-gen -- --root ../.. check --verify-release'
      # jactionlint ignore=shellcheck
      - id: report_cache_metrics
        name: Report cache telemetry
        if: '${{ !cancelled() }}'
        continue-on-error: true
        env:
          VELNOR_REPORT_CACHES: '[{"family":"tools","restore_step":"tools","root":null,"save_key_step":"tools_saved_key","save_step":"save_tools"}]'
          VELNOR_REPORT_STEPS: '${{ toJSON(steps) }}'
          VELNOR_REPORT_DEFAULT_BRANCH: '${{ github.event.repository.default_branch }}'
          VELNOR_REPORT_JOB_NAME: Generated workflows
        run: '. "$VELNOR_EXEC" report'
      - name: Upload cache metrics
        if: '${{ (steps.report_cache_metrics.outcome == ''success'') && (!cancelled()) }}'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 'ci-metrics-${{ github.job }}'
          path: '${{ runner.temp }}/ci-metrics.json'
          if-no-files-found: error
          retention-days: 3
          overwrite: true
  rust-trim:
    name: Cache maintenance
    needs:
      - rust-root
      - rust-tools_gen
      - lint-generated-check
    if: '${{ (github.event_name != ''pull_request'' || (startsWith(github.ref, ''refs/pull/'') && github.event.pull_request.state != ''closed'')) && (!cancelled() && github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch) && (github.event_name == ''push'' || github.event_name == ''schedule'' || github.event_name == ''workflow_dispatch'')) }}'
    permissions:
      pull-requests: read
      actions: write
    cache-mode: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve released helper tools
        env:
          VELNOR_HELPER_INSTALL_TOOLS: *velnor_0
        run: 'eval "$VELNOR_HELPER_INSTALL_TOOLS"'
      - name: Install velnor-ci 0.1.112
        uses: tailrocks/velnor-new/actions/setup-velnor@1c5a9d9accbb9d8d3beb8431a42e291dda915f5d  # tools-v0.1.112
        with:
          version: '0.1.112'
          sha256-linux-x64: eb5e6b5822e32bfd97ddbad8e337cb0990958def32c128ae52d8ae8178ee79bc
          sha256-linux-arm64: '18b816edc005d27cff25f724856301dcf44c6181f0ac51b345acd04b3a47c5b3'
      - name: Install the released helper launcher
        env:
          VELNOR_HELPER_INSTALL_LAUNCHER: *velnor_1
          VELNOR_HELPER_LAUNCHER: *velnor_2
          VELNOR_HELPER_SHA256: *velnor_3
        run: 'eval "$VELNOR_HELPER_INSTALL_LAUNCHER"'
      # jactionlint ignore=shellcheck
      - name: Delete the older rust-root entries
        if: '${{ needs.rust-root.outputs.base_save == ''true'' }}'
        env:
          CACHE_PREFIX: '${{ needs.rust-root.outputs.base_prefix }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache trim --prefix "$CACHE_PREFIX"'
      # jactionlint ignore=shellcheck
      - name: Delete the older rust-root sources entries
        if: '${{ needs.rust-root.outputs.sources_prefix != '''' && (needs.rust-root.outputs.sources_saved == ''true'' || needs.rust-root.outputs.sources_key != '''') }}'
        env:
          CACHE_PREFIX: '${{ needs.rust-root.outputs.sources_prefix }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache trim --prefix "$CACHE_PREFIX"'
      # jactionlint ignore=shellcheck
      - name: Delete the older rust-tools_gen entries
        if: '${{ needs.rust-tools_gen.outputs.base_save == ''true'' }}'
        env:
          CACHE_PREFIX: '${{ needs.rust-tools_gen.outputs.base_prefix }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache trim --prefix "$CACHE_PREFIX"'
      # jactionlint ignore=shellcheck
      - name: Delete the older rust-tools_gen sources entries
        if: '${{ needs.rust-tools_gen.outputs.sources_prefix != '''' && (needs.rust-tools_gen.outputs.sources_saved == ''true'' || needs.rust-tools_gen.outputs.sources_key != '''') }}'
        env:
          CACHE_PREFIX: '${{ needs.rust-tools_gen.outputs.sources_prefix }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache trim --prefix "$CACHE_PREFIX"'
      # jactionlint ignore=shellcheck
      - id: verify-rust-root-target_key
        name: Verify the rust-root target cache upload
        if: '${{ needs.rust-root.outputs.target_key != '''' }}'
        continue-on-error: true
        env:
          CACHE_KEY: '${{ needs.rust-root.outputs.target_key }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache verify --key "$CACHE_KEY"'
      # jactionlint ignore=shellcheck
      - id: verify-rust-root-sources_key
        name: Verify the rust-root sources cache upload
        if: '${{ needs.rust-root.outputs.sources_key != '''' }}'
        continue-on-error: true
        env:
          CACHE_KEY: '${{ needs.rust-root.outputs.sources_key }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache verify --key "$CACHE_KEY"'
      # jactionlint ignore=shellcheck
      - id: verify-rust-tools_gen-target_key
        name: Verify the rust-tools_gen target cache upload
        if: '${{ needs.rust-tools_gen.outputs.target_key != '''' }}'
        continue-on-error: true
        env:
          CACHE_KEY: '${{ needs.rust-tools_gen.outputs.target_key }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache verify --key "$CACHE_KEY"'
      # jactionlint ignore=shellcheck
      - id: verify-rust-tools_gen-sources_key
        name: Verify the rust-tools_gen sources cache upload
        if: '${{ needs.rust-tools_gen.outputs.sources_key != '''' }}'
        continue-on-error: true
        env:
          CACHE_KEY: '${{ needs.rust-tools_gen.outputs.sources_key }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache verify --key "$CACHE_KEY"'
      # jactionlint ignore=shellcheck
      - name: Require verified cache uploads
        env:
          CACHE_OK: '${{ steps.verify-rust-root-target_key.outcome != ''failure'' && steps.verify-rust-root-sources_key.outcome != ''failure'' && steps.verify-rust-tools_gen-target_key.outcome != ''failure'' && steps.verify-rust-tools_gen-sources_key.outcome != ''failure'' }}'
        run: '. "$VELNOR_EXEC" cache check --success "$CACHE_OK"'
      # jactionlint ignore=shellcheck
      - name: Enforce the repository cache budget
        env:
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache budget --budget-bytes 8000000000'
      # jactionlint ignore=shellcheck
      - name: Delete the private-base caches unless the repository is private
        if: '${{ !cancelled() }}'
        env:
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache purge-private --if-public'
  required:
