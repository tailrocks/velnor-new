          GATE_SPEC: '--plan rust-plan --job rust-plan=always --job rust-root=lane:root --job rust-tools_gen=lane:tools_gen --job lint-generated-check=always --tests rust-root=root --tests rust-tools_gen=tools_gen'
        run: '. "$VELNOR_EXEC" gate --spec-env GATE_SPEC'
  cache:
    name: Cache
    needs:
      - rust-root
      - rust-tools_gen
      - lint-generated-check
      - rust-trim
    if: '${{ (github.event_name != ''pull_request'' || (startsWith(github.ref, ''refs/pull/'') && github.event.pull_request.state != ''closed'')) && (!cancelled() && (needs.rust-root.result != ''skipped'' || needs.rust-tools_gen.result != ''skipped'' || needs.lint-generated-check.result != ''skipped'' || needs.rust-trim.result != ''skipped'')) }}'
    permissions:
      actions: read
      contents: read
    cache-mode: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve released helper tools
        env:
          VELNOR_HELPER_INSTALL_TOOLS: *velnor_0
        run: 'eval "$VELNOR_HELPER_INSTALL_TOOLS"'
