    steps:
      - id: source
        name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 'refs/tags/${{ needs.family.outputs.tag }}'
          fetch-depth: 1
          persist-credentials: false
      - name: Check that the family tag is on the verified commit itself
        env:
          VERIFIED: '${{ github.event.workflow_run.head_sha }}'
          FAMILY: '${{ needs.family.outputs.commit }}'
          CHECKED_OUT: '${{ steps.source.outputs.commit }}'
        run: 'test -n "$VERIFIED" -a "$CHECKED_OUT" = "$VERIFIED" -a "$FAMILY" = "$VERIFIED"'
      - name: Install tools
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d
        with:
          version: '2026.11.10'
          cache: false
      - name: Add the aarch64-apple-darwin target
        run: rustup target add aarch64-apple-darwin
      - name: Build app for macos-arm64
        env:
          VELNOR_COMMIT: '${{ github.sha }}'
        run: cargo build --release --locked --manifest-path Cargo.toml --package app --bin app --target aarch64-apple-darwin --target-dir target
      - name: Stage app-aarch64-apple-darwin.tar.gz
        run: 'mkdir -p "$RUNNER_TEMP/pack"'
      - name: Copy app-aarch64-apple-darwin.tar.gz members
        run: 'cp -p target/aarch64-apple-darwin/release/app "$RUNNER_TEMP/pack/"'
      - name: Normalise app-aarch64-apple-darwin.tar.gz mtimes
        run: 'TZ=UTC touch -h -t 197001010000 "$RUNNER_TEMP/pack/app"'
      - name: Pack app-aarch64-apple-darwin.tar.gz
        run: 'COPYFILE_DISABLE=1 tar -cf "$RUNNER_TEMP/pack.tar" -n --uid 0 --gid 0 --uname '''' --gname '''' --no-xattrs --no-mac-metadata -C "$RUNNER_TEMP/pack" app'
      - name: Compress app-aarch64-apple-darwin.tar.gz
        run: 'gzip -n -c "$RUNNER_TEMP/pack.tar" > app-aarch64-apple-darwin.tar.gz'
      - name: Upload app-macos-arm64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: app-macos-arm64
          path: app-aarch64-apple-darwin.tar.gz
          if-no-files-found: error
          retention-days: 1
  sums-family:
    needs:
      - gate
      - family
      - build-app-linux-x64
      - build-app-linux-arm64
      - build-app-macos-arm64
    if: '${{ needs.gate.outputs.ready == ''true'' && github.event.workflow_run.event == ''push'' && github.event.workflow_run.conclusion == ''success'' && github.event.workflow_run.head_branch == github.event.repository.default_branch && needs.family.outputs.build == ''true'' }}'
    permissions: {}
    cache-mode: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download app-linux-x64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: app-linux-x64
          path: dist
      - name: Download app-linux-arm64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: app-linux-arm64
          path: dist
      - name: Download app-macos-arm64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: app-macos-arm64
          path: dist
      - name: Write SHA256SUMS
        if: '${{ runner.os != ''macOS'' }}'
        working-directory: dist
        run: 'sha256sum app-x86_64-unknown-linux-musl.tar.gz app-aarch64-unknown-linux-musl.tar.gz app-aarch64-apple-darwin.tar.gz > SHA256SUMS'
      - name: Write SHA256SUMS
        if: '${{ runner.os == ''macOS'' }}'
        working-directory: dist
        run: 'shasum -a 256 app-x86_64-unknown-linux-musl.tar.gz app-aarch64-unknown-linux-musl.tar.gz app-aarch64-apple-darwin.tar.gz > SHA256SUMS'
      - name: Upload family-sums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: family-sums
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
  publish-family:
    needs:
      - gate
      - family
      - sums-family
    if: '${{ needs.gate.outputs.ready == ''true'' && github.event.workflow_run.event == ''push'' && github.event.workflow_run.conclusion == ''success'' && github.event.workflow_run.head_branch == github.event.repository.default_branch && needs.family.outputs.build == ''true'' }}'
    permissions:
      contents: write
    cache-mode: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install velnor-ci 0.1.85
        uses: tailrocks/velnor-new/actions/setup-velnor@911bef6ec7c6d84f864369d6dad43b8ae1edf702  # tools-v0.1.85
        with:
          version: '0.1.85'
          sha256-linux-x64: '79357c15479702f6b9da8a7d5ec93076a8ca090c16f8e62ecdb616caf636d2a6'
          sha256-linux-arm64: a5d66effbe6557b97541ca466c24abcde731043508d3db6e1336edf2d6d0117a
          sha256-macos-arm64: '3ec8b464d1ffb7a479ec295ef7bcf978696b9fe9f5363177d665d0aa479ce6a4'
      - name: Download app-linux-x64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: app-linux-x64
          path: dist
      - name: Download app-linux-arm64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: app-linux-arm64
          path: dist
      - name: Download app-macos-arm64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: app-macos-arm64
          path: dist
      - name: Download family-sums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: family-sums
          path: dist
      - name: Publish the family release
        env:
          GITHUB_TOKEN: '${{ github.token }}'
          REPOSITORY: '${{ github.repository }}'
          TAG: '${{ needs.family.outputs.tag }}'
        run: 'velnor-ci release publish --repo="$REPOSITORY" --tag="$TAG" --app=velnor-release --dir=dist app-x86_64-unknown-linux-musl.tar.gz app-aarch64-unknown-linux-musl.tar.gz app-aarch64-apple-darwin.tar.gz'
