        run: 'eval "$VELNOR_HELPER_INSTALL_TOOLS"'
      - name: Install velnor-ci 0.1.88
        uses: tailrocks/velnor-new/actions/setup-velnor@5dbd84e88c11132810803de5bffc862ba42807c5  # tools-v0.1.88
        with:
          version: '0.1.88'
          sha256-linux-x64: '2cab09d624461fbfbc0284fb2e289fa677900085e7b25e0b590d1935a08e755d'
          sha256-linux-arm64: afb4fb64610e500eac7d9b9df5179b55ae9e8804b886065b8d1fdd209e4c278f
      - name: Install the released helper launcher
        env:
          VELNOR_HELPER_INSTALL_LAUNCHER: *velnor_1
          VELNOR_HELPER_LAUNCHER: *velnor_2
          VELNOR_HELPER_SHA256: *velnor_3
        run: 'eval "$VELNOR_HELPER_INSTALL_LAUNCHER"'
      # jactionlint ignore=shellcheck
      - name: Delete the older rust-lint-root entries
        if: '${{ needs.rust-lint-root.outputs.base_save == ''true'' }}'
        env:
          CACHE_PREFIX: '${{ needs.rust-lint-root.outputs.base_prefix }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache trim --prefix "$CACHE_PREFIX"'
      # jactionlint ignore=shellcheck
      - name: Delete the older rust-test-root entries
        if: '${{ needs.rust-test-root.outputs.base_save == ''true'' }}'
        env:
          CACHE_PREFIX: '${{ needs.rust-test-root.outputs.base_prefix }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache trim --prefix "$CACHE_PREFIX"'
      # jactionlint ignore=shellcheck
      - name: Delete the older rust-test-root sources entries
        if: '${{ needs.rust-test-root.outputs.sources_prefix != '''' && (needs.rust-test-root.outputs.sources_saved == ''true'' || needs.rust-test-root.outputs.sources_key != '''') }}'
        env:
          CACHE_PREFIX: '${{ needs.rust-test-root.outputs.sources_prefix }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache trim --prefix "$CACHE_PREFIX"'
      # jactionlint ignore=shellcheck
      - name: Delete the older rust-lint-lab entries
        if: '${{ needs.rust-lint-lab.outputs.base_save == ''true'' }}'
        env:
          CACHE_PREFIX: '${{ needs.rust-lint-lab.outputs.base_prefix }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache trim --prefix "$CACHE_PREFIX"'
      # jactionlint ignore=shellcheck
      - name: Delete the older rust-test-lab entries
        if: '${{ needs.rust-test-lab.outputs.base_save == ''true'' }}'
        env:
          CACHE_PREFIX: '${{ needs.rust-test-lab.outputs.base_prefix }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache trim --prefix "$CACHE_PREFIX"'
      # jactionlint ignore=shellcheck
      - name: Delete the older rust-test-lab sources entries
        if: '${{ needs.rust-test-lab.outputs.sources_prefix != '''' && (needs.rust-test-lab.outputs.sources_saved == ''true'' || needs.rust-test-lab.outputs.sources_key != '''') }}'
        env:
          CACHE_PREFIX: '${{ needs.rust-test-lab.outputs.sources_prefix }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache trim --prefix "$CACHE_PREFIX"'
      # jactionlint ignore=shellcheck
      - id: verify-rust-lint-root-target_key
        name: Verify the rust-lint-root target cache upload
        if: '${{ needs.rust-lint-root.outputs.target_key != '''' }}'
        continue-on-error: true
        env:
          CACHE_KEY: '${{ needs.rust-lint-root.outputs.target_key }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache verify --key "$CACHE_KEY"'
      # jactionlint ignore=shellcheck
      - id: verify-rust-test-root-target_key
        name: Verify the rust-test-root target cache upload
        if: '${{ needs.rust-test-root.outputs.target_key != '''' }}'
        continue-on-error: true
        env:
          CACHE_KEY: '${{ needs.rust-test-root.outputs.target_key }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache verify --key "$CACHE_KEY"'
      # jactionlint ignore=shellcheck
      - id: verify-rust-test-root-sources_key
        name: Verify the rust-test-root sources cache upload
        if: '${{ needs.rust-test-root.outputs.sources_key != '''' }}'
        continue-on-error: true
        env:
          CACHE_KEY: '${{ needs.rust-test-root.outputs.sources_key }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache verify --key "$CACHE_KEY"'
      # jactionlint ignore=shellcheck
      - id: verify-rust-lint-lab-target_key
        name: Verify the rust-lint-lab target cache upload
        if: '${{ needs.rust-lint-lab.outputs.target_key != '''' }}'
        continue-on-error: true
        env:
          CACHE_KEY: '${{ needs.rust-lint-lab.outputs.target_key }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache verify --key "$CACHE_KEY"'
      # jactionlint ignore=shellcheck
      - id: verify-rust-test-lab-target_key
        name: Verify the rust-test-lab target cache upload
        if: '${{ needs.rust-test-lab.outputs.target_key != '''' }}'
        continue-on-error: true
        env:
          CACHE_KEY: '${{ needs.rust-test-lab.outputs.target_key }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache verify --key "$CACHE_KEY"'
      # jactionlint ignore=shellcheck
      - id: verify-rust-test-lab-sources_key
        name: Verify the rust-test-lab sources cache upload
        if: '${{ needs.rust-test-lab.outputs.sources_key != '''' }}'
        continue-on-error: true
        env:
          CACHE_KEY: '${{ needs.rust-test-lab.outputs.sources_key }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache verify --key "$CACHE_KEY"'
      # jactionlint ignore=shellcheck
      - name: Require verified cache uploads
        env:
          CACHE_OK: '${{ steps.verify-rust-lint-root-target_key.outcome != ''failure'' && steps.verify-rust-test-root-target_key.outcome != ''failure'' && steps.verify-rust-test-root-sources_key.outcome != ''failure'' && steps.verify-rust-lint-lab-target_key.outcome != ''failure'' && steps.verify-rust-test-lab-target_key.outcome != ''failure'' && steps.verify-rust-test-lab-sources_key.outcome != ''failure'' }}'
        run: '. "$VELNOR_EXEC" cache check --success "$CACHE_OK"'
      # jactionlint ignore=shellcheck
      - name: Enforce the repository cache budget
        env:
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache budget --budget-bytes 8000000000'
  required:
    name: '${{ (github.event.action != ''labeled'' || github.event.label.name == ''ci:run'' || github.event.label.name == ''ci:auto'') && (github.event.action != ''edited'' || github.event.changes.base != null) && ''Required'' || ''Required (ignored event)'' }}'
    needs:
      - rust-plan
      - rust-lint-root
      - rust-test-root
      - rust-lint-lab
      - rust-test-lab
      - rust-inputs-audit
    if: '${{ (github.event_name != ''pull_request'' || (startsWith(github.ref, ''refs/pull/'') && github.event.pull_request.state != ''closed'')) && (always() && (github.event.action != ''labeled'' || github.event.label.name == ''ci:run'' || github.event.label.name == ''ci:auto'') && (github.event.action != ''edited'' || github.event.changes.base != null)) }}'
    permissions:
      contents: read
    cache-mode: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Note that CI is not requested on a draft pull request
        if: '${{ github.event.pull_request.draft == true }}'
        run: 'echo "::notice title=Draft::draft: CI not requested"'
      - name: Resolve released helper tools
        if: '${{ github.event.pull_request.draft != true && (github.event.action != ''labeled'' || github.event.label.name == ''ci:run'' || github.event.label.name == ''ci:auto'') && (github.event.action != ''edited'' || github.event.changes.base != null) && (github.event_name != ''pull_request'' || (github.event.pull_request.head.repo.full_name == github.repository && (contains(github.event.pull_request.labels.*.name, ''ci:run'') || contains(github.event.pull_request.labels.*.name, ''ci:auto'')))) }}'
        env:
          VELNOR_HELPER_INSTALL_TOOLS: *velnor_0
        run: 'eval "$VELNOR_HELPER_INSTALL_TOOLS"'
      - name: Install velnor-ci 0.1.88
        if: '${{ github.event.pull_request.draft != true && (github.event.action != ''labeled'' || github.event.label.name == ''ci:run'' || github.event.label.name == ''ci:auto'') && (github.event.action != ''edited'' || github.event.changes.base != null) && (github.event_name != ''pull_request'' || (github.event.pull_request.head.repo.full_name == github.repository && (contains(github.event.pull_request.labels.*.name, ''ci:run'') || contains(github.event.pull_request.labels.*.name, ''ci:auto'')))) }}'
        uses: tailrocks/velnor-new/actions/setup-velnor@5dbd84e88c11132810803de5bffc862ba42807c5  # tools-v0.1.88
        with:
          version: '0.1.88'
          sha256-linux-x64: '2cab09d624461fbfbc0284fb2e289fa677900085e7b25e0b590d1935a08e755d'
          sha256-linux-arm64: afb4fb64610e500eac7d9b9df5179b55ae9e8804b886065b8d1fdd209e4c278f
      - name: Install the released helper launcher
        if: '${{ github.event.pull_request.draft != true && (github.event.action != ''labeled'' || github.event.label.name == ''ci:run'' || github.event.label.name == ''ci:auto'') && (github.event.action != ''edited'' || github.event.changes.base != null) && (github.event_name != ''pull_request'' || (github.event.pull_request.head.repo.full_name == github.repository && (contains(github.event.pull_request.labels.*.name, ''ci:run'') || contains(github.event.pull_request.labels.*.name, ''ci:auto'')))) }}'
        env:
          VELNOR_HELPER_INSTALL_LAUNCHER: *velnor_1
          VELNOR_HELPER_LAUNCHER: *velnor_2
          VELNOR_HELPER_SHA256: *velnor_3
        run: 'eval "$VELNOR_HELPER_INSTALL_LAUNCHER"'
      # jactionlint ignore=shellcheck
      - name: velnor-ci gate
        if: '${{ github.event.pull_request.draft != true && (github.event.action != ''labeled'' || github.event.label.name == ''ci:run'' || github.event.label.name == ''ci:auto'') && (github.event.action != ''edited'' || github.event.changes.base != null) && (github.event_name != ''pull_request'' || (github.event.pull_request.head.repo.full_name == github.repository && (contains(github.event.pull_request.labels.*.name, ''ci:run'') || contains(github.event.pull_request.labels.*.name, ''ci:auto'')))) }}'
        env:
          NEEDS_JSON: '${{ toJSON(needs) }}'
          GATE_SPEC: '--plan rust-plan --job rust-plan=always --job rust-lint-root=lane:root --job rust-test-root=lane:root --job rust-lint-lab=lane:lab --job rust-test-lab=lane:lab --job rust-inputs-audit=schedule-or-dispatch --tests rust-test-root=root --tests rust-test-lab=lab'
        run: '. "$VELNOR_EXEC" gate --spec-env GATE_SPEC'
      - name: Fail when a Rust job failed or was cancelled
        if: '${{ (contains(needs.*.result, ''failure'') || contains(needs.*.result, ''cancelled'')) && (github.event_name == ''pull_request'' && github.event.pull_request.draft != true && !(github.event.pull_request.head.repo.full_name == github.repository && (contains(github.event.pull_request.labels.*.name, ''ci:run'') || contains(github.event.pull_request.labels.*.name, ''ci:auto'')))) }}'
        run: exit 1
  ci-run-label:
    name: 'Remove the ci:run label'
    needs:
      - required
    if: '${{ (github.event_name != ''pull_request'' || (startsWith(github.ref, ''refs/pull/'') && github.event.pull_request.state != ''closed'')) && (github.event_name == ''pull_request'' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, ''ci:run'') && github.event.pull_request.draft != true && (github.event.action != ''labeled'' || github.event.label.name == ''ci:run'' || github.event.label.name == ''ci:auto'') && (github.event.action != ''edited'' || github.event.changes.base != null)) }}'
    permissions:
      pull-requests: write
    cache-mode: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 'Remove the ci:run label'
        env:
          GH_TOKEN: '${{ github.token }}'
          PR_NUMBER: '${{ github.event.pull_request.number }}'
        run: 'curl --fail --silent --show-error --request DELETE --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/ci%3Arun"'
  cache:
    name: Cache
    needs:
      - rust-lint-root
      - rust-test-root
      - rust-lint-lab
      - rust-test-lab
      - rust-inputs-audit
      - rust-trim
    if: '${{ (github.event_name != ''pull_request'' || (startsWith(github.ref, ''refs/pull/'') && github.event.pull_request.state != ''closed'')) && (!cancelled() && github.event.pull_request.draft != true && (github.event.action != ''labeled'' || github.event.label.name == ''ci:run'' || github.event.label.name == ''ci:auto'') && (github.event.action != ''edited'' || github.event.changes.base != null)) }}'
    permissions:
      actions: read
      contents: read
    cache-mode: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve released helper tools
        env:
          VELNOR_HELPER_INSTALL_TOOLS: *velnor_0
        run: 'eval "$VELNOR_HELPER_INSTALL_TOOLS"'
      - name: Install velnor-ci 0.1.88
        uses: tailrocks/velnor-new/actions/setup-velnor@5dbd84e88c11132810803de5bffc862ba42807c5  # tools-v0.1.88
        with:
          version: '0.1.88'
          sha256-linux-x64: '2cab09d624461fbfbc0284fb2e289fa677900085e7b25e0b590d1935a08e755d'
          sha256-linux-arm64: afb4fb64610e500eac7d9b9df5179b55ae9e8804b886065b8d1fdd209e4c278f
      - name: Install the released helper launcher
        env:
          VELNOR_HELPER_INSTALL_LAUNCHER: *velnor_1
          VELNOR_HELPER_LAUNCHER: *velnor_2
          VELNOR_HELPER_SHA256: *velnor_3
        run: 'eval "$VELNOR_HELPER_INSTALL_LAUNCHER"'
      - name: Download cache metrics
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: 'ci-metrics-*'
          path: '${{ runner.temp }}/ci-metrics'
      # jactionlint ignore=shellcheck
      - name: Check cache waste
        env:
          VELNOR_REPORT_NEEDS: '${{ toJSON(needs) }}'
          GITHUB_TOKEN: '${{ (github.event_name != ''pull_request'' || github.event.pull_request.head.repo.full_name == github.repository) && github.token || '''' }}'
          VELNOR_REPORT_DEFAULT_BRANCH: '${{ github.event.repository.default_branch }}'
        run: '. "$VELNOR_EXEC" report --check "$RUNNER_TEMP/ci-metrics"'
