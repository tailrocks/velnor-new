        run: 'eval "$VELNOR_HELPER_INSTALL_LAUNCHER"'
      - name: download-artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: '${{ needs.source.outputs.artifact_id }}'
      - id: draft
        name: validate-artifact-id
        if: '${{ needs.source.result == ''success'' }}'
        env:
          ARTIFACT_ID: '${{ needs.source.outputs.artifact_id }}'
        run: '. "$VELNOR_EXEC" validate-artifact-id'
