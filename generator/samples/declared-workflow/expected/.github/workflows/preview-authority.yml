name: Preview authority
on:
  workflow_call: {}
permissions: {}
jobs:
  source:
    if: '${{ github.event_name == ''push'' && startsWith(github.ref, ''refs/tags/sdk-preview-'') }}'
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: '${{ steps.upload.outputs.artifact-id }}'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: upload
        name: upload-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source
          path: dist
  draft:
    needs:
      - source
    if: '${{ github.event_name == ''push'' && startsWith(github.ref, ''refs/tags/sdk-preview-'') }}'
    environment: generator-source-preview
    permissions:
      actions: read
      checks: none
      contents: write
    outputs:
      sign: '${{ steps.draft.outputs.sign }}'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install velnor-ci 0.1.81
        uses: tailrocks/velnor-new/actions/setup-velnor@1793cf84b5924e2542a03b0fb2580e7395b2f4cb  # rust-ci-v0.1.81
        with:
          version: '0.1.81'
          sha256-linux-x64: '10e3511ab3d2f211366c6fd3633474f4a74ee6750b16b52c90758c0e8321dd3e'
          sha256-linux-arm64: '56d836fd2ae8135b5306f154b3287dfe81328f7a89b0528b3b912fab6e6916a6'
          sha256-macos-arm64: '39431db3aeccf193088fa8845896c627e3da004f683d4d4699d3d697c808c607'
      - name: download-artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: '${{ needs.source.outputs.artifact_id }}'
      - id: draft
        name: validate-artifact-id
        if: '${{ needs.source.result == ''success'' }}'
        env:
          ARTIFACT_ID: '${{ needs.source.outputs.artifact_id }}'
        run: velnor-ci validate-artifact-id
      - name: Show the id
        run: velnor-ci show-id
