experimental = ["wrapper-scripts"]

[scripts.wrapper.no-programs]
command = ["/usr/bin/env", "PATH=/nonexistent"]

[[profile.default.scripts]]
filter = "all()"
list-wrapper = "no-programs"
run-wrapper = "no-programs"

[[profile.ci.scripts]]
filter = "all()"
list-wrapper = "no-programs"
run-wrapper = "no-programs"

[profile.ci]
retries = 0
test-threads = "num-cpus"
status-level = "all"
final-status-level = "flaky"

[profile.default]
slow-timeout = { period = "2s", terminate-after = 1 }

[[profile.ci.overrides]]
filter = 'package(=velnor-gen) and binary(=it) and (test(=release_cargo_include::a_cargo_config_include_is_refused_in_every_form_in_a_real_repository) or test(=release_cargo_include::a_cargo_config_key_off_the_harmless_list_is_refused_in_a_real_repository) or test(=release_cargo_include::a_cargo_config_of_harmless_keys_is_accepted_in_a_real_repository) or test(=release_symlink::a_committed_cargo_symlink_hiding_a_credential_provider_is_refused_in_a_real_repository) or test(=release_nested_toolchain::a_root_toolchain_taken_from_a_path_is_refused_in_a_real_repository))'
slow-timeout = { period = "10s", terminate-after = 1 }

[[profile.default.overrides]]
filter = 'package(=velnor-gen) and binary(=it) and (test(=release_cargo_include::a_cargo_config_include_is_refused_in_every_form_in_a_real_repository) or test(=release_cargo_include::a_cargo_config_key_off_the_harmless_list_is_refused_in_a_real_repository) or test(=release_cargo_include::a_cargo_config_of_harmless_keys_is_accepted_in_a_real_repository) or test(=release_symlink::a_committed_cargo_symlink_hiding_a_credential_provider_is_refused_in_a_real_repository) or test(=release_nested_toolchain::a_root_toolchain_taken_from_a_path_is_refused_in_a_real_repository))'
slow-timeout = { period = "10s", terminate-after = 1 }
