experimental = ["setup-scripts"]

[scripts.setup.no-programs]
command = ["/bin/sh", "-c", "echo PATH=/nonexistent >> \"$NEXTEST_ENV\""]

[[profile.default.scripts]]
filter = "all()"
setup = "no-programs"

[[profile.ci.scripts]]
filter = "all()"
setup = "no-programs"

[profile.ci]
retries = 0
test-threads = "num-cpus"
status-level = "all"
final-status-level = "flaky"

[profile.default]
slow-timeout = { period = "2s", terminate-after = 1 }
