[package]
name = "velnor-local"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "velnor-local"
path = "src/main.rs"
test = false
doctest = false

[[test]]
name = "it"
path = "tests/it/main.rs"

[dependencies]
base64 = { version = "=0.22.1" }
bytes = { version = "=1.12.1" }
clap = { version = "=4.6.7", features = ["derive"] }
form_urlencoded = { version = "=1.2.2" }
percent-encoding = { version = "=2.3.2" }
futures-util = { version = "=0.3.34", default-features = false }
http-body-util = { version = "=0.1.5" }
hyper = { version = "=1.12.0", features = ["client", "http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["client-legacy", "http1", "tokio"] }
ring = { version = "=0.17.14" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154" }
tokio = { version = "=1.54.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync"] }
tokio-util = { version = "=0.7.20", features = ["io"] }
velnor-cache-rules = { path = "../velnor-cache-rules", version = "=0.0.0" }
