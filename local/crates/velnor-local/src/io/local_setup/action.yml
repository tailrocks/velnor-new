name: Set up velnor-ci
description: velnor-local only. Installs the velnor-ci that velnor-local mounted, not a release.
inputs:
  version:
    description: The velnor-ci version to install, as MAJOR.MINOR.PATCH.
    required: true
  sha256-linux-x64:
    description: The SHA-256 of the linux-x64 binary. Required on Linux X64 runners.
    required: false
    default: ''
  sha256-linux-arm64:
    description: The SHA-256 of the linux-arm64 binary. Required on Linux ARM64 runners.
    required: false
    default: ''
  sha256-macos-arm64:
    description: The SHA-256 of the macos-arm64 binary. Required on macOS ARM64 runners.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Install the local velnor-ci
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        SHA256_LINUX_ARM64: ${{ inputs.sha256-linux-arm64 }}
      run: |
        set -euo pipefail
        fail() { echo "::error title=setup-velnor (velnor-local)::$1"; exit 1; }
        digest() {
          if command -v sha256sum > /dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi | cut -d ' ' -f 1
        }
        [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "version '$VERSION' must be MAJOR.MINOR.PATCH, digits only"
        [ "$RUNNER_OS-$RUNNER_ARCH" = Linux-ARM64 ] || fail "the local velnor-ci is a linux-arm64 build, not $RUNNER_OS $RUNNER_ARCH"
        [ -n "$SHA256_LINUX_ARM64" ] || fail "no SHA-256 was given for linux-arm64"
        [[ "$SHA256_LINUX_ARM64" =~ ^[0-9a-f]{64}$ ]] || fail "the SHA-256 for linux-arm64 is not 64 lowercase hex digits"
        binary=/opt/velnor/local/velnor-ci
        [ -f "$binary" ] && [ ! -L "$binary" ] && [ -x "$binary" ] || fail "velnor-local mounted no executable velnor-ci at $binary; start the environment with --velnor-ci-binary"
        bin="$RUNNER_TEMP/velnor-ci-bin"
        rm -rf "$bin"
        mkdir -p "$bin"
        cp "$binary" "$bin/velnor-ci"
        chmod +x "$bin/velnor-ci"
        sum="$(digest "$bin/velnor-ci")"
        echo "::warning title=setup-velnor::using the local velnor-ci $sum from velnor-local, not the pinned release $VERSION with SHA-256 $SHA256_LINUX_ARM64"
        [ -z "${GITHUB_STEP_SUMMARY:-}" ] || echo "velnor-ci is the local build with SHA-256 $sum, not the pinned release $VERSION ($SHA256_LINUX_ARM64)" >> "$GITHUB_STEP_SUMMARY"
        echo "$bin" >> "$GITHUB_PATH"
