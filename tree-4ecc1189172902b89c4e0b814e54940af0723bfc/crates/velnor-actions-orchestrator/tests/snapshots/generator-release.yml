name: Generator release
"on":
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify-release-source:
    name: Verify generator release source
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "1"
          persist-credentials: "false"
      - name: Setup Mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5
        with:
          cache: "false"
          env: "false"
          install: "false"
          version: 2026.9.18
      - name: Install pinned release gate tools
        shell: bash
        run: mise --no-config --no-env --no-hooks install rust@1.98.1 gh@2.102.0 actionlint@1.7.12 shellcheck@0.11.0 zizmor@1.30.1
      - name: Run actionlint
        shell: bash
        run: mise --no-config --no-env --no-hooks exec actionlint@1.7.12 shellcheck@0.11.0 -- actionlint -color
      - name: Run zizmor
        shell: bash
        run: mise --no-config --no-env --no-hooks exec zizmor@1.30.1 -- zizmor --no-online-audits --config .zizmor.yml .github/workflows
      - name: Require successful CI at exact main SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: "set -eu\ntest \"$GITHUB_REPOSITORY\" = 'tailrocks/velnor-new'\ntest \"$GITHUB_REF\" = 'refs/heads/main'\ntest \"$GITHUB_EVENT_NAME\" = 'workflow_dispatch'\ntest \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\"\ntest \"$(mise --no-config --no-env --no-hooks exec gh@2.102.0 -- gh api repos/tailrocks/velnor-new/commits/main --jq .sha)\" = \"$GITHUB_SHA\"\nruns=\"$(mise --no-config --no-env --no-hooks exec gh@2.102.0 -- gh api --paginate --slurp \"repos/tailrocks/velnor-new/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&per_page=100\")\"\nrun=\"$(printf '%s\\n' \"$runs\" | jq -ce --arg sha \"$GITHUB_SHA\" --arg repo 'tailrocks/velnor-new' '[.[] | (.workflow_runs // [])[] | select(.path == \".github/workflows/ci.yml\" and .head_sha == $sha and .head_branch == \"main\" and .head_repository.full_name == $repo and .event == \"push\")] | sort_by([.run_number, .id]) | last // error(\"no exact-source main CI run\")')\"\ntest \"$(printf '%s\\n' \"$run\" | jq -r .status)\" = completed\ntest \"$(printf '%s\\n' \"$run\" | jq -r .conclusion)\" = success\nrun_id=\"$(printf '%s\\n' \"$run\" | jq -r .id)\"\nattempt=\"$(printf '%s\\n' \"$run\" | jq -r .run_attempt)\"\njobs=\"$(mise --no-config --no-env --no-hooks exec gh@2.102.0 -- gh api --paginate --slurp \"repos/tailrocks/velnor-new/actions/runs/$run_id/attempts/$attempt/jobs?per_page=100\")\"\nprintf '%s\\n' \"$jobs\" | jq -e --arg sha \"$GITHUB_SHA\" '[.[] | (.jobs // [])[] | select(.name == \"Required\" and .head_sha == $sha and .head_branch == \"main\" and .status == \"completed\" and .conclusion == \"success\")] | length == 1' >/dev/null\ntest \"$(mise --no-config --no-env --no-hooks exec gh@2.102.0 -- gh api repos/tailrocks/velnor-new/commits/main --jq .sha)\" = \"$GITHUB_SHA\""
      - name: Check release freshness gate
        shell: bash
        run: bash scripts/check-freshness.sh
      - name: Recheck default-branch source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: "set -eu\ntest \"$GITHUB_REF\" = \"refs/heads/main\"\ntest \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\"\ntest \"$(mise --no-config --no-env --no-hooks exec gh@2.102.0 -- gh api repos/tailrocks/velnor-new/commits/main --jq .sha)\" = \"$GITHUB_SHA\""
  build-linux:
    name: Build Linux velnor-actions
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
    needs:
      - verify-release-source
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "1"
          persist-credentials: "false"
      - name: Build Linux velnor-actions
        uses: ./.github/actions/generator-release-build-linux # zizmor: ignore[self-repository]
      - name: Upload Linux assets
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: error
          name: generator-linux-assets
          path: generator-linux-assets.tar
          retention-days: 1
  qualify-linux:
    name: Qualify Linux velnor-actions
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    needs:
      - build-linux
    permissions: {}
    steps:
      - name: Fetch exact public source without an action post hook
        shell: bash
        run: "set -eu\npython3 - \"$GITHUB_WORKSPACE\" \"$GITHUB_REPOSITORY\" \"$GITHUB_SHA\" <<'PY'\nimport os\nimport re\nimport subprocess\nimport sys\n\nworkspace, repository, commit = sys.argv[1:]\nif repository != \"tailrocks/velnor-new\" or re.fullmatch(r\"[0-9a-f]{40}\", commit) is None:\n    raise SystemExit(\"qualification source identity is invalid\")\n\nenvironment = os.environ.copy()\nfor name in tuple(environment):\n    if name.startswith(\"GIT_\") or name in {\n        \"ACTIONS_ID_TOKEN_REQUEST_TOKEN\",\n        \"ACTIONS_ID_TOKEN_REQUEST_URL\",\n        \"ACTIONS_RUNTIME_TOKEN\",\n        \"GITHUB_TOKEN\",\n        \"GH_TOKEN\",\n        \"MISE_GITHUB_TOKEN\",\n    }:\n        environment.pop(name, None)\nenvironment.update(\n    GIT_CONFIG_GLOBAL=os.devnull,\n    GIT_CONFIG_NOSYSTEM=\"1\",\n    GIT_TERMINAL_PROMPT=\"0\",\n)\n\ndef run_git(*arguments, timeout):\n    subprocess.run(\n        [\"git\", *arguments],\n        cwd=workspace,\n        env=environment,\n        check=True,\n        timeout=timeout,\n    )\n\nrun_git(\"init\", \"--quiet\", timeout=10)\nrun_git(\n    \"-c\",\n    \"credential.helper=\",\n    \"fetch\",\n    \"--quiet\",\n    \"--depth=1\",\n    \"--no-tags\",\n    f\"https://github.com/{repository}.git\",\n    commit,\n    timeout=60,\n)\nrun_git(\"checkout\", \"--quiet\", \"--detach\", \"FETCH_HEAD\", timeout=10)\nhead = subprocess.run(\n    [\"git\", \"rev-parse\", \"HEAD\"],\n    cwd=workspace,\n    env=environment,\n    check=True,\n    capture_output=True,\n    text=True,\n    timeout=5,\n).stdout.strip()\nif head != commit:\n    raise SystemExit(\"qualification source does not match the requested commit\")\nPY"
      - name: Qualify Linux velnor-actions
        uses: ./.github/actions/generator-release-qualify-linux # zizmor: ignore[self-repository]
        with:
          artifact_id: ${{ needs.build-linux.outputs.artifact_id }}
  attest-linux:
    name: Attest Linux velnor-actions
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    needs:
      - build-linux
      - qualify-linux
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "1"
          persist-credentials: "false"
      - name: Attest Linux velnor-actions
        uses: ./.github/actions/generator-release-attest-linux # zizmor: ignore[self-repository]
        with:
          artifact_id: ${{ needs.build-linux.outputs.artifact_id }}
  build-macos:
    name: Build macOS velnor-actions
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
    needs:
      - verify-release-source
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "1"
          persist-credentials: "false"
      - name: Build macOS velnor-actions
        uses: ./.github/actions/generator-release-build-macos # zizmor: ignore[self-repository]
      - name: Upload macOS assets
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: error
          name: generator-macos-assets
          path: generator-macos-assets.tar
          retention-days: 1
  qualify-macos:
    name: Qualify macOS velnor-actions
    runs-on: macos-15
    timeout-minutes: 120
    needs:
      - build-macos
    permissions: {}
    steps:
      - name: Fetch exact public source without an action post hook
        shell: bash
        run: "set -eu\npython3 - \"$GITHUB_WORKSPACE\" \"$GITHUB_REPOSITORY\" \"$GITHUB_SHA\" <<'PY'\nimport os\nimport re\nimport subprocess\nimport sys\n\nworkspace, repository, commit = sys.argv[1:]\nif repository != \"tailrocks/velnor-new\" or re.fullmatch(r\"[0-9a-f]{40}\", commit) is None:\n    raise SystemExit(\"qualification source identity is invalid\")\n\nenvironment = os.environ.copy()\nfor name in tuple(environment):\n    if name.startswith(\"GIT_\") or name in {\n        \"ACTIONS_ID_TOKEN_REQUEST_TOKEN\",\n        \"ACTIONS_ID_TOKEN_REQUEST_URL\",\n        \"ACTIONS_RUNTIME_TOKEN\",\n        \"GITHUB_TOKEN\",\n        \"GH_TOKEN\",\n        \"MISE_GITHUB_TOKEN\",\n    }:\n        environment.pop(name, None)\nenvironment.update(\n    GIT_CONFIG_GLOBAL=os.devnull,\n    GIT_CONFIG_NOSYSTEM=\"1\",\n    GIT_TERMINAL_PROMPT=\"0\",\n)\n\ndef run_git(*arguments, timeout):\n    subprocess.run(\n        [\"git\", *arguments],\n        cwd=workspace,\n        env=environment,\n        check=True,\n        timeout=timeout,\n    )\n\nrun_git(\"init\", \"--quiet\", timeout=10)\nrun_git(\n    \"-c\",\n    \"credential.helper=\",\n    \"fetch\",\n    \"--quiet\",\n    \"--depth=1\",\n    \"--no-tags\",\n    f\"https://github.com/{repository}.git\",\n    commit,\n    timeout=60,\n)\nrun_git(\"checkout\", \"--quiet\", \"--detach\", \"FETCH_HEAD\", timeout=10)\nhead = subprocess.run(\n    [\"git\", \"rev-parse\", \"HEAD\"],\n    cwd=workspace,\n    env=environment,\n    check=True,\n    capture_output=True,\n    text=True,\n    timeout=5,\n).stdout.strip()\nif head != commit:\n    raise SystemExit(\"qualification source does not match the requested commit\")\nPY"
      - name: Qualify macOS velnor-actions
        uses: ./.github/actions/generator-release-qualify-macos # zizmor: ignore[self-repository]
        with:
          artifact_id: ${{ needs.build-macos.outputs.artifact_id }}
  attest-macos:
    name: Attest macOS velnor-actions
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    needs:
      - build-macos
      - qualify-macos
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "1"
          persist-credentials: "false"
      - name: Attest macOS velnor-actions
        uses: ./.github/actions/generator-release-attest-macos # zizmor: ignore[self-repository]
        with:
          artifact_id: ${{ needs.build-macos.outputs.artifact_id }}
  attest-manifest:
    name: Attest generator release manifest
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    needs:
      - attest-linux
      - attest-macos
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "1"
          persist-credentials: "false"
      - name: Attest generator release manifest
        uses: ./.github/actions/generator-release-manifest # zizmor: ignore[self-repository]
  publish-generator:
    name: Publish velnor-actions
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    needs:
      - attest-linux
      - attest-macos
      - attest-manifest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "1"
          persist-credentials: "false"
      - name: Publish generator release
        uses: ./.github/actions/generator-release-publish # zizmor: ignore[self-repository]
