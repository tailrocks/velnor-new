    name: Verify / Velnor Scale Set / Linux x64
    if: '${{ inputs.mode == ''both'' }}'
    permissions: {}
    runs-on: '${{ (!startsWith(github.event_name, ''pull_request'') || github.event.pull_request.head.repo.full_name == github.repository) && ''ubuntu-26.04-scale-set'' || ''ubuntu-26.04'' }}'
    timeout-minutes: 5
    steps:
      - name: Qualify scale-set lane
        run: echo qualification-scale-set
  compare:
    name: Compare hosted and Velnor execution
    needs:
      - verify-hosted
      - verify-scale-set
    if: '${{ inputs.mode == ''both'' }}'
    permissions: {}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Compare lanes
        run: echo compare-lanes
  artifacts-hosted:
    name: Artifacts / GitHub hosted
    if: '${{ inputs.mode == ''features'' || inputs.mode == ''artifacts'' }}'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Write proof
        run: 'echo g4-artifact > g4-proof.txt'
      - name: Upload proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: g4-proof-hosted
          path: g4-proof.txt
  artifacts-scale-set:
    name: Artifacts / Velnor Scale Set
    if: '${{ inputs.mode == ''features'' || inputs.mode == ''artifacts'' }}'
    permissions:
      actions: write
      contents: read
    runs-on: '${{ (!startsWith(github.event_name, ''pull_request'') || github.event.pull_request.head.repo.full_name == github.repository) && ''ubuntu-26.04-scale-set'' || ''ubuntu-26.04'' }}'
    timeout-minutes: 5
    steps:
      - name: Write proof
        run: 'echo g4-artifact > g4-proof.txt'
      - name: Upload proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: g4-proof-scale-set
          path: g4-proof.txt
  outputs-scale-set:
    name: Outputs / Velnor Scale Set
    if: '${{ inputs.mode == ''outputs'' }}'
    permissions: {}
    outputs:
      proof: '${{ steps.emit.outputs.proof }}'
    runs-on: '${{ (!startsWith(github.event_name, ''pull_request'') || github.event.pull_request.head.repo.full_name == github.repository) && ''ubuntu-26.04-scale-set'' || ''ubuntu-26.04'' }}'
    timeout-minutes: 5
    steps:
      - name: Create bin directory
        run: 'mkdir -p "$RUNNER_TEMP/g4-bin"'
      - name: Write path probe
        run: 'printf ''%s\n'' ''#!/bin/sh'' ''echo path-ok'' > "$RUNNER_TEMP/g4-bin/g4-path-ok"'
      - name: Make probe executable
        run: 'chmod +x "$RUNNER_TEMP/g4-bin/g4-path-ok"'
      - id: emit
        name: Write output
        run: 'echo proof=outputs-ok >> "$GITHUB_OUTPUT"'
      - name: Write env
        run: 'echo G4_ENV=outputs-ok >> "$GITHUB_ENV"'
      - name: Write path
        run: 'echo "$RUNNER_TEMP/g4-bin" >> "$GITHUB_PATH"'
      - name: Check env
        run: 'test "$G4_ENV" = outputs-ok'
      - name: Run path probe
        run: 'g4-path-ok > "$RUNNER_TEMP/g4-path-out"'
      - name: Check path probe
        run: 'grep -qx path-ok "$RUNNER_TEMP/g4-path-out"'
  outputs-hosted:
    name: Outputs / GitHub hosted
    needs:
      - outputs-scale-set
    if: '${{ inputs.mode == ''outputs'' }}'
    permissions: {}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check job output
        env:
          PROOF: '${{ needs.outputs-scale-set.outputs.proof }}'
        run: 'test "$PROOF" = outputs-ok'
  mise-pin-linux-x64:
    name: Mise pin / hosted / Linux x64
    if: '${{ inputs.mode == ''mise-pin'' }}'
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
      - name: Setup Mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d
        with:
          env: 'false'
          install: 'false'
          sha256: '7129dbab31d698f9028db9374f7ba7987232b0426f837dcbce437130a61415f9'
          version: '2026.11.1'
          cache: false
          cache_save: false
      - name: 'Verify selected ref, version, and binary digest'
        env:
          MISE_SHA256: '7129dbab31d698f9028db9374f7ba7987232b0426f837dcbce437130a61415f9'
          MISE_VERSION: '2026.11.1'
        run: bash qualification/mise-pin.sh
  stable-sources-producer-linux:
    name: Stable sources / linux / producer
    if: '${{ inputs.mode == ''stable-sources'' && github.event_name == ''workflow_dispatch'' && github.repository == ''tailrocks/velnor-new'' && startsWith(github.ref, ''refs/heads/'') && github.ref != format(''refs/heads/{0}'', github.event.repository.default_branch) }}'
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_digest: '${{ steps.upload.outputs.artifact-digest }}'
      artifact_id: '${{ steps.upload.outputs.artifact-id }}'
      attempt: '${{ steps.identity.outputs.attempt }}'
      root_lock: '${{ steps.identity.outputs.root_lock }}'
      runner_lock: '${{ steps.identity.outputs.runner_lock }}'
      tree: '${{ steps.identity.outputs.tree }}'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify branch source
        run: bash qualification/stable-sources.sh verify-source
      - name: Set up Mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d
        with:
          env: 'false'
          install: 'false'
          sha256: '7129dbab31d698f9028db9374f7ba7987232b0426f837dcbce437130a61415f9'
          version: '2026.11.1'
          cache: false
          cache_save: false
      - name: Resolve project tool versions
        run: bash qualification/stable-sources.sh resolve-tools
      - name: Install pinned qualification tools
        env:
          GITHUB_TOKEN: '${{ github.token }}'
        run: bash qualification/stable-sources.sh install-tools
      - name: Verify Rust channel manifest
        run: bash qualification/stable-sources.sh verify-rust
      - name: Prepare cold producer sources
        run: bash qualification/stable-sources.sh prepare-producer
      - id: identity
        name: Record producer identity
        run: bash qualification/stable-sources.sh record-identity
      - id: upload
        name: Upload exact source artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          include-hidden-files: 'true'
          name: '${{ steps.identity.outputs.upload_name }}'
          path: '${{ steps.identity.outputs.upload_path }}'
          retention-days: '1'
  stable-sources-linux-warm:
    name: Stable sources / linux / warm
    needs:
      - stable-sources-producer-linux
    if: '${{ inputs.mode == ''stable-sources'' && github.event_name == ''workflow_dispatch'' && github.repository == ''tailrocks/velnor-new'' && startsWith(github.ref, ''refs/heads/'') && github.ref != format(''refs/heads/{0}'', github.event.repository.default_branch) }}'
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify branch source
        run: bash qualification/stable-sources.sh verify-source
      - name: Set up Mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d
        with:
          env: 'false'
          install: 'false'
          sha256: '7129dbab31d698f9028db9374f7ba7987232b0426f837dcbce437130a61415f9'
          version: '2026.11.1'
          cache: false
          cache_save: false
      - name: Resolve project tool versions
        run: bash qualification/stable-sources.sh resolve-tools
      - name: Install pinned qualification tools
        env:
          GITHUB_TOKEN: '${{ github.token }}'
        run: bash qualification/stable-sources.sh install-tools
      - name: Verify Rust channel manifest
        run: bash qualification/stable-sources.sh verify-rust
      - name: Install pinned GitHub CLI
        run: mise --no-config --no-env --no-hooks install gh@2.104.0
      - name: Fetch exact source artifact metadata
        env:
          GH_TOKEN: '${{ github.token }}'
          SOURCES_ID: '${{ needs.stable-sources-producer-linux.outputs.artifact_id }}'
        run: bash qualification/stable-sources.sh fetch-metadata
      - id: admission
        name: Admit same-run source artifact
        env:
          SOURCES_ATTEMPT: '${{ needs.stable-sources-producer-linux.outputs.attempt }}'
          SOURCES_DIGEST: '${{ needs.stable-sources-producer-linux.outputs.artifact_digest }}'
          SOURCES_ID: '${{ needs.stable-sources-producer-linux.outputs.artifact_id }}'
          SOURCES_NAME: proof-linux
          SOURCES_ROOT_LOCK: '${{ needs.stable-sources-producer-linux.outputs.root_lock }}'
          SOURCES_RUNNER_LOCK: '${{ needs.stable-sources-producer-linux.outputs.runner_lock }}'
          SOURCES_TREE: '${{ needs.stable-sources-producer-linux.outputs.tree }}'
        run: bash qualification/stable-sources.sh admit
      - name: Require source artifact admission
        env:
          SOURCES_ADMITTED: '${{ steps.admission.outputs.admitted }}'
        run: 'test "$SOURCES_ADMITTED" = true'
      - id: validate
        name: Validate exact artifact ID
        env:
          VELNOR_EVIDENCE_ARTIFACT_ID: '${{ needs.stable-sources-producer-linux.outputs.artifact_id }}'
        run: bash qualification/stable-sources.sh validate-id
      - id: download
        name: Download exact admitted sources
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: '${{ needs.stable-sources-producer-linux.outputs.artifact_id }}'
          path: '${{ steps.validate.outputs.download_path }}'
      - name: Measure source preparation
        env:
          SOURCES_TREE: '${{ needs.stable-sources-producer-linux.outputs.tree }}'
        run: bash qualification/stable-sources.sh measure-warm
      - name: Require source provenance and fetch mode
        run: bash qualification/stable-sources.sh provenance-warm
      - name: Measure offline archive guard build
        run: bash qualification/stable-sources.sh archive-guard
  stable-sources-linux-cold:
