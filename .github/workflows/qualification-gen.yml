    if: '${{ inputs.mode == ''stable-sources'' && github.event_name == ''workflow_dispatch'' && github.repository == ''tailrocks/velnor-new'' && startsWith(github.ref, ''refs/heads/'') && github.ref != format(''refs/heads/{0}'', github.event.repository.default_branch) }}'
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
