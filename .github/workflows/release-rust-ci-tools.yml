name: Release Rust CI tools
"on":
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  push:
    tags:
      - rust-ci-v*
permissions: {}
cache-mode: read
concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: false
jobs:
  tag-ruleset-drift:
    name: Tag ruleset drift
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check tag immutability rulesets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          TAG_RULESET_ADMIN_READ_TOKEN: ${{ secrets.TAG_RULESET_ADMIN_READ_TOKEN }}
        with:
          github-token: ${{ secrets.TAG_RULESET_ADMIN_READ_TOKEN }}
          script: |
            if (!process.env.TAG_RULESET_ADMIN_READ_TOKEN) {
              throw new Error('Provision TAG_RULESET_ADMIN_READ_TOKEN with Administration: read (#949)');
            }
            const { owner, repo } = context.repo;
            const expectedBypassActors = new Map([
              ['protect-tags', []],
              ['release-tags', [{ actor_id: 5762496, actor_type: 'Integration', bypass_mode: 'always' }]]
            ]);
            const listed = await github.paginate('GET /repos/{owner}/{repo}/rulesets', {
              owner, repo, per_page: 100
            });
            const rulesets = [];
            for (const listedRuleset of listed.filter(rule => rule.target === 'tag' || expectedBypassActors.has(rule.name))) {
              const { data } = await github.request('GET /repos/{owner}/{repo}/rulesets/{ruleset_id}', {
                owner, repo, ruleset_id: listedRuleset.id
              });
              rulesets.push(data);
            }
            const baseline = rulesets.filter(rule => rule.name === 'protect-tags');
            const [protection] = baseline;
            if (baseline.length !== 1 || protection.target !== 'tag' || protection.enforcement !== 'active'
                || !protection.conditions?.ref_name?.include?.includes('~ALL')
                || protection.conditions?.ref_name?.exclude?.length !== 0
                || !['update', 'deletion'].every(type => protection.rules?.some(rule => rule.type === type))) {
              throw new Error('protect-tags must actively prevent all tag updates and deletion without exclusions');
            }
            const releases = rulesets.filter(rule => rule.name === 'release-tags');
            if (releases.length !== 1 || releases[0].target !== 'tag' || releases[0].enforcement !== 'active') {
              throw new Error('release-tags must be exactly one active tag ruleset');
            }
            const expectedReleaseRefs = ['refs/tags/rust-ci-v*', 'refs/tags/velnor-ci-v*', 'refs/tags/velnor-gen-v*'];
            const releaseRefs = releases[0].conditions?.ref_name;
            if (!Array.isArray(releaseRefs?.include) || releaseRefs.include.length !== expectedReleaseRefs.length
                || !expectedReleaseRefs.every(ref => releaseRefs.include.includes(ref))
                || !Array.isArray(releaseRefs.exclude) || releaseRefs.exclude.length !== 0
                || !Array.isArray(releases[0].rules) || !releases[0].rules.some(rule => rule.type === 'creation')) {
              throw new Error('release-tags must protect creation of exactly the release tag refs');
            }
            for (const ruleset of rulesets) {
              if (expectedBypassActors.has(ruleset.name) || ruleset.rules?.some(rule => ['update', 'deletion'].includes(rule.type))) {
                if (!Array.isArray(ruleset.bypass_actors)) {
                  throw new Error(`${ruleset.name}: bypass_actors unreadable; require Administration: read`);
                }
                const expected = expectedBypassActors.get(ruleset.name) ?? [];
                if (ruleset.bypass_actors.length !== expected.length
                    || !ruleset.bypass_actors.every(actor => expected.some(value =>
                      actor.actor_id === value.actor_id && actor.actor_type === value.actor_type
                      && actor.bypass_mode === value.bypass_mode))) {
                  throw new Error(`${ruleset.name}: tag immutability bypass actors detected`);
                }
              }
            }
  gate:
    name: Gate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rust-ci-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    steps:
      - name: Check that the tagged commit is on the default branch and passed Required
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$default_branch...$GITHUB_SHA" --jq .status)
          case "$status" in
            behind|identical) ;;
            *) echo "::error::$GITHUB_SHA is not on $default_branch (comparison: $status)"; exit 1 ;;
          esac
          conclusions=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | select(.name == "Required") | .conclusion // "pending"')
          echo "Required check runs on $GITHUB_SHA: $(echo $conclusions)"
          if echo "$conclusions" | grep -qvxE 'success|skipped|^$'; then
            echo "::error::a Required check run on $GITHUB_SHA did not succeed"; exit 1
          fi
          echo "$conclusions" | grep -qx success || { echo "::error::no successful Required check run on $GITHUB_SHA"; exit 1; }
  build:
    name: Build ${{ matrix.suffix }}
    needs: gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - suffix: linux-x64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            cc: musl-gcc
          - suffix: linux-arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            cc: musl-gcc
          - suffix: macos-arm64
            target: aarch64-apple-darwin
            runner: macos-15
            cc: cc
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install the musl C compiler
        if: runner.os == 'Linux'
        run: sudo apt-get install --yes musl-tools
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Add the target
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"
      - name: Build velnor-ci
        env:
          TARGET: ${{ matrix.target }}
          TARGET_CC: ${{ matrix.cc }}
          VELNOR_COMMIT: ${{ github.sha }}
        run: cargo build --release --locked --target "$TARGET" --manifest-path ci-helper/Cargo.toml
      - name: Build velnor-gen
        env:
          TARGET: ${{ matrix.target }}
          TARGET_CC: ${{ matrix.cc }}
          VELNOR_COMMIT: ${{ github.sha }}
        run: cargo build --release --locked --target "$TARGET" --manifest-path generator/Cargo.toml --package velnor-gen
      - name: Create the folder of release files
        run: mkdir dist
      - name: Name velnor-ci for its platform
        env:
          SUFFIX: ${{ matrix.suffix }}
          TARGET: ${{ matrix.target }}
        run: cp "ci-helper/target/$TARGET/release/velnor-ci" "dist/velnor-ci-$SUFFIX"
      - name: Name velnor-gen for its platform
        env:
          SUFFIX: ${{ matrix.suffix }}
          TARGET: ${{ matrix.target }}
        run: cp "generator/target/$TARGET/release/velnor-gen" "dist/velnor-gen-$SUFFIX"
      - name: Run velnor-ci
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: dist/velnor-ci-"$SUFFIX" --version
      - name: Run velnor-gen
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: dist/velnor-gen-"$SUFFIX" --version
      - name: Check the tag against the version of velnor-ci
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: dist/velnor-ci-"$SUFFIX" check-tag "$GITHUB_REF_NAME"
      - name: Check the tag against the version of velnor-gen
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: dist/velnor-gen-"$SUFFIX" check-tag "$GITHUB_REF_NAME"
      - name: Show the file sizes
        run: ls -l dist
      - name: Upload the binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: binaries-${{ matrix.suffix }}
          path: dist/
          if-no-files-found: error
          retention-days: 1
  checksums:
    name: Checksums
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Download the binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - name: Record the commit of the release
        run: echo "$GITHUB_SHA" > dist/COMMIT
      - name: Write SHA256SUMS
        working-directory: dist
        run: sha256sum COMMIT velnor-ci-linux-x64 velnor-ci-linux-arm64 velnor-ci-macos-arm64 velnor-gen-linux-x64 velnor-gen-linux-arm64 velnor-gen-macos-arm64 > SHA256SUMS
      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: SHA256SUMS
          path: |
            dist/SHA256SUMS
            dist/COMMIT
          if-no-files-found: error
          retention-days: 1
  release:
    name: Release
    needs: checksums
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - name: Download SHA256SUMS
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: SHA256SUMS
          path: dist
      - name: Verify every file against SHA256SUMS
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "$GITHUB_REF_NAME" --notes "Prebuilt velnor-ci and velnor-gen. Verify every download against SHA256SUMS." dist/SHA256SUMS dist/COMMIT dist/velnor-ci-linux-x64 dist/velnor-ci-linux-arm64 dist/velnor-ci-macos-arm64 dist/velnor-gen-linux-x64 dist/velnor-gen-linux-arm64 dist/velnor-gen-macos-arm64
