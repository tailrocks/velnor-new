name: Windows release qualification
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
cache-mode: read
permissions:
  contents: read
jobs:
  tracked-manifests:
    name: Windows tracked release manifests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        shell: pwsh
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Install pinned cargo-nextest
        shell: pwsh
        run: cargo +1.99.1 install --locked --version 0.9.151 cargo-nextest
      - name: Verify nested tracked manifests
        shell: pwsh
        run: cargo +1.99.1 nextest run --locked -p velnor-actions-rust --test tracked_manifest_public
      - name: Verify workspace manifest handling
        shell: pwsh
        run: cargo +1.99.1 nextest run --locked -p velnor-actions-rust --test release_workspace_cargo
