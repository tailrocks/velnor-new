      - name: velnor-ci inputs save
        if: '${{ !cancelled() && success() && steps.restored.outcome == ''success'' && steps.replan.outcome != ''failure'' && github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch) && (github.event_name == ''push'' || github.event_name == ''schedule'' || github.event_name == ''workflow_dispatch'') }}'
        working-directory: generator
        run: '. "$VELNOR_EXEC" inputs save --target-dir ../generator/target'
      - id: base
