          VELNOR_REPORT_STEPS: '${{ toJSON(steps) }}'
          VELNOR_REPORT_DEFAULT_BRANCH: '${{ github.event.repository.default_branch }}'
          VELNOR_TESTS_RUN: '${{ steps.test.outputs.tests_run }}'
        run: '. "$VELNOR_EXEC" report'
      - name: Upload cache metrics
        if: '${{ (steps.report_cache_metrics.outcome == ''success'') && (!cancelled()) }}'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 'ci-metrics-${{ github.job }}'
          path: '${{ runner.temp }}/ci-metrics.json'
          if-no-files-found: error
          retention-days: 3
          overwrite: true
  # one job: .velnor/rust-ci-timings.json has no build times for this workspace
  # jactionlint ignore=shellcheck
  rust-ci_helper:
    needs:
      - rust-plan
      - rust-inputs-audit
    if: '${{ (github.event_name != ''pull_request'' || (startsWith(github.ref, ''refs/pull/'') && github.event.pull_request.state != ''closed'')) && (!cancelled() && needs.rust-plan.outputs.rust_ci_helper_mode != ''none'') && (needs.rust-inputs-audit.result == ''success'' || needs.rust-inputs-audit.result == ''skipped'') }}'
    permissions:
      actions: read
      contents: read
    outputs:
      # jactionlint ignore=unused-job-output
      tests_run: '${{ steps.test.outputs.tests_run }}'
      # jactionlint ignore=unused-job-output
      tests_listed: '${{ steps.test.outputs.tests_listed }}'
      # jactionlint ignore=unused-job-output
      tests_by_package: '${{ steps.test.outputs.tests_by_package }}'
      base_prefix: 'velnor-tgt-rust-ci_helper.ci_helper.${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.compat }}-'
      base_save: '${{ steps.base.outputs.save }}'
      target_key: '${{ steps.target_key.outputs.key }}'
      sources_prefix: 'velnor-src-${{ runner.os }}-${{ runner.arch }}-ci_helper-'
      sources_saved: '${{ steps.sources_save_ci_helper.outcome == ''success'' }}'
      sources_key: '${{ steps.sources_ci_helper_key.outputs.key }}'
    runs-on: '${{ (!startsWith(github.event_name, ''pull_request'') || github.event.pull_request.head.repo.full_name == github.repository) && ''ubuntu-26.04-scale-set'' || ''ubuntu-latest'' }}'
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve released helper tools
        env:
          VELNOR_HELPER_INSTALL_TOOLS: *velnor_0
        run: 'eval "$VELNOR_HELPER_INSTALL_TOOLS"'
      - name: Install velnor-ci 0.1.83
        uses: tailrocks/velnor-new/actions/setup-velnor@084386b55a4cd889ee6001260abb907877de0a53  # rust-ci-v0.1.83
        with:
          version: '0.1.83'
          sha256-linux-x64: '0babd3dd59bf63e36632b86cb58f6e4e71ca7b4e5c73a29402e9193ea7ae7a86'
          sha256-linux-arm64: '51bbe5539dd95e112df22516b492008a9717294db9aa8e41942e99e681ade302'
          sha256-macos-arm64: '7a28203218e3e3eb0629b2a9aee4119e9b4a6587bd6a26495a490a2971da1e0c'
      - name: Install the released helper launcher
        env:
          VELNOR_HELPER_INSTALL_LAUNCHER: *velnor_1
          VELNOR_HELPER_LAUNCHER: *velnor_2
          VELNOR_HELPER_SHA256: *velnor_3
        run: 'eval "$VELNOR_HELPER_INSTALL_LAUNCHER"'
      - name: 'Configure the crates mirror in $RUNNER_TEMP/velnor-cargo/config.toml'
        if: '${{ runner.environment == ''self-hosted'' && (github.event_name != ''pull_request'' || github.event.pull_request.head.repo.full_name == github.repository) }}'
        run: '. "$VELNOR_EXEC" crates-mirror --registry ''sparse+https://crates-mirror.velnor-system.svc.cluster.local/index/'' --cainfo /opt/velnor/crates-mirror/ca-bundle.pem'
      - id: tools
        name: Restore the tools cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.local/share/mise
            ~/.rustup
          key: 'velnor-tools-${{ runner.os }}-${{ runner.arch }}-mise2026.11.9-${{ hashFiles(''mise.lock'') }}'
      - name: Install tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
        with:
          version: '2026.11.9'
          cache: false
      - name: 'Configure the crates mirror in $RUNNER_TEMP/velnor-cargo/config.toml'
        if: '${{ runner.environment == ''self-hosted'' && (github.event_name != ''pull_request'' || github.event.pull_request.head.repo.full_name == github.repository) }}'
        run: '. "$VELNOR_EXEC" crates-mirror --registry ''sparse+https://crates-mirror.velnor-system.svc.cluster.local/index/'' --cainfo /opt/velnor/crates-mirror/ca-bundle.pem'
      - name: Add Rust components
        working-directory: ci-helper
        run: rustup component add clippy rustfmt
      - name: Add Rust targets
        working-directory: ci-helper
        run: rustup target add aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu
      - id: save_tools
        name: Save the tools cache
        if: '${{ github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch) && steps.tools.outputs.cache-hit != ''true'' }}'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.local/share/mise
            ~/.rustup
          key: 'velnor-tools-${{ runner.os }}-${{ runner.arch }}-mise2026.11.9-${{ hashFiles(''mise.lock'') }}'
      - id: prepare
        name: velnor-ci prepare
        run: '. "$VELNOR_EXEC" prepare'
      - name: velnor-ci check-metadata
        working-directory: ci-helper
        run: '. "$VELNOR_EXEC" check-metadata'
      - id: sources_ci_helper
        name: Restore the sources cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: 'velnor-src-${{ runner.os }}-${{ runner.arch }}-ci_helper-${{ hashFiles(''ci-helper/Cargo.lock'') }}'
          restore-keys: 'velnor-src-${{ runner.os }}-${{ runner.arch }}-ci_helper-'
      - id: target_ci_helper
        name: Restore the target cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ci-helper/target
          key: 'velnor-tgt-rust-ci_helper.ci_helper.${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.compat }}-${{ hashFiles(''ci-helper/Cargo.lock'') }}-${{ github.sha }}-${{ github.run_id }}'
          restore-keys: |
            velnor-tgt-rust-ci_helper.ci_helper.${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.compat }}-${{ hashFiles('ci-helper/Cargo.lock') }}-
            velnor-tgt-rust-ci_helper.ci_helper.${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.compat }}-
      - name: velnor-ci inputs restore
        working-directory: ci-helper
        run: '. "$VELNOR_EXEC" inputs restore --target-dir ../ci-helper/target'
      - id: restored
        name: velnor-ci restored
        env:
          VELNOR_BASE_MAX_AGE_DAYS: '${{ github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch) && ''7'' || ''0'' }}'
          VELNOR_CACHE_TARGETS: |
            target
            ci-helper/target
            crates/velnor-runner/target
            generator/target
            local/target
        run: '. "$VELNOR_EXEC" restored'
      - id: replan
        name: velnor-ci plan --full
        if: '${{ steps.restored.outputs.expired == ''true'' }}'
        run: '. "$VELNOR_EXEC" plan --full'
      - name: Format
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' }}'
        working-directory: ci-helper
        run: '. "$VELNOR_EXEC" run -- cargo-fmt --all --check'
      - name: Lint
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' }}'
        working-directory: ci-helper
        run: '. "$VELNOR_EXEC" run -- cargo-clippy clippy --workspace --all-targets --locked --message-format=json-render-diagnostics -- -D warnings'
      - name: Documentation
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' && (steps.replan.outputs.rust_ci_helper_mode || needs.rust-plan.outputs.rust_ci_helper_mode) != ''none'' && (steps.replan.outputs.rust_ci_helper_docs || needs.rust-plan.outputs.rust_ci_helper_docs) == ''run'' && (steps.replan.outputs.rust_ci_helper_package_args || needs.rust-plan.outputs.rust_ci_helper_package_args) != '''' }}'
        working-directory: ci-helper
        run: '. "$VELNOR_EXEC" run -- cargo doc --workspace --no-deps --locked --config ''build.rustdocflags=["-D","warnings"]'' --message-format=json-render-diagnostics'
      - name: Check velnor-ci alone
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' && (contains(format('' {0} '', (steps.replan.outputs.rust_ci_helper_package_args || needs.rust-plan.outputs.rust_ci_helper_package_args)), '' -p velnor-ci '') || contains(format('' {0} '', (steps.replan.outputs.rust_ci_helper_package_args || needs.rust-plan.outputs.rust_ci_helper_package_args)), '' --workspace '')) }}'
        working-directory: ci-helper
        run: '. "$VELNOR_EXEC" run -- cargo check -p velnor-ci --locked --message-format=json-render-diagnostics'
      - name: Build the tests
        if: '${{ github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch) && (github.event_name == ''push'' || github.event_name == ''schedule'' || github.event_name == ''workflow_dispatch'') }}'
