        run: '. "$VELNOR_EXEC" run -- cargo-nextest nextest run --workspace --locked --cargo-message-format=json-render-diagnostics --ignore-default-filter --no-run'
      - name: Prepare test fixtures
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' }}'
