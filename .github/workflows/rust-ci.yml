        working-directory: crates/velnor-runner
        run: '. "$VELNOR_EXEC" run -- cargo-clippy clippy --workspace --all-targets --locked --message-format=json-render-diagnostics -- -D warnings'
      - name: Documentation
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' && (github.event_name == ''push'' || github.event_name == ''schedule'' || github.event_name == ''workflow_dispatch'') && (steps.replan.outputs.rust_crates_velnor_runner_mode || needs.rust-plan.outputs.rust_crates_velnor_runner_mode) != ''none'' && (steps.replan.outputs.rust_crates_velnor_runner_docs || needs.rust-plan.outputs.rust_crates_velnor_runner_docs) == ''run'' && (steps.replan.outputs.rust_crates_velnor_runner_package_args || needs.rust-plan.outputs.rust_crates_velnor_runner_package_args) != '''' }}'
        working-directory: crates/velnor-runner
        run: '. "$VELNOR_EXEC" run -- cargo doc --workspace --no-deps --locked --config ''build.rustdocflags=["-D","warnings"]'' --message-format=json-render-diagnostics'
      - name: Check velnor-resource-probe alone
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' && (contains(format('' {0} '', (steps.replan.outputs.rust_crates_velnor_runner_package_args || needs.rust-plan.outputs.rust_crates_velnor_runner_package_args)), '' -p velnor-resource-probe '') || contains(format('' {0} '', (steps.replan.outputs.rust_crates_velnor_runner_package_args || needs.rust-plan.outputs.rust_crates_velnor_runner_package_args)), '' --workspace '')) }}'
        working-directory: crates/velnor-runner
        run: '. "$VELNOR_EXEC" run -- cargo check -p velnor-resource-probe --locked --message-format=json-render-diagnostics'
      - name: Check velnor-runner-attestation alone
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' && (contains(format('' {0} '', (steps.replan.outputs.rust_crates_velnor_runner_package_args || needs.rust-plan.outputs.rust_crates_velnor_runner_package_args)), '' -p velnor-runner-attestation '') || contains(format('' {0} '', (steps.replan.outputs.rust_crates_velnor_runner_package_args || needs.rust-plan.outputs.rust_crates_velnor_runner_package_args)), '' --workspace '')) }}'
        working-directory: crates/velnor-runner
        run: '. "$VELNOR_EXEC" run -- cargo check -p velnor-runner-attestation --locked --message-format=json-render-diagnostics'
      - name: Check velnor-runner-cli alone
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' && (contains(format('' {0} '', (steps.replan.outputs.rust_crates_velnor_runner_package_args || needs.rust-plan.outputs.rust_crates_velnor_runner_package_args)), '' -p velnor-runner-cli '') || contains(format('' {0} '', (steps.replan.outputs.rust_crates_velnor_runner_package_args || needs.rust-plan.outputs.rust_crates_velnor_runner_package_args)), '' --workspace '')) }}'
        working-directory: crates/velnor-runner
        run: '. "$VELNOR_EXEC" run -- cargo check -p velnor-runner-cli --locked --message-format=json-render-diagnostics'
      - name: Check velnor-runner-core alone
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' && (contains(format('' {0} '', (steps.replan.outputs.rust_crates_velnor_runner_package_args || needs.rust-plan.outputs.rust_crates_velnor_runner_package_args)), '' -p velnor-runner-core '') || contains(format('' {0} '', (steps.replan.outputs.rust_crates_velnor_runner_package_args || needs.rust-plan.outputs.rust_crates_velnor_runner_package_args)), '' --workspace '')) }}'
        working-directory: crates/velnor-runner
        run: '. "$VELNOR_EXEC" run -- cargo check -p velnor-runner-core --locked --message-format=json-render-diagnostics'
      - name: Check velnor-runner-github alone
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' && (contains(format('' {0} '', (steps.replan.outputs.rust_crates_velnor_runner_package_args || needs.rust-plan.outputs.rust_crates_velnor_runner_package_args)), '' -p velnor-runner-github '') || contains(format('' {0} '', (steps.replan.outputs.rust_crates_velnor_runner_package_args || needs.rust-plan.outputs.rust_crates_velnor_runner_package_args)), '' --workspace '')) }}'
        working-directory: crates/velnor-runner
        run: '. "$VELNOR_EXEC" run -- cargo check -p velnor-runner-github --locked --message-format=json-render-diagnostics'
      - name: Check velnor-runner-host alone
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' && (contains(format('' {0} '', (steps.replan.outputs.rust_crates_velnor_runner_package_args || needs.rust-plan.outputs.rust_crates_velnor_runner_package_args)), '' -p velnor-runner-host '') || contains(format('' {0} '', (steps.replan.outputs.rust_crates_velnor_runner_package_args || needs.rust-plan.outputs.rust_crates_velnor_runner_package_args)), '' --workspace '')) }}'
        working-directory: crates/velnor-runner
        run: '. "$VELNOR_EXEC" run -- cargo check -p velnor-runner-host --locked --message-format=json-render-diagnostics'
      - name: Check velnor-runner-image-manifest alone
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' && (contains(format('' {0} '', (steps.replan.outputs.rust_crates_velnor_runner_package_args || needs.rust-plan.outputs.rust_crates_velnor_runner_package_args)), '' -p velnor-runner-image-manifest '') || contains(format('' {0} '', (steps.replan.outputs.rust_crates_velnor_runner_package_args || needs.rust-plan.outputs.rust_crates_velnor_runner_package_args)), '' --workspace '')) }}'
        working-directory: crates/velnor-runner
        run: '. "$VELNOR_EXEC" run -- cargo check -p velnor-runner-image-manifest --locked --message-format=json-render-diagnostics'
      - name: Check velnor-runner-qualification alone
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' && (contains(format('' {0} '', (steps.replan.outputs.rust_crates_velnor_runner_package_args || needs.rust-plan.outputs.rust_crates_velnor_runner_package_args)), '' -p velnor-runner-qualification '') || contains(format('' {0} '', (steps.replan.outputs.rust_crates_velnor_runner_package_args || needs.rust-plan.outputs.rust_crates_velnor_runner_package_args)), '' --workspace '')) }}'
        working-directory: crates/velnor-runner
        run: '. "$VELNOR_EXEC" run -- cargo check -p velnor-runner-qualification --locked --message-format=json-render-diagnostics'
      - name: Build the tests
        if: '${{ github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch) && (github.event_name == ''push'' || github.event_name == ''schedule'' || github.event_name == ''workflow_dispatch'') && github.event.pull_request.draft != true && (github.event.action != ''labeled'' || github.event.label.name == ''ci:run'' || github.event.label.name == ''ci:auto'') && (github.event.action != ''edited'' || github.event.changes.base != null) && (github.event_name != ''pull_request'' || (github.event.pull_request.head.repo.full_name == github.repository && (contains(github.event.pull_request.labels.*.name, ''ci:run'') || contains(github.event.pull_request.labels.*.name, ''ci:auto'')))) }}'
        working-directory: crates/velnor-runner
        run: '. "$VELNOR_EXEC" run -- cargo-nextest nextest run --workspace --locked --cargo-message-format=json-render-diagnostics --ignore-default-filter --no-run'
      - id: test
        name: Test
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' && github.event.pull_request.draft != true && (github.event.action != ''labeled'' || github.event.label.name == ''ci:run'' || github.event.label.name == ''ci:auto'') && (github.event.action != ''edited'' || github.event.changes.base != null) && (github.event_name != ''pull_request'' || (github.event.pull_request.head.repo.full_name == github.repository && (contains(github.event.pull_request.labels.*.name, ''ci:run'') || contains(github.event.pull_request.labels.*.name, ''ci:auto'')))) }}'
        working-directory: crates/velnor-runner
        env:
          TEST_FILTER: '${{ steps.replan.outputs.rust_crates_velnor_runner_test_filter || needs.rust-plan.outputs.rust_crates_velnor_runner_test_filter }}'
        run: '. "$VELNOR_EXEC" run -- cargo-nextest nextest run --workspace --locked --cargo-message-format=json-render-diagnostics --profile ci --no-fail-fast --ignore-default-filter --status-level pass -E "$TEST_FILTER" --no-tests=pass'
      - name: velnor-ci inputs save
        if: '${{ !cancelled() && success() && steps.restored.outcome == ''success'' && steps.replan.outcome != ''failure'' && github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch) && (github.event_name == ''push'' || github.event_name == ''schedule'' || github.event_name == ''workflow_dispatch'') }}'
        working-directory: crates/velnor-runner
        run: '. "$VELNOR_EXEC" inputs save --target-dir ../../crates/velnor-runner/target'
      - id: base
        name: Decide whether to save the build directory
        if: '${{ (!cancelled() && success() && steps.restored.outcome == ''success'' && steps.replan.outcome != ''failure'' && github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch) && (github.event_name == ''push'' || github.event_name == ''schedule'' || github.event_name == ''workflow_dispatch'')) && (steps.restored.outputs.expired != ''true'' || needs.rust-inputs-audit.result == ''success'') }}'
        env:
          VELNOR_CACHE_MANIFESTS: |
            Cargo.toml
            ci-helper/Cargo.toml
            crates/velnor-runner/Cargo.toml
            generator/Cargo.toml
            local/Cargo.toml
        run: '. "$VELNOR_EXEC" cache decide --target-dir crates/velnor-runner/target'
      - id: save_target_crates_velnor_runner
        name: Save the target cache
        if: '${{ (!cancelled() && success() && steps.restored.outcome == ''success'' && steps.replan.outcome != ''failure'' && github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch) && (github.event_name == ''push'' || github.event_name == ''schedule'' || github.event_name == ''workflow_dispatch'') && steps.base.outputs.save == ''true'') && (steps.restored.outputs.expired != ''true'' || needs.rust-inputs-audit.result == ''success'') }}'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: crates/velnor-runner/target
          key: 'velnor-tgt-rust-crates_velnor_runner.crates_velnor_runner.${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.compat }}-${{ steps.prepare.outputs.lock_crates_velnor_runner }}-${{ github.sha }}-${{ github.run_id }}'
      - id: target_key
        name: Record the target cache key
        if: '${{ (!cancelled() && success() && steps.restored.outcome == ''success'' && steps.replan.outcome != ''failure'' && github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch) && (github.event_name == ''push'' || github.event_name == ''schedule'' || github.event_name == ''workflow_dispatch'') && steps.base.outputs.save == ''true'') && (steps.restored.outputs.expired != ''true'' || needs.rust-inputs-audit.result == ''success'') }}'
        env:
          CACHE_KEY: 'velnor-tgt-rust-crates_velnor_runner.crates_velnor_runner.${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.compat }}-${{ steps.prepare.outputs.lock_crates_velnor_runner }}-${{ github.sha }}-${{ github.run_id }}'
        run: 'echo "key=$CACHE_KEY" >> "$GITHUB_OUTPUT"'
      - id: sources_fetch_all
        name: Fetch the sources of every root
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' && success() && steps.base.outputs.sources == ''true'' && steps.sources_crates_velnor_runner.outputs.cache-hit != ''true'' }}'
        continue-on-error: true
        run: '. "$VELNOR_EXEC" sources fetch --roots . ./ci-helper ./crates/velnor-runner ./generator ./local'
      - id: sources_save_crates_velnor_runner
        name: Save the sources cache
        if: '${{ (!cancelled() && success() && steps.restored.outcome == ''success'' && steps.replan.outcome != ''failure'' && github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch) && (github.event_name == ''push'' || github.event_name == ''schedule'' || github.event_name == ''workflow_dispatch'') && steps.base.outputs.sources == ''true'' && steps.sources_crates_velnor_runner.outputs.cache-hit != ''true'') && (steps.sources_fetch_all.outcome == ''success'') }}'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: 'velnor-src-${{ runner.os }}-${{ runner.arch }}-all.roots-${{ steps.sources_locks.outputs.hash }}'
      - id: sources_crates_velnor_runner_key
        name: Record the sources cache key
        if: '${{ (!cancelled() && success() && steps.restored.outcome == ''success'' && steps.replan.outcome != ''failure'' && github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch) && (github.event_name == ''push'' || github.event_name == ''schedule'' || github.event_name == ''workflow_dispatch'') && steps.base.outputs.sources == ''true'' && steps.sources_crates_velnor_runner.outputs.cache-hit != ''true'') && (steps.sources_fetch_all.outcome == ''success'') }}'
        env:
          CACHE_KEY: 'velnor-src-${{ runner.os }}-${{ runner.arch }}-all.roots-${{ steps.sources_locks.outputs.hash }}'
        run: 'echo "key=$CACHE_KEY" >> "$GITHUB_OUTPUT"'
      - id: report_cache_metrics
        name: Report cache telemetry
        if: '${{ !cancelled() }}'
        continue-on-error: true
        env:
          VELNOR_REPORT_CACHES: '[{"family":"tools","restore_step":"tools","root":null,"save_step":"save_tools"},{"family":"sources","restore_step":"sources_crates_velnor_runner","root":null,"save_step":"sources_save_crates_velnor_runner"},{"family":"target","restore_step":"target_crates_velnor_runner","root":"crates/velnor-runner","save_step":"save_target_crates_velnor_runner"}]'
          VELNOR_REPORT_STEPS: '${{ toJSON(steps) }}'
          VELNOR_REPORT_DEFAULT_BRANCH: '${{ github.event.repository.default_branch }}'
          VELNOR_TESTS_RUN: '${{ steps.test.outputs.tests_run }}'
        run: '. "$VELNOR_EXEC" report'
      - name: Upload cache metrics
        if: '${{ (steps.report_cache_metrics.outcome == ''success'') && (!cancelled()) }}'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 'ci-metrics-${{ github.job }}'
          path: '${{ runner.temp }}/ci-metrics.json'
          if-no-files-found: error
          retention-days: 3
          overwrite: true
  # one job: .velnor/rust-ci-timings.json has no build times for this workspace
  # jactionlint ignore=shellcheck
  rust-generator:
    needs:
      - rust-plan
      - rust-inputs-audit
    if: '${{ (github.event_name != ''pull_request'' || (startsWith(github.ref, ''refs/pull/'') && github.event.pull_request.state != ''closed'')) && (!cancelled() && github.event.pull_request.draft != true && (github.event.action != ''labeled'' || github.event.label.name == ''ci:run'' || github.event.label.name == ''ci:auto'') && (github.event.action != ''edited'' || github.event.changes.base != null) && needs.rust-plan.result == ''success'' && needs.rust-plan.outputs.rust_generator_mode != ''none'') && (needs.rust-inputs-audit.result == ''success'' || needs.rust-inputs-audit.result == ''skipped'') }}'
    permissions:
      actions: read
      contents: read
    outputs:
      # jactionlint ignore=unused-job-output
      tests_run: '${{ steps.test.outputs.tests_run }}'
      # jactionlint ignore=unused-job-output
      tests_listed: '${{ steps.test.outputs.tests_listed }}'
      # jactionlint ignore=unused-job-output
      tests_ignored: '${{ steps.test.outputs.tests_ignored }}'
      # jactionlint ignore=unused-job-output
      tests_by_package: '${{ steps.test.outputs.tests_by_package }}'
      base_prefix: 'velnor-tgt-rust-generator.generator.${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.compat }}-'
      base_save: '${{ steps.base.outputs.save }}'
      target_key: '${{ steps.target_key.outputs.key }}'
      sources_prefix: 'velnor-src-${{ runner.os }}-${{ runner.arch }}-all.roots-'
      sources_saved: '${{ steps.sources_save_generator.outcome == ''success'' }}'
      sources_key: '${{ steps.sources_generator_key.outputs.key }}'
    runs-on: '${{ (!startsWith(github.event_name, ''pull_request'') || github.event.pull_request.head.repo.full_name == github.repository) && ''ubuntu-26.04-scale-set'' || ''ubuntu-latest'' }}'
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: '${{ github.workspace }}/generator/target'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve released helper tools
        env:
          VELNOR_HELPER_INSTALL_TOOLS: *velnor_0
        run: 'eval "$VELNOR_HELPER_INSTALL_TOOLS"'
      - name: Install velnor-ci 0.1.90
        uses: tailrocks/velnor-new/actions/setup-velnor@29931d53b4d5f11477669c38b2fcda9ab584a26a  # tools-v0.1.90
        with:
          version: '0.1.90'
          sha256-linux-x64: b74e6a27fc444e2336560c17bc7562c80e65d93131ec3ffe341eee65d6cc973d
          sha256-linux-arm64: '3b5bc063606d49d4cb4fbffdb7a753b3ebecb36e72316f848048298b275b3cd7'
      - name: Install the released helper launcher
        env:
          VELNOR_HELPER_INSTALL_LAUNCHER: *velnor_1
          VELNOR_HELPER_LAUNCHER: *velnor_2
          VELNOR_HELPER_SHA256: *velnor_3
        run: 'eval "$VELNOR_HELPER_INSTALL_LAUNCHER"'
      - name: velnor-ci mbx-store
        run: '. "$VELNOR_EXEC" mbx-store'
      - name: velnor-ci mbx-seed
        if: '${{ github.event_name == ''pull_request'' || github.event_name == ''merge_group'' }}'
        run: '. "$VELNOR_EXEC" mbx-seed'
      - name: 'Configure the crates mirror in $RUNNER_TEMP/velnor-cargo/config.toml'
        if: '${{ runner.environment == ''self-hosted'' && (github.event_name != ''pull_request'' || github.event.pull_request.head.repo.full_name == github.repository) }}'
        run: '. "$VELNOR_EXEC" crates-mirror --registry ''sparse+https://crates-mirror.velnor-system.svc.cluster.local/index/'' --cainfo /opt/velnor/crates-mirror/ca-bundle.pem'
      - id: toolslocal
        name: Restore the tools from the node store
        env:
          VELNOR_TOOLS_KEY: 'velnor-tools-${{ runner.os }}-${{ runner.arch }}-mise2026.11.10-${{ hashFiles(''mise.lock'') }}'
        run: '. "$VELNOR_EXEC" tools-local restore --key "$VELNOR_TOOLS_KEY"'
      - id: tools
        name: Restore the tools cache
        if: '${{ steps.toolslocal.outputs.hit != ''true'' }}'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.local/share/mise
            ~/.rustup
          key: 'velnor-tools-${{ runner.os }}-${{ runner.arch }}-mise2026.11.10-${{ hashFiles(''mise.lock'') }}'
      - name: Install tools
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d
        with:
          version: '2026.11.10'
          cache: false
      - name: 'Configure the crates mirror in $RUNNER_TEMP/velnor-cargo/config.toml'
        if: '${{ runner.environment == ''self-hosted'' && (github.event_name != ''pull_request'' || github.event.pull_request.head.repo.full_name == github.repository) }}'
        run: '. "$VELNOR_EXEC" crates-mirror --registry ''sparse+https://crates-mirror.velnor-system.svc.cluster.local/index/'' --cainfo /opt/velnor/crates-mirror/ca-bundle.pem'
      - name: Add Rust components
        working-directory: generator
        run: rustup component add clippy rustfmt
      - name: Add Rust targets
        working-directory: generator
        run: rustup target add aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu
      - name: Save the tools to the node store
        if: '${{ github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch) && (github.event_name == ''push'' || github.event_name == ''schedule'' || github.event_name == ''workflow_dispatch'') }}'
        env:
          VELNOR_TOOLS_KEY: 'velnor-tools-${{ runner.os }}-${{ runner.arch }}-mise2026.11.10-${{ hashFiles(''mise.lock'') }}'
        run: '. "$VELNOR_EXEC" tools-local save --key "$VELNOR_TOOLS_KEY"'
      - id: save_tools
        name: Save the tools cache
        if: '${{ github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch) && steps.tools.outputs.cache-hit != ''true'' && steps.toolslocal.outputs.hit != ''true'' }}'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.local/share/mise
            ~/.rustup
          key: 'velnor-tools-${{ runner.os }}-${{ runner.arch }}-mise2026.11.10-${{ hashFiles(''mise.lock'') }}'
      - id: prepare
        name: velnor-ci prepare
        run: '. "$VELNOR_EXEC" prepare'
      - name: velnor-ci check-metadata
        working-directory: generator
        run: '. "$VELNOR_EXEC" check-metadata'
      - id: sources_locks
        name: Hash the sources lockfiles
        env:
          SOURCES_LOCKS: *velnor_4
