        uses: tailrocks/velnor-new/actions/setup-velnor@084386b55a4cd889ee6001260abb907877de0a53  # rust-ci-v0.1.83
        with:
          version: '0.1.83'
          sha256-linux-x64: '0babd3dd59bf63e36632b86cb58f6e4e71ca7b4e5c73a29402e9193ea7ae7a86'
          sha256-linux-arm64: '51bbe5539dd95e112df22516b492008a9717294db9aa8e41942e99e681ade302'
          sha256-macos-arm64: '7a28203218e3e3eb0629b2a9aee4119e9b4a6587bd6a26495a490a2971da1e0c'
      - name: Install the released helper launcher
