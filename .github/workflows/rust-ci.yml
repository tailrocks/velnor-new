          if-no-files-found: error
          retention-days: 3
          overwrite: true
  # one job: .velnor/rust-ci-timings.json has no build times for this workspace
  # jactionlint ignore=shellcheck
  rust-local:
    needs:
      - rust-plan
      - rust-inputs-audit
    if: '${{ (github.event_name != ''pull_request'' || (startsWith(github.ref, ''refs/pull/'') && github.event.pull_request.state != ''closed'')) && (!cancelled() && github.event.pull_request.draft != true && (github.event.action != ''labeled'' || github.event.label.name == ''ci:run'' || github.event.label.name == ''ci:auto'') && (github.event.action != ''edited'' || github.event.changes.base != null) && needs.rust-plan.result == ''success'' && needs.rust-plan.outputs.rust_local_mode != ''none'') && (needs.rust-inputs-audit.result == ''success'' || needs.rust-inputs-audit.result == ''skipped'') }}'
