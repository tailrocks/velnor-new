      - name: velnor-ci gate
        env:
          NEEDS_JSON: '${{ toJSON(needs) }}'
          GATE_SPEC: '--plan rust-plan --job rust-plan=always --job rust-helper=lane:ci_helper --job rust-root=lane:root --job rust-ci_helper=lane:ci_helper --job rust-crates_velnor_runner=lane:crates_velnor_runner --job rust-generator=lane:generator --job rust-local=lane:local --job rust-inputs-audit=schedule-or-dispatch --job policy=policy --tests rust-root=root --tests rust-ci_helper=ci_helper --tests rust-crates_velnor_runner=crates_velnor_runner --tests rust-generator=generator --tests rust-local=local'
        run: '. "$VELNOR_EXEC" gate --spec-env GATE_SPEC'
  # jactionlint ignore=shellcheck
  cache:
    name: Cache
    needs:
      - rust-helper
      - rust-root
      - rust-ci_helper
      - rust-crates_velnor_runner
      - rust-generator
      - rust-local
      - rust-inputs-audit
      - policy
      - rust-trim
    if: '${{ (github.event_name != ''pull_request'' || (startsWith(github.ref, ''refs/pull/'') && github.event.pull_request.state != ''closed'')) && (!cancelled()) }}'
    permissions:
      actions: read
      contents: read
    runs-on: '${{ (!startsWith(github.event_name, ''pull_request'') || github.event.pull_request.head.repo.full_name == github.repository) && ''ubuntu-26.04-scale-set'' || ''ubuntu-latest'' }}'
    timeout-minutes: 30
    steps:
      - name: Resolve released helper tools
        env:
          VELNOR_HELPER_INSTALL_TOOLS: *velnor_0
        run: 'eval "$VELNOR_HELPER_INSTALL_TOOLS"'
      - name: Install velnor-ci 0.1.83
        uses: tailrocks/velnor-new/actions/setup-velnor@084386b55a4cd889ee6001260abb907877de0a53  # rust-ci-v0.1.83
        with:
          version: '0.1.83'
          sha256-linux-x64: '0babd3dd59bf63e36632b86cb58f6e4e71ca7b4e5c73a29402e9193ea7ae7a86'
          sha256-linux-arm64: '51bbe5539dd95e112df22516b492008a9717294db9aa8e41942e99e681ade302'
          sha256-macos-arm64: '7a28203218e3e3eb0629b2a9aee4119e9b4a6587bd6a26495a490a2971da1e0c'
      - name: Install the released helper launcher
        env:
          VELNOR_HELPER_INSTALL_LAUNCHER: *velnor_1
          VELNOR_HELPER_LAUNCHER: *velnor_2
          VELNOR_HELPER_SHA256: *velnor_3
        run: 'eval "$VELNOR_HELPER_INSTALL_LAUNCHER"'
      - name: Download cache metrics
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: 'ci-metrics-*'
          path: '${{ runner.temp }}/ci-metrics'
      - name: Check cache waste
        env:
          VELNOR_REPORT_NEEDS: '${{ toJSON(needs) }}'
          GITHUB_TOKEN: '${{ (github.event_name != ''pull_request'' || github.event.pull_request.head.repo.full_name == github.repository) && github.token || '''' }}'
          VELNOR_REPORT_DEFAULT_BRANCH: '${{ github.event.repository.default_branch }}'
        run: '. "$VELNOR_EXEC" report --check "$RUNNER_TEMP/ci-metrics"'
