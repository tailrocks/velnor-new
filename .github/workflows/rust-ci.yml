          VELNOR_CACHE_TARGETS: |
            target
            ci-helper/target
            crates/velnor-runner/target
            generator/target
            local/target
        run: '. "$VELNOR_EXEC" restored'
      - id: replan
        name: velnor-ci plan --full
        if: '${{ steps.restored.outputs.expired == ''true'' }}'
        run: '. "$VELNOR_EXEC" plan --full'
      - name: Format
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' }}'
        working-directory: local
        run: '. "$VELNOR_EXEC" run -- cargo-fmt --all --check'
      - name: Lint
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' }}'
        working-directory: local
        run: '. "$VELNOR_EXEC" run -- cargo-clippy clippy --workspace --all-targets --locked --message-format=json-render-diagnostics -- -D warnings'
