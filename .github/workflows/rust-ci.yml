        with:
          version: '0.1.90'
          sha256-linux-x64: b74e6a27fc444e2336560c17bc7562c80e65d93131ec3ffe341eee65d6cc973d
          sha256-linux-arm64: '3b5bc063606d49d4cb4fbffdb7a753b3ebecb36e72316f848048298b275b3cd7'
      - name: Install the released helper launcher
        env:
          VELNOR_HELPER_INSTALL_LAUNCHER: *velnor_1
          VELNOR_HELPER_LAUNCHER: *velnor_2
          VELNOR_HELPER_SHA256: *velnor_3
        run: 'eval "$VELNOR_HELPER_INSTALL_LAUNCHER"'
