/expected\"; done < \"$d/tarballs\"; (cd \"$t\" && find . -type f ! -path ./lib/rustlib/components ! -path \"./lib/rustlib/manifest-*\" ! -path ./lib/rustlib/multirust-channel-manifest.toml ! -path ./lib/rustlib/multirust-config.toml ! -path ./lib/rustlib/rust-installer-version -exec $h {} +) > \"$d/installed\"; LC_ALL=C sort -k2 \"$d/expected\" > \"$d/expected.sorted\"; LC_ALL=C sort -k2 \"$d/installed\" > \"$d/installed.sorted\"; if ! cmp -s \"$d/expected.sorted\" \"$d/installed.sorted\"; then LC_ALL=C diff \"$d/expected.sorted\" \"$d/installed.sorted\" | head -n 20 >&2 || true; fail \"rust_toolchain_bytes_mismatch: $t differs from the component tarballs of the verified channel-rust-$v.toml\"; fi; printf \"%s\\n\" \"velnor: Rust $v toolchain verified file by file against the component tarballs of channel-rust-$v.toml (SHA-256 $want)\"'"
      - name: Build exact-source native image maintenance
        shell: bash
        run: "set -euo pipefail\ntrusted_git() { /usr/bin/env -i PATH=/usr/bin:/bin GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_OPTIONAL_LOCKS=0 /usr/bin/git --git-dir=\"$GITHUB_WORKSPACE/.git\" --work-tree=\"$GITHUB_WORKSPACE\" -c core.fsmonitor=false \"$@\"; }\nsource_sha=\"$(trusted_git rev-parse --verify HEAD)\"\ntest \"$source_sha\" = \"$GITHUB_SHA\"\ntest \"$GITHUB_WORKFLOW_SHA\" = \"$GITHUB_SHA\"\nif ! trusted_git diff --cached --quiet --no-ext-diff --no-textconv --ignore-submodules=none || ! trusted_git diff --quiet --no-ext-diff --no-textconv --ignore-submodules=none; then\n  printf '%s\\n' 'The source checkout is not clean.' >&2\n  exit 1\nfi\nstatus_file=\"$(mktemp \"$RUNNER_TEMP/velnor-image-source-status.XXXXXXXX\")\"\ntrusted_git status --porcelain=v1 --untracked-files=all --ignore-submodules=none -z > \"$status_file\"\nif [[ -s \"$status_file\" ]]; then\n  printf '%s\\n' 'The source checkout is not clean.' >&2\n  exit 1\nfi\nenv -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_RUNTIME_TOKEN -u GITHUB_TOKEN -u MISE_GITHUB_TOKEN -u GH_TOKEN -u GH_HOST -u GH_CONFIG_DIR mise --no-config --no-env --no-hooks exec 'rust@'\"${VELNOR_TOOL_RUST}\" 'mr-boxington@'\"${VELNOR_TOOL_MR_BOXINGTON}\" -- mbx build --release --locked --package velnor-actions-cli --bin velnor-actions\ntest -f target/release/velnor-actions && test ! -L target/release/velnor-actions\numask 077\nimage_binary_dir=\"$(mktemp -d \"$RUNNER_TEMP/velnor-native-image-actions.XXXXXXXX\")\"\nimage_binary=\"$image_binary_dir/velnor-native-image-actions\"\n( set -o noclobber; cat target/release/velnor-actions > \"$image_binary\" )\nchmod 0500 \"$image_binary\"\nprintf 'VELNOR_NATIVE_IMAGE_ACTIONS=%s\\n' \"$image_binary\" >> \"$GITHUB_ENV\""
      - name: Examine the uploaded artifact ID
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs.build-image-candidate.outputs.artifact_id }}
        run: "if [[ ! \"$ARTIFACT_ID\" =~ ^[1-9][0-9]*$ ]]; then\n  printf '%s\\n' 'The artifact ID is missing or incorrect.' >&2\n  exit 1\nfi"
      - name: Download the job image candidate from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build-image-candidate.outputs.artifact_id }}
          path: ${{ runner.temp }}/privatecandidate
      - name: Do a check of source and archive identity
        shell: bash
        run: "\"$VELNOR_NATIVE_IMAGE_ACTIONS\" image-maintenance validate-job-candidate --root \"$GITHUB_WORKSPACE\" --archive-path \"$RUNNER_TEMP/privatecandidate/job-image.oci.tar\" --record-path \"$RUNNER_TEMP/privatecandidate/job-image-candidate.json\" --source-closure-path \"$RUNNER_TEMP/privatecandidate/job-image-native-source-closure.json\""
      - name: Attest all candidate bytes.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: "${{ runner.temp }}/privatecandidate/job-image.oci.tar\n${{ runner.temp }}/privatecandidate/job-image-candidate.json\n${{ runner.temp }}/privatecandidate/job-image-native-source-closure.json"
  publish-job-image:
    name: Publish Linux job image
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs:
      - build-image-candidate
      - attest-image-candidate
    concurrency:
      group: ${{ github.repository }}-job-image-publish
      cancel-in-progress: false
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: write
    steps:
      - name: Use the source commit selected by GitHub.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Examine the uploaded artifact ID
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs.build-image-candidate.outputs.artifact_id }}
        run: "if [[ ! \"$ARTIFACT_ID\" =~ ^[1-9][0-9]*$ ]]; then\n  printf '%s\\n' 'The artifact ID is missing or incorrect.' >&2\n  exit 1\nfi"
      - name: Download the job image candidate from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build-image-candidate.outputs.artifact_id }}
          path: candidate
      - name: Publish the job image with its signed build evidence.
        shell: bash
        run: "python3 images/job/ubuntu-26.04/candidate/publish.py --root . --archive \"candidate/job-image.oci.tar\" --record \"candidate/job-image-candidate.json\" --result \"$RUNNER_TEMP/job-image-publication.json\""
        env:
          GH_TOKEN: ${{ github.token }}
          VELNOR_CANDIDATE_ARTIFACT_ID: ${{ needs.build-image-candidate.outputs.artifact_id }}
      - name: Upload job image publication evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: velnor-job-image-publication-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/job-image-publication.json
          if-no-files-found: error
          retention-days: 7
