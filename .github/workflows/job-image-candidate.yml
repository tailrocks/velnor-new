ile by file against the component tarballs of channel-rust-$v.toml (SHA-256 $want)\"'"
      - name: Build exact-source native image maintenance
        shell: bash
        run: "set -euo pipefail\ntrusted_git() { /usr/bin/env -i PATH=/usr/bin:/bin GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_OPTIONAL_LOCKS=0 /usr/bin/git --git-dir=\"$GITHUB_WORKSPACE/.git\" --work-tree=\"$GITHUB_WORKSPACE\" -c core.fsmonitor=false \"$@\"; }\nsource_sha=\"$(trusted_git rev-parse --verify HEAD)\"\ntest \"$source_sha\" = \"$GITHUB_SHA\"\ntest \"$GITHUB_WORKFLOW_SHA\" = \"$GITHUB_SHA\"\nif ! trusted_git diff --cached --quiet --no-ext-diff --no-textconv --ignore-submodules=none || ! trusted_git diff --quiet --no-ext-diff --no-textconv --ignore-submodules=none; then\n  printf '%s\\n' 'The source checkout is not clean.' >&2\n  exit 1\nfi\nstatus_file=\"$(mktemp \"$RUNNER_TEMP/velnor-image-source-status.XXXXXXXX\")\"\ntrusted_git status --porcelain=v1 --untracked-files=all --ignore-submodules=none -z > \"$status_file\"\nif [[ -s \"$status_file\" ]]; then\n  printf '%s\\n' 'The source checkout is not clean.' >&2\n  exit 1\nfi\nmetadata_file=\"$(mktemp \"$RUNNER_TEMP/velnor-native-image-metadata.XXXXXXXX\")\"\nartifacts_file=\"$(mktemp \"$RUNNER_TEMP/velnor-native-image-artifacts.XXXXXXXX\")\"\ntrap 'rm -f \"$metadata_file\" \"$artifacts_file\"' EXIT\ncargo metadata --locked --format-version=1 --filter-platform x86_64-unknown-linux-gnu > \"$metadata_file\"\nenv -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_RUNTIME_TOKEN -u GITHUB_TOKEN -u MISE_GITHUB_TOKEN -u GH_TOKEN -u GH_HOST -u GH_CONFIG_DIR mise --no-config --no-env --no-hooks exec 'rust@'\"${VELNOR_TOOL_RUST}\" 'mr-boxington@'\"${VELNOR_TOOL_MR_BOXINGTON}\" -- mbx build --release --locked --package velnor-actions-cli --bin velnor-actions --message-format=json > \"$artifacts_file\"\npython3 scripts/native-image-candidate-inventory.py --check --root \"$GITHUB_WORKSPACE\" --metadata \"$metadata_file\" --artifacts \"$artifacts_file\" --target x86_64-unknown-linux-gnu\ntest -f target/release/velnor-actions && test ! -L target/release/velnor-actions\numask 077\nimage_binary_dir=\"$(mktemp -d \"$RUNNER_TEMP/velnor-native-image-actions.XXXXXXXX\")\"\nimage_binary=\"$image_binary_dir/velnor-native-image-actions\"\n( set -o noclobber; cat target/release/velnor-actions > \"$image_binary\" )\nchmod 0500 \"$image_binary\"\nprintf 'VELNOR_NATIVE_IMAGE_ACTIONS=%s\\n' \"$image_binary\" >> \"$GITHUB_ENV\""
      - name: Verify native implementation source closure
        shell: bash
        run: "\"$VELNOR_NATIVE_IMAGE_ACTIONS\" image-maintenance check-job-source --root \"$GITHUB_WORKSPACE\" --source-commit \"$GITHUB_SHA\" --source-closure-path \"$RUNNER_TEMP/job-image-native-source-closure.json\""
      - name: Install the Buildx plugin from .velnor/runner.lock
        shell: bash
        run: "\"$VELNOR_NATIVE_IMAGE_ACTIONS\" image-maintenance install-buildx --root \"$GITHUB_WORKSPACE\" --runner-temp \"$RUNNER_TEMP\""
      - name: Build the job image candidate
        shell: bash
        run: "\"$VELNOR_NATIVE_IMAGE_ACTIONS\" image-maintenance build-job-candidate --root \"$GITHUB_WORKSPACE\" --source-commit \"$GITHUB_SHA\" --runner-temp \"$RUNNER_TEMP\" --archive-path \"$RUNNER_TEMP/job-image.oci.tar\" --record-path \"$RUNNER_TEMP/job-image-candidate.json\" --source-closure-path \"$RUNNER_TEMP/job-image-native-source-closure.json\""
      - name: Upload candidate archive and record
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: velnor-job-image-candidate-${{ github.run_attempt }}
          path: "${{ runner.temp }}/job-image.oci.tar\n${{ runner.temp }}/job-image-candidate.json\n${{ runner.temp }}/job-image-native-source-closure.json"
          if-no-files-found: error
          retention-days: 30
  attest-image-candidate:
    name: Attest Linux job image candidate
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs:
      - build-image-candidate
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Examine the uploaded artifact ID
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs.build-image-candidate.outputs.artifact_id }}
        run: "if [[ ! \"$ARTIFACT_ID\" =~ ^[1-9][0-9]*$ ]]; then\n  printf '%s\\n' 'The artifact ID is missing or incorrect.' >&2\n  exit 1\nfi"
      - name: Download the job image candidate from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build-image-candidate.outputs.artifact_id }}
          path: ${{ runner.temp }}/privatecandidate
      - name: Materialize fixed script
        shell: bash
        run: "set -euo pipefail\numask 077\ndir=\"$(mktemp -d \"$RUNNER_TEMP/velnor-fixed-script.XXXXXXXX\")\"\nchmod 0700 \"$dir\"\nexport VELNOR_FIXED_SCRIPT_DIR=\"$dir\"\nprintf 'VELNOR_FIXED_SCRIPT_DIR=%s\\n' \"$dir\" >> \"$GITHUB_ENV\"\nset -C\nprintf '%s' '' > \"$VELNOR_FIXED_SCRIPT_DIR/script.sh.b64\"\n"
      - name: Write fixed authority source script.sh (2/6)
        shell: bash
        run: "set -euo pipefail\numask 077\nprintf '%s' '' >> \"$VELNOR_FIXED_SCRIPT_DIR/script.sh.b64\"\n"
      - name: Write fixed authority source script.sh (3/6)
        shell: bash
        run: "set -euo pipefail\numask 077\nprintf '%s' '' >> \"$VELNOR_FIXED_SCRIPT_DIR/script.sh.b64\"\n"
      - name: Write fixed authority source script.sh (4/6)
        shell: bash
        run: "set -euo pipefail\numask 077\nprintf '%s' '' >> \"$VELNOR_FIXED_SCRIPT_DIR/script.sh.b64\"\n"
      - name: Write fixed authority source script.sh (5/6)
        shell: bash
        run: "set -euo pipefail\numask 077\nprintf '%s' '' >> \"$VELNOR_FIXED_SCRIPT_DIR/script.sh.b64\"\n"
      - name: Write fixed authority source script.sh (6/6)
        shell: bash
        run: "set -euo pipefail\numask 077\nprintf '%s' '' >> \"$VELNOR_FIXED_SCRIPT_DIR/script.sh.b64\"\n/usr/bin/python3 -I -S -c 'import base64,sys; data=base64.b64decode(sys.stdin.buffer.read(), validate=True); open(sys.argv[1], \"xb\").write(data)' \"$VELNOR_FIXED_SCRIPT_DIR/script.sh\" < \"$VELNOR_FIXED_SCRIPT_DIR/script.sh.b64\"\nchmod 0400 \"$VELNOR_FIXED_SCRIPT_DIR/script.sh\"\nrm \"$VELNOR_FIXED_SCRIPT_DIR/script.sh.b64\"\n"
      - name: Materialize fixed image authority implementation
        shell: bash
        run: "/usr/bin/python3 -I -S -c 'import hashlib,sys; sys.exit(hashlib.sha256(open(sys.argv[1], \"rb\").read()).hexdigest() != sys.argv[2])' \"$VELNOR_FIXED_SCRIPT_DIR/script.sh\" '375f0ab62a68329f328195e8ae8e6c80b3477338254112e9b7449a4b23090b6d'\nexec \"$BASH\" --noprofile --norc -e -o pipefail \"$VELNOR_FIXED_SCRIPT_DIR/script.sh\""
      - name: Verify candidate bytes with the fixed authority body
        shell: bash
        env:
          VELNOR_EXPECTED_SOURCE: ${{ github.sha }}
          VELNOR_EXPECTED_REF: ${{ github.ref }}
          VELNOR_EXPECTED_REPOSITORY: ${{ github.repository }}
          VELNOR_EXPECTED_EVENT: ${{ github.event_name }}
          VELNOR_EXPECTED_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/job-image-candidate.yml@${{ github.ref }}
          VELNOR_EXPECTED_RUN_ID: ${{ github.run_id }}
          VELNOR_EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: "set -euo pipefail\nauthority=\"$VELNOR_IMAGE_AUTHORITY_DIR\"\narchive=\"$RUNNER_TEMP/privatecandidate/job-image.oci.tar\"\nrecord=\"$RUNNER_TEMP/privatecandidate/job-image-candidate.json\"\nclosure=\"$RUNNER_TEMP/privatecandidate/job-image-native-source-closure.json\"\npython3 - \"$authority\" \"$record\" \"$archive\" \"$closure\" <<'VELNOR_IMAGE_VERIFY_EOF'\nimport hashlib\nimport json\nimport os\nimport sys\nsys.path.insert(0, sys.argv[1])\nfrom pathlib import Path\nimport job_image_authority_identity as identity_module\nimport job_image_authority_oci as oci_module\nimport job_image_authority_publish as publish_module\nimport job_image_authority_record as record_module\nrecord_path = Path(sys.argv[2])\narchive_path = Path(sys.argv[3])\nclosure_path = Path(sys.argv[4])\nrecord = record_module.validate_record(record_module.load_record(record_path))\nverified = oci_module.verify_oci_archive(archive_path)\nhasher = hashlib.sha256()\narchive_size = 0\nwith archive_path.open(\"rb\") as archive_stream:\n    while chunk := archive_stream.read(1048576):\n        hasher.update(chunk)\n        archive_size += len(chunk)\npublish_module.check_record_binding(\n    record,\n    hasher.hexdigest(),\n    archive_size,\n    verified,\n)\ntry:\n    expected_run_id = int(os.environ[\"VELNOR_EXPECTED_RUN_ID\"])\n    expected_run_attempt = int(os.environ[\"VELNOR_EXPECTED_RUN_ATTEMPT\"])\nexcept ValueError as error:\n    raise publish_module.AuthorityError(\"Candidate run identity is incorrect.\") from error\nidentity = {\n    \"repository\": os.environ[\"VELNOR_EXPECTED_REPOSITORY\"],\n    \"event\": os.environ[\"VELNOR_EXPECTED_EVENT\"],\n    \"workflow_ref\": os.environ[\"VELNOR_EXPECTED_WORKFLOW_REF\"],\n    \"ref\": os.environ[\"VELNOR_EXPECTED_REF\"],\n    \"authority_commit\": os.environ[\"VELNOR_EXPECTED_SOURCE\"],\n    \"run_id\": expected_run_id,\n    \"run_attempt\": expected_run_attempt,\n    \"source\": os.environ[\"VELNOR_EXPECTED_SOURCE\"],\n}\nidentity_module.validate_same_run_candidate(record, identity)\nif closure_path.is_symlink() or not closure_path.is_file():\n    raise publish_module.AuthorityError(\"Candidate source closure must be a regular file.\")\nif closure_path.stat().st_size > 1048576:\n    raise publish_module.AuthorityError(\"Candidate source closure exceeds its size limit.\")\ntry:\n    closure = json.loads(closure_path.read_bytes())\nexcept (UnicodeDecodeError, json.JSONDecodeError) as error:\n    raise publish_module.AuthorityError(\"Candidate source closure has an incorrect format.\") from error\nif (\n    not isinstance(closure, dict)\n    or closure.get(\"schema\") != \"velnor.job-image-native-source-closure.v1\"\n):\n    raise publish_module.AuthorityError(\"Candidate source closure has an incorrect schema.\")\nif closure.get(\"source_commit\") != os.environ[\"VELNOR_EXPECTED_SOURCE\"]:\n    raise publish_module.AuthorityError(\"Candidate source closure is not the current run source.\")\nprint(\"fixed authority body accepted the candidate bytes\")\nVELNOR_IMAGE_VERIFY_EOF\n"
