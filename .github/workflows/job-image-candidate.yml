        run: "set -euo pipefail\ngh() { mise --no-config --no-env --no-hooks exec gh@2.103.3 -- gh \"$@\"; }\nrepo=tailrocks/velnor-new\nsha=\"$GITHUB_SHA\"\n[[ \"$GITHUB_REPOSITORY\" == \"$repo\" && \"$GITHUB_EVENT_NAME\" == push && \"$GITHUB_REF\" == refs/heads/main && \"${GITHUB_REF_PROTECTED:-}\" == true ]]\n[[ \"$sha\" =~ ^[0-9a-f]{40}$ && \"$GITHUB_WORKFLOW_SHA\" == \"$sha\" ]]\nbase=\"$RUNNER_TEMP/velnor-ci-candidate-fetch\"\n[[ ! -e \"$base\" ]]\numask 077\nmkdir -m 700 \"$base\"\n# SPDX-FileCopyrightText: 2026 Alexey Zhokhov\n# SPDX-License-Identifier: Apache-2.0\n\n: \"${base:?}\" \"${repo:?}\" \"${sha:?}\"\n\nlist_runs() {\n  workflow=$1\n  : > \"$base/runs.jsonl\"\n  page=1\n  while [ \"$page\" -le 10 ]; do\n    gh api \"repos/$repo/actions/workflows/$workflow/runs?head_sha=$sha&event=push&per_page=100&page=$page\" > \"$base/page.json\"\n    count=$(jq -er '.workflow_runs | length | select(. <= 100)' \"$base/page.json\")\n    jq -c --arg sha \"$sha\" '.workflow_runs[] | select(.head_sha == $sha and .event == \"push\" and .head_branch == \"main\" and .head_repository.id == 1390620900)' \"$base/page.json\" >> \"$base/runs.jsonl\"\n    [ \"$count\" -lt 100 ] && break\n    page=$((page + 1))\n  done\n  [ \"$page\" -le 10 ]\n  jq -s -er 'sort_by(.id) | last | select(.status == \"completed\" and .conclusion == \"success\") | [.id, .run_attempt] | @tsv' \"$base/runs.jsonl\"\n}\nfind_artifact() {\n  run=$1\n  name=$2\n  : > \"$base/artifacts.jsonl\"\n  page=1\n  while [ \"$page\" -le 10 ]; do\n    gh api \"repos/$repo/actions/runs/$run/artifacts?per_page=100&page=$page\" > \"$base/page.json\"\n    count=$(jq -er '.artifacts | length | select(. <= 100)' \"$base/page.json\")\n    jq -c --arg name \"$name\" '.artifacts[] | select(.name == $name and .expired == false)' \"$base/page.json\" >> \"$base/artifacts.jsonl\"\n    [ \"$count\" -lt 100 ] && break\n    page=$((page + 1))\n  done\n  [ \"$page\" -le 10 ]\n  jq -s -er 'if length == 1 and .[0].id > 0 then .[0].id else error(\"artifact identity\") end' \"$base/artifacts.jsonl\"\n}\nvalidate_required() {\n  run=$1\n  attempt=$2\n  : > \"$base/jobs.jsonl\"\n  page=1\n  while [ \"$page\" -le 10 ]; do\n    gh api \"repos/$repo/actions/runs/$run/attempts/$attempt/jobs?per_page=100&page=$page\" > \"$base/page.json\"\n    count=$(jq -er '.jobs | length | select(. <= 100)' \"$base/page.json\")\n    jq -c '.jobs[] | select(.name == \"Required\")' \"$base/page.json\" >> \"$base/jobs.jsonl\"\n    [ \"$count\" -lt 100 ] && break\n    page=$((page + 1))\n  done\n  [ \"$page\" -le 10 ]\n  jq -s -e 'length == 1 and .[0].status == \"completed\" and .[0].conclusion == \"success\"' \"$base/jobs.jsonl\" > /dev/null\n}\n# SPDX-FileCopyrightText: 2026 Alexey Zhokhov\n# SPDX-License-Identifier: Apache-2.0\n\n: \"${base:?}\" \"${repo:?}\"\n\ndownload_artifact() {\n  download_id=$1\n  destination=$2\n  shift 2\n  archive_file=\"$base/download-$download_id.zip\"\n  (ulimit -f 12582912; gh api \"repos/$repo/actions/artifacts/$download_id/zip\" > \"$archive_file\")\n  python3 - \"$archive_file\" \"$destination\" \"$@\" <<'PY'\n# SPDX-FileCopyrightText: 2026 Alexey Zhokhov\n# SPDX-License-Identifier: Apache-2.0\n\nimport os\nimport stat\nimport sys\nimport zipfile\n\narchive, destination, *expected = sys.argv[1:]\nif len(expected) != len(set(expected)):\n    raise SystemExit(\"duplicate expected artifact member\")\nwith zipfile.ZipFile(archive) as source:\n    entries = source.infolist()\n    names = [entry.filename for entry in entries]\n    if len(names) != len(set(names)) or set(names) != set(expected):\n        raise SystemExit(\"artifact inventory mismatch\")\n    total = 0\n    for entry in entries:\n        mode = entry.external_attr >> 16\n        if (not entry.filename or \"/\" in entry.filename or \"\\\\\" in entry.filename\n                or entry.filename in (\".\", \"..\") or entry.is_dir()\n                or (stat.S_IFMT(mode) not in (0, stat.S_IFREG))\n                or entry.file_size <= 0 or entry.file_size > 4 * 1024**3):\n            raise SystemExit(\"invalid artifact member\")\n        total += entry.file_size\n        if total > 12 * 1024**3:\n            raise SystemExit(\"artifact too large\")\n    for entry in entries:\n        path = os.path.join(destination, entry.filename)\n        descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)\n        written = 0\n        with source.open(entry) as input_file, os.fdopen(descriptor, \"wb\") as output_file:\n            while True:\n                block = input_file.read(1024 * 1024)\n                if not block:\n                    break\n                written += len(block)\n                if written > entry.file_size:\n                    raise SystemExit(\"artifact member exceeded size\")\n                output_file.write(block)\n        if written != entry.file_size:\n            raise SystemExit(\"artifact member truncated\")\n\nPY\n}\nready=false\nretry=0\nwhile [ \"$retry\" -lt 300 ]; do\n  if ci=$(list_runs ci.yml); then ready=true; break; fi\n  retry=$((retry + 1))\n  sleep 10\ndone\n[[ \"$ready\" == true ]]\nci_id=$(printf '%s\\n' \"$ci\" | cut -f1)\nci_attempt=$(printf '%s\\n' \"$ci\" | cut -f2)\nvalidate_required \"$ci_id\" \"$ci_attempt\"\nartifact=\"velnor-job-image-candidate-$ci_attempt\"\nartifact_id=$(find_artifact \"$ci_id\" \"$artifact\")\ndestination=\"$RUNNER_TEMP/privatecandidate\"\n[[ ! -e \"$destination\" ]]\nmkdir -m 700 \"$destination\"\ndownload_artifact \"$artifact_id\" \"$destination\" job-image.oci.tar job-image-candidate.json job-image-native-source-closure.json\n[[ \"$(list_runs ci.yml)\" == \"$ci\" ]]\nprintf 'producer_run_id=%s\\nproducer_run_attempt=%s\\nartifact_id=%s\\n' \"$ci_id\" \"$ci_attempt\" \"$artifact_id\" >> \"$GITHUB_OUTPUT\"\n"
      - name: Materialize fixed image authority implementation
