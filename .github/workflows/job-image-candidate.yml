        run: "set -euo pipefail\nauthority=\"$VELNOR_IMAGE_AUTHORITY_DIR\"\narchive=\"candidate/job-image.oci.tar\"\nrecord=\"candidate/job-image-candidate.json\"\nresult=\"$RUNNER_TEMP/job-image-publication.json\"\nci_runs=\"$RUNNER_TEMP/velnor-ci-runs.json\"\nauthenticated_source=\"$RUNNER_TEMP/velnor-authenticated-source.json\"\nartifact_response=\"$RUNNER_TEMP/velnor-candidate-artifact.json\"\narchive_attestation=\"$RUNNER_TEMP/velnor-archive-attestation.json\"\nrecord_attestation=\"$RUNNER_TEMP/velnor-record-attestation.json\"\npython3 - \"$authority\" \"$record\" \"$archive\" \"$result\" \"$ci_runs\" \"$authenticated_source\" \"$artifact_response\" \"$archive_attestation\" \"$record_attestation\" candidate/job-image-native-source-closure.json <<'VELNOR_IMAGE_EVIDENCE_EOF'\nimport hashlib\nimport http.client\nimport json\nimport os\nimport sys\nimport tempfile\nfrom pathlib import Path\nfrom urllib.parse import urlsplit, urlunsplit\nimport job_image_authority_identity as identity_module\nimport job_image_authority_oci as oci_module\nimport job_image_authority_publish as publish_module\nimport job_image_authority_record as record_module\nimport job_image_authority_registry as registry_module\nRESPONSE_BODY_LIMIT = 65536\nclass _RegistryResponse:\n    def __init__(self, status, headers, body):\n        self.status = status\n        self.headers = {key.lower(): value for key, value in headers.items()}\n        self.body = body\nclass _RegistryStream:\n    def __init__(self, connection, response):\n        self.status = response.status\n        self.headers = {key.lower(): value for key, value in response.getheaders()}\n        self._connection = connection\n        self._response = response\n    def read(self, size=-1):\n        try:\n            return self._response.read(size)\n        except (OSError, http.client.HTTPException, TimeoutError) as error:\n            raise publish_module.AuthorityError(\"Registry request failed or timed out.\") from error\n    def