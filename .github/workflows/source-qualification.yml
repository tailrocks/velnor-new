          workspace="$(sed -n 's/^retaining \(successful golden evidence\|failed golden\) workspace: //p' "$evidence/logs/repository-oracle-check.log" | tail -n 1)"
          printf '%s\n' "$workspace" >"$evidence/logs/repository-oracle-workspace.txt"
          case "$workspace" in
