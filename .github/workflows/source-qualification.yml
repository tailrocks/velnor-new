          persist-credentials: "false"
      - name: Download ordinary-harness evidence
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: source-qualification-ordinary-harness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-qualification-jobs/ordinary-harness
      - name: Download keep-harness evidence
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: source-qualification-keep-harness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-qualification-jobs/keep-harness
      - name: Download generation-checks evidence
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: source-qualification-generation-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-qualification-jobs/generation-checks
      - name: Bundle selected qualification evidence
        if: always()
        shell: bash
        run: bash scripts/generator-release/source-qualification.sh bundle-selected-qualification-evidence
      - name: Upload source qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-qualification-artifacts/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Require every producer job to succeed
        if: needs.ordinary-harness.result != 'success' || needs.keep-harness.result != 'success' || needs.generation-checks.result != 'success'
        shell: bash
        run: printf 'a producer job did not succeed\n' >&2; exit 1
