name: Source qualification

"on":
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: source-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-qualification:
    name: Source qualification
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      MBX_GC_AUTO: "0"
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - name: Checkout exact event source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: "2"
          persist-credentials: "false"

      - name: Prepare external evidence directories
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_TEMP" in
            /*) ;;
            *) printf 'FATAL: RUNNER_TEMP must be absolute\n' >&2; exit 1 ;;
          esac
          workspace="$(cd "$GITHUB_WORKSPACE" && pwd -P)"
          evidence="$RUNNER_TEMP/source-qualification-artifacts"
          mkdir -p "$evidence/logs" "$evidence/previews"
          mkdir -p "$RUNNER_TEMP/velnor-source-qualification-tmp"
          mise_data="$RUNNER_TEMP/velnor-source-qualification-mise-data"
          mise_cache="$RUNNER_TEMP/velnor-source-qualification-mise-cache"
          mise_state="$RUNNER_TEMP/velnor-source-qualification-mise-state"
          for path in "$mise_data" "$mise_cache" "$mise_state"; do
            if [ -e "$path" ] || [ -L "$path" ]; then
              printf 'FATAL: isolated Mise path already exists or is unsafe: %s\n' "$path" >&2
              exit 1
            fi
            mkdir -m 700 "$path"
          done
          evidence="$(cd "$evidence" && pwd -P)"
          case "$evidence" in
            "$workspace"|"$workspace"/*)
              printf 'FATAL: qualification evidence must stay outside the checkout\n' >&2
              exit 1
              ;;
          esac
          {
            printf 'CARGO_TARGET_DIR=%s/velnor-source-qualification-target\n' "$RUNNER_TEMP"
            printf 'CARGO_HOME=%s/velnor-source-qualification-cargo-home\n' "$RUNNER_TEMP"
            printf 'MISE_DATA_DIR=%s\n' "$mise_data"
            printf 'MISE_CACHE_DIR=%s\n' "$mise_cache"
            printf 'MISE_STATE_DIR=%s\n' "$mise_state"
            printf 'MISE_AUTO_INSTALL=0\n'
          } >>"$GITHUB_ENV"
          {
            printf 'CARGO_TARGET_DIR=%s/velnor-source-qualification-target\n' "$RUNNER_TEMP"
            printf 'CARGO_HOME=%s/velnor-source-qualification-cargo-home\n' "$RUNNER_TEMP"
            printf 'MISE_DATA_DIR=%s\n' "$mise_data"
            printf 'MISE_CACHE_DIR=%s\n' "$mise_cache"
            printf 'MISE_STATE_DIR=%s\n' "$mise_state"
          } >"$evidence/build-environment.txt"

      - name: Verify exact clean source checkout
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/source-qualification-artifacts"
          actual_head="$(GIT_OPTIONAL_LOCKS=0 git rev-parse HEAD)"
          actual_tree="$(GIT_OPTIONAL_LOCKS=0 git rev-parse 'HEAD^{tree}')"
          test "$actual_head" = "$GITHUB_SHA"
          test "$GITHUB_REPOSITORY" = tailrocks/velnor-new
          pr_head_commit=not-applicable
          pr_head_tree=not-applicable
          pr_base_commit=not-applicable
          pr_base_tree=not-applicable
          merge_parent_1=not-applicable
          merge_parent_2=not-applicable
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if ! [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] \
              || ! [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo 'FATAL: pull_request event lacks exact head/base commit SHAs' >&2
              exit 1
            fi
            pr_head_commit="$(GIT_OPTIONAL_LOCKS=0 git rev-parse "${PR_HEAD_SHA}^{commit}")"
            pr_head_tree="$(GIT_OPTIONAL_LOCKS=0 git rev-parse "${PR_HEAD_SHA}^{tree}")"
            pr_base_commit="$(GIT_OPTIONAL_LOCKS=0 git rev-parse "${PR_BASE_SHA}^{commit}")"
            pr_base_tree="$(GIT_OPTIONAL_LOCKS=0 git rev-parse "${PR_BASE_SHA}^{tree}")"
            merge_parent_1="$(GIT_OPTIONAL_LOCKS=0 git rev-parse 'HEAD^1')"
            merge_parent_2="$(GIT_OPTIONAL_LOCKS=0 git rev-parse 'HEAD^2')"
            test "$pr_head_commit" = "$PR_HEAD_SHA"
            test "$pr_base_commit" = "$PR_BASE_SHA"
            test "$merge_parent_1" = "$PR_BASE_SHA"
            test "$merge_parent_2" = "$PR_HEAD_SHA"
          fi
          GIT_OPTIONAL_LOCKS=0 git status --porcelain=v1 --untracked-files=all >"$evidence/checkout-status.txt"
          test ! -s "$evidence/checkout-status.txt"
          {
            printf 'event=%s\n' "$GITHUB_EVENT_NAME"
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'ref=%s\n' "$GITHUB_REF"
            printf 'github_sha=%s\n' "$GITHUB_SHA"
            printf 'workflow_ref=%s\n' "$GITHUB_WORKFLOW_REF"
            printf 'workflow_sha=%s\n' "$GITHUB_WORKFLOW_SHA"
            printf 'checkout_head=%s\n' "$actual_head"
            printf 'checkout_tree=%s\n' "$actual_tree"
            printf 'pr_head_sha=%s\n' "$pr_head_commit"
            printf 'pr_head_tree=%s\n' "$pr_head_tree"
            printf 'pr_base_sha=%s\n' "$pr_base_commit"
            printf 'pr_base_tree=%s\n' "$pr_base_tree"
            printf 'merge_parent_1=%s\n' "$merge_parent_1"
            printf 'merge_parent_2=%s\n' "$merge_parent_2"
            printf 'worktree=clean\n'
            printf 'runner=%s/%s\n' "$RUNNER_OS" "$RUNNER_ARCH"
          } | tee "$evidence/source-identity.txt"
          : >"$evidence/source-inputs.sha256"
          for path in .mise-version mise.toml mise.lock rust-toolchain.toml .velnor/config.toml .velnor/mise.toml .velnor/mise.lock .velnor/generator.lock .github/workflows/source-qualification.yml; do
            if [ -f "$path" ] && [ ! -L "$path" ]; then
              sha256sum "$path" >>"$evidence/source-inputs.sha256"
            else
              printf 'absent-or-unsafe %s\n' "$path" >>"$evidence/source-inputs.sha256"
            fi
          done

      - name: Set up pinned Mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e
        with:
          cache: "false"
          cache_save: "false"
          env: "false"
          install: "false"
          sha256: 2eb27467b6f369915ee76f18d66a0696cdb5c20e7ecc8cb49c2bfaca60f0fc9c
          version: 2026.10.20

      - name: Read and verify repository tool pins
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/source-qualification-artifacts"
          mise_version="$(cat .mise-version)"
          rust="$(mise --no-config --no-env --no-hooks config get -f mise.toml tools.rust.version)"
          mbx="$(mise --no-config --no-env --no-hooks config get -f mise.toml tools.mr-boxington.version)"
          nextest="$(mise --no-config --no-env --no-hooks config get -f mise.toml 'tools."aqua:nextest-rs/nextest/cargo-nextest"')"
          jactionlint="$(mise --no-config --no-env --no-hooks config get -f mise.toml tools.jactionlint)"
          shellcheck="$(mise --no-config --no-env --no-hooks config get -f mise.toml tools.shellcheck)"
          channel="$(mise --no-config --no-env --no-hooks config get -f rust-toolchain.toml toolchain.channel)"
          expected_mise=2026.10.20
          expected_rust=1.99.1
          expected_mbx=1.28.0
          expected_nextest=0.9.150
          expected_jactionlint=2.3.0
          expected_shellcheck=0.11.0
          if [ "$mise_version" != "$expected_mise" ] || [ "$rust" != "$expected_rust" ] \
            || [ "$mbx" != "$expected_mbx" ] || [ "$nextest" != "$expected_nextest" ] \
            || [ "$jactionlint" != "$expected_jactionlint" ] \
            || [ "$shellcheck" != "$expected_shellcheck" ] \
            || [ "$channel" != "$rust" ]; then
            printf 'repository tool pin mismatch: mise=%s rust=%s mbx=%s nextest=%s jactionlint=%s shellcheck=%s channel=%s\n' \
              "$mise_version" "$rust" "$mbx" "$nextest" "$jactionlint" "$shellcheck" "$channel" >&2
            exit 1
          fi
          python3 - "$evidence/validator-tool-lock.json" "$GITHUB_ENV" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys
          import tomllib

          receipt_path = Path(sys.argv[1])
          env_path = Path(sys.argv[2])
          source_files = [Path('.velnor/mise.toml'), Path('.velnor/mise.lock')]
          if any(path.is_symlink() or not path.is_file() for path in source_files):
              raise SystemExit('validator Mise source or lock is missing or unsafe')
          configured_tools = tomllib.loads(source_files[0].read_text())['tools']
          validator_lock = tomllib.loads(source_files[1].read_text())['tools']
          expected_validators = {
              'jactionlint': {
                  'config_key': 'github:jdx/jactionlint',
                  'backend': 'github:jdx/jactionlint',
                  'version': '2.3.0',
                  'checksum': 'sha256:907e6f6a59e181879f7e6936e19ee2eca1cbc51de134fb85460cfa8d65a71f28',
                  'url': 'https://github.com/jdx/jactionlint/releases/download/v2.3.0/jactionlint_2.3.0_linux_amd64.tar.gz',
              },
              'shellcheck': {
                  'config_key': 'shellcheck',
                  'backend': 'aqua:koalaman/shellcheck',
                  'version': '0.11.0',
                  'checksum': 'sha256:8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198',
                  'url': 'https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz',
              },
          }
          validated = {}
          for name, expected_validator in expected_validators.items():
              if configured_tools.get(expected_validator['config_key']) != expected_validator['version']:
                  raise SystemExit(f'{name} Mise tool pin does not match the qualification contract')
              entries = validator_lock.get(expected_validator['config_key'])
              if not isinstance(entries, list) or len(entries) != 1:
                  raise SystemExit(f'{name} Mise lock entry is missing or ambiguous')
              entry = entries[0]
              platform = entry.get('platforms.linux-x64')
              if entry.get('backend') != expected_validator['backend'] or entry.get('version') != expected_validator['version'] \
                  or not isinstance(platform, dict) \
                  or platform.get('checksum') != expected_validator['checksum'] \
                  or platform.get('url') != expected_validator['url']:
                  raise SystemExit(f'{name} Linux x64 lock entry does not match the qualification contract')
              validated[name] = {
                  **expected_validator,
                  'archive': expected_validator['url'].rsplit('/', 1)[1],
                  'binary': name,
              }
          receipt = {
              'platform': 'linux-x64',
              'source_sha256': {
                  str(path): hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in source_files
              },
              'tools': validated,
          }
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          with env_path.open('a') as stream:
              for name, item in validated.items():
                  env_name = name.upper()
                  stream.write(f"VELNOR_{env_name}_URL={item['url']}\n")
                  stream.write(f"VELNOR_{env_name}_SHA256={item['checksum'].removeprefix('sha256:')}\n")
          PY
          node_version=26.12.0
          mise --no-config --no-env --no-hooks install "node@$node_version"
          mise --no-config --no-env --no-hooks exec "node@$node_version" -- node --version \
            | tee "$evidence/node-version.txt"
          grep -Fx "v$node_version" "$evidence/node-version.txt"
          mise --no-config --no-env --no-hooks exec "node@$node_version" -- node - \
            "$mise_version" "$rust" "$mbx" "$nextest" "$jactionlint" "$shellcheck" \
            "$channel" "$node_version" "$evidence/tool-pins.json" "$GITHUB_ENV" <<'JS'
            const fs = require("node:fs");
            const crypto = require("node:crypto");
            const [mise, rust, mbx, nextest, jactionlint, shellcheck, channel, node, receiptPath, envPath] = process.argv.slice(2);
            const files = [".mise-version", "mise.toml", "rust-toolchain.toml"];
            const source_sha256 = Object.fromEntries(files.map((file) => [
              file,
              crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex"),
            ]));
            const receipt = {
              versions: {
                mise, rust, "mr-boxington": mbx, nextest, jactionlint, shellcheck,
              },
              rust_toolchain_channel: channel, node, source_sha256,
            };
            fs.writeFileSync(receiptPath, `${JSON.stringify(receipt, null, 2)}\n`);
            fs.appendFileSync(envPath,
              `VELNOR_MISE_VERSION=${mise}\n` +
              `VELNOR_RUST_VERSION=${rust}\n` +
              `VELNOR_MBX_VERSION=${mbx}\n` +
              `VELNOR_NEXTEST_VERSION=${nextest}\n` +
              `VELNOR_JACTIONLINT_VERSION=${jactionlint}\n` +
              `VELNOR_SHELLCHECK_VERSION=${shellcheck}\n`);
          JS
          mise --version | tee "$evidence/mise-version.txt"
          grep -Eq "(^|[[:space:]])2026\.10\.20([[:space:]]|$)" "$evidence/mise-version.txt"

      - name: Install pinned Rust and MBX
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/source-qualification-artifacts"
          mise --no-config --no-env --no-hooks install \
            "rust@$VELNOR_RUST_VERSION" "mr-boxington@$VELNOR_MBX_VERSION" \
            >"$evidence/logs/tool-install.log" 2>&1
          cat "$evidence/logs/tool-install.log"

      - name: Record installed tool identities
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/source-qualification-artifacts"
          mise --no-config --no-env --no-hooks exec "rust@$VELNOR_RUST_VERSION" -- rustc --version \
            >"$evidence/rustc-version.txt"
          mise --no-config --no-env --no-hooks exec "mr-boxington@$VELNOR_MBX_VERSION" -- mbx --version \
            >"$evidence/mbx-version.txt"
          mise --no-config --no-env --no-hooks exec node@26.12.0 -- node --version \
            >"$evidence/node-version.txt"
          cat "$evidence/rustc-version.txt" "$evidence/mbx-version.txt" "$evidence/node-version.txt"
          grep -F "rustc $VELNOR_RUST_VERSION " "$evidence/rustc-version.txt"
          grep -Eq "(^|[^0-9])$VELNOR_MBX_VERSION([^0-9]|$)" "$evidence/mbx-version.txt"
          grep -Fx "v26.12.0" "$evidence/node-version.txt"

      - name: Prefetch locked sources for qualification workspaces
        shell: bash
        run: |
          set -uo pipefail
          evidence="$RUNNER_TEMP/source-qualification-artifacts"
          root="$GITHUB_WORKSPACE"
          log="$evidence/logs/cargo-prefetch.log"
          status_file="$evidence/logs/cargo-prefetch.exit"
          before="$evidence/cargo-fetch-locks.before.txt"
          after="$evidence/cargo-fetch-locks.after.txt"
          identity="$evidence/cargo-fetch-lock-identity.txt"
          manifests=(Cargo.toml crates/velnor-runner/Cargo.toml fixtures/nested/Cargo.toml)
          locks=(Cargo.lock crates/velnor-runner/Cargo.lock fixtures/nested/Cargo.lock)
          final_status=0
          : >"$log"
          : >"$identity"
          record_lock_hashes() {
            local destination="$1" lock digest
            : >"$destination" || return 1
            for lock in "${locks[@]}"; do
              if [ -L "$root/$lock" ] || [ ! -f "$root/$lock" ]; then
                printf 'invalid lockfile: %s\n' "$lock" >&2
                return 1
              fi
              if ! digest="$(sha256sum -- "$root/$lock" | awk 'NR == 1 { print $1; next } { exit 1 } END { if (NR != 1) exit 1 }')" \
                || [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
                printf 'could not calculate lockfile SHA-256: %s\n' "$lock" >&2
                return 1
              fi
              printf '%s  %s\n' "$digest" "$lock" >>"$destination" || return 1
            done
          }
          if ! record_lock_hashes "$before"; then
            final_status=1
            printf 'lockfile baseline capture failed\n' >>"$log"
          else
            for manifest in "${manifests[@]}"; do
              if [ -L "$root/$manifest" ] || [ ! -f "$root/$manifest" ]; then
                printf 'invalid manifest: %s\n' "$manifest" >>"$log"
                final_status=1
                continue
              fi
              printf 'command=mise --no-config --no-env --no-hooks exec rust@%s mr-boxington@%s -- cargo fetch --locked --manifest-path %s/%s\n' \
                "$VELNOR_RUST_VERSION" "$VELNOR_MBX_VERSION" "$root" "$manifest" >>"$log"
              mise --no-config --no-env --no-hooks exec \
                "rust@$VELNOR_RUST_VERSION" "mr-boxington@$VELNOR_MBX_VERSION" -- \
                cargo fetch --locked --manifest-path "$root/$manifest" >>"$log" 2>&1
              command_status=$?
              printf 'manifest=%s status=%s\n' "$manifest" "$command_status" >>"$log"
              if [ "$command_status" -ne 0 ]; then final_status=1; fi
            done
          fi
          if ! record_lock_hashes "$after"; then
            final_status=1
            printf 'lockfile post-fetch capture failed\n' >>"$log"
          elif [ -f "$before" ] && ! cmp -s "$before" "$after"; then
            final_status=1
            printf 'lockfile hashes changed during cargo fetch\n' >>"$log"
          fi
          {
            printf 'source_head=%s\n' "$GITHUB_SHA"
            printf 'fetch_scope=root-runner-and-nested-parent\n'
            printf 'target_filter=none\n'
            printf 'locked=true\n'
            printf 'before_sha256\n'
            cat "$before"
            printf 'after_sha256\n'
            cat "$after"
          } >"$identity" || final_status=1
          printf '%s\n' "$final_status" >"$status_file" || exit 1
          cat "$log"
          exit "$final_status"

      - name: Build runner-native archive guard from this checkout
        shell: bash
        run: |
          set -uo pipefail
          evidence="$RUNNER_TEMP/source-qualification-artifacts"
          log="$evidence/logs/archive-guard-build.log"
          receipt="$evidence/archive-guard-identity.txt"
          printf '%s\n' 'bash scripts/build-owned-archive-guard.sh' >"$evidence/logs/archive-guard-build.command"
          set +e
          bash scripts/build-owned-archive-guard.sh >"$log" 2>&1
          command_status=$?
          cat "$log"
          identity_status=0
          artifact_status=0
          guard="$GITHUB_WORKSPACE/.velnor/archive-guard/bin/velnor-archive-guard"
          fingerprint=unavailable
          source_fingerprint=unavailable
          digest=unavailable
          file_identity=unavailable
          if [ "$command_status" -ne 0 ]; then
            identity_status=1
            printf 'guard identity unavailable because the host-native build failed\n' >&2
          elif [ -L "$guard" ] || [ ! -f "$guard" ] || [ ! -x "$guard" ]; then
            identity_status=1
            printf 'FATAL: builder did not produce a regular executable guard in the checkout\n' >&2
          else
            if ! fingerprint="$("$guard" --fingerprint)" \
              || ! source_fingerprint="$("$guard" source-fingerprint "$GITHUB_WORKSPACE")" \
              || [[ ! "$fingerprint" =~ ^[0-9a-f]{64}$ ]] \
              || [ "$source_fingerprint" != "$fingerprint" ]; then
              identity_status=1
              printf 'FATAL: runner-native archive guard fingerprint does not match this checkout\n' >&2
            fi
            if ! digest="$(sha256sum "$guard" | awk 'NR == 1 { print $1; next } { exit 1 } END { if (NR != 1) exit 1 }')" \
              || [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              identity_status=1
              digest=unavailable
              printf 'FATAL: could not calculate the archive guard SHA-256\n' >&2
            fi
            if ! file_identity="$(stat -c '%u:%a:%h:%s' "$guard")"; then
              identity_status=1
              file_identity=unavailable
              printf 'FATAL: could not inspect the archive guard identity\n' >&2
            fi
            owner="${file_identity%%:*}"
            remainder="${file_identity#*:}"
            mode="${remainder%%:*}"
            remainder="${remainder#*:}"
            links="${remainder%%:*}"
            size="${remainder#*:}"
            if [[ ! "$owner" =~ ^[0-9]+$ || "$owner" != "$(id -u)" \
              || ! "$mode" =~ ^[0-7]+$ || ! "$links" =~ ^[0-9]+$ \
              || "$links" != 1 || ! "$size" =~ ^[0-9]+$ ]] \
              || (( (8#$mode & 022) != 0 || (8#$mode & 0111) == 0 )); then
              identity_status=1
              printf 'FATAL: archive guard file ownership or permissions are unsafe\n' >&2
            fi
            if ! {
              printf 'source_head=%s\n' "$GITHUB_SHA"
              printf 'host=%s/%s\n' "$RUNNER_OS" "$RUNNER_ARCH"
              printf 'builder=scripts/build-owned-archive-guard.sh\n'
              printf 'binary_path=%s\n' "$guard"
              printf 'binary_sha256=%s\n' "$digest"
              printf 'binary_identity=%s\n' "$file_identity"
              printf 'source_fingerprint=%s\n' "$source_fingerprint"
            } >"$receipt"; then
              artifact_status=1
              printf 'FATAL: could not write the archive guard identity receipt\n' >&2
            fi
          fi
          printf '%s\n' "$command_status" >"$evidence/logs/archive-guard-build.command.exit" || artifact_status=1
          printf '%s\n' "$identity_status" >"$evidence/logs/archive-guard-build.identity.exit" || artifact_status=1
          printf '%s\n' "$artifact_status" >"$evidence/logs/archive-guard-build.artifact.exit" || artifact_status=1
          final_status=0
          if [ "$command_status" -ne 0 ] || [ "$identity_status" -ne 0 ] || [ "$artifact_status" -ne 0 ]; then
            final_status=1
          fi
          printf '%s\n' "$final_status" >"$evidence/logs/archive-guard-build.exit" || exit 1
          if [ "$artifact_status" -ne 0 ]; then
            printf 'artifact_status=1\n' >"$evidence/logs/archive-guard-build.artifact.exit" || true
          fi
          exit "$final_status"

      - name: Provision checksum-locked validator tools
        shell: bash
        run: |
          set -uo pipefail
          evidence="$RUNNER_TEMP/source-qualification-artifacts"
          archives="$evidence/validator-tool-archives"
          log="$evidence/logs/validator-tool-provision.log"
          mkdir -p "$archives"
          : >"$log"
          printf '%s\n' \
            'curl --fail --location --proto =https --proto-redir =https <locked-url>' \
            'sha256sum --check <locked-sha256>' \
            'archive guard validation, followed by tar -xOf for the one locked binary member' \
            >"$evidence/logs/validator-tool-provision.command"
          command_status=0
          identity_status=0
          artifact_status=0
          jactionlint_download_status=1
          jactionlint_checksum_status=1
          jactionlint_guard_status=1
          jactionlint_extract_status=1
          shellcheck_download_status=1
          shellcheck_checksum_status=1
          shellcheck_guard_status=1
          shellcheck_extract_status=1
          jactionlint_archive="$archives/jactionlint_2.3.0_linux_amd64.tar.gz"
          shellcheck_archive="$archives/shellcheck-v0.11.0.linux.x86_64.tar.xz"
          jactionlint_members="$archives/jactionlint.members.txt"
          shellcheck_members="$archives/shellcheck.members.txt"
          jactionlint_member_count=unavailable
          shellcheck_member_count=unavailable
          jactionlint_member_inventory_sha=unavailable
          shellcheck_member_inventory_sha=unavailable
          guard_profile_source_sha=unavailable
          if [ "$RUNNER_OS" != Linux ] || [ "$RUNNER_ARCH" != X64 ]; then
            printf 'FATAL: checksum entries are locked only for Linux x64\n' >>"$log"
            command_status=1
          fi
          if curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
            --output "$jactionlint_archive" "$VELNOR_JACTIONLINT_URL" >>"$log" 2>&1; then
            jactionlint_download_status=0
          else
            command_status=1
          fi
          if curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
            --output "$shellcheck_archive" "$VELNOR_SHELLCHECK_URL" >>"$log" 2>&1; then
            shellcheck_download_status=0
          else
            command_status=1
          fi
          if [ "$jactionlint_download_status" -eq 0 ]; then
            printf '%s  %s\n' "$VELNOR_JACTIONLINT_SHA256" "$jactionlint_archive" \
              >"$archives/jactionlint.sha256"
            if sha256sum --check "$archives/jactionlint.sha256" >>"$log" 2>&1; then
              jactionlint_checksum_status=0
            else
              command_status=1
            fi
          fi
          if [ "$shellcheck_download_status" -eq 0 ]; then
            printf '%s  %s\n' "$VELNOR_SHELLCHECK_SHA256" "$shellcheck_archive" \
              >"$archives/shellcheck.sha256"
            if sha256sum --check "$archives/shellcheck.sha256" >>"$log" 2>&1; then
              shellcheck_checksum_status=0
            else
              command_status=1
            fi
          fi
          guard="$GITHUB_WORKSPACE/.velnor/archive-guard/bin/velnor-archive-guard"
          if [ -f "$GITHUB_WORKSPACE/crates/velnor-archive-guard/src/owned_archive_guard/profile.rs" ] \
            && [ ! -L "$GITHUB_WORKSPACE/crates/velnor-archive-guard/src/owned_archive_guard/profile.rs" ]; then
            if ! guard_profile_source_sha="$(sha256sum "$GITHUB_WORKSPACE/crates/velnor-archive-guard/src/owned_archive_guard/profile.rs" \
              | awk 'NR == 1 { print $1; next } { exit 1 } END { if (NR != 1) exit 1 }')" \
              || [[ ! "$guard_profile_source_sha" =~ ^[0-9a-f]{64}$ ]]; then
              command_status=1
            fi
          else
            command_status=1
          fi
          guard_expected_sha="$(awk -F= '$1 == "binary_sha256" { print $2 }' "$evidence/archive-guard-identity.txt")"
          if ! guard_actual_sha="$(sha256sum "$guard" | awk 'NR == 1 { print $1; next } { exit 1 } END { if (NR != 1) exit 1 }')" \
            || [[ ! "$guard_actual_sha" =~ ^[0-9a-f]{64}$ ]]; then command_status=1; fi
          if ! guard_fingerprint="$("$guard" --fingerprint)" \
            || [[ ! "$guard_fingerprint" =~ ^[0-9a-f]{64}$ ]]; then command_status=1; fi
          if ! guard_source_fingerprint="$("$guard" source-fingerprint "$GITHUB_WORKSPACE")" \
            || [[ ! "$guard_source_fingerprint" =~ ^[0-9a-f]{64}$ ]]; then command_status=1; fi
          if [ -L "$guard" ] || [ ! -f "$guard" ] || [ ! -x "$guard" ] \
            || [[ ! "$guard_expected_sha" =~ ^[0-9a-f]{64}$ ]] \
            || [ "$guard_actual_sha" != "$guard_expected_sha" ] \
            || [ "$guard_source_fingerprint" != "$guard_fingerprint" ]; then
            printf 'FATAL: checkout-owned archive guard identity changed before tool archive validation\n' >>"$log"
            command_status=1
          else
            if [ "$jactionlint_checksum_status" -eq 0 ]; then
              if "$guard" cargo-package <"$jactionlint_archive" >>"$log" 2>&1 \
                && tar -tzf "$jactionlint_archive" >"$jactionlint_members" 2>>"$log"; then
                jactionlint_member_count="$(wc -l <"$jactionlint_members" | tr -d '[:space:]')"
                if ! jactionlint_member_inventory_sha="$(sha256sum "$jactionlint_members" | awk 'NR == 1 { print $1; next } { exit 1 } END { if (NR != 1) exit 1 }')" \
                  || [[ ! "$jactionlint_member_inventory_sha" =~ ^[0-9a-f]{64}$ ]]; then
                  command_status=1
                fi
                if [ "$jactionlint_member_count" = 72 ] \
                  && [ "$(awk '$0 == "jactionlint" { count++ } END { print count + 0 }' "$jactionlint_members")" = 1 ]; then
                  jactionlint_guard_status=0
                else
                  printf 'FATAL: jactionlint locked archive member inventory differs from the reviewed release archive\n' >>"$log"
                  command_status=1
                fi
              else
                command_status=1
              fi
            fi
            if [ "$shellcheck_checksum_status" -eq 0 ]; then
              if xz -dc -- "$shellcheck_archive" 2>>"$log" \
                | "$guard" candidate >>"$log" 2>&1 \
                && xz -dc -- "$shellcheck_archive" 2>>"$log" \
                  | tar -tf - >"$shellcheck_members" 2>>"$log"; then
                shellcheck_member_count="$(wc -l <"$shellcheck_members" | tr -d '[:space:]')"
                if ! shellcheck_member_inventory_sha="$(sha256sum "$shellcheck_members" | awk 'NR == 1 { print $1; next } { exit 1 } END { if (NR != 1) exit 1 }')" \
                  || [[ ! "$shellcheck_member_inventory_sha" =~ ^[0-9a-f]{64}$ ]]; then
                  command_status=1
                fi
                if [ "$shellcheck_member_count" = 3 ] \
                  && [ "$(awk '$0 == "shellcheck-v0.11.0/shellcheck" { count++ } END { print count + 0 }' "$shellcheck_members")" = 1 ]; then
                  shellcheck_guard_status=0
                else
                  printf 'FATAL: ShellCheck locked archive member inventory differs from the reviewed release archive\n' >>"$log"
                  command_status=1
                fi
              else
                command_status=1
              fi
            fi
          fi
          mise_installs="$MISE_DATA_DIR/installs"
          jactionlint_root="$mise_installs/jactionlint"
          shellcheck_root="$mise_installs/shellcheck"
          jactionlint_dir="$jactionlint_root/$VELNOR_JACTIONLINT_VERSION"
          shellcheck_dir="$shellcheck_root/$VELNOR_SHELLCHECK_VERSION"
          jactionlint_binary="$jactionlint_dir/jactionlint"
          shellcheck_binary="$shellcheck_dir/shellcheck-v0.11.0/shellcheck"
          if [ "$jactionlint_guard_status" -eq 0 ] && [ "$shellcheck_guard_status" -eq 0 ]; then
            if [ -L "$MISE_DATA_DIR" ] || [ ! -d "$MISE_DATA_DIR" ] \
              || [ -L "$mise_installs" ] || [ ! -d "$mise_installs" ] \
              || [ -e "$jactionlint_root" ] || [ -L "$jactionlint_root" ] \
              || [ -e "$shellcheck_root" ] || [ -L "$shellcheck_root" ]; then
              printf 'FATAL: isolated Mise install roots already exist or are unsafe\n' >>"$log"
              command_status=1
            elif mkdir -m 700 "$jactionlint_root" "$shellcheck_root" \
              && mkdir -m 700 "$jactionlint_dir" "$shellcheck_dir" \
              && mkdir -m 700 "$shellcheck_dir/shellcheck-v0.11.0"; then
              printf 'short = "jactionlint"\nfull = "github:jdx/jactionlint"\nexplicit_backend = true\n' \
                >"$jactionlint_root/.mise.backend.toml"
              printf 'short = "shellcheck"\nfull = "aqua:koalaman/shellcheck"\nexplicit_backend = true\n' \
                >"$shellcheck_root/.mise.backend.toml"
              chmod 600 "$jactionlint_root/.mise.backend.toml" "$shellcheck_root/.mise.backend.toml"
              if tar -xOf "$jactionlint_archive" jactionlint >"$jactionlint_binary" 2>>"$log" \
                && xz -dc -- "$shellcheck_archive" 2>>"$log" \
                  | tar -xOf - shellcheck-v0.11.0/shellcheck >"$shellcheck_binary" 2>>"$log"; then
                chmod 755 "$jactionlint_binary" "$shellcheck_binary"
                if [ -f "$jactionlint_binary" ] && [ ! -L "$jactionlint_binary" ] \
                  && [ -x "$jactionlint_binary" ] && [ -f "$shellcheck_binary" ] \
                  && [ ! -L "$shellcheck_binary" ] && [ -x "$shellcheck_binary" ]; then
                  jactionlint_extract_status=0
                  shellcheck_extract_status=0
                else
                  printf 'FATAL: extracted validator executable is missing or unsafe\n' >>"$log"
                  command_status=1
                fi
              else
                printf 'FATAL: could not extract exact locked validator archive members\n' >>"$log"
                command_status=1
              fi
            else
              printf 'FATAL: could not create isolated Mise backend install layout\n' >>"$log"
              command_status=1
            fi
          fi
          jactionlint_which=unavailable
          shellcheck_which=unavailable
          jactionlint_version=unavailable
          shellcheck_version=unavailable
          jactionlint_binary_sha=unavailable
          shellcheck_binary_sha=unavailable
          if [ "$jactionlint_extract_status" -eq 0 ]; then
            if mise --no-config --no-env --no-hooks which --tool \
              "jactionlint@$VELNOR_JACTIONLINT_VERSION" jactionlint \
              >"$evidence/logs/jactionlint-which.log" 2>&1; then
              jactionlint_which="$(cat "$evidence/logs/jactionlint-which.log")"
              if [ "$jactionlint_which" = "$jactionlint_binary" ] \
                && mise --no-config --no-env --no-hooks exec \
                  "jactionlint@$VELNOR_JACTIONLINT_VERSION" -- jactionlint --version \
                  >"$evidence/logs/jactionlint-version.log" 2>&1 \
                && [ "$(cat "$evidence/logs/jactionlint-version.log")" = "$VELNOR_JACTIONLINT_VERSION" ]; then
                jactionlint_version="$(cat "$evidence/logs/jactionlint-version.log")"
                if ! jactionlint_binary_sha="$(sha256sum "$jactionlint_binary" | awk 'NR == 1 { print $1; next } { exit 1 } END { if (NR != 1) exit 1 }')" \
                  || [[ ! "$jactionlint_binary_sha" =~ ^[0-9a-f]{64}$ ]]; then
                  identity_status=1
                fi
              else
                identity_status=1
              fi
            else
              identity_status=1
            fi
          else
            identity_status=1
          fi
          if [ "$shellcheck_extract_status" -eq 0 ]; then
            if mise --no-config --no-env --no-hooks which --tool \
              "shellcheck@$VELNOR_SHELLCHECK_VERSION" shellcheck \
              >"$evidence/logs/shellcheck-which.log" 2>&1; then
              shellcheck_which="$(cat "$evidence/logs/shellcheck-which.log")"
              if [ "$shellcheck_which" = "$shellcheck_binary" ] \
                && mise --no-config --no-env --no-hooks exec \
                  "shellcheck@$VELNOR_SHELLCHECK_VERSION" -- shellcheck --version \
                  >"$evidence/logs/shellcheck-version.log" 2>&1 \
                && grep -Fxq "version: $VELNOR_SHELLCHECK_VERSION" \
                  "$evidence/logs/shellcheck-version.log"; then
                shellcheck_version="$VELNOR_SHELLCHECK_VERSION"
                if ! shellcheck_binary_sha="$(sha256sum "$shellcheck_binary" | awk 'NR == 1 { print $1; next } { exit 1 } END { if (NR != 1) exit 1 }')" \
                  || [[ ! "$shellcheck_binary_sha" =~ ^[0-9a-f]{64}$ ]]; then
                  identity_status=1
                fi
              else
                identity_status=1
              fi
            else
              identity_status=1
            fi
          else
            identity_status=1
          fi
          if [ "$command_status" -ne 0 ]; then identity_status=1; fi
          if ! cp -p "$evidence/logs/jactionlint-version.log" "$evidence/jactionlint-version.txt" \
            || ! cp -p "$evidence/logs/shellcheck-version.log" "$evidence/shellcheck-version.txt"; then
            artifact_status=1
          fi
          if ! {
            printf 'source_head=%s\n' "$GITHUB_SHA"
            printf 'platform=%s/%s\n' "$RUNNER_OS" "$RUNNER_ARCH"
            printf 'mise_data_dir=%s\n' "$MISE_DATA_DIR"
            printf 'archive_guard_sha256=%s\n' "$guard_actual_sha"
            printf 'archive_guard_source_fingerprint=%s\n' "$guard_fingerprint"
            printf 'archive_guard_profile_source=crates/velnor-archive-guard/src/owned_archive_guard/profile.rs\n'
            printf 'archive_guard_profile_source_sha256=%s\n' "$guard_profile_source_sha"
            printf 'jactionlint_backend=github:jdx/jactionlint\n'
            printf 'jactionlint_version=%s\n' "$jactionlint_version"
            printf 'jactionlint_url=%s\n' "$VELNOR_JACTIONLINT_URL"
            printf 'jactionlint_archive_sha256=sha256:%s\n' "$VELNOR_JACTIONLINT_SHA256"
            printf 'jactionlint_archive_profile=cargo-package(gzip;input<=128MiB;expanded<=544MiB;payload<=512MiB;members<=30000;regular+directory;pax=allowed)\n'
            printf 'jactionlint_archive_member_count=%s\n' "$jactionlint_member_count"
            printf 'jactionlint_archive_member_inventory_sha256=%s\n' "$jactionlint_member_inventory_sha"
            printf 'jactionlint_executable_member=jactionlint\n'
            printf 'jactionlint_binary_path=%s\n' "$jactionlint_binary"
            printf 'jactionlint_mise_which=%s\n' "$jactionlint_which"
            printf 'jactionlint_binary_sha256=%s\n' "$jactionlint_binary_sha"
            printf 'shellcheck_backend=aqua:koalaman/shellcheck\n'
            printf 'shellcheck_version=%s\n' "$shellcheck_version"
            printf 'shellcheck_url=%s\n' "$VELNOR_SHELLCHECK_URL"
            printf 'shellcheck_archive_sha256=sha256:%s\n' "$VELNOR_SHELLCHECK_SHA256"
            printf 'shellcheck_archive_profile=candidate(raw-tar-after-xz;input<=1088MiB;payload<=1024MiB;members<=16;regular+directory;pax=forbidden)\n'
            printf 'shellcheck_archive_member_count=%s\n' "$shellcheck_member_count"
            printf 'shellcheck_archive_member_inventory_sha256=%s\n' "$shellcheck_member_inventory_sha"
            printf 'shellcheck_executable_member=shellcheck-v0.11.0/shellcheck\n'
            printf 'shellcheck_binary_path=%s\n' "$shellcheck_binary"
            printf 'shellcheck_mise_which=%s\n' "$shellcheck_which"
            printf 'shellcheck_binary_sha256=%s\n' "$shellcheck_binary_sha"
          } >"$evidence/validator-tool-identity.txt"; then
            artifact_status=1
          fi
          printf '%s\n' "$jactionlint_download_status" >"$evidence/logs/jactionlint-download.exit" || artifact_status=1
          printf '%s\n' "$jactionlint_checksum_status" >"$evidence/logs/jactionlint-checksum.exit" || artifact_status=1
          printf '%s\n' "$jactionlint_guard_status" >"$evidence/logs/jactionlint-archive-guard.exit" || artifact_status=1
          printf '%s\n' "$jactionlint_extract_status" >"$evidence/logs/jactionlint-extract.exit" || artifact_status=1
          printf '%s\n' "$shellcheck_download_status" >"$evidence/logs/shellcheck-download.exit" || artifact_status=1
          printf '%s\n' "$shellcheck_checksum_status" >"$evidence/logs/shellcheck-checksum.exit" || artifact_status=1
          printf '%s\n' "$shellcheck_guard_status" >"$evidence/logs/shellcheck-archive-guard.exit" || artifact_status=1
          printf '%s\n' "$shellcheck_extract_status" >"$evidence/logs/shellcheck-extract.exit" || artifact_status=1
          printf '%s\n' "$command_status" >"$evidence/logs/validator-tool-install.command.exit" || artifact_status=1
          printf '%s\n' "$identity_status" >"$evidence/logs/validator-tool-install.identity.exit" || artifact_status=1
          printf '%s\n' "$artifact_status" >"$evidence/logs/validator-tool-install.artifact.exit" || exit 1
          final_status=0
          if [ "$command_status" -ne 0 ] || [ "$identity_status" -ne 0 ] \
            || [ "$artifact_status" -ne 0 ]; then
            final_status=1
          fi
          printf '%s\n' "$final_status" >"$evidence/logs/validator-tool-install.exit" || exit 1
          if ! cat "$log"; then final_status=1; fi
          if [ "$final_status" -ne 0 ]; then
            printf 'FATAL: locked validator tool provisioning or identity check failed\n' >&2
          fi
          exit "$final_status"

      - name: Build source CLI with pinned MBX
        shell: bash
        run: |
          set -uo pipefail
          evidence="$RUNNER_TEMP/source-qualification-artifacts"
          mise --no-config --no-env --no-hooks exec \
            "rust@$VELNOR_RUST_VERSION" "mr-boxington@$VELNOR_MBX_VERSION" -- \
            mbx build --locked --release --package velnor-actions-cli --bin velnor-actions \
            >"$evidence/logs/cli-build.log" 2>&1
          command_status=$?
          identity_status=0
          artifact_status=0
          binary="$CARGO_TARGET_DIR/release/velnor-actions"
          if ! cat "$evidence/logs/cli-build.log"; then artifact_status=1; fi
          version=unavailable
          digest=unavailable
          size=unavailable
          expected_version=unavailable
          if [ "$command_status" -ne 0 ]; then
            identity_status=1
            printf 'CLI identity unavailable because the build command failed\n' >&2
          elif [ ! -f "$binary" ] || [ -L "$binary" ] || [ ! -x "$binary" ]; then
            identity_status=1
            printf 'FATAL: successful build did not produce a regular executable CLI at %s\n' "$binary" >&2
          else
            if ! expected_version="$(mise --no-config --no-env --no-hooks config get -f Cargo.toml workspace.package.version)"; then
              identity_status=1
              printf 'FATAL: could not read the workspace package version\n' >&2
            fi
            if ! version="$("$binary" --version)"; then
              identity_status=1
              version=unavailable
              printf 'FATAL: built CLI version command failed\n' >&2
            elif [ "$version" != "velnor-actions $expected_version" ]; then
              identity_status=1
              printf 'FATAL: built CLI version %s does not match expected velnor-actions %s\n' "$version" "$expected_version" >&2
            fi
            if ! digest="$(sha256sum "$binary" | awk 'NR == 1 { print $1; next } { exit 1 } END { if (NR != 1) exit 1 }')" \
              || [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              identity_status=1
              digest=unavailable
              printf 'FATAL: could not compute the built CLI SHA-256\n' >&2
            fi
            if ! size="$(stat -c '%s' "$binary")" || [[ ! "$size" =~ ^[0-9]+$ ]]; then
              identity_status=1
              size=unavailable
              printf 'FATAL: could not read the built CLI size\n' >&2
            fi
            identity_tmp="$evidence/cli-identity.txt.tmp"
            if ! {
              printf 'source_head=%s\n' "$GITHUB_SHA"
              printf 'expected_version=velnor-actions %s\n' "$expected_version"
              printf 'binary_path=%s\n' "$binary"
              printf 'binary_version=%s\n' "$version"
              printf 'binary_sha256=%s\n' "$digest"
              printf 'binary_size=%s\n' "$size"
              printf 'mise=%s\n' "$VELNOR_MISE_VERSION"
              printf 'rust=%s\n' "$VELNOR_RUST_VERSION"
              printf 'mr_boxington=%s\n' "$VELNOR_MBX_VERSION"
              printf 'nextest_pin=%s\n' "$VELNOR_NEXTEST_VERSION"
            } >"$identity_tmp" || ! mv "$identity_tmp" "$evidence/cli-identity.txt"; then
              artifact_status=1
              printf 'FATAL: could not write CLI identity receipt\n' >&2
            else
              cat "$evidence/cli-identity.txt" || artifact_status=1
            fi
          fi
          printf '%s\n' "$command_status" >"$evidence/logs/cli-build.command.exit" || artifact_status=1
          printf '%s\n' "$identity_status" >"$evidence/logs/cli-build.identity.exit" || artifact_status=1
          printf '%s\n' "$artifact_status" >"$evidence/logs/cli-build.artifact.exit" || artifact_status=1
          final_status=0
          if [ "$command_status" -ne 0 ] || [ "$identity_status" -ne 0 ] || [ "$artifact_status" -ne 0 ]; then
            final_status=1
          fi
          printf '%s\n' "$final_status" >"$evidence/logs/cli-build.exit" || exit 1
          if [ "$artifact_status" -ne 0 ]; then
            printf 'artifact_status=1\n' >"$evidence/logs/cli-build.artifact.exit" || true
          fi
          exit "$final_status"

      - name: Capture all five external goldens
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          evidence="$RUNNER_TEMP/source-qualification-artifacts"
          tmp="$RUNNER_TEMP/velnor-source-qualification-tmp"
          oracle="$evidence/external-oracle"
          binary="$CARGO_TARGET_DIR/release/velnor-actions"
          if [ ! -f "$binary" ] || [ ! -x "$binary" ]; then
            printf 'CLI binary unavailable; capture not run\n' >"$evidence/logs/external-capture.log"
            printf '1\n' >"$evidence/logs/external-capture.command.exit"
            printf '0\n' >"$evidence/logs/external-capture.artifact.exit"
            printf '1\n' >"$evidence/logs/external-capture.exit"
            printf 'capture workspace unavailable\n' >"$evidence/logs/external-capture-workspace.txt"
            exit 1
          fi
          mkdir -p "$oracle"
          set +e
          TMPDIR="$tmp" VELNOR_GOLDEN_DIR="$oracle" VELNOR_GOLDEN_KEEP_WORK=1 \
            scripts/capture-opentofu-goldens.sh capture "$binary" \
            >"$evidence/logs/external-capture.log" 2>&1
          command_status=$?
          artifact_status=0
          cat "$evidence/logs/external-capture.log"
          workspace="$(sed -n 's/^retaining \(successful golden evidence\|failed golden\) workspace: //p' "$evidence/logs/external-capture.log" | tail -n 1)"
          printf '%s\n' "$workspace" >"$evidence/logs/external-capture-workspace.txt"
          case "$workspace" in
            "$tmp"/velnor-goldens-work.*)
              if [ ! -L "$workspace" ] && [ ! -L "$workspace/stage" ] && [ -d "$workspace/stage" ]; then
                rm -rf "$evidence/captured-stage"
                if ! cp -RP "$workspace/stage" "$evidence/captured-stage"; then
                  printf 'could not preserve retained capture stage\n' >>"$evidence/logs/external-capture-workspace.txt"
                  artifact_status=1
                fi
              else
                printf 'retained workspace has no stage directory\n' >>"$evidence/logs/external-capture-workspace.txt"
                artifact_status=1
              fi
              if [ ! -L "$workspace/raw" ] && [ -d "$workspace/raw" ]; then
                rm -rf "$evidence/captured-raw"
                if ! cp -RP "$workspace/raw" "$evidence/captured-raw"; then
                  printf 'could not preserve retained raw capture logs\n' >>"$evidence/logs/external-capture-workspace.txt"
                  artifact_status=1
                fi
              else
                printf 'retained workspace has no safe raw log directory\n' >>"$evidence/logs/external-capture-workspace.txt"
                artifact_status=1
              fi
              ;;
            *)
              printf 'retained workspace path was absent or outside controlled TMPDIR\n' >>"$evidence/logs/external-capture-workspace.txt"
              artifact_status=1
              ;;
          esac
          final_status=$command_status
          if [ "$final_status" -eq 0 ] && [ "$artifact_status" -ne 0 ]; then final_status=1; fi
          printf '%s\n' "$command_status" >"$evidence/logs/external-capture.command.exit"
          printf '%s\n' "$artifact_status" >"$evidence/logs/external-capture.artifact.exit"
          printf '%s\n' "$final_status" >"$evidence/logs/external-capture.exit"
          exit "$final_status"

      - name: Repeat check against external oracle
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          evidence="$RUNNER_TEMP/source-qualification-artifacts"
          tmp="$RUNNER_TEMP/velnor-source-qualification-tmp"
          oracle="$evidence/external-oracle"
          binary="$CARGO_TARGET_DIR/release/velnor-actions"
          if [ ! -x "$binary" ] || [ ! -d "$oracle/cases" ]; then
            printf 'CLI or externally captured oracle is unavailable\n' >"$evidence/logs/external-check.log"
            printf '1\n' >"$evidence/logs/external-check.command.exit"
            printf '0\n' >"$evidence/logs/external-check.artifact.exit"
            printf '1\n' >"$evidence/logs/external-check.exit"
            printf 'check workspace unavailable\n' >"$evidence/logs/external-check-workspace.txt"
            exit 1
          fi
          set +e
          TMPDIR="$tmp" VELNOR_GOLDEN_DIR="$oracle" VELNOR_GOLDEN_KEEP_WORK=1 \
            scripts/capture-opentofu-goldens.sh check "$binary" \
            >"$evidence/logs/external-check.log" 2>&1
          command_status=$?
          artifact_status=0
          cat "$evidence/logs/external-check.log"
          workspace="$(sed -n 's/^retaining \(successful golden evidence\|failed golden\) workspace: //p' "$evidence/logs/external-check.log" | tail -n 1)"
          printf '%s\n' "$workspace" >"$evidence/logs/external-check-workspace.txt"
          case "$workspace" in
            "$tmp"/velnor-goldens-work.*)
              if [ ! -L "$workspace" ] && [ ! -L "$workspace/stage" ] && [ -d "$workspace/stage" ]; then
                rm -rf "$evidence/external-check-stage"
                if ! cp -RP "$workspace/stage" "$evidence/external-check-stage"; then
                  printf 'could not preserve external check stage\n' >>"$evidence/logs/external-check-workspace.txt"
                  artifact_status=1
                fi
              else
                printf 'retained check workspace has no safe stage directory\n' >>"$evidence/logs/external-check-workspace.txt"
                artifact_status=1
              fi
              if [ ! -L "$workspace/raw" ] && [ -d "$workspace/raw" ]; then
                rm -rf "$evidence/external-check-raw"
                if ! cp -RP "$workspace/raw" "$evidence/external-check-raw"; then
                  printf 'could not preserve external check raw logs\n' >>"$evidence/logs/external-check-workspace.txt"
                  artifact_status=1
                fi
              else
