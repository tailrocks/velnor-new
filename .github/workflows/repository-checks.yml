# Hand-maintained. Generated CI is .github/workflows/ci.yml (velnor-gen, .velnor/rust-ci.toml).
# What stays here: the workflow_dispatch contract inputs (the qualification code addresses this
# workflow path) and the secret scanners.
name: Repository checks
"on":
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      campaign:
        type: string
        required: true
      phase:
        type: choice
        required: true
        options:
          - cold
          - control
          - third
          - useful_delta
          - warm
      predecessor_run_attempt:
        type: string
        required: false
      predecessor_run_id:
        type: string
        required: false
  merge_group:
permissions:
  contents: read
cache-mode: read
env:
  ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
  ACTIONS_ID_TOKEN_REQUEST_URL: ""
  ACTIONS_RUNTIME_TOKEN: ""
  CARGO_REGISTRY_TOKEN: ""
  GH_CONFIG_DIR: ""
  GH_HOST: ""
  GH_TOKEN: ""
  GITHUB_TOKEN: ""
  MISE_AUTO_INSTALL: "false"
  MISE_EXEC_AUTO_INSTALL: "false"
  MISE_GITHUB_TOKEN: ""
  MISE_LOCKFILE: "0"
  MISE_NO_CONFIG: "1"
  MISE_NO_ENV: "1"
  MISE_NO_HOOKS: "1"
  MISE_QUIET: "1"
  NODE_AUTH_TOKEN: ""
  NPM_TOKEN: ""
concurrency:
  group: velnor-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  secret-scan:
    name: Secret scanners
    runs-on: [velnor, ubuntu-26.04-scale-set]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -e {0}
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'push' || github.event_name == 'merge_group'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "1"
          persist-credentials: "false"
      - name: Fetch the history of the checked-out commit
        run: git fetch --no-tags --unshallow origin "$(git rev-parse HEAD)"
      - name: Test that the scanner pins ignore repository tool config
        run: bash scripts/test-install-secret-scanners.sh
      - name: Install the pinned secret scanners
        run: bash scripts/install-secret-scanners.sh "$RUNNER_TEMP/secret-scanners"
      - name: Test that the working-tree secret scan fails on a planted token and passes a clean tree
        run: bash scripts/test-secret-scan-worktree.sh
      - name: Print scanner versions
        run: |
          gitleaks version
          betterleaks version
          kingfisher --version
      - name: Test that the secret scan configs report planted tokens in each fixture path
        run: bash scripts/test-secret-scan-config.sh
      - name: Scan the commit history with gitleaks
        run: gitleaks git . --redact --no-banner --config .gitleaks.toml --log-opts="--full-history --diff-merges=first-parent HEAD"
      - name: Scan the commit history with betterleaks
        run: betterleaks git . --redact -c .betterleaks.toml --log-opts="--full-history --diff-merges=first-parent HEAD"
      - name: Scan the working tree with kingfisher
        run: bash scripts/secret-scan-worktree.sh
