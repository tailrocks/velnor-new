# Generated by velnor-gen. Change .velnor/rust-ci.toml and run `velnor-gen generate`.
name: Rust cache cleanup
on:
  # jactionlint ignore=dangerous-triggers
  workflow_run:
    workflows:
      - Rust CI
    types:
      - completed
permissions: {}
concurrency:
  group: 'velnor-pr-delta-cleanup-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}'
  cancel-in-progress: false
jobs:
  rust-trim:
    if: '${{ github.event.workflow_run.event == ''pull_request'' && github.event.workflow_run.path == ''.github/workflows/rust-ci.yml'' && github.event.workflow_run.head_repository.id == github.event.repository.id }}'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install velnor-ci 0.1.90
        uses: tailrocks/velnor-new/actions/setup-velnor@29931d53b4d5f11477669c38b2fcda9ab584a26a  # tools-v0.1.90
        with:
          version: '0.1.90'
          sha256-linux-x64: b74e6a27fc444e2336560c17bc7562c80e65d93131ec3ffe341eee65d6cc973d
          sha256-linux-arm64: '3b5bc063606d49d4cb4fbffdb7a753b3ebecb36e72316f848048298b275b3cd7'
      - name: Delete older PR delta entries
        env:
          GITHUB_TOKEN: '${{ github.token }}'
          RUN_ID: '${{ github.event.workflow_run.id }}'
        run: 'velnor-ci cache trim-deltas --run-id "$RUN_ID"'
