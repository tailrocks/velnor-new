        run: mise --no-config --no-env --no-hooks install rust@1.99.1 actionlint@1.7.12 shellcheck@0.11.0 zizmor@1.31.1 aqua:nextest-rs/nextest/cargo-nextest@0.9.148
      - name: Prepare Rust components
        env:
          CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
