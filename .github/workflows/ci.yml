  rust-velnor-runner-host:
    name: Rust / velnor-runner-host
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      MBX_BUILD_SCRIPT_EXECUTION: "0"
      MBX_CC: "0"
      MBX_GC_AUTO: "0"
      MBX_SHARE_OUT_DIR: "0"
      RUSTUP_TOOLCHAIN: 1.99.1
    needs:
      - plan
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
      - name: V2 identity
        id: v2
        uses: ./.github/actions/velnor-tools-prelude-u26 # zizmor: ignore[self-repository]
        with:
          d: e6efcdf95bc9f59e0bd16e4587993172ef4c7bc1c00b5a9d177bd2a68e193e76
      - name: Restore Mise tools
        if: steps.v2.outputs.enabled == 'true'
        uses: ./.github/actions/velnor-tools-cache-restore # zizmor: ignore[self-repository]
        with:
          key: mise-tools-v2-${{steps.v2.outputs.identity}}
          seed-admitted: ${{ steps.v2.outputs.seed_admitted }}
      - name: Setup Mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7
        with:
          cache: "false"
          cache_save: "false"
          env: "false"
          install: "false"
          sha256: 94c45523c7b6760b7da704f16051171ca32e8447a849a02266a439a4455e9a12
          version: 2026.10.13
      - name: Download helper (pre-seed trust-on-review)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
