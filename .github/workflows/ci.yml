          NEEDS_JSON: '${{ toJSON(needs) }}'
          GATE_SPEC: '--plan rust-plan --job rust-plan=always --job rust=lane:root --job policy=policy+not-merge-group-passed --job lint-jactionlint=not-merge-group-passed --job lint-alint=not-merge-group-passed --job lint-generator-samples=lint:generator_samples+not-merge-group-passed --job lint-hosted-phase-measurement=lint:hosted_phase_measurement+not-merge-group-passed --job lint-mise-binary-digests=lint:mise_binary_digests+not-merge-group-passed --job lint-validate-hk=lint:validate_hk+not-merge-group-passed --job lint-generated-check=lint:generated_check --tests rust=root'
        run: '. "$VELNOR_EXEC" gate --spec-env GATE_SPEC'
