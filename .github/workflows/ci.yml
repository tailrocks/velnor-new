  rust-velnor-actions-tofu:
    name: Rust / velnor-actions-tofu
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      MBX_BUILD_SCRIPT_EXECUTION: "0"
      MBX_CC: "0"
      MBX_GC_AUTO: "0"
      MBX_SHARE_OUT_DIR: "0"
      RUSTUP_TOOLCHAIN: 1.98.1
    needs:
      - plan
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
      - name: V2 identity
        id: v2
        uses: ./.github/actions/velnor-tools-prelude-u26 # zizmor: ignore[self-repository]
        with:
          d: 466f320848e85e2733b75d8c074a645329f567f84c0fd120712fb23dab6ce3e1
      - name: Restore Mise tools
        if: steps.v2.outputs.enabled == 'true'
        uses: ./.github/actions/velnor-tools-cache-restore # zizmor: ignore[self-repository]
        with:
          key: mise-tools-v2-${{steps.v2.outputs.identity}}
          seed-admitted: ${{ steps.v2.outputs.seed_admitted }}
      - name: Setup Mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
        with:
          cache: "false"
          cache_save: "false"
          env: "false"
          install: "false"
          sha256: c72477ae6c3a8e7d817a322f43da70e4643e75ee5c21265f1c19c894273b7428
          version: 2026.10.8
      - name: Download helper (pre-seed trust-on-review)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
