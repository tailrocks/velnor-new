      - name: Resolve project tool versions
        run: "set -eu\n: \"${GITHUB_ENV:?missing GITHUB_ENV}\"\n: \"${RUNNER_TEMP:?missing RUNNER_TEMP}\"\nvelnor_scratch=\"$RUNNER_TEMP/velnor-project-tool\"\nvelnor_fail() { printf 'velnor: %s\\n' \"$1\" >&2; exit 1; }\nvelnor_get() { mise --no-config --no-env --no-hooks config get -f \"$1\" \"$2\" > \"$velnor_scratch\" 2>/dev/null; }\nvelnor_exact() {\n  IFS= read -r value < \"$velnor_scratch\" || value=\n  printf '%s\\n' \"$value\" | cmp -s - \"$velnor_scratch\" || velnor_fail \"$1 must declare one exact X.Y.Z version\"\n  case \"$value\" in\n    ''|*[!0-9.]*|.*|*.|*..*|*.*.*.*) velnor_fail \"$1 must declare one exact X.Y.Z version, not '$value'\" ;;\n    *.*.*) ;;\n    *) velnor_fail \"$1 must declare one exact X.Y.Z version, not '$value'\" ;;\n  esac\n}\nvelnor_tool() {\n  name=$1\n  shift\n  resolved=\n  for source in \"$@\"; do\n    file=${source%%#*}\n    key=${source#*#}\n    [ -e \"$file\" ] || continue\n    if [ -L \"$file\" ] || [ ! -f \"$file\" ]; then velnor_fail \"$file must be a regular file\"; fi\n    if [ \"$key\" = - ]; then\n      { tr -d ' \\t\\r\\n' < \"$file\" && echo; } > \"$velnor_scratch\"\n    else\n      velnor_get \"$file\" \"$key\" || continue\n      if grep -q '^[A-Za-z0-9_-]* = ' \"$velnor_scratch\"; then\n        velnor_get \"$file\" \"$key.version\" || velnor_fail \"$file $key declares no version\"\n      fi\n    fi\n    velnor_exact \"$file $key\"\n    if [ -n \"$resolved\" ] && [ \"$resolved\" != \"$value\" ]; then\n      velnor_fail \"$name: $file $key declares $value, another source declares $resolved\"\n    fi\n    resolved=$value\n  done\n  [ -n \"$resolved\" ] || velnor_fail \"$name: the project config no longer declares this tool; regenerate the workflow\"\n  printf '%s=%s\\n' \"$name\" \"$resolved\" >> \"$GITHUB_ENV\"\n  if [ \"$name\" = VELNOR_TOOL_RUST ] && [ \"${velnor_export_rustup-0}\" = 1 ]; then\n    printf 'RUSTUP_TOOLCHAIN=%s\\n' \"$resolved\" >> \"$GITHUB_ENV\"\n  fi\n  printf 'velnor: %s=%s\\n' \"$name\" \"$resolved\"\n}\nvelnor_export_rustup=1\nvelnor_tool VELNOR_TOOL_MR_BOXINGTON 'mise.toml#tools.mr-boxington' 'mise.toml#tools.mbx' 'mise.toml#tools.github:jdx/mr-boxington' 'mise.toml#tools.packslip:github.com/jdx/mr-boxington' '.mise.toml#tools.mr-boxington' '.mise.toml#tools.mbx' '.mise.toml#tools.github:jdx/mr-boxington' '.mise.toml#tools.packslip:github.com/jdx/mr-boxington'\nvelnor_tool VELNOR_TOOL_NEXTEST 'mise.toml#tools.aqua:nextest-rs/nextest/cargo-nextest' 'mise.toml#tools.cargo-nextest' 'mise.toml#tools.cargo:cargo-nextest' 'mise.toml#tools.github:nextest-rs/nextest' 'mise.toml#tools.ubi:nextest-rs/nextest' '.mise.toml#tools.aqua:nextest-rs/nextest/cargo-nextest' '.mise.toml#tools.cargo-nextest' '.mise.toml#tools.cargo:cargo-nextest' '.mise.toml#tools.github:nextest-rs/nextest' '.mise.toml#tools.ubi:nextest-rs/nextest'\nvelnor_tool VELNOR_TOOL_RUST 'mise.toml#tools.rust' 'mise.toml#tools.core:rust' '.mise.toml#tools.rust' '.mise.toml#tools.core:rust' 'rust-toolchain.toml#toolchain.channel' 'rust-toolchain#-'\nrm -f \"$velnor_scratch\"\n"
