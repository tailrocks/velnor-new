  jactionlint:
    name: Jactionlint
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env: *m1
    steps:
      - *s2
      - *s1
      - *s3
      - name: Resolve project tool versions
        env: *m14
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
