# Hand-maintained. Rust CI, Alint, Jactionlint, Cargo Deny and Cargo Machete are generated into
# rust-ci.yml (velnor-gen, .velnor/rust-ci.toml). What stays here: the workflow_dispatch contract
# inputs (the qualification code addresses this workflow path) and the helper-gates check.
name: CI
"on":
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      campaign:
        type: string
        required: true
      phase:
        type: choice
        required: true
        options:
          - cold
          - control
          - third
          - useful_delta
          - warm
      predecessor_run_attempt:
        type: string
        required: false
      predecessor_run_id:
        type: string
        required: false
  merge_group:
permissions:
  contents: read
cache-mode: read
env:
  ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
  ACTIONS_ID_TOKEN_REQUEST_URL: ""
  ACTIONS_RUNTIME_TOKEN: ""
  CARGO_REGISTRY_TOKEN: ""
  GH_CONFIG_DIR: ""
  GH_HOST: ""
  GH_TOKEN: ""
  GITHUB_TOKEN: ""
  MISE_AUTO_INSTALL: "false"
  MISE_EXEC_AUTO_INSTALL: "false"
  MISE_GITHUB_TOKEN: ""
  MISE_LOCKFILE: "0"
  MISE_NO_CONFIG: "1"
  MISE_NO_ENV: "1"
  MISE_NO_HOOKS: "1"
  MISE_QUIET: "1"
  NODE_AUTH_TOKEN: ""
  NPM_TOKEN: ""
concurrency:
  group: velnor-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  helper-gates:
    name: Helper gates
    runs-on: [velnor, ubuntu-26.04-scale-set]
    timeout-minutes: 5
    defaults:
      run:
        shell: bash -e {0}
    env:
      VELNOR_RUN_KEY_ATTEMPT: ${{ github.run_attempt }}
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "0"
          persist-credentials: "false"
      - name: Fetch release tags
        run: git fetch --force --tags --quiet origin
      - name: Self-test the gate check
        run: |
          fixtures=scripts/fixtures
          if bash scripts/check-helper-gates.sh --diff "$fixtures/gate-bad.diff" --current 0.1.100; then
            echo "the check accepted a gate that is already released" >&2
            exit 1
          fi
          if bash scripts/check-helper-gates.sh --diff "$fixtures/gate-correction-unmarked.diff" --current 0.1.100; then
            echo "the check accepted an unmarked correction of a released gate" >&2
            exit 1
          fi
          if bash scripts/check-helper-gates.sh --diff "$fixtures/gate-correction-wrong-tag.diff" --current 0.1.100; then
            echo "the check accepted a correction marker that names the wrong tag" >&2
            exit 1
          fi
          if bash scripts/check-helper-gates.sh --diff "$fixtures/gate-correction-previous.diff" --current 0.1.100; then
            echo "the check accepted a correction whose commit already shipped in the previous release" >&2
            exit 1
          fi
          if bash scripts/check-helper-gates.sh --diff "$fixtures/gate-prose.diff" --current 0.1.100; then
            echo "the check accepted the prose gate marker" >&2
            exit 1
          fi
          bash scripts/check-helper-gates.sh --diff "$fixtures/gate-good.diff" --current 0.1.100
          bash scripts/check-helper-gates.sh --diff "$fixtures/gate-correction-good.diff" --current 0.1.100
          out=$(bash scripts/check-helper-gates.sh --diff "$fixtures/gate-correction-untagged.diff" --current 0.1.111)
          case "$out" in
            *"first in tools-v0.1.111 via 66940bed2e"*) ;;
            *) echo "the check did not name the release tag tools-v0.1.111: $out" >&2; exit 1 ;;
          esac
          out=$(bash scripts/check-helper-gates.sh --diff "$fixtures/gate-correction-legacy-rust-ci.diff" --current 0.1.100)
          case "$out" in
            *"first in rust-ci-v0.1.82 via 6d583dd497"*) ;;
            *) echo "the check did not name the release tag rust-ci-v0.1.82: $out" >&2; exit 1 ;;
          esac
          for f in gate-unreleased-untagged gate-unreleased-released-marker gate-prose-released gate-released-unmarked gate-marker-unchanged-wrong-commit gate-marker-unchanged-wrong-version; do
            if bash scripts/check-helper-gates.sh --diff "$fixtures/$f.diff" --current 0.1.110; then
              echo "the check accepted $f.diff" >&2
              exit 1
            fi
          done
          bash scripts/check-helper-gates.sh --diff "$fixtures/gate-unreleased-none.diff" --current 0.1.110
          bash scripts/check-helper-gates.sh --diff "$fixtures/gate-released-marked.diff" --current 0.1.110
          bash scripts/check-helper-gates.sh --diff "$fixtures/gate-marker-unchanged-good.diff" --current 0.1.110
          bash scripts/check-helper-gates.sh --diff "$fixtures/gate-prose-in-code.diff" --current 0.1.110
          bash scripts/check-helper-gates.sh --diff "$fixtures/gate-bump-marked.diff" --current 0.1.111
          if bash scripts/check-helper-gates.sh --diff "$fixtures/gate-bump-unmarked.diff" --current 0.1.111; then
            echo "the check accepted an unmarked gate in the release bump" >&2
            exit 1
          fi
          rel=(--base-version 0.1.110 --tag-version 0.1.110 --current 0.1.111)
          if bash scripts/check-helper-gates.sh --diff /dev/null --tree "$fixtures/gate-tree-unmarked.diff" "${rel[@]}"; then
            echo "the check accepted an unmarked gate already in the tree at the release bump" >&2
            exit 1
          fi
          bash scripts/check-helper-gates.sh --diff /dev/null --tree "$fixtures/gate-tree-marked.diff" "${rel[@]}"
          bash scripts/check-helper-gates.sh --diff /dev/null --tree "$fixtures/gate-tree-future.diff" "${rel[@]}"
          bash scripts/check-helper-gates.sh --diff "$fixtures/gate-marker-in-code.diff" --current 0.1.110
          bash scripts/check-helper-gates.sh --diff "$fixtures/gate-const-marked.diff" --current 0.1.110
          if bash scripts/check-helper-gates.sh --diff "$fixtures/gate-const-unmarked.diff" --current 0.1.110; then
            echo "the check accepted an unmarked released gate in a bare constant" >&2
            exit 1
          fi
          if bash scripts/check-helper-gates.sh --diff "$fixtures/gate-string-marker.diff" --current 0.1.110; then
            echo "the check accepted a helper-gate marker inside a string literal" >&2
            exit 1
          fi
          for f in gate-string-marker-semicolon gate-string-marker-comma gate-string-marker-brace-open gate-string-marker-brace-close; do
            if bash scripts/check-helper-gates.sh --diff "$fixtures/$f.diff" --current 0.1.110; then
              echo "the check accepted a helper-gate marker after a character inside a string literal: $f" >&2
              exit 1
            fi
          done
          bash scripts/check-helper-gates.sh --diff "$fixtures/gate-marker-after-string.diff" --current 0.1.110
          for f in gate-string-marker-raw gate-string-marker-raw-hash gate-string-marker-multiline; do
            if bash scripts/check-helper-gates.sh --diff "$fixtures/$f.diff" --current 0.1.110; then
              echo "the check accepted a helper-gate marker inside a raw or multi-line string literal: $f" >&2
              exit 1
            fi
          done
          bash scripts/check-helper-gates.sh --diff "$fixtures/gate-marker-after-raw-string.diff" --current 0.1.110
          if bash scripts/check-helper-gates.sh --diff "$fixtures/gate-marker-malformed.diff" --current 0.1.110; then
            echo "the check accepted a malformed marker comment" >&2
            exit 1
          fi
          if bash scripts/check-helper-gates.sh --diff "$fixtures/gate-released-unmarked.diff" --current 0.1.109 --base-version 0.1.110 --tag-version 0.1.110; then
            echo "the check let a lowered head version hide a released gate" >&2
            exit 1
          fi
          for f in gate-string-marker-cr gate-tuple-unmarked gate-tuple-spaces gate-tuple-spaces-gate gate-tuple-u64 gate-tuple-trailing-comma gate-tuple-tab gate-dotted-code gate-tuple-suffix-underscore gate-tuple-digit-underscore gate-tuple-radix gate-tuple-leading-zero gate-added-plus-plus; do
            if bash scripts/check-helper-gates.sh --diff "$fixtures/$f.diff" --current 0.1.110; then
              echo "the check accepted $f.diff" >&2
              exit 1
            fi
          done
          for f in gate-call-cast gate-call-parens gate-call-sum gate-call-const gate-call-split gate-call-split-open gate-call-value-cast gate-call-new-ctor gate-call-callee-newline gate-call-open-tuple gate-call-bare-elements; do
            if bash scripts/check-helper-gates.sh --diff "$fixtures/$f.diff" --current 0.1.110; then
              echo "the check accepted a gate row that is not a literal tuple: $f" >&2
              exit 1
            fi
          done
          for f in gate-minimum-raise gate-minimum-split; do
            if bash scripts/check-helper-gates.sh --diff "$fixtures/$f.diff" --current 0.1.110; then
              echo "the check accepted a change of HELPER_MINIMUM without a released marker: $f" >&2
              exit 1
            fi
          done
          for f in gate-call-literal gate-call-minimum gate-call-value-literal gate-call-untagged-literal gate-call-new-ctor-literal gate-minimum-marked; do
            bash scripts/check-helper-gates.sh --diff "$fixtures/$f.diff" --current 0.1.110
          done
          bash scripts/check-helper-gates.sh --diff "$fixtures/gate-tuple-mixed-string.diff" --current 0.1.110
          bash scripts/check-helper-gates.sh --diff "$fixtures/gate-tuple-other-series.diff" --current 0.1.110
          bash scripts/check-helper-gates.sh --diff "$fixtures/gate-removed-minus-minus.diff" --current 0.1.110
          bash scripts/check-helper-gates.sh --diff "$fixtures/gate-marker-after-cstring.diff" --current 0.1.110
          bash scripts/check-helper-gates.sh --diff "$fixtures/gate-marker-nested-comment.diff" --current 0.1.110
          bash scripts/check-helper-gates.sh --diff "$fixtures/gate-const-in-string.diff" --current 0.1.110
          for f in gate-dotted-comment gate-dotted-string gate-dotted-gate-string; do
            bash scripts/check-helper-gates.sh --diff "$fixtures/$f.diff" --current 0.1.110
          done
          bash scripts/test-helper-gates-history.sh
      - name: Check the added gates against the base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/check-helper-gates.sh "origin/$BASE_REF"
  secret-scan:
    name: Secret scanners
    runs-on: [velnor, ubuntu-26.04-scale-set]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -e {0}
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'push' || github.event_name == 'merge_group'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "1"
          persist-credentials: "false"
      - name: Fetch the history of the checked-out commit
        run: git fetch --no-tags --unshallow origin "$(git rev-parse HEAD)"
      - name: Test that the scanner pins ignore repository tool config
        run: bash scripts/test-install-secret-scanners.sh
      - name: Install the pinned secret scanners
        run: bash scripts/install-secret-scanners.sh "$RUNNER_TEMP/secret-scanners"
      - name: Test that the working-tree secret scan fails on a planted token and passes a clean tree
        run: bash scripts/test-secret-scan-worktree.sh
      - name: Print scanner versions
        run: |
          gitleaks version
          betterleaks version
          kingfisher --version
      - name: Test that the secret scan configs report planted tokens in each fixture path
        run: bash scripts/test-secret-scan-config.sh
      - name: Scan the commit history with gitleaks
        run: gitleaks git . --redact --no-banner --config .gitleaks.toml --log-opts="--full-history --diff-merges=first-parent HEAD"
      - name: Scan the commit history with betterleaks
        run: betterleaks git . --redact -c .betterleaks.toml --log-opts="--full-history --diff-merges=first-parent HEAD"
      - name: Scan the working tree with kingfisher
        run: bash scripts/secret-scan-worktree.sh
