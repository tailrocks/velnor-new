  rust-budget:
    name: '${{ ((github.event_name != ''pull_request'' || (startsWith(github.ref, ''refs/pull/'') && github.event.pull_request.state != ''closed'')) && (github.event_name == ''schedule'' || (github.event_name == ''push'' && github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch))) && needs.required.result == ''success'' && needs.rust-plan.result == ''success'' && needs.rust-plan.outputs.skip_push != ''true'' && github.event.pull_request.draft != true && (github.event.action != ''labeled'' || github.event.label.name == ''ci:run'' || github.event.label.name == ''ci:auto'') && (github.event.action != ''edited'' || github.event.changes.base != null) && (github.event_name != ''pull_request'' || (github.event.pull_request.head.repo.full_name == github.repository && (contains(github.event.pull_request.labels.*.name, ''ci:run'') || contains(github.event.pull_request.labels.*.name, ''ci:auto''))))) && format(''Speed budget ({0})'', (needs.rust-plan.outputs.rust_root_mode == ''all'') && ''full'' || ((needs.rust-plan.outputs.rust_root_mode == ''some'') && ''affected'' || ((needs.rust-plan.outputs.rust_root_mode == ''none'') && ''none'' || ''unknown''))) || ''Speed budget'' }}'
    needs:
      - required
      - rust-plan
    if: '${{ (github.event_name != ''pull_request'' || (startsWith(github.ref, ''refs/pull/'') && github.event.pull_request.state != ''closed'')) && (!cancelled() && (github.event_name == ''schedule'' || (github.event_name == ''push'' && github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch))) && github.event.pull_request.draft != true && (github.event.action != ''labeled'' || github.event.label.name == ''ci:run'' || github.event.label.name == ''ci:auto'') && (github.event.action != ''edited'' || github.event.changes.base != null) && (github.event_name != ''pull_request'' || (github.event.pull_request.head.repo.full_name == github.repository && (contains(github.event.pull_request.labels.*.name, ''ci:run'') || contains(github.event.pull_request.labels.*.name, ''ci:auto'')))) && needs.required.result == ''success'' && needs.rust-plan.result == ''success'' && needs.rust-plan.outputs.skip_push != ''true'') }}'
    permissions:
      actions: read
      contents: read
    cache-mode: read
    runs-on: '${{ (!startsWith(github.event_name, ''pull_request'') || github.event.pull_request.head.repo.full_name == github.repository) && ''ubuntu-26.04-scale-set'' || ''ubuntu-latest'' }}'
