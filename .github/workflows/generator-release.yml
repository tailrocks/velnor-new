      - name: Install catalog Rust for candidate execution
        shell: bash
        run: "set -eu\n\ncatalog_version() {\n  awk -F '\"' -v name=\"$1\" '\n    $1 == \"pub const \" name \": &str = \" && $3 == \";\" {\n      value = $2\n      count += 1\n    }\n    END {\n      if (count != 1 || value !~ /^[0-9]+\\.[0-9]+\\.[0-9]+$/) exit 1\n      print value\n    }\n  ' crates/velnor-actions-mise/src/catalog.rs\n}\n\nRUST_VERSION=\"$(catalog_version RUST_VERSION)\"\nACTIONLINT_VERSION=\"$(catalog_version ACTIONLINT_VERSION)\"\nSHELLCHECK_VERSION=\"$(catalog_version SHELLCHECK_VERSION)\"\nZIZMOR_VERSION=\"$(catalog_version ZIZMOR_VERSION)\"\nmise --no-config --no-env --no-hooks install \"rust@$RUST_VERSION\" \"actionlint@$ACTIONLINT_VERSION\" \"shellcheck@$SHELLCHECK_VERSION\" \"zizmor@$ZIZMOR_VERSION\""
      - name: Download exact candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: generator-linux-x64-assets
          path: assets
      - name: Download attested release manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: generator-release-manifest
          path: release-manifest
      - name: Bind downloaded candidate to manifest digest
        env:
          VELNOR_RELEASE_MANIFEST_SHA256: ${{ needs.prepare-manifest.outputs.manifest_sha256 }}
        shell: bash
        run: "set -eu\ncandidate_dir=\"assets\"\ncandidate=\"$candidate_dir/velnor-actions-0.1.1-x86_64-unknown-linux-gnu\"\nsidecar=\"$candidate_dir/velnor-actions-0.1.1-x86_64-unknown-linux-gnu.sha256\"\nprovenance=\"$candidate_dir/velnor-actions-0.1.1-x86_64-unknown-linux-gnu.provenance.json\"\nmanifest=\"release-manifest/release-manifest.json\"\ntest -f \"$candidate\" && test ! -L \"$candidate\" && test -s \"$candidate\"\ntest -f \"$sidecar\" && test ! -L \"$sidecar\" && test -s \"$sidecar\"\ntest -f \"$provenance\" && test ! -L \"$provenance\" && test -s \"$provenance\"\ntest -f \"$manifest\" && test ! -L \"$manifest\" && test -s \"$manifest\"\nchmod +x \"$candidate\"\nentries=\"$(find \"$candidate_dir\" -mindepth 1 -maxdepth 1 -print | wc -l | tr -d ' ')\"\ntest \"$entries\" = 3\nmanifest_entries=\"$(find \"release-manifest\" -mindepth 1 -maxdepth 1 -print | wc -l | tr -d ' ')\"\ntest \"$manifest_entries\" = 1\ncatalog_version() {\n  awk -F '\"' -v name=\"$1\" '$1 == \"pub const \" name \": &str = \" && $3 == \";\" { value = $2; count += 1 } END { if (count != 1 || value !~ /^[0-9]+\\.[0-9]+\\.[0-9]+$/) exit 1; print value }' crates/velnor-actions-mise/src/catalog.rs\n}\ntest \"$GITHUB_WORKFLOW_SHA\" = \"$GITHUB_SHA\"\ntest \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\"\nmanifest_line=\"$(sha256sum -- \"$manifest\")\"\nmanifest_sha=\"${manifest_line%% *}\"\ntest \"$manifest_sha\" = \"$VELNOR_RELEASE_MANIFEST_SHA256\"\njq -e --arg version \"0.1.1\" --arg repository \"tailrocks/velnor-new\" --arg commit \"$GITHUB_SHA\" --arg linux_target \"x86_64-unknown-linux-gnu\" --arg arm_target \"aarch64-apple-darwin\" --arg x64_target \"x86_64-apple-darwin\" --arg linux_asset \"velnor-actions-0.1.1-x86_64-unknown-linux-gnu\" --arg arm_asset \"velnor-actions-0.1.1-aarch64-apple-darwin\" --arg x64_asset \"velnor-actions-0.1.1-x86_64-apple-darwin\" --arg tag \"v0.1.1\" '\n  .schema == 1 and .version == $version and .repository == $repository and .commit == $commit and\n  (.targets | length == 3) and\n  [.targets[].target] == [$linux_target, $arm_target, $x64_target] and\n  all(.targets[];\n    (.sha256 | test(\"^[0-9a-f]{64}$\")) and\n    ((.target == $linux_target and .artifact == (\"https://github.com/\" + $repository + \"/releases/download/\" + $tag + \"/\" + $linux_asset)) or\n     (.target == $arm_target and .artifact == (\"https://github.com/\" + $repository + \"/releases/download/\" + $tag + \"/\" + $arm_asset)) or\n     (.target == $x64_target and .artifact == (\"https://github.com/\" + $repository + \"/releases/download/\" + $tag + \"/\" + $x64_asset)))\n  )\n' \"$manifest\" >/dev/null\nexpected=\"$(jq -er --arg target \"x86_64-unknown-linux-gnu\" '[.targets[] | select(.target == $target)] | if length == 1 then .[0].sha256 else error(\"target_digest_missing\") end' \"$manifest\")\"\ncase \"$expected\" in ''|*[!0-9a-f]*) exit 1 ;; esac\ntest \"${#expected}\" -eq 64\nsidecar_hash=\"$(awk -v name=\"velnor-actions-0.1.1-x86_64-unknown-linux-gnu\" 'NR != 1 || NF != 2 || $2 != name || length($1) != 64 || $1 !~ /^[0-9a-f]+$/ { exit 1 } { print $1 } END { if (NR != 1) exit 1 }' \"$sidecar\")\"\ntest \"$sidecar_hash\" = \"$expected\"\nactual_line=\"$(sha256sum -- \"$candidate\")\"\nactual=\"${actual_line%% *}\"\ntest \"$actual\" = \"$expected\"\njq -e --arg version \"0.1.1\" --arg repository \"$GITHUB_REPOSITORY\" --arg commit \"$GITHUB_SHA\" --arg target \"x86_64-unknown-linux-gnu\" --arg asset \"velnor-actions-0.1.1-x86_64-unknown-linux-gnu\" --arg sha256 \"$expected\" --arg rust \"$(catalog_version RUST_VERSION)\" --arg mbx \"$(catalog_version MR_BOXINGTON_VERSION)\" '.schema == 1 and .version == $version and .repository == $repository and .commit == $commit and .target == $target and .asset == $asset and .sha256 == $sha256 and .toolchain.rust == $rust and .toolchain[\"mr-boxington\"] == $mbx' \"$provenance\" >/dev/null\ntest \"$(./\"$candidate\" --version)\" = \"velnor-actions 0.1.1\"\ndesc=\"$(file -b \"$candidate\")\"\ntest \"$RUNNER_OS:$(uname -m)\" = \"Linux:x86_64\"\ncase \"$desc\" in\n  *ELF*x86-64*) : ;;\n  *) echo \"candidate target mismatch: $desc\" >&2; exit 1 ;;\nesac\n"
      - name: Qualify exact downloaded candidate
