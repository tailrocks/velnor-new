      - name: Verify assets and create canonical same-run manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: "set -eu\n\ncatalog_version() {\n  awk -F '\"' -v name=\"$1\" '\n    $1 == \"pub const \" name \": &str = \" && $3 == \";\" {\n      value = $2\n      count += 1\n    }\n    END {\n      if (count != 1 || value !~ /^[0-9]+\\.[0-9]+\\.[0-9]+$/) exit 1\n      print value\n    }\n  ' crates/velnor-actions-mise/src/catalog.rs\n}\n\n\nGH_VERSION=\"$(catalog_version GH_VERSION)\"\nmise --no-config --no-env --no-hooks install \"gh@$GH_VERSION\"\ngh() {\n  mise --no-config --no-env --no-hooks exec \"gh@$GH_VERSION\" -- gh \"$@\"\n}\n\n\nverify_same_sha_ci() {\n  runs=\"$(gh api \"repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main&per_page=100\")\" || return 1\n  printf '%s\\n' \"$runs\" | jq -e --arg sha \"$GITHUB_SHA\" --arg repo \"$GITHUB_REPOSITORY\" '\n      [\n        .workflow_runs[]? |\n        select(\n          .head_sha == $sha and\n          .head_branch == \"main\" and\n          .event == \"push\" and\n          .path == \".github/workflows/ci.yml\" and\n          .repository.full_name == $repo and\n          .head_repository.full_name == $repo\n        )\n      ] |\n      sort_by(.run_started_at) | last |\n      select(. != null and .status == \"completed\" and .conclusion == \"success\") != null\n    ' >/dev/null || return 1\n}\n\n\nverify_release_environment() {\n  environment=\"$(gh api \"repos/$GITHUB_REPOSITORY/environments/generator-release\")\" || return 1\n  printf '%s\\n' \"$environment\" | jq -e '\n      any(.protection_rules[]?;\n        .type == \"required_reviewers\" and\n        .prevent_self_review == true and\n        (.reviewers | length) > 0\n      ) and\n      .deployment_branch_policy.protected_branches == true and\n      .deployment_branch_policy.custom_branch_policies == false\n    ' >/dev/null || return 1\n}\n\n\ntest \"$GITHUB_REPOSITORY\" = \"tailrocks/velnor-new\"\ntest \"$GITHUB_REF\" = \"refs/heads/main\"\ntest \"$GITHUB_REF_PROTECTED\" = \"true\"\ntest \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\"\nrepository=\"$(gh api \"repos/$GITHUB_REPOSITORY\")\" || exit 1\nprintf '%s\\n' \"$repository\" | jq -e '.default_branch == \"main\"' >/dev/null || exit 1\n\n\nworkspace_version() {\n  awk -F '\"' '\n    /^\\[workspace\\.package\\]$/ { in_workspace = 1; next }\n    /^\\[/ { in_workspace = 0 }\n    in_workspace && $1 == \"version = \" && $2 ~ /^[0-9]+\\.[0-9]+\\.[0-9]+$/ {\n      value = $2\n      count += 1\n    }\n    END {\n      if (count != 1) exit 1\n      print value\n    }\n  ' Cargo.toml\n}\nRELEASE_VERSION=\"$(workspace_version)\"\ntest \"$RELEASE_VERSION\" = \"0.1.1\"\n\n\nassert_files() {\n  dir=\"$1\"\n  asset=\"$2\"\n  sidecar=\"$3\"\n  provenance=\"$4\"\n  unexpected=\"$(find \"$dir\" -mindepth 1 -maxdepth 1 ! -type f -print -quit)\" || return 1\n  test -z \"$unexpected\" || return 1\n  actual_files=\"$(find \"$dir\" -mindepth 1 -maxdepth 1 -type f -printf '%f\\n')\" || return 1\n  actual=\"$(LC_ALL=C sort <<EOF\n$actual_files\nEOF\n)\" || return 1\n  expected=\"$(LC_ALL=C sort <<EOF\n$asset\n$sidecar\n$provenance\nEOF\n)\" || return 1\n  test \"$actual\" = \"$expected\" || return 1\n}\nverify_sidecar() {\n  asset=\"$1\"\n  sidecar=\"$2\"\n  name=\"$(basename \"$asset\")\"\n  expected=\"$(awk -v name=\"$name\" '\n    NR != 1 || NF != 2 || length($1) != 64 || $1 !~ /^[0-9a-f]+$/ || $2 != name { exit 1 }\n    { print $1 }\n    END { if (NR != 1) exit 1 }\n  ' \"$sidecar\")\" || return 1\n  actual_line=\"$(sha256sum -- \"$asset\")\" || return 1\n  actual=\"${actual_line%%  *}\"\n  actual_name=\"${actual_line#*  }\"\n  test \"$actual_name\" = \"$asset\" || return 1\n  test \"${#actual}\" -eq 64 || return 1\n  case \"$actual\" in\n    ''|*[!0-9a-f]*) return 1 ;;\n  esac\n  test \"$expected\" = \"$actual\" || return 1\n  printf '%s\\n' \"$actual\"\n}\nverify_attestation() {\n  gh attestation verify \"$1\" --repo \"$GITHUB_REPOSITORY\" --signer-workflow \"$GITHUB_REPOSITORY/.github/workflows/generator-release.yml\" --source-digest \"$GITHUB_SHA\" --source-ref refs/heads/main --deny-self-hosted-runners\n}\nvalidate_assets() {\n  assert_files linux-assets velnor-actions-0.1.1-x86_64-unknown-linux-gnu velnor-actions-0.1.1-x86_64-unknown-linux-gnu.sha256 velnor-actions-0.1.1-x86_64-unknown-linux-gnu.provenance.json || return 1\n  assert_files macos-assets velnor-actions-0.1.1-aarch64-apple-darwin velnor-actions-0.1.1-aarch64-apple-darwin.sha256 velnor-actions-0.1.1-aarch64-apple-darwin.provenance.json || return 1\n  assert_files macos-intel-assets velnor-actions-0.1.1-x86_64-apple-darwin velnor-actions-0.1.1-x86_64-apple-darwin.sha256 velnor-actions-0.1.1-x86_64-apple-darwin.provenance.json || return 1\n  verify_sidecar linux-assets/velnor-actions-0.1.1-x86_64-unknown-linux-gnu linux-assets/velnor-actions-0.1.1-x86_64-unknown-linux-gnu.sha256 >/dev/null || return 1\n  verify_sidecar macos-assets/velnor-actions-0.1.1-aarch64-apple-darwin macos-assets/velnor-actions-0.1.1-aarch64-apple-darwin.sha256 >/dev/null || return 1\n  verify_sidecar macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin.sha256 >/dev/null || return 1\n  for artifact in linux-assets/velnor-actions-0.1.1-x86_64-unknown-linux-gnu linux-assets/velnor-actions-0.1.1-x86_64-unknown-linux-gnu.sha256 linux-assets/velnor-actions-0.1.1-x86_64-unknown-linux-gnu.provenance.json macos-assets/velnor-actions-0.1.1-aarch64-apple-darwin macos-assets/velnor-actions-0.1.1-aarch64-apple-darwin.sha256 macos-assets/velnor-actions-0.1.1-aarch64-apple-darwin.provenance.json macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin.sha256 macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin.provenance.json; do\n    verify_attestation \"$artifact\" || return 1\n  done\n}\n\n\nverify_same_sha_ci || exit 1\nverify_release_environment || exit 1\nvalidate_assets || exit 1\nrust_version=\"$(catalog_version RUST_VERSION)\"\nmr_boxington_version=\"$(catalog_version MR_BOXINGTON_VERSION)\"\nbash scripts/generator-release/create-release-manifest.sh \"0.1.1\" \"tailrocks/velnor-new\" \"$rust_version\" \"$mr_boxington_version\"\nmkdir -p release-manifest\nmanifest=\"release-manifest/release-manifest.json\"\nmv release-manifest.json \"$manifest\"\ntest -s \"$manifest\"\n"
      - name: Record same-run manifest digest
        id: manifest-digest
        shell: bash
        run: "set -eu\ndigest=\"$(sha256sum 'release-manifest/release-manifest.json' | awk 'NR == 1 && length($1) == 64 && $1 !~ /[^0-9a-f]/ { print $1; next } { exit 1 } END { if (NR != 1) exit 1 }')\"\nprintf 'manifest_sha256=%s\\n' \"$digest\" >> \"$GITHUB_OUTPUT\""
