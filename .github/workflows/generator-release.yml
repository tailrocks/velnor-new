        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: error
          name: generator-release-manifest
          path: release-manifest/release-manifest.json
          retention-days: 1
  qualify-linux-x64:
    name: Qualify Linux x86_64 candidate
    if: needs.release-gate.result == 'success' && needs.build-linux-x64.result == 'success' && needs.prepare-manifest.result == 'success'
