        run: "set -eu\ncandidate=\"$GITHUB_WORKSPACE/assets/velnor-actions-0.1.1-x86_64-apple-darwin\"\nmanifest=\"$GITHUB_WORKSPACE/release-manifest/release-manifest.json\"\nmanifest_line=\"$(shasum -a 256 \"$manifest\")\"\nmanifest_sha=\"${manifest_line%% *}\"\ntest \"$manifest_sha\" = \"$VELNOR_RELEASE_MANIFEST_SHA256\"\nexpected=\"$(jq -er --arg target \"x86_64-apple-darwin\" '[.targets[] | select(.target == $target)] | if length == 1 then .[0].sha256 else error(\"target_digest_missing\") end' \"$manifest\")\"\ncheck_candidate() {\n  actual_line=\"$(shasum -a 256 \"$candidate\")\"\n  actual=\"${actual_line%% *}\"\n  test \"$actual\" = \"$expected\"\n}\ncheck_candidate\ncatalog_version() {\n  awk -F '\"' -v name=\"$1\" '$1 == \"pub const \" name \": &str = \" && $3 == \";\" { value = $2; count += 1 } END { if (count != 1 || value !~ /^[0-9]+\\.[0-9]+\\.[0-9]+$/) exit 1; print value }' crates/velnor-actions-mise/src/catalog.rs\n}\nrust_version=\"$(catalog_version RUST_VERSION)\"\nactionlint_version=\"$(catalog_version ACTIONLINT_VERSION)\"\nshellcheck_version=\"$(catalog_version SHELLCHECK_VERSION)\"\nzizmor_version=\"$(catalog_version ZIZMOR_VERSION)\"\nrun_candidate() {\n  status=0\n  mise --no-config --no-env --no-hooks exec \"rust@$rust_version\" \"actionlint@$actionlint_version\" \"shellcheck@$shellcheck_version\" \"zizmor@$zizmor_version\" -- \"$candidate\" \"$@\" || status=\"$?\"\n  check_candidate || return 1\n  return \"$status\"\n}\ntemp=\"$(mktemp -d \"$RUNNER_TEMP/velnor-release-qualification.XXXXXXXX\")\"\ntrap 'rm -rf \"$temp\"' EXIT\nprepare_repo() {\n  case_name=\"$1\"\n  repo=\"$temp/$case_name\"\n  mkdir -p \"$repo\"\n  cp -R \"$GITHUB_WORKSPACE/fixtures/parity/$case_name/input/.\" \"$repo/\"\n  git -C \"$repo\" init -q\n  git -C \"$repo\" -c user.name='Velnor release qualification' -c user.email='release-qualification@users.noreply.github.com' add --all\n  git -C \"$repo\" -c user.name='Velnor release qualification' -c user.email='release-qualification@users.noreply.github.com' commit -qm 'qualification fixture'\n}\nfor case_name in minimal-cargo multi-crate ignored-stack; do\n  prepare_repo \"$case_name\"\n  repo=\"$temp/$case_name\"\n  preview=\"$temp/$case_name-preview\"\n  (cd \"$repo\" && run_candidate plan > \"$temp/$case_name-plan.stdout\" 2> \"$temp/$case_name-plan.stderr\")\n  test ! -s \"$temp/$case_name-plan.stderr\"\n  repo_path=\"$(cd \"$repo\" && pwd -P)\"\n  head=\"$(git -C \"$repo\" rev-parse HEAD)\"\n  grep -Fq \"Repository: $repo_path\" \"$temp/$case_name-plan.stdout\"\n  sed -e \"s|Repository: $repo_path|Repository: <repo>|g\" -e \"s|$head|<head>|g\" \"$temp/$case_name-plan.stdout\" > \"$temp/$case_name-plan.normalized.txt\"\n  cmp \"$temp/$case_name-plan.normalized.txt\" \"$GITHUB_WORKSPACE/fixtures/parity/$case_name/expected/plan.txt\"\n  (cd \"$repo\" && run_candidate generate --output-dir \"$preview\" > \"$temp/$case_name-generate.stdout\" 2> \"$temp/$case_name-generate.stderr\")\n  cmp \"$preview/.github/workflows/ci.yml\" \"$GITHUB_WORKSPACE/fixtures/parity/$case_name/expected/ci.yml\"\n  cmp \"$preview/.github/actionlint.yaml\" \"$GITHUB_WORKSPACE/fixtures/parity/$case_name/expected/actionlint.yaml\"\n  test -z \"$(git -C \"$repo\" status --porcelain)\"\n  check_candidate\ndone\nfor case_name in malformed malformed-ignored; do\n  prepare_repo \"$case_name\"\n  repo=\"$temp/$case_name\"\n  status=0\n  (cd \"$repo\" && run_candidate plan > \"$temp/$case_name-plan.stdout\" 2> \"$temp/$case_name-plan.stderr\") || status=\"$?\"\n  test \"$status\" = \"$(cat \"$GITHUB_WORKSPACE/fixtures/parity/$case_name/expected/plan.exit\")\"\n  sed 's/\\(malformed_manifest:Cargo.toml: \\).*/\\1<cargo-diagnostic>/' \"$temp/$case_name-plan.stderr\" > \"$temp/$case_name-plan.normalized.stderr\"\n  cmp \"$temp/$case_name-plan.normalized.stderr\" \"$GITHUB_WORKSPACE/fixtures/parity/$case_name/expected/plan.stderr.txt\"\n  test -z \"$(git -C \"$repo\" status --porcelain)\"\n  check_candidate\ndone\nmise --no-config --no-env --no-hooks exec \"rust@$rust_version\" -- scripts/capture-opentofu-goldens.sh check-release \"$candidate\" \"$manifest\" \"$VELNOR_RELEASE_MANIFEST_SHA256\"\ncheck_candidate\n"
  publish-generator:
    name: Publish velnor-actions release
    if: needs.release-gate.result == 'success' && needs.prepare-manifest.result == 'success' && needs.qualify-linux-x64.result == 'success' && needs.qualify-macos-arm64.result == 'success' && needs.qualify-macos-x64.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: generator-release
    permissions:
      actions: read
      attestations: read
      contents: write
    needs:
      - release-gate
      - prepare-manifest
      - qualify-linux-x64
      - qualify-macos-arm64
      - qualify-macos-x64
    steps:
      - name: Check out release SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "1"
          persist-credentials: "false"
          ref: ${{ github.sha }}
      - name: Setup Mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5
        with:
          cache: "false"
          env: "false"
          install: "false"
          version: 2026.9.18
      - name: Download Linux x86_64 assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: generator-linux-x64-assets
          path: linux-assets
      - name: Download macOS arm64 assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: generator-macos-arm64-assets
          path: macos-assets
      - name: Download macOS x86_64 assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: generator-macos-x64-assets
          path: macos-intel-assets
      - name: Download attested release manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: generator-release-manifest
          path: release-manifest
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: "set -eu\n\ncatalog_version() {\n  awk -F '\"' -v name=\"$1\" '\n    $1 == \"pub const \" name \": &str = \" && $3 == \";\" {\n      value = $2\n      count += 1\n    }\n    END {\n      if (count != 1 || value !~ /^[0-9]+\\.[0-9]+\\.[0-9]+$/) exit 1\n      print value\n    }\n  ' crates/velnor-actions-mise/src/catalog.rs\n}\n\n\nGH_VERSION=\"$(catalog_version GH_VERSION)\"\nmise --no-config --no-env --no-hooks install \"gh@$GH_VERSION\"\ngh() {\n  mise --no-config --no-env --no-hooks exec \"gh@$GH_VERSION\" -- gh \"$@\"\n}\n\n\nverify_same_sha_ci() {\n  runs=\"$(gh api \"repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main&per_page=100\")\" || return 1\n  printf '%s\\n' \"$runs\" | jq -e --arg sha \"$GITHUB_SHA\" --arg repo \"$GITHUB_REPOSITORY\" '\n      [\n        .workflow_runs[]? |\n        select(\n          .head_sha == $sha and\n          .head_branch == \"main\" and\n          .event == \"push\" and\n          .path == \".github/workflows/ci.yml\" and\n          .repository.full_name == $repo and\n          .head_repository.full_name == $repo\n        )\n      ] |\n      sort_by(.run_started_at) | last |\n      select(. != null and .status == \"completed\" and .conclusion == \"success\") != null\n    ' >/dev/null || return 1\n}\n\n\nverify_release_environment() {\n  environment=\"$(gh api \"repos/$GITHUB_REPOSITORY/environments/generator-release\")\" || return 1\n  printf '%s\\n' \"$environment\" | jq -e '\n      any(.protection_rules[]?;\n        .type == \"required_reviewers\" and\n        .prevent_self_review == true and\n        (.reviewers | length) > 0\n      ) and\n      .deployment_branch_policy.protected_branches == true and\n      .deployment_branch_policy.custom_branch_policies == false\n    ' >/dev/null || return 1\n}\n\n\ntest \"$GITHUB_REPOSITORY\" = \"tailrocks/velnor-new\"\ntest \"$GITHUB_REF\" = \"refs/heads/main\"\ntest \"$GITHUB_REF_PROTECTED\" = \"true\"\ntest \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\"\nrepository=\"$(gh api \"repos/$GITHUB_REPOSITORY\")\" || exit 1\nprintf '%s\\n' \"$repository\" | jq -e '.default_branch == \"main\"' >/dev/null || exit 1\n\n\nworkspace_version() {\n  awk -F '\"' '\n    /^\\[workspace\\.package\\]$/ { in_workspace = 1; next }\n    /^\\[/ { in_workspace = 0 }\n    in_workspace && $1 == \"version = \" && $2 ~ /^[0-9]+\\.[0-9]+\\.[0-9]+$/ {\n      value = $2\n      count += 1\n    }\n    END {\n      if (count != 1) exit 1\n      print value\n    }\n  ' Cargo.toml\n}\nRELEASE_VERSION=\"$(workspace_version)\"\ntest \"$RELEASE_VERSION\" = \"0.1.1\"\n\n\nassert_files() {\n  dir=\"$1\"\n  asset=\"$2\"\n  sidecar=\"$3\"\n  provenance=\"$4\"\n  unexpected=\"$(find \"$dir\" -mindepth 1 -maxdepth 1 ! -type f -print -quit)\" || return 1\n  test -z \"$unexpected\" || return 1\n  actual_files=\"$(find \"$dir\" -mindepth 1 -maxdepth 1 -type f -printf '%f\\n')\" || return 1\n  actual=\"$(LC_ALL=C sort <<EOF\n$actual_files\nEOF\n)\" || return 1\n  expected=\"$(LC_ALL=C sort <<EOF\n$asset\n$sidecar\n$provenance\nEOF\n)\" || return 1\n  test \"$actual\" = \"$expected\" || return 1\n}\nverify_sidecar() {\n  asset=\"$1\"\n  sidecar=\"$2\"\n  name=\"$(basename \"$asset\")\"\n  expected=\"$(awk -v name=\"$name\" '\n    NR != 1 || NF != 2 || length($1) != 64 || $1 !~ /^[0-9a-f]+$/ || $2 != name { exit 1 }\n    { print $1 }\n    END { if (NR != 1) exit 1 }\n  ' \"$sidecar\")\" || return 1\n  actual_line=\"$(sha256sum -- \"$asset\")\" || return 1\n  actual=\"${actual_line%%  *}\"\n  actual_name=\"${actual_line#*  }\"\n  test \"$actual_name\" = \"$asset\" || return 1\n  test \"${#actual}\" -eq 64 || return 1\n  case \"$actual\" in\n    ''|*[!0-9a-f]*) return 1 ;;\n  esac\n  test \"$expected\" = \"$actual\" || return 1\n  printf '%s\\n' \"$actual\"\n}\nverify_attestation() {\n  gh attestation verify \"$1\" --repo \"$GITHUB_REPOSITORY\" --signer-workflow \"$GITHUB_REPOSITORY/.github/workflows/generator-release.yml\" --source-digest \"$GITHUB_SHA\" --source-ref refs/heads/main --deny-self-hosted-runners\n}\nvalidate_assets() {\n  assert_files linux-assets velnor-actions-0.1.1-x86_64-unknown-linux-gnu velnor-actions-0.1.1-x86_64-unknown-linux-gnu.sha256 velnor-actions-0.1.1-x86_64-unknown-linux-gnu.provenance.json || return 1\n  assert_files macos-assets velnor-actions-0.1.1-aarch64-apple-darwin velnor-actions-0.1.1-aarch64-apple-darwin.sha256 velnor-actions-0.1.1-aarch64-apple-darwin.provenance.json || return 1\n  assert_files macos-intel-assets velnor-actions-0.1.1-x86_64-apple-darwin velnor-actions-0.1.1-x86_64-apple-darwin.sha256 velnor-actions-0.1.1-x86_64-apple-darwin.provenance.json || return 1\n  verify_sidecar linux-assets/velnor-actions-0.1.1-x86_64-unknown-linux-gnu linux-assets/velnor-actions-0.1.1-x86_64-unknown-linux-gnu.sha256 >/dev/null || return 1\n  verify_sidecar macos-assets/velnor-actions-0.1.1-aarch64-apple-darwin macos-assets/velnor-actions-0.1.1-aarch64-apple-darwin.sha256 >/dev/null || return 1\n  verify_sidecar macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin.sha256 >/dev/null || return 1\n  for artifact in linux-assets/velnor-actions-0.1.1-x86_64-unknown-linux-gnu linux-assets/velnor-actions-0.1.1-x86_64-unknown-linux-gnu.sha256 linux-assets/velnor-actions-0.1.1-x86_64-unknown-linux-gnu.provenance.json macos-assets/velnor-actions-0.1.1-aarch64-apple-darwin macos-assets/velnor-actions-0.1.1-aarch64-apple-darwin.sha256 macos-assets/velnor-actions-0.1.1-aarch64-apple-darwin.provenance.json macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin.sha256 macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin.provenance.json; do\n    verify_attestation \"$artifact\" || return 1\n  done\n}\n\n\nverify_same_sha_ci || exit 1\nverify_release_environment || exit 1\nvalidate_assets || exit 1\nmanifest=\"release-manifest/release-manifest.json\"\nunexpected=\"$(find release-manifest -mindepth 1 -maxdepth 1 ! -type f -print -quit)\" || exit 1\ntest -z \"$unexpected\" || exit 1\nactual_manifest=\"$(find release-manifest -mindepth 1 -maxdepth 1 -type f -printf '%f\\n')\" || exit 1\ntest \"$actual_manifest\" = \"release-manifest.json\" || exit 1\nverify_attestation \"$manifest\" || exit 1\nrust_version=\"$(catalog_version RUST_VERSION)\"\nmr_boxington_version=\"$(catalog_version MR_BOXINGTON_VERSION)\"\nbash scripts/generator-release/create-release-manifest.sh \"0.1.1\" \"tailrocks/velnor-new\" \"$rust_version\" \"$mr_boxington_version\"\ncmp release-manifest.json \"$manifest\"\ntag=\"v0.1.1\"\nif git ls-remote --quiet --exit-code --refs \"https://github.com/$GITHUB_REPOSITORY.git\" \"refs/tags/$tag\" >/dev/null 2>&1; then\n  echo \"release tag already exists: $tag\" >&2\n  exit 1\nelse\n  status=\"$?\"\n  test \"$status\" -eq 2 || exit \"$status\"\nfi\ngh release create \"$tag\" --repo \"$GITHUB_REPOSITORY\" --target \"$GITHUB_SHA\" --title \"velnor-actions $tag\" --latest=false --notes \"velnor-actions 0.1.1 built from $GITHUB_SHA.\" linux-assets/velnor-actions-0.1.1-x86_64-unknown-linux-gnu linux-assets/velnor-actions-0.1.1-x86_64-unknown-linux-gnu.sha256 linux-assets/velnor-actions-0.1.1-x86_64-unknown-linux-gnu.provenance.json macos-assets/velnor-actions-0.1.1-aarch64-apple-darwin macos-assets/velnor-actions-0.1.1-aarch64-apple-darwin.sha256 macos-assets/velnor-actions-0.1.1-aarch64-apple-darwin.provenance.json macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin.sha256 macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin.provenance.json \"$manifest\"\n"
