        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: velnor-release-payload-r${{ github.run_id }}-a${{ github.run_attempt }}-${{ matrix.product_id }}-${{ matrix.target }}
          path: ${{ runner.temp }}/velnor/release-output
          if-no-files-found: error
          retention-days: 30
          overwrite: false
          include-hidden-files: false
  preview-assemble:
    name: preview-assemble
    runs-on: ${{ needs.preview-eligibility.outputs.producer_runner }}
    timeout-minutes: ${{ fromJSON(needs.preview-eligibility.outputs.producer_timeout_minutes) }}
    defaults:
      run:
        shell: bash
    if: ${{ github.event_name == 'workflow_run' }}
    needs:
      - preview-eligibility
      - preview-payload
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      VELNOR_RELEASE_POLICY: ${{ needs.preview-eligibility.outputs.release_policy }}
    steps:
      - name: Reject unsupported Velnor SDK host
        run: "case \"${RUNNER_OS-}/${RUNNER_ARCH-}\" in Linux/X64|macOS/ARM64|macOS/X64) ;; *) echo 'unsupported native SDK host' >&2; exit 1 ;; esac"
