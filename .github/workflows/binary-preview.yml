  preview-signer:
    name: preview-signer
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    if: ${{ github.event_name == 'workflow_run' }}
    needs:
      - preview-eligibility
      - preview-assemble
    environment: preview-publish
    permissions:
      actions: read
      contents: read
      attestations: write
      id-token: write
    env:
      VELNOR_RELEASE_POLICY: ${{ needs.preview-eligibility.outputs.release_policy }}
    steps:
      - name: Set up Velnor-owned Mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
        with:
          version: 2026.11.1
          sha256: 7129dbab31d698f9028db9374f7ba7987232b0426f837dcbce437130a61415f9
          install: false
          env: false
          cache: false
          cache_save: false
      - name: Install pinned GitHub CLI
        run: mise --no-config --no-env --no-hooks install gh@2.103.3
      - name: Acquire Velnor
        timeout-minutes: 6
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          CARGO_REGISTRY_TOKEN: ""
          GH_CONFIG_DIR: ""
          GH_HOST: ""
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          MISE_GITHUB_TOKEN: ""
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
          VELNOR_ASSET_SHA256: db7480b83238f85a2e4472d26ba57ca4ee4d6822353cbdaad690b1a2b963b26f
          VELNOR_ASSET_URL: https://github.com/tailrocks/velnor-new/releases/download/v0.1.74/velnor-actions-0.1.74-x86_64-unknown-linux-gnu
          VELNOR_RELEASE_COMMIT: c622bfb187556afb8d3ff3ca917a719e4bb7f32a
        run: "sh -c 'unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN GITHUB_TOKEN MISE_GITHUB_TOKEN GH_TOKEN GH_HOST GH_CONFIG_DIR; d=\"$RUNNER_TEMP/velnor/bin/velnor-actions-0.1.75\"&&mkdir -p \"${d%/*}\"&&s=\"/opt/velnor/seed/generator/${d##*/}\"&&p=\"$VELNOR_ASSET_SHA256  \"&&if [ -f \"$s\" ]&&echo \"$p$s\"|sha256sum -c -;then cp \"$s\" \"$d\";else curl -fsSL --connect-timeout 15 --max-time 120 --retry 5 --retry-all-errors --retry-max-time 180 --proto '\\''=https'\\'' --tlsv1.2 \"$VELNOR_ASSET_URL\" -o \"$d\"&&echo \"$p$d\"|sha256sum -c -;fi&&chmod +x \"$d\"'"
      - name: Execute native release operation
        id: policy-admission
        shell: bash
        env:
          VELNOR_INTERNAL_OP: acquire-preview-source-v1
          VELNOR_REQUEST_FILE: ${{ runner.temp }}/velnor/package-release-policy.json
          VELNOR_RELEASE_COMMIT_COUNT: ${{ needs.preview-eligibility.outputs.commit_count }}
          VELNOR_RELEASE_CI_RUN_ID: ${{ needs.preview-eligibility.outputs.ci_run_id }}
          VELNOR_RELEASE_CI_RUN_ATTEMPT: ${{ needs.preview-eligibility.outputs.ci_attempt }}
          VELNOR_RELEASE_SOURCE_SHA: ${{ needs.preview-eligibility.outputs.source_sha }}
          VELNOR_RELEASE_WORKFLOW_AUTHORITY_SHA: ${{ needs.preview-eligibility.outputs.workflow_authority_sha }}
          VELNOR_RELEASE_SOURCE_ADMISSION_ARTIFACT_ID: ${{ needs.preview-eligibility.outputs.source_admission_artifact_id }}
          VELNOR_RELEASE_SOURCE_ADMISSION_ARTIFACT_DIGEST: ${{ needs.preview-eligibility.outputs.source_admission_artifact_digest }}
          VELNOR_RELEASE_SOURCE_ADMISSION_SHA256: ${{ needs.preview-eligibility.outputs.source_admission_sha256 }}
          GH_TOKEN: ${{ github.token }}
          VELNOR_RELEASE_STATUS_TOKEN: ${{ secrets.RELEASE_STATUS_READ_TOKEN }}
        run: "set -euo pipefail\numask 077\nmkdir -p \"$RUNNER_TEMP/velnor\"\n\"$RUNNER_TEMP/velnor/bin/velnor-actions-0.1.75\"\n"
      - name: Execute native release operation
        id: aggregate
        shell: bash
        env:
          VELNOR_INTERNAL_OP: admit-release-aggregate-v1
          VELNOR_REQUEST_FILE: ${{ runner.temp }}/velnor/package-release-policy.json
          VELNOR_RELEASE_COMMIT_COUNT: ${{ needs.preview-eligibility.outputs.commit_count }}
          VELNOR_RELEASE_CI_RUN_ID: ${{ needs.preview-eligibility.outputs.ci_run_id }}
          VELNOR_RELEASE_CI_RUN_ATTEMPT: ${{ needs.preview-eligibility.outputs.ci_attempt }}
          VELNOR_RELEASE_SOURCE_SHA: ${{ needs.preview-eligibility.outputs.source_sha }}
          VELNOR_RELEASE_WORKFLOW_AUTHORITY_SHA: ${{ needs.preview-eligibility.outputs.workflow_authority_sha }}
          VELNOR_RELEASE_SOURCE_ADMISSION_ARTIFACT_ID: ${{ needs.preview-eligibility.outputs.source_admission_artifact_id }}
          VELNOR_RELEASE_SOURCE_ADMISSION_ARTIFACT_DIGEST: ${{ needs.preview-eligibility.outputs.source_admission_artifact_digest }}
          VELNOR_RELEASE_SOURCE_ADMISSION_SHA256: ${{ needs.preview-eligibility.outputs.source_admission_sha256 }}
          VELNOR_RELEASE_POLICY_ADMISSION_DIGEST: ${{ steps.policy-admission.outputs.admission_digest }}
          GH_TOKEN: ${{ github.token }}
          VELNOR_RELEASE_STATUS_TOKEN: ${{ secrets.RELEASE_STATUS_READ_TOKEN }}
          VELNOR_RELEASE_AGGREGATE_ARTIFACT_ID: ${{ needs.preview-assemble.outputs.artifact_id }}
          VELNOR_RELEASE_AGGREGATE_ARTIFACT_DIGEST: ${{ needs.preview-assemble.outputs.artifact_digest }}
        run: "set -euo pipefail\numask 077\nmkdir -p \"$RUNNER_TEMP/velnor\"\n\"$RUNNER_TEMP/velnor/bin/velnor-actions-0.1.75\"\n"
