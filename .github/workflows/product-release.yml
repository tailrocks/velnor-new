        run: "# SPDX-FileCopyrightText: 2026 Alexey Zhokhov\n# SPDX-License-Identifier: Apache-2.0\n\nset -euo pipefail\n\nreadonly repository='tailrocks/velnor-new'\nreadonly source_sha=\"$VELNOR_SOURCE_SHA\"\nreadonly authority_sha=\"$VELNOR_WORKFLOW_AUTHORITY_SHA\"\nreadonly tag_prefix='binary'\nreadonly fixed_tag=''\nif [[ -n \"$fixed_tag\" ]]; then\n  prepare_tag=\"$fixed_tag\"\nelse\n  prepare_tag=\"${tag_prefix}-${source_sha}\"\nfi\nreadonly prepare_tag\nreadonly prepare_expected_assets='[\"velnor-host\",\"velnor-runner-attestation-helper\",\"LICENSE\",\"NOTICE\",\"SHA256SUMS\"]'\n\nfail() {\n  printf 'release reconciliation (velnor-host binary): %s\\n' \"$1\" >&2\n  exit 1\n}\n\n[[ \"$source_sha\" =~ ^[0-9a-f]{40}$ ]] || fail 'source SHA is malformed'\n[[ \"$authority_sha\" == \"$source_sha\" ]] || fail 'workflow authority differs from source'\n[[ -n \"$GH_TOKEN\" ]] || fail 'read-only GitHub token is missing'\n\ngh() {\n  (\n    mise --no-config --no-env --no-hooks exec gh@2.103.3 -- gh \"$@\" & _velnor_gh_pid=$!\n    ( sleep 60; kill -TERM \"$_velnor_gh_pid\" 2>/dev/null; sleep 5; kill -KILL \"$_velnor_gh_pid\" 2>/dev/null ) </dev/null >/dev/null 2>&1 & _velnor_gh_watch=$!\n    _velnor_gh_status=0\n    wait \"$_velnor_gh_pid\" || _velnor_gh_status=$?\n    kill -KILL \"$_velnor_gh_watch\" 2>/dev/null || true\n    wait \"$_velnor_gh_watch\" 2>/dev/null || true\n    exit \"$_velnor_gh_status\"\n  ) </dev/null\n}\nexport -f gh\n\nassert_tag_target() {\n  local reference tag_object object_type object_sha\n  reference=\"$(gh api \"repos/$repository/git/ref/tags/$prepare_tag\")\" \\\n    || fail 'release tag lookup failed'\n  object_type=\"$(jq -er '.object.type' <<<\"$reference\")\" \\\n    || fail 'release tag response is invalid'\n  object_sha=\"$(jq -er '.object.sha' <<<\"$reference\")\" \\\n    || fail 'release tag response is invalid'\n  if [[ \"$object_type\" == tag ]]; then\n    tag_object=\"$(gh api \"repos/$repository/git/tags/$object_sha\")\" \\\n      || fail 'annotated release tag lookup failed'\n    object_type=\"$(jq -er '.object.type' <<<\"$tag_object\")\" \\\n      || fail 'annotated release tag response is invalid'\n    object_sha=\"$(jq -er '.object.sha' <<<\"$tag_object\")\" \\\n      || fail 'annotated release tag response is invalid'\n  fi\n  [[ \"$object_type\" == commit && \"$object_sha\" == \"$release_commit\" ]] || fail 'tag does not resolve to the exact source commit'\n}\n\n# A fixed version tag is immutable and keeps the commit it was published from.\n# A later dispatch on an unchanged version therefore finds that release at an\n# earlier commit. Print `exact` or `earlier`; refuse any other relationship.\nclassify_release_commit() {\n  local relation\n  [[ \"$release_commit\" =~ ^[0-9a-f]{40}$ ]] || fail 'existing release target is not an exact commit'\n  if [[ \"$release_commit\" == \"$source_sha\" ]]; then\n    printf 'exact\\n'\n    return 0\n  fi\n  [[ -n \"$fixed_tag\" ]] || fail 'existing release target differs from the exact source commit'\n  relation=\"$(gh api \"repos/$repository/compare/$release_commit...$source_sha\" --jq '.status')\" \\\n    || fail 'release commit comparison failed'\n  [[ \"$relation\" == ahead ]] || fail \"published release commit is not an ancestor of the source (status: $relation)\"\n  printf 'earlier\\n'\n}\n\nreleases=\"$(gh api --paginate --slurp \"repos/$repository/releases?per_page=100\")\" \\\n  || fail 'release list request failed'\nmatches=\"$(jq -c --arg tag \"$prepare_tag\" '[.[][]? | select(.tag_name == $tag)]' <<<\"$releases\")\" \\\n  || fail 'release list response is invalid'\ncount=\"$(jq -r 'length' <<<\"$matches\")\" || fail 'release list match count is invalid'\ncase \"$count\" in\n  0)\n    refs=\"$(gh api --paginate --slurp \"repos/$repository/git/matching-refs/tags/$prepare_tag?per_page=100\")\" \\\n      || fail 'matching release tag lookup failed'\n    exact_ref=\"$(jq -r --arg ref \"refs/tags/$prepare_tag\" '[.[][]? | select(.ref == $ref)] | length' <<<\"$refs\")\" \\\n      || fail 'matching release tag response is invalid'\n    [[ \"$exact_ref\" == 0 ]] || fail 'tag exists without a published release; draft or orphan requires reconciliation'\n    printf 'action=build\\n' >> \"$GITHUB_OUTPUT\"\n    exit 0\n    ;;\n  1) ;;\n  *) fail 'multiple releases use the exact source tag' ;;\nesac\n\nrelease_commit=\"$(jq -r '.[0].target_commitish' <<<\"$matches\")\" \\\n  || fail 'release target response is invalid'\nrelease_scope=\"$(classify_release_commit)\"\n\njq -e \\\n  --arg tag \"$prepare_tag\" \\\n  --arg sha \"$release_commit\" \\\n  --argjson expected \"$prepare_expected_assets\" \\\n  '.[0] as $release\n   | $release.tag_name == $tag\n     and $release.target_commitish == $sha\n     and $release.draft == false\n     and $release.prerelease == false\n     and $release.immutable == true\n     and ([$release.assets[].name] | sort) == ($expected | sort)\n     and all($release.assets[];\n       .state == \"uploaded\"\n       and (.size | type == \"number\" and . > 0)\n       and (.digest | type == \"string\" and test(\"^sha256:[0-9a-f]{64}$\")))' \\\n  <<<\"$matches\" >/dev/null || fail 'existing release metadata, immutability, or asset set does not match'\nassert_tag_target\n\nif [[ \"$release_scope\" == earlier ]]; then\n  gh release verify \"$prepare_tag\" --repo \"$repository\" >/dev/null \\\n    || fail 'release signature verification failed'\n  printf '::warning title=Release %s already published::%s is immutable at %s; source %s is NOT released. Bump the version to publish it.\\n' \\\n    \"$prepare_tag\" \"$prepare_tag\" \"$release_commit\" \"$source_sha\"\n  printf 'Release %s already published at %s; source %s was not released (no-op). Bump the version to release it.\\n' \\\n    \"$prepare_tag\" \"$release_commit\" \"$source_sha\" >> \"${GITHUB_STEP_SUMMARY:-/dev/null}\"\n  printf 'action=complete\\n' >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\n\ntemp_dir=\"$(mktemp -d)\" || fail 'could not create release verification directory'\ntrap 'rm -rf \"$temp_dir\"' EXIT\ngh release verify \"$prepare_tag\" --repo \"$repository\" >/dev/null \\\n  || fail 'release signature verification failed'\nmkdir -p \"$temp_dir/assets\" || fail 'could not create release asset directory'\ngh release download \"$prepare_tag\" --repo \"$repository\" --dir \"$temp_dir/assets\" --pattern 'velnor-host' --pattern 'velnor-runner-attestation-helper' --pattern 'LICENSE' --pattern 'NOTICE' --pattern 'SHA256SUMS' || fail 'release asset download failed'\n(cd \"$temp_dir/assets\" && shasum -a 256 --check SHA256SUMS) || fail 'release asset checksum verification failed'\ngh release verify-asset \"$prepare_tag\" \"$temp_dir/assets/velnor-host\" --repo \"$repository\" >/dev/null || fail 'release asset verification failed: assets/velnor-host'\ngh attestation verify \"$temp_dir/assets/velnor-host\" --repo \"$repository\" --source-ref refs/heads/main --source-digest \"$source_sha\" --signer-workflow \"$repository/.github/workflows/product-release-binary.yml\" --signer-digest \"$authority_sha\" >/dev/null || fail 'asset attestation verification failed: assets/velnor-host'\ngh release verify-asset \"$prepare_tag\" \"$temp_dir/assets/velnor-runner-attestation-helper\" --repo \"$repository\" >/dev/null || fail 'release asset verification failed: assets/velnor-runner-attestation-helper'\ngh attestation verify \"$temp_dir/assets/velnor-runner-attestation-helper\" --repo \"$repository\" --source-ref refs/heads/main --source-digest \"$source_sha\" --signer-workflow \"$repository/.github/workflows/product-release-binary.yml\" --signer-digest \"$authority_sha\" >/dev/null || fail 'asset attestation verification failed: assets/velnor-runner-attestation-helper'\ngh release verify-asset \"$prepare_tag\" \"$temp_dir/assets/LICENSE\" --repo \"$repository\" >/dev/null || fail 'release asset verification failed: assets/LICENSE'\ngh attestation verify \"$temp_dir/assets/LICENSE\" --repo \"$repository\" --source-ref refs/heads/main --source-digest \"$source_sha\" --signer-workflow \"$repository/.github/workflows/product-release-binary.yml\" --signer-digest \"$authority_sha\" >/dev/null || fail 'asset attestation verification failed: assets/LICENSE'\ngh release verify-asset \"$prepare_tag\" \"$temp_dir/assets/NOTICE\" --repo \"$repository\" >/dev/null || fail 'release asset verification failed: assets/NOTICE'\ngh attestation verify \"$temp_dir/assets/NOTICE\" --repo \"$repository\" --source-ref refs/heads/main --source-digest \"$source_sha\" --signer-workflow \"$repository/.github/workflows/product-release-binary.yml\" --signer-digest \"$authority_sha\" >/dev/null || fail 'asset attestation verification failed: assets/NOTICE'\ngh release verify-asset \"$prepare_tag\" \"$temp_dir/assets/SHA256SUMS\" --repo \"$repository\" >/dev/null || fail 'release asset verification failed: assets/SHA256SUMS'\ngh attestation verify \"$temp_dir/assets/SHA256SUMS\" --repo \"$repository\" --source-ref refs/heads/main --source-digest \"$source_sha\" --signer-workflow \"$repository/.github/workflows/product-release-binary.yml\" --signer-digest \"$authority_sha\" >/dev/null || fail 'asset attestation verification failed: assets/SHA256SUMS'\nprintf 'action=complete\\n' >> \"$GITHUB_OUTPUT\"\n"
  release-binary:
    name: Run velnor-host binary release graph
    uses: ./.github/workflows/product-release-binary.yml # zizmor: ignore[self-repository]
    needs:
      - release-eligibility
      - prepare-binary
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    with:
      source_sha: ${{ needs.release-eligibility.outputs.source_sha }}
      workflow_authority_sha: ${{ needs.release-eligibility.outputs.workflow_authority_sha }}
      ci_run_id: ${{ needs.release-eligibility.outputs.ci_run_id }}
      ci_attempt: ${{ needs.release-eligibility.outputs.ci_attempt }}
      release_action: ${{ needs.prepare-binary.outputs.action }}
      caller_run_id: ${{ github.run_id }}
      caller_attempt: ${{ github.run_attempt }}
  prepare-generator:
    name: Prepare velnor-actions generator release
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs:
      - release-eligibility
    permissions:
      attestations: read
      actions: read
      contents: read
    outputs:
      action: ${{ steps.reconcile.outputs.action }}
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.release-eligibility.outputs.source_sha }}
          persist-credentials: false
      - name: Setup Mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
        with:
          version: 2026.11.1
          sha256: 7129dbab31d698f9028db9374f7ba7987232b0426f837dcbce437130a61415f9
          install: "false"
          env: "false"
          cache: "false"
          cache_save: "false"
      - name: Resolve project tool versions
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          CARGO_REGISTRY_TOKEN: ""
          GH_CONFIG_DIR: ""
          GH_HOST: ""
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          MISE_GITHUB_TOKEN: ""
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
        shell: /bin/bash --noprofile --norc -p -e -o pipefail {0}
        run: "function_env_unset=(); function_env_scan_complete=0; while IFS= read -r -d '' env_entry; do case \"$env_entry\" in BASH_FUNC_*=*) function_env_unset+=(-u \"${env_entry%%=*}\");; VELNOR_VERIFIER_ENV_SCAN_COMPLETE) function_env_scan_complete=$((function_env_scan_complete + 1));; esac; done < <({ /usr/bin/env -0 && printf '%s\\000' 'VELNOR_VERIFIER_ENV_SCAN_COMPLETE'; }); [ \"$function_env_scan_complete\" -eq 1 ] || exit 1; exec /usr/bin/env \"${function_env_unset[@]}\" -u BASH_ENV -u ENV -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_RUNTIME_TOKEN -u GITHUB_TOKEN -u MISE_GITHUB_TOKEN -u GH_TOKEN -u GH_HOST -u GH_CONFIG_DIR PATH=/usr/bin:/bin:/usr/sbin:/sbin /bin/bash --noprofile --norc -p -e -o pipefail -c 'unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN GITHUB_TOKEN MISE_GITHUB_TOKEN GH_TOKEN GH_HOST GH_CONFIG_DIR; set -eu\n: \"${GITHUB_ENV:?missing GITHUB_ENV}\"\n: \"${RUNNER_TEMP:?missing RUNNER_TEMP}\"\nvelnor_dir=\"$RUNNER_TEMP/velnor-project-tool\"\nvelnor_db=\"$velnor_dir/declared\"\nvelnor_tab=$(printf '\\''\\t'\\'')\nvelnor_safe() { printf '\\''%s'\\'' \"$1\" | cut -c1-64 | tr -c '\\''A-Za-z0-9._/@+-'\\'' '\\''?'\\''; }\nvelnor_fail() { printf '\\''velnor: %s\\n'\\'' \"$1\" >&2; exit 1; }\nvelnor_capture_physical_path() {\n  [ \"$#\" -eq 2 ] || return 1\n  (cd -P \"$1\" && pwd -P) > \"$2\" || return 1\n  resolved_path=\n  newline='\\''\n'\\''\n  while IFS= read -r path_line; do\n    resolved_path=$resolved_path$path_line\"$newline\"\n  done < \"$2\"\n  case \"$resolved_path\" in\n    *\"$newline\") resolved_path=${resolved_path%\"$newline\"} ;;\n    *) return 1 ;;\n  esac\n  printf '\\''%s\\n'\\'' \"$resolved_path\" > \"$2\" || return 1\n}; velnor_bind_selected_mise() { [ \"$#\" -eq 1 ] || return 5; mise_data_dir=${MISE_DATA_DIR-}; if [ -z \"$mise_data_dir\" ]; then if [ -n \"${XDG_DATA_HOME-}\" ]; then mise_data_dir=\"$XDG_DATA_HOME/mise\"; elif [ -n \"${HOME-}\" ]; then mise_data_dir=\"$HOME/.local/share/mise\"; else return 1; fi; fi; case \"$mise_data_dir\" in /*) ;; *) mise_data_dir=./$mise_data_dir;; esac; case \"$mise_data_dir\" in /) ;; */) mise_data_dir=${mise_data_dir%/};; esac; [ -d \"$mise_data_dir\" ] || return 2; velnor_capture_physical_path \"$mise_data_dir\" \"$1\" || return 3; resolved_mise_data_dir=$resolved_path; [ -d \"$resolved_mise_data_dir/bin\" ] || return 4; velnor_capture_physical_path \"$resolved_mise_data_dir/bin\" \"$1\" || return 4; resolved_mise_bin_dir=$resolved_path; mise_bin=\"$resolved_mise_bin_dir/mise\"; [ -f \"$mise_bin\" ] && [ -x \"$mise_bin\" ] && [ ! -L \"$mise_bin\" ] || return 4; MISE_DATA_DIR=\"$resolved_mise_data_dir\"; export MISE_DATA_DIR; return 0; }\nvelnor_mise() { \"$mise_bin\" --no-config --no-env --no-hooks \"$@\"; }\nrm -rf \"$velnor_dir\"\nmkdir -p \"$velnor_dir\"\n: > \"$velnor_db\"\nvelnor_bind_selected_mise \"$velnor_dir/mise-data-dir\" || { velnor_mise_status=$?; velnor_fail \"Setup Mise data directory or binary is invalid (status $velnor_mise_status)\"; }\nvelnor_regular() {\n  if [ -L \"$1\" ] || [ ! -f \"$1\" ]; then velnor_fail \"$1 must be a regular file\"; fi\n}\nvelnor_toml() {\n  cp -- \"$1\" \"$velnor_dir/src.toml\"\n  velnor_mise config get -f \"$velnor_dir/src.toml\" > /dev/null 2>&1 || velnor_fail \"$1 is not valid TOML\"\n}\nvelnor_tools() {\n  velnor_toml \"$1\"\n  if velnor_mise config get -f \"$velnor_dir/src.toml\" tools > \"$velnor_dir/tools\" 2>/dev/null; then\n    awk -v file=\"$1\" '\\''\nfunction unq(s) {\n  if (s ~ /^\"[^\"\\\\]*\"$/ || s ~ /^\\047[^\\047]*\\047$/) { return substr(s, 2, length(s) - 2) }\n  return s\n}\nBEGIN { OFS = \"\\t\"; cur = \"\"; multi = \"\" }\n{\n  line = $0\n  if (multi != \"\") { if (index(line, multi) > 0) { multi = \"\" } next }\n  if (line ~ /^[ \\t]*(#|$)/) { next }\n  if (line ~ /^[ \\t]*\\[/) {\n    hdr = line\n    sub(/^[ \\t]*\\[+[ \\t]*/, \"\", hdr)\n    sub(/[ \\t]*\\]+[ \\t]*$/, \"\", hdr)\n    cur = unq(hdr)\n    if (cur == \"\") { cur = \"?\" }\n    next\n  }\n  eq = index(line, \" = \")\n  if (eq == 0) { next }\n  k = unq(substr(line, 1, eq - 1))\n  v = substr(line, eq + 3)\n  if (v ~ /^\"\"\"/ || v ~ /^\\047\\047\\047/) {\n    d = substr(v, 1, 3)\n    if (index(substr(v, 4), d) == 0) { multi = d }\n    v = d\n  } else {\n    v = unq(v)\n  }\n  if (cur == \"\") { print file, k, v } else if (k == \"version\") { print file, cur, v }\n}'\\'' \"$velnor_dir/tools\" >> \"$velnor_db\"\n  fi\n}\nvelnor_tool_versions() {\n  awk -v file=\"$1\" '\\''\nBEGIN { OFS = \"\\t\" }\n{\n  sub(/[ \\t]*#.*$/, \"\")\n  if ($0 ~ /^[ \\t]*$/) { next }\n  line = $0\n  sub(/^[ \\t]+/, \"\", line)\n  k = line\n  sub(/[ \\t].*$/, \"\", k)\n  v = line\n  if (v == k) { v = \"\" } else { sub(/^[^ \\t]+[ \\t]+/, \"\", v); sub(/[ \\t]+$/, \"\", v) }\n  print file, k, v\n}'\\'' \"$1\" >> \"$velnor_db\"\n}\nvelnor_toolchain() {\n  if grep -q '\\''^[[:space:]]*\\['\\'' \"$1\"; then\n    velnor_toml \"$1\"\n    if velnor_mise config get -f \"$velnor_dir/src.toml\" toolchain.channel > \"$velnor_dir/channel\" 2>/dev/null; then\n      awk -v file=\"$1\" '\\''BEGIN { OFS = \"\\t\" } NR == 1 { v = $0; next } { v = v \" \" $0 } END { print file, \"rust\", v }'\\'' \"$velnor_dir/channel\" >> \"$velnor_db\"\n    fi\n  else\n    printf '\\''%s\\t%s\\t%s\\n'\\'' \"$1\" rust \"$(tr -d '\\'' \\t\\r\\n'\\'' < \"$1\")\" >> \"$velnor_db\"\n  fi\n}\nvelnor_exact() {\n  case \"$2\" in\n    '\\'''\\''|*[!0-9.]*|.*|*.|*..*|*.*.*.*|0[0-9]*|*.0[0-9]*) velnor_fail \"$1 must declare one exact X.Y.Z version, not '\\''$(velnor_safe \"$2\")'\\''\" ;;\n    *.*.*) ;;\n    *) velnor_fail \"$1 must declare one exact X.Y.Z version, not '\\''$(velnor_safe \"$2\")'\\''\" ;;\n  esac\n}\nvelnor_tool() {\n  name=$1\n  shift\n  resolved=\n  origin=\n  while IFS=\"$velnor_tab\" read -r file key value; do\n    matched=0\n    for want in \"$@\"; do\n      if [ \"$key\" = \"$want\" ]; then matched=1; fi\n    done\n    if [ \"$matched\" = 0 ]; then continue; fi\n    velnor_exact \"$file $key\" \"$value\"\n    if [ -n \"$resolved\" ] && [ \"$resolved\" != \"$value\" ]; then\n      velnor_fail \"$name: $file $key declares $value, $origin declares $resolved\"\n    fi\n    if [ -z \"$resolved\" ]; then origin=\"$file $key\"; fi\n    resolved=$value\n  done < \"$velnor_db\"\n  [ -n \"$resolved\" ] || velnor_fail \"$name: the project config no longer declares this tool; regenerate the workflow\"\n  printf '\\''%s=%s\\n'\\'' \"$name\" \"$resolved\" >> \"$GITHUB_ENV\"\n  if [ \"$name\" = VELNOR_TOOL_RUST ] && [ \"${velnor_export_rustup-0}\" = 1 ]; then\n    printf '\\''RUSTUP_TOOLCHAIN=%s\\n'\\'' \"$resolved\" >> \"$GITHUB_ENV\"\n  fi\n  printf '\\''velnor: %s=%s\\n'\\'' \"$name\" \"$resolved\"\n}\n# shellcheck disable=SC2016 # awk program text: awk, not the shell, expands it\nvelnor_lock_awk='\\''BEGIN { q = \"\\\"\"; e1 = \"[[tools.\" key \"]]\"; e2 = \"[[tools.\" q key q \"]]\"; e3 = \"[tools.\" key \"]\"; e4 = \"[tools.\" q key q \"]\"; s1 = \"[tools.\" key \".\"; s2 = \"[tools.\" q key q \".\"; p1 = s1 q \"platforms.\" platform q \"]\"; p2 = s2 q \"platforms.\" platform q \"]\"; p3 = s1 \"platforms.\" platform \"]\"; p4 = s2 \"platforms.\" platform \"]\"; want = \"version = \" q version q; inline = q \"platforms.\" platform q \" = {\"; state = 0 }\n{ line = $0; sub(/^[ \\t]+/, \"\", line); sub(/[ \\t\\r]+$/, \"\", line) }\nline == \"\" || substr(line, 1, 1) == \"#\" { next }\nsubstr(line, 1, 1) == \"[\" {\n  matched = state == 2 || state == 3 || state == 4; other = state == 1 || state == 5\n  if (line == e1 || line == e2 || line == e3 || line == e4) state = 1\n  else if (line == p1 || line == p2 || line == p3 || line == p4) state = matched ? 3 : (other ? 5 : 0)\n  else if (index(line, s1) == 1 || index(line, s2) == 1) state = matched ? 4 : (other ? 5 : 0)\n  else state = 0\n  next\n}\nstate == 1 && line == want { state = 2; next }\nstate == 3 && (index(line, \"checksum = \") == 1 || index(line, \"url = \") == 1) { print lock \" \" key \" \" line; next }\nstate == 2 && index(line, inline) == 1 {\n  if (match(line, /checksum = \"[^\"]*\"/)) print lock \" \" key \" \" substr(line, RSTART, RLENGTH)\n  if (match(line, /[{ ,]url = \"[^\"]*\"/)) print lock \" \" key \" \" substr(line, RSTART + 1, RLENGTH - 1)\n}'\\''\nvelnor_lock() {\n  name=$1\n  shift\n  case \"${RUNNER_OS-}:${RUNNER_ARCH-}\" in\n    Linux:X64) platform=linux-x64 ;;\n    Linux:ARM64) platform=linux-arm64 ;;\n    macOS:X64) platform=macos-x64 ;;\n    macOS:ARM64) platform=macos-arm64 ;;\n    Windows:X64) platform=windows-x64 ;;\n    Windows:ARM64) platform=windows-arm64 ;;\n    *) velnor_fail \"$name: unsupported runner platform '\\''${RUNNER_OS-}:${RUNNER_ARCH-}'\\''\" ;;\n  esac\n  : > \"$velnor_dir/lock\"\n  for lock in $velnor_locks; do\n    if [ ! -e \"$lock\" ] && [ ! -L \"$lock\" ]; then continue; fi\n    velnor_regular \"$lock\"\n    for key in \"$@\"; do\n      awk -v lock=\"$lock\" -v key=\"$key\" -v version=\"$resolved\" -v platform=\"$platform\" \"$velnor_lock_awk\" \"$lock\" >> \"$velnor_dir/lock\" || velnor_fail \"$lock could not be read\"\n    done\n  done\n  lock_digest=unlocked\n  if [ -s \"$velnor_dir/lock\" ]; then\n    if command -v sha256sum >/dev/null 2>&1; then\n      lock_digest=$(sha256sum < \"$velnor_dir/lock\") || velnor_fail \"$name: lock digest failed\"\n    else\n      lock_digest=$(shasum -a 256 < \"$velnor_dir/lock\") || velnor_fail \"$name: lock digest failed\"\n    fi\n    lock_digest=${lock_digest%% *}\n    case \"$lock_digest\" in\n      *[!0-9a-f]*) velnor_fail \"$name: lock digest is not hexadecimal\" ;;\n    esac\n    [ \"${#lock_digest}\" -eq 64 ] || velnor_fail \"$name: lock digest is not SHA-256\"\n  fi\n  printf '\\''%s=%s\\n'\\'' \"$name\" \"$lock_digest\" >> \"$GITHUB_ENV\"\n  printf '\\''velnor: %s=%s\\n'\\'' \"$name\" \"$lock_digest\"\n}\nvelnor_locks='\\''mise.lock .mise.lock'\\''\nfor velnor_file in mise.toml .mise.toml mise.*.toml .mise.*.toml .config/mise.toml .config/mise.*.toml .config/mise/config.toml .config/mise/config.*.toml .config/mise/conf.d/*.toml mise/config.toml mise/config.*.toml .mise/config.toml .mise/config.*.toml; do\n  if [ ! -e \"$velnor_file\" ] && [ ! -L \"$velnor_file\" ]; then continue; fi\n  velnor_regular \"$velnor_file\"\n  velnor_tools \"$velnor_file\"\ndone\nif [ -e .tool-versions ] || [ -L .tool-versions ]; then\n  velnor_regular .tool-versions\n  velnor_tool_versions .tool-versions\nfi\nif [ -e rust-toolchain.toml ] || [ -L rust-toolchain.toml ]; then\n  velnor_regular rust-toolchain.toml\n  velnor_toolchain rust-toolchain.toml\nfi\nif [ -e rust-toolchain ] || [ -L rust-toolchain ]; then\n  velnor_regular rust-toolchain\n  velnor_toolchain rust-toolchain\nfi\nvelnor_tool VELNOR_TOOL_MR_BOXINGTON '\\''mr-boxington'\\'' '\\''mbx'\\'' '\\''github:jdx/mr-boxington'\\'' '\\''packslip:github.com/jdx/mr-boxington'\\''\nvelnor_tool VELNOR_TOOL_RUST '\\''rust'\\'' '\\''core:rust'\\''\nrm -rf \"$velnor_dir\"\n'" # zizmor: ignore[github-env]
      - name: Install pinned GitHub CLI
        shell: bash
        run: mise --no-config --no-env --no-hooks install gh@2.103.3
      - name: Materialize fixed script
        shell: bash
        run: "set -euo pipefail\numask 077\ndir=\"$(mktemp -d \"$RUNNER_TEMP/velnor-fixed-script.XXXXXXXX\")\"\nchmod 0700 \"$dir\"\nprintf 'VELNOR_FIXED_SCRIPT_DIR=%s\\n' \"$dir\" >> \"$GITHUB_ENV\"\n"
      - name: Write fixed authority source script.sh (1/3)
        shell: bash
        run: "set -euo pipefail\nset -C\n/usr/bin/python3 -I -S -c 'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.argv[1], validate=True))' '' > \"$VELNOR_FIXED_SCRIPT_DIR/script.sh\"\n"
      - name: Write fixed authority source script.sh (2/3)
        shell: bash
        run: "set -euo pipefail\nset -C\n/usr/bin/python3 -I -S -c 'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.argv[1], validate=True))' '' >> \"$VELNOR_FIXED_SCRIPT_DIR/script.sh\"\n"
      - name: Write fixed authority source script.sh (3/3)
        shell: bash
        run: "set -euo pipefail\nset -C\n/usr/bin/python3 -I -S -c 'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.argv[1], validate=True))' '' >> \"$VELNOR_FIXED_SCRIPT_DIR/script.sh\"\nchmod 0400 \"$VELNOR_FIXED_SCRIPT_DIR/script.sh\"\n"
      - name: Reconcile immutable family release
        id: reconcile
        env:
          GH_TOKEN: ${{ github.token }}
          VELNOR_SOURCE_SHA: ${{ needs.release-eligibility.outputs.source_sha }}
          VELNOR_WORKFLOW_AUTHORITY_SHA: ${{ needs.release-eligibility.outputs.workflow_authority_sha }}
        run: "/usr/bin/python3 -I -S -c 'import hashlib,sys; sys.exit(hashlib.sha256(open(sys.argv[1], \"rb\").read()).hexdigest() != sys.argv[2])' \"$VELNOR_FIXED_SCRIPT_DIR/script.sh\" '4f4e0805a1a6abab4a85c05e79f2c9a686f80f435e4c52a1be5a6359b896556d'\nexec \"$BASH\" --noprofile --norc -e \"$VELNOR_FIXED_SCRIPT_DIR/script.sh\""
  release-generator:
    name: Run velnor-actions generator release graph
    uses: ./.github/workflows/product-release-generator.yml # zizmor: ignore[self-repository]
    needs:
      - release-eligibility
      - prepare-generator
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    with:
      source_sha: ${{ needs.release-eligibility.outputs.source_sha }}
      workflow_authority_sha: ${{ needs.release-eligibility.outputs.workflow_authority_sha }}
      ci_run_id: ${{ needs.release-eligibility.outputs.ci_run_id }}
      ci_attempt: ${{ needs.release-eligibility.outputs.ci_attempt }}
      release_action: ${{ needs.prepare-generator.outputs.action }}
      caller_run_id: ${{ github.run_id }}
      caller_attempt: ${{ github.run_attempt }}
