t_main_sha() {\n  gh_api \"repos/$repository/commits/main\" | jq -er '.sha' \\\n    || fail 'main commit response is invalid'\n}\n\nlist_exact_source_ci_runs() {\n  local _velnor_label=\"$1\"\n  shift\n  local _velnor_listing _velnor_delay\n  for _velnor_delay in 3 6 12 24 45 ''; do\n    _velnor_listing=\"$(\"$@\")\" || return 1\n    if ! printf '%s\\n' \"$_velnor_listing\" | jq -e '[.[] | (.workflow_runs // [])[]] | length == 0' >/dev/null 2>&1; then\n      printf '%s\\n' \"$_velnor_listing\"\n      return 0\n    fi\n    [[ -n \"$_velnor_delay\" ]] || break\n    printf '%s: the CI run listing is empty; listing again in %ss\\n' \"$_velnor_label\" \"$_velnor_delay\" >&2\n    sleep \"$_velnor_delay\"\n  done\n  printf '%s: the CI run listing stayed empty after 6 attempts\\n' \"$_velnor_label\" >&2\n  printf '%s\\n' \"$_velnor_listing\"\n}\n\nlatest_ci_run() {\n  local listing\n  listing=\"$(list_exact_source_ci_runs 'release eligibility' gh_api --paginate --slurp -X GET \\\n    \"repos/$repository/actions/workflows/ci.yml/runs?head_sha=$source_sha&per_page=100\")\" \\\n    || fail 'CI run lookup failed'\n  printf '%s\\n' \"$listing\" | jq -c \\\n      --arg source_sha \"$source_sha\" \\\n      --arg workflow_path \"$ci_workflow_path\" \\\n      --arg repository \"$repository\" \\\n      '\n  [ .[] | (.workflow_runs // [])[] |\n    select(.path == $workflow_path\n      and .event == \"push\"\n      and .head_branch == \"main\"\n      and .head_sha == $source_sha\n      and .head_repository.full_name == $repository\n      and (.id | type) == \"number\"\n      and (.run_number | type) == \"number\"\n      and (.run_attempt | type) == \"number\")\n  ] as $runs\n  | if ($runs | length) == 0 then null\n    else\n      ($runs | sort_by([.run_number, .id])) as $ordered\n      | $ordered[-1] as $latest\n      | [$ordered[] | select(.run_number == $latest.run_number)] as $same_number\n      | if ($same_number | length) != 1\n        then error(\"ambiguous CI run number\")\n    