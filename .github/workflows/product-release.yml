release_workflow_path\" --signer-digest \"$release_authority_sha\" >/dev/null\n"
  prepare-generator:
    name: Prepare velnor-actions generator release
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs:
      - release-eligibility
    permissions:
      attestations: read
      actions: read
      contents: read
    outputs:
      action: ${{ steps.reconcile.outputs.action }}
    steps:
      - name: Setup pinned Mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5
        with:
          cache: "false"
          env: "false"
          install: "false"
          version: 2026.9.18
      - name: Install pinned GitHub CLI
        run: mise --no-config --no-env --no-hooks install gh@2.102.0
      - name: Reconcile immutable family release
        id: reconcile
