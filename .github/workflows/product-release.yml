        run: "set -euo pipefail\n\nreadonly repository='tailrocks/velnor-new'\nreadonly gh_version='2.102.0'\nreadonly workflow_path='.github/workflows/product-release.yml'\nreadonly source_sha=\"$VELNOR_SOURCE_SHA\"\nreadonly authority_sha=\"$VELNOR_WORKFLOW_AUTHORITY_SHA\"\nreadonly prepare_tag='generator-'\"$source_sha\"\nreadonly prepare_expected_assets='[\"velnor-actions-0.1.0-x86_64-unknown-linux-gnu\",\"velnor-actions-0.1.0-x86_64-unknown-linux-gnu.sha256\",\"velnor-actions-0.1.0-aarch64-apple-darwin\",\"velnor-actions-0.1.0-aarch64-apple-darwin.sha256\"]'\n\nfail() {\n  printf 'release reconciliation (velnor-actions generator): %s\\n' \"$1\" >&2\n  exit 1\n}\n\n[[ \"$source_sha\" =~ ^[0-9a-f]{40}$ ]] || fail 'source SHA is malformed'\n[[ \"$authority_sha\" == \"$source_sha\" ]] || fail 'workflow authority differs from source'\n[[ -n \"$GH_TOKEN\" ]] || fail 'read-only GitHub token is missing'\n\ngh() {\n  mise --no-config --no-env --no-hooks exec \"gh@$gh_version\" -- gh \"$@\"\n}\n\nassert_tag_target() {\n  local reference tag_object object_type object_sha\n  reference=\"$(gh api \"repos/$repository/git/ref/tags/$prepare_tag\")\" \\\n    || fail 'release tag lookup failed'\n  object_type=\"$(jq -er '.object.type' <<<\"$reference\")\" \\\n    || fail 'release tag response is invalid'\n  object_sha=\"$(jq -er '.object.sha' <<<\"$reference\")\" \\\n    || fail 'release tag response is invalid'\n  if [[ \"$object_type\" == tag ]]; then\n    tag_object=\"$(gh api \"repos/$repository/git/tags/$object_sha\")\" \\\n      || fail 'annotated release tag lookup failed'\n    object_type=\"$(jq -er '.object.type' <<<\"$tag_object\")\" \\\n      || fail 'annotated release tag response is invalid'\n    object_sha=\"$(jq -er '.object.sha' <<<\"$tag_object\")\" \\\n      || fail 'annotated release tag response is invalid'\n  fi\n  [[ \"$object_type\" == commit && \"$object_sha\" == \"$source_sha\" ]] || fail 'tag does not resolve to the exact source commit'\n}\n\nreleases=\"$(gh api --paginate --slurp \"repos/$repository/releases?per_page=100\")\" \\\n  || fail 'release list request failed'\nmatches=\"$(jq -c --arg tag \"$prepare_tag\" '[.[][]? | select(.tag_name == $tag)]' <<<\"$releases\")\" \\\n  || fail 'release list response is invalid'\ncount=\"$(jq -r 'length' <<<\"$matches\")\" || fail 'release list match count is invalid'\ncase \"$count\" in\n  0)\n    refs=\"$(gh api --paginate --slurp \"repos/$repository/git/matching-refs/tags/$prepare_tag?per_page=100\")\" \\\n      || fail 'matching release tag lookup failed'\n    exact_ref=\"$(jq -r --arg ref \"refs/tags/$prepare_tag\" '[.[][]? | select(.ref == $ref)] | length' <<<\"$refs\")\" \\\n      || fail 'matching release tag response is invalid'\n    [[ \"$exact_ref\" == 0 ]] || fail 'tag exists without a published release; draft or orphan requires reconciliation'\n    printf 'action=build\\n' >> \"$GITHUB_OUTPUT\"\n    exit 0\n    ;;\n  1) ;;\n  *) fail 'multiple releases use the exact source tag' ;;\nesac\n\njq -e \\\n  --arg tag \"$prepare_tag\" \\\n  --arg sha \"$source_sha\" \\\n  --argjson expected \"$prepare_expected_assets\" \\\n  '.[0] as $release\n   | $release.tag_name == $tag\n     and $release.target_commitish == $sha\n     and $release.draft == false\n     and $release.prerelease == false\n     and $release.immutable == true\n     and ([$release.assets[].name] | sort) == ($expected | sort)\n     and all($release.assets[];\n       .state == \"uploaded\"\n       and (.size | type == \"number\" and . > 0)\n       and (.digest | type == \"string\" and test(\"^sha256:[0-9a-f]{64}$\")))' \\\n  <<<\"$matches\" >/dev/null || fail 'existing release metadata, immutability, or asset set does not match'\nassert_tag_target\n\ntemp_dir=\"$(mktemp -d)\" || fail 'could not create release verification directory'\ntrap 'rm -rf \"$temp_dir\"' EXIT\ngh release verify \"$prepare_tag\" --repo \"$repository\" >/dev/null \\\n  || fail 'release signature verification failed'\nmkdir -p \"$temp_dir/linux-assets\" \"$temp_dir/macos-assets\" || fail 'could not create generator asset directories'\ngh release download \"$prepare_tag\" --repo \"$repository\" --dir \"$temp_dir/linux-assets\" --pattern 'velnor-actions-0.1.0-x86_64-unknown-linux-gnu' --pattern 'velnor-actions-0.1.0-x86_64-unknown-linux-gnu.sha256' || fail 'Linux generator asset download failed'\ngh release download \"$prepare_tag\" --repo \"$repository\" --dir \"$temp_dir/macos-assets\" --pattern 'velnor-actions-0.1.0-aarch64-apple-darwin' --pattern 'velnor-actions-0.1.0-aarch64-apple-darwin.sha256' || fail 'macOS generator asset download failed'\n(cd \"$temp_dir/linux-assets\" && shasum -a 256 --check velnor-actions-0.1.0-x86_64-unknown-linux-gnu.sha256) || fail 'Linux generator checksum verification failed'\n(cd \"$temp_dir/macos-assets\" && shasum -a 256 --check velnor-actions-0.1.0-aarch64-apple-darwin.sha256) || fail 'macOS generator checksum verification failed'\ngh release verify-asset \"$prepare_tag\" \"$temp_dir/linux-assets/velnor-actions-0.1.0-x86_64-unknown-linux-gnu\" --repo \"$repository\" >/dev/null || fail 'release asset verification failed: linux-assets/velnor-actions-0.1.0-x86_64-unknown-linux-gnu'\ngh attestation verify \"$temp_dir/linux-assets/velnor-actions-0.1.0-x86_64-unknown-linux-gnu\" --repo \"$repository\" --source-ref refs/heads/main --source-digest \"$source_sha\" --signer-workflow \"$repository/$workflow_path\" --signer-digest \"$authority_sha\" >/dev/null || fail 'asset attestation verification failed: linux-assets/velnor-actions-0.1.0-x86_64-unknown-linux-gnu'\ngh release verify-asset \"$prepare_tag\" \"$temp_dir/linux-assets/velnor-actions-0.1.0-x86_64-unknown-linux-gnu.sha256\" --repo \"$repository\" >/dev/null || fail 'release asset verification failed: linux-assets/velnor-actions-0.1.0-x86_64-unknown-linux-gnu.sha256'\ngh attestation verify \"$temp_dir/linux-assets/velnor-actions-0.1.0-x86_64-unknown-linux-gnu.sha256\" --repo \"$repository\" --source-ref refs/heads/main --source-digest \"$source_sha\" --signer-workflow \"$repository/$workflow_path\" --signer-digest \"$authority_sha\" >/dev/null || fail 'asset attestation verification failed: linux-assets/velnor-actions-0.1.0-x86_64-unknown-linux-gnu.sha256'\ngh release verify-asset \"$prepare_tag\" \"$temp_dir/macos-assets/velnor-actions-0.1.0-aarch64-apple-darwin\" --repo \"$repository\" >/dev/null || fail 'release asset verification failed: macos-assets/velnor-actions-0.1.0-aarch64-apple-darwin'\ngh attestation verify \"$temp_dir/macos-assets/velnor-actions-0.1.0-aarch64-apple-darwin\" --repo \"$repository\" --source-ref refs/heads/main --source-digest \"$source_sha\" --signer-workflow \"$repository/$workflow_path\" --signer-digest \"$authority_sha\" >/dev/null || fail 'asset attestation verification failed: macos-assets/velnor-actions-0.1.0-aarch64-apple-darwin'\ngh release verify-asset \"$prepare_tag\" \"$temp_dir/macos-assets/velnor-actions-0.1.0-aarch64-apple-darwin.sha256\" --repo \"$repository\" >/dev/null || fail 'release asset verification failed: macos-assets/velnor-actions-0.1.0-aarch64-apple-darwin.sha256'\ngh attestation verify \"$temp_dir/macos-assets/velnor-actions-0.1.0-aarch64-apple-darwin.sha256\" --repo \"$repository\" --source-ref refs/heads/main --source-digest \"$source_sha\" --signer-workflow \"$repository/$workflow_path\" --signer-digest \"$authority_sha\" >/dev/null || fail 'asset attestation verification failed: macos-assets/velnor-actions-0.1.0-aarch64-apple-darwin.sha256'\nprintf 'action=complete\\n' >> \"$GITHUB_OUTPUT\"\n"
  build-linux:
    name: Build Linux velnor-actions
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
    needs:
      - release-eligibility
      - prepare-generator
    if: needs.prepare-generator.outputs.action == 'build'
    env:
      VELNOR_SOURCE_SHA: ${{ needs.release-eligibility.outputs.source_sha }}
      VELNOR_WORKFLOW_AUTHORITY_SHA: ${{ needs.release-eligibility.outputs.workflow_authority_sha }}
      VELNOR_CI_RUN_ID: ${{ needs.release-eligibility.outputs.ci_run_id }}
      VELNOR_CI_ATTEMPT: ${{ needs.release-eligibility.outputs.ci_attempt }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "1"
          persist-credentials: "false"
          ref: ${{ needs.release-eligibility.outputs.source_sha }}
      - name: Setup Mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5
        with:
          cache: "false"
          env: "false"
          install: "false"
          version: 2026.9.18
      - name: Install pinned Rust
        run: "set -eu\nmise --no-config --no-env --no-hooks install rust@1.98.1"
      - name: Build velnor-actions
        run: "set -eu\nmise --no-config --no-env --no-hooks exec rust@1.98.1 -- cargo build --locked --release -p velnor-actions-cli\ncp target/release/velnor-actions velnor-actions-0.1.0-x86_64-unknown-linux-gnu\ntest -s velnor-actions-0.1.0-x86_64-unknown-linux-gnu"
      - name: Verify ELF architecture
        run: "set -eu\ndesc=\"$(file -b velnor-actions-0.1.0-x86_64-unknown-linux-gnu)\"\ncase \"$desc\" in\n  *ELF*x86-64*) ;;\n  *) echo \"not an x86-64 ELF: $desc\" >&2; exit 1 ;;\nesac"
      - name: Checksum built bytes
        run: "set -eu\nsha256sum velnor-actions-0.1.0-x86_64-unknown-linux-gnu > velnor-actions-0.1.0-x86_64-unknown-linux-gnu.sha256"
      - name: Upload Linux assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: error
          name: generator-linux-assets
          path: "velnor-actions-0.1.0-x86_64-unknown-linux-gnu\nvelnor-actions-0.1.0-x86_64-unknown-linux-gnu.sha256"
          retention-days: 1
  attest-linux:
    name: Attest Linux velnor-actions
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    needs:
      - release-eligibility
      - prepare-generator
      - build-linux
    if: needs.prepare-generator.outputs.action == 'build'
    env:
      VELNOR_SOURCE_SHA: ${{ needs.release-eligibility.outputs.source_sha }}
      VELNOR_WORKFLOW_AUTHORITY_SHA: ${{ needs.release-eligibility.outputs.workflow_authority_sha }}
      VELNOR_CI_RUN_ID: ${{ needs.release-eligibility.outputs.ci_run_id }}
      VELNOR_CI_ATTEMPT: ${{ needs.release-eligibility.outputs.ci_attempt }}
    steps:
      - name: Download built assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: generator-linux-assets
          path: assets
      - name: Attest built artifacts
