_SHA\"\nreadonly release_ci_run_id=\"$VELNOR_CI_RUN_ID\"\nreadonly release_ci_attempt=\"$VELNOR_CI_ATTEMPT\"\nreadonly release_action=\"$VELNOR_RELEASE_ACTION\"\nreadonly release_tag='runner-'\"$release_source_sha\"\nreadonly expected_assets='[\"velnor-runner-linux-amd64.tar\",\"velnor-dind-linux-amd64.tar\",\"SHA256SUMS\"]'\nreadonly release_asset_paths=('assets/velnor-runner-linux-amd64.tar' 'assets/velnor-dind-linux-amd64.tar' 'assets/SHA256SUMS')\n\nfamily_fail() {\n  printf 'release publication (runner images): %s\\n' \"$1\" >&2\n  exit 1\n}\n\n[[ \"$release_source_sha\" == \"$GITHUB_SHA\" ]] || family_fail 'source output differs from event source'\n[[ \"$release_authority_sha\" == \"$release_source_sha\" ]] || family_fail 'workflow authority differs from source'\n[[ \"$release_ci_run_id\" =~ ^[0-9]+$ ]] || family_fail 'initial CI run ID is malformed'\n[[ \"$release_ci_attempt\" =~ ^[0-9]+$ ]] || family_fail 'initial CI attempt is malformed'\n[[ -n \"$GH_TOKEN\" ]] || family_fail 'GitHub token is missing'\n\nfamily_gh() {\n  mise --no-config --no-env --no-hooks exec \"gh@$release_gh_version\" -- gh \"$@\"\n}\n\ncheck_eligibility_identity() {\n  local output actual_source actual_authority actual_run actual_attempt\n  output=\"$(mktemp)\"\n  if ! GITHUB_OUTPUT=\"$output\" bash -c \\\n    \"set -euo pipefail; $(declare -f release_eligibility); release_eligibility\"; then\n    rm -f \"$output\"\n    return 1\n  fi\n  actual_source=\"$(sed -n 's/^source_sha=//p' \"$output\")\"\n  actual_authority=\"$(sed -n 's/^workflow_authority_sha=//p' \"$output\")\"\n  actual_run=\"$(sed -n 's/^ci_run_id=//p' \"$output\")\"\n  actual_attempt=\"$(sed -n 's/^ci_attempt=//p' \"$output\")\"\n  rm -f \"$output\"\n  [[ \"$actual_source\" == \"$release_source_sha\" ]] || family_fail 'source changed after initial gate'\n  [[ \"$actual_authority\" == \"$release_authority_sha\" ]] || family_fail 'workflow authority changed after initial gate'\n  [[ \"$actual_run\" == \"$release_ci_run_id\" ]] || family_fail 'latest CI run changed after initial gate'\n  [[ \"$actual_attempt\" == \"$release_ci_attempt\" ]] || family_fail 'latest CI attempt changed after initial gate'\n}\n\nassert_tag_target() {\n  local reference tag_object object_type object_sha\n  reference=\"$(family_gh api \"repos/$release_repository/git/ref/tags/$release_tag\")\"\n  object_type=\"$(jq -er '.object.type' <<<\"$reference\")\"\n  object_sha=\"$(jq -er '.object.sha' <<<\"$reference\")\"\n  if [[ \"$object_type\" == tag ]]; then\n    tag_object=\"$(family_gh api \"repos/$release_repository/git/tags/$object_sha\")\"\n    object_type=\"$(jq -er '.object.type' <<<\"$tag_object\")\"\n    object_sha=\"$(jq -er '.object.sha' <<<\"$tag_object\")\"\n  fi\n  [[ \"$object_type\" == commit && \"$object_sha\" == \"$release_source_sha\" ]] || family_fail 'release tag does not resolve to the exact source commit'\n}\n\nif [[ \"$release_action\" == complete ]]; then\n  check_eligibility_identity\n  existing_output=\"$(mktemp)\"\n  if ! GITHUB_OUTPUT=\"$existing_output\" \\\n    VELNOR_SOURCE_SHA=\"$release_source_sha\" \\\n    VELNOR_WORKFLOW_AUTHORITY_SHA=\"$release_authority_sha\" \\\n    bash -s <<'VELNOR_PREPARE'\nset -euo pipefail\n\nreadonly repository='tailrocks/velnor-new'\nreadonly gh_version='2.102.0'\nreadonly workflow_path='.github/workflows/product-release.yml'\nreadonly source_sha=\"$VELNOR_SOURCE_SHA\"\nreadonly authority_sha=\"$VELNOR_WORKFLOW_AUTHORITY_SHA\"\nreadonly prepare_tag='runner-'\"$source_sha\"\nreadonly prepare_expected_assets='[\"velnor-runner-linux-amd64.tar\",\"velnor-dind-linux-amd64.tar\",\"SHA256SUMS\"]'\n\nfail() {\n  printf 'release reconciliation (runner images): %s\\n' \"$1\" >&2\n  exit 1\n}\n\n[[ \"$source_sha\" =~ ^[0-9a-f]{40}$ ]] || fail 'source SHA is malformed'\n[[ \"$authority_sha\" == \"$source_sha\" ]] || fail 'workflow authority differs from source'\n[[ -n \"$GH_TOKEN\" ]] || fail 'read-only GitHub token is missing'\n\ngh() {\n  mise --no-config --no-env --no-hooks exec \"gh@$gh_version\" -- gh \"$@\"\n}\n\nassert_tag_target() {\n  local reference tag_object object_type object_sha\n  reference=\"$(gh api \"repos/$repository/git/ref/tags/$prepare_tag\")\" \\\n    || fail 'release tag lookup failed'\n  object_type=\"$(jq -er '.object.type' <<<\"$reference\")\" \\\n    || fail 'release tag response is invalid'\n  object_sha=\"$(jq -er '.object.sha' <<<\"$reference\")\" \\\n    || fail 'release tag response is invalid'\n  if [[ \"$object_type\" == tag ]]; then\n    tag_object=\"$(gh api \"repos/$repository/git/tags/$object_sha\")\" \\\n      || fail 'annotated release tag lookup failed'\n    object_type=\"$(jq -er '.object.type' <<<\"$tag_object\")\" \\\n      || fail 'annotated release tag response is invalid'\n    object_sha=\"$(jq -er '.object.sha' <<<\"$tag_object\")\" \\\n      || fail 'annotated release tag response is invalid'\n  fi\n  [[ \"$object_type\" == commit && \"$object_sha\" == \"$source_sha\" ]] || fail 'tag does not resolve to the exact source commit'\n}\n\nreleases=\"$(gh api --paginate --slurp \"repos/$repository/releases?per_page=100\")\" \\\n  || fail 'release list request failed'\nmatches=\"$(jq -c --arg tag \"$prepare_tag\" '[.[][]? | select(.tag_name == $tag)]' <<<\"$releases\")\" \\\n  || fail 'release list response is invalid'\ncount=\"$(jq -r 'length' <<<\"$matches\")\" || fail 'release list match count is invalid'\ncase \"$count\" in\n  0)\n    refs=\"$(gh api --paginate --slurp \"repos/$repository/git/matching-refs/tags/$prepare_tag?per_page=100\")\" \\\n      || fail 'matching release tag lookup failed'\n    exact_ref=\"$(jq -r --arg ref \"refs/tags/$prepare_tag\" '[.[][]? | select(.ref == $ref)] | length' <<<\"$refs\")\" \\\n      || fail 'matching release tag response is invalid'\n    [[ \"$exact_ref\" == 0 ]] || fail 'tag exists without a published release; draft or orphan requires reconciliation'\n    printf 'action=build\\n' >> \"$GITHUB_OUTPUT\"\n    exit 0\n    ;;\n  1) ;;\n  *) fail 'multiple releases use the exact source tag' ;;\nesac\n\njq -e \\\n  --arg tag \"$prepare_tag\" \\\n  --arg sha \"$source_sha\" \\\n  --argjson expected \"$prepare_expected_assets\" \\\n  '.[0] as $release\n   | $release.tag_name == $tag\n     and $release.target_commitish == $sha\n     and $release.draft == false\n     and $release.prerelease == false\n     and $release.immutable == true\n     and ([$release.assets[].name] | sort) == ($expected | sort)\n     and all($release.assets[];\n       .state == \"uploaded\"\n       and (.size | type == \"number\" and . > 0)\n       and (.digest | type == \"string\" and test(\"^sha256:[0-9a-f]{64}$\")))' \\\n  <<<\"$matches\" >/dev/null || fail 'existing release metadata, immutability, or asset set does not match'\nassert_tag_target\n\ntemp_dir=\"$(mktemp -d)\" || fail 'could not create release verification directory'\ntrap 'rm -rf \"$temp_dir\"' EXIT\ngh release verify \"$prepare_tag\" --repo \"$repository\" >/dev/null \\\n  || fail 'release signature verification failed'\nmkdir -p \"$temp_dir/assets\" || fail 'could not create release asset directory'\ngh release download \"$prepare_tag\" --repo \"$repository\" --dir \"$temp_dir/assets\" --pattern 'velnor-runner-linux-amd64.tar' --pattern 'velnor-dind-linux-amd64.tar' --pattern 'SHA256SUMS' || fail 'release asset download failed'\n(cd \"$temp_dir/assets\" && shasum -a 256 --check SHA256SUMS) || fail 'release asset checksum verification failed'\ngh release verify-asset \"$prepare_tag\" \"$temp_dir/assets/velnor-runner-linux-amd64.tar\" --repo \"$repository\" >/dev/null || fail 'release asset verification failed: assets/velnor-runner-linux-amd64.tar'\ngh attestation verify \"$temp_dir/assets/velnor-runner-linux-amd64.tar\" --repo \"$repository\" --source-ref refs/heads/main --source-digest \"$source_sha\" --signer-workflow \"$repository/$workflow_path\" --signer-digest \"$authority_sha\" >/dev/null || fail 'asset attestation verification failed: assets/velnor-runner-linux-amd64.tar'\ngh release verify-asset \"$prepare_tag\" \"$temp_dir/assets/velnor-dind-linux-amd64.tar\" --repo \"$repository\" >/dev/null || fail 'release asset verification failed: assets/velnor-dind-linux-amd64.tar'\ngh attestation verify \"$temp_dir/assets/velnor-dind-linux-amd64.tar\" --repo \"$repository\" --source-ref refs/heads/main --source-digest \"$source_sha\" --signer-workflow \"$repository/$workflow_path\" --signer-digest \"$authority_sha\" >/dev/null || fail 'asset attestation verification failed: assets/velnor-dind-linux-amd64.tar'\ngh release verify-asset \"$prepare_tag\" \"$temp_dir/assets/SHA256SUMS\" --repo \"$repository\" >/dev/null || fail 'release asset verification failed: assets/SHA256SUMS'\ngh attestation verify \"$temp_dir/assets/SHA256SUMS\" --repo \"$repository\" --source-ref refs/heads/main --source-digest \"$source_sha\" --signer-workflow \"$repository/$workflow_path\" --signer-digest \"$authority_sha\" >/dev/null || fail 'asset attestation verification failed: assets/SHA256SUMS'\nprintf 'action=complete\\n' >> \"$GITHUB_OUTPUT\"\n\nVELNOR_PREPARE\n  then\n    rm -f \"$existing_output\"\n    family_fail 'already-published release failed idempotent revalidation'\n  fi\n  grep -Fqx 'action=complete' \"$existing_output\" || family_fail 'release is no longer complete'\n  rm -f \"$existing_output\"\n  exit 0\nfi\n[[ \"$release_action\" == build ]] || family_fail 'unknown preparation action'\n\nreleases=\"$(family_gh api --paginate --slurp \"repos/$release_repository/releases?per_page=100\")\"\nexisting=\"$(jq -r --arg tag \"$release_tag\" '[.[][]? | select(.tag_name == $tag)] | length' <<<\"$releases\")\"\n[[ \"$existing\" == 0 ]] || family_fail 'release appeared after preparation; no overwrite is allowed'\nrefs=\"$(family_gh api --paginate --slurp \"repos/$release_repository/git/matching-refs/tags/$release_tag?per_page=100\")\"\nexact_ref=\"$(jq -r --arg ref \"refs/tags/$release_tag\" '[.[][]? | select(.ref == $ref)] | length' <<<\"$refs\"