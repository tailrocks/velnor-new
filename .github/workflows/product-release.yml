y_fail 'published release is not the exact immutable family release'\nassert_tag_target\nfamily_gh release verify \"$release_tag\" --repo \"$release_repository\" >/dev/null\nfamily_gh release verify-asset \"$release_tag\" \"assets/velnor-runner-linux-amd64.tar\" --repo \"$release_repository\" >/dev/null\nfamily_gh attestation verify \"assets/velnor-runner-linux-amd64.tar\" --repo \"$release_repository\" --source-ref refs/heads/main --source-digest \"$release_source_sha\" --signer-workflow \"$release_repository/$release_workflow_path\" --signer-digest \"$release_authority_sha\" >/dev/null\nfamily_gh release verify-asset \"$release_tag\" \"assets/velnor-dind-linux-amd64.tar\" --repo \"$release_repository\" >/dev/null\nfamily_gh attestation verify \"assets/velnor-dind-linux-amd64.tar\" --repo \"$release_repository\" --source-ref refs/heads/main --source-digest \"$release_source_sha\" --signer-workflow \"$release_repository/$release_workflow_path\" --signer-digest \"$release_authority_sha\" >/dev/null\nfamily_gh release verify-asset \"$release_tag\" \"assets/SHA256SUMS\" --repo \"$release_repository\" >/dev/null\nfamily_gh attestation verify \"assets/SHA256SUMS\" --repo \"$release_repository\" --source-ref refs/heads/main --source-digest \"$release_source_sha\" --signer-workflow \"$release_repository/$release_workflow_path\" --signer-digest \"$release_authority_sha\" >/dev/null\n"
  prepare-binary:
    name: Prepare velnor-host binary release
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs:
      - release-eligibility
    permissions:
      attestations: read
      actions: read
      contents: read
    outputs:
      action: ${{ steps.reconcile.outputs.action }}
    steps:
      - name: Setup pinned Mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5
        with:
          cache: "false"
          env: "false"
          install: "false"
          version: 2026.9.18
      - name: Install pinned GitHub CLI
        run: mise --no-config --no-env --no-hooks install gh@2.102.0
      - name: Reconcile immutable family release
        id: reconcile
        env:
          GH_TOKEN: ${{ github.token }}
          VELNOR_SOURCE_SHA: ${{ needs.release-eligibility.outputs.source_sha }}
          VELNOR_WORKFLOW_AUTHORITY_SHA: ${{ needs.release-eligibility.outputs.workflow_authority_sha }}
        run: "set -euo pipefail\n\nreadonly repository='tailrocks/velnor-new'\nreadonly gh_version='2.102.0'\nreadonly workflow_path='.github/workflows/product-release.yml'\nreadonly source_sha=\"$VELNOR_SOURCE_SHA\"\nreadonly authority_sha=\"$VELNOR_WORKFLOW_AUTHORITY_SHA\"\nreadonly prepare_tag='binary-'\"$source_sha\"\nreadonly prepare_expected_assets='[\"velnor-host\",\"SHA256SUMS\"]'\n\nfail() {\n  printf 'release reconciliation (velnor-host binary): %s\\n' \"$1\" >&2\n  exit 1\n}\n\n[[ \"$source_sha\" =~ ^[0-9a-f]{40}$ ]] || fail 'source SHA is malformed'\n[[ \"$authority_sha\" == \"$source_sha\" ]] || fail 'workflow authority differs from source'\n[[ -n \"$GH_TOKEN\" ]] || fail 'read-only GitHub token is missing'\n\ngh() {\n  mise --no-config --no-env --no-hooks exec \"gh@$gh_version\" -- gh \"$@\"\n}\n\nassert_tag_target() {\n  local reference tag_object object_type object_sha\n  reference=\"$(gh api \"repos/$repository/git/ref/tags/$prepare_tag\")\" \\\n    || fail 'release tag lookup failed'\n  object_type=\"$(jq -er '.object.type' <<<\"$reference\")\" \\\n    || fail 'release tag response is invalid'\n  object_sha=\"$(jq -er '.object.sha' <<<\"$reference\")\" \\\n    || fail 'release tag response is invalid'\n  if [[ \"$object_type\" == tag ]]; then\n    tag_object=\"$(gh api \"repos/$repository/git/tags/$object_sha\")\" \\\n      || fail 'annotated release tag lookup failed'\n    object_type=\"$(jq -er '.object.type' <<<\"$tag_object\")\" \\\n      || fail 'annotated release tag response is invalid'\n    object_sha=\"$(jq -er '.object.sha' <<<\"$tag_object\")\" \\\n      || fail 'annotated release tag response is invalid'\n  fi\n  [[ \"$object_type\" == commit && \"$object_sha\" == \"$source_sha\" ]] || fail 'tag does not resolve to the exact source commit'\n}\n\nreleases=\"$(gh api --paginate --slurp \"repos/$repository/releases?per_page=100\")\" \\\n  || fail 'release list request failed'\nmatches=\"$(jq -c --arg tag \"$prepare_tag\" '[.[][]? | select(.tag_name == $tag)]' <<<\"$releases\")\" \\\n  || fail 'release list response is invalid'\ncount=\"$(jq -r 'length' <<<\"$matches\")\" || fail 'release list match count is invalid'\ncase \"$count\" in\n  0)\n    refs=\"$(gh api --paginate --slurp \"repos/$repository/git/matching-refs/tags/$prepare_tag?per_page=100\")\" \\\n      || fail 'matching release tag lookup failed'\n    exact_ref=\"$(jq -r --arg ref \"refs/tags/$prepare_tag\" '[.[][]? | select(.ref == $ref)] | length' <<<\"$refs\")\" \\\n      || fail 'matching release tag response is invalid'\n    [[ \"$exact_ref\" == 0 ]] || fail 'tag exists without a published release; draft or orphan requires reconciliation'\n    printf 'action=build\\n' >> \"$GITHUB_OUTPUT\"\n    exit 0\n    ;;\n  1) ;;\n  *) fail 'multiple releases use the exact source tag' ;;\nesac\n\njq -e \\\n  --arg tag \"$prepare_tag\" \\\n  --arg sha \"$source_sha\" \\\n  --argjson expected \"$prepare_expected_assets\" \\\n  '.[0] as $release\n   | $release.tag_name == $tag\n     and $release.target_commitish == $sha\n     and $release.draft == false\n     and $release.prerelease == false\n     and $release.immutable == true\n     and ([$release.assets[].name] | sort) == ($expected | sort)\n     and all($release.assets[];\n       .state == \"uploaded\"\n       and (.size | type == \"number\" and . > 0)\n       and (.digest | type == \"string\" and test(\"^sha256:[0-9a-f]{64}$\")))' \\\n  <<<\"$matches\" >/dev/null || fail 'existing release metadata, immutability, or asset set does not match'\nassert_tag_target\n\ntemp_dir=\"$(mktemp -d)\" || fail 'could not create release verification directory'\ntrap 'rm -rf \"$temp_dir\"' EXIT\ngh release verify \"$prepare_tag\" --repo \"$repository\" >/dev/null \\\n  || fail 'release signature verification failed'\nmkdir -p \"$temp_dir/assets\" || fail 'could not create release asset directory'\ngh release download \"$prepare_tag\" --repo \"$repository\" --dir \"$temp_dir/assets\" --pattern 'velnor-host' --pattern 'SHA256SUMS' || fail 'release asset download failed'\n(cd \"$temp_dir/assets\" && shasum -a 256 --check SHA256SUMS) || fail 'release asset checksum verification failed'\ngh release verify-asset \"$prepare_tag\" \"$temp_dir/assets/velnor-host\" --repo \"$repository\" >/dev/null || fail 'release asset verification failed: assets/velnor-host'\ngh attestation verify \"$temp_dir/assets/velnor-host\" --repo \"$repository\" --source-ref refs/heads/main --source-digest \"$source_sha\" --signer-workflow \"$repository/$workflow_path\" --signer-digest \"$authority_sha\" >/dev/null || fail 'asset attestation verification failed: assets/velnor-host'\ngh release verify-asset \"$prepare_tag\" \"$temp_dir/assets/SHA256SUMS\" --repo \"$repository\" >/dev/null || fail 'release asset verification failed: assets/SHA256SUMS'\ngh attestation verify \"$temp_dir/assets/SHA256SUMS\" --repo \"$repository\" --source-ref refs/heads/main --source-digest \"$source_sha\" --signer-workflow \"$repository/$workflow_path\" --signer-digest \"$authority_sha\" >/dev/null || fail 'asset attestation verification failed: assets/SHA256SUMS'\nprintf 'action=complete\\n' >> \"$GITHUB_OUTPUT\"\n"
  build-binary:
    name: Build velnor-host
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
    needs:
      - release-eligibility
      - prepare-binary
    if: needs.prepare-binary.outputs.action == 'build'
    env:
      VELNOR_SOURCE_SHA: ${{ needs.release-eligibility.outputs.source_sha }}
      VELNOR_WORKFLOW_AUTHORITY_SHA: ${{ needs.release-eligibility.outputs.workflow_authority_sha }}
      VELNOR_CI_RUN_ID: ${{ needs.release-eligibility.outputs.ci_run_id }}
      VELNOR_CI_ATTEMPT: ${{ needs.release-eligibility.outputs.ci_attempt }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "1"
          persist-credentials: "false"
          ref: ${{ needs.release-eligibility.outputs.source_sha }}
      - name: Setup Mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5
        with:
          cache: "false"
          env: "false"
          install: "false"
          version: 2026.9.18
      - name: Install pinned Rust
        run: "set -eu\nmise --no-config --no-env --no-hooks install rust@1.98.1"
      - name: Build velnor-host
        run: "set -eu\nmise --no-config --no-env --no-hooks exec rust@1.98.1 -- cargo build --locked --manifest-path crates/velnor-runner/Cargo.toml --release -p velnor-runner-cli\ncp crates/velnor-runner/target/release/velnor-host velnor-host\ntest -s velnor-host"
      - name: Verify Mach-O architecture
        run: "set -eu\ndesc=\"$(file -b velnor-host)\"\ncase \"$desc\" in\n  *Mach-O*arm64*) ;;\n  *) echo \"not an arm64 Mach-O: $desc\" >&2; exit 1 ;;\nesac"
      - name: Checksum built bytes
        run: "set -eu\nshasum -a 256 velnor-host > SHA256SUMS"
      - name: Upload binary asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: error
          name: binary-assets
          path: "velnor-host\nSHA256SUMS"
          retention-days: 1
  attest-binary:
    name: Attest velnor-host
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    needs:
      - release-eligibility
      - prepare-binary
      - build-binary
    if: needs.prepare-binary.outputs.action == 'build'
    env:
      VELNOR_SOURCE_SHA: ${{ needs.release-eligibility.outputs.source_sha }}
      VELNOR_WORKFLOW_AUTHORITY_SHA: ${{ needs.release-eligibility.outputs.workflow_authority_sha }}
      VELNOR_CI_RUN_ID: ${{ needs.release-eligibility.outputs.ci_run_id }}
      VELNOR_CI_ATTEMPT: ${{ needs.release-eligibility.outputs.ci_attempt }}
    steps:
      - name: Download built assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: binary-assets
          path: assets
      - name: Attest built artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: "assets/velnor-host\nassets/SHA256SUMS"
  publish-binary:
    name: Publish velnor-host
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      attestations: read
    needs:
      - release-eligibility
      - prepare-binary
      - attest-binary
    if: always() && needs.release-eligibility.result == 'success' && needs.prepare-binary.result == 'success' && (needs.prepare-binary.outputs.action == 'complete' || (needs.attest-binary.result == 'success'))
    env:
      VELNOR_SOURCE_SHA: ${{ needs.release-eligibility.outputs.source_sha }}
      VELNOR_WORKFLOW_AUTHORITY_SHA: ${{ needs.release-eligibility.outputs.workflow_authority_sha }}
      VELNOR_CI_RUN_ID: ${{ needs.release-eligibility.outputs.ci_run_id }}
      VELNOR_CI_ATTEMPT: ${{ needs.release-eligibility.outputs.ci_attempt }}
    steps:
      - name: Setup pinned Mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5
