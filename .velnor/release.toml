roots = ["."]
after = ["CI", "Qualification", "Rust CI"]
family_tag = "tools-v{{ version }}"
family_trigger = "tag_push"
checksums_file = "BINARY-SHA256SUMS"
commit_file = true
attest = true
# Fast-delivery mode: tags are pushed right after admin merges while Required may be pending (#1666, #1608; owner decision pending). Restore to true once main is green.
family_required_checks = false

[[binaries]]
package = "velnor-ci"
platforms = ["linux-x64", "linux-arm64"]
profile = "release-tools"
smoke = true

[[binaries]]
package = "velnor-gen"
platforms = ["linux-x64", "linux-arm64"]
profile = "release-tools"
smoke = true
