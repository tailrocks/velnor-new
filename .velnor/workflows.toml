env = { GH_TOKEN = "${{ github.token }}" }

[[workflow.job.step]]
name = "Check that the tagged commit is on the default branch"
run = "gh api \"repos/$GITHUB_REPOSITORY/compare/$DEFAULT_BRANCH...$GITHUB_SHA\" --jq '.status == \"behind\" or .status == \"identical\" or error(\"the tagged commit is not on the default branch\")'"
