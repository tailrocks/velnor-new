runner = "ubuntu-26.04-scale-set"
required_check = "Required"
mbx_shared_store = false
docs = "post_merge"
check_alone = "post_merge"
pr_ci = "label"

# Speed budget, provisional. Each limit is the median of the successful first
# attempts of one selection plus a quarter, rounded up (the median of an even
# count is the one `velnor-ci bench budget` computes). The samples are n = 4
# per selection, which is small: tune these after more green main runs (#622).
#
# affected: main pushes whose plan wrote `some` (runner-cli, -host,
#   -qualification and what depends on them). Runs 44612708889, 44613709317,
#   44617267994, 44617883559: wall 625, 648, 666, 1023 s (median 657 s, limit
#   822 s), runner 624, 639, 659, 908 s (median 649 s, limit 812 s).
# none: main pushes whose plan wrote `none` for every root. Runs 44538849616,
#   44545511926, 44549200059, 44552985844: wall 56, 79, 95, 181 s (median
#   87 s, limit 109 s), runner 45, 46, 50, 53 s (median 48 s, limit 60 s).
# full: no main push has selected everything yet, so it has no table and
#   takes the plain keys, which are off.
[budget.affected]
main_wall_seconds = 822
runner_seconds = 812

[budget.none]
main_wall_seconds = 109
runner_seconds = 60

[ci]
skip_push_after_merge_group = true

[crates_mirror]
runner = "ubuntu-26.04-scale-set"
registry = "sparse+https://crates-mirror.velnor-system.svc.cluster.local/index/"
cainfo = "/opt/velnor/crates-mirror/ca-bundle.pem"

[[test_setup]]
root = "."
name = "Prepare pinned Mac proof verifier"
run = "mise --no-config --no-env --no-hooks install aqua:sigstore/cosign@3.1.4"

[[test_setup]]
root = "."
name = "Prepare pinned attestation verifier"
run = "mise --no-config --no-env --no-hooks install gh@2.104.0"

[[test_lane]]
root = "."
features = ["local-mode"]
packages = ["velnor-runner-host"]
filter = "package(velnor-runner-host) and (test(~local::) or binary(local_host_public) or binary(local_pair_public))"
lint = true
doc = true

# Workflow and repository-policy lint. Each entry is a generated job that the
# Required check waits for. Tool versions come from mise.toml and mise.lock.
[[lint]]
kind = "jactionlint"
config = ".github/jactionlint.yaml"

[[lint]]
kind = "alint"
config = ".alint.yml"
probe = "scripts/alint-line-cap-probe.sh"

[[lint]]
kind = "mise-task"
id = "generator-samples"
name = "Generator samples"
task = "lint-generator-samples"
tools = ["jactionlint"]
timeout_minutes = 5

[[lint]]
kind = "mise-task"
id = "parity-verify-candidate"
name = "Parity verifier unit tests"
task = "lint-parity-verify-candidate"
tools = ["python"]
timeout_minutes = 5
