# Velnor-repository-only version-policy file (version-policy §0–§2).
# Header declares the policy schema, stable channel, release registry,
# freshness cadence, and maximum exception age. The [tools] mirror MUST
# equal the compiled catalog in velnor-actions-mise/src/catalog.rs (checked
# by `verify_version_policy` during dogfood generate); the [[actions]]
# mirror MUST equal the action pins in .velnor/freshness-inventory.json
# (checked 2026-10-13; checked by scripts/check-freshness.sh).
# [validation-tools] pins repo-local verification tools activated for
# manual risk-triggered runs (cargo-mutants; NOT wired into CI).
# Consumer repositories do not need this file; the generator never
# creates it.
schema = 1
channel = "stable"
registry = "https://github.com/rust-lang/crates.io-index"
check_interval_hours = 24
max_exception_days = 14

[tools]
mise = "2026.10.9"
rust = "1.99.0"
mr-boxington = "1.24.0"
gh = "2.102.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"
zizmor = "1.30.1"
nextest = "0.9.148"
opentofu = "1.13.1"
release-plz = "0.3.172"

[tool_artifacts.python]
provider = "http"
release = "20261001"
platform = "x86_64-unknown-linux-gnu"
flavor = "install_only_stripped"
source = "https://github.com/astral-sh/python-build-standalone/releases/tag/20261001"
url = "https://github.com/astral-sh/python-build-standalone/releases/download/20261001/cpython-3.14.8%2B20261001-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz"
checksum = "b373a4a4e4e70fc05f368c9b53d7738bf37637682b650d96c742805d2da26c32"
size_bytes = 36292523
strip_components = 1
bin_path = "bin"
binary_sha256 = "4b67d7e58e4e3f58339106f9192dbd66421608dc2fcc6a705b20115ba588232b"

[github_runner_images.linux_x64]
default = "ubuntu-26.04"
supported = ["ubuntu-26.04", "ubuntu-24.04", "ubuntu-22.04"]

