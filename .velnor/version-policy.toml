# Velnor-repository-only version-policy mirror (bootstrap contract §1).
# Mirrors the compiled catalog in velnor-actions-mise/src/catalog.rs plus the
# action pins in .velnor/freshness-inventory.json (qualified 2026-09-28).
# Dogfood CI fails when this mirror differs from the catalog. Consumer
# repositories do not need this file; the generator never creates it.
schema = 1

[tools]
mise = "2026.9.16"
rust = "1.98.1"
mr-boxington = "1.19.0"
gh = "2.101.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"
zizmor = "1.30.1"
nextest = "0.9.146"

[runner]
default = "ubuntu-26.04"

[[actions]]
name = "actions/checkout"
version = "v7.0.1"
sha = "3d3c42e5aac5ba805825da76410c181273ba90b1"
reviewed = "2026-09-28"

[[actions]]
name = "actions/upload-artifact"
version = "v7.0.1"
sha = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
reviewed = "2026-09-28"

[[actions]]
name = "actions/download-artifact"
version = "v8.0.1"
sha = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"
reviewed = "2026-09-28"

[[actions]]
name = "actions/cache"
version = "v6.1.0"
sha = "55cc8345863c7cc4c66a329aec7e433d2d1c52a9"
reviewed = "2026-09-28"
