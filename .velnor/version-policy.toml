# Velnor-repository-only version-policy file (version-policy §0–§2).
# Header declares the policy schema, stable channel, release registry,
# freshness cadence, and maximum exception age. The [tools] and [[actions]]
# mirrors record the pins that the archive guard builder reads; `cosign` is the
# fixed Velnor-owned signer helper. The engine that compared them with its compiled
# catalog was deleted in #1459.
# [validation-tools] pins repo-local verification tools activated for
# manual risk-triggered runs (cargo-mutants; NOT wired into CI).
# Consumer repositories do not need this file; the generator never
# creates it.
schema = 1
channel = "stable"
registry = "https://github.com/rust-lang/crates.io-index"
check_interval_hours = 24
max_exception_days = 14

[tools]
mise = "2026.11.1"
rust = "1.99.1"
mr-boxington = "1.29.2"
gh = "2.104.0"
jactionlint = "2.6.0"
shellcheck = "0.11.0"
nextest = "0.9.152"
opentofu = "1.13.9"
release-plz = "0.4.3"
crane = "0.22.1"
bun = "1.4.4"
cosign = "3.1.4"

[github_runner_images.linux_x64]
default = "ubuntu-26.04"
supported = ["ubuntu-26.04"]

# eligible_on: the date a newer release may be adopted (its publication plus the
# 14-day window). scripts/pins-eligible.sh lists the pins whose date has arrived.
# jdx/mise-action v5.2.10 (90f833d3..., published 2026-11-18) is the newer release.
[[actions]]
name = "jdx/mise-action"
version = "v5.2.9"
sha = "236a21c3b91f5db6d4e174b348674a0f0caac06d"
reviewed = "2026-11-19"
eligible_on = "2026-12-02"

