# Velnor-repository-only version-policy file (version-policy §0–§2).
# Header declares the policy schema, stable channel, release registry,
# freshness cadence, and maximum exception age. The [tools] mirror MUST
# equal the compiled catalog in velnor-actions-mise/src/catalog.rs (checked
# by `verify_version_policy` during dogfood generate); `cosign` is the
# fixed Velnor-owned signer helper and is checked by the release-tools
# pin validator, not installed as a Mise consumer tool. The [[actions]]
# mirror MUST equal the action pins in .velnor/freshness-inventory.json
# (checked 2026-10-19; checked by scripts/check-freshness.sh).
# [validation-tools] pins repo-local verification tools activated for
# manual risk-triggered runs (cargo-mutants; NOT wired into CI).
# Consumer repositories do not need this file; the generator never
# creates it.
schema = 1
channel = "stable"
registry = "https://github.com/rust-lang/crates.io-index"
check_interval_hours = 24
max_exception_days = 14

[tools]
mise = "2026.10.21"
rust = "1.99.1"
mr-boxington = "1.28.0"
gh = "2.103.3"
jactionlint = "2.3.0"
shellcheck = "0.11.0"
nextest = "0.9.150"
opentofu = "1.13.2"
release-plz = "0.4.2"
crane = "0.22.1"
bun = "1.4.4"
cosign = "3.1.4"

[github_runner_images.linux_x64]
default = "ubuntu-26.04"
supported = ["ubuntu-26.04", "ubuntu-24.04", "ubuntu-22.04"]

