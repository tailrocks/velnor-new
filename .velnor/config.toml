schema = 2

[workflow]
name = "Compatibility Fixture"
policy = "velnor-repository-v1"
generator_validation = "bootstrap"
default_branch = "main"

[execution]
default_profile = "hosted"
hosted_profile = "hosted"
scale_set_profile = "local"

[execution.profiles.hosted]
kind = "github-hosted"
label = "ubuntu-26.04"
platform = "linux/amd64"

[execution.profiles.local]
kind = "github-scale-set"
name = "compatibility-local"
labels = ["velnor", "compatibility-local"]
platform = "linux/amd64"

[[checks]]
id = "protocol-smoke"
task = "protocol-smoke"
directory = "."
inputs = ["mise.toml", "protocol-input.txt"]
tools = []
timeout_minutes = 1

[checks.runner]
label = "macos-26"
platform = "macos_arm64"
executor = "hosted"
