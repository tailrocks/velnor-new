  ".cargo/config",
  ".cargo/config.toml",
  ".gitignore",
  ".mise-version",
  "Cargo.lock",
  "Cargo.toml",
  "mise.lock",
  "mise.toml",
  "rust-toolchain",
  "rust-toolchain.toml",
]
packages = ["velnor-archive-guard"]
complete = true

[[stacks.rust.inputs]]
globs = [
  "crates/velnor-actions-orchestrator/**",
  ".velnor/qualification/**",
  ".velnor/config.toml",
  ".velnor/controller-approvals.json",
  ".velnor/generator.lock",
