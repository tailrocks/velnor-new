  "images/resource-probe/Dockerfile",
  "scripts/check-runner-image-candidate.sh",
  "scripts/runner-family-discovery.sh",
  "scripts/resolve-runner-family-producer.sh",
  "scripts/resolve-runner-family-publication.sh",
