schema = 2

[workflow]
name = "CI"
policy = "velnor-repository-v1"
default_branch = "main"
generator_validation = "bootstrap"
max_parallel_jobs = 2
crate_timeout_minutes = 15
plan_timeout_minutes = 15
pull_request_cache_policy = "read-only"

[workflow.lint]
# jactionlint's security and policy rules (hard decision 10); velnor-new is
# the first repository on them.
profile = "default"

[dco]
# The dco-2 app is installed organization-wide; this repository requires no sign-off.
require = { members = false }

[resources]
compiler_process_budget = 2
test_process_budget = 2

[test_sharding]
default_shards = 1

[test_sharding.by_manifest]

[stacks]
ignore = []

[stacks.rust]
compile_driver = "mbx"
test_runner = "cargo_nextest"

# velnor-actions-cli's repository-policy tests read every package's manifest,
# sources, and tests in both workspaces (MSRV parity with
# crates/velnor-runner/Cargo.toml, test registration, metadata policy). The
# globs name only package directories plus the runner workspace manifest, so
# every unowned path (crates/test_support, crates/velnor-runner/deny.toml, ...)
# still runs everything. Other crates whose tests read the repository through
# CARGO_MANIFEST_DIR stay always-run (`undeclared_reads`) until a rule naming
# them lists all their inputs with `complete = true`.
[[stacks.rust.inputs]]
globs = [
  "crates/velnor-actions-*/**",
  "crates/velnor-archive-guard/**",
  "crates/velnor-runner/Cargo.toml",
  "crates/velnor-runner/crates/*/**",
]
packages = ["velnor-actions-cli"]
complete = true

[[stacks.rust.configurations]]
name = "default"
features = ["default"]
target = "host"

[stacks.rust.release]
enabled = false
manifest_path = "Cargo.toml"
packages = []
publishable_workspace = false
environment = "release"
release_pr = true
tag_name = "{{ package }}-v{{ version }}"

[discovery]
exclude = ["fixtures/**", "crates/**/tests/fixtures/**"]

[actions.overrides]

[execution]
default_profile = "hosted"
hosted_profile = "hosted"
scale_set_profile = "local"
workflows = ["qualification", "image_release", "macos_binary_release", "generator_release"]

[execution.profiles.hosted]
kind = "github-hosted"
label = "ubuntu-26.04"
platform = "linux/amd64"

[execution.profiles.local]
kind = "github-scale-set"
name = "ubuntu-26.04-scale-set"
labels = ["velnor", "ubuntu-26.04-scale-set"]
platform = "linux/amd64"

