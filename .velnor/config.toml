schema = 2

[workflow]
crate_timeout_minutes = 10
name = "CI"
policy = "velnor-repository-v1"
default_branch = "main"
generator_validation = "bootstrap"
max_parallel_jobs = 2
pull_request_cache_policy = "same-repository-scoped"

[resources]
compiler_process_budget = 2
test_process_budget = 2

[test_sharding]
default_shards = 1

[test_sharding.by_manifest]

[stacks]
ignore = []

[stacks.rust]
compile_driver = "mbx"
test_runner = "cargo_nextest"

[[stacks.rust.configurations]]
name = "default"
features = ["default"]
target = "host"

[stacks.rust.release]
enabled = false
manifest_path = "Cargo.toml"
packages = []
publishable_workspace = false
environment = "release"
authentication = "trusted-publishing"
release_pr = true
tag_name = "{{ package }}-v{{ version }}"

[discovery]
exclude = ["fixtures/**", "crates/**/tests/fixtures/**"]

[actions.overrides]

[execution]
default_profile = "hosted"
hosted_profile = "hosted"
scale_set_profile = "local"
workflows = ["qualification", "image_release", "macos_binary_release", "generator_release"]

[execution.profiles.hosted]
kind = "github-hosted"
label = "ubuntu-26.04"
platform = "linux/amd64"

[execution.profiles.local]
kind = "github-scale-set"
name = "ubuntu-26.04-scale-set"
labels = ["velnor", "ubuntu-26.04-scale-set"]
platform = "linux/amd64"
job_container_image = "ghcr.io/tailrocks/velnor-job@sha256:b36946574402eb0c79fb6d7a9f7a77195d2ef943c92bc6b0fbc466ff3ea408f9"

[[qualified_tools]]
id = "cargo-nextest"
backend = { kind = "aqua", package = "nextest-rs/nextest/cargo-nextest" }
version = "0.9.148"
options = { kind = "default" }
depends_on = ["rust"]
[[qualified_tools.platforms]]
platform = "linux_x64"
artifacts = [
  { url = "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.148/cargo-nextest-0.9.148-x86_64-unknown-linux-gnu.tar.gz", sha256 = "223ba936714cc861a9cdedad5a8eb664dfdd69d6fbdf6cea6aa8184f523290dc" },
]
