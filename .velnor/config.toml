schema = 2

[workflow]
name = "CI"
policy = "velnor-repository-v1"
default_branch = "main"
generator_validation = "bootstrap"
max_parallel_jobs = 2
crate_timeout_minutes = 45
plan_timeout_minutes = 15
pull_request_cache_policy = "read-only"

[workflow.lint]
# jactionlint's security and policy rules (hard decision 10); velnor-new is
# the first repository on them.
profile = "default"

[dco]
# The dco-2 app is installed organization-wide; this repository requires no sign-off.
require = { members = false }

[resources]
compiler_process_budget = 2
test_process_budget = 2

[test_sharding]
default_shards = 1

[test_sharding.by_manifest]

[stacks]
ignore = []

[stacks.rust]
compile_driver = "mbx"
test_runner = "cargo_nextest"
non_inputs = ["docs/**"]

[[stacks.rust.inputs]]
globs = [
  "crates/velnor-actions-*/**",
  "crates/velnor-archive-guard/**",
  "crates/velnor-runner/Cargo.toml",
  "crates/velnor-runner/crates/*/**",
  "scripts/native-image-candidate-inventory.py",
]
packages = ["velnor-actions-cli"]
complete = true

[[stacks.rust.inputs]]
globs = [
  "crates/velnor-runner/crates/velnor-runner-host/**",
  ".velnor/runner.lock",
  "crates/velnor-runner/Cargo.toml",
  "crates/velnor-runner/Cargo.lock",
]
packages = ["velnor-runner-host"]
complete = true

[[stacks.rust.inputs]]
globs = ["local/**"]
packages = ["velnor-cache-rules", "velnor-local"]
complete = true

[[stacks.rust.inputs]]
globs = ["crates/velnor-actions-contract/**"]
packages = ["velnor-actions-contract"]
complete = true

[[stacks.rust.inputs]]
globs = ["crates/velnor-actions-rust/**"]
packages = ["velnor-actions-rust"]
complete = true

[[stacks.rust.inputs]]
globs = ["ci-helper/**"]
packages = ["velnor-ci"]
complete = true

[[stacks.rust.inputs]]
globs = ["generator/**", ".github/workflows/release-rust-ci-tools.yml"]
packages = ["velnor-model", "velnor-rust", "velnor-render", "velnor-gen", "velnor-release"]
complete = true

[[stacks.rust.inputs]]
globs = ["actions/setup-velnor/action.yml"]
packages = ["velnor-gen"]
complete = true

[[stacks.rust.inputs]]
globs = [
  "crates/velnor-runner/crates/velnor-runner-attestation/**",
  "crates/velnor-runner/Cargo.toml",
  "crates/velnor-runner/Cargo.lock",
]
packages = ["velnor-runner-attestation"]
complete = true

[[stacks.rust.inputs]]
globs = [
  "crates/velnor-actions-workflow-renderer/**",
  ".github/workflows/**",
  ".velnor/config.toml",
  "scripts/generator-release/cargo-git-handoff.py",
  "scripts/generator-release/cargo-source-handoff.sh",
  "scripts/generator-release/preflight-release-tag.sh",
  "scripts/generator-release/create-release-manifest.sh",
  "scripts/generator-release/source-qualification.sh",
  "scripts/upgrades/bump-gradle-catalog.py",
  "scripts/derive-rust-tree-digest",
  "LICENSE",
  "NOTICE",
]
packages = ["velnor-actions-workflow-renderer"]
complete = true

[[stacks.rust.inputs]]
globs = [
  ".config/**",
  ".github/**",
  ".velnor/config.toml",
  ".velnor/controller-approvals.json",
  ".velnor/generator.lock",
  ".velnor/mise.lock",
  ".velnor/mise.toml",
  ".velnor/qualification/**",
  ".velnor/runner.lock",
  ".velnor/rust-ci.lock",
  ".velnor/rust-ci.toml",
  ".velnor/rust-inputs.lock",
  ".velnor/rust-metadata.json",
  ".velnor/rust-toolchain.toml",
  ".velnor/version-policy.toml",
  "crates/**",
  "fixtures/**",
  "images/**",
