  "scripts/generator-release/source-qualification-validator-recipes.json",
  "Cargo.toml",
  "Cargo.lock",
  "crates/**/Cargo.toml",
  "crates/**/Cargo.lock",
  "crates/**/build.rs",
  "crates/**/src/lib.rs",
