  "crates/**/tests/*.rs",
  "crates/**/tests/*/main.rs",
  "crates/**/benches/*.rs",
  "crates/**/benches/*/main.rs",
]
packages = ["velnor-actions-orchestrator"]
complete = true

[[stacks.rust.inputs]]
globs = [
  "crates/velnor-actions-freshness/**",
  ".velnor/version-policy.toml",
  ".cargo/mutants.toml",
  "Cargo.toml",
  "Cargo.lock",
  "deny.toml",
  "crates/**/Cargo.toml",
  "crates/**/Cargo.lock",
  "crates/**/deny.toml",
  "crates/**/build.rs",
  "crates/**/src/lib.rs",
  "crates/**/src/main.rs",
  "crates/**/src/bin/*.rs",
  "crates/**/src/bin/*/main.rs",
  "crates/**/examples/*.rs",
  "crates/**/examples/*/main.rs",
  "crates/**/tests/*.rs",
  "crates/**/tests/*/main.rs",
  "crates/**/benches/*.rs",
  "crates/**/benches/*/main.rs",
]
packages = ["velnor-actions-freshness"]
complete = true

[[stacks.rust.inputs]]
globs = [
  "crates/velnor-actions-mise/**",
  "Cargo.toml",
  "Cargo.lock",
  "crates/**/Cargo.toml",
  "crates/**/Cargo.lock",
  "crates/**/build.rs",
  "crates/**/src/lib.rs",
  "crates/**/src/main.rs",
  "crates/**/src/bin/*.rs",
  "crates/**/src/bin/*/main.rs",
  "crates/**/examples/*.rs",
  "crates/**/examples/*/main.rs",
  "crates/**/tests/*.rs",
  "crates/**/tests/*/main.rs",
  "crates/**/benches/*.rs",
  "crates/**/benches/*/main.rs",
]
packages = ["velnor-actions-mise"]
complete = true

[[stacks.rust.configurations]]
name = "default"
features = ["default"]
target = "host"

[[stacks.rust.configurations]]
name = "local-mode"
features = ["local-mode"]
target = "host"
packages = ["velnor-runner-host"]

[stacks.rust.release]
enabled = false
manifest_path = "Cargo.toml"
packages = []
publishable_workspace = false
environment = "release"
release_pr = true
tag_name = "{{ package }}-v{{ version }}"

[discovery]
exclude = ["fixtures/**", "crates/**/tests/fixtures/**"]

[actions.overrides]

[execution]
default_profile = "local"
hosted_profile = "hosted"
scale_set_profile = "local"
workflows = ["qualification"]

[execution.profiles.hosted]
kind = "github-hosted"
label = "ubuntu-26.04"
platform = "linux/amd64"

[execution.profiles.local]
kind = "github-scale-set"
name = "ubuntu-26.04-scale-set"
labels = ["velnor", "ubuntu-26.04-scale-set"]
platform = "linux/amd64"

