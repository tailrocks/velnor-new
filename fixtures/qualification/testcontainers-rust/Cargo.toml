[package]
name = "velnor-testcontainers-tls-fixture"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]

[dependencies]
anyhow = "=1.0.104"
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
testcontainers = { version = "=0.27.0", default-features = false }
time = "=0.3.55"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "=1.28.0", features = ["v4"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
too_many_lines = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
