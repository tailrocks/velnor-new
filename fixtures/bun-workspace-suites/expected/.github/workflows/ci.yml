        run: "bash -c 'unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN GITHUB_TOKEN MISE_GITHUB_TOKEN GH_TOKEN GH_HOST GH_CONFIG_DIR; set -euo pipefail; cd -P -- \"$GITHUB_WORKSPACE\"; '\\''mise'\\'' '\\''--no-config'\\'' '\\''--no-env'\\'' '\\''--no-hooks'\\'' '\\''exec'\\'' \"bun@'\"${VELNOR_TOOL_BUN}\"'\" '\\''--'\\'' '\\''bun'\\'' '\\''run'\\'' '\\''--cwd=packages/ui'\\'' '\\''lint'\\'''"
