          MISE_AUTO_INSTALL: "false"
          MISE_EXEC_AUTO_INSTALL: "false"
          MISE_LOCKFILE: "0"
          MISE_NO_CONFIG: "1"
          MISE_NO_ENV: "1"
          MISE_NO_HOOKS: "1"
        run: "bash -c 'unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN GITHUB_TOKEN MISE_GITHUB_TOKEN GH_TOKEN GH_HOST GH_CONFIG_DIR; set -euo pipefail; cd -P -- \"$GITHUB_WORKSPACE\"; cd -- '\\''.'\\''; test -f bun.lock; test ! -L bun.lock; for f in package-lock.json npm-shrinkwrap.json yarn.lock pnpm-lock.yaml bun.lockb; do test ! -e \"$f\"; done; pm='\\'''\\''; while IFS= read -r line; do case \"$line\" in *'\\''\"packageManager\"'\\''*) pm=\"$line\" ;; esac; done < package.json; case \"$pm\" in '\\'''\\''|*\"\\\"bun@'\"${VELNOR_TOOL_BUN}\"'\\\"\"*|*\"\\\"bun@'\"${VELNOR_TOOL_BUN}\"'+\"*) ;; *) echo '\\''velnor: packageManager disagrees with the Mise-declared Bun'\\'' >&2; exit 1 ;; esac'"
