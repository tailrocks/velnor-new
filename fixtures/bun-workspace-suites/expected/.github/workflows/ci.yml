# Generated by Velnor Actions <version>; edit .velnor/config.toml and regenerate.
name: CI
"on":
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  merge_group:
permissions:
  contents: read
env:
  ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
  ACTIONS_ID_TOKEN_REQUEST_URL: ""
  ACTIONS_RUNTIME_TOKEN: ""
  CARGO_REGISTRY_TOKEN: ""
  GH_CONFIG_DIR: ""
  GH_HOST: ""
  GH_TOKEN: ""
  GITHUB_TOKEN: ""
  MISE_GITHUB_TOKEN: ""
  NODE_AUTH_TOKEN: ""
  NPM_TOKEN: ""
concurrency:
  group: velnor-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  bun-fixture-ui:
    name: Bun / @fixture/ui
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      VELNOR_ASSET_SHA256: <sha256:x86_64-unknown-linux-gnu>
      VELNOR_ASSET_URL: https://github.com/tailrocks/velnor-new/releases/download/v<version>/velnor-actions-<version>-x86_64-unknown-linux-gnu
      VELNOR_RELEASE_COMMIT: <commit>
      VELNOR_RUN_KEY_ATTEMPT: ${{ needs.plan.outputs.plan_attempt || github.run_attempt }}
    permissions:
      contents: read
