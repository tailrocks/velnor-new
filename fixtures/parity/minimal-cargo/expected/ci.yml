        run: mise --no-config --no-env --no-hooks install gh@2.102.0
      - name: Download plan
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: velnor-plan-r${{ github.run_id }}-a${{ env.VELNOR_RUN_KEY_ATTEMPT }}
          path: ${{ runner.temp }}/velnor/r${{ github.run_id }}-a${{ env.VELNOR_RUN_KEY_ATTEMPT }}
      - name: Download every expected matrix artifact
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          VELNOR_INTERNAL_OP: fetch-reports-v1
        run: "\"$RUNNER_TEMP\"'/velnor/bin/velnor-actions-0.1.32'"
      - name: Write qualification cache receipt
        id: qualification-cache-receipt
        env:
          VELNOR_INTERNAL_OP: write-qualification-cache-receipt-v1
        run: "\"$RUNNER_TEMP\"'/velnor/bin/velnor-actions-0.1.32'"
      - name: Publish qualification cache receipt
        if: steps.qualification-cache-receipt.outputs.receipt_path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: velnor-qualification-cache-receipt-v4-a${{ github.run_attempt }}
          path: ${{ steps.qualification-cache-receipt.outputs.receipt_path }}
          retention-days: "30"
      - name: Write request
        env:
          VELNOR_INTERNAL_OP: write-request-v1
          VELNOR_NEEDS_JSON: ${{ toJSON(needs) }}
          VELNOR_NEEDS_EXPECTED: "[\"actionlint\",\"plan\",\"rust-minimal-cargo\"]"
          VELNOR_REQUEST_FILE: ${{ runner.temp }}/velnor/request/merge-v1-request.json
        run: "\"$RUNNER_TEMP\"'/velnor/bin/velnor-actions-0.1.32'"
      - name: Merge reports
        env:
          VELNOR_INTERNAL_OP: merge-v1
          VELNOR_NEEDS_JSON: ${{ toJSON(needs) }}
          VELNOR_NEEDS_EXPECTED: "[\"actionlint\",\"plan\",\"rust-minimal-cargo\"]"
          VELNOR_REQUEST_FILE: ${{ runner.temp }}/velnor/request/merge-v1-request.json
        run: "\"$RUNNER_TEMP\"'/velnor/bin/velnor-actions-0.1.32'"
      - name: Publish final report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: velnor-final-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/velnor/r${{ github.run_id }}-a${{ env.VELNOR_RUN_KEY_ATTEMPT }}/final-report.json
          retention-days: "30"
  required-gate:
    name: Required
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      VELNOR_RUN_KEY_ATTEMPT: ${{ github.run_attempt }}
    needs:
      - required
    if: ${{ always() }}
    steps:
      - name: Fail unless the verdict passed
        if: ${{ always() && needs.required.result != 'success' }}
        run: env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_RUNTIME_TOKEN -u GITHUB_TOKEN -u MISE_GITHUB_TOKEN -u GH_TOKEN -u GH_HOST -u GH_CONFIG_DIR false
  rust-minimal-cargo:
    name: Rust / minimal-cargo
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      CARGO_CACHE_AUTO_CLEAN_FREQUENCY: never
      RUSTUP_TOOLCHAIN: 1.99.1
      VELNOR_ASSET_SHA256: ce5c751982d78d447d7de2f8874e0fc3b3923fe718e83054df4104f7e9847c5a
      VELNOR_ASSET_URL: https://github.com/tailrocks/velnor-new/releases/download/v0.1.32/velnor-actions-0.1.32-x86_64-unknown-linux-gnu
      VELNOR_RELEASE_COMMIT: a5242ea86856e723c829059d716a76b898229070
      VELNOR_RUN_KEY_ATTEMPT: ${{ needs.plan.outputs.plan_attempt || github.run_attempt }}
    needs:
      - plan
    if: "!contains(needs.plan.outputs.not_affected_jobs, ',rust-minimal-cargo,')"
    steps:
      - name: Record optional cache budget
        id: velnor-cache-clock
        run: "set -eu\nunavailable() { printf '%s\\n' '::warning::cache_unavailable: invalid first-step clock or output'; }\noutput=${GITHUB_OUTPUT-}\nseconds=${VELNOR_CACHE_JOB_SECONDS-}\nnow=$(date +%s) || now=\nfor value in \"$now\" \"$seconds\"; do\n  case \"$value\" in ''|*[!0-9]*) unavailable; exit 0 ;; esac\n  case \"$value\" in 0|[1-9]*) ;; *) unavailable; exit 0 ;; esac\n  [ \"${#value}\" -le 10 ] || { unavailable; exit 0; }\ndone\nif [ -z \"$output\" ] || ! printf 'started=%s\\ndeadline=%s\\njob_seconds=%s\\n' \"$now\" \"$((now + seconds))\" \"$seconds\" 2>/dev/null >> \"$output\"; then\n  unavailable\nfi\n"
        env:
          VELNOR_CACHE_JOB_SECONDS: "300"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
      - name: Acquire Velnor
        timeout-minutes: 6
        run: "sh -c 'unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN GITHUB_TOKEN MISE_GITHUB_TOKEN GH_TOKEN GH_HOST GH_CONFIG_DIR; d=\"$RUNNER_TEMP/velnor/bin/velnor-actions-0.1.32\"&&mkdir -p \"${d%/*}\"&&s=\"/opt/velnor/seed/generator/${d##*/}\"&&p=\"$VELNOR_ASSET_SHA256  \"&&if [ -f \"$s\" ]&&echo \"$p$s\"|sha256sum -c -;then cp \"$s\" \"$d\";else curl -fsSL --connect-timeout 15 --max-time 120 --retry 5 --retry-all-errors --retry-max-time 180 --proto '\\''=https'\\'' --tlsv1.2 \"$VELNOR_ASSET_URL\" -o \"$d\"&&echo \"$p$d\"|sha256sum -c -;fi&&chmod +x \"$d\"'"
      - name: Install cache tar adapters
        id: cache-tar-launchers
        uses: ./.github/actions/velnor-cache-tar-launchers # zizmor: ignore[self-repository]
        with:
          helper-sha256: ce5c751982d78d447d7de2f8874e0fc3b3923fe718e83054df4104f7e9847c5a
      - name: Setup Mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde
        with:
          cache: "false"
          cache_save: "false"
          env: "false"
          install: "false"
          sha256: e3b186d4c70627f27037be615becaf4acfb30e41fb6a1819486717dc94e4e2a9
          version: 2026.10.15
      - name: V2 identity
        id: v2
        if: needs.plan.result == 'success' && needs.plan.outputs.qualification_campaign == ''
        uses: ./.github/actions/velnor-tools-prelude-u26 # zizmor: ignore[self-repository]
        with:
          d: 2b76e6646e68dbd1e09670964f7acefe7ee36cb198d1c1fed43fbefdd2f5318d
      - name: Restore Mise tools
        id: tools-restore
        if: needs.plan.result == 'success' && needs.plan.outputs.qualification_campaign == '' && steps.v2.outputs.enabled == 'true'
        uses: ./.github/actions/velnor-tools-cache-restore # zizmor: ignore[self-repository]
        with:
          key: mise-tools-v2-payload-v3-${{steps.v2.outputs.identity}}
          mise-sha256: e3b186d4c70627f27037be615becaf4acfb30e41fb6a1819486717dc94e4e2a9
          seed-admitted: ${{ steps.v2.outputs.seed_admitted }}
        env:
          PATH: ${{ steps.cache-tar-launchers.outputs.path }}
      - name: Download plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: velnor-plan-r${{ github.run_id }}-a${{ env.VELNOR_RUN_KEY_ATTEMPT }}
          path: ${{ runner.temp }}/velnor/r${{ github.run_id }}-a${{ env.VELNOR_RUN_KEY_ATTEMPT }}
      - name: Prepare pinned tools
        env:
          MISE_CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
        run: mise --no-config --no-env --no-hooks install rust@1.99.1 actionlint@1.7.12 shellcheck@0.11.0 zizmor@1.31.1
      - name: Prepare Rust components
        env:
          CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
          RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
        run: mise --no-config --no-env --no-hooks exec rust@1.99.1 -- rustup component add --toolchain 1.99.1-x86_64-unknown-linux-gnu clippy rustfmt
      - name: Format
        background: true
        uses: ./.github/actions/declared-task-0 # zizmor: ignore[self-repository]
        with: {"digest": "b3-603c6e46dba2fc3c14a10493bdc4b830edd646a66da3fe11e389646709420102"}
      - name: Clippy
        background: true
        uses: ./.github/actions/declared-task-0 # zizmor: ignore[self-repository]
        with: {"digest": "b3-24902a84ee8f3ef5f5ae48cea86c08cad1bde685e24eb0e9c00a8ad59b37d49a"}
      - name: Unit and integration tests
        background: true
        uses: ./.github/actions/declared-task-0 # zizmor: ignore[self-repository]
        with: {"digest": "b3-63e2a4489c10529d0ac9f03a11a91a83036fc3444c6262dfb3d9a36e784fa5b2"}
      - name: Doctests
        background: true
        uses: ./.github/actions/declared-task-0 # zizmor: ignore[self-repository]
        with: {"digest": "b3-8b5e3bf8e31ebe591c4cd5f66ad5274c9bd662ea78a53cc99847fe9ca02bb1bd"}
      - name: Documentation
        background: true
        uses: ./.github/actions/declared-task-0 # zizmor: ignore[self-repository]
        with: {"digest": "b3-703d5aee05a65f55ca6b13ed079f59fc545c47806732c8b32afd7caa20cd2069"}
      - name: Wait for parallel checks
        wait-all:
      - name: Upload crate reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: velnor-crate-r${{ github.run_id }}-a${{ env.VELNOR_RUN_KEY_ATTEMPT }}-rust-minimal-cargo
          overwrite: "true"
          path: ${{ runner.temp }}/velnor/r${{ github.run_id }}-a${{ env.VELNOR_RUN_KEY_ATTEMPT }}
          retention-days: "30"
      - name: Admit optional cache save
        id: velnor-optional-tools-save-budget
        if: success() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.ref_protected == true && steps.v2.outputs.enabled == 'true' && steps.tools-restore.outputs.cache-hit != 'true'
        run: "set -eu\noutput=${GITHUB_OUTPUT-}\nemit() { [ -n \"$output\" ] && printf '%s\\n' \"$1\" 2>/dev/null >> \"$output\"; }\nrefuse() {\n  emit 'admitted=false' || :\n  printf '%s\\n' '::warning::cache_unavailable: optional save has no safe remaining job budget or output'\n}\nstarted=${VELNOR_CACHE_STARTED-}\ndeadline=${VELNOR_CACHE_DEADLINE-}\nseconds=${VELNOR_CACHE_JOB_SECONDS-}\nrequired=${VELNOR_CACHE_REQUIRED_SECONDS-}\nnow=$(date +%s) || now=\nfor value in \"$started\" \"$deadline\" \"$now\" \"$seconds\" \"$required\"; do\n  case \"$value\" in ''|*[!0-9]*) refuse; exit 0 ;; esac\n  case \"$value\" in 0|[1-9]*) ;; *) refuse; exit 0 ;; esac\n  [ \"${#value}\" -le 10 ] || { refuse; exit 0; }\ndone\nif [ \"$now\" -lt \"$started\" ] || [ \"$deadline\" -lt \"$started\" ] ||\n   [ \"$((deadline - started))\" -ne \"$seconds\" ] ||\n   [ \"$((deadline - now))\" -lt \"$required\" ]; then\n  refuse\nelif ! emit 'admitted=true'; then\n  refuse\nfi\n"
        env:
          VELNOR_CACHE_JOB_SECONDS: "300"
          VELNOR_CACHE_STARTED: ${{ steps.velnor-cache-clock.outputs.started }}
          VELNOR_CACHE_DEADLINE: ${{ steps.velnor-cache-clock.outputs.deadline }}
          VELNOR_CACHE_REQUIRED_SECONDS: "90"
      - name: Save Mise tools
        if: (success() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.ref_protected == true && steps.v2.outputs.enabled == 'true' && steps.tools-restore.outputs.cache-hit != 'true') && steps.velnor-optional-tools-save-budget.outputs.admitted == 'true'
        id: velnor-optional-tools-save
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: mise-tools-v2-payload-v3-${{steps.v2.outputs.identity}}
          path: "~/.local/share/mise\n${{ runner.temp }}/velnor/rustup\n${{ runner.temp }}/velnor/cargo/.crates.toml\n${{ runner.temp }}/velnor/cargo/.crates2.json\n${{ runner.temp }}/velnor/cargo/bin"
        env:
          PATH: ${{ steps.cache-tar-launchers.outputs.path }}
      - name: Report optional cache save failure
        if: always() && !cancelled() && steps.velnor-optional-tools-save.outcome == 'failure'
        run: "printf '%s\\n' '::warning::cache_unavailable: optional save failed or timed out'"
