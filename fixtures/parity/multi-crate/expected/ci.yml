m -rf \"$dir\"; skip empty_export; fi; if [ -n \"$out\" ]; then printf '\\''%s\\n'\\'' '\\''exported=true'\\'' >> \"$out\"; fi; printf '\\''velnor: mbx bundle exported (%s KiB)\\n'\\'' \"$kib\"'"
      - name: Admit optional cache save
