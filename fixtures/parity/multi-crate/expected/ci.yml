a5fc684b2aec3a6e14e2b855efe2faa4e5f8ae6e590f463;; *) printf \"%s\\n\" \"::error::rust_channel_manifest_not_catalogued: Rust $v has no channel-manifest digest in this Velnor catalog; upgrade velnor-actions or pin a catalogued Rust\" >&2; exit 1;; esac; d=\"$RUNNER_TEMP/velnor/rust-manifest\"; rm -rf \"$d\"; mkdir -p \"$d\"; curl --proto \"=https\" --proto-redir \"=https\" --tlsv1.2 --fail --silent --show-error --location --retry 3 --output \"$d/channel.toml\" \"https://static.rust-lang.org/dist/channel-rust-$v.toml\"; printf \"%s  %s\\n\" \"$want\" \"$d/channel.toml\" > \"$d/channel.sha256\"; if command -v sha256sum >/dev/null 2>&1; then sha256sum -c \"$d/channel.sha256\" >/dev/null; else shasum -a 256 -c \"$d/channel.sha256\" >/dev/null; fi || { printf \"%s\\n\" \"::error::rust_channel_manifest_digest_mismatch: channel-rust-$v.toml is not SHA-256 $want\" >&2; exit 1; }; m=\"$RUSTUP_HOME/toolchains/1.99.1-x86_64-unknown-linux-gnu/lib/rustlib/multirust-channel-manifest.toml\"; test -f \"$m\" || { printf \"%s\\n\" \"::error::rust_installed_manifest_missing: $m\" >&2; exit 1; }; grep -Eo \"[0-9a-f]{64}\" \"$d/channel.toml\" | LC_ALL=C sort -u > \"$d/pinned\"; grep -Eo \"[0-9a-f]{64}\" \"$m\" | LC_ALL=C sort -u > \"$d/installed\"; test -s \"$d/installed\" || { printf \"%s\\n\" \"::error::rust_installed_manifest_empty: $m records no hashes\" >&2; exit 1; }; LC_ALL=C comm -23 \"$d/installed\" \"$d/pinned\" > \"$d/unpinned\"; if test -s \"$d/unpinned\"; then printf \"%s\\n\" \"::error::rust_component_hash_not_in_manifest: the installed toolchain records hashes absent from the verified channel-rust-$v.toml\" >&2; exit 1; fi; printf \"%s\\n\" \"velnor: Rust $v channel manifest SHA-256 $want verified; every installed component hash is in it\"'"
