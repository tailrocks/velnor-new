          VELNOR_REQUEST_FILE: ${{ runner.temp }}/velnor/request/merge-v1-request.json
        run: "\"$RUNNER_TEMP/velnor/bin/velnor-actions-0.1.7\""
      - name: Save Mise tools
        if: success() && github.event_name == 'push' && env.VELNOR_MISE_CACHE_ENABLED == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: mise-v2-hosted-ubuntu26-x86_64-unknown-linux-gnu-2026.9.18-14ee3a9bbb90604c-${{env.VELNOR_MISE_CACHE_SUFFIX}}
          path: ~/.local/share/mise
      - name: Publish final report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: velnor-final-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/velnor/r${{ github.run_id }}-a${{ github.run_attempt }}/final-report.json
          retention-days: "30"
