    - name: Install pinned GitHub CLI
      shell: bash
      run: mise --no-config --no-env --no-hooks install gh@2.105.0
    - name: Fetch exact source artifact metadata
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCES_ID: ${{ inputs.sources_id }}
        SOURCES_METADATA: ${{ runner.temp }}/stable-source-metadata.json
      shell: bash
      run: "set -euo pipefail\ngh() {\n  (\n    mise --no-config --no-env --no-hooks exec gh@2.105.0 -- gh \"$@\" & _velnor_gh_pid=$!\n    ( sleep 60; kill -TERM \"$_velnor_gh_pid\" 2>/dev/null; sleep 5; kill -KILL \"$_velnor_gh_pid\" 2>/dev/null ) </dev/null >/dev/null 2>&1 & _velnor_gh_watch=$!\n    _velnor_gh_status=0\n    wait \"$_velnor_gh_pid\" || _velnor_gh_status=$?\n    kill -KILL \"$_velnor_gh_watch\" 2>/dev/null || true\n    wait \"$_velnor_gh_watch\" 2>/dev/null || true\n    exit \"$_velnor_gh_status\"\n  ) </dev/null\n}\nexport -f gh\nrm -f -- \"$SOURCES_METADATA\" \"$SOURCES_METADATA.partial\"\ntrap 'rm -f -- \"$SOURCES_METADATA.partial\"' EXIT\n[[ \"$SOURCES_ID\" =~ ^[1-9][0-9]*$ ]]\ngh api --hostname github.com --method GET \"repos/tailrocks/velnor-new/actions/artifacts/$SOURCES_ID\" | head -c 1048577 > \"$SOURCES_METADATA.partial\"\ntest \"$(wc -c < \"$SOURCES_METADATA.partial\")\" -le 1048576\nmv -- \"$SOURCES_METADATA.partial\" \"$SOURCES_METADATA\""
      continue-on-error: true
    - name: Admit exact same-run Cargo source artifact
      env:
        SOURCES_METADATA: ${{ runner.temp }}/stable-source-metadata.json
        SOURCES_ID: ${{ inputs.sources_id }}
        SOURCES_DIGEST: ${{ inputs.sources_digest }}
        SOURCES_TREE: ${{ inputs.sources_tree }}
        SOURCES_ROOT_LOCK: ${{ inputs.sources_root_lock }}
        SOURCES_RUNNER_LOCK: ${{ inputs.sources_runner_lock }}
        SOURCES_ATTEMPT: ${{ inputs.sources_attempt }}
        SOURCES_NAME: generator-macos-assets
      shell: bash
      run: env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_RUNTIME_TOKEN -u GITHUB_TOKEN -u MISE_GITHUB_TOKEN -u GH_TOKEN -u GH_HOST -u GH_CONFIG_DIR /usr/bin/python3 -I -S scripts/generator-release/stable-source-admission.py
      id: sources-admission
    - name: Download admitted Cargo sources
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: ${{ inputs.sources_id }}
        path: ${{ runner.temp }}/stable-cargo-download
      id: download-sources
      if: ${{ steps.sources-admission.outputs.admitted == 'true' }}
      continue-on-error: true
    - name: Prepare complete locked Cargo sources
      env:
        SOURCES_TREE: ${{ inputs.sources_tree }}
        SOURCES_DOWNLOADED: ${{ steps.download-sources.outcome }}
        VELNOR_RUST_VERSION: ${{ env.VELNOR_TOOL_RUST }}
      shell: bash
      run: env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_RUNTIME_TOKEN -u GITHUB_TOKEN -u MISE_GITHUB_TOKEN -u GH_TOKEN -u GH_HOST -u GH_CONFIG_DIR bash scripts/generator-release/stable-source-consumer.sh
    - name: Download exact ARM candidate artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: ${{ inputs.artifact_id }}
        path: macos-assets
