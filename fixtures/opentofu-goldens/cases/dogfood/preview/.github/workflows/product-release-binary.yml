nnel.toml\" \"$m\" || fail \"rust_installed_manifest_unwritable: $m\"; }; install_manifest; ev awk -v comps=\"$t/lib/rustlib/components\" '\\''BEGIN { while ((getline line < comps) > 0) if (line != \"\") want[line] = 1 } /^\\[/ { key = \"\"; if ($0 ~ /^\\[pkg\\.[^]]*\\.target\\.[^]]*\\]$/) { s = substr($0, 6, length($0) - 6); p = index(s, \".target.\"); k = substr(s, 1, p - 1) \"-\" substr(s, p + 8); if (k in want) key = k } next } key != \"\" && $1 == \"xz_url\" { u = $3; gsub(/\"/, \"\", u); url[key] = u } key != \"\" && $1 == \"xz_hash\" { h = $3; gsub(/\"/, \"\", h); hash[key] = h } END { for (k in want) { if (!(k in url) || !(k in hash)) exit 1; print k, url[k], hash[k] } }'\\'' \"$d/channel.toml\" > \"$d/tarballs\" || fail \"rust_component_not_in_manifest: $t lists a component the verified channel-rust-$v.toml does not ship\"; test -s \"$d/tarballs\" || fail \"rust_installed_manifest_empty: $t lists no component\"; : > \"$d/expected\"; while read -r comp url hash; do case \"$comp\" in *[!A-Za-z0-9._-]*|\"\") fail \"rust_component_name_invalid: $comp\";; esac; case \"$url\" in https://static.rust-lang.org/dist/*.tar.xz) ;; *) fail \"rust_component_url_untrusted: $url\";; esac; if [ ! -f \"$r/$comp.$hash\" ]; then get \"$d/c.tar.xz\" \"$url\"; printf \"%s  %s\\n\" \"$hash\" \"$d/c.tar.xz\" > \"$d/c.sha256\"; $h -c \"$d/c.sha256\" >/dev/null || fail \"rust_component_tarball_digest_mismatch: $comp\"; ev rm -rf \"$d/x\"; ev mkdir \"$d/x\"; ev tar -xJf \"$d/c.tar.xz\" -C \"$d/x\" --strip-components=1; ev rm -f \"$d/c.tar.xz\"; : > \"$d/c.sums\"; while read -r sub; do case \"$sub\" in *[!A-Za-z0-9._-]*|\"\"|.|..) fail \"rust_component_name_invalid: $sub\";; esac; (cd \"$d/x/$sub\" && ev find . -type f ! -path ./manifest.in -exec $hb {} +) >> \"$d/c.sums\"; done < \"$d/x/components\"; ev mv \"$d/c.sums\" \"$r/$comp.$hash\"; fi; ev cat \"$r/$comp.$hash\" >> \"$d/expected\"; done < \"$d/tarballs\"; (cd \"$t\" && ev find . -type f ! -path ./lib/rustlib/components ! \\( -path \"./lib/rustlib/manifest-*\" ! -path \"./lib/rustlib/manifest-*/*\" \\) ! -path ./lib/rustlib/multirust-channel-manifest.toml ! -path ./lib/rustlib/multirust-config.toml ! -path ./lib/rustlib/rust-installer-version -exec $hb {} +) > \"$d/installed\"; ev sort -k2 \"$d/expected\" > \"$d/expected.sorted\"; ev sort -k2 \"$d/installed\" > \"$d/installed.sorted\"; if ! ev cmp -s \"$d/expected.sorted\" \"$d/installed.sorted\"; then ev diff \"$d/expected.sorted\" \"$d/installed.sorted\" | ev head -n 20 >&2 || true; fail \"rust_toolchain_bytes_mismatch: $t differs from the component tarballs of the verified channel-rust-$v.toml\"; fi; printf \"%s\\n\" \"velnor: Rust $v toolchain verified file by file against the component tarballs of channel-rust-$v.toml (SHA-256 $want)\"'"
      - name: Build velnor-host with MBX
        run: "set -euo pipefail\n: \"${VELNOR_SOURCE_SHA:?}\"\nmise --no-config --no-env --no-hooks exec 'rust@'\"${VELNOR_TOOL_RUST}\" 'mr-boxington@'\"${VELNOR_TOOL_MR_BOXINGTON}\" -- mbx build --locked --manifest-path crates/velnor-runner/Cargo.toml --release --package velnor-runner-attestation --bin velnor-runner-attestation-helper\nhelper_path=crates/velnor-runner/target/release/velnor-runner-attestation-helper\ntest -s \"$helper_path\"\nhelper_sha=\"$(shasum -a 256 \"$helper_path\" | awk 'NR == 1 { print $1 }')\"\n[[ \"$helper_sha\" =~ ^[0-9a-f]{64}$ ]]\nenv VELNOR_RUNNER_BUILD_SOURCE_SHA=\"$VELNOR_SOURCE_SHA\" VELNOR_RUNNER_BUILD_HELPER_SHA256=\"$helper_sha\" mise --no-config --no-env --no-hooks exec 'rust@'\"${VELNOR_TOOL_RUST}\" 'mr-boxington@'\"${VELNOR_TOOL_MR_BOXINGTON}\" -- mbx build --locked --manifest-path crates/velnor-runner/Cargo.toml --release --package velnor-runner-cli --bin velnor-host\ncp crates/velnor-runner/target/release/velnor-host velnor-host\ncp \"$helper_path\" velnor-runner-attestation-helper\ntest -s velnor-host\ntest -s velnor-runner-attestation-helper\ncopied_helper_sha=\"$(shasum -a 256 velnor-runner-attestation-helper | awk 'NR == 1 { print $1 }')\"\ntest \"$copied_helper_sha\" = \"$helper_sha\""
      - name: Verify Mach-O architecture
        run: "set -eu\nfor binary in velnor-host velnor-runner-attestation-helper; do\n  desc=\"$(file -b \"$binary\")\"\n  case \"$desc\" in\n    *Mach-O*arm64*) ;;\n    *) echo \"The binary is not an arm64 Mach-O file: $binary: $desc.\" >&2; exit 1 ;;\n  esac\ndone"
      - name: Checksum built bytes
        run: "set -eu\nshasum -a 256 velnor-host velnor-runner-attestation-helper LICENSE NOTICE > SHA256SUMS"
      - name: Upload binary asset
        id: upload-assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: binary-assets-${{ github.run_attempt }}
          path: "velnor-host\nvelnor-runner-attestation-helper\nLICENSE\nNOTICE\nSHA256SUMS"
          retention-days: 1
  attest-binary:
    name: Attest velnor-host
    runs-on: macos-15
    timeout-minutes: 5
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    outputs:
      artifact_id: ${{ needs.build-binary.outputs.artifact_id }}
    needs:
      - verify-release-caller
      - build-binary
    if: inputs.release_action == 'build'
    steps:
      - name: Validate producer artifact identity
        id: validate-producer-artifact-identity
        env:
          ARTIFACT_ID: ${{ needs.build-binary.outputs.artifact_id }}
        run: "set -eu\nexport LC_ALL=C\ncase \"$ARTIFACT_ID\" in ''|*[!0-9]*|0|0*) exit 1 ;; esac\nlength=\"${#ARTIFACT_ID}\"\nif [ \"$length\" -gt 16 ]; then exit 1; fi\nif [ \"$length\" -eq 16 ] && [ \"$ARTIFACT_ID\" -gt 9007199254740991 ]; then exit 1; fi"
      - name: Download built assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        env:
          ARTIFACT_ID: ${{ needs.build-binary.outputs.artifact_id }}
        with:
          artifact-ids: ${{ env.ARTIFACT_ID }}
          path: assets
      - name: Attest built artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: "assets/velnor-host\nassets/velnor-runner-attestation-helper\nassets/LICENSE\nassets/NOTICE\nassets/SHA256SUMS"
  publish-binary:
    name: Publish velnor-host
    runs-on: macos-15
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      attestations: read
    needs:
      - verify-release-caller
      - attest-binary
    if: always() && (inputs.release_action == 'complete' || (inputs.release_action == 'build' && (needs.attest-binary.result == 'success')))
    steps:
      - name: Setup Mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
        with:
          version: 2026.11.1
          sha256: 9ca1005930fed90e0f4c30d9b13fe4530fe88d0549a71349716a3aab9051c627
          install: "false"
          env: "false"
          cache: "false"
          cache_save: "false"
      - name: Install pinned GitHub CLI
        shell: bash
        run: mise --no-config --no-env --no-hooks install gh@2.103.3
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "1"
          persist-credentials: "false"
          ref: ${{ inputs.source_sha }}
      - name: Validate producer artifact identity
        id: validate-producer-artifact-identity
        env:
          ARTIFACT_ID: ${{ needs.attest-binary.outputs.artifact_id }}
        run: "set -eu\nexport LC_ALL=C\ncase \"$ARTIFACT_ID\" in ''|*[!0-9]*|0|0*) exit 1 ;; esac\nlength=\"${#ARTIFACT_ID}\"\nif [ \"$length\" -gt 16 ]; then exit 1; fi\nif [ \"$length\" -eq 16 ] && [ \"$ARTIFACT_ID\" -gt 9007199254740991 ]; then exit 1; fi"
        if: inputs.release_action == 'build'
      - name: Download built assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        env:
          ARTIFACT_ID: ${{ needs.attest-binary.outputs.artifact_id }}
        with:
          artifact-ids: ${{ env.ARTIFACT_ID }}
          path: assets
        if: inputs.release_action == 'build'
      - name: Materialize fixed script
        shell: bash
        run: "set -euo pipefail\numask 077\ndir=\"$(mktemp -d \"$RUNNER_TEMP/velnor-fixed-script.XXXXXXXX\")\"\nchmod 0700 \"$dir\"\nexport VELNOR_FIXED_SCRIPT_DIR=\"$dir\"\nprintf 'VELNOR_FIXED_SCRIPT_DIR=%s\\n' \"$dir\" >> \"$GITHUB_ENV\"\nset -C\nprintf '%s' '' > \"$VELNOR_FIXED_SCRIPT_DIR/script.sh.b64\"\n"
      - name: Write fixed authority source script.sh (2/2)
        shell: bash
        run: "set -euo pipefail\numask 077\nprintf '%s' '' >> \"$VELNOR_FIXED_SCRIPT_DIR/script.sh.b64\"\n/usr/bin/python3 -I -S -c 'import base64,sys; data=base64.b64decode(sys.stdin.buffer.read(), validate=True); open(sys.argv[1], \"xb\").write(data)' \"$VELNOR_FIXED_SCRIPT_DIR/script.sh\" < \"$VELNOR_FIXED_SCRIPT_DIR/script.sh.b64\"\nchmod 0400 \"$VELNOR_FIXED_SCRIPT_DIR/script.sh\"\nrm \"$VELNOR_FIXED_SCRIPT_DIR/script.sh.b64\"\n"
      - name: Publish GitHub release
        id: publish-family-release
        env:
          GH_TOKEN: ${{ github.token }}
          VELNOR_RELEASE_ACTION: ${{ inputs.release_action }}
        run: "/usr/bin/python3 -I -S -c 'import hashlib,sys; sys.exit(hashlib.sha256(open(sys.argv[1], \"rb\").read()).hexdigest() != sys.argv[2])' \"$VELNOR_FIXED_SCRIPT_DIR/script.sh\" '02cbcd5f366b562b2787c88339494756cdc869c15782ac5ff85d83aa8e15062d'\nexec \"$BASH\" --noprofile --norc -e \"$VELNOR_FIXED_SCRIPT_DIR/script.sh\""
