name: Release Rust CI tools
"on":
  push:
    tags:
      - rust-ci-v*
permissions: {}
cache-mode: read
concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build ${{ matrix.suffix }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - suffix: linux-x64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            cc: musl-gcc
          - suffix: linux-arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            cc: musl-gcc
          - suffix: macos-arm64
            target: aarch64-apple-darwin
            runner: macos-15
            cc: cc
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install the musl C compiler
        if: runner.os == 'Linux'
        run: sudo apt-get install --yes musl-tools
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Add the target
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"
      - name: Build velnor-ci
        env:
          TARGET: ${{ matrix.target }}
          TARGET_CC: ${{ matrix.cc }}
          VELNOR_COMMIT: ${{ github.sha }}
        run: cargo build --release --locked --target "$TARGET" --manifest-path ci-helper/Cargo.toml
      - name: Build velnor-gen
        env:
          TARGET: ${{ matrix.target }}
          TARGET_CC: ${{ matrix.cc }}
          VELNOR_COMMIT: ${{ github.sha }}
        run: cargo build --release --locked --target "$TARGET" --manifest-path generator/Cargo.toml --package velnor-gen
      - name: Create the folder of release files
        run: mkdir dist
      - name: Name velnor-ci for its platform
        env:
          SUFFIX: ${{ matrix.suffix }}
          TARGET: ${{ matrix.target }}
        run: cp "ci-helper/target/$TARGET/release/velnor-ci" "dist/velnor-ci-$SUFFIX"
      - name: Name velnor-gen for its platform
        env:
          SUFFIX: ${{ matrix.suffix }}
          TARGET: ${{ matrix.target }}
        run: cp "generator/target/$TARGET/release/velnor-gen" "dist/velnor-gen-$SUFFIX"
      - name: Run velnor-ci
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: dist/velnor-ci-"$SUFFIX" --version
      - name: Run velnor-gen
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: dist/velnor-gen-"$SUFFIX" --version
      - name: Show the file sizes
        run: ls -l dist
      - name: Upload the binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: binaries-${{ matrix.suffix }}
          path: dist/
          if-no-files-found: error
          retention-days: 1
  checksums:
    name: Checksums
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Download the binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - name: Write SHA256SUMS
        working-directory: dist
        run: sha256sum velnor-ci-linux-x64 velnor-ci-linux-arm64 velnor-ci-macos-arm64 velnor-gen-linux-x64 velnor-gen-linux-arm64 velnor-gen-macos-arm64 > SHA256SUMS
      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
  release:
    name: Release
    needs: checksums
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - name: Download SHA256SUMS
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: SHA256SUMS
          path: dist
      - name: Verify every file against SHA256SUMS
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "$GITHUB_REF_NAME" --notes "Prebuilt velnor-ci and velnor-gen. Verify every download against SHA256SUMS." dist/SHA256SUMS dist/velnor-ci-linux-x64 dist/velnor-ci-linux-arm64 dist/velnor-ci-macos-arm64 dist/velnor-gen-linux-x64 dist/velnor-gen-linux-arm64 dist/velnor-gen-macos-arm64
