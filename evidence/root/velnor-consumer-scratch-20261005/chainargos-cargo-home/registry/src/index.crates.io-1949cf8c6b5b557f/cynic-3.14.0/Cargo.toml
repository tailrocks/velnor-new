description = "A code first GraphQL client for Rust"
homepage = "https://cynic-rs.dev"
documentation = "https://docs.rs/cynic"
readme = "README.md"
keywords = [
    "graphql",
    "client",
    "api",
]
license = "MPL-2.0"
repository = "https://codeberg.org/obmarg/cynic"
resolver = "2"

[package.metadata.docs.rs]
