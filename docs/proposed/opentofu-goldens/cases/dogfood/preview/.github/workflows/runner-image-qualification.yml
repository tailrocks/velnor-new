      - name: Build exact-source image maintenance
        shell: bash
        run: "set -- bash -c \"$VELNOR_QUALIFY_SCRIPT\"\nunset_args=(); while IFS= read -r -d '' entry; do name=${entry%%=*}; case \"$name\" in *TOKEN*|*PASSWORD*|*SECRET*|GH_HOST|GH_CONFIG_DIR|BASH_ENV|ENV|BASH_FUNC_*) unset_args+=(-u \"$name\");; esac; done < <(/usr/bin/env -0); exec /usr/bin/env \"${unset_args[@]}\" \"$@\""
        env:
          VELNOR_QUALIFY_SCRIPT: "set -euo pipefail\ntrusted_git() { /usr/bin/env -i PATH=/usr/bin:/bin GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_OPTIONAL_LOCKS=0 /usr/bin/git --git-dir=\"$GITHUB_WORKSPACE/.git\" --work-tree=\"$GITHUB_WORKSPACE\" -c core.fsmonitor=false \"$@\"; }\nsource_sha=\"$(trusted_git rev-parse --verify HEAD)\"\ntest \"$source_sha\" = \"$GITHUB_SHA\"\ntest \"$GITHUB_WORKFLOW_SHA\" = \"$GITHUB_SHA\"\nif ! trusted_git diff --cached --quiet --no-ext-diff --no-textconv --ignore-submodules=none || ! trusted_git diff --quiet --no-ext-diff --no-textconv --ignore-submodules=none; then\n  printf '%s\\n' 'The source checkout is not clean.' >&2\n  exit 1\nfi\nstatus_file=\"$(mktemp \"$RUNNER_TEMP/velnor-image-source-status.XXXXXXXX\")\"\ntrusted_git status --porcelain=v1 --untracked-files=all --ignore-submodules=none -z > \"$status_file\"\nif [[ -s \"$status_file\" ]]; then\n  printf '%s\\n' 'The source checkout is not clean.' >&2\n  exit 1\nfi\nmetadata_file=\"$(mktemp \"$RUNNER_TEMP/velnor-native-image-metadata.XXXXXXXX\")\"\nartifacts_file=\"$(mktemp \"$RUNNER_TEMP/velnor-native-image-artifacts.XXXXXXXX\")\"\ntrap 'rm -f \"$metadata_file\" \"$artifacts_file\"' EXIT\ncargo metadata --locked --format-version=1 --filter-platform x86_64-unknown-linux-gnu > \"$metadata_file\"\nenv -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_RUNTIME_TOKEN -u GITHUB_TOKEN -u MISE_GITHUB_TOKEN -u GH_TOKEN -u GH_HOST -u GH_CONFIG_DIR mise --no-config --no-env --no-hooks exec 'rust@'\"${{ env.VELNOR_TOOL_RUST }}\" 'mr-boxington@'\"${{ env.VELNOR_TOOL_MR_BOXINGTON }}\" -- mbx build --release --locked --package velnor-actions-cli --bin velnor-actions --message-format=json > \"$artifacts_file\"\npython3 scripts/native-image-candidate-inventory.py --check --root \"$GITHUB_WORKSPACE\" --metadata \"$metadata_file\" --artifacts \"$artifacts_file\" --target x86_64-unknown-linux-gnu\ntest -f target/release/velnor-actions && test ! -L target/release/velnor-actions\numask 077\nimage_binary_dir=\"$(mktemp -d \"$RUNNER_TEMP/velnor-native-image-actions.XXXXXXXX\")\"\nimage_binary=\"$image_binary_dir/velnor-native-image-actions\"\n( set -o noclobber; cat target/release/velnor-actions > \"$image_binary\" )\nchmod 0500 \"$image_binary\"\nprintf 'VELNOR_NATIVE_IMAGE_ACTIONS=%s\\n' \"$image_binary\" >> \"$GITHUB_ENV\""
      - name: Build exact-source runtime qualifier
        shell: bash
        run: "set -- bash -c \"$VELNOR_QUALIFY_SCRIPT\"\nunset_args=(); while IFS= read -r -d '' entry; do name=${entry%%=*}; case \"$name\" in *TOKEN*|*PASSWORD*|*SECRET*|GH_HOST|GH_CONFIG_DIR|BASH_ENV|ENV|BASH_FUNC_*) unset_args+=(-u \"$name\");; esac; done < <(/usr/bin/env -0); exec /usr/bin/env \"${unset_args[@]}\" \"$@\""
        env:
          VELNOR_QUALIFY_SCRIPT: "mise --no-config --no-env --no-hooks exec 'rust@'\"${{ env.VELNOR_TOOL_RUST }}\" 'mr-boxington@'\"${{ env.VELNOR_TOOL_MR_BOXINGTON }}\" -- mbx build --locked --manifest-path crates/velnor-runner/Cargo.toml --package velnor-runner-host --bin velnor-resource-probe-release --target x86_64-unknown-linux-gnu"
      - name: Fetch exact successful CI candidates
        id: locate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: "set -euo pipefail\ngh() { mise --no-config --no-env --no-hooks exec gh@2.103.3 -- gh \"$@\"; }\nrepo=tailrocks/velnor-new\nsha=\"$GITHUB_SHA\"\n[[ \"$GITHUB_REPOSITORY\" == \"$repo\" && \"$GITHUB_EVENT_NAME\" == push && \"$GITHUB_REF\" == refs/heads/main && \"${GITHUB_REF_PROTECTED:-}\" == true ]]\n[[ \"$sha\" =~ ^[0-9a-f]{40}$ && \"$GITHUB_WORKFLOW_SHA\" == \"$sha\" ]]\nbase=\"$RUNNER_TEMP/velnor-ci-candidate-fetch\"\n[[ ! -e \"$base\" ]]\numask 077\nmkdir -m 700 \"$base\"\n# SPDX-FileCopyrightText: 2026 Alexey Zhokhov\n# SPDX-License-Identifier: Apache-2.0\n\n: \"${base:?}\" \"${repo:?}\" \"${sha:?}\"\n\nlist_runs() {\n  workflow=$1\n  : > \"$base/runs.jsonl\"\n  page=1\n  while [ \"$page\" -le 10 ]; do\n    gh api \"repos/$repo/actions/workflows/$workflow/runs?head_sha=$sha&event=push&per_page=100&page=$page\" > \"$base/page.json\"\n    count=$(jq -er '.workflow_runs | length | select(. <= 100)' \"$base/page.json\")\n    jq -c --arg sha \"$sha\" '.workflow_runs[] | select(.head_sha == $sha and .event == \"push\" and .head_branch == \"main\" and .head_repository.id == 1390620900)' \"$base/page.json\" >> \"$base/runs.jsonl\"\n    [ \"$count\" -lt 100 ] && break\n    page=$((page + 1))\n  done\n  [ \"$page\" -le 10 ]\n  jq -s -er 'sort_by(.id) | last | select(.status == \"completed\" and .conclusion == \"success\") | [.id, .run_attempt] | @tsv' \"$base/runs.jsonl\"\n}\nfind_artifact() {\n  run=$1\n  name=$2\n  : > \"$base/artifacts.jsonl\"\n  page=1\n  while [ \"$page\" -le 10 ]; do\n    gh api \"repos/$repo/actions/runs/$run/artifacts?per_page=100&page=$page\" > \"$base/page.json\"\n    count=$(jq -er '.artifacts | length | select(. <= 100)' \"$base/page.json\")\n    jq -c --arg name \"$name\" '.artifacts[] | select(.name == $name and .expired == false)' \"$base/page.json\" >> \"$base/artifacts.jsonl\"\n    [ \"$count\" -lt 100 ] && break\n    page=$((page + 1))\n  done\n  [ \"$page\" -le 10 ]\n  jq -s -er 'if length == 1 and .[0].id > 0 then .[0].id else error(\"artifact identity\") end' \"$base/artifacts.jsonl\"\n}\nvalidate_required() {\n  run=$1\n  attempt=$2\n  : > \"$base/jobs.jsonl\"\n  page=1\n  while [ \"$page\" -le 10 ]; do\n    gh api \"repos/$repo/actions/runs/$run/attempts/$attempt/jobs?per_page=100&page=$page\" > \"$base/page.json\"\n    count=$(jq -er '.jobs | length | select(. <= 100)' \"$base/page.json\")\n    jq -c '.jobs[] | select(.name == \"Required\")' \"$base/page.json\" >> \"$base/jobs.jsonl\"\n    [ \"$count\" -lt 100 ] && break\n    page=$((page + 1))\n  done\n  [ \"$page\" -le 10 ]\n  jq -s -e 'length == 1 and .[0].status == \"completed\" and .[0].conclusion == \"success\"' \"$base/jobs.jsonl\" > /dev/null\n}\n# SPDX-FileCopyrightText: 2026 Alexey Zhokhov\n# SPDX-License-Identifier: Apache-2.0\n\n: \"${base:?}\" \"${repo:?}\"\n\ndownload_artifact() {\n  download_id=$1\n  destination=$2\n  shift 2\n  archive_file=\"$base/download-$download_id.zip\"\n  (ulimit -f 12582912; gh api \"repos/$repo/actions/artifacts/$download_id/zip\" > \"$archive_file\")\n  python3 - \"$archive_file\" \"$destination\" \"$@\" <<'PY'\n# SPDX-FileCopyrightText: 2026 Alexey Zhokhov\n# SPDX-License-Identifier: Apache-2.0\n\nimport os\nimport stat\nimport sys\nimport zipfile\n\narchive, destination, *expected = sys.argv[1:]\nif len(expected) != len(set(expected)):\n    raise SystemExit(\"duplicate expected artifact member\")\nwith zipfile.ZipFile(archive) as source:\n    entries = source.infolist()\n    names = [entry.filename for entry in entries]\n    if len(names) != len(set(names)) or set(names) != set(expected):\n        raise SystemExit(\"artifact inventory mismatch\")\n    total = 0\n    for entry in entries:\n        mode = entry.external_attr >> 16\n        if (not entry.filename or \"/\" in entry.filename or \"\\\\\" in entry.filename\n                or entry.filename in (\".\", \"..\") or entry.is_dir()\n                or (stat.S_IFMT(mode) not in (0, stat.S_IFREG))\n                or entry.file_size <= 0 or entry.file_size > 4 * 1024**3):\n            raise SystemExit(\"invalid artifact member\")\n        total += entry.file_size\n        if total > 12 * 1024**3:\n            raise SystemExit(\"artifact too large\")\n    for entry in entries:\n        path = os.path.join(destination, entry.filename)\n        descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)\n        written = 0\n        with source.open(entry) as input_file, os.fdopen(descriptor, \"wb\") as output_file:\n            while True:\n                block = input_file.read(1024 * 1024)\n                if not block:\n                    break\n                written += len(block)\n                if written > entry.file_size:\n                    raise SystemExit(\"artifact member exceeded size\")\n                output_file.write(block)\n        if written != entry.file_size:\n            raise SystemExit(\"artifact member truncated\")\n\nPY\n}\nready=false\nretry=0\nwhile [ \"$retry\" -lt 300 ]; do\n  if ci=$(list_runs ci.yml); then ready=true; break; fi\n  retry=$((retry + 1))\n  sleep 10\ndone\n[[ \"$ready\" == true ]]\nci_id=$(printf '%s\\n' \"$ci\" | cut -f1)\nci_attempt=$(printf '%s\\n' \"$ci\" | cut -f2)\nvalidate_required \"$ci_id\" \"$ci_attempt\"\nartifact=\"image-assets-$ci_attempt\"\nartifact_id=$(find_artifact \"$ci_id\" \"$artifact\")\ndestination=\"$RUNNER_TEMP/runner-candidates\"\n[[ ! -e \"$destination\" ]]\nmkdir -m 700 \"$destination\"\ndownload_artifact \"$artifact_id\" \"$destination\" runner.oci.tar dind.oci.tar resource-probe.oci.tar runner-image-publication.json dind-image-publication.json resource-probe-image-publication.json\n[[ \"$(list_runs ci.yml)\" == \"$ci\" ]]\nprintf 'producer_run_id=%s\\nproducer_run_attempt=%s\\nartifact_id=%s\\n' \"$ci_id\" \"$ci_attempt\" \"$artifact_id\" >> \"$GITHUB_OUTPUT\"\n"
      - name: Identify qualifier job
        id: identity
        shell: bash
        run: "set -euo pipefail\n: > \"$RUNNER_TEMP/qualifier-jobs.jsonl\"\npage=1\nwhile [ \"$page\" -le 10 ]; do\n  mise --no-config --no-env --no-hooks exec gh@2.103.3 -- gh api \"repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100&page=$page\" > \"$RUNNER_TEMP/qualifier-page.json\"\n  count=$(jq -er '.jobs | length | select(. <= 100)' \"$RUNNER_TEMP/qualifier-page.json\")\n  jq -c '.jobs[] | select(.name == \"qualify-images\")' \"$RUNNER_TEMP/qualifier-page.json\" >> \"$RUNNER_TEMP/qualifier-jobs.jsonl\"\n  [ \"$count\" -lt 100 ] && break\n  page=$((page + 1))\ndone\n[ \"$page\" -le 10 ]\nid=$(jq -s -er --argjson run \"$GITHUB_RUN_ID\" --argjson attempt \"$GITHUB_RUN_ATTEMPT\" 'if length == 1 and .[0].id > 0 and .[0].run_id == $run and .[0].run_attempt == $attempt and .[0].status == \"in_progress\" then .[0].id else error(\"qualifier identity\") end' \"$RUNNER_TEMP/qualifier-jobs.jsonl\")\nprintf 'id=%s\\n' \"$id\" >> \"$GITHUB_OUTPUT\""
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Qualify exact CI images
        shell: bash
        run: "set -- bash -c \"$VELNOR_QUALIFY_SCRIPT\"\nunset_args=(); while IFS= read -r -d '' entry; do name=${entry%%=*}; case \"$name\" in *TOKEN*|*PASSWORD*|*SECRET*|GH_HOST|GH_CONFIG_DIR|BASH_ENV|ENV|BASH_FUNC_*) unset_args+=(-u \"$name\");; esac; done < <(/usr/bin/env -0); exec /usr/bin/env \"${unset_args[@]}\" \"$@\""
        env:
          PRODUCER_RUN_ID: ${{ steps.locate.outputs.producer_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ steps.locate.outputs.producer_run_attempt }}
          QUALIFIER_JOB_ID: ${{ steps.identity.outputs.id }}
          VELNOR_QUALIFY_SCRIPT: "# SPDX-FileCopyrightText: 2026 Alexey Zhokhov\n# SPDX-License-Identifier: Apache-2.0\n\nset -euo pipefail\nroot=\"$RUNNER_TEMP/runner-candidates\"\nids=()\nfor role in runner dind resource-probe; do\n  case \"$role\" in\n    runner) record=runner-image-publication.json ;;\n    dind) record=dind-image-publication.json ;;\n    resource-probe) record=resource-probe-image-publication.json ;;\n  esac\n  manifest=$(jq -er '.oci.platform_manifest_digest' \"$root/$record\")\n  config=$(jq -er '.oci.image_configuration_digest' \"$root/$record\")\n  [[ \"$manifest\" =~ ^sha256:[0-9a-f]{64}$ && \"$config\" =~ ^sha256:[0-9a-f]{64}$ ]]\n  docker image load --input \"$root/$role.oci.tar\"\n  if [[ \"$(docker image inspect --format '{{.Id}}' \"$manifest\" 2>/dev/null || true)\" == \"$manifest\" ]]; then\n    id=$manifest\n  else\n    [[ \"$(docker image inspect --format '{{.Id}}' \"$config\")\" == \"$config\" ]]\n    id=$config\n  fi\n  ids+=(\"$id\")\ndone\ntarget=\"$(cd -- \"${CARGO_TARGET_DIR:-crates/velnor-runner/target}\" && pwd -P)\"\nqualifier=\"$target/x86_64-unknown-linux-gnu/debug/velnor-resource-probe-release\"\ntest -f \"$qualifier\" && test ! -L \"$qualifier\"\n\"$qualifier\" qualify-runner-images \"$GITHUB_WORKSPACE\" \"$GITHUB_SHA\" \"${ids[0]}\" \"${ids[1]}\" \"${ids[2]}\" /var/run/docker.sock \"$root/runtime.json\"\n\"$VELNOR_NATIVE_IMAGE_ACTIONS\" image-maintenance write-runner-qualification \\\n  --root \"$GITHUB_WORKSPACE\" --source-commit \"$GITHUB_SHA\" \\\n  --runner-archive \"$root/runner.oci.tar\" --runner-record \"$root/runner-image-publication.json\" \\\n  --dind-archive \"$root/dind.oci.tar\" --dind-record \"$root/dind-image-publication.json\" \\\n  --probe-archive \"$root/resource-probe.oci.tar\" --probe-record \"$root/resource-probe-image-publication.json\" \\\n  --runtime-result \"$root/runtime.json\" --producer-run-id \"$PRODUCER_RUN_ID\" \\\n  --producer-run-attempt \"$PRODUCER_RUN_ATTEMPT\" --qualifier-job-id \"$QUALIFIER_JOB_ID\" \\\n  --output \"$root/RUNNER_IMAGE_QUALIFICATION.json\"\n"
      - name: Upload qualification proof
        id: proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: velnor-runner-image-qualification-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runner-candidates/RUNNER_IMAGE_QUALIFICATION.json
          if-no-files-found: error
          retention-days: 7
  attest:
    needs:
      - qualify-images
    uses: ./.github/workflows/runner-image-qualification-attest.yml
    with:
      artifact_id: ${{ needs.qualify-images.outputs.artifact_id }}
    permissions:
      actions: read
      contents: read
      artifact-metadata: write
      attestations: write
      id-token: write
