   if (type(artifact.get(\"id\")) is not int or artifact[\"id\"] <= 0\n            or artifact.get(\"expired\") is not False\n            or not re.fullmatch(\"sha256:[0-9a-f]{64}\", artifact.get(\"digest\", \"\"))\n            or artifact.get(\"workflow_run\", {}).get(\"id\") != run_id\n            or artifact.get(\"workflow_run\", {}).get(\"head_sha\") != source):\n        raise ValueError(\"SDK preview producer artifact identity\")\n    return artifact\n\n\ndef source_version(client, source):\n    manifest_blob = client.get(\"/repos/\" + REPOSITORY + \"/contents/Cargo.toml?ref=\" + source)\n    if manifest_blob.get(\"path\") != \"Cargo.toml\" or manifest_blob.get(\"encoding\") != \"base64\":\n        raise ValueError(\"source preview version source\")\n    version = tomllib.loads(base64.b64decode(manifest_blob[\"content\"], validate=False).decode())\n    version = version[\"workspace\"][\"package\"][\"version\"]\n    if not isinstance(version, str) or not re.fullmatch(r\"(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\", version):\n        raise ValueError(\"SDK preview release version\")\n    return version\n\n\ndef qualification_proofs(client, source):\n    return {\n        \"ci\": successful_run(client, source, \".github/workflows/ci.yml\", \"push\", (\"Required verdict\",)),\n        \"qualification\": successful_run(\n            client, source, \".github/workflows/source-qualification.yml\", \"workflow_dispatch\",\n            (\"Source qualification ordinary harness\", \"Source qualification keep harness\",\n             \"Source qualification generation and repository checks\", \"Source qualification\"),\n        ),\n    }\n\n\ndef producer_inputs(client, source):\n    qualification_proofs(client, source)\n    run = successful_run(client, source, WORKFLOW, \"push\", (\"Build source preview\", \"Qualify source preview\"))\n    artifact = producer_artifact(client, source, run[\"run_id\"], run[\"run_attempt\"])\n    return {\"producer_run_id\": run[\"run_id\"], \"producer_run_attempt\": run[\"run_attempt\"],\n            \"payload_artifact_id\": artifact[\"id\"], \"payload_archive_sha256\": artifact[\"digest\"][7:]}\n\n\ndef admit(client):\n    preview_authority()\n    source = os.environ[\"GITHUB_SHA\"]\n    version = source_version(client, source)\n    proof, tag_sha, expected_ref = admit_tag(client, source, version)\n    if version != proof[\"version\"]:\n        raise ValueError(\"SDK preview tag version mismatch\")\n    metadata = {\n        \"schema\": 2, \"repository\": REPOSITORY, \"version\": version,\n        \"source_sha\": source, \"tag\": \"sdk-preview-\" + source,\n        \"source\": {\n            \"workflow_path\": WORKFLOW, \"workflow_ref\": expected_ref,\n            \"workflow_sha\": source,\n            \"run_id\": positive(int(os.environ[\"GITHUB_RUN_ID\"])),\n            \"run_attempt\": positive(int(os.environ[\"GITHUB_RUN_ATTEMPT\"])),\n        },\n        \"producer\": {key: proof[key] for key in (\"producer_run_id\", \"producer_run_attempt\", \"payload_artifact_id\", \"payload_archive_sha256\")},\n        **qualification_proofs(client, source),\n    }\n    artifact = producer_artifact(client, source, proof[\"producer_run_id\"], proof[\"producer_run_attempt\"])\n    if artifact[\"id\"] != proof[\"payload_artifact_id\"] or artifact[\"digest\"] != \"sha256:\" + proof[\"payload_archive_sha256\"]:\n        raise ValueError(\"SDK preview annotated producer changed\")\n    root = Path(os.environ[\"RUNNER_TEMP\"])\n    with tempfile.TemporaryDirectory(prefix=\"sdk-preview-input-\", dir=root) as temporary:\n        staged = Path(temporary) / \"payload\"\n        download_verified_payload(client, artifact, staged)\n        if tag_reference(client, source) != tag_sha:\n            raise ValueError(\"SDK preview tag moved\")\n        verify_default_ancestry(client, source)\n        os.link(staged, root / \"velnor-actions-x86_64-unknown-linux-gnu\", follow_symlinks=False)\n    return metadata\n\n\ndef main():\n    signal.signal(signal.SIGALRM, deadline_alarm)\n    signal.setitimer(signal.ITIMER_REAL, 120)\n    metadata = admit(GitHub())\n    path = Path(os.environ[\"RUNNER_TEMP\"]) / \"source-preview-metadata.json\"\n    with path.open(\"x\", encoding=\"utf-8\") as output:\n        json.dump(metadata, output, sort_keys=True, separators=(\",\", \":\"))\n    with open(os.environ[\"GITHUB_OUTPUT\"], \"a\", encoding=\"utf-8\") as output:\n        output.write(\"source_sha=\" + metadata[\"source_sha\"] + \"\\n\")\n\n\ndef deadline_alarm(_number, _frame):\n    raise TimeoutError(\"source preview deadline\")\n\n\nif __name__ == \"__main__\":\n    try:\n        main()\n    except (OSError, ValueError, KeyError, TypeError, http.client.HTTPException, zipfile.BadZipFile):\n        print(\"source preview admission failed\", file=sys.stderr)\n        sys.exit(1)\n\nPY"
      - name: Retain exact source preview bytes
        id: upload-source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: source-preview-source-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-preview-metadata.json
          retention-days: 1
      - name: Retain exact source preview bytes
        id: upload-payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: source-preview-qualified-payload-${{ github.run_attempt }}
          path: ${{ runner.temp }}/velnor-actions-x86_64-unknown-linux-gnu
          retention-days: 1
  source-preview-draft:
    name: Draft source preview
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    needs:
      - source-preview-source
    if: ${{ github.event_name == 'push' && github.repository == 'tailrocks/velnor-new' && startsWith(github.ref, 'refs/tags/sdk-preview-') }}
    environment:
      name: generator-source-preview
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      source_artifact_id: ${{ steps.draft.outputs.source_artifact_id }}
      payload_artifact_id: ${{ steps.draft.outputs.payload_artifact_id }}
      sign: ${{ steps.draft.outputs.sign }}
      pair_origin: ${{ steps.draft.outputs.pair_origin }}
      pair_id: ${{ steps.draft.outputs.pair_id }}
      receipt_sha256: ${{ steps.draft.outputs.receipt_sha256 }}
      bundle_sha256: ${{ steps.draft.outputs.bundle_sha256 }}
    steps:
      - name: Download admitted source metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.source-preview-source.outputs.source_artifact_id }}
          path: source-preview-metadata
      - name: Download exact qualified payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.source-preview-source.outputs.payload_artifact_id }}
          path: source-preview-payload
      - name: Setup Mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
        with:
          version: 2026.11.1
          sha256: 7129dbab31d698f9028db9374f7ba7987232b0426f837dcbce437130a61415f9
          install: "false"
          env: "false"
          cache: "false"
          cache_save: "false"
      - name: Install pinned GitHub CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: "set -eu\n: \"${GITHUB_TOKEN:?missing workflow token}\"\nmise --no-config --no-env --no-hooks install gh@2.103.3"
      - name: Create exact preview draft
        env:
          AUTHORITY_REPOSITORY: ${{ job.workflow_repository }}
          AUTHORITY_PATH: ${{ job.workflow_file_path }}
          AUTHORITY_REF: ${{ job.workflow_ref }}
          AUTHORITY_SHA: ${{ job.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARTIFACT_ID: ${{ needs.source-preview-source.outputs.source_artifact_id }}
          PAYLOAD_ARTIFACT_ID: ${{ needs.source-preview-source.outputs.payload_artifact_id }}
        shell: bash
        run: "set -eu\nmkdir -m 700 \"$RUNNER_TEMP/source-preview-support\"\ncat > \"$RUNNER_TEMP/source-preview-support/source_preview_bootstrap.py\" <<'BOOTSTRAP'\n# SPDX-FileCopyrightText: 2026 Alexey Zhokhov\n# SPDX-License-Identifier: Apache-2.0\n\nimport base64\nimport ctypes\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport secrets\nimport stat\nimport subprocess\nimport sys\nimport time\nimport tomllib\nimport urllib.error\nimport urllib.parse\nimport urllib.request\n\nREPOSITORY = \"tailrocks/velnor-new\"\nREPOSITORY_ID = 1390620900\nAPI = \"api.github.com\"\nRELEASE_HOSTS = {\"github.com\", \"objects.githubusercontent.com\", \"release-assets.githubusercontent.com\"}\nTARGET = \"x86_64-unknown-linux-gnu\"\nMAX_LOCK = 1_048_576\nMAX_JSON = 2_097_152\nMAX_RECEIPT = 65_536\nMAX_BUNDLE = 4_194_304\nMAX_PAYLOAD = 268_435_456\nHEX40 = re.compile(r\"[0-9a-f]{40}\\Z\")\nHEX64 = re.compile(r\"[0-9a-f]{64}\\Z\")\n\n\nclass AdmissionError(Exception):\n    pass\n\n\ndef require(condition):\n    if not condition:\n        raise AdmissionError(\"source_preview_admission_rejected\")\n\n\ndef sha40(value):\n    return isinstance(value, str) and HEX40.fullmatch(value) is not None\n\n\ndef hex64(value):\n    return isinstance(value, str) and HEX64.fullmatch(value) is not None\n\n\ndef number(value):\n    return isinstance(value, int) and not isinstance(value, bool) and value > 0\n\n\ndef unique_pairs(pairs):\n    result = {}\n    for key, value in pairs:\n        require(key not in result)\n        result[key] = value\n    return result\n\n\ndef parse_json(data, limit):\n    require(len(data) <= limit)\n    try:\n        return json.loads(data, object_pairs_hook=unique_pairs)\n    except (ValueError, UnicodeError) as error:\n        raise AdmissionError(\"source_preview_invalid_json\") from error\n\n\ndef parse_lock(data):\n    require(len(data) <= MAX_LOCK)\n    try:\n        return tomllib.loads(data.decode(\"utf-8\"))\n    except (ValueError, UnicodeError) as error:\n        raise AdmissionError(\"source_preview_invalid_lock\") from error\n\n\ndef read_regular(path, limit):\n    path = Path(path)\n    require(path.is_absolute())\n    for parent in (path, *path.parents):\n        metadata = os.lstat(parent)\n        require(not stat.S_ISLNK(metadata.st_mode))\n    fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)\n    try:\n        require(stat.S_ISREG(os.fstat(fd).st_mode))\n        with os.fdopen(fd, \"rb\", closefd=False) as file:\n            data = file.read(limit + 1)\n        require(len(data) <= limit)\n        return data\n    finally:\n        os.close(fd)\n\n\ndef workflow_tuple(record, prefix, path, source, git_ref):\n    require(record[f\"{prefix}_workflow_path\"] == path)\n    require(record[f\"{prefix}_workflow_ref\"] == f\"{REPOSITORY}/{path}@{git_ref}\")\n    require(record[f\"{prefix}_workflow_sha\"] == source)\n    require(number(record[f\"{prefix}_run_id\"]) and number(record[f\"{prefix}_run_attempt\"]))\n\n\ndef validate_preview(record, candidate):\n    require(isinstance(record, dict))\n    fixed = {\"schema\", \"repository\", \"version\", \"source_sha\", \"tag\", \"release_id\", \"payload_target\", \"payload_name\", \"payload_size\", \"payload_sha256\", \"receipt_sha256\", \"bundle_sha256\"}\n    runs = {f\"{prefix}_{suffix}\" for prefix in (\"source\", \"draft\", \"signer\", \"ci\", \"qualification\") for suffix in (\"workflow_path\", \"workflow_ref\", \"workflow_sha\", \"run_id\", \"run_attempt\")}\n    custody = {\"producer_run_id\", \"producer_run_attempt\", \"producer_payload_artifact_id\", \"producer_payload_archive_sha256\", \"candidate_source_artifact_id\", \"candidate_payload_artifact_id\", \"publisher_run_attempt\", \"publisher_job_id\"}\n    require(set(record) == fixed | runs | custody)\n    source = record[\"source_sha\"]\n    require(type(record[\"schema\"]) is int and record[\"schema\"] == 2 and record[\"repository\"] == REPOSITORY)\n    require(isinstance(record[\"version\"], str) and re.fullmatch(r\"[0-9]+\\.[0-9]+\\.[0-9]+\", record[\"version\"]) is not None)\n    require(sha40(source) and sha40(candidate) and source != candidate)\n    require(record[\"tag\"] == \"sdk-preview-\" + source and number(record[\"release_id\"]))\n    for role in (\"source\", \"draft\"):\n        workflow_tuple(record, role, \".github/workflows/product-release-generator.yml\", source, \"refs/tags/\" + record[\"tag\"])\n        require(record[role + \"_run_id\"] == record[\"signer_run_id\"])\n    require(all(number(record[key]) for key in (\"producer_run_id\", \"producer_run_attempt\", \"producer_payload_artifact_id\", \"candidate_source_artifact_id\", \"candidate_payload_artifact_id\", \"publisher_run_attempt\", \"publisher_job_id\")))\n    require(hex64(record[\"producer_payload_archive_sha256\"]))\n    require(record[\"candidate_source_artifact_id\"] != record[\"candidate_payload_artifact_id\"])\n    require(record[\"source_run_attempt\"] <= record[\"draft_run_attempt\"] <= record[\"signer_run_attempt\"] <= record[\"publisher_run_attempt\"] <= 51)\n    workflow_tuple(record, \"signer\", \".github/workflows/product-release-generator.yml\", source, \"refs/tags/\" + record[\"tag\"])\n    workflow_tuple(record, \"ci\", \".github/workflows/ci.yml\", source, \"refs/heads/main\")\n    workflow_tuple(record, \"qualification\", \".github/workflows/source-qualification.yml\", source, \"refs/heads/main\")\n    name = record[\"payload_name\"]\n    require(record[\"payload_target\"] == TARGET and isinstance(name, str))\n    require(name == \"velnor-actions-x86_64-unknown-linux-gnu\")\n    require(number(record[\"payload_size\"]) and record[\"payload_size\"] <= MAX_PAYLOAD)\n    require(all(hex64(record[key]) for key in (\"payload_sha256\", \"receipt_sha256\", \"bundle_sha256\")))\n\n\ndef event_binding(context, network):\n    event = context[\"event\"]\n    require(isinstance(event, dict) and context[\"repository\"] == REPOSITORY)\n    live_repository = network.api(f\"/repos/{REPOSITORY}\")\n    require(live_repository.get(\"id\") == REPOSITORY_ID and live_repository.get(\"full_name\") == REPOSITORY)\n    require(live_repository.get(\"default_branch\") == \"main\")\n    repository = event.get(\"repository\", {})\n    require(repository.get(\"full_name\") == REPOSITORY and repository.get(\"id\") == REPOSITORY_ID)\n    candidate = context[\"candidate\"]\n    require(sha40(candidate))\n    kind = context[\"event_name\"]\n    if kind == \"pull_request\":\n        pr = event.get(\"pull_request\", {})\n        base = pr.get(\"base\", {})\n        head = pr.get(\"head\", {})\n        require(number(event.get(\"number\")) and base.get(\"ref\") == \"main\")\n        require(base.get(\"repo\", {}).get(\"id\") == REPOSITORY_ID)\n        require(sha40(base.get(\"sha\")) and sha40(head.get(\"sha\")))\n        require(number(head.get(\"repo\", {}).get(\"id\")))\n        live = network.api(f\"/repos/{REPOSITORY}/pulls/{event['number']}\")\n        require(live.get(\"number\") == event[\"number\"] and live.get(\"state\") == \"open\")\n        require(live.get(\"base\", {}).get(\"sha\") == base[\"sha\"] and live.get(\"base\", {}).get(\"ref\") == \"main\")\n        require(live.get(\"base\", {}).get(\"repo\", {}).get(\"id\") == REPOSITORY_ID)\n        require(live.get(\"head\", {}).get(\"sha\") == head[\"sha\"])\n        require(live.get(\"head\", {}).get(\"repo\", {}).get(\"id\") == head.get(\"repo\", {}).get(\"id\"))\n        base_sha = base[\"sha\"]\n    elif kind == \"merge_group\":\n        group = event.get(\"merge_group\", {})\n        base_sha = group.get(\"base_sha\")\n        require(sha40(base_sha) and group.get(\"base_ref\") == \"refs/heads/main\")\n        require(group.get(\"head_sha\") == candidate and group.get(\"head_ref\") == context[\"ref\"])\n    elif kind == \"push\":\n        base_sha = event.get(\"before\")\n        require(sha40(base_sha) and context[\"ref\"] == \"refs/heads/main\")\n        require(event.get(\"after\") == candidate and event.get(\"deleted\") is False)\n    elif kind == \"workflow_dispatch\":\n        require(context[\"ref\"] == \"refs/heads/main\")\n        commit = network.api(f\"/repos/{REPOSITORY}/commits/{candidate}\")\n        parents = commit.get(\"parents\")\n        require(commit.get(\"sha\") == candidate and isinstance(parents, list) and len(parents) > 0)\n        base_sha = parents[0].get(\"sha\")\n        require(sha40(base_sha))\n    else:\n        raise AdmissionError(\"source_preview_unsupported_event\")\n    live_main = network.api(f\"/repos/{REPOSITORY}/commits/main\")\n    expected_main = base_sha if kind in (\"pull_request\", \"merge_group\") else candidate\n    require(live_main.get(\"sha\") == expected_main)\n    return base_sha\n\n\ndef read_github_lock(network, commit):\n    require(sha40(commit))\n    blob = network.api(f\"/repos/{REPOSITORY}/contents/.velnor/generator.lock?ref={commit}\")\n    require(blob.get(\"type\") == \"file\" and blob.get(\"encoding\") == \"base64\")\n    require(blob.get(\"path\") == \".velnor/generator.lock\" and number(blob.get(\"size\")) and blob[\"size\"] <= MAX_LOCK)\n    try:\n        raw = base64.b64decode(\"\".join(blob[\"content\"].split()), validate=True)\n    except (ValueError, KeyError) as error:\n        raise AdmissionError(\"source_preview_invalid_base_lock\") from error\n    require(len(raw) == blob[\"size\"])\n    return parse_lock(raw)\n\n\ndef approved_controller(context, network):\n    base_sha = event_binding(context, network)\n    candidate_lock = parse_lock(read_regular(context[\"lock_path\"], MAX_LOCK))\n    base_lock = read_github_lock(network, base_sha)\n    candidate_preview = candidate_lock.get(\"planner-preview\")\n    base_active = base_lock.get(\"planner-preview\")\n    if candidate_preview is None:\n        require(base_active is None)\n        return None, base_lock, base_sha\n    validate_preview(candidate_preview, context[\"candidate\"])\n    approved = [base_active, base_lock.get(\"planner-preview-staged\")]\n    require(any(value == candidate_preview for value in approved if value is not None))\n    return candidate_preview, base_lock, base_sha\n\n\ndef stable_identity(base_lock):\n    generator = base_lock.get(\"generator\")\n    require(isinstance(generator, dict) and generator.get(\"binary\") == \"velnor-actions\")\n    version = generator.get(\"version\")\n    require(isinstance(version, str) and re.fullmatch(r\"(?:0|[1-9][0-9]*)\\.(?:0|[1-9][0-9]*)\\.(?:0|[1-9][0-9]*)\", version) is not None)\n    require(sha40(generator.get(\"commit\")))\n    binaries = generator.get(\"binaries\")\n    require(isinstance(binaries, list))\n    matches = [entry for entry in binaries if isinstance(entry, dict) and entry.get(\"target\") == TARGET]\n    require(len(matches) == 1)\n    item = matches[0]\n    expected = f\"https://github.com/{REPOSITORY}/releases/download/v{version}/velnor-actions-{version}-{TARGET}\"\n    require(item.get(\"artifact\") == expected and hex64(item.get(\"sha256\")))\n    return {\"channel\": \"stable\", \"version\": version, \"target\": TARGET, \"sha256\": item[\"sha256\"]}, expected\n\n\ndef receipt_from_record(record):\n    def run(prefix):\n        return {suffix: record[f\"{prefix}_{suffix}\"] for suffix in (\"workflow_path\", \"workflow_ref\", \"workflow_sha\", \"run_id\", \"run_attempt\")}\n    return {\n        \"schema\": record[\"schema\"],\n        \"repository\": record[\"repository\"],\n        \"version\": record[\"version\"],\n        \"source_sha\": record[\"source_sha\"],\n        \"tag\": record[\"tag\"],\n        \"release_id\": record[\"release_id\"],\n        \"source\": run(\"source\"),\n        \"draft\": run(\"draft\"),\n        \"signer\": run(\"signer\"),\n        \"ci\": run(\"ci\"),\n        \"qualification\": run(\"qualification\"),\n        \"producer\": {\"producer_run_id\": record[\"producer_run_id\"], \"producer_run_attempt\": record[\"producer_run_attempt\"], \"payload_artifact_id\": record[\"producer_payload_artifact_id\"], \"payload_archive_sha256\": record[\"producer_payload_archive_sha256\"]},\n        \"candidate\": {\"source_artifact_id\": record[\"candidate_source_artifact_id\"], \"payload_artifact_id\": record[\"candidate_payload_artifact_id\"]},\n        \"payload\": {key: record[f\"payload_{key}\"] for key in (\"target\", \"name\", \"size\", \"sha256\")},\n    }\n\n\ndef checked_asset(network, url, expected_size, expected_digest, maximum):\n    require(number(expected_size) and expected_size <= maximum and hex64(expected_digest))\n    body = network.asset(url, maximum)\n    require(len(body) == expected_size and hashlib.sha256(body).hexdigest() == expected_digest)\n    return body\n\n\ndef asset_metadata(release, name, maximum, url):\n    assets = release.get(\"assets\")\n    require(isinstance(assets, list))\n    matches = [item for item in assets if isinstance(item, dict) and item.get(\"name\") == name]\n    require(len(matches) == 1)\n    entry = matches[0]\n    require(entry.get(\"state\") == \"uploaded\" and number(entry.get(\"size\")) and entry[\"size\"] <= maximum)\n    require(entry.get(\"browser_download_url\") == url)\n    digest = entry.get(\"digest\")\n    require(isinstance(digest, str) and digest.startswith(\"sha256:\") and hex64(digest[7:]))\n    return entry[\"size\"], digest[7:]\n\n\ndef verify_annotated_tag(preview, network):\n    reference = network.api(f\"/repos/{REPOSITORY}/git/ref/tags/{preview['tag']}\")\n    require(reference.get(\"ref\") == \"refs/tags/\" + preview[\"tag\"])\n    tag = reference.get(\"object\", {})\n    require(tag.get(\"type\") == \"tag\" and sha40(tag.get(\"sha\")))\n    annotated = network.api(f\"/repos/{REPOSITORY}/git/tags/{tag['sha']}\")\n    require(annotated.get(\"sha\") == tag[\"sha\"] and annotated.get(\"tag\") == preview[\"tag\"])\n    target = annotated.get(\"object\", {})\n    require(target.get(\"type\") == \"commit\" and target.get(\"sha\") == preview[\"source_sha\"])\n    return tag[\"sha\"]\n\n\ndef download_verified_release(preview, network):\n    release = network.api(f\"/repos/{REPOSITORY}/releases/{preview['release_id']}\")\n    require(release.get(\"id\") == preview[\"release_id\"] and release.get(\"tag_name\") == preview[\"tag\"])\n    verify_annotated_tag(preview, network)\n    require(release.get(\"draft\") is False and release.get(\"prerelease\") is True and release.get(\"immutable\") is True)\n    names = (\"SDK_PREVIEW_RECEIPT.json\", \"SDK_PREVIEW_RECEIPT.json.sigstore.jsonl\", preview[\"payload_name\"])\n    assets = release.get(\"assets\")\n    require(isinstance(assets, list) and len(assets) == len(names))\n    require(sorted(item.get(\"name\") for item in assets if isinstance(item, dict)) == sorted(names))\n    prefix = f\"https://github.com/{REPOSITORY}/releases/download/{preview['tag']}/\"\n    receipt_size, receipt_digest = asset_metadata(release, names[0], MAX_RECEIPT, prefix + names[0])\n    bundle_size, bundle_digest = asset_metadata(release, names[1], MAX_BUNDLE, prefix + names[1])\n    payload_size, payload_digest = asset_metadata(release, names[2], MAX_PAYLOAD, prefix + names[2])\n    require(receipt_digest == preview[\"receipt_sha256\"] and bundle_digest == preview[\"bundle_sha256\"])\n    require(payload_size == preview[\"payload_size\"] and payload_digest == preview[\"payload_sha256\"])\n    receipt = checked_asset(network, prefix + names[0], receipt_size, receipt_digest, MAX_RECEIPT)\n    bundle = checked_asset(network, prefix + names[1], bundle_size, bundle_digest, MAX_BUNDLE)\n    payload = checked_asset(network, prefix + names[2], payload_size, payload_digest, MAX_PAYLOAD)\n    parsed = parse_json(receipt, MAX_RECEIPT)\n    require(parsed == receipt_from_record(preview))\n    require(json.dumps(parsed, sort_keys=True, separators=(\",\", \":\"), ensure_ascii=False).encode(\"utf-8\") == receipt)\n    return receipt, bundle, payload\n\n\ndef verify_checkout(context):\n    workspace = Path(context[\"workspace\"])\n    require(workspace.is_absolute() and not workspace.is_symlink())\n    require(Path(context[\"lock_path\"]) == workspace / \".velnor\" / \"generator.lock\")\n    git = subprocess.run(\n        [\"/usr/bin/git\", \"-C\", str(workspace), \"rev-parse\", \"--verify\", \"HEAD^{commit}\"],\n        stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,\n        env={\"PATH\": \"/usr/bin:/bin\", \"GIT_CONFIG_GLOBAL\": \"/dev/null\", \"GIT_CONFIG_NOSYSTEM\": \"1\"},\n        timeout=15, check=False,\n    )\n    require(git.returncode == 0 and git.stdout.decode(\"ascii\").strip() == context[\"candidate\"])\n\n\ndef preview_identity(preview):\n    return {\"channel\": \"source-preview\", \"version\": preview[\"version\"], \"target\": TARGET, \"sha256\": preview[\"payload_sha256\"], \"source_sha\": preview[\"source_sha\"], \"receipt_sha256\": preview[\"receipt_sha256\"]}\n\n\ndef authorize_and_acquire(context, network, required_identity=None):\n    verify_checkout(context)\n    preview, base_lock, base = approved_controller(context, network)\n    if preview is None:\n        tag_sha = None\n        identity, stable_url = stable_identity(base_lock)\n        require(required_identity is None)\n        payload = network.asset(stable_url, MAX_PAYLOAD)\n        require(0 < len(payload) <= MAX_PAYLOAD and hashlib.sha256(payload).hexdigest() == identity[\"sha256\"])\n    else:\n        bootstrap_identity = preview_identity(preview)\n        identity = bootstrap_identity\n        require(required_identity is None or required_identity == bootstrap_identity)\n        tag_sha = verify_annotated_tag(preview, network)\n        _, _, payload = download_verified_release(preview, network)\n    require(event_binding(context, network) == base)\n    runner_temp = Path(context[\"runner_temp\"])\n    require(runner_temp.is_absolute())\n    flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW\n    root_fd = os.open(runner_temp, flags)\n    directory_fd = root_fd\n    try:\n        check_owned_directory(root_fd)\n        for name in (\"velnor\", \"bin\"):\n            try:\n                os.mkdir(name, mode=0o700, dir_fd=directory_fd)\n            except FileExistsError:\n                pass\n            child_fd = os.open(name, flags, dir_fd=directory_fd)\n            check_owned_directory(child_fd)\n            if directory_fd != root_fd:\n                os.close(directory_fd)\n            directory_fd = child_fd\n        temporary = \".controller-\" + secrets.token_hex(16)\n        os.mkdir(temporary, mode=0o700, dir_fd=directory_fd)\n        temporary_fd = os.open(temporary, flags, dir_fd=directory_fd)\n        try:\n            for name, contents, mode in (\n                (\"binary\", payload, 0o700),\n                (\"identity.json\", json.dumps(identity, sort_keys=True, separators=(\",\", \":\")).encode(), 0o600),\n            ):\n                fd = os.open(name, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, mode, dir_fd=temporary_fd)\n                with os.fdopen(fd, \"wb\") as file:\n                    file.write(contents)\n                    file.flush()\n                    os.fsync(file.fileno())\n            os.fsync(temporary_fd)\n            require(event_binding(context, network) == base)\n            if preview is not None:\n                require(verify_annotated_tag(preview, network) == tag_sha)\n            rename_exclusive(directory_fd, temporary, \"controller\")\n        except BaseException:\n            for name in (\"binary\", \"identity.json\"):\n                try:\n                    os.unlink(name, dir_fd=temporary_fd)\n                except FileNotFoundError:\n                    pass\n            os.rmdir(temporary, dir_fd=directory_fd)\n            raise\n        finally:\n            os.close(temporary_fd)\n    finally:\n        if directory_fd != root_fd:\n            os.close(directory_fd)\n        os.close(root_fd)\n    return str(runner_temp / \"velnor\" / \"bin\" / \"controller\" / \"binary\")\n\n\ndef rename_exclusive(directory_fd, source, target):\n    libc = ctypes.CDLL(None, use_errno=True)\n    if sys.platform == \"linux\":\n        operation = libc.renameat2\n        flag = 1\n    elif sys.platform == \"darwin\":\n        operation = libc.renameatx_np\n        flag = 4\n    else:\n        raise AdmissionError(\"source_preview_unsupported_platform\")\n    operation.argtypes = (ctypes.c_int, ctypes.c_char_p, ctypes.c_int, ctypes.c_char_p, ctypes.c_uint)\n    operation.restype = ctypes.c_int\n    if operation(directory_fd, os.fsencode(source), directory_fd, os.fsencode(target), flag) != 0:\n        raise OSError(ctypes.get_errno(), \"source_preview_controller_rename\")\n\n\ndef verify_controller(context, network):\n    verify_checkout(context)\n    preview, base_lock, base = approved_controller(context, network)\n    if preview is None:\n        tag_sha = None\n        expected, _ = stable_identity(base_lock)\n    else:\n        tag_sha = verify_annotated_tag(preview, network)\n        expected = {\"channel\": \"source-preview\", \"version\": preview[\"version\"], \"target\": TARGET, \"sha256\": preview[\"payload_sha256\"], \"source_sha\": preview[\"source_sha\"], \"receipt_sha256\": preview[\"receipt_sha256\"]}\n    root = Path(context[\"runner_temp\"]) / \"velnor\" / \"bin\" / \"controller\"\n    raw = read_regular(root / \"identity.json\", MAX_RECEIPT)\n    actual = parse_json(raw, MAX_RECEIPT)\n    require(raw == json.dumps(actual, sort_keys=True, separators=(\",\", \":\")).encode() and actual == expected)\n    binary = read_regular(root / \"binary\", MAX_PAYLOAD)\n    require(hashlib.sha256(binary).hexdigest() == expected[\"sha256\"])\n    require(event_binding(context, network) == base)\n    if preview is not None:\n        require(verify_annotated_tag(preview, network) == tag_sha)\n    return expected\n\n\ndef check_owned_directory(fd):\n    info = os.fstat(fd)\n    require(stat.S_ISDIR(info.st_mode) and info.st_uid == os.geteuid() and info.st_mode & 0o022 == 0)\n\n\nclass FixedRedirect(urllib.request.HTTPRedirectHandler):\n    def redirect_request(self, request, file, code, message, headers, new_url):\n        old = urllib.parse.urlsplit(request.full_url)\n        new = urllib.parse.urlsplit(new_url)\n        require(old.hostname != API and new.scheme == \"https\" and new.hostname in RELEASE_HOSTS)\n        require(new.port in (None, 443) and new.username is None and new.password is None)\n        redirected = super().redirect_request(request, file, code, message, headers, new_url)\n        require(redirected is not None)\n        for key in list(redirected.headers):\n            if key.lower() in (\"authorization\", \"cookie\", \"proxy-authorization\"):\n                redirected.remove_header(key)\n        return redirected\n\n\nclass GitHubTransport:\n    def __init__(self, token):\n        import ssl\n        self.token = token\n        self.deadline = time.monotonic() + 180\n        ca_file = \"/etc/ssl/cert.pem\" if sys.platform == \"darwin\" else \"/etc/ssl/certs/ca-certificates.crt\"\n        tls = ssl.create_default_context(cafile=ca_file)\n        self.opener = urllib.request.build_opener(\n            urllib.request.ProxyHandler({}), urllib.request.HTTPSHandler(context=tls), FixedRedirect()\n        )\n\n    def get(self, url, maximum, api):\n        remaining = self.deadline - time.monotonic()\n        require(remaining > 0)\n        parsed = urllib.parse.urlsplit(url)\n        require(parsed.scheme == \"https\" and parsed.port in (None, 443))\n        require(parsed.username is None and parsed.password is None and not parsed.fragment)\n        require(parsed.hostname == (API if api else \"github.com\"))\n        headers = {\"Accept\": \"application/vnd.github+json\", \"User-Agent\": \"velnor-source-preview\"}\n        if api and self.token:\n            headers[\"Authorization\"] = \"Bearer \" + self.token\n        request = urllib.request.Request(url, headers=headers, method=\"GET\")\n        try:\n            with self.opener.open(request, timeout=min(remaining, 30)) as response:\n                length = response.headers.get(\"Content-Length\")\n                if length is not None:\n                    require(length.isdecimal() and int(length) <= maximum)\n                result = bytearray()\n                size = 0\n                while True:\n                    require(time.monotonic() <= self.deadline)\n                    chunk = response.read1(min(65_536, maximum + 1 - size))\n                    if not chunk:\n                        break\n                    size += len(chunk)\n                    require(size <= maximum)\n                    result.extend(chunk)\n        except (OSError, urllib.error.URLError) as error:\n            raise AdmissionError(\"source_preview_network_failure\") from error\n        require(len(result) <= maximum and time.monotonic() <= self.deadline)\n        return result\n\n    def api(self, path):\n        require(path == f\"/repos/{REPOSITORY}\" or path.startswith(f\"/repos/{REPOSITORY}/\"))\n        return parse_json(self.get(\"https://\" + API + path, MAX_JSON, True), MAX_JSON)\n\n    def asset(self, url, maximum):\n        return self.get(url, maximum, False)\n\n\ndef environment_context():\n    event_path = Path(os.environ[\"GITHUB_EVENT_PATH\"])\n    event = parse_json(read_regular(event_path, MAX_JSON), MAX_JSON)\n    workspace = Path(os.environ[\"GITHUB_WORKSPACE\"])\n    context = {\n        \"event\": event,\n        \"event_name\": os.environ[\"GITHUB_EVENT_NAME\"],\n        \"repository\": os.environ[\"GITHUB_REPOSITORY\"],\n        \"candidate\": os.environ[\"GITHUB_SHA\"],\n        \"ref\": os.environ[\"GITHUB_REF\"],\n        \"workspace\": str(workspace),\n        \"lock_path\": str(workspace / \".velnor\" / \"generator.lock\"),\n        \"runner_temp\": os.environ[\"RUNNER_TEMP\"],\n    }\n    return context\n\n\ndef main():\n    context = environment_context()\n    authorize_and_acquire(context, GitHubTransport(os.environ.get(\"GH_TOKEN\", \"\")))\n\n\nif __name__ == \"__main__\":\n    try:\n        main()\n    except (AdmissionError, OSError, KeyError, ValueError, subprocess.SubprocessError):\n        raise SystemExit(\"source preview acquisition rejected\") from None\n\nBOOTSTRAP\ncat > \"$RUNNER_TEMP/source-preview-support/source_preview_stage_verify.py\" <<'VERIFIER'\n# SPDX-FileCopyrightText: 2026 Alexey Zhokhov\n# SPDX-License-Identifier: Apache-2.0\n\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport platform\nimport selectors\nimport signal\nimport subprocess\nimport sys\nimport tempfile\nimport time\n\nimport source_preview_bootstrap as bootstrap\n\nGH_SHA256 = {\n    (\"Linux\", \"x86_64\"): {\"cbfdc94f3a5c0713c0d6df3e0a1d88a59a76b0c52332aad7d21d112f9da2cc0e\", \"b768184570b12536be4ac1528893f6340d1c6a7b40b56ad45bca9cd0e87ad34d\"},\n    (\"Darwin\", \"arm64\"): {\"5e4470bb57bf1e7cb5063be940d5dffc5be3e1899d6bf7fe1ff15372f7f4cc29\", \"5f8d7527e2bdf584249b030cdd1550c91d75e8afb40aa3c11573d416817a1260\"},\n}\nOWNER_ID = \"78806509\"\nMAX_GH_BYTES = 104_857_600\nMAX_VERIFY_OUTPUT = 16_777_216\nAUTHORITY_WORKFLOW = \".github/workflows/source-preview-publication.yml\"\nPUBLICATION_AUTHORITY_SHA = None\n\n\ndef checked_authority(authority):\n    bootstrap.require(isinstance(authority, dict) and set(authority) == {\"repository\", \"path\", \"ref\", \"sha\"})\n    bootstrap.require(authority[\"repository\"] == bootstrap.REPOSITORY and authority[\"path\"] == AUTHORITY_WORKFLOW)\n    bootstrap.require(bootstrap.sha40(authority[\"sha\"]))\n    bootstrap.require(authority[\"ref\"] == bootstrap.REPOSITORY + \"/\" + AUTHORITY_WORKFLOW + \"@\" + authority[\"sha\"])\n    return authority\n\n\ndef staging_authority():\n    bootstrap.require(bootstrap.sha40(PUBLICATION_AUTHORITY_SHA))\n    return checked_authority({\"repository\": bootstrap.REPOSITORY, \"path\": AUTHORITY_WORKFLOW, \"ref\": bootstrap.REPOSITORY + \"/\" + AUTHORITY_WORKFLOW + \"@\" + PUBLICATION_AUTHORITY_SHA, \"sha\": PUBLICATION_AUTHORITY_SHA})\n\n\ndef verify_gh_binary(path):\n    expected = GH_SHA256.get((platform.system(), platform.machine()))\n    bootstrap.require(expected is not None)\n    data = bootstrap.read_regular(path, MAX_GH_BYTES)\n    bootstrap.require(hashlib.sha256(data).hexdigest() in expected)\n    bootstrap.require(os.access(path, os.X_OK))\n\n\ndef invoke_gh(path, receipt_path, bundle_path, source, expected_authority):\n    authority = checked_authority(expected_authority)\n    bootstrap.require(authority[\"sha\"] != source)\n    environment = {key: os.environ[key] for key in (\"HOME\", \"LANG\", \"LC_ALL\", \"TMPDIR\") if key in os.environ}\n    environment.update({\"PATH\": \"/usr/bin:/bin\", \"GH_PROMPT_DISABLED\": \"1\"})\n    command = [path, \"attestation\", \"verify\", str(receipt_path), \"--bundle\", str(bundle_path), \"--repo\", bootstrap.REPOSITORY, \"--signer-workflow\", bootstrap.REPOSITORY + \"/\" + authority[\"path\"], \"--signer-digest\", authority[\"sha\"], \"--source-digest\", source, \"--source-ref\", \"refs/tags/sdk-preview-\" + source, \"--format\", \"json\"]\n    process = subprocess.Popen(command, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, env=environment, start_new_session=True)\n    output = bytearray()\n    deadline = time.monotonic() + 90\n    try:\n        with selectors.DefaultSelector() as selector:\n            selector.register(process.stdout, selectors.EVENT_READ)\n            while selector.get_map():\n                remaining = deadline - time.monotonic()\n                bootstrap.require(remaining > 0)\n                ready = selector.select(remaining)\n                bootstrap.require(bool(ready))\n                for key, _ in ready:\n                    chunk = os.read(key.fd, min(65_536, MAX_VERIFY_OUTPUT + 1 - len(output)))\n                    if not chunk:\n                        selector.unregister(key.fileobj)\n                    else:\n                        output.extend(chunk)\n                        bootstrap.require(len(output) <= MAX_VERIFY_OUTPUT)\n        bootstrap.require(process.wait(timeout=max(0.001, deadline - time.monotonic())) == 0)\n    finally:\n        if process.poll() is None:\n            os.killpg(process.pid, signal.SIGKILL)\n            process.wait()\n    return bootstrap.parse_json(output, MAX_VERIFY_OUTPUT)\n\n\ndef certificate_matches(certificate, source, workflow, run_id, attempt, expected_authority):\n    authority = checked_authority(expected_authority)\n    signer_uri = \"https://github.com/\" + authority[\"ref\"]\n    uri = f\"https://github.com/{bootstrap.REPOSITORY}/{workflow}@refs/tags/sdk-preview-{source}\"\n    expected = {\n        \"issuer\": \"https://token.actions.githubusercontent.com\",\n        \"subjectAlternativeName\": signer_uri,\n        \"buildSignerURI\": signer_uri,\n        \"buildSignerDigest\": authority[\"sha\"],\n        \"buildConfigURI\": uri,\n        \"buildConfigDigest\": source,\n        \"sourceRepositoryURI\": f\"https://github.com/{bootstrap.REPOSITORY}\",\n        \"sourceRepositoryIdentifier\": str(bootstrap.REPOSITORY_ID),\n        \"sourceRepositoryOwnerURI\": \"https://github.com/tailrocks\",\n        \"sourceRepositoryOwnerIdentifier\": OWNER_ID,\n        \"sourceRepositoryDigest\": source,\n        \"sourceRepositoryRef\": \"refs/tags/sdk-preview-\" + source,\n        \"buildTrigger\": \"push\",\n        \"runnerEnvironment\": \"github-hosted\",\n        \"runInvocationURI\": f\"https://github.com/{bootstrap.REPOSITORY}/actions/runs/{run_id}/attempts/{attempt}\",\n    }\n    return authority[\"sha\"] != source and isinstance(certificate, dict) and all(certificate.get(key) == value for key, value in expected.items())\n\n\ndef verify_attestation(path, receipt, bundle, preview, temp_root, expected_authority):\n    authority = checked_authority(expected_authority)\n    bootstrap.require(authority[\"sha\"] != preview[\"source_sha\"])\n    verify_gh_binary(path)\n    with tempfile.TemporaryDirectory(prefix=\"source-preview-stage-\", dir=temp_root) as temporary:\n        root = Path(temporary)\n        receipt_path = root / \"SDK_PREVIEW_RECEIPT.json\"\n        bundle_path = root / \"SDK_PREVIEW_RECEIPT.json.sigstore.jsonl\"\n        receipt_path.write_bytes(receipt)\n        bundle_path.write_bytes(bundle)\n        verified = invoke_gh(path, receipt_path, bundle_path, preview[\"source_sha\"], authority)\n    bootstrap.require(isinstance(verified, list) and len(verified) == 1)\n    result = verified[0].get(\"verificationResult\", {})\n    certificate = result.get(\"signature\", {}).get(\"certificate\")\n    bootstrap.require(certificate_matches(certificate, preview[\"source_sha\"], preview[\"signer_workflow_path\"], preview[\"signer_run_id\"], preview[\"signer_run_attempt\"], authority))\n    statement = result.get(\"statement\", {})\n    bootstrap.require(statement.get(\"predicateType\") == \"https://slsa.dev/provenance/v1\")\n    subjects = statement.get(\"subject\")\n    bootstrap.require(isinstance(subjects, list))\n    for name, digest in [(\"SDK_PREVIEW_RECEIPT.json\", preview[\"receipt_sha256\"]), (preview[\"payload_name\"], preview[\"payload_sha256\"])]:\n        matches = [item for item in subjects if isinstance(item, dict) and item.get(\"name\") == name]\n        bootstrap.require(len(matches) == 1 and matches[0].get(\"digest\") == {\"sha256\": digest})\n\n\ndef verify_run(network, preview, prefix, event):\n    run_id = preview[prefix + \"_run_id\"]\n    attempt = preview[prefix + \"_run_attempt\"]\n    path = f\"/repos/{bootstrap.REPOSITORY}/actions/runs/{run_id}/attempts/{attempt}\"\n    run = network.api(path)\n    bootstrap.require(run.get(\"id\") == run_id and run.get(\"run_attempt\") == attempt)\n    bootstrap.require(run.get(\"event\") == event and run.get(\"head_sha\") == preview[\"source_sha\"])\n    bootstrap.require(run.get(\"head_branch\") == (preview[\"tag\"] if prefix in (\"source\", \"draft\", \"signer\") else \"main\") and run.get(\"path\") == preview[prefix + \"_workflow_path\"])\n    bootstrap.require(run.get(\"status\") == \"completed\")\n    if prefix in (\"ci\", \"qualification\"):\n        bootstrap.require(run.get(\"conclusion\") == \"success\")\n    bootstrap.require(run.get(\"head_repository\", {}).get(\"id\") == bootstrap.REPOSITORY_ID)\n    bootstrap.require(run.get(\"head_repository\", {}).get(\"full_name\") == bootstrap.REPOSITORY)\n    return path\n\n\ndef verify_required_job(network, run_path, name, source):\n    jobs = []\n    total = None\n    for page in range(1, 11):\n        response = network.api(f\"{run_path}/jobs?per_page=100&page={page}\")\n        count = response.get(\"total_count\")\n        values = response.get(\"jobs\")\n        bootstrap.require(bootstrap.number(count) and isinstance(values, list))\n        if total is None:\n            total = count\n        bootstrap.require(total == count and count <= 1_000)\n        jobs.extend(values)\n        bootstrap.require(len(jobs) <= total)\n        if len(jobs) == total:\n            break\n        bootstrap.require(len(values) == 100)\n    bootstrap.require(len(jobs) == total)\n    bootstrap.require(all(isinstance(job, dict) and bootstrap.number(job.get(\"id\")) for job in jobs))\n    bootstrap.require(len({job[\"id\"] for job in jobs}) == len(jobs))\n    run_id, attempt = (int(run_path.split(\"/runs/\")[1].split(\"/\")[0]), int(run_path.rsplit(\"/\", 1)[1]))\n    bootstrap.require(all(job.get(\"run_id\") == run_id and job.get(\"run_attempt\") == attempt and job.get(\"head_sha\") == source for job in jobs))\n    matches = [job for job in jobs if isinstance(job, dict) and job.get(\"name\") == name]\n    bootstrap.require(len(matches) == 1)\n    job = matches[0]\n    bootstrap.require(job.get(\"status\") == \"completed\" and job.get(\"conclusion\") == \"success\")\n    bootstrap.require(job.get(\"head_sha\") == source)\n    return job\n\n\ndef verify_publication_jobs(network, preview):\n    for role, name in ((\"source\", \"Source preview publication / Admit source preview\"), (\"draft\", \"Source preview publication / Draft source preview\"), (\"signer\", \"Source preview publication / Attest source preview\")):\n        role_path = verify_run(network, preview, role, \"push\")\n        verify_required_job(network, role_path, name, preview[\"source_sha\"])\n    publisher = dict(preview)\n    publisher[\"signer_run_attempt\"] = preview[\"publisher_run_attempt\"]\n    publisher_path = verify_run(network, publisher, \"signer\", \"push\")\n    published_job = verify_required_job(network, publisher_path, \"Source preview publication / Publish source preview\", preview[\"source_sha\"])\n    bootstrap.require(published_job[\"id\"] == preview[\"publisher_job_id\"])\n    pinned_job = network.api(f\"/repos/{bootstrap.REPOSITORY}/actions/jobs/{preview['publisher_job_id']}\")\n    bootstrap.require(pinned_job.get(\"id\") == preview[\"publisher_job_id\"] and pinned_job.get(\"run_id\") == preview[\"signer_run_id\"])\n    bootstrap.require(pinned_job.get(\"run_attempt\") == preview[\"publisher_run_attempt\"] and pinned_job.get(\"head_sha\") == preview[\"source_sha\"])\n    bootstrap.require(pinned_job.get(\"name\") == \"Source preview publication / Publish source preview\" and pinned_job.get(\"status\") == \"completed\" and pinned_job.get(\"conclusion\") == \"success\")\n\n\ndef verify_staging(pr_number, gh_path, network, temp_root):\n    bootstrap.require(bootstrap.number(pr_number))\n    repository = network.api(f\"/repos/{bootstrap.REPOSITORY}\")\n    bootstrap.require(repository.get(\"id\") == bootstrap.REPOSITORY_ID and repository.get(\"full_name\") == bootstrap.REPOSITORY and repository.get(\"default_branch\") == \"main\")\n    pr = network.api(f\"/repos/{bootstrap.REPOSITORY}/pulls/{pr_number}\")\n    bootstrap.require(pr.get(\"number\") == pr_number and pr.get(\"state\") == \"open\")\n    head = pr.get(\"head\", {})\n    base = pr.get(\"base\", {})\n    bootstrap.require(bootstrap.sha40(head.get(\"sha\")) and bootstrap.sha40(base.get(\"sha\")))\n    bootstrap.require(base.get(\"ref\") == \"main\" and base.get(\"repo\", {}).get(\"id\") == bootstrap.REPOSITORY_ID)\n    bootstrap.require(bootstrap.number(head.get(\"repo\", {}).get(\"id\")))\n    initial = (head[\"sha\"], head[\"repo\"][\"id\"], base[\"sha\"])\n    main = network.api(f\"/repos/{bootstrap.REPOSITORY}/commits/main\")\n    bootstrap.require(main.get(\"sha\") == base[\"sha\"])\n    lock = bootstrap.read_github_lock(network, head[\"sha\"])\n    preview = lock.get(\"planner-preview-staged\")\n    bootstrap.validate_preview(preview, head[\"sha\"])\n    ancestry = network.api(f\"/repos/{bootstrap.REPOSITORY}/compare/{preview['source_sha']}...{base['sha']}\")\n    bootstrap.require(ancestry.get(\"status\") in (\"identical\", \"ahead\") and ancestry.get(\"merge_base_commit\", {}).get(\"sha\") == preview[\"source_sha\"])\n    ci = verify_run(network, preview, \"ci\", \"push\")\n    qualification = verify_run(network, preview, \"qualification\", \"workflow_dispatch\")\n    verify_required_job(network, ci, \"Required\", preview[\"source_sha\"])\n    verify_required_job(network, qualification, \"Source qualification\", preview[\"source_sha\"])\n    verify_publication_jobs(network, preview)\n    tag_sha = bootstrap.verify_annotated_tag(preview, network)\n    receipt, bundle, _ = bootstrap.download_verified_release(preview, network)\n    authority = staging_authority()\n    authority_ancestry = network.api(f\"/repos/{bootstrap.REPOSITORY}/compare/{authority['sha']}...{preview['source_sha']}\")\n    bootstrap.require(authority_ancestry.get(\"status\") == \"ahead\" and authority_ancestry.get(\"merge_base_commit\", {}).get(\"sha\") == authority[\"sha\"])\n    verify_attestation(gh_path, receipt, bundle, preview, temp_root, authority)\n    current = network.api(f\"/repos/{bootstrap.REPOSITORY}/pulls/{pr_number}\")\n    bootstrap.require(current.get(\"number\") == pr_number and current.get(\"state\") == \"open\")\n    bootstrap.require((current.get(\"head\", {}).get(\"sha\"), current.get(\"head\", {}).get(\"repo\", {}).get(\"id\"), current.get(\"base\", {}).get(\"sha\")) == initial)\n    bootstrap.require(current.get(\"base\", {}).get(\"ref\") == \"main\" and current.get(\"base\", {}).get(\"repo\", {}).get(\"id\") == bootstrap.REPOSITORY_ID)\n    bootstrap.require(network.api(f\"/repos/{bootstrap.REPOSITORY}/commits/main\").get(\"sha\") == base[\"sha\"])\n    bootstrap.require(bootstrap.verify_annotated_tag(preview, network) == tag_sha)\n    return {\"repository\": bootstrap.REPOSITORY, \"pull_request\": pr_number, \"head_sha\": head[\"sha\"], \"base_sha\": base[\"sha\"], \"source_sha\": preview[\"source_sha\"], \"receipt_sha256\": preview[\"receipt_sha256\"]}\n\n\ndef main():\n    bootstrap.require(len(sys.argv) == 4)\n    pr_number = int(sys.argv[1])\n    gh = str(Path(sys.argv[2]))\n    temp_root = Path(sys.argv[3])\n    bootstrap.require(temp_root.is_absolute() and temp_root.is_dir() and not temp_root.is_symlink())\n    result = verify_staging(pr_number, gh, bootstrap.GitHubTransport(os.environ.get(\"GH_TOKEN\", \"\")), temp_root)\n    sys.stdout.write(json.dumps(result, sort_keys=True, separators=(\",\", \":\")) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    try:\n        main()\n    except (bootstrap.AdmissionError, OSError, ValueError, KeyError, subprocess.SubprocessError):\n        raise SystemExit(\"source preview staging verification rejected\") from None\n\nVERIFIER\nPREVIEW_GH=\"$(mise which gh --tool=gh@2.103.3)\"\nexport PREVIEW_GH\nset -eu\nenv -i PATH=/usr/bin:/bin HOME=\"$HOME\" GH_TOKEN=\"$GH_TOKEN\" GITHUB_SHA=\"$GITHUB_SHA\" GITHUB_REPOSITORY=\"$GITHUB_REPOSITORY\" GITHUB_EVENT_NAME=\"$GITHUB_EVENT_NAME\" GITHUB_REF=\"$GITHUB_REF\" GITHUB_WORKFLOW_REF=\"$GITHUB_WORKFLOW_REF\" GITHUB_WORKFLOW_SHA=\"$GITHUB_WORKFLOW_SHA\" GITHUB_RUN_ID=\"$GITHUB_RUN_ID\" GITHUB_RUN_ATTEMPT=\"$GITHUB_RUN_ATTEMPT\" RUNNER_TEMP=\"$RUNNER_TEMP\" GITHUB_OUTPUT=\"$GITHUB_OUTPUT\" SOURCE_ARTIFACT_ID=\"$SOURCE_ARTIFACT_ID\" PAYLOAD_ARTIFACT_ID=\"$PAYLOAD_ARTIFACT_ID\" AUTHORITY_REPOSITORY=\"$AUTHORITY_REPOSITORY\" AUTHORITY_PATH=\"$AUTHORITY_PATH\" AUTHORITY_REF=\"$AUTHORITY_REF\" AUTHORITY_SHA=\"$AUTHORITY_SHA\" SIGN=\"${SIGN:-}\" PAIR_ORIGIN=\"${PAIR_ORIGIN:-}\" PAIR_ID=\"${PAIR_ID:-}\" RECEIPT_SHA256=\"${RECEIPT_SHA256:-}\" BUNDLE_SHA256=\"${BUNDLE_SHA256:-}\" PREVIEW_GH=\"${PREVIEW_GH:-}\" PREVIEW_MODE='draft' /usr/bin/python3 -I -S - <<'PY'\nimport os, sys\nsys.path.insert(0, os.path.join(os.environ['RUNNER_TEMP'], 'source-preview-support'))\n# SPDX-FileCopyrightText: 2026 Alexey Zhokhov\n# SPDX-License-Identifier: Apache-2.0\n\ndef preview_authority():\n    repository = os.environ[\"AUTHORITY_REPOSITORY\"]\n    path = os.environ[\"AUTHORITY_PATH\"]\n    ref = os.environ[\"AUTHORITY_REF\"]\n    sha = os.environ[\"AUTHORITY_SHA\"]\n    if (repository != \"tailrocks/velnor-new\" or path != \".github/workflows/source-preview-publication.yml\"\n            or re.fullmatch(\"[0-9a-f]{40}\", sha) is None\n            or ref != repository + \"/\" + path + \"@\" + sha):\n        raise ValueError(\"source preview workflow authority\")\n    return {\"repository\": repository, \"path\": path, \"ref\": ref, \"sha\": sha}\n\n# SPDX-FileCopyrightText: 2026 Alexey Zhokhov\n# SPDX-License-Identifier: Apache-2.0\n\nimport hashlib\nimport http.client\nimport io\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport signal\nimport ssl\nimport stat\nimport sys\nimport time\nfrom urllib.parse import urlsplit\nimport zipfile\n\nREPOSITORY = \"tailrocks/velnor-new\"\nWORKFLOW = \".github/workflows/product-release-generator.yml\"\nPAYLOAD = \"velnor-actions-x86_64-unknown-linux-gnu\"\nRECEIPT = \"SDK_PREVIEW_RECEIPT.json\"\nBUNDLE = RECEIPT + \".sigstore.jsonl\"\nMAX_PAYLOAD = 268435456\nMAX_JSON = 2097152\n\n\n\ndef require(condition):\n    if not condition:\n        raise ValueError(\"preview publication rejected\")\n\n\ndef unique(pairs):\n    result = {}\n    for key, value in pairs:\n        require(key not in result)\n        result[key] = value\n    return result\n\n\ndef canonical(value):\n    return json.dumps(value, sort_keys=True, separators=(\",\", \":\"), ensure_ascii=False).encode()\n\n\ndef read_file(directory, name, limit):\n    directory = Path(directory)\n    require(not directory.is_symlink() and directory.is_dir())\n    require({item.name for item in directory.iterdir()} == {name})\n    descriptor = os.open(directory / name, os.O_RDONLY | os.O_NOFOLLOW)\n    try:\n        info = os.fstat(descriptor)\n        require(stat.S_ISREG(info.st_mode) and 0 < info.st_size <= limit)\n        data = bytearray()\n        while len(data) <= limit:\n            chunk = os.read(descriptor, min(65536, limit + 1 - len(data)))\n            if not chunk:\n                break\n            data.extend(chunk)\n        after = os.fstat(descriptor)\n        require(len(data) == info.st_size and (info.st_dev, info.st_ino, info.st_size, info.st_mtime_ns) == (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns))\n        return bytes(data)\n    finally:\n        os.close(descriptor)\n\n\ndef read_pair(directory):\n    root = Path(directory)\n    require(not root.is_symlink() and root.is_dir() and {entry.name for entry in root.iterdir()} == {RECEIPT, BUNDLE})\n    result = []\n    for name, limit in ((RECEIPT, 65536), (BUNDLE, MAX_JSON)):\n        descriptor = os.open(root / name, os.O_RDONLY | os.O_NOFOLLOW)\n        try:\n            info = os.fstat(descriptor)\n            require(stat.S_ISREG(info.st_mode) and 0 < info.st_size <= limit)\n            with os.fdopen(descriptor, \"rb\", closefd=False) as file:\n                data = file.read(limit + 1)\n            after = os.fstat(descriptor)\n            require(len(data) == info.st_size and (info.st_dev, info.st_ino, info.st_size, info.st_mtime_ns) == (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns))\n            result.append(data)\n        finally:\n            os.close(descriptor)\n    return result\n\n\ndef parse(data):\n    return json.loads(data, object_pairs_hook=unique)\n\n\ndef digest(data):\n    return hashlib.sha256(data).hexdigest()\n\n\ndef positive(value):\n    require(type(value) is int and 0 < value <= 9007199254740991)\n    return value\n\n\ndef candidate_marker(source, candidate):\n    require(set(candidate) == {\"source_artifact_id\", \"payload_artifact_id\"})\n    for value in candidate.values():\n        positive(value)\n    marker = {\"schema\": 2, \"source_sha\": source[\"source_sha\"],\n              \"run_id\": positive(source[\"source\"][\"run_id\"]),\n              \"producer\": source[\"producer\"], \"candidate\": candidate}\n    return \"velnor-source-preview:\" + canonical(marker).decode()\n\n\ndef finalize_receipt(decision, attempt):\n    require(set(decision) == {\"source\", \"candidate\", \"release_id\", \"payload\", \"draft\"})\n    source = decision[\"source\"]\n    draft = decision[\"draft\"]\n    signer = dict(draft, run_attempt=positive(attempt))\n    require(source[\"source\"][\"run_id\"] == draft[\"run_id\"])\n    require(all(source[\"source\"][key] == draft[key] for key in (\"workflow_path\", \"workflow_ref\", \"workflow_sha\")))\n    require(source[\"source\"][\"run_attempt\"] <= draft[\"run_attempt\"] <= signer[\"run_attempt\"])\n    candidate_marker(source, decision[\"candidate\"])\n    return canonical(dict(source, candidate=decision[\"candidate\"], release_id=positive(decision[\"release_id\"]),\n                          payload=decision[\"payload\"], draft=draft, signer=signer))\n\n\ndef select_pair(item, pairs, payload):\n    assets = item.get(\"assets\")\n    require(isinstance(assets, list) and len(assets) <= 3)\n    names = [asset.get(\"name\") for asset in assets]\n    require(len(names) == len(set(names)) and all(name in (RECEIPT, BUNDLE, PAYLOAD) for name in names))\n    require(all(asset.get(\"state\") == \"uploaded\" for asset in assets))\n    compatible = []\n    for pair in pairs:\n        expected = {RECEIPT: pair[\"receipt\"], BUNDLE: pair[\"bundle\"], PAYLOAD: payload}\n        if all(asset.get(\"size\") == len(expected[asset[\"name\"]])\n               and asset.get(\"digest\") == \"sha256:\" + digest(expected[asset[\"name\"]]) for asset in assets):\n            compatible.append(pair)\n    if compatible:\n        first = min(pair[\"signer_attempt\"] for pair in compatible)\n        matches = [pair for pair in compatible if pair[\"signer_attempt\"] == first]\n        require(len(matches) == 1)\n        if item.get(\"draft\") is False:\n            require(item.get(\"immutable\") is True and set(names) == {RECEIPT, BUNDLE, PAYLOAD})\n        else:\n            require(item.get(\"draft\") is True)\n        return matches[0]\n    require(item.get(\"draft\") is True and not assets and not pairs)\n    return None\n\n\ndef artifact_files(client, artifact, expected):\n    identity = positive(artifact.get(\"id\"))\n    size = positive(artifact.get(\"size_in_bytes\"))\n    limit = 257 * 1024 * 1024\n    require(size <= limit and isinstance(artifact.get(\"digest\"), str)\n            and re.fullmatch(\"sha256:[0-9a-f]{64}\", artifact[\"digest\"]))\n    host = \"api.github.com\"\n    path = \"/repos/\" + REPOSITORY + \"/actions/artifacts/\" + str(identity) + \"/zip\"\n    authorized = True\n    for _ in range(4):\n        remaining = client.deadline - time.monotonic()\n        require(remaining > 0)\n        connection = http.client.HTTPSConnection(host, timeout=min(30, remaining), context=ssl.create_default_context())\n        try:\n            headers = {\"Accept\": \"application/vnd.github+json\", \"User-Agent\": \"velnor-source-preview\"}\n            if authorized:\n                headers[\"Authorization\"] = \"Bearer \" + client.token\n            connection.request(\"GET\", path, headers=headers)\n            response = connection.getresponse()\n            if response.status in (301, 302, 303, 307, 308):\n                redirect = urlsplit(response.getheader(\"Location\", \"\"))\n                require(redirect.scheme == \"https\" and redirect.hostname is not None\n                        and re.fullmatch(r\"productionresultssa[0-9]+\\.blob\\.core\\.windows\\.net\", redirect.hostname)\n                        and redirect.username is None and redirect.password is None\n                        and redirect.port in (None, 443) and not redirect.fragment)\n                host = redirect.hostname\n                path = redirect.path + (\"?\" + redirect.query if redirect.query else \"\")\n                authorized = False\n                continue\n            require(response.status == 200 and not authorized)\n            body = bytearray()\n            while len(body) <= limit:\n                require(time.monotonic() < client.deadline)\n                if connection.sock is not None:\n                    connection.sock.settimeout(min(30, client.deadline - time.monotonic()))\n                chunk = response.read(min(65536, limit + 1 - len(body)))\n                if not chunk:\n                    break\n                body.extend(chunk)\n            require(len(body) == size and \"sha256:\" + digest(body) == artifact[\"digest\"])\n            break\n        finally:\n            connection.close()\n    else:\n        raise ValueError(\"preview artifact redirect limit\")\n    with zipfile.ZipFile(io.BytesIO(body)) as archive:\n        entries = archive.infolist()\n        require(len(entries) == len(expected) and {entry.filename for entry in entries} == set(expected))\n        result = {}\n        for entry in entries:\n            require(not entry.flag_bits & 1 and stat.S_ISREG(entry.external_attr >> 16)\n                    and entry.compress_type in (zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED)\n                    and 0 < entry.file_size <= expected[entry.filename])\n            data = archive.read(entry)\n            require(len(data) == entry.file_size)\n            result[entry.filename] = data\n        return result\n\n\ndef inventory(client, path, key, maximum_pages):\n    result = []\n    total = None\n    for page in range(1, maximum_pages + 1):\n        response = client.api(\"GET\", path + \"?per_page=100&page=\" + str(page))\n        count = response.get(\"total_count\")\n        values = response.get(key)\n        require(type(count) is int and 0 <= count <= maximum_pages * 100 and isinstance(values, list))\n        if total is None:\n            total = count\n        require(count == total and len(values) <= 100)\n        result.extend(values)\n        require(len(result) <= total)\n        if len(result) == total:\n            break\n        require(len(values) == 100)\n    require(len(result) == total)\n    ids = [positive(value.get(\"id\")) for value in result]\n    require(len(ids) == len(set(ids)))\n    return result\n\n\ndef successful_job(client, source, run_id, attempt, name, allow_failed=False):\n    require(positive(attempt) <= 51)\n    path = \"/actions/runs/\" + str(positive(run_id)) + \"/attempts/\" + str(attempt)\n    run = client.api(\"GET\", path)\n    require(run.get(\"id\") == run_id and run.get(\"run_attempt\") == attempt\n            and run.get(\"head_sha\") == source and run.get(\"head_branch\") == \"sdk-preview-\" + source\n            and run.get(\"event\") == \"push\" and run.get(\"path\", \"\").split(\"@\", 1)[0] == WORKFLOW\n            and run.get(\"head_repository\", {}).get(\"full_name\") == REPOSITORY)\n    jobs = inventory(client, path + \"/jobs\", \"jobs\", 10)\n    require(all(job.get(\"run_id\") == run_id and job.get(\"head_sha\") == source for job in jobs))\n    matches = [job for job in jobs if job.get(\"name\") == name]\n    require(len(matches) == 1 and matches[0].get(\"status\") == \"completed\")\n    if allow_failed and matches[0].get(\"conclusion\") != \"success\":\n        return None\n    require(matches[0].get(\"conclusion\") == \"success\")\n    return matches[0][\"id\"]\n\n\ndef find_release(client, tag):\n    releases = []\n    for page in range(1, 21):\n        values = client.api(\"GET\", \"/releases?per_page=100&page=\" + str(page))\n        require(isinstance(values, list) and len(values) <= 100)\n        releases.extend(values)\n        if len(values) < 100:\n            break\n    else:\n        raise ValueError(\"preview release inventory limit\")\n    ids = [positive(item.get(\"id\")) for item in releases]\n    require(len(ids) == len(set(ids)))\n    matches = [item for item in releases if item.get(\"tag_name\") == tag]\n    require(len(matches) <= 1)\n    return matches[0] if matches else None\n\n\ndef load_candidate(client, current, marker):\n    require(set(marker) == {\"schema\", \"source_sha\", \"run_id\", \"producer\", \"candidate\"}\n            and type(marker[\"schema\"]) is int and marker[\"schema\"] == 2\n            and marker[\"source_sha\"] == current[\"source_sha\"]\n            and marker[\"run_id\"] == current[\"source\"][\"run_id\"] and marker[\"producer\"] == current[\"producer\"])\n    candidate = marker[\"candidate\"]\n    require(set(candidate) == {\"source_artifact_id\", \"payload_artifact_id\"})\n    items = []\n    for key in (\"source_artifact_id\", \"payload_artifact_id\"):\n        identity = positive(candidate[key])\n        artifact = client.api(\"GET\", \"/actions/artifacts/\" + str(identity))\n        require(artifact.get(\"id\") == identity and artifact.get(\"expired\") is False\n                and artifact.get(\"workflow_run\", {}).get(\"id\") == marker[\"run_id\"]\n                and artifact.get(\"workflow_run\", {}).get(\"head_sha\") == current[\"source_sha\"])\n        items.append(artifact)\n    raw = artifact_files(client, items[0], {\"source-preview-metadata.json\": 65536})[\"source-preview-metadata.json\"]\n    original = metadata(raw)\n    attempt = original[\"source\"][\"run_attempt\"]\n    require(items[0].get(\"name\") == \"source-preview-source-\" + str(attempt)\n            and items[1].get(\"name\") == \"source-preview-qualified-payload-\" + str(attempt)\n            and original[\"producer\"] == marker[\"producer\"] and original[\"version\"] == current[\"version\"])\n    successful_job(client, current[\"source_sha\"], marker[\"run_id\"], attempt, \"Source preview publication / Admit source preview\")\n    payload = artifact_files(client, items[1], {PAYLOAD: MAX_PAYLOAD})[PAYLOAD]\n    require(len(payload) >= 20 and payload[:7] == b\"\\x7fELF\\x02\\x01\\x01\" and payload[18:20] == b\"\\x3e\\x00\")\n    return original, candidate, payload\n\n\ndef verify_pair(client, source, candidate, release_id, payload, receipt_bytes, bundle):\n    receipt = parse(receipt_bytes)\n    require(canonical(receipt) == receipt_bytes and set(receipt) == set(source) | {\"release_id\", \"candidate\", \"payload\", \"draft\", \"signer\"})\n    require(all(receipt[key] == value for key, value in source.items()))\n    require(receipt[\"candidate\"] == candidate and receipt[\"release_id\"] == release_id)\n    require(receipt[\"payload\"] == {\"target\": \"x86_64-unknown-linux-gnu\", \"name\": PAYLOAD, \"size\": len(payload), \"sha256\": digest(payload)})\n    origin = source[\"source\"]\n    for role in (\"draft\", \"signer\"):\n        run = receipt[role]\n        require(set(run) == set(origin) and all(run[key] == origin[key] for key in (\"workflow_path\", \"workflow_ref\", \"workflow_sha\", \"run_id\")))\n        positive(run[\"run_attempt\"])\n    require(origin[\"run_attempt\"] <= receipt[\"draft\"][\"run_attempt\"] <= receipt[\"signer\"][\"run_attempt\"] <= positive(int(os.environ[\"GITHUB_RUN_ATTEMPT\"])) <= 51)\n    for role, name in ((\"source\", \"Source preview publication / Admit source preview\"), (\"draft\", \"Source preview publication / Draft source preview\"), (\"signer\", \"Source preview publication / Attest source preview\")):\n        successful_job(client, source[\"source_sha\"], origin[\"run_id\"], receipt[role][\"run_attempt\"], name)\n    import source_preview_stage_verify as verifier\n    preview = {\"source_sha\": source[\"source_sha\"], \"signer_workflow_path\": WORKFLOW,\n               \"signer_run_id\": origin[\"run_id\"], \"signer_run_attempt\": receipt[\"signer\"][\"run_attempt\"],\n               \"receipt_sha256\": digest(receipt_bytes), \"payload_name\": PAYLOAD, \"payload_sha256\": digest(payload)}\n    verifier.verify_attestation(os.environ[\"PREVIEW_GH\"], receipt_bytes, bundle, preview, os.environ[\"RUNNER_TEMP\"], preview_authority())\n    return {\"receipt\": receipt_bytes, \"bundle\": bundle, \"signer_attempt\": receipt[\"signer\"][\"run_attempt\"]}\n\n\ndef prepare_pair(client, source, decision, payload):\n    require(set(decision) == {\"source\", \"candidate\", \"release_id\", \"payload\", \"draft\"} and decision[\"source\"] == source)\n    candidate = decision[\"candidate\"]\n    candidate_marker(source, candidate)\n    require(decision[\"payload\"] == {\"target\": \"x86_64-unknown-linux-gnu\", \"name\": PAYLOAD, \"size\": len(payload), \"sha256\": digest(payload)})\n    release_id = positive(decision[\"release_id\"])\n    item = client.api(\"GET\", \"/releases/\" + str(release_id))\n    require(item.get(\"id\") == release_id and item.get(\"tag_name\") == source[\"tag\"]\n            and item.get(\"body\") == candidate_marker(source, candidate) and item.get(\"prerelease\") is True\n            and type(item.get(\"draft\")) is bool)\n    pairs = []\n    if item[\"draft\"] is False:\n        receipt_bytes, bundle = released_pair(item, source)\n        pair = verify_pair(client, source, candidate, release_id, payload, receipt_bytes, bundle)\n        pair[\"origin\"] = \"release\"\n        pairs.append(pair)\n    else:\n        run_id = source[\"source\"][\"run_id\"]\n        artifacts = inventory(client, \"/actions/runs/\" + str(run_id) + \"/artifacts\", \"artifacts\", 20)\n        signed_names = [artifact.get(\"name\") for artifact in artifacts if re.fullmatch(r\"source-preview-signed-[1-9][0-9]*\", artifact.get(\"name\", \"\"))]\n        require(len(signed_names) == len(set(signed_names)))\n        for artifact in artifacts:\n            match = re.fullmatch(r\"source-preview-signed-([1-9][0-9]*)\", artifact.get(\"name\", \"\"))\n            if match is None:\n                continue\n            attempt = positive(int(match.group(1)))\n            require(attempt <= 51 and attempt <= positive(int(os.environ[\"GITHUB_RUN_ATTEMPT\"])))\n            require(artifact.get(\"workflow_run\", {}).get(\"id\") == run_id and artifact.get(\"workflow_run\", {}).get(\"head_sha\") == source[\"source_sha\"])\n            if artifact.get(\"expired\") is True:\n                continue\n            require(artifact.get(\"expired\") is False)\n            if successful_job(client, source[\"source_sha\"], run_id, attempt, \"Source preview publication / Attest source preview\", True) is None:\n                continue\n            files = artifact_files(client, artifact, {RECEIPT: 65536, BUNDLE: MAX_JSON})\n            parsed = parse(files[RECEIPT])\n            require(isinstance(parsed, dict) and canonical(parsed) == files[RECEIPT])\n            if parsed.get(\"candidate\") != candidate:\n                continue\n            pair = verify_pair(client, source, candidate, release_id, payload, files[RECEIPT], files[BUNDLE])\n            require(pair[\"signer_attempt\"] == attempt)\n            pair.update({\"origin\": \"artifact\", \"artifact_id\": artifact[\"id\"]})\n            pairs.append(pair)\n    selected = select_pair(item, pairs, payload)\n    if selected is None:\n        successful_job(client, source[\"source_sha\"], source[\"source\"][\"run_id\"], source[\"source\"][\"run_attempt\"], \"Source preview publication / Admit source preview\")\n        return {\"sign\": True}\n    return dict(selected, sign=False)\n\n\ndef released_pair(item, source):\n    import source_preview_bootstrap as bootstrap\n    require(item.get(\"draft\") is False and item.get(\"immutable\") is True)\n    entries = item.get(\"assets\")\n    require(isinstance(entries, list) and len(entries) == 3\n            and {entry.get(\"name\") for entry in entries} == {RECEIPT, BUNDLE, PAYLOAD})\n    prefix = \"https://github.com/\" + REPOSITORY + \"/releases/download/\" + source[\"tag\"] + \"/\"\n    transport = bootstrap.GitHubTransport(\"\")\n    result = []\n    for name, limit in ((RECEIPT, 65536), (BUNDLE, MAX_JSON)):\n        size, sha = bootstrap.asset_metadata(item, name, limit, prefix + name)\n        result.append(bootstrap.checked_asset(transport, prefix + name, size, sha, limit))\n    return result\n\n\ndef metadata(data):\n    value = parse(data)\n    source = os.environ[\"GITHUB_SHA\"]\n    tag = \"sdk-preview-\" + source\n    tag_ref = \"refs/tags/\" + tag\n    require(canonical(value) == data and re.fullmatch(\"[0-9a-f]{40}\", source))\n    require(os.environ.get(\"GITHUB_REPOSITORY\") == REPOSITORY and os.environ.get(\"GITHUB_EVENT_NAME\") == \"push\"\n            and os.environ.get(\"GITHUB_REF\") == tag_ref and os.environ.get(\"GITHUB_WORKFLOW_REF\") == REPOSITORY + \"/\" + WORKFLOW + \"@\" + tag_ref\n            and os.environ.get(\"GITHUB_WORKFLOW_SHA\") == source)\n    require(set(value) == {\"schema\", \"repository\", \"version\", \"source_sha\", \"tag\", \"source\", \"ci\", \"qualification\", \"producer\"})\n    require(type(value[\"schema\"]) is int and value[\"schema\"] == 2 and value[\"repository\"] == REPOSITORY\n            and value[\"source_sha\"] == source and value[\"tag\"] == tag\n            and isinstance(value[\"version\"], str) and re.fullmatch(r\"[0-9]+\\.[0-9]+\\.[0-9]+\", value[\"version\"]))\n    for key, path in ((\"source\", WORKFLOW), (\"ci\", \".github/workflows/ci.yml\"), (\"qualification\", \".github/workflows/source-qualification.yml\")):\n        run = value[key]\n        require(set(run) == {\"workflow_path\", \"workflow_ref\", \"workflow_sha\", \"run_id\", \"run_attempt\"})\n        ref = tag_ref if key == \"source\" else \"refs/heads/main\"\n        require(run[\"workflow_path\"] == path and run[\"workflow_ref\"] == REPOSITORY + \"/\" + path + \"@\" + ref\n                and run[\"workflow_sha\"] == source)\n        positive(run[\"run_id\"]); positive(run[\"run_attempt\"])\n    require(value[\"source\"][\"run_id\"] == positive(int(os.environ[\"GITHUB_RUN_ID\"]))\n            and value[\"source\"][\"run_attempt\"] <= positive(int(os.environ[\"GITHUB_RUN_ATTEMPT\"])) <= 51)\n    producer = value[\"producer\"]\n    require(set(producer) == {\"producer_run_id\", \"producer_run_attempt\", \"payload_artifact_id\", \"payload_archive_sha256\"})\n    for key in (\"producer_run_id\", \"producer_run_attempt\", \"payload_artifact_id\"):\n        positive(producer[key])\n    require(isinstance(producer[\"payload_archive_sha256\"], str)\n            and re.fullmatch(\"[0-9a-f]{64}\", producer[\"payload_archive_sha256\"]))\n    return value\n\n\nclass GitHub:\n    def __init__(self):\n        self.token = os.environ[\"GH_TOKEN\"]\n        self.deadline = time.monotonic() + 180\n\n    def request(self, method, host, path, data=None, content_type=\"application/json\", allowed=(200,)):\n        require(host in (\"api.github.com\", \"uploads.github.com\") and path.startswith(\"/repos/\" + REPOSITORY + \"/\"))\n        remaining = self.deadline - time.monotonic()\n        require(remaining > 0)\n        connection = http.client.HTTPSConnection(host, timeout=min(30, remaining), context=ssl.create_default_context())\n        try:\n            headers = {\"Accept\": \"application/vnd.github+json\", \"Authorization\": \"Bearer \" + self.token, \"User-Agent\": \"velnor-source-preview\", \"X-GitHub-Api-Version\": \"2022-11-28\"}\n            if data is not None:\n                headers[\"Content-Type\"] = content_type\n                headers[\"Content-Length\"] = str(len(data))\n            connection.request(method, path, body=data, headers=headers)\n            response = connection.getresponse()\n            require(response.status in allowed)\n            if response.status == 404:\n                return None\n            body = response.read(MAX_JSON + 1)\n            require(len(body) <= MAX_JSON and time.monotonic() < self.deadline)\n            return parse(body)\n        finally:\n            connection.close()\n\n    def api(self, method, suffix, data=None, allowed=(200,)):\n        return self.request(method, \"api.github.com\", \"/repos/\" + REPOSITORY + suffix, data, allowed=allowed)\n\n\n\ndef release(client, receipt, require_draft=True):\n    item = client.api(\"GET\", \"/releases/\" + str(positive(receipt[\"release_id\"])))\n    marker = candidate_marker(receipt, receipt[\"candidate\"])\n    require(item.get(\"id\") == receipt[\"release_id\"] and item.get(\"tag_name\") == receipt[\"tag\"] and item.get(\"body\") == marker and item.get(\"prerelease\") is True)\n    require(item.get(\"draft\") is require_draft)\n    return item\n\n\ndef existing_assets(item, expected, allow_unknown_bundle=False):\n    assets = item.get(\"assets\")\n    require(isinstance(assets, list) and len(assets) <= 3)\n    result = set()\n    for asset in assets:\n        name = asset.get(\"name\")\n        require(name in (RECEIPT, BUNDLE, PAYLOAD) and name not in result and asset.get(\"state\") == \"uploaded\")\n        if name in expected:\n            data = expected[name]\n            require(asset.get(\"size\") == len(data) and asset.get(\"digest\") == \"sha256:\" + digest(data))\n        else:\n            require(name == BUNDLE and allow_unknown_bundle)\n        result.add(name)\n    return result\n\n\ndef verify_tag(client, source):\n    tag = \"sdk-preview-\" + source\n    reference = client.api(\"GET\", \"/git/ref/tags/\" + tag)\n    obj = reference.get(\"object\", {})\n    oid = obj.get(\"sha\")\n    require(obj.get(\"type\") == \"tag\" and isinstance(oid, str) and re.fullmatch(\"[0-9a-f]{40}\", oid))\n    annotated = client.api(\"GET\", \"/git/tags/\" + oid)\n    require(annotated.get(\"tag\") == tag and annotated.get(\"object\", {}).get(\"type\") == \"commit\" and annotated.get(\"object\", {}).get(\"sha\") == source)\n    main = client.api(\"GET\", \"/git/ref/heads/main\").get(\"object\", {})\n    require(main.get(\"type\") == \"commit\" and isinstance(main.get(\"sha\"), str) and re.fullmatch(\"[0-9a-f]{40}\", main[\"sha\"]))\n    comparison = client.api(\"GET\", \"/compare/\" + source + \"...\" + main[\"sha\"])\n    require(comparison.get(\"status\") in (\"ahead\", \"identical\") and comparison.get(\"merge_base_commit\", {}).get(\"sha\") == source)\n\n\ndef publish_verified(client, source, receipt, receipt_bytes, bundle, payload):\n    expected = {RECEIPT: receipt_bytes, BUNDLE: bundle, PAYLOAD: payload}\n    state = client.api(\"GET\", \"/releases/\" + str(positive(receipt[\"release_id\"])))\n    if state.get(\"draft\") is False:\n        published = release(client, receipt, False)\n        require(published.get(\"immutable\") is True and existing_assets(published, expected) == set(expected))\n        return\n    present = existing_assets(release(client, receipt), expected)\n    for name, data in expected.items():\n        if name in present:\n            continue\n        item = client.request(\"POST\", \"uploads.github.com\", \"/repos/\" + REPOSITORY + \"/releases/\" + str(receipt[\"release_id\"]) + \"/assets?name=\" + name, data, \"application/octet-stream\", (201,))\n        require(item.get(\"name\") == name and item.get(\"size\") == len(data) and item.get(\"digest\") == \"sha256:\" + digest(data) and item.get(\"state\") == \"uploaded\")\n    item = release(client, receipt)\n    require(existing_assets(item, expected) == set(expected))\n    verify_tag(client, source[\"source_sha\"])\n    client.api(\"PATCH\", \"/releases/\" + str(receipt[\"release_id\"]), canonical({\"draft\": False}), allowed=(200,))\n    published = release(client, receipt, False)\n    require(published.get(\"immutable\") is True and existing_assets(published, expected) == set(expected))\n\n\ndef main():\n    preview_authority()\n    signal.signal(signal.SIGALRM, lambda *_: (_ for _ in ()).throw(TimeoutError(\"preview publication deadline\")))\n    signal.setitimer(signal.ITIMER_REAL, 180)\n    source = metadata(read_file(\"source-preview-metadata\", \"source-preview-metadata.json\", 65536))\n    payload = read_file(\"source-preview-payload\", PAYLOAD, MAX_PAYLOAD)\n    client = GitHub()\n    verify_tag(client, source[\"source_sha\"])\n    mode = os.environ[\"PREVIEW_MODE\"]\n    if mode == \"draft\":\n        successful_job(client, source[\"source_sha\"], source[\"source\"][\"run_id\"], source[\"source\"][\"run_attempt\"], \"Source preview publication / Admit source preview\")\n        candidate = {\"source_artifact_id\": positive(int(os.environ[\"SOURCE_ARTIFACT_ID\"])), \"payload_artifact_id\": positive(int(os.environ[\"PAYLOAD_ARTIFACT_ID\"]))}\n        item = find_release(client, source[\"tag\"])\n        if item is None:\n            marker = candidate_marker(source, candidate)\n            body = canonical({\"tag_name\": source[\"tag\"], \"target_commitish\": source[\"source_sha\"], \"name\": source[\"tag\"], \"body\": marker, \"draft\": True, \"prerelease\": True})\n            item = client.api(\"POST\", \"/releases\", body, allowed=(201,))\n        else:\n            body = item.get(\"body\")\n            prefix = \"velnor-source-preview:\"\n            require(isinstance(body, str) and body.startswith(prefix))\n            encoded = body[len(prefix):].encode()\n            original_marker = parse(encoded)\n            require(canonical(original_marker) == encoded)\n            source, candidate, payload = load_candidate(client, source, original_marker)\n            marker = candidate_marker(source, candidate)\n            require(body == marker)\n            verify_tag(client, source[\"source_sha\"])\n        decision = {\"source\": source, \"candidate\": candidate, \"release_id\": positive(item.get(\"id\")), \"payload\": {\"target\": \"x86_64-unknown-linux-gnu\", \"name\": PAYLOAD, \"size\": len(payload), \"sha256\": digest(payload)}, \"draft\": dict(source[\"source\"], run_attempt=positive(int(os.environ[\"GITHUB_RUN_ATTEMPT\"]))) }\n        current = client.api(\"GET\", \"/releases/\" + str(decision[\"release_id\"]))\n        require(current.get(\"id\") == decision[\"release_id\"] and current.get(\"tag_name\") == source[\"tag\"] and current.get(\"body\") == marker and current.get(\"prerelease\") is True and type(current.get(\"draft\")) is bool)\n        require(current.get(\"draft\") is True or current.get(\"immutable\") is True)\n        assets = current.get(\"assets\")\n        require(isinstance(assets, list) and len(assets) <= 3)\n        names = [asset.get(\"name\") for asset in assets]\n        require(len(names) == len(set(names)) and all(name in (RECEIPT, BUNDLE, PAYLOAD) for name in names))\n        for asset in assets:\n            require(asset.get(\"state\") == \"uploaded\")\n            if asset[\"name\"] == PAYLOAD:\n                require(asset.get(\"size\") == len(payload) and asset.get(\"digest\") == \"sha256:\" + digest(payload))\n        destination = Path(os.environ[\"RUNNER_TEMP\"]) / \"source-preview-decision.json\"\n        with destination.open(\"xb\") as output:\n            output.write(canonical(decision))\n        selected = prepare_pair(client, source, decision, payload)\n        verify_tag(client, source[\"source_sha\"])\n        with open(os.environ[\"GITHUB_OUTPUT\"], \"a\", encoding=\"utf-8\") as output:\n            output.write(\"source_artifact_id=\" + str(candidate[\"source_artifact_id\"]) + \"\\npayload_artifact_id=\" + str(candidate[\"payload_artifact_id\"]) + \"\\n\")\n            output.write(\"sign=\" + str(selected[\"sign\"]).lower() + \"\\n\")\n            if not selected[\"sign\"]:\n                output.write(\"pair_origin=\" + selected[\"origin\"] + \"\\n\")\n                output.write(\"pair_id=\" + str(selected.get(\"artifact_id\", decision[\"release_id\"])) + \"\\n\")\n                output.write(\"receipt_sha256=\" + digest(selected[\"receipt\"]) + \"\\nbundle_sha256=\" + digest(selected[\"bundle\"]) + \"\\n\")\n        return\n    if mode == \"prepare\":\n        decision_bytes = read_file(\"source-preview-decision\", \"source-preview-decision.json\", 65536)\n        decision = parse(decision_bytes)\n        require(canonical(decision) == decision_bytes)\n        require(set(decision) == {\"source\", \"candidate\", \"release_id\", \"payload\", \"draft\"} and decision[\"source\"] == source)\n        require(set(decision[\"draft\"]) == set(source[\"source\"])\n                and all(decision[\"draft\"][key] == source[\"source\"][key] for key in (\"workflow_path\", \"workflow_ref\", \"workflow_sha\", \"run_id\"))\n                and source[\"source\"][\"run_attempt\"] <= positive(decision[\"draft\"][\"run_attempt\"]) <= positive(int(os.environ[\"GITHUB_RUN_ATTEMPT\"])) <= 51)\n        require(decision[\"payload\"] == {\"target\": \"x86_64-unknown-linux-gnu\", \"name\": PAYLOAD, \"size\": len(payload), \"sha256\": digest(payload)})\n        candidate = {\"source_artifact_id\": positive(int(os.environ[\"SOURCE_ARTIFACT_ID\"])), \"payload_artifact_id\": positive(int(os.environ[\"PAYLOAD_ARTIFACT_ID\"]))}\n        require(decision[\"candidate\"] == candidate)\n        successful_job(client, source[\"source_sha\"], source[\"source\"][\"run_id\"], source[\"source\"][\"run_attempt\"], \"Source preview publication / Admit source preview\")\n        successful_job(client, source[\"source_sha\"], source[\"source\"][\"run_id\"], decision[\"draft\"][\"run_attempt\"], \"Source preview publication / Draft source preview\")\n        if os.environ[\"SIGN\"] == \"true\":\n            selected = {\"sign\": True, \"receipt\": finalize_receipt(decision, positive(int(os.environ[\"GITHUB_RUN_ATTEMPT\"])))}\n        else:\n            require(os.environ[\"SIGN\"] == \"false\")\n            if os.environ[\"PAIR_ORIGIN\"] == \"artifact\":\n                receipt_bytes, bundle = read_pair(\"source-preview-signed\")\n            else:\n                require(os.environ[\"PAIR_ORIGIN\"] == \"release\")\n                item = client.api(\"GET\", \"/releases/\" + str(positive(int(os.environ[\"PAIR_ID\"]))))\n                receipt_bytes, bundle = released_pair(item, source)\n            require(digest(receipt_bytes) == os.environ[\"RECEIPT_SHA256\"] and digest(bundle) == os.environ[\"BUNDLE_SHA256\"])\n            selected = verify_pair(client, source, candidate, decision[\"release_id\"], payload, receipt_bytes, bundle)\n            selected.update({\"sign\": False, \"origin\": os.environ[\"PAIR_ORIGIN\"], \"artifact_id\": positive(int(os.environ[\"PAIR_ID\"]))})\n        verify_tag(client, source[\"source_sha\"])\n        with (Path(os.environ[\"RUNNER_TEMP\"]) / RECEIPT).open(\"xb\") as output:\n            output.write(selected[\"receipt\"])\n        if not selected[\"sign\"]:\n            with (Path(os.environ[\"RUNNER_TEMP\"]) / BUNDLE).open(\"xb\") as output:\n                output.write(selected[\"bundle\"])\n        with open(os.environ[\"GITHUB_OUTPUT\"], \"a\", encoding=\"utf-8\") as output:\n            output.write(\"sign=\" + str(selected[\"sign\"]).lower() + \"\\n\")\n            if not selected[\"sign\"]:\n                output.write(\"pair_origin=\" + selected[\"origin\"] + \"\\n\")\n                output.write(\"pair_id=\" + str(selected.get(\"artifact_id\", decision[\"release_id\"])) + \"\\n\")\n                output.write(\"receipt_sha256=\" + digest(selected[\"receipt\"]) + \"\\nbundle_sha256=\" + digest(selected[\"bundle\"]) + \"\\n\")\n        return\n    require(mode == \"publish\")\n    if os.environ[\"PAIR_ORIGIN\"] == \"artifact\":\n        receipt_bytes, bundle = read_pair(\"source-preview-signed\")\n    else:\n        require(os.environ[\"PAIR_ORIGIN\"] == \"release\")\n        item = client.api(\"GET\", \"/releases/\" + str(positive(int(os.environ[\"PAIR_ID\"]))))\n        receipt_bytes, bundle = released_pair(item, source)\n    receipt = parse(receipt_bytes)\n    if os.environ[\"PAIR_ORIGIN\"] == \"release\":\n        require(digest(receipt_bytes) == os.environ[\"RECEIPT_SHA256\"] and digest(bundle) == os.environ[\"BUNDLE_SHA256\"])\n    candidate = {\"source_artifact_id\": positive(int(os.environ[\"SOURCE_ARTIFACT_ID\"])), \"payload_artifact_id\": positive(int(os.environ[\"PAYLOAD_ARTIFACT_ID\"]))}\n    verify_pair(client, source, candidate, positive(receipt[\"release_id\"]), payload, receipt_bytes, bundle)\n    publish_verified(client, source, receipt, receipt_bytes, bundle, payload)\n\n\nif __name__ == \"__main__\":\n    try:\n        main()\n    except (OSError, ValueError, KeyError, TypeError, TimeoutError, http.client.HTTPException, zipfile.BadZipFile):\n        print(\"source preview publication failed\", file=sys.stderr)\n        sys.exit(1)\n\nPY"
        id: draft
      - name: Retain draft decision
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: source-preview-decision-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-preview-decision.json
          retention-days: 1
  source-preview-attest:
    name: Attest source preview
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    needs:
      - source-preview-source
      - source-preview-draft
    if: ${{ github.event_name == 'push' && github.repository == 'tailrocks/velnor-new' && startsWith(github.ref, 'refs/tags/sdk-preview-') }}
    environment:
      name: generator-source-preview
    outputs:
      pair_origin: ${{ steps.prepare.outputs.pair_origin || 'artifact' }}
      pair_id: ${{ steps.prepare.outputs.pair_id || steps.upload.outputs.artifact-id }}
      receipt_sha256: ${{ steps.prepare.outputs.receipt_sha256 }}
      bundle_sha256: ${{ steps.prepare.outputs.bundle_sha256 }}
    steps:
      - name: Download admitted source metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.source-preview-draft.outputs.source_artifact_id }}
          path: source-preview-metadata
      - name: Download exact qualified payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.source-preview-draft.outputs.payload_artifact_id }}
          path: source-preview-payload
      - name: Download draft decision
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.source-preview-draft.outputs.artifact_id }}
          path: source-preview-decision
      - name: Download retained signed pair
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.source-preview-draft.outputs.pair_id }}
          path: source-preview-signed
        if: ${{ needs.source-preview-draft.outputs.sign == 'false' && needs.source-preview-draft.outputs.pair_origin == 'artifact' }}
      - name: Setup Mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
        with:
          version: 2026.11.1
          sha256: 7129dbab31d698f9028db9374f7ba7987232b0426f837dcbce437130a61415f9
          install: "false"
          env: "false"
          cache: "false"
          cache_save: "false"
      - name: Install pinned GitHub CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: "set -eu\n: \"${GITHUB_TOKEN:?missing workflow token}\"\nmise --no-config --no-env --no-hooks install gh@2.103.3"
      - name: Select or finalize signed candidate
        env:
          AUTHORITY_REPOSITORY: ${{ job.workflow_repository }}
          AUTHORITY_PATH: ${{ job.workflow_file_path }}
          AUTHORITY_REF: ${{ job.workflow_ref }}
          AUTHORITY_SHA: ${{ job.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARTIFACT_ID: ${{ needs.source-preview-draft.outputs.source_artifact_id }}
          PAYLOAD_ARTIFACT_ID: ${{ needs.source-preview-draft.outputs.payload_artifact_id }}
          SIGN: ${{ needs.source-preview-draft.outputs.sign }}
          PAIR_ORIGIN: ${{ needs.source-preview-draft.outputs.pair_origin }}
          PAIR_ID: ${{ needs.source-preview-draft.outputs.pair_id }}
          RECEIPT_SHA256: ${{ needs.source-preview-draft.outputs.receipt_sha256 }}
          BUNDLE_SHA256: ${{ needs.source-preview-draft.outputs.bundle_sha256 }}
        shell: bash
        run: "set -eu\nmkdir -m 700 \"$RUNNER_TEMP/source-preview-support\"\ncat > \"$RUNNER_TEMP/source-preview-support/source_preview_bootstrap.py\" <<'BOOTSTRAP'\n# SPDX-FileCopyrightText: 2026 Alexey Zhokhov\n# SPDX-License-Identifier: Apache-2.0\n\nimport base64\nimport ctypes\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport secrets\nimport stat\nimport subprocess\nimport sys\nimport time\nimport tomllib\nimport urllib.error\nimport urllib.parse\nimport urllib.request\n\nREPOSITORY = \"tailrocks/velnor-new\"\nREPOSITORY_ID = 1390620900\nAPI = \"api.github.com\"\nRELEASE_HOSTS = {\"github.com\", \"objects.githubusercontent.com\", \"release-assets.githubusercontent.com\"}\nTARGET = \"x86_64-unknown-linux-gnu\"\nMAX_LOCK = 1_048_576\nMAX_JSON = 2_097_152\nMAX_RECEIPT = 65_536\nMAX_BUNDLE = 4_194_304\nMAX_PAYLOAD = 268_435_456\nHEX40 = re.compile(r\"[0-9a-f]{40}\\Z\")\nHEX64 = re.compile(r\"[0-9a-f]{64}\\Z\")\n\n\nclass AdmissionError(Exception):\n    pass\n\n\ndef require(condition):\n    if not condition:\n        raise AdmissionError(\"source_preview_admission_rejected\")\n\n\ndef sha40(value):\n    return isinstance(value, str) and HEX40.fullmatch(value) is not None\n\n\ndef hex64(value):\n    return isinstance(value, str) and HEX64.fullmatch(value) is not None\n\n\ndef number(value):\n    return isinstance(value, int) and not isinstance(value, bool) and value > 0\n\n\ndef unique_pairs(pairs):\n    result = {}\n    for key, value in pairs:\n        require(key not in result)\n        result[key] = value\n    return result\n\n\ndef parse_json(data, limit):\n    require(len(data) <= limit)\n    try:\n        return json.loads(data, object_pairs_hook=unique_pairs)\n    except (ValueError, UnicodeError) as error:\n        raise AdmissionError(\"source_preview_invalid_json\") from error\n\n\ndef parse_lock(data):\n    require(len(data) <= MAX_LOCK)\n    try:\n        return tomllib.loads(data.decode(\"utf-8\"))\n    except (ValueError, UnicodeError) as error:\n        raise AdmissionError(\"source_preview_invalid_lock\") from error\n\n\ndef read_regular(path, limit):\n    path = Path(path)\n    require(path.is_absolute())\n    for parent in (path, *path.parents):\n        metadata = os.lstat(parent)\n        require(not stat.S_ISLNK(metadata.st_mode))\n    fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)\n    try:\n        require(stat.S_ISREG(os.fstat(fd).st_mode))\n        with os.fdopen(fd, \"rb\", closefd=False) as file:\n            data = file.read(limit + 1)\n        require(len(data) <= limit)\n        return data\n    finally:\n        os.close(fd)\n\n\ndef workflow_tuple(record, prefix, path, source, git_ref):\n    require(record[f\"{prefix}_workflow_path\"] == path)\n    require(record[f\"{prefix}_workflow_ref\"] == f\"{REPOSITORY}/{path}@{git_ref}\")\n    require(record[f\"{prefix}_workflow_sha\"] == source)\n    require(number(record[f\"{prefix}_run_id\"]) and number(record[f\"{prefix}_run_attempt\"]))\n\n\ndef validate_preview(record, candidate):\n    require(isinstance(record, dict))\n    fixed = {\"schema\", \"repository\", \"version\", \"source_sha\", \"tag\", \"release_id\", \"payload_target\", \"payload_name\", \"payload_size\", \"payload_sha256\", \"receipt_sha256\", \"bundle_sha256\"}\n    runs = {f\"{prefix}_{suffix}\" for prefix in (\"source\", \"draft\", \"signer\", \"ci\", \"qualification\") for suffix in (\"workflow_path\", \"workflow_ref\", \"workflow_sha\", \"run_id\", \"run_attempt\")}\n    custody = {\"producer_run_id\", \"producer_run_attempt\", \"producer_payload_artifact_id\", \"producer_payload_archive_sha256\", \"candidate_source_artifact_id\", \"candidate_payload_artifact_id\", \"publisher_run_attempt\", \"publisher_job_id\"}\n    require(set(record) == fixed | runs | custody)\n    source = record[\"source_sha\"]\n    require(type(record[\"schema\"]) is int and record[\"schema\"] == 2 and record[\"repository\"] == REPOSITORY)\n    require(isinstance(record[\"version\"], str) and re.fullmatch(r\"[0-9]+\\.[0-9]+\\.[0-9]+\", record[\"version\"]) is not None)\n    require(sha40(source) and sha40(candidate) and source != candidate)\n    require(record[\"tag\"] == \"sdk-preview-\" + source and number(record[\"release_id\"]))\n    for role in (\"source\", \"draft\"):\n        workflow_tuple(record, role, \".github/workflows/product-release-generator.yml\", source, \"refs/tags/\" + record[\"tag\"])\n        require(record[role + \"_run_id\"] == record[\"signer_run_id\"])\n    require(all(number(record[key]) for key in (\"producer_run_id\", \"producer_run_attempt\", \"producer_payload_artifact_id\", \"candidate_source_artifact_id\", \"candidate_payload_artifact_id\", \"publisher_run_attempt\", \"publisher_job_id\")))\n    require(hex64(record[\"producer_payload_archive_sha256\"]))\n    require(record[\"candidate_source_artifact_id\"] != record[\"candidate_payload_artifact_id\"])\n    require(record[\"source_run_attempt\"] <= record[\"draft_run_attempt\"] <= record[\"signer_run_attempt\"] <= record[\"publisher_run_attempt\"] <= 51)\n    workflow_tuple(record, \"signer\", \".github/workflows/product-release-generator.yml\", source, \"refs/tags/\" + record[\"tag\"])\n    workflow_tuple(record, \"ci\", \".github/workflows/ci.yml\", source, \"refs/heads/main\")\n    workflow_tuple(record, \"qualification\", \".github/workflows/source-qualification.yml\", source, \"refs/heads/main\")\n    name = record[\"payload_name\"]\n    require(record[\"payload_target\"] == TARGET and isinstance(name, str))\n    require(name == \"velnor-actions-x86_64-unknown-linux-gnu\")\n    require(number(record[\"payload_size\"]) and record[\"payload_size\"] <= MAX_PAYLOAD)\n    require(all(hex64(record[key]) for key in (\"payload_sha256\", \"receipt_sha256\", \"bundle_sha256\")))\n\n\ndef event_binding(context, network):\n    event = context[\"event\"]\n    require(isinstance(event, dict) and context[\"repository\"] == REPOSITORY)\n    live_repository = network.api(f\"/repos/{REPOSITORY}\")\n    require(live_repository.get(\"id\") == REPOSITORY_ID and live_repository.get(\"full_name\") == REPOSITORY)\n    require(live_repository.get(\"default_branch\") == \"main\")\n    repository = event.get(\"repository\", {})\n    require(repository.get(\"full_name\") == REPOSITORY and repository.get(\"id\") == REPOSITORY_ID)\n    candidate = context[\"candidate\"]\n    require(sha40(candidate))\n    kind = context[\"event_name\"]\n    if kind == \"pull_request\":\n        pr = event.get(\"pull_request\", {})\n        base = pr.get(\"base\", {})\n        head = pr.get(\"head\", {})\n        require(number(event.get(\"number\")) and base.get(\"ref\") == \"main\")\n        require(base.get(\"repo\", {}).get(\"id\") == REPOSITORY_ID)\n        require(sha40(base.get(\"sha\")) and sha40(head.get(\"sha\")))\n        require(number(head.get(\"repo\", {}).get(\"id\")))\n        live = network.api(f\"/repos/{REPOSITORY}/pulls/{event['number']}\")\n        require(live.get(\"number\") == event[\"number\"] and live.get(\"state\") == \"open\")\n        require(live.get(\"base\", {}).get(\"sha\") == base[\"sha\"] and live.get(\"base\", {}).get(\"ref\") == \"main\")\n        require(live.get(\"base\", {}).get(\"repo\", {}).get(\"id\") == REPOSITORY_ID)\n        require(live.get(\"head\", {}).get(\"sha\") == head[\"sha\"])\n        require(live.get(\"head\", {}).get(\"repo\", {}).get(\"id\") == head.get(\"repo\", {}).get(\"id\"))\n        base_sha = base[\"sha\"]\n    elif kind == \"merge_group\":\n        group = event.get(\"merge_group\", {})\n        base_sha = group.get(\"base_sha\")\n        require(sha40(base_sha) and group.get(\"base_ref\") == \"refs/heads/main\")\n        require(group.get(\"head_sha\") == candidate and group.get(\"head_ref\") == context[\"ref\"])\n    elif kind == \"push\":\n        base_sha = event.get(\"before\")\n        require(sha40(base_sha) and context[\"ref\"] == \"refs/heads/main\")\n        require(event.get(\"after\") == candidate and event.get(\"deleted\") is False)\n    elif kind == \"workflow_dispatch\":\n        require(context[\"ref\"] == \"refs/heads/main\")\n        commit = network.api(f\"/repos/{REPOSITORY}/commits/{candidate}\")\n        parents = commit.get(\"parents\")\n        require(commit.get(\"sha\") == candidate and isinstance(parents, list) and len(parents) > 0)\n        base_sha = parents[0].get(\"sha\")\n        require(sha40(base_sha))\n    else:\n        raise AdmissionError(\"source_preview_unsupported_event\")\n    live_main = network.api(f\"/repos/{REPOSITORY}/commits/main\")\n    expected_main = base_sha if kind in (\"pull_request\", \"merge_group\") else candidate\n    require(live_main.get(\"sha\") == expected_main)\n    return base_sha\n\n\ndef read_github_lock(network, commit):\n    require(sha40(commit))\n    blob = network.api(f\"/repos/{REPOSITORY}/contents/.velnor/generator.lock?ref={commit}\")\n    require(blob.get(\"type\") == \"file\" and blob.get(\"encoding\") == \"base64\")\n    require(blob.get(\"path\") == \".velnor/generator.lock\" and number(blob.get(\"size\")) and blob[\"size\"] <= MAX_LOCK)\n    try:\n        raw = base64.b64decode(\"\".join(blob[\"content\"].split()), validate=True)\n    except (ValueError, KeyError) as error:\n        raise AdmissionError(\"source_preview_invalid_base_lock\") from error\n    require(len(raw) == blob[\"size\"])\n    return parse_lock(raw)\n\n\ndef approved_controller(context, network):\n    base_sha = event_binding(context, network)\n    candidate_lock = parse_lock(read_regular(context[\"lock_path\"], MAX_LOCK))\n    base_lock = read_github_lock(network, base_sha)\n    candidate_preview = candidate_lock.get(\"planner-preview\")\n    base_active = base_lock.get(\"planner-preview\")\n    if candidate_preview is None:\n        require(base_active is None)\n        return None, base_lock, base_sha\n    validate_preview(candidate_preview, context[\"candidate\"])\n    approved = [base_active, base_lock.get(\"planner-preview-staged\")]\n    require(any(value == candidate_preview for value in approved if value is not None))\n    return candidate_preview, base_lock, base_sha\n\n\ndef stable_identity(base_lock):\n    generator = base_lock.get(\"generator\")\n    require(isinstance(generator, dict) and generator.get(\"binary\") == \"velnor-actions\")\n    version = generator.get(\"version\")\n    require(isinstance(version, str) and re.fullmatch(r\"(?:0|[1-9][0-9]*)\\.(?:0|[1-9][0-9]*)\\.(?:0|[1-9][0-9]*)\", version) is not None)\n    require(sha40(generator.get(\"commit\")))\n    binaries = generator.get(\"binaries\")\n    require(isinstance(binaries, list))\n    matches = [entry for entry in binaries if isinstance(entry, dict) and entry.get(\"target\") == TARGET]\n    require(len(matches) == 1)\n    item = matches[0]\n    expected = f\"https://github.com/{REPOSITORY}/releases/download/v{version}/velnor-actions-{version}-{TARGET}\"\n    require(item.get(\"artifact\") == expected and hex64(item.get(\"sha256\")))\n    return {\"channel\": \"stable\", \"version\": version, \"target\": TARGET, \"sha256\": item[\"sha256\"]}, expected\n\n\ndef receipt_from_record(record):\n    def run(prefix):\n        return {suffix: record[f\"{prefix}_{suffix}\"] for suffix in (\"workflow_path\", \"workflow_ref\", \"workflow_sha\", \"run_id\", \"run_attempt\")}\n    return {\n        \"schema\": record[\"schema\"],\n        \"repository\": record[\"repository\"],\n        \"version\": record[\"version\"],\n        \"source_sha\": record[\"source_sha\"],\n        \"tag\": record[\"tag\"],\n        \"release_id\": record[\"release_id\"],\n        \"source\": run(\"source\"),\n        \"draft\": run(\"draft\"),\n        \"signer\": run(\"signer\"),\n        \"ci\": run(\"ci\"),\n        \"qualification\": run(\"qualification\"),\n        \"producer\": {\"producer_run_id\": record[\"producer_run_id\"], \"producer_run_attempt\": record[\"producer_run_attempt\"], \"payload_artifact_id\": record[\"producer_payload_artifact_id\"], \"payload_archive_sha256\": record[\"producer_payload_archive_sha256\"]},\n        \"candidate\": {\"source_artifact_id\": record[\"candidate_source_artifact_id\"], \"payload_artifact_id\": record[\"candidate_payload_artifact_id\"]},\n        \"payload\": {key: record[f\"payload_{key}\"] for key in (\"target\", \"name\", \"size\", \"sha256\")},\n    }\n\n\ndef checked_asset(network, url, expected_size, expected_digest, maximum):\n    require(number(expected_size) and expected_size <= maximum and hex64(expected_digest))\n    body = network.asset(url, maximum)\n    require(len(body) == expected_size and hashlib.sha256(body).hexdigest() == expected_digest)\n    return body\n\n\ndef asset_metadata(release, name, maximum, url):\n    assets = release.get(\"assets\")\n    require(isinstance(assets, list))\n    matches = [item for item in assets if isinstance(item, dict) and item.get(\"name\") == name]\n    require(len(matches) == 1)\n    entry = matches[0]\n    require(entry.get(\"state\") == \"uploaded\" and number(entry.get(\"size\")) and entry[\"size\"] <= maximum)\n    require(entry.get(\"browser_download_url\") == url)\n    digest = entry.get(\"digest\")\n    require(isinstance(digest, str) and digest.startswith(\"sha256:\") and hex64(digest[7:]))\n    return entry[\"size\"], digest[7:]\n\n\ndef verify_annotated_tag(preview, network):\n    reference = network.api(f\"/repos/{REPOSITORY}/git/ref/tags/{preview['tag']}\")\n    require(reference.get(\"ref\") == \"refs/tags/\" + preview[\"tag\"])\n    tag = reference.get(\"object\", {})\n    require(tag.get(\"type\") == \"tag\" and sha40(tag.get(\"sha\")))\n    annotated = network.api(f\"/repos/{REPOSITORY}/git/tags/{tag['sha']}\")\n    require(annotated.get(\"sha\") == tag[\"sha\"] and annotated.get(\"tag\") == preview[\"tag\"])\n    target = annotated.get(\"object\", {})\n    require(target.get(\"type\") == \"commit\" and target.get(\"sha\") == preview[\"source_sha\"])\n    return tag[\"sha\"]\n\n\ndef download_verified_release(preview, network):\n    release = network.api(f\"/repos/{REPOSITORY}/releases/{preview['release_id']}\")\n    require(release.get(\"id\") == preview[\"release_id\"] and release.get(\"tag_name\") == preview[\"tag\"])\n    verify_annotated_tag(preview, network)\n    require(release.get(\"draft\") is False and release.get(\"prerelease\") is True and release.get(\"immutable\") is True)\n    names = (\"SDK_PREVIEW_RECEIPT.json\", \"SDK_PREVIEW_RECEIPT.json.sigstore.jsonl\", preview[\"payload_name\"])\n    assets = release.get(\"assets\")\n    require(isinstance(assets, list) and len(assets) == len(names))\n    require(sorted(item.get(\"name\") for item in assets if isinstance(item, dict)) == sorted(names))\n    prefix = f\"https://github.com/{REPOSITORY}/releases/download/{preview['tag']}/\"\n    receipt_size, receipt_digest = asset_metadata(release, names[0], MAX_RECEIPT, prefix + names[0])\n    bundle_size, bundle_digest = asset_metadata(release, names[1], MAX_BUNDLE, prefix + names[1])\n    payload_size, payload_digest = asset_metadata(release, names[2], MAX_PAYLOAD, prefix + names[2])\n    require(receipt_digest == preview[\"receipt_sha256\"] and bundle_digest == preview[\"bundle_sha256\"])\n    require(payload_size == preview[\"payload_size\"] and payload_digest == preview[\"payload_sha256\"])\n    receipt = checked_asset(network, prefix + names[0], receipt_size, receipt_digest, MAX_RECEIPT)\n    bundle = checked_asset(network, prefix + names[1], bundle_size, bundle_digest, MAX_BUNDLE)\n    payload = checked_asset(network, prefix + names[2], payload_size, payload_digest, MAX_PAYLOAD)\n    parsed = parse_json(receipt, MAX_RECEIPT)\n    require(parsed == receipt_from_record(preview))\n    require(json.dumps(parsed, sort_keys=True, separators=(\",\", \":\"), ensure_ascii=False).encode(\"utf-8\") == receipt)\n    return receipt, bundle, payload\n\n\ndef verify_checkout(context):\n    workspace = Path(context[\"workspace\"])\n    require(workspace.is_absolute() and not workspace.is_symlink())\n    require(Path(context[\"lock_path\"]) == workspace / \".velnor\" / \"generator.lock\")\n    git = subprocess.run(\n        [\"/usr/bin/git\", \"-C\", str(workspace), \"rev-parse\", \"--verify\", \"HEAD^{commit}\"],\n        stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,\n        env={\"PATH\": \"/usr/bin:/bin\", \"GIT_CONFIG_GLOBAL\": \"/dev/null\", \"GIT_CONFIG_NOSYSTEM\": \"1\"},\n        timeout=15, check=False,\n    )\n    require(git.returncode == 0 and git.stdout.decode(\"ascii\").strip() == context[\"candidate\"])\n\n\ndef preview_identity(preview):\n    return {\"channel\": \"source-preview\", \"version\": preview[\"version\"], \"target\": TARGET, \"sha256\": preview[\"payload_sha256\"], \"source_sha\": preview[\"source_sha\"], \"receipt_sha256\": preview[\"receipt_sha256\"]}\n\n\ndef authorize_and_acquire(context, network, required_identity=None):\n    verify_checkout(context)\n    preview, base_lock, base = approved_controller(context, network)\n    if preview is None:\n        tag_sha = None\n        identity, stable_url = stable_identity(base_lock)\n        require(required_identity is None)\n        payload = network.asset(stable_url, MAX_PAYLOAD)\n        require(0 < len(payload) <= MAX_PAYLOAD and hashlib.sha256(payload).hexdigest() == identity[\"sha256\"])\n    else:\n        bootstrap_identity = preview_identity(preview)\n        identity = bootstrap_identity\n        require(required_identity is None or required_identity == bootstrap_identity)\n        tag_sha = verify_annotated_tag(preview, network)\n        _, _, payload = download_verified_release(preview, network)\n    require(event_binding(context, network) == base)\n    runner_temp = Path(context[\"runner_temp\"])\n    require(runner_temp.is_absolute())\n    flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW\n    root_fd = os.open(runner_temp, flags)\n    directory_fd = root_fd\n    try:\n        check_owned_directory(root_fd)\n        for name in (\"velnor\", \"bin\"):\n            try:\n                os.mkdir(name, mode=0o700, dir_fd=directory_fd)\n            except FileExistsError:\n                pass\n            child_fd = os.open(name, flags, dir_fd=directory_fd)\n            check_owned_directory(child_fd)\n            if directory_fd != root_fd:\n                os.close(directory_fd)\n            directory_fd = child_fd\n        temporary = \".controller-\" + secrets.token_hex(16)\n        os.mkdir(temporary, mode=0o700, dir_fd=directory_fd)\n        temporary_fd = os.open(temporary, flags, dir_fd=directory_fd)\n        try:\n            for name, contents, mode in (\n                (\"binary\", payload, 0o700),\n                (\"identity.json\", json.dumps(identity, sort_keys=True, separators=(\",\", \":\")).encode(), 0o600),\n            ):\n                fd = os.open(name, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, mode, dir_fd=temporary_fd)\n                with os.fdopen(fd, \"wb\") as file:\n                    file.write(contents)\n                    file.flush()\n                    os.fsync(file.fileno())\n            os.fsync(temporary_fd)\n            require(event_binding(context, network) == base)\n            if preview is not None:\n                require(verify_annotated_tag(preview, network) == tag_sha)\n            rename_exclusive(directory_fd, temporary, \"controller\")\n        except BaseException:\n            for name in (\"binary\", \"identity.json\"):\n                try:\n                    os.unlink(name, dir_fd=temporary_fd)\n                except FileNotFoundError:\n                    pass\n            os.rmdir(temporary, dir_fd=directory_fd)\n            raise\n        finally:\n            os.close(temporary_fd)\n    finally:\n        if directory_fd != root_fd:\n            os.close(directory_fd)\n        os.close(root_fd)\n    return str(runner_temp / \"velnor\" / \"bin\" / \"controller\" / \"binary\")\n\n\ndef rename_exclusive(directory_fd, source, target):\n    libc = ctypes.CDLL(None, use_errno=True)\n    if sys.platform == \"linux\":\n        operation = libc.renameat2\n        flag = 1\n    elif sys.platform == \"darwin\":\n        operation = libc.renameatx_np\n        flag = 4\n    else:\n        raise AdmissionError(\"source_preview_unsupported_platform\")\n    operation.argtypes = (ctypes.c_int, ctypes.c_char_p, ctypes.c_int, ctypes.c_char_p, ctypes.c_uint)\n    operation.restype = ctypes.c_int\n    if operation(directory_fd, os.fsencode(source), directory_fd, os.fsencode(target), flag) != 0:\n        raise OSError(ctypes.get_errno(), \"source_preview_controller_rename\")\n\n\ndef verify_controller(context, network):\n    verify_checkout(context)\n    preview, base_lock, base = approved_controller(context, network)\n    if preview is None:\n        tag_sha = None\n        expected, _ = stable_identity(base_lock)\n    else:\n        tag_sha = verify_annotated_tag(preview, network)\n        expected = {\"channel\": \"source-preview\", \"version\": preview[\"version\"], \"target\": TARGET, \"sha256\": preview[\"payload_sha256\"], \"source_sha\": preview[\"source_sha\"], \"receipt_sha256\": preview[\"receipt_sha256\"]}\n    root = Path(context[\"runner_temp\"]) / \"velnor\" / \"bin\" / \"controller\"\n    raw = read_regular(root / \"identity.json\", MAX_RECEIPT)\n    actual = parse_json(raw, MAX_RECEIPT)\n    require(raw == json.dumps(actual, sort_keys=True, separators=(\",\", \":\")).encode() and actual == expected)\n    binary = read_regular(root / \"binary\", MAX_PAYLOAD)\n    require(hashlib.sha256(binary).hexdigest() == expected[\"sha256\"])\n    require(event_binding(context, network) == base)\n    if preview is not None:\n        require(verify_annotated_tag(preview, network) == tag_sha)\n    return expected\n\n\ndef check_owned_directory(fd):\n    info = os.fstat(fd)\n    require(stat.S_ISDIR(info.st_mode) and info.st_uid == os.geteuid() and info.st_mode & 0o022 == 0)\n\n\nclass FixedRedirect(urllib.request.HTTPRedirectHandler):\n    def redirect_request(self, request, file, code, message, headers, new_url):\n        old = urllib.parse.urlsplit(request.full_url)\n        new = urllib.parse.urlsplit(new_url)\n        require(old.hostname != API and new.scheme == \"https\" and new.hostname in RELEASE_HOSTS)\n        require(new.port in (None, 443) and new.username is None and new.password is None)\n        redirected = super().redirect_request(request, file, code, message, headers, new_url)\n        require(redirected is not None)\n        for key in list(redirected.headers):\n            if key.lower() in (\"authorization\", \"cookie\", \"proxy-authorization\"):\n                redirected.remove_header(key)\n        return redirected\n\n\nclass GitHubTransport:\n    def __init__(self, token):\n        import ssl\n        self.token = token\n        self.deadline = time.monotonic() + 180\n        ca_file = \"/etc/ssl/cert.pem\" if sys.platform == \"darwin\" else \"/etc/ssl/certs/ca-certificates.crt\"\n        tls = ssl.create_default_context(cafile=ca_file)\n        self.opener = urllib.request.build_opener(\n            urllib.request.ProxyHandler({}), urllib.request.HTTPSHandler(context=tls), FixedRedirect()\n        )\n\n    def get(self, url, maximum, api):\n        remaining = self.deadline - time.monotonic()\n        require(remaining > 0)\n        parsed = urllib.parse.urlsplit(url)\n        require(parsed.scheme == \"https\" and parsed.port in (None, 443))\n        require(parsed.username is None and parsed.password is None and not parsed.fragment)\n        require(parsed.hostname == (API if api else \"github.com\"))\n        headers = {\"Accept\": \"application/vnd.github+json\", \"User-Agent\": \"velnor-source-preview\"}\n        if api and self.token:\n            headers[\"Authorization\"] = \"Bearer \" + self.token\n        request = urllib.request.Request(url, headers=headers, method=\"GET\")\n        try:\n            with self.opener.open(request, timeout=min(remaining, 30)) as response:\n                length = response.headers.get(\"Content-Length\")\n                if length is not None:\n                    require(length.isdecimal() and int(length) <= maximum)\n                result = bytearray()\n                size = 0\n                while True:\n                    require(time.monotonic() <= self.deadline)\n                    chunk = response.read1(min(65_536, maximum + 1 - size))\n                    if not chunk:\n                        break\n                    size += len(chunk)\n                    require(size <= maximum)\n                    result.extend(chunk)\n        except (OSError, urllib.error.URLError) as error:\n            raise AdmissionError(\"source_preview_network_failure\") from error\n        require(len(result) <= maximum and time.monotonic() <= self.deadline)\n        return result\n\n    def api(self, path):\n        require(path == f\"/repos/{REPOSITORY}\" or path.startswith(f\"/repos/{REPOSITORY}/\"))\n        return parse_json(self.get(\"https://\" + API + path, MAX_JSON, True), MAX_JSON)\n\n    def asset(self, url, maximum):\n        return self.get(url, maximum, False)\n\n\ndef environment_context():\n    event_path = Path(os.environ[\"GITHUB_EVENT_PATH\"])\n    event = parse_json(read_regular(event_path, MAX_JSON), MAX_JSON)\n    workspace = Path(os.environ[\"GITHUB_WORKSPACE\"])\n    context = {\n        \"event\": event,\n        \"event_name\": os.environ[\"GITHUB_EVENT_NAME\"],\n        \"repository\": os.environ[\"GITHUB_REPOSITORY\"],\n        \"candidate\": os.environ[\"GITHUB_SHA\"],\n        \"ref\": os.environ[\"GITHUB_REF\"],\n        \"workspace\": str(workspace),\n        \"lock_path\": str(workspace / \".velnor\" / \"generator.lock\"),\n        \"runner_temp\": os.environ[\"RUNNER_TEMP\"],\n    }\n    return context\n\n\ndef main():\n    context = environment_context()\n    authorize_and_acquire(context, GitHubTransport(os.environ.get(\"GH_TOKEN\", \"\")))\n\n\nif __name__ == \"__main__\":\n    try:\n        main()\n    except (AdmissionError, OSError, KeyError, ValueError, subprocess.SubprocessError):\n        raise SystemExit(\"source preview acquisition rejected\") from None\n\nBOOTSTRAP\ncat > \"$RUNNER_TEMP/source-preview-support/source_preview_stage_verify.py\" <<'VERIFIER'\n# SPDX-FileCopyrightText: 2026 Alexey Zhokhov\n# SPDX-License-Identifier: Apache-2.0\n\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport platform\nimport selectors\nimport signal\nimport subprocess\nimport sys\nimport tempfile\nimport time\n\nimport source_preview_bootstrap as bootstrap\n\nGH_SHA256 = {\n    (\"Linux\", \"x86_64\"): {\"cbfdc94f3a5c0713c0d6df3e0a1d88a59a76b0c52332aad7d21d112f9da2cc0e\", \"b768184570b12536be4ac1528893f6340d1c6a7b40b56ad45bca9cd0e87ad34d\"},\n    (\"Darwin\", \"arm64\"): {\"5e4470bb57bf1e7cb5063be940d5dffc5be3e1899d6bf7fe1ff15372f7f4cc29\", \"5f8d7527e2bdf584249b030cdd1550c91d75e8afb40aa3c11573d416817a1260\"},\n}\nOWNER_ID = \"78806509\"\nMAX_GH_BYTES = 104_857_600\nMAX_VERIFY_OUTPUT = 16_777_216\nAUTHORITY_WORKFLOW = \".github/workflows/source-preview-publication.yml\"\nPUBLICATION_AUTHORITY_SHA = None\n\n\ndef checked_authority(authority):\n    bootstrap.require(isinstance(authority, dict) and set(authority) == {\"repository\", \"path\", \"ref\", \"sha\"})\n    bootstrap.require(authority[\"repository\"] == bootstrap.REPOSITORY and authority[\"path\"] == AUTHORITY_WORKFLOW)\n    bootstrap.require(bootstrap.sha40(authority[\"sha\"]))\n    bootstrap.require(authority[\"ref\"] == bootstrap.REPOSITORY + \"/\" + AUTHORITY_WORKFLOW + \"@\" + authority[\"sha\"])\n    return authority\n\n\ndef staging_authority():\n    bootstrap.require(bootstrap.sha40(PUBLICATION_AUTHORITY_SHA))\n    return checked_authority({\"repository\": bootstrap.REPOSITORY, \"path\": AUTHORITY_WORKFLOW, \"ref\": bootstrap.REPOSITORY + \"/\" + AUTHORITY_WORKFLOW + \"@\" + PUBLICATION_AUTHORITY_SHA, \"sha\": PUBLICATION_AUTHORITY_SHA})\n\n\ndef verify_gh_binary(path):\n    expected = GH_SHA256.get((platform.system(), platform.machine()))\n    bootstrap.require(expected is not None)\n    data = bootstrap.read_regular(path, MAX_GH_BYTES)\n    bootstrap.require(hashlib.sha256(data).hexdigest() in expected)\n    bootstrap.require(os.access(path, os.X_OK))\n\n\ndef invoke_gh(path, receipt_path, bundle_path, source, expected_authority):\n    authority = checked_authority(expected_authority)\n    bootstrap.require(authority[\"sha\"] != source)\n    environment = {key: os.environ[key] for key in (\"HOME\", \"LANG\", \"LC_ALL\", \"TMPDIR\") if key in os.environ}\n    environment.update({\"PATH\": \"/usr/bin:/bin\", \"GH_PROMPT_DISABLED\": \"1\"})\n    command = [path, \"attestation\", \"verify\", str(receipt_path), \"--bundle\", str(bundle_path), \"--repo\", bootstrap.REPOSITORY, \"--signer-workflow\", bootstrap.REPOSITORY + \"/\" + authority[\"path\"], \"--signer-digest\", authority[\"sha\"], \"--source-digest\", source, \"--source-ref\", \"refs/tags/sdk-preview-\" + source, \"--format\", \"json\"]\n    process = subprocess.Popen(command, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, env=environment, start_new_session=True)\n    output = bytearray()\n    deadline = time.monotonic() + 90\n    try:\n        with selectors.DefaultSelector() as selector:\n            selector.register(process.stdout, selectors.EVENT_READ)\n            while selector.get_map():\n                remaining = deadline - time.monotonic()\n                bootstrap.require(remaining > 0)\n                ready = selector.select(remaining)\n                bootstrap.require(bool(ready))\n                for key, _ in ready:\n                    chunk = os.read(key.fd, min(65_536, MAX_VERIFY_OUTPUT + 1 - len(output)))\n                    if not chunk:\n                        selector.unregister(key.fileobj)\n                    else:\n                        output.extend(chunk)\n                        bootstrap.require(len(output) <= MAX_VERIFY_OUTPUT)\n        bootstrap.require(process.wait(timeout=max(0.001, deadline - time.monotonic())) == 0)\n    finally:\n        if process.poll() is None:\n            os.killpg(process.pid, signal.SIGKILL)\n            process.wait()\n    return bootstrap.parse_json(output, MAX_VERIFY_OUTPUT)\n\n\ndef certificate_matches(certificate, source, workflow, run_id, attempt, expected_authority):\n    authority = checked_authority(expected_authority)\n    signer_uri = \"https://github.com/\" + authority[\"ref\"]\n    uri = f\"https://github.com/{bootstrap.REPOSITORY}/{workflow}@refs/tags/sdk-preview-{source}\"\n    expected = {\n        \"issuer\": \"https://token.actions.githubusercontent.com\",\n        \"subjectAlternativeName\": signer_uri,\n        \"buildSignerURI\": signer_uri,\n        \"buildSignerDigest\": authority[\"sha\"],\n        \"buildConfigURI\": uri,\n        \"buildConfigDigest\": source,\n        \"sourceRepositoryURI\": f\"https://github.com/{bootstrap.REPOSITORY}\",\n        \"sourceRepositoryIdentifier\": str(bootstrap.REPOSITORY_ID),\n        \"sourceRepositoryOwnerURI\": \"https://github.com/tailrocks\",\n        \"sourceRepositoryOwnerIdentifier\": OWNER_ID,\n        \"sourceRepositoryDigest\": source,\n        \"sourceRepositoryRef\": \"refs/tags/sdk-preview-\" + source,\n        \"buildTrigger\": \"push\",\n        \"runnerEnvironment\": \"github-hosted\",\n        \"runInvocationURI\": f\"https://github.com/{bootstrap.REPOSITORY}/actions/runs/{run_id}/attempts/{attempt}\",\n    }\n    return authority[\"sha\"] != source and isinstance(certificate, dict) and all(certificate.get(key) == value for key, value in expected.items())\n\n\ndef verify_attestation(path, receipt, bundle, preview, temp_root, expected_authority):\n    authority = checked_authority(expected_authority)\n    bootstrap.require(authority[\"sha\"] != preview[\"source_sha\"])\n    verify_gh_binary(path)\n    with tempfile.TemporaryDirectory(prefix=\"source-preview-stage-\", dir=temp_root) as temporary:\n        root = Path(temporary)\n        receipt_path = root / \"SDK_PREVIEW_RECEIPT.json\"\n        bundle_path = root / \"SDK_PREVIEW_RECEIPT.json.sigstore.jsonl\"\n        receipt_path.write_bytes(receipt)\n        bundle_path.write_bytes(bundle)\n        verified = invoke_gh(path, receipt_path, bundle_path, preview[\"source_sha\"], authority)\n    bootstrap.require(isinstance(verified, list) and len(verified) == 1)\n    result = verified[0].get(\"verificationResult\", {})\n    certificate = result.get(\"signature\", {}).get(\"certificate\")\n    bootstrap.require(certificate_matches(certificate, preview[\"source_sha\"], preview[\"signer_workflow_path\"], preview[\"signer_run_id\"], preview[\"signer_run_attempt\"], authority))\n    statement = result.get(\"statement\", {})\n    bootstrap.require(statement.get(\"predicateType\") == \"https://slsa.dev/provenance/v1\")\n    subjects = statement.get(\"subject\")\n    bootstrap.require(isinstance(subjects, list))\n    for name, digest in [(\"SDK_PREVIEW_RECEIPT.json\", preview[\"receipt_sha256\"]), (preview[\"payload_name\"], preview[\"payload_sha256\"])]:\n        matches = [item for item in subjects if isinstance(item, dict) and item.get(\"name\") == name]\n        bootstrap.require(len(matches) == 1 and matches[0].get(\"digest\") == {\"sha256\": digest})\n\n\ndef verify_run(network, preview, prefix, event):\n    run_id = preview[prefix + \"_run_id\"]\n    attempt = preview[prefix + \"_run_attempt\"]\n    path = f\"/repos/{bootstrap.REPOSITORY}/actions/runs/{run_id}/attempts/{attempt}\"\n    run = network.api(path)\n    bootstrap.require(run.get(\"id\") == run_id and run.get(\"run_attempt\") == attempt)\n    bootstrap.require(run.get(\"event\") == event and run.get(\"head_sha\") == preview[\"source_sha\"])\n    bootstrap.require(run.get(\"head_branch\") == (preview[\"tag\"] if prefix in (\"source\", \"draft\", \"signer\") else \"main\") and run.get(\"path\") == preview[prefix + \"_workflow_path\"])\n    bootstrap.require(run.get(\"status\") == \"completed\")\n    if prefix in (\"ci\", \"qualification\"):\n        bootstrap.require(run.get(\"conclusion\") == \"success\")\n    bootstrap.require(run.get(\"head_repository\", {}).get(\"id\") == bootstrap.REPOSITORY_ID)\n    bootstrap.require(run.get(\"head_repository\", {}).get(\"full_name\") == bootstrap.REPOSITORY)\n    return path\n\n\ndef verify_required_job(network, run_path, name, source):\n    jobs = []\n    total = None\n    for page in range(1, 11):\n        response = network.api(f\"{run_path}/jobs?per_page=100&page={page}\")\n        count = response.get(\"total_count\")\n        values = response.get(\"jobs\")\n        bootstrap.require(bootstrap.number(count) and isinstance(values, list))\n        if total is None:\n            total = count\n        bootstrap.require(total == count and count <= 1_000)\n        jobs.extend(values)\n        bootstrap.require(len(jobs) <= total)\n        if len(jobs) == total:\n            break\n        bootstrap.require(len(values) == 100)\n    bootstrap.require(len(jobs) == total)\n    bootstrap.require(all(isinstance(job, dict) and bootstrap.number(job.get(\"id\")) for job in jobs))\n    bootstrap.require(len({job[\"id\"] for job in jobs}) == len(jobs))\n    run_id, attempt = (int(run_path.split(\"/runs/\")[1].split(\"/\")[0]), int(run_path.rsplit(\"/\", 1)[1]))\n    bootstrap.require(all(job.get(\"run_id\") == run_id and job.get(\"run_attempt\") == attempt and job.get(\"head_sha\") == source for job in jobs))\n    matches = [job for job in jobs if isinstance(job, dict) and job.get(\"name\") == name]\n    bootstrap.require(len(matches) == 1)\n    job = matches[0]\n    bootstrap.require(job.get(\"status\") == \"completed\" and job.get(\"conclusion\") == \"success\")\n    bootstrap.require(job.get(\"head_sha\") == source)\n    return job\n\n\ndef verify_publication_jobs(network, preview):\n    for role, name in ((\"source\", \"Source preview publication / Admit source preview\"), (\"draft\", \"Source preview publication / Draft source preview\"), (\"signer\", \"Source preview publication / Attest source preview\")):\n        role_path = verify_run(network, preview, role, \"push\")\n        verify_required_job(network, role_path, name, preview[\"source_sha\"])\n    publisher = dict(preview)\n    publisher[\"signer_run_attempt\"] = preview[\"publisher_run_attempt\"]\n    publisher_path = verify_run(network, publisher, \"signer\", \"push\")\n    published_job = verify_required_job(network, publisher_path, \"Source preview publication / Publish source preview\", preview[\"source_sha\"])\n    bootstrap.require(published_job[\"id\"] == preview[\"publisher_job_id\"])\n    pinned_job = network.api(f\"/repos/{bootstrap.REPOSITORY}/actions/jobs/{preview['publisher_job_id']}\")\n    bootstrap.require(pinned_job.get(\"id\") == preview[\"publisher_job_id\"] and pinned_job.get(\"run_id\") == preview[\"signer_run_id\"])\n    bootstrap.require(pinned_job.get(\"run_attempt\") == preview[\"publisher_run_attempt\"] and pinned_job.get(\"head_sha\") == preview[\"source_sha\"])\n    bootstrap.require(pinned_job.get(\"name\") == \"Source preview publication / Publish source preview\" and pinned_job.get(\"status\") == \"completed\" and pinned_job.get(\"conclusion\") == \"success\")\n\n\ndef verify_staging(pr_number, gh_path, network, temp_root):\n    bootstrap.require(bootstrap.number(pr_number))\n    repository = network.api(f\"/repos/{bootstrap.REPOSITORY}\")\n    bootstrap.require(repository.get(\"id\") == bootstrap.REPOSITORY_ID and repository.get(\"full_name\") == bootstrap.REPOSITORY and repository.get(\"default_branch\") == \"main\")\n    pr = network.api(f\"/repos/{bootstrap.REPOSITORY}/pulls/{pr_number}\")\n    bootstrap.require(pr.get(\"number\") == pr_number and pr.get(\"state\") == \"open\")\n    head = pr.get(\"head\", {})\n    base = pr.get(\"base\", {})\n    bootstrap.require(bootstrap.sha40(head.get(\"sha\")) and bootstrap.sha40(base.get(\"sha\")))\n    bootstrap.require(base.get(\"ref\") == \"main\" and base.get(\"repo\", {}).get(\"id\") == bootstrap.REPOSITORY_ID)\n    bootstrap.require(bootstrap.number(head.get(\"repo\", {}).get(\"id\")))\n    initial = (head[\"sha\"], head[\"repo\"][\"id\"], base[\"sha\"])\n    main = network.api(f\"/repos/{bootstrap.REPOSITORY}/commits/main\")\n    bootstrap.require(main.get(\"sha\") == base[\"sha\"])\n    lock = bootstrap.read_github_lock(network, head[\"sha\"])\n    preview = lock.get(\"planner-preview-staged\")\n    bootstrap.validate_preview(preview, head[\"sha\"])\n    ancestry = network.api(f\"/repos/{bootstrap.REPOSITORY}/compare/{preview['source_sha']}...{base['sha']}\")\n    bootstrap.require(ancestry.get(\"status\") in (\"identical\", \"ahead\") and ancestry.get(\"merge_base_commit\", {}).get(\"sha\") == preview[\"source_sha\"])\n    ci = verify_run(network, preview, \"ci\", \"push\")\n    qualification = verify_run(network, preview, \"qualification\", \"workflow_dispatch\")\n    verify_required_job(network, ci, \"Required\", preview[\"source_sha\"])\n    verify_required_job(network, qualification, \"Source qualification\", preview[\"source_sha\"])\n    verify_publication_jobs(network, preview)\n    tag_sha = bootstrap.verify_annotated_tag(preview, network)\n    receipt, bundle, _ = bootstrap.download_verified_release(preview, network)\n    authority = staging_authority()\n    authority_ancestry = network.api(f\"/repos/{bootstrap.REPOSITORY}/compare/{authority['sha']}...{preview['source_sha']}\")\n    bootstrap.require(authority_ancestry.get(\"status\") == \"ahead\" and authority_ancestry.get(\"merge_base_commit\", {}).get(\"sha\") == authority[\"sha\"])\n    verify_attestation(gh_path, receipt, bundle, preview, temp_root, authority)\n    current = network.api(f\"/repos/{bootstrap.REPOSITORY}/pulls/{pr_number}\")\n    bootstrap.require(current.get(\"number\") == pr_number and current.get(\"state\") == \"open\")\n    bootstrap.require((current.get(\"head\", {}).get(\"sha\"), current.get(\"head\", {}).get(\"repo\", {}).get(\"id\"), current.get(\"base\", {}).get(\"sha\")) == initial)\n    bootstrap.require(current.get(\"base\", {}).get(\"ref\") == \"main\" and current.get(\"base\", {}).get(\"repo\", {}).get(\"id\") == bootstrap.REPOSITORY_ID)\n    bootstrap.require(network.api(f\"/repos/{bootstrap.REPOSITORY}/commits/main\").get(\"sha\") == base[\"sha\"])\n    bootstrap.require(bootstrap.verify_annotated_tag(preview, network) == tag_sha)\n    return {\"repository\": bootstrap.REPOSITORY, \"pull_request\": pr_number, \"head_sha\": head[\"sha\"], \"base_sha\": base[\"sha\"], \"source_sha\": preview[\"source_sha\"], \"receipt_sha256\": preview[\"receipt_sha256\"]}\n\n\ndef main():\n    bootstrap.require(len(sys.argv) == 4)\n    pr_number = int(sys.argv[1])\n    gh = str(Path(sys.argv[2]))\n    temp_root = Path(sys.argv[3])\n    bootstrap.require(temp_root.is_absolute() and temp_root.is_dir() and not temp_root.is_symlink())\n    result = verify_staging(pr_number, gh, bootstrap.GitHubTransport(os.environ.get(\"GH_TOKEN\", \"\")), temp_root)\n    sys.stdout.write(json.dumps(result, sort_keys=True, separators=(\",\", \":\")) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    try:\n        main()\n    except (bootstrap.AdmissionError, OSError, ValueError, KeyError, subprocess.SubprocessError):\n        raise SystemExit(\"source preview staging verification rejected\") from None\n\nVERIFIER\nPREVIEW_GH=\"$(mise which gh --tool=gh@2.103.3)\"\nexport PREVIEW_GH\nset -eu\nenv -i PATH=/usr/bin:/bin HOME=\"$HOME\" GH_TOKEN=\"$GH_TOKEN\" GITHUB_SHA=\"$GITHUB_SHA\" GITHUB_REPOSITORY=\"$GITHUB_REPOSITORY\" GITHUB_EVENT_NAME=\"$GITHUB_EVENT_NAME\" GITHUB_REF=\"$GITHUB_REF\" GITHUB_WORKFLOW_REF=\"$GITHUB_WORKFLOW_REF\" GITHUB_WORKFLOW_SHA=\"$GITHUB_WORKFLOW_SHA\" GITHUB_RUN_ID=\"$GITHUB_RUN_ID\" GITHUB_RUN_ATTEMPT=\"$GITHUB_RUN_ATTEMPT\" RUNNER_TEMP=\"$RUNNER_TEMP\" GITHUB_OUTPUT=\"$GITHUB_OUTPUT\" SOURCE_ARTIFACT_ID=\"$SOURCE_ARTIFACT_ID\" PAYLOAD_ARTIFACT_ID=\"$PAYLOAD_ARTIFACT_ID\" AUTHORITY_REPOSITORY=\"$AUTHORITY_REPOSITORY\" AUTHORITY_PATH=\"$AUTHORITY_PATH\" AUTHORITY_REF=\"$AUTHORITY_REF\" AUTHORITY_SHA=\"$AUTHORITY_SHA\" SIGN=\"${SIGN:-}\" PAIR_ORIGIN=\"${PAIR_ORIGIN:-}\" PAIR_ID=\"${PAIR_ID:-}\" RECEIPT_SHA256=\"${RECEIPT_SHA256:-}\" BUNDLE_SHA256=\"${BUNDLE_SHA256:-}\" PREVIEW_GH=\"${PREVIEW_GH:-}\" PREVIEW_MODE='prepare' /usr/bin/python3 -I -S - <<'PY'\nimport os, sys\nsys.path.insert(0, os.path.join(os.environ['RUNNER_TEMP'], 'source-preview-support'))\n# SPDX-FileCopyrightText: 2026 Alexey Zhokhov\n# SPDX-License-Identifier: Apache-2.0\n\ndef preview_authority():\n    repository = os.environ[\"AUTHORITY_REPOSITORY\"]\n    path = os.environ[\"AUTHORITY_PATH\"]\n    ref = os.environ[\"AUTHORITY_REF\"]\n    sha = os.environ[\"AUTHORITY_SHA\"]\n    if (repository != \"tailrocks/velnor-new\" or path != \".github/workflows/source-preview-publication.yml\"\n            or re.fullmatch(\"[0-9a-f]{40}\", sha) is None\n            or ref != repository + \"/\" + path + \"@\" + sha):\n        raise ValueError(\"source preview workflow authority\")\n    return {\"repository\": repository, \"path\": path, \"ref\": ref, \"sha\": sha}\n\n# SPDX-FileCopyrightText: 2026 Alexey Zhokhov\n# SPDX-License-Identifier: Apache-2.0\n\nimport hashlib\nimport http.client\nimport io\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport signal\nimport ssl\nimport stat\nimport sys\nimport time\nfrom urllib.parse import urlsplit\nimport zipfile\n\nREPOSITORY = \"tailrocks/velnor-new\"\nWORKFLOW = \".github/workflows/product-release-generator.yml\"\nPAYLOAD = \"velnor-actions-x86_64-unknown-linux-gnu\"\nRECEIPT = \"SDK_PREVIEW_RECEIPT.json\"\nBUNDLE = RECEIPT + \".sigstore.jsonl\"\nMAX_PAYLOAD = 268435456\nMAX_JSON = 2097152\n\n\n\ndef require(condition):\n    if not condition:\n        raise ValueError(\"preview publication rejected\")\n\n\ndef unique(pairs):\n    result = {}\n    for key, value in pairs:\n        require(key not in result)\n        result[key] = value\n    return result\n\n\ndef canonical(value):\n    return json.dumps(value, sort_keys=True, separators=(\",\", \":\"), ensure_ascii=False).encode()\n\n\ndef read_file(directory, name, limit):\n    directory = Path(directory)\n    require(not directory.is_symlink() and directory.is_dir())\n    require({item.name for item in directory.iterdir()} == {name})\n    descriptor = os.open(directory / name, os.O_RDONLY | os.O_NOFOLLOW)\n    try:\n        info = os.fstat(descriptor)\n        require(stat.S_ISREG(info.st_mode) and 0 < info.st_size <= limit)\n        data = bytearray()\n        while len(data) <= limit:\n            chunk = os.read(descriptor, min(65536, limit + 1 - len(data)))\n            if not chunk:\n                break\n            data.extend(chunk)\n        after = os.fstat(descriptor)\n        require(len(data) == info.st_size and (info.st_dev, info.st_ino, info.st_size, info.st_mtime_ns) == (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns))\n        return bytes(data)\n    finally:\n        os.close(descriptor)\n\n\ndef read_pair(directory):\n    root = Path(directory)\n    require(not root.is_symlink() and root.is_dir() and {entry.name for entry in root.iterdir()} == {RECEIPT, BUNDLE})\n    result = []\n    for name, limit in ((RECEIPT, 65536), (BUNDLE, MAX_JSON)):\n        descriptor = os.open(root / name, os.O_RDONLY | os.O_NOFOLLOW)\n        try:\n            info = os.fstat(descriptor)\n            require(stat.S_ISREG(info.st_mode) and 0 < info.st_size <= limit)\n            with os.fdopen(descriptor, \"rb\", closefd=False) as file:\n                data = file.read(limit + 1)\n            after = os.fstat(descriptor)\n            require(len(data) == info.st_size and (info.st_dev, info.st_ino, info.st_size, info.st_mtime_ns) == (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns))\n            result.append(data)\n        finally:\n            os.close(descriptor)\n    return result\n\n\ndef parse(data):\n    return json.loads(data, object_pairs_hook=unique)\n\n\ndef digest(data):\n    return hashlib.sha256(data).hexdigest()\n\n\ndef positive(value):\n    require(type(value) is int and 0 < value <= 9007199254740991)\n    return value\n\n\ndef candidate_marker(source, candidate):\n    require(set(candidate) == {\"source_artifact_id\", \"payload_artifact_id\"})\n    for value in candidate.values():\n        positive(value)\n    marker = {\"schema\": 2, \"source_sha\": source[\"source_sha\"],\n              \"run_id\": positive(source[\"source\"][\"run_id\"]),\n              \"producer\": source[\"producer\"], \"candidate\": candidate}\n    return \"velnor-source-preview:\" + canonical(marker).decode()\n\n\ndef finalize_receipt(decision, attempt):\n    require(set(decision) == {\"source\", \"candidate\", \"release_id\", \"payload\", \"draft\"})\n    source = decision[\"source\"]\n    draft = decision[\"draft\"]\n    signer = dict(draft, run_attempt=positive(attempt))\n    require(source[\"source\"][\"run_id\"] == draft[\"run_id\"])\n    require(all(source[\"source\"][key] == draft[key] for key in (\"workflow_path\", \"workflow_ref\", \"workflow_sha\")))\n    require(source[\"source\"][\"run_attempt\"] <= draft[\"run_attempt\"] <= signer[\"run_attempt\"])\n    candidate_marker(source, decision[\"candidate\"])\n    return canonical(dict(source, candidate=decision[\"candidate\"], release_id=positive(decision[\"release_id\"]),\n                          payload=decision[\"payload\"], draft=draft, signer=signer))\n\n\ndef select_pair(item, pairs, payload):\n    assets = item.get(\"assets\")\n    require(isinstance(assets, list) and len(assets) <= 3)\n    names = [asset.get(\"name\") for asset in assets]\n    require(len(names) == len(set(names)) and all(name in (RECEIPT, BUNDLE, PAYLOAD) for name in names))\n    require(all(asset.get(\"state\") == \"uploaded\" for asset in assets))\n    compatible = []\n    for pair in pairs:\n        expected = {RECEIPT: pair[\"receipt\"], BUNDLE: pair[\"bundle\"], PAYLOAD: payload}\n        if all(asset.get(\"size\") == len(expected[asset[\"name\"]])\n               and asset.get(\"digest\") == \"sha256:\" + digest(expected[asset[\"name\"]]) for asset in assets):\n            compatible.append(pair)\n    if compatible:\n        first = min(pair[\"signer_attempt\"] for pair in compatible)\n        matches = [pair for pair in compatible if pair[\"signer_attempt\"] == first]\n        require(len(matches) == 1)\n        if item.get(\"draft\") is False:\n            require(item.get(\"immutable\") is True and set(names) == {RECEIPT, BUNDLE, PAYLOAD})\n        else:\n            require(item.get(\"draft\") is True)\n        return matches[0]\n    require(item.get(\"draft\") is True and not assets and not pairs)\n    return None\n\n\ndef artifact_files(client, artifact, expected):\n    identity = positive(artifact.get(\"id\"))\n    size = positive(artifact.get(\"size_in_bytes\"))\n    limit = 257 * 1024 * 1024\n    require(size <= limit and isinstance(artifact.get(\"digest\"), str)\n            and re.fullmatch(\"sha256:[0-9a-f]{64}\", artifact[\"digest\"]))\n    host = \"api.github.com\"\n    path = \"/repos/\" + REPOSITORY + \"/actions/artifacts/\" + str(identity) + \"/zip\"\n    authorized = True\n    for _ in range(4):\n        remaining = client.deadline - time.monotonic()\n        require(remaining > 0)\n        connection = http.client.HTTPSConnection(host, timeout=min(30, remaining), context=ssl.create_default_context())\n        try:\n            headers = {\"Accept\": \"application/vnd.github+json\", \"User-Agent\": \"velnor-source-preview\"}\n            if authorized:\n                headers[\"Authorization\"] = \"Bearer \" + client.token\n            connection.request(\"GET\", path, headers=headers)\n            response = connection.getresponse()\n            if response.status in (301, 302, 303, 307, 308):\n                redirect = urlsplit(response.getheader(\"Location\", \"\"))\n                require(redirect.scheme == \"https\" and redirect.hostname is not None\n                        and re.fullmatch(r\"productionresultssa[0-9]+\\.blob\\.core\\.windows\\.net\", redirect.hostname)\n                        and redirect.username is None and redirect.password is None\n                        and redirect.port in (None, 443) and not redirect.fragment)\n                host = redirect.hostname\n                path = redirect.path + (\"?\" + redirect.query if redirect.query else \"\")\n                authorized = False\n                continue\n            require(response.status == 200 and not authorized)\n            body = bytearray()\n            while len(body) <= limit:\n                require(time.monotonic() < client.deadline)\n                if connection.sock is not None:\n                    connection.sock.settimeout(min(30, client.deadline - time.monotonic()))\n                chunk = response.read(min(65536, limit + 1 - len(body)))\n                if not chunk:\n                    break\n                body.extend(chunk)\n            require(len(body) == size and \"sha256:\" + digest(body) == artifact[\"digest\"])\n            break\n        finally:\n            connection.close()\n    else:\n        raise ValueError(\"preview artifact redirect limit\")\n    with zipfile.ZipFile(io.BytesIO(body)) as archive:\n        entries = archive.infolist()\n        require(len(entries) == len(expected) and {entry.filename for entry in entries} == set(expected))\n        result = {}\n        for entry in entries:\n            require(not entry.flag_bits & 1 and stat.S_ISREG(entry.external_attr >> 16)\n                    and entry.compress_type in (zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED)\n                    and 0 < entry.file_size <= expected[entry.filename])\n            data = archive.read(entry)\n            require(len(data) == entry.file_size)\n            result[entry.filename] = data\n        return result\n\n\ndef inventory(client, path, key, maximum_pages):\n    result = []\n    total = None\n    for page in range(1, maximum_pages + 1):\n        response = client.api(\"GET\", path + \"?per_page=100&page=\" + str(page))\n        count = response.get(\"total_count\")\n        values = response.get(key)\n        require(type(count) is int and 0 <= count <= maximum_pages * 100 and isinstance(values, list))\n        if total is None:\n            total = count\n        require(count == total and len(values) <= 100)\n        result.extend(values)\n        require(len(result) <= total)\n        if len(result) == total:\n            break\n        require(len(values) == 100)\n    require(len(result) == total)\n    ids = [positive(value.get(\"id\")) for value in result]\n    require(len(ids) == len(set(ids)))\n    return result\n\n\ndef successful_job(client, source, run_id, attempt, name, allow_failed=False):\n    require(positive(attempt) <= 51)\n    path = \"/actions/runs/\" + str(positive(run_id)) + \"/attempts/\" + str(attempt)\n    run = client.api(\"GET\", path)\n    require(run.get(\"id\") == run_id and run.get(\"run_attempt\") == attempt\n            and run.get(\"head_sha\") == source and run.get(\"head_branch\") == \"sdk-preview-\" + source\n            and run.get(\"event\") == \"push\" and run.get(\"path\", \"\").split(\"@\", 1)[0] == WORKFLOW\n            and run.get(\"head_repository\", {}).get(\"full_name\") == REPOSITORY)\n    jobs = inventory(client, path + \"/jobs\", \"jobs\", 10)\n    require(all(job.get(\"run_id\") == run_id and job.get(\"head_sha\") == source for job in jobs))\n    matches = [job for job in jobs if job.get(\"name\") == name]\n    require(len(matches) == 1 and matches[0].get(\"status\") == \"completed\")\n    if allow_failed and matches[0].get(\"conclusion\") != \"success\":\n        return None\n    require(matches[0].get(\"conclusion\") == \"success\")\n    return matches[0][\"id\"]\n\n\ndef find_release(client, tag):\n    releases = []\n    for page in range(1, 21):\n        values = client.api(\"GET\", \"/releases?per_page=100&page=\" + str(page))\n        require(isinstance(values, list) and len(values) <= 100)\n        releases.extend(values)\n        if len(values) < 100:\n            break\n    else:\n        raise ValueError(\"preview release inventory limit\")\n    ids = [positive(item.get(\"id\")) for item in releases]\n    require(len(ids) == len(set(ids)))\n    matches = [item for item in releases if item.get(\"tag_name\") == tag]\n    require(len(matches) <= 1)\n    return matches[0] if matches else None\n\n\ndef load_candidate(client, current, marker):\n    require(set(marker) == {\"schema\", \"source_sha\", \"run_id\", \"producer\", \"candidate\"}\n            and type(marker[\"schema\"]) is int and marker[\"schema\"] == 2\n            and marker[\"source_sha\"] == current[\"source_sha\"]\n            and marker[\"run_id\"] == current[\"source\"][\"run_id\"] and marker[\"producer\"] == current[\"producer\"])\n    candidate = marker[\"candidate\"]\n    require(set(candidate) == {\"source_artifact_id\", \"payload_artifact_id\"})\n    items = []\n    for key in (\"source_artifact_id\", \"payload_artifact_id\"):\n        identity = positive(candidate[key])\n        artifact = client.api(\"GET\", \"/actions/artifacts/\" + str(identity))\n        require(artifact.get(\"id\") == identity and artifact.get(\"expired\") is False\n                and artifact.get(\"workflow_run\", {}).get(\"id\") == marker[\"run_id\"]\n                and artifact.get(\"workflow_run\", {}).get(\"head_sha\") == current[\"source_sha\"])\n        items.append(artifact)\n    raw = artifact_files(client, items[0], {\"source-preview-metadata.json\": 65536})[\"source-preview-metadata.json\"]\n    original = metadata(raw)\n    attempt = original[\"source\"][\"run_attempt\"]\n    require(items[0].get(\"name\") == \"source-preview-source-\" + str(attempt)\n            and items[1].get(\"name\") == \"source-preview-qualified-payload-\" + str(attempt)\n            and original[\"producer\"] == marker[\"producer\"] and original[\"version\"] == current[\"version\"])\n    successful_job(client, current[\"source_sha\"], marker[\"run_id\"], attempt, \"Source preview publication / Admit source preview\")\n    payload = artifact_files(client, items[1], {PAYLOAD: MAX_PAYLOAD})[PAYLOAD]\n    require(len(payload) >= 20 and payload[:7] == b\"\\x7fELF\\x02\\x01\\x01\" and payload[18:20] == b\"\\x3e\\x00\")\n    return original, candidate, payload\n\n\ndef verify_pair(client, source, candidate, release_id, payload, receipt_bytes, bundle):\n    receipt = parse(receipt_bytes)\n    require(canonical(receipt) == receipt_bytes and set(receipt) == set(source) | {\"release_id\", \"candidate\", \"payload\", \"draft\", \"signer\"})\n    require(all(receipt[key] == value for key, value in source.items()))\n    require(receipt[\"candidate\"] == candidate and receipt[\"release_id\"] == release_id)\n    require(receipt[\"payload\"] == {\"target\": \"x86_64-unknown-linux-gnu\", \"name\": PAYLOAD, \"size\": len(payload), \"sha256\": digest(payload)})\n    origin = source[\"source\"]\n    for role in (\"draft\", \"signer\"):\n        run = receipt[role]\n        require(set(run) == set(origin) and all(run[key] == origin[key] for key in (\"workflow_path\", \"workflow_ref\", \"workflow_sha\", \"run_id\")))\n        positive(run[\"run_attempt\"])\n    require(origin[\"run_attempt\"] <= receipt[\"draft\"][\"run_attempt\"] <= receipt[\"signer\"][\"run_attempt\"] <= positive(int(os.environ[\"GITHUB_RUN_ATTEMPT\"])) <= 51)\n    for role, name in ((\"source\", \"Source preview publication / Admit source preview\"), (\"draft\", \"Source preview publication / Draft source preview\"), (\"signer\", \"Source preview publication / Attest source preview\")):\n        successful_job(client, source[\"source_sha\"], origin[\"run_id\"], receipt[role][\"run_attempt\"], name)\n    import source_preview_stage_verify as verifier\n    preview = {\"source_sha\": source[\"source_sha\"], \"signer_workflow_path\": WORKFLOW,\n               \"signer_run_id\": origin[\"run_id\"], \"signer_run_attempt\": receipt[\"signer\"][\"run_attempt\"],\n               \"receipt_sha256\": digest(receipt_bytes), \"payload_name\": PAYLOAD, \"payload_sha256\": digest(payload)}\n    verifier.verify_attestation(os.environ[\"PREVIEW_GH\"], receipt_bytes, bundle, preview, os.environ[\"RUNNER_TEMP\"], preview_authority())\n    return {\"receipt\": receipt_bytes, \"bundle\": bundle, \"signer_attempt\": receipt[\"signer\"][\"run_attempt\"]}\n\n\ndef prepare_pair(client, source, decision, payload):\n    require(set(decision) == {\"source\", \"candidate\", \"release_id\", \"payload\", \"draft\"} and decision[\"source\"] == source)\n    candidate = decision[\"candidate\"]\n    candidate_marker(source, candidate)\n    require(decision[\"payload\"] == {\"target\": \"x86_64-unknown-linux-gnu\", \"name\": PAYLOAD, \"size\": len(payload), \"sha256\": digest(payload)})\n    release_id = positive(decision[\"release_id\"])\n    item = client.api(\"GET\", \"/releases/\" + str(release_id))\n    require(item.get(\"id\") == release_id and item.get(\"tag_name\") == source[\"tag\"]\n            and item.get(\"body\") == candidate_marker(source, candidate) and item.get(\"prerelease\") is True\n            and type(item.get(\"draft\")) is bool)\n    pairs = []\n    if item[\"draft\"] is False:\n        receipt_bytes, bundle = released_pair(item, source)\n        pair = verify_pair(client, source, candidate, release_id, payload, receipt_bytes, bundle)\n        pair[\"origin\"] = \"release\"\n        pairs.append(pair)\n    else:\n        run_id = source[\"source\"][\"run_id\"]\n        artifacts = inventory(client, \"/actions/runs/\" + str(run_id) + \"/artifacts\", \"artifacts\", 20)\n        signed_names = [artifact.get(\"name\") for artifact in artifacts if re.fullmatch(r\"source-preview-signed-[1-9][0-9]*\", artifact.get(\"name\", \"\"))]\n        require(len(signed_names) == len(set(signed_names)))\n        for artifact in artifacts:\n            match = re.fullmatch(r\"source-preview-signed-([1-9][0-9]*)\", artifact.get(\"name\", \"\"))\n            if match is None:\n                continue\n            attempt = positive(int(match.group(1)))\n            require(attempt <= 51 and attempt <= positive(int(os.environ[\"GITHUB_RUN_ATTEMPT\"])))\n            require(artifact.get(\"workflow_run\", {}).get(\"id\") == run_id and artifact.get(\"workflow_run\", {}).get(\"head_sha\") == source[\"source_sha\"])\n            if artifact.get(\"expired\") is True:\n                continue\n            require(artifact.get(\"expired\") is False)\n            if successful_job(client, source[\"source_sha\"], run_id, attempt, \"Source preview publication / Attest source preview\", True) is None:\n                continue\n            files = artifact_files(client, artifact, {RECEIPT: 65536, BUNDLE: MAX_JSON})\n            parsed = parse(files[RECEIPT])\n            require(isinstance(parsed, dict) and canonical(parsed) == files[RECEIPT])\n            if parsed.get(\"candidate\") != candidate:\n                continue\n            pair = verify_pair(client, source, candidate, release_id, payload, files[RECEIPT], files[BUNDLE])\n            require(pair[\"signer_attempt\"] == attempt)\n            pair.update({\"origin\": \"artifact\", \"artifact_id\": artifact[\"id\"]})\n            pairs.append(pair)\n    selected = select_pair(item, pairs, payload)\n    if selected is None:\n        successful_job(client, source[\"source_sha\"], source[\"source\"][\"run_id\"], source[\"source\"][\"run_attempt\"], \"Source preview publication / Admit source preview\")\n        return {\"sign\": True}\n    return dict(selected, sign=False)\n\n\ndef released_pair(item, source):\n    import source_preview_bootstrap as bootstrap\n    require(item.get(\"draft\") is False and item.get(\"immutable\") is True)\n    entries = item.get(\"assets\")\n    require(isinstance(entries, list) and len(entries) == 3\n            and {entry.get(\"name\") for entry in entries} == {RECEIPT, BUNDLE, PAYLOAD})\n    prefix = \"https://github.com/\" + REPOSITORY + \"/releases/download/\" + source[\"tag\"] + \"/\"\n    transport = bootstrap.GitHubTransport(\"\")\n    result = []\n    for name, limit in ((RECEIPT, 65536), (BUNDLE, MAX_JSON)):\n        size, sha = bootstrap.asset_metadata(item, name, limit, prefix + name)\n        result.append(bootstrap.checked_asset(transport, prefix + name, size, sha, limit))\n    return result\n\n\ndef metadata(data):\n    value = parse(data)\n    source = os.environ[\"GITHUB_SHA\"]\n    tag = \"sdk-preview-\" + source\n    tag_ref = \"refs/tags/\" + tag\n    require(canonical(value) == data and re.fullmatch(\"[0-9a-f]{40}\", source))\n    require(os.environ.get(\"GITHUB_REPOSITORY\") == REPOSITORY and os.environ.get(\"GITHUB_EVENT_NAME\") == \"push\"\n            and os.environ.get(\"GITHUB_REF\") == tag_ref and os.environ.get(\"GITHUB_WORKFLOW_REF\") == REPOSITORY + \"/\" + WORKFLOW + \"@\" + tag_ref\n            and os.environ.get(\"GITHUB_WORKFLOW_SHA\") == source)\n    require(set(value) == {\"schema\", \"repository\", \"version\", \"source_sha\", \"tag\", \"source\", \"ci\", \"qualification\", \"producer\"})\n    require(type(value[\"schema\"]) is int and value[\"schema\"] == 2 and value[\"repository\"] == REPOSITORY\n            and value[\"source_sha\"] == source and value[\"tag\"] == tag\n            and isinstance(value[\"version\"], str) and re.fullmatch(r\"[0-9]+\\.[0-9]+\\.[0-9]+\", value[\"version\"]))\n    for key, path in ((\"source\", WORKFLOW), (\"ci\", \".github/workflows/ci.yml\"), (\"qualification\", \".github/workflows/source-qualification.yml\")):\n        run = value[key]\n        require(set(run) == {\"workflow_path\", \"workflow_ref\", \"workflow_sha\", \"run_id\", \"run_attempt\"})\n        ref = tag_ref if key == \"source\" else \"refs/heads/main\"\n        require(run[\"workflow_path\"] == path and run[\"workflow_ref\"] == REPOSITORY + \"/\" + path + \"@\" + ref\n                and run[\"workflow_sha\"] == source)\n        positive(run[\"run_id\"]); positive(run[\"run_attempt\"])\n    require(value[\"source\"][\"run_id\"] == positive(int(os.environ[\"GITHUB_RUN_ID\"]))\n            and value[\"source\"][\"run_attempt\"] <= positive(int(os.environ[\"GITHUB_RUN_ATTEMPT\"])) <= 51)\n    producer = value[\"producer\"]\n    require(set(producer) == {\"producer_run_id\", \"producer_run_attempt\", \"payload_artifact_id\", \"payload_archive_sha256\"})\n    for key in (\"producer_run_id\", \"producer_run_attempt\", \"payload_artifact_id\"):\n        positive(producer[key])\n    require(isinstance(producer[\"payload_archive_sha256\"], str)\n            and re.fullmatch(\"[0-9a-f]{64}\", producer[\"payload_archive_sha256\"]))\n    return value\n\n\nclass GitHub:\n    def __init__(self):\n        self.token = os.environ[\"GH_TOKEN\"]\n        self.deadline = time.monotonic() + 180\n\n    def request(self, method, host, path, data=None, content_type=\"application/json\", allowed=(200,)):\n        require(host in (\"api.github.com\", \"uploads.github.com\") and path.startswith(\"/repos/\" + REPOSITORY + \"/\"))\n        remaining = self.deadline - time.monotonic()\n        require(remaining > 0)\n        connection = http.client.HTTPSConnection(host, timeout=min(30, remaining), context=ssl.create_default_context())\n        try:\n            headers = {\"Accept\": \"application/vnd.github+json\", \"Authorization\": \"Bearer \" + self.token, \"User-Agent\": \"velnor-source-preview\", \"X-GitHub-Api-Version\": \"2022-11-28\"}\n            if data is not None:\n                headers[\"Content-Type\"] = content_type\n                headers[\"Content-Length\"] = str(len(data))\n            connection.request(method, path, body=data, headers=headers)\n            response = connection.getresponse()\n            require(response.status in allowed)\n            if response.status == 404:\n                return None\n            body = response.read(MAX_JSON + 1)\n            require(len(body) <= MAX_JSON and time.monotonic() < self.deadline)\n            return parse(body)\n        finally:\n            connection.close()\n\n    def api(self, method, suffix, data=None, allowed=(200,)):\n        return self.request(method, \"api.github.com\", \"/repos/\" + REPOSITORY + suffix, data, allowed=allowed)\n\n\n\ndef release(client, receipt, require_draft=True):\n    item = client.api(\"GET\", \"/releases/\" + str(positive(receipt[\"release_id\"])))\n    marker = candidate_marker(receipt, receipt[\"candidate\"])\n    require(item.get(\"id\") == receipt[\"release_id\"] and item.get(\"tag_name\") == receipt[\"tag\"] and item.get(\"body\") == marker and item.get(\"prerelease\") is True)\n    require(item.get(\"draft\") is require_draft)\n    return item\n\n\ndef existing_assets(item, expected, allow_unknown_bundle=False):\n    assets = item.get(\"assets\")\n    require(isinstance(assets, list) and len(assets) <= 3)\n    result = set()\n    for asset in assets:\n        name = asset.get(\"name\")\n        require(name in (RECEIPT, BUNDLE, PAYLOAD) and name not in result and asset.get(\"state\") == \"uploaded\")\n        if name in expected:\n            data = expected[name]\n            require(asset.get(\"size\") == len(data) and asset.get(\"digest\") == \"sha256:\" + digest(data))\n        else:\n            require(name == BUNDLE and allow_unknown_bundle)\n        result.add(name)\n    return result\n\n\ndef verify_tag(client, source):\n    tag = \"sdk-preview-\" + source\n    reference = client.api(\"GET\", \"/git/ref/tags/\" + tag)\n    obj = reference.get(\"object\", {})\n    oid = obj.get(\"sha\")\n    require(obj.get(\"type\") == \"tag\" and isinstance(oid, str) and re.fullmatch(\"[0-9a-f]{40}\", oid))\n    annotated = client.api(\"GET\", \"/git/tags/\" + oid)\n    require(annotated.get(\"tag\") == tag and annotated.get(\"object\", {}).get(\"type\") == \"commit\" and annotated.get(\"object\", {}).get(\"sha\") == source)\n    main = client.api(\"GET\", \"/git/ref/heads/main\").get(\"object\", {})\n    require(main.get(\"type\") == \"commit\" and isinstance(main.get(\"sha\"), str) and re.fullmatch(\"[0-9a-f]{40}\", main[\"sha\"]))\n    comparison = client.api(\"GET\", \"/compare/\" + source + \"...\" + main[\"sha\"])\n    require(comparison.get(\"status\") in (\"ahead\", \"identical\") and comparison.get(\"merge_base_commit\", {}).get(\"sha\") == source)\n\n\ndef publish_verified(client, source, receipt, receipt_bytes, bundle, payload):\n    expected = {RECEIPT: receipt_bytes, BUNDLE: bundle, PAYLOAD: payload}\n    state = client.api(\"GET\", \"/releases/\" + str(positive(receipt[\"release_id\"])))\n    if state.get(\"draft\") is False:\n        published = release(client, receipt, False)\n        require(published.get(\"immutable\") is True and existing_assets(published, expected) == set(expected))\n        return\n    present = existing_assets(release(client, receipt), expected)\n    for name, data in expected.items():\n        if name in present:\n            continue\n        item = client.request(\"POST\", \"uploads.github.com\", \"/repos/\" + REPOSITORY + \"/releases/\" + str(receipt[\"release_id\"]) + \"/assets?name=\" + name, data, \"application/octet-stream\", (201,))\n        require(item.get(\"name\") == name and item.get(\"size\") == len(data) and item.get(\"digest\") == \"sha256:\" + digest(data) and item.get(\"state\") == \"uploaded\")\n    item = release(client, receipt)\n    require(existing_assets(item, expected) == set(expected))\n    verify_tag(client, source[\"source_sha\"])\n    client.api(\"PATCH\", \"/releases/\" + str(receipt[\"release_id\"]), canonical({\"draft\": False}), allowed=(200,))\n    published = release(client, receipt, False)\n    require(published.get(\"immutable\") is True and existing_assets(published, expected) == set(expected))\n\n\ndef main():\n    preview_authority()\n    signal.signal(signal.SIGALRM, lambda *_: (_ for _ in ()).throw(TimeoutError(\"preview publication deadline\")))\n    signal.setitimer(signal.ITIMER_REAL, 180)\n    source = metadata(read_file(\"source-preview-metadata\", \"source-preview-metadata.json\", 65536))\n    payload = read_file(\"source-preview-payload\", PAYLOAD, MAX_PAYLOAD)\n    client = GitHub()\n    verify_tag(client, source[\"source_sha\"])\n    mode = os.environ[\"PREVIEW_MODE\"]\n    if mode == \"draft\":\n        successful_job(client, source[\"source_sha\"], source[\"source\"][\"run_id\"], source[\"source\"][\"run_attempt\"], \"Source preview publication / Admit source preview\")\n        candidate = {\"source_artifact_id\": positive(int(os.environ[\"SOURCE_ARTIFACT_ID\"])), \"payload_artifact_id\": positive(int(os.environ[\"PAYLOAD_ARTIFACT_ID\"]))}\n        item = find_release(client, source[\"tag\"])\n        if item is None:\n            marker = candidate_marker(source, candidate)\n            body = canonical({\"tag_name\": source[\"tag\"], \"target_commitish\": source[\"source_sha\"], \"name\": source[\"tag\"], \"body\": marker, \"draft\": True, \"prerelease\": True})\n            item = client.api(\"POST\", \"/releases\", body, allowed=(201,))\n        else:\n            body = item.get(\"body\")\n            prefix = \"velnor-source-preview:\"\n            require(isinstance(body, str) and body.startswith(prefix))\n            encoded = body[len(prefix):].encode()\n            original_marker = parse(encoded)\n            require(canonical(original_marker) == encoded)\n            source, candidate, payload = load_candidate(client, source, original_marker)\n            marker = candidate_marker(source, candidate)\n            require(body == marker)\n            verify_tag(client, source[\"source_sha\"])\n        decision = {\"source\": source, \"candidate\": candidate, \"release_id\": positive(item.get(\"id\")), \"payload\": {\"target\": \"x86_64-unknown-linux-gnu\", \"name\": PAYLOAD, \"size\": len(payload), \"sha256\": digest(payload)}, \"draft\": dict(source[\"source\"], run_attempt=positive(int(os.environ[\"GITHUB_RUN_ATTEMPT\"]))) }\n        current = client.api(\"GET\", \"/releases/\" + str(decision[\"release_id\"]))\n        require(current.get(\"id\") == decision[\"release_id\"] and current.get(\"tag_name\") == source[\"tag\"] and current.get(\"body\") == marker and current.get(\"prerelease\") is True and type(current.get(\"draft\")) is bool)\n        require(current.get(\"draft\") is True or current.get(\"immutable\") is True)\n        assets = current.get(\"assets\")\n        require(isinstance(assets, list) and len(assets) <= 3)\n        names = [asset.get(\"name\") for asset in assets]\n        require(len(names) == len(set(names)) and all(name in (RECEIPT, BUNDLE, PAYLOAD) for name in names))\n        for asset in assets:\n            require(asset.get(\"state\") == \"uploaded\")\n            if asset[\"name\"] == PAYLOAD:\n                require(asset.get(\"size\") == len(payload) and asset.get(\"digest\") == \"sha256:\" + digest(payload))\n        destination = Path(os.environ[\"RUNNER_TEMP\"]) / \"source-preview-decision.json\"\n        with destination.open(\"xb\") as output:\n            output.write(canonical(decision))\n        selected = prepare_pair(client, source, decision, payload)\n        verify_tag(client, source[\"source_sha\"])\n        with open(os.environ[\"GITHUB_OUTPUT\"], \"a\", encoding=\"utf-8\") as output:\n            output.write(\"source_artifact_id=\" + str(candidate[\"source_artifact_id\"]) + \"\\npayload_artifact_id=\" + str(candidate[\"payload_artifact_id\"]) + \"\\n\")\n            output.write(\"sign=\" + str(selected[\"sign\"]).lower() + \"\\n\")\n            if not selected[\"sign\"]:\n                output.write(\"pair_origin=\" + selected[\"origin\"] + \"\\n\")\n                output.write(\"pair_id=\" + str(selected.get(\"artifact_id\", decision[\"release_id\"])) + \"\\n\")\n                output.write(\"receipt_sha256=\" + digest(selected[\"receipt\"]) + \"\\nbundle_sha256=\" + digest(selected[\"bundle\"]) + \"\\n\")\n        return\n    if mode == \"prepare\":\n        decision_bytes = read_file(\"source-preview-decision\", \"source-preview-decision.json\", 65536)\n        decision = parse(decision_bytes)\n        require(canonical(decision) == decision_bytes)\n        require(set(decision) == {\"source\", \"candidate\", \"release_id\", \"payload\", \"draft\"} and decision[\"source\"] == source)\n        require(set(decision[\"draft\"]) == set(source[\"source\"])\n                and all(decision[\"draft\"][key] == source[\"source\"][key] for key in (\"workflow_path\", \"workflow_ref\", \"workflow_sha\", \"run_id\"))\n                and source[\"source\"][\"run_attempt\"] <= positive(decision[\"draft\"][\"run_attempt\"]) <= positive(int(os.environ[\"GITHUB_RUN_ATTEMPT\"])) <= 51)\n        require(decision[\"payload\"] == {\"target\": \"x86_64-unknown-linux-gnu\", \"name\": PAYLOAD, \"size\": len(payload), \"sha256\": digest(payload)})\n        candidate = {\"source_artifact_id\": positive(int(os.environ[\"SOURCE_ARTIFACT_ID\"])), \"payload_artifact_id\": positive(int(os.environ[\"PAYLOAD_ARTIFACT_ID\"]))}\n        require(decision[\"candidate\"] == candidate)\n        successful_job(client, source[\"source_sha\"], source[\"source\"][\"run_id\"], source[\"source\"][\"run_attempt\"], \"Source preview publication / Admit source preview\")\n        successful_job(client, source[\"source_sha\"], source[\"source\"][\"run_id\"], decision[\"draft\"][\"run_attempt\"], \"Source preview publication / Draft source preview\")\n        if os.environ[\"SIGN\"] == \"true\":\n            selected = {\"sign\": True, \"receipt\": finalize_receipt(decision, positive(int(os.environ[\"GITHUB_RUN_ATTEMPT\"])))}\n        else:\n            require(os.environ[\"SIGN\"] == \"false\")\n            if os.environ[\"PAIR_ORIGIN\"] == \"artifact\":\n                receipt_bytes, bundle = read_pair(\"source-preview-signed\")\n            else:\n                require(os.environ[\"PAIR_ORIGIN\"] == \"release\")\n                item = client.api(\"GET\", \"/releases/\" + str(positive(int(os.environ[\"PAIR_ID\"]))))\n                receipt_bytes, bundle = released_pair(item, source)\n            require(digest(receipt_bytes) == os.environ[\"RECEIPT_SHA256\"] and digest(bundle) == os.environ[\"BUNDLE_SHA256\"])\n            selected = verify_pair(client, source, candidate, decision[\"release_id\"], payload, receipt_bytes, bundle)\n            selected.update({\"sign\": False, \"origin\": os.environ[\"PAIR_ORIGIN\"], \"artifact_id\": positive(int(os.environ[\"PAIR_ID\"]))})\n        verify_tag(client, source[\"source_sha\"])\n        with (Path(os.environ[\"RUNNER_TEMP\"]) / RECEIPT).open(\"xb\") as output:\n            output.write(selected[\"receipt\"])\n        if not selected[\"sign\"]:\n            with (Path(os.environ[\"RUNNER_TEMP\"]) / BUNDLE).open(\"xb\") as output:\n                output.write(selected[\"bundle\"])\n        with open(os.environ[\"GITHUB_OUTPUT\"], \"a\", encoding=\"utf-8\") as output:\n            output.write(\"sign=\" + str(selected[\"sign\"]).lower() + \"\\n\")\n            if not selected[\"sign\"]:\n                output.write(\"pair_origin=\" + selected[\"origin\"] + \"\\n\")\n                output.write(\"pair_id=\" + str(selected.get(\"artifact_id\", decision[\"release_id\"])) + \"\\n\")\n                output.write(\"receipt_sha256=\" + digest(selected[\"receipt\"]) + \"\\nbundle_sha256=\" + digest(selected[\"bundle\"]) + \"\\n\")\n        return\n    require(mode == \"publish\")\n    if os.environ[\"PAIR_ORIGIN\"] == \"artifact\":\n        receipt_bytes, bundle = read_pair(\"source-preview-signed\")\n    else:\n        require(os.environ[\"PAIR_ORIGIN\"] == \"release\")\n        item = client.api(\"GET\", \"/releases/\" + str(positive(int(os.environ[\"PAIR_ID\"]))))\n        receipt_bytes, bundle = released_pair(item, source)\n    receipt = parse(receipt_bytes)\n    if os.environ[\"PAIR_ORIGIN\"] == \"release\":\n        require(digest(receipt_bytes) == os.environ[\"RECEIPT_SHA256\"] and digest(bundle) == os.environ[\"BUNDLE_SHA256\"])\n    candidate = {\"source_artifact_id\": positive(int(os.environ[\"SOURCE_ARTIFACT_ID\"])), \"payload_artifact_id\": positive(int(os.environ[\"PAYLOAD_ARTIFACT_ID\"]))}\n    verify_pair(client, source, candidate, positive(receipt[\"release_id\"]), payload, receipt_bytes, bundle)\n    publish_verified(client, source, receipt, receipt_bytes, bundle, payload)\n\n\nif __name__ == \"__main__\":\n    try:\n        main()\n    except (OSError, ValueError, KeyError, TypeError, TimeoutError, http.client.HTTPException, zipfile.BadZipFile):\n        print(\"source preview publication failed\", file=sys.stderr)\n        sys.exit(1)\n\nPY"
        id: prepare
      - name: Attest built artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: "${{ runner.temp }}/SDK_PREVIEW_RECEIPT.json\nsource-preview-payload/velnor-actions-x86_64-unknown-linux-gnu"
        id: attest
        if: ${{ steps.prepare.outputs.sign == 'true' }}
      - name: Retain exact preview bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        shell: bash
        run: "set -eu\ntest -f \"$BUNDLE_PATH\"\ntest ! -L \"$BUNDLE_PATH\"\ntest -s \"$BUNDLE_PATH\"\ntest ! -e \"$RUNNER_TEMP/SDK_PREVIEW_RECEIPT.json.sigstore.jsonl\"\ninstall -m 0400 \"$BUNDLE_PATH\" \"$RUNNER_TEMP/SDK_PREVIEW_RECEIPT.json.sigstore.jsonl\""
        if: ${{ steps.prepare.outputs.sign == 'true' }}
      - name: Retain exact signed pair
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: source-preview-signed-${{ github.run_attempt }}
          path: "${{ runner.temp }}/SDK_PREVIEW_RECEIPT.json\n${{ runner.temp }}/SDK_PREVIEW_RECEIPT.json.sigstore.jsonl"
          retention-days: 1
        if: ${{ steps.prepare.outputs.sign == 'true' }}
  source-preview-publish:
    name: Publish source preview
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
    needs:
      - source-preview-source
      - source-preview-draft
      - source-preview-attest
    if: ${{ github.event_name == 'push' && github.repository == 'tailrocks/velnor-new' && startsWith(github.ref, 'refs/tags/sdk-preview-') }}
    environment:
      name: generator-source-preview
    steps:
      - name: Download admitted source metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.source-preview-draft.outputs.source_artifact_id }}
          path: source-preview-metadata
      - name: Download exact qualified payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.source-preview-draft.outputs.payload_artifact_id }}
          path: source-preview-payload
      - name: Download exact signed pair
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.source-preview-attest.outputs.pair_id }}
          path: source-preview-signed
        if: ${{ needs.source-preview-attest.outputs.pair_origin == 'artifact' }}
      - name: Setup Mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
        with:
          version: 2026.11.1
          sha256: 7129dbab31d698f9028db9374f7ba7987232b0426f837dcbce437130a61415f9
          install: "false"
          env: "false"
          cache: "false"
          cache_save: "false"
      - name: Install pinned GitHub CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: "set -eu\n: \"${GITHUB_TOKEN:?missing workflow token}\"\nmise --no-config --no-env --no-hooks install gh@2.103.3"
      - name: Verify and publish preview
        env:
          AUTHORITY_REPOSITORY: ${{ job.workflow_repository }}
          AUTHORITY_PATH: ${{ job.workflow_file_path }}
          AUTHORITY_REF: ${{ job.workflow_ref }}
          AUTHORITY_SHA: ${{ job.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARTIFACT_ID: ${{ needs.source-preview-draft.outputs.source_artifact_id }}
          PAYLOAD_ARTIFACT_ID: ${{ needs.source-preview-draft.outputs.payload_artifact_id }}
          PAIR_ORIGIN: ${{ needs.source-preview-attest.outputs.pair_origin }}
          PAIR_ID: ${{ needs.source-preview-attest.outputs.pair_id }}
          RECEIPT_SHA256: ${{ needs.source-preview-attest.outputs.receipt_sha256 }}
          BUNDLE_SHA256: ${{ needs.source-preview-attest.outputs.bundle_sha256 }}
        shell: bash
        run: "set -eu\nmkdir -m 700 \"$RUNNER_TEMP/source-preview-support\"\ncat > \"$RUNNER_TEMP/source-preview-support/source_preview_bootstrap.py\" <<'BOOTSTRAP'\n# SPDX-FileCopyrightText: 2026 Alexey Zhokhov\n# SPDX-License-Identifier: Apache-2.0\n\nimport base64\nimport ctypes\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport secrets\nimport stat\nimport subprocess\nimport sys\nimport time\nimport tomllib\nimport urllib.error\nimport urllib.parse\nimport urllib.request\n\nREPOSITORY = \"tailrocks/velnor-new\"\nREPOSITORY_ID = 1390620900\nAPI = \"api.github.com\"\nRELEASE_HOSTS = {\"github.com\", \"objects.githubusercontent.com\", \"release-assets.githubusercontent.com\"}\nTARGET = \"x86_64-unknown-linux-gnu\"\nMAX_LOCK = 1_048_576\nMAX_JSON = 2_097_152\nMAX_RECEIPT = 65_536\nMAX_BUNDLE = 4_194_304\nMAX_PAYLOAD = 268_435_456\nHEX40 = re.compile(r\"[0-9a-f]{40}\\Z\")\nHEX64 = re.compile(r\"[0-9a-f]{64}\\Z\")\n\n\nclass AdmissionError(Exception):\n    pass\n\n\ndef require(condition):\n    if not condition:\n        raise AdmissionError(\"source_preview_admission_rejected\")\n\n\ndef sha40(value):\n    return isinstance(value, str) and HEX40.fullmatch(value) is not None\n\n\ndef hex64(value):\n    return isinstance(value, str) and HEX64.fullmatch(value) is not None\n\n\ndef number(value):\n    return isinstance(value, int) and not isinstance(value, bool) and value > 0\n\n\ndef unique_pairs(pairs):\n    result = {}\n    for key, value in pairs:\n        require(key not in result)\n        result[key] = value\n    return result\n\n\ndef parse_json(data, limit):\n    require(len(data) <= limit)\n    try:\n        return json.loads(data, object_pairs_hook=unique_pairs)\n    except (ValueError, UnicodeError) as error:\n        raise AdmissionError(\"source_preview_invalid_json\") from error\n\n\ndef parse_lock(data):\n    require(len(data) <= MAX_LOCK)\n    try:\n        return tomllib.loads(data.decode(\"utf-8\"))\n    except (ValueError, UnicodeError) as error:\n        raise AdmissionError(\"source_preview_invalid_lock\") from error\n\n\ndef read_regular(path, limit):\n    path = Path(path)\n    require(path.is_absolute())\n    for parent in (path, *path.parents):\n        metadata = os.lstat(parent)\n        require(not stat.S_ISLNK(metadata.st_mode))\n    fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)\n    try:\n        require(stat.S_ISREG(os.fstat(fd).st_mode))\n        with os.fdopen(fd, \"rb\", closefd=False) as file:\n            data = file.read(limit + 1)\n        require(len(data) <= limit)\n        return data\n    finally:\n        os.close(fd)\n\n\ndef workflow_tuple(record, prefix, path, source, git_ref):\n    require(record[f\"{prefix}_workflow_path\"] == path)\n    require(record[f\"{prefix}_workflow_ref\"] == f\"{REPOSITORY}/{path}@{git_ref}\")\n    require(record[f\"{prefix}_workflow_sha\"] == source)\n    require(number(record[f\"{prefix}_run_id\"]) and number(record[f\"{prefix}_run_attempt\"]))\n\n\ndef validate_preview(record, candidate):\n    require(isinstance(record, dict))\n    fixed = {\"schema\", \"repository\", \"version\", \"source_sha\", \"tag\", \"release_id\", \"payload_target\", \"payload_name\", \"payload_size\", \"payload_sha256\", \"receipt_sha256\", \"bundle_sha256\"}\n    runs = {f\"{prefix}_{suffix}\" for prefix in (\"source\", \"draft\", \"signer\", \"ci\", \"qualification\") for suffix in (\"workflow_path\", \"workflow_ref\", \"workflow_sha\", \"run_id\", \"run_attempt\")}\n    custody = {\"producer_run_id\", \"producer_run_attempt\", \"producer_payload_artifact_id\", \"producer_payload_archive_sha256\", \"candidate_source_artifact_id\", \"candidate_payload_artifact_id\", \"publisher_run_attempt\", \"publisher_job_id\"}\n    require(set(record) == fixed | runs | custody)\n    source = record[\"source_sha\"]\n    require(type(record[\"schema\"]) is int and record[\"schema\"] == 2 and record[\"repository\"] == REPOSITORY)\n    require(isinstance(record[\"version\"], str) and re.fullmatch(r\"[0-9]+\\.[0-9]+\\.[0-9]+\", record[\"version\"]) is not None)\n    require(sha40(source) and sha40(candidate) and source != candidate)\n    require(record[\"tag\"] == \"sdk-preview-\" + source and number(record[\"release_id\"]))\n    for role in (\"source\", \"draft\"):\n        workflow_tuple(record, role, \".github/workflows/product-release-generator.yml\", source, \"refs/tags/\" + record[\"tag\"])\n        require(record[role + \"_run_id\"] == record[\"signer_run_id\"])\n    require(all(number(record[key]) for key in (\"producer_run_id\", \"producer_run_attempt\", \"producer_payload_artifact_id\", \"candidate_source_artifact_id\", \"candidate_payload_artifact_id\", \"publisher_run_attempt\", \"publisher_job_id\")))\n    require(hex64(record[\"producer_payload_archive_sha256\"]))\n    require(record[\"candidate_source_artifact_id\"] != record[\"candidate_payload_artifact_id\"])\n    require(record[\"source_run_attempt\"] <= record[\"draft_run_attempt\"] <= record[\"signer_run_attempt\"] <= record[\"publisher_run_attempt\"] <= 51)\n    workflow_tuple(record, \"signer\", \".github/workflows/product-release-generator.yml\", source, \"refs/tags/\" + record[\"tag\"])\n    workflow_tuple(record, \"ci\", \".github/workflows/ci.yml\", source, \"refs/heads/main\")\n    workflow_tuple(record, \"qualification\", \".github/workflows/source-qualification.yml\", source, \"refs/heads/main\")\n    name = record[\"payload_name\"]\n    require(record[\"payload_target\"] == TARGET and isinstance(name, str))\n    require(name == \"velnor-actions-x86_64-unknown-linux-gnu\")\n    require(number(record[\"payload_size\"]) and record[\"payload_size\"] <= MAX_PAYLOAD)\n    require(all(hex64(record[key]) for key in (\"payload_sha256\", \"receipt_sha256\", \"bundle_sha256\")))\n\n\ndef event_binding(context, network):\n    event = context[\"event\"]\n    require(isinstance(event, dict) and context[\"repository\"] == REPOSITORY)\n    live_repository = network.api(f\"/repos/{REPOSITORY}\")\n    require(live_repository.get(\"id\") == REPOSITORY_ID and live_repository.get(\"full_name\") == REPOSITORY)\n    require(live_repository.get(\"default_branch\") == \"main\")\n    repository = event.get(\"repository\", {})\n    require(repository.get(\"full_name\") == REPOSITORY and repository.get(\"id\") == REPOSITORY_ID)\n    candidate = context[\"candidate\"]\n    require(sha40(candidate))\n    kind = context[\"event_name\"]\n    if kind == \"pull_request\":\n        pr = event.get(\"pull_request\", {})\n        base = pr.get(\"base\", {})\n        head = pr.get(\"head\", {})\n        require(number(event.get(\"number\")) and base.get(\"ref\") == \"main\")\n        require(base.get(\"repo\", {}).get(\"id\") == REPOSITORY_ID)\n        require(sha40(base.get(\"sha\")) and sha40(head.get(\"sha\")))\n        require(number(head.get(\"repo\", {}).get(\"id\")))\n        live = network.api(f\"/repos/{REPOSITORY}/pulls/{event['number']}\")\n        require(live.get(\"number\") == event[\"number\"] and live.get(\"state\") == \"open\")\n        require(live.get(\"base\", {}).get(\"sha\") == base[\"sha\"] and live.get(\"base\", {}).get(\"ref\") == \"main\")\n        require(live.get(\"base\", {}).get(\"repo\", {}).get(\"id\") == REPOSITORY_ID)\n        require(live.get(\"head\", {}).get(\"sha\") == head[\"sha\"])\n        require(live.get(\"head\", {}).get(\"repo\", {}).get(\"id\") == head.get(\"repo\", {}).get(\"id\"))\n        base_sha = base[\"sha\"]\n    elif kind == \"merge_group\":\n        group = event.get(\"merge_group\", {})\n        base_sha = group.get(\"base_sha\")\n        require(sha40(base_sha) and group.get(\"base_ref\") == \"refs/heads/main\")\n        require(group.get(\"head_sha\") == candidate and group.get(\"head_ref\") == context[\"ref\"])\n    elif kind == \"push\":\n        base_sha = event.get(\"before\")\n        require(sha40(base_sha) and context[\"ref\"] == \"refs/heads/main\")\n        require(event.get(\"after\") == candidate and event.get(\"deleted\") is False)\n    elif kind == \"workflow_dispatch\":\n        require(context[\"ref\"] == \"refs/heads/main\")\n        commit = network.api(f\"/repos/{REPOSITORY}/commits/{candidate}\")\n        parents = commit.get(\"parents\")\n        require(commit.get(\"sha\") == candidate and isinstance(parents, list) and len(parents) > 0)\n        base_sha = parents[0].get(\"sha\")\n        require(sha40(base_sha))\n    else:\n        raise AdmissionError(\"source_preview_unsupported_event\")\n    live_main = network.api(f\"/repos/{REPOSITORY}/commits/main\")\n    expected_main = base_sha if kind in (\"pull_request\", \"merge_group\") else candidate\n    require(live_main.get(\"sha\") == expected_main)\n    return base_sha\n\n\ndef read_github_lock(network, commit):\n    require(sha40(commit))\n    blob = network.api(f\"/repos/{REPOSITORY}/contents/.velnor/generator.lock?ref={commit}\")\n    require(blob.get(\"type\") == \"file\" and blob.get(\"encoding\") == \"base64\")\n    require(blob.get(\"path\") == \".velnor/generator.lock\" and number(blob.get(\"size\")) and blob[\"size\"] <= MAX_LOCK)\n    try:\n        raw = base64.b64decode(\"\".join(blob[\"content\"].split()), validate=True)\n    except (ValueError, KeyError) as error:\n        raise AdmissionError(\"source_preview_invalid_base_lock\") from error\n    require(len(raw) == blob[\"size\"])\n    return parse_lock(raw)\n\n\ndef approved_controller(context, network):\n    base_sha = event_binding(context, network)\n    candidate_lock = parse_lock(read_regular(context[\"lock_path\"], MAX_LOCK))\n    base_lock = read_github_lock(network, base_sha)\n    candidate_preview = candidate_lock.get(\"planner-preview\")\n    base_active = base_lock.get(\"planner-preview\")\n    if candidate_preview is None:\n        require(base_active is None)\n        return None, base_lock, base_sha\n    validate_preview(candidate_preview, context[\"candidate\"])\n    approved = [base_active, bas