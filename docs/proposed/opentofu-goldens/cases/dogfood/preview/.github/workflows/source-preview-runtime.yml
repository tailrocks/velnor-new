      - name: Verify protected runtime SDK
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_SOURCE: ${{ inputs.public_source }}
          PUBLIC_RUN_ID: ${{ inputs.public_run_id }}
          PUBLIC_RUN_ATTEMPT: ${{ inputs.public_run_attempt }}
        shell: bash
        run: "/usr/bin/python3 -I -S -c 'import hashlib,sys; sys.exit(hashlib.sha256(open(sys.argv[1], \"rb\").read()).hexdigest() != sys.argv[2])' \"$VELNOR_FIXED_SCRIPT_DIR/script.sh\" '1cabac46a8befa7e5e3a634cbe8451dcbcb9e17e798e49ef2987a8163a4b6fbf'\nexec \"$BASH\" --noprofile --norc -e -o pipefail \"$VELNOR_FIXED_SCRIPT_DIR/script.sh\""
