          ref: ${{ github.sha }}
          fetch-depth: "2"
          persist-credentials: "false"
      - name: Prepare external evidence directories
        if: always()
        shell: bash
        run: bash scripts/generator-release/source-qualification.sh prepare-external-evidence-directories
