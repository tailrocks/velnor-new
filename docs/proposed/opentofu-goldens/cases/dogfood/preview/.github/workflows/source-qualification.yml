        shell: bash
        run: bash scripts/generator-release/source-qualification.sh verify-exact-clean-source-checkout
      - name: Set up pinned Mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d
        with:
          version: 2026.10.21
          sha256: ccfe12d7a62c6fb9def2a20db1f210f13a51de881f21fd8c85db4b6312405d07
          install: "false"
          env: "false"
          cache: "false"
          cache_save: "false"
      - name: Read and verify repository tool pins
        shell: bash
        run: bash scripts/generator-release/source-qualification.sh read-and-verify-repository-tool-pins
      - name: Install pinned Rust and MBX
        shell: bash
        run: bash scripts/generator-release/source-qualification.sh install-pinned-rust-and-mbx
      - name: Record installed tool identities
        shell: bash
        run: bash scripts/generator-release/source-qualification.sh record-installed-tool-identities
      - name: Prefetch locked sources for qualification workspaces
        shell: bash
        run: bash scripts/generator-release/source-qualification.sh prefetch-locked-sources-for-qualification-workspaces
      - name: Build runner-native archive guard from this checkout
        shell: bash
        run: bash scripts/generator-release/source-qualification.sh build-runner-native-archive-guard-from-this-checkout
      - name: Install validator tools with native Mise checksums
        shell: bash
        run: bash scripts/generator-release/source-qualification.sh install-validator-tools-with-native-mise-checksums
      - name: Test validator tool lock admission
        shell: bash
        run: bash scripts/generator-release/source-qualification.sh test-validator-tool-lock-admission
      - name: Build source CLI with pinned MBX
        shell: bash
        run: bash scripts/generator-release/source-qualification.sh build-source-cli-with-pinned-mbx
      - name: Capture all five external goldens
        if: always()
        shell: bash
        run: bash scripts/generator-release/source-qualification.sh capture-all-five-external-goldens
      - name: Repeat check against external oracle
        if: always()
        shell: bash
        run: bash scripts/generator-release/source-qualification.sh repeat-check-against-external-oracle
      - name: Run full golden shell harness against external oracle
        if: always()
        shell: bash
        run: bash scripts/generator-release/source-qualification.sh run-full-golden-shell-harness-against-external-oracle
      - name: Run full golden shell harness with retained workspaces
        if: always()
        shell: bash
        run: bash scripts/generator-release/source-qualification.sh run-full-golden-shell-harness-with-retained-workspaces
      - name: Preserve output-binding JSON proof files
        if: always()
        shell: bash
        run: bash scripts/generator-release/source-qualification.sh preserve-output-binding-json-proof-files
      - name: Generate twice and retain root-to-preview identities
        if: always()
        shell: bash
        run: bash scripts/generator-release/source-qualification.sh generate-twice-and-retain-root-to-preview-identities
      - name: Test generated Rust verifier transport and digest gate
        if: always()
        shell: bash
        run: bash scripts/generator-release/source-qualification.sh test-generated-rust-verifier-transport-and-digest-gate
      - name: Check source output against checked-in repository goldens
        if: always()
        shell: bash
        run: bash scripts/generator-release/source-qualification.sh check-source-output-against-checked-in-repository-goldens
      - name: Bundle selected qualification evidence
        if: always()
        shell: bash
        run: bash scripts/generator-release/source-qualification.sh bundle-selected-qualification-evidence
      - name: Upload source qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-qualification-artifacts/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
