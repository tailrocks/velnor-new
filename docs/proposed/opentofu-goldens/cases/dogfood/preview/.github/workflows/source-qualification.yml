name: Source qualification
"on":
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: source-qualification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-qualification:
    name: Source qualification
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      MBX_GC_AUTO: "0"
      MISE_BACKENDS_JACTIONLINT: github:jdx/jactionlint
