elease-images.yml\" --signer-digest \"$authority_sha\" >/dev/null || fail 'asset attestation verification failed: assets/NOTICE'\ngh release verify-asset \"$prepare_tag\" \"$temp_dir/assets/SHA256SUMS\" --repo \"$repository\" >/dev/null || fail 'release asset verification failed: assets/SHA256SUMS'\ngh attestation verify \"$temp_dir/assets/SHA256SUMS\" --repo \"$repository\" --source-ref refs/heads/main --source-digest \"$source_sha\" --signer-workflow \"$repository/.github/workflows/product-release-images.yml\" --signer-digest \"$authority_sha\" >/dev/null || fail 'asset attestation verification failed: assets/SHA256SUMS'\nprintf 'action=complete\\n' >> \"$GITHUB_OUTPUT\"\n"
