        run: "# SPDX-FileCopyrightText: 2026 Alexey Zhokhov\n# SPDX-License-Identifier: Apache-2.0\n\nset -euo pipefail\n\nreadonly repository='tailrocks/velnor-new'\nreadonly source_sha=\"$VELNOR_SOURCE_SHA\"\nreadonly authority_sha=\"$VELNOR_WORKFLOW_AUTHORITY_SHA\"\nreadonly tag_prefix='runner'\nreadonly fixed_tag=''\nif [[ -n \"$fixed_tag\" ]]; then\n  prepare_tag=\"$fixed_tag\"\nelse\n  prepare_tag=\"${tag_prefix}-${source_sha}\"\nfi\nreadonly prepare_tag\nreadonly prepare_expected_assets='[\"RUNNER_IMAGE_MANIFEST.json\",\"LICENSE\",\"NOTICE\",\"SHA256SUMS\"]'\n\nfail() {\n  printf 'release reconciliation (runner images): %s\\n' \"$1\" >&2\n  exit 1\n}\n\n[[ \"$source_sha\" =~ ^[0-9a-f]{40}$ ]] || fail 'source SHA is malformed'\n[[ \"$authority_sha\" == \"$source_sha\" ]] || fail 'workflow authority differs from source'\n[[ -n \"$GH_TOKEN\" ]] || fail 'read-only GitHub token is missing'\n\ngh() {\n  (\n    mise --no-config --no-env --no-hooks exec gh@2.103.3 -- gh \"$@\" & _velnor_gh_pid=$!\n    ( sleep 60; kill -TERM \"$_velnor_gh_pid\" 2>/dev/null; sleep 5; kill -KILL \"$_velnor_gh_pid\" 2>/dev/null ) </dev/null >/dev/null 2>&1 & _velnor_gh_watch=$!\n    _velnor_gh_status=0\n    wait \"$_velnor_gh_pid\" || _velnor_gh_status=$?\n    kill -KILL \"$_velnor_gh_watch\" 2>/dev/null || true\n    wait \"$_velnor_gh_watch\" 2>/dev/null || true\n    exit \"$_velnor_gh_status\"\n  ) </dev/null\n}\nexport -f gh\n\nassert_tag_target() {\n  local reference tag_object object_type object_sha\n  reference=\"$(gh api \"repos/$repository/git/ref/tags/$prepare_tag\")\" \\\n    || fail 'release tag lookup failed'\n  object_type=\"$(jq -er '.object.type' <<<\"$reference\")\" \\\n    || fail 'release tag response is invalid'\n  object_sha=\"$(jq -er '.object.sha' <<<\"$reference\")\" \\\n    || fail 'release tag response is invalid'\n  if [[ \"$object_type\" == tag ]]; then\n    tag_object=\"$(gh api \"repos/$repository/git/tags/$object_sha\")\" \\\n      || fail 'annotated release tag lookup failed'\n    object_type=\"$(jq -er '.object.type' <<<\"$tag_object\")\" \\\n      || fail 'annotated release tag response is invalid'\n    object_sha=\"$(jq -er '.object.sha' <<<\"$tag_object\")\" \\\n      || fail 'annotated release tag response is invalid'\n  fi\n  [[ \"$object_type\" == commit && \"$object_sha\" == \"$release_commit\" ]] || fail 'tag does not resolve to the exact source commit'\n}\n\n# A fixed version tag is immutable and keeps the commit it was published from.\n# A later dispatch on an unchanged version therefore finds that release at an\n# earlier commit. Print `exact` or `earlier`; refuse any other relationship.\nclassify_release_commit() {\n  local relation\n  [[ \"$release_commit\" =~ ^[0-9a-f]{40}$ ]] || fail 'existing release target is not an exact commit'\n  if [[ \"$release_commit\" == \"$source_sha\" ]]; then\n    printf 'exact\\n'\n    return 0\n  fi\n  [[ -n \"$fixed_tag\" ]] || fail 'existing release target differs from the exact source commit'\n  relation=\"$(gh api \"repos/$repository/compare/$release_commit...$source_sha\" --jq '.status')\" \\\n    || fail 'release commit comparison failed'\n  [[ \"$relation\" == ahead ]] || fail \"published release commit is not an ancestor of the source (status: $relation)\"\n  printf 'earlier\\n'\n}\n\nreleases=\"$(gh api --paginate --slurp \"repos/$repository/releases?per_page=100\")\" \\\n  || fail 'release list request failed'\nmatches=\"$(jq -c --arg tag \"$prepare_tag\" '[.[][]? | select(.tag_name == $tag)]' <<<\"$releases\")\" \\\n  || fail 'release list response is invalid'\ncount=\"$(jq -r 'length' <<<\"$matches\")\" || fail 'release list match count is invalid'\ncase \"$count\" in\n  0)\n    refs=\"$(gh api --paginate --slurp \"repos/$repository/git/matching-refs/tags/$prepare_tag?per_page=100\")\" \\\n      || fail 'matching release tag lookup failed'\n    exact_ref=\"$(jq -r --arg ref \"refs/tags/$prepare_tag\" '[.[][]? | select(.ref == $ref)] | length' <<<\"$refs\")\" \\\n      || fail 'matching release tag response is invalid'\n    [[ \"$exact_ref\" == 0 ]] || fail 'tag exists without a published release; draft or orphan requires reconciliation'\n    printf 'action=build\\n' >> \"$GITHUB_OUTPUT\"\n    exit 0\n    ;;\n  1) ;;\n  *) fail 'multiple releases use the exact source tag' ;;\nesac\n\nrelease_commit=\"$(jq -r '.[0].target_commitish' <<<\"$matches\")\" \\\n  || fail 'release target response is invalid'\nrelease_scope=\"$(classify_release_commit)\"\n\njq -e \\\n  --arg tag \"$prepare_tag\" \\\n  --arg sha \"$release_commit\" \\\n  --argjson expected \"$prepare_expected_assets\" \\\n  '.[0] as $release\n   | $release.tag_name == $tag\n     and $release.target_commitish == $sha\n     and $release.draft == false\n     and $release.prerelease == false\n     and $release.immutable == true\n     and ([$release.assets[].name] | sort) == ($expected | sort)\n     and all($release.assets[];\n       .state == \"uploaded\"\n       and (.size | type == \"number\" and . > 0)\n       and (.digest | type == \"string\" and test(\"^sha256:[0-9a-f]{64}$\")))' \\\n  <<<\"$matches\" >/dev/null || fail 'existing release metadata, immutability, or asset set does not match'\nassert_tag_target\n\nif [[ \"$release_scope\" == earlier ]]; then\n  gh release verify \"$prepare_tag\" --repo \"$repository\" >/dev/null \\\n    || fail 'release signature verification failed'\n  printf '::warning title=Release %s already published::%s is immutable at %s; source %s is NOT released. Bump the version to publish it.\\n' \\\n    \"$prepare_tag\" \"$prepare_tag\" \"$release_commit\" \"$source_sha\"\n  printf 'Release %s already published at %s; source %s was not released (no-op). Bump the version to release it.\\n' \\\n    \"$prepare_tag\" \"$release_commit\" \"$source_sha\" >> \"${GITHUB_STEP_SUMMARY:-/dev/null}\"\n  printf 'action=complete\\n' >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\n\ntemp_dir=\"$(mktemp -d)\" || fail 'could not create release verification directory