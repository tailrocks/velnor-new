 printf -v \"$digest_name\" '%s' \"$digest\"\n}\n\nstrict_sidecar_digest() {\n  local sidecar=\"$1\" binary=\"$2\"\n  awk -v expected=\"$binary\" '\n    NR == 1 {\n      if (NF != 2 || length($1) != 64 || $1 !~ /^[0-9a-f]+$/ || $2 != expected) exit 1\n      print $1\n      next\n    }\n    { exit 1 }\n    END { if (NR != 1) exit 1 }\n  ' \"$sidecar\"\n}\n\nverify_asset x86_64-unknown-linux-gnu linux-assets linux_sha256\nverify_asset aarch64-apple-darwin macos-assets macos_arm64_sha256\nverify_asset x86_64-apple-darwin macos-intel-assets macos_x86_64_sha256\n\ntag=\"v${version}\"\njq -n --arg version \"$version\" --arg repository \"$repository\" \\\n  --arg commit \"$GITHUB_SHA\" --arg tag \"$tag\" \\\n  --arg linux_sha256 \"$linux_sha256\" --arg macos_arm64_sha256 \"$macos_arm64_sha256\" \\\n  --arg macos_x86_64_sha256 \"$macos_x86_64_sha256\" '\n  {schema:1, version:$version, repository:$repository, commit:$commit,\n   targets:[\n     {target:\"x86_64-unknown-linux-gnu\",\n      artifact:(\"https://github.com/\" + $repository + \"/releases/download/\" + $tag + \"/velnor-actions-\" + $version + \"-x86_64-unknown-linux-gnu\"),\n      sha256:$linux_sha256},\n     {target:\"aarch64-apple-darwin\",\n      artifact:(\"https://github.com/\" + $repository + \"/releases/download/\" + $tag + \"/velnor-actions-\" + $version + \"-aarch64-apple-darwin\"),\n      sha256:$macos_arm64_sha256},\n     {target:\"x86_64-apple-darwin\",\n      artifact:(\"https://github.com/\" + $repository + \"/releases/download/\" + $tag + \"/velnor-actions-\" + $version + \"-x86_64-apple-darwin\"),\n      sha256:$macos_x86_64_sha256}\n   ]}\n' > release-manifest.json\njq -e --arg version \"$version\" --arg repository \"$repository\" \\\n  --arg commit \"$GITHUB_SHA\" --arg tag \"$tag\" \\\n  '.schema == 1 and .version == $version and .repository == $repository and\n   .commit == $commit and (.targets | length) == 3 and\n   .targets[0].target == \"x86_64-unknown-linux-gnu\" and\n   .targets[0].artifact == (\"https://github.com/\" + $repository + \"/releases/download/\" + $tag + \"/velnor-actions-\" + $version + \"-x86_64-unknown-linux-gnu\") and\n   (.targets[0].sha256 | test(\"^[0-9a-f]{64}$\")) and\n   .targets[1].target == \"aarch64-apple-darwin\" and\n   .targets[1].artifact == (\"https://github.com/\" + $repository + \"/releases/download/\" + $tag + \"/velnor-actions-\" + $version + \"-aarch64-apple-darwin\") and\n   (.targets[1].sha256 | test(\"^[0-9a-f]{64}$\")) and\n   .targets[2].target == \"x86_64-apple-darwin\" and\n   .targets[2].artifact == (\"https://github.com/\" + $repository + \"/releases/download/\" + $tag + \"/velnor-actions-\" + $version + \"-x86_64-apple-darwin\") and\n   (.targets[2].sha256 | test(\"^[0-9a-f]{64}$\"))' \\\n  release-manifest.json >/dev/null\ntest -s release-manifest.json\n\nVELNOR_CREATE_RELEASE_MANIFEST\ncmp release-manifest.json manifest-assets/release-manifest.json"
      - name: Attest built artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: manifest-assets/release-manifest.json
      - name: Fetch and verify manifest attestation bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: "gh() {\n  (\n    mise --no-config --no-env --no-hooks exec 'gh@'\"$VELNOR_RELEASE_GH_VERSION\" -- gh \"$@\" & _velnor_gh_pid=$!\n    ( sleep 60; kill -TERM \"$_velnor_gh_pid\" 2>/dev/null; sleep 5; kill -KILL \"$_velnor_gh_pid\" 2>/dev/null ) </dev/null >/dev/null 2>&1 & _velnor_gh_watch=$!\n    _velnor_gh_status=0\n    wait \"$_velnor_gh_pid\" || _velnor_gh_status=$?\n    kill -KILL \"$_velnor_gh_watch\" 2>/dev/null || true\n    wait \"$_velnor_gh_watch\" 2>/dev/null || true\n    exit \"$_velnor_gh_status\"\n  ) </dev/null\n}\nexport -f gh\nset -eu\ntest \"$GITHUB_WORKFLOW_SHA\" = \"$GITHUB_SHA\"\nmkdir -p release-attestations\ntest \"$GITHUB_WORKFLOW_SHA\" = \"$GITHUB_SHA\"\nsubject='manifest-assets/release-manifest.json'\ndigest=\"$(if command -v sha256sum >/dev/null 2>&1; then\n  sha256sum \"$subject\" | awk 'NR == 1 { print $1; next } { exit 1 } END { if (NR != 1) exit 1 }'\nelif command -v shasum >/dev/null 2>&1; then\n  shasum -a 256 \"$subject\" | awk 'NR == 1 { print $1; next } { exit 1 } END { if (NR != 1) exit 1 }'\nelse\n  echo 'no SHA-256 utility is available' >&2\n  exit 1\nfi)\"\ntest \"${#digest}\" -eq 64\ncase \"$digest\" in *[!0123456789abcdef]*|'') exit 1 ;; esac\nbundle=\"sha256:${digest}.jsonl\"\ntest ! -e \"$bundle\"\ndownloaded=false\nfor attempt in 1 2 3 4 5; do\n  if gh attestation download \"$subject\" --repo \"$GITHUB_REPOSITORY\" --predicate-type https://slsa.dev/provenance/v1 --limit 10 && test -s \"$bundle\"; then downloaded=true; break; fi\n  if test \"$attempt\" -lt 5; then sleep 3; fi\ndone\ntest \"$downloaded\" = true\ngh attestation verify \"$subject\" --repo \"$GITHUB_REPOSITORY\" --bundle \"$bundle\" --source-digest \"$GITHUB_SHA\" --source-ref refs/heads/main --signer-workflow \"${GITHUB_REPOSITORY}/.github/workflows/product-release-generator.yml\" --signer-digest \"$GITHUB_SHA\" > /dev/null\nmv \"$bundle\" \"release-attestations/release-manifest.json.intoto.jsonl\""
      - name: Upload verified manifest attestation bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: generator-release-manifest-attestations
          path: release-attestations/release-manifest.json.intoto.jsonl
          retention-days: 1
  publish-generator:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
    environment:
      name: generator-release
    needs:
      - verify-release-caller
      - attest-linux
      - attest-macos
      - attest-macos-intel
      - attest-manifest
      - qualify-homebrew-macos
      - candidate-manifest
      - build-linux
      - build-macos
      - build-macos-intel
    if: always() && inputs.release_action == 'build' && needs.attest-linux.result == 'success' && needs.attest-macos.result == 'success' && needs.attest-macos-intel.result == 'success' && needs.attest-manifest.result == 'success' && needs.qualify-homebrew-macos.result == 'success'
    env:
      VELNOR_RELEASE_RUST_VERSION: ${{ needs.candidate-manifest.outputs.rust_version }}
      VELNOR_RELEASE_MR_BOXINGTON_VERSION: ${{ needs.candidate-manifest.outputs.mr_boxington_version }}
      VELNOR_RELEASE_GH_VERSION: ${{ needs.candidate-manifest.outputs.gh_version }}
    steps:
      - name: Setup Mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d
        with:
          version: 2026.10.21
          sha256: ccfe12d7a62c6fb9def2a20db1f210f13a51de881f21fd8c85db4b6312405d07
          install: "false"
          env: "false"
          cache: "false"
          cache_save: "false"
      - name: Validate source-bound GitHub CLI version
        shell: bash
        run: "set -eu\nexact_semver='^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$'\n[[ \"${VELNOR_RELEASE_GH_VERSION:-}\" =~ $exact_semver ]] || exit 1"
      - name: Install source-bound GitHub CLI
