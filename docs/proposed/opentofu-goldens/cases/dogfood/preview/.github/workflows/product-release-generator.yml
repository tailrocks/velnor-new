          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: "set -eu\nenv -i PATH=/usr/bin:/bin GH_TOKEN=\"$GH_TOKEN\" GITHUB_SHA=\"$GITHUB_SHA\" GITHUB_REPOSITORY=\"$GITHUB_REPOSITORY\" GITHUB_EVENT_NAME=\"$GITHUB_EVENT_NAME\" GITHUB_REF=\"$GITHUB_REF\" GITHUB_WORKFLOW_REF=\"$GITHUB_WORKFLOW_REF\" GITHUB_WORKFLOW_SHA=\"$GITHUB_WORKFLOW_SHA\" GITHUB_ACTOR_ID=\"$GITHUB_ACTOR_ID\" GITHUB_TRIGGERING_ACTOR=\"$GITHUB_TRIGGERING_ACTOR\" GITHUB_RUN_ID=\"$GITHUB_RUN_ID\" GITHUB_RUN_ATTEMPT=\"$GITHUB_RUN_ATTEMPT\" RUNNER_TEMP=\"$RUNNER_TEMP\" GITHUB_OUTPUT=\"$GITHUB_OUTPUT\" SDK_PREVIEW_VERSION='0.1.77' /usr/bin/python3 -I -S - <<'PY'\n# SPDX-FileCopyrightText: 2026 Alexey Zhokhov\n# SPDX-License-Identifier: Apache-2.0\n\nimport hashlib\nimport http.client\nimport io\nimport os\nfrom pathlib import Path\nimport re\nimport ssl\nimport stat\nimport time\nfrom urllib.parse import urlsplit\nimport zipfile\n\n\ndef download_verified_payload(client, artifact, output_path):\n    name = \"velnor-actions-x86_64-unknown-linux-gnu\"\n    limit = 256 * 1024 * 1024\n    archive_limit = 257 * 1024 * 1024\n    identity = artifact.get(\"id\")\n    size = artifact.get(\"size_in_bytes\")\n    expected = artifact.get(\"digest\")\n    if (type(identity) is not int or identity <= 0 or type(size) is not int\n            or not 0 < size <= archive_limit or not isinstance(expected, str)\n            or not re.fullmatch(r\"sha256:[0-9a-f]{64}\", expected)):\n        raise ValueError(\"preview artifact metadata\")\n    host = \"api.github.com\"\n    path = \"/repos/tailrocks/velnor-new/actions/artifacts/\" + str(identity) + \"/zip\"\n    authorized = True\n    for _ in range(4):\n        remaining = client.deadline - time.monotonic()\n        if remaining <= 0:\n            raise TimeoutError(\"preview artifact deadline\")\n        connection = http.client.HTTPSConnection(host, timeout=min(30, remaining), context=ssl.create_default_context())\n        try:\n            headers = {\"Accept\": \"application/vnd.github+json\", \"User-Agent\": \"velnor-source-preview\"}\n            if authorized:\n                headers[\"Authorization\"] = \"Bearer \" + client.token\n            connection.request(\"GET\", path, headers=headers)\n            response = connection.getresponse()\n            if response.status in (301, 302, 303, 307, 308):\n                redirect = urlsplit(response.getheader(\"Location\", \"\"))\n                if (redirect.scheme != \"https\" or not redirect.hostname\n                        or not re.fullmatch(r\"productionresultssa[0-9]+\\.blob\\.core\\.windows\\.net\", redirect.hostname)\n                        or redirect.username is not None or redirect.password is not None\n                        or redirect.port not in (None, 443) or redirect.fragment):\n                    raise ValueError(\"preview artifact redirect\")\n                host = redirect.hostname\n                path = redirect.path + (\"?\" + redirect.query if redirect.query else \"\")\n                authorized = False\n                continue\n            if response.status != 200 or authorized:\n                raise ValueError(\"preview artifact response\")\n            data = bytearray()\n            while len(data) <= archive_limit:\n                remaining = client.deadline - time.monotonic()\n                if remaining <= 0:\n                    raise TimeoutError(\"preview artifact deadline\")\n                if connection.sock is not None:\n                    connection.sock.settimeout(min(30, remaining))\n                chunk = response.read(min(65536, archive_limit + 1 - len(data)))\n                if not chunk:\n                    break\n                data.extend(chunk)\n            if len(data) != size or len(data) > archive_limit or \"sha256:\" + hashlib.sha256(data).hexdigest() != expected:\n                raise ValueError(\"preview artifact archive identity\")\n            break\n        finally:\n            connection.close()\n    else:\n        raise ValueError(\"preview artifact redirect limit\")\n    with zipfile.ZipFile(io.BytesIO(data)) as archive:\n        entries = archive.infolist()\n        if (len(entries) != 1 or entries[0].filename != name or entries[0].flag_bits & 1\n                or not stat.S_ISREG(entries[0].external_attr >> 16)\n                or entries[0].compress_type not in (zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED)\n                or not 20 <= entries[0].file_size <= limit):\n            raise ValueError(\"preview artifact ZIP entry\")\n        payload = archive.read(entries[0])\n    if (len(payload) != entries[0].file_size or payload[:7] != b\"\\x7fELF\\x02\\x01\\x01\"\n            or payload[18:20] != b\"\\x3e\\x00\"):\n        raise ValueError(\"preview artifact ELF\")\n    path = Path(output_path)\n    descriptor = os.open(path, os.O_CREAT | os.O_EXCL | os.O_WRONLY | os.O_NOFOLLOW, 0o500)\n    try:\n        with os.fdopen(descriptor, \"wb\") as output:\n            os.fchmod(output.fileno(), 0o500)\n            output.write(payload)\n    except BaseException:\n        path.unlink(missing_ok=True)\n        raise\n    return {\"target\": \"x86_64-unknown-linux-gnu\", \"name\": name, \"size\": len(payload), \"sha256\": hashlib.sha256(payload).hexdigest()}\n\n# SPDX-FileCopyrightText: 2026 Alexey Zhokhov\n# SPDX-License-Identifier: Apache-2.0\n\nfrom datetime import datetime, timezone\n\nOWNER_ID = 139017\nOWNER_LOGIN = \"donbeave\"\nCREATION_RULESET = 26696396\nIMMUTABLE_TAG_RULESET = 24397132\nPRECHECK_SECONDS = 900\n\n\ndef verify_tag_rules(client):\n    path = \"/repos/\" + REPOSITORY + \"/rulesets/\"\n    creation = client.get(path + str(CREATION_RULESET))\n    frozen = client.get(path + str(IMMUTABLE_TAG_RULESET))\n    for record in (creation, frozen):\n        if record.get(\"target\") != \"tag\" or record.get(\"enforcement\") != \"active\":\n            raise ValueError(\"SDK preview tag protection disabled\")\n    expected_actor = [{\"actor_id\": OWNER_ID, \"actor_type\": \"User\", \"bypass_mode\": \"always\"}]\n    if (creation.get(\"id\") != CREATION_RULESET\n            or creation.get(\"bypass_actors\") != expected_actor\n            or creation.get(\"conditions\", {}).get(\"ref_name\") != {\n                \"include\": [\"refs/tags/sdk-preview-*\"], \"exclude\": []}\n            or {entry.get(\"type\") for entry in creation.get(\"rules\", [])} != {\"creation\"}):\n        raise ValueError(\"SDK preview tag creation authority\")\n    if (frozen.get(\"id\") != IMMUTABLE_TAG_RULESET or frozen.get(\"bypass_actors\") != []\n            or frozen.get(\"conditions\", {}).get(\"ref_name\") != {\"include\": [\"~ALL\"], \"exclude\": []}\n            or not {\"update\", \"deletion\"}.issubset(\n                {entry.get(\"type\") for entry in frozen.get(\"rules\", [])})):\n        raise ValueError(\"SDK preview tag immutability\")\n\n\ndef checked_time(value):\n    if not isinstance(value, str) or not re.fullmatch(r\"\\d{4}-\\d\\d-\\d\\dT\\d\\d:\\d\\d:\\d\\dZ\", value):\n        raise ValueError(\"SDK preview precheck timestamp\")\n    return datetime.strptime(value, \"%Y-%m-%dT%H:%M:%SZ\").replace(tzinfo=timezone.utc)\n\n\ndef annotation(message, source, tagger_date, now):\n    if not isinstance(message, str) or len(message.encode()) > 8192:\n        raise ValueError(\"SDK preview annotation size\")\n    record = json.loads(message, object_pairs_hook=unique_object)\n    keys = {\"schema\", \"repository\", \"artifact\", \"source_sha\", \"version\", \"producer_run_id\",\n            \"producer_run_attempt\", \"payload_artifact_id\", \"payload_archive_sha256\", \"immutability\"}\n    canonical = json.dumps(record, sort_keys=True, separators=(\",\", \":\"))\n    if set(record) != keys or message not in (canonical, canonical + \"\\n\"):\n        raise ValueError(\"SDK preview annotation shape\")\n    if (type(record[\"schema\"]) is not int or record[\"schema\"] != 1\n            or record[\"repository\"] != REPOSITORY or record[\"artifact\"] != \"generator\"\n            or record[\"source_sha\"] != source or record[\"version\"] != os.environ[\"SDK_PREVIEW_VERSION\"]):\n        raise ValueError(\"SDK preview annotation identity\")\n    for key in (\"producer_run_id\", \"producer_run_attempt\", \"payload_artifact_id\"):\n        positive(record[key])\n    if not re.fullmatch(\"[0-9a-f]{64}\", record[\"payload_archive_sha256\"]):\n        raise ValueError(\"SDK preview annotated archive digest\")\n    precheck = record[\"immutability\"]\n    if not isinstance(precheck, dict) or set(precheck) != {\"enabled\", \"checked_at\"} or precheck[\"enabled\"] is not True:\n        raise ValueError(\"SDK preview owner immutability precheck\")\n    checked = checked_time(precheck[\"checked_at\"])\n    tag_time = datetime.fromisoformat(tagger_date.replace(\"Z\", \"+00:00\"))\n    if (tag_time.utcoffset() != timezone.utc.utcoffset(tag_time)\n            or not 0 <= (tag_time - checked).total_seconds() <= 60\n            or not 0 <= (now - checked).total_seconds() <= PRECHECK_SECONDS):\n        raise ValueError(\"SDK preview owner precheck expired\")\n    return record\n\n\ndef tag_reference(client, source):\n    tag = \"sdk-preview-\" + source\n    reference = client.get(\"/repos/\" + REPOSITORY + \"/git/ref/tags/\" + tag)\n    target = reference.get(\"object\", {})\n    if (reference.get(\"ref\") != \"refs/tags/\" + tag or target.get(\"type\") != \"tag\"\n            or not re.fullmatch(\"[0-9a-f]{40}\", target.get(\"sha\", \"\"))):\n        raise ValueError(\"SDK preview annotated tag required\")\n    return target[\"sha\"]\n\n\ndef verify_default_ancestry(client, source):\n    main = client.get(\"/repos/\" + REPOSITORY + \"/git/ref/heads/main\").get(\"object\", {})\n    if main.get(\"type\") != \"commit\" or not re.fullmatch(\"[0-9a-f]{40}\", main.get(\"sha\", \"\")):\n        raise ValueError(\"SDK preview protected main identity\")\n    comparison = client.get(\"/repos/\" + REPOSITORY + \"/compare/\" + source + \"...\" + main[\"sha\"])\n    if (comparison.get(\"status\") not in (\"ahead\", \"identical\")\n            or comparison.get(\"merge_base_commit\", {}).get(\"sha\") != source):\n        raise ValueError(\"SDK preview source outside protected main\")\n\n\ndef admit_tag(client, source, now):\n    tag = \"sdk-preview-\" + source\n    expected_ref = REPOSITORY + \"/\" + WORKFLOW + \"@refs/tags/\" + tag\n    if (not re.fullmatch(\"[0-9a-f]{40}\", source)\n            or os.environ.get(\"GITHUB_REPOSITORY\") != REPOSITORY\n            or os.environ.get(\"GITHUB_EVENT_NAME\") != \"push\"\n            or os.environ.get(\"GITHUB_REF\") != \"refs/tags/\" + tag\n            or os.environ.get(\"GITHUB_WORKFLOW_REF\") != expected_ref\n            or os.environ.get(\"GITHUB_WORKFLOW_SHA\") != source\n            or os.environ.get(\"GITHUB_ACTOR_ID\") != str(OWNER_ID)\n            or os.environ.get(\"GITHUB_TRIGGERING_ACTOR\") != OWNER_LOGIN):\n        raise ValueError(\"SDK preview tag push authority\")\n    owner = client.get(\"/users/\" + OWNER_LOGIN)\n    if owner.get(\"id\") != OWNER_ID or owner.get(\"login\") != OWNER_LOGIN:\n        raise ValueError(\"SDK preview rerun authority\")\n    verify_tag_rules(client)\n    tag_sha = tag_reference(client, source)\n    value = client.get(\"/repos/\" + REPOSITORY + \"/git/tags/\" + tag_sha)\n    if (value.get(\"sha\") != tag_sha or value.get(\"tag\") != tag\n            or value.get(\"object\") != {\"type\": \"commit\", \"sha\": source,\n                                        \"url\": \"https://api.github.com/repos/\" + REPOSITORY + \"/git/commits/\" + source}):\n        raise ValueError(\"SDK preview tag source\")\n    proof = annotation(value.get(\"message\"), source, value.get(\"tagger\", {}).get(\"date\", \"\"), now)\n    verify_default_ancestry(client, source)\n    return proof, tag_sha, expected_ref\n\n# SPDX-FileCopyrightText: 2026 Alexey Zhokhov\n# SPDX-License-Identifier: Apache-2.0\n\nimport base64\nimport http.client\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport signal\nimport ssl\nimport sys\nimport tempfile\nimport time\nimport tomllib\n\nREPOSITORY = \"tailrocks/velnor-new\"\nWORKFLOW = \".github/workflows/product-release-generator.yml\"\nLIMIT = 2 * 1024 * 1024\n\n\nclass GitHub:\n    def __init__(self):\n        self.deadline = time.monotonic() + 120\n        self.token = os.environ[\"GH_TOKEN\"]\n\n    def get(self, path):\n        remaining = self.deadline - time.monotonic()\n        if remaining <= 0 or not (path.startswith(\"/repos/\" + REPOSITORY + \"/\")\n                                  or path == \"/users/donbeave\"):\n            raise ValueError(\"source preview API boundary\")\n        connection = http.client.HTTPSConnection(\n            \"api.github.com\", timeout=min(30, remaining),\n            context=ssl.create_default_context(),\n        )\n        try:\n            connection.request(\"GET\", path, headers={\n                \"Accept\": \"application/vnd.github+json\",\n                \"Authorization\": \"Bearer \" + self.token,\n                \"User-Agent\": \"velnor-source-preview\",\n            })\n            response = connection.getresponse()\n            if response.status != 200:\n                raise ValueError(\"source preview API response\")\n            body = bytearray()\n            while True:\n                remaining = self.deadline - time.monotonic()\n                if remaining <= 0:\n                    raise ValueError(\"source preview API deadline\")\n                if connection.sock is not None:\n                    connection.sock.settimeout(min(30, remaining))\n                chunk = response.read(min(65536, LIMIT + 1 - len(body)))\n                if not chunk:\n                    break\n                body.extend(chunk)\n                if len(body) > LIMIT:\n                    raise ValueError(\"source preview API size\")\n            return json.loads(body, object_pairs_hook=unique_object)\n        finally:\n            connection.close()\n\n\ndef unique_object(pairs):\n    result = {}\n    for name, value in pairs:\n        if name in result:\n            raise ValueError(\"source preview duplicate JSON field\")\n        result[name] = value\n    return result\n\n\ndef positive(value):\n    if type(value) is not int or not 0 < value <= 9007199254740991:\n        raise ValueError(\"source preview integer\")\n    return value\n\n\ndef verify_jobs(client, run, expected):\n    result = client.get(\n        \"/repos/\" + REPOSITORY + \"/actions/runs/\" + str(positive(run.get(\"id\")))\n        + \"/attempts/\" + str(positive(run.get(\"run_attempt\")))\n        + \"/jobs?per_page=100\"\n    )\n    jobs = result.get(\"jobs\")\n    if (not isinstance(jobs, list) or not jobs or len(jobs) >= 100\n            or result.get(\"total_count\") != len(jobs)):\n        raise ValueError(\"source preview job inventory\")\n    ids = [positive(job.get(\"id\")) for job in jobs]\n    if len(set(ids)) != len(ids):\n        raise ValueError(\"source preview duplicate job\")\n    for name in expected:\n        matches = [job for job in jobs if job.get(\"name\") == name]\n        if len(matches) != 1:\n            raise ValueError(\"source preview required job missing\")\n        job = matches[0]\n        if (job.get(\"status\") != \"completed\" or job.get(\"conclusion\") != \"success\"\n                or job.get(\"run_id\") != run[\"id\"]\n                or job.get(\"head_sha\") != run[\"head_sha\"]):\n            raise ValueError(\"source preview required job failed\")\n\n\ndef successful_run(client, source, path, event, expected):\n    result = client.get(\n        \"/repos/\" + REPOSITORY + \"/actions/workflows/\" + path.rsplit(\"/\", 1)[1]\n        + \"/runs?head_sha=\" + source + \"&event=\" + event\n        + \"&status=success&per_page=20\"\n    )\n    runs = result.get(\"workflow_runs\")\n    if not isinstance(runs, list) or not runs or len(runs) > 20:\n        raise ValueError(\"source preview qualification missing\")\n    accepted = []\n    for run in runs:\n        reference = run.get(\"path\", \"\").split(\"@\", 1)\n        if (run.get(\"head_sha\") == source and run.get(\"head_branch\") == \"main\"\n                and run.get(\"event\") == event and run.get(\"status\") == \"completed\"\n                and run.get(\"conclusion\") == \"success\"\n                and reference[0] == path\n                and (len(reference) == 1 or reference[1] in (\"main\", \"refs/heads/main\"))\n                and run.get(\"head_repository\", {}).get(\"full_name\") == REPOSITORY):\n            accepted.append(run)\n    if not accepted:\n        raise ValueError(\"source preview qualification identity\")\n    run = max(accepted, key=lambda value: positive(value.get(\"id\")))\n    verify_jobs(client, run, expected)\n    return {\n        \"workflow_path\": path,\n        \"workflow_ref\": REPOSITORY + \"/\" + path + \"@refs/heads/main\",\n        \"workflow_sha\": source,\n        \"run_id\": positive(run.get(\"id\")),\n        \"run_attempt\": positive(run.get(\"run_attempt\")),\n    }\n\n\ndef producer_artifact(client, source, run_id, attempt):\n    run_id = positive(run_id)\n    attempt = positive(attempt)\n    path = \"/repos/\" + REPOSITORY + \"/actions/runs/\" + str(run_id)\n    run = client.get(path + \"/attempts/\" + str(attempt))\n    if (run.get(\"id\") != run_id or run.get(\"run_attempt\") != attempt\n            or run.get(\"head_sha\") != source or run.get(\"head_branch\") != \"main\"\n            or run.get(\"event\") != \"push\" or run.get(\"status\") != \"completed\"\n            or run.get(\"conclusion\") != \"success\"\n            or run.get(\"path\", \"\").split(\"@\", 1)[0] != WORKFLOW\n            or run.get(\"head_repository\", {}).get(\"full_name\") != REPOSITORY):\n        raise ValueError(\"SDK preview main producer identity\")\n    latest = client.get(path)\n    if latest.get(\"run_attempt\") != attempt or latest.get(\"conclusion\") != \"success\":\n        raise ValueError(\"SDK preview producer attempt changed\")\n    verify_jobs(client, run, (\"Build source preview\", \"Qualify source preview\"))\n    inventory = client.get(path + \"/artifacts?per_page=100\")\n    artifacts = inventory.get(\"artifacts\")\n    if (not isinstance(artifacts, list) or len(artifacts) >= 100\n            or inventory.get(\"total_count\") != len(artifacts)):\n        raise ValueError(\"SDK preview producer artifact inventory\")\n    matches = [value for value in artifacts\n               if value.get(\"name\") == \"source-preview-payload-\" + str(attempt)]\n    if len(matches) != 1:\n        raise ValueError(\"SDK preview producer artifact ambiguous\")\n    artifact = matches[0]\n    if (type(artifact.get(\"id\")) is not int or artifact[\"id\"] <= 0\n            or artifact.get(\"expired\") is not False\n            or not re.fullmatch(\"sha256:[0-9a-f]{64}\", artifact.get(\"digest\", \"\"))\n            or artifact.get(\"workflow_run\", {}).get(\"id\") != run_id\n            or artifact.get(\"workflow_run\", {}).get(\"head_sha\") != source):\n        raise ValueError(\"SDK preview producer artifact identity\")\n    return artifact\n\n\ndef source_version(client, source):\n    cargo = client.get(\"/repos/\" + REPOSITORY + \"/contents/Cargo.toml?ref=\" + source)\n    if cargo.get(\"path\") != \"Cargo.toml\" or cargo.get(\"encoding\") != \"base64\":\n        raise ValueError(\"source preview version source\")\n    version = tomllib.loads(base64.b64decode(cargo[\"content\"], validate=False).decode())\n    version = version[\"workspace\"][\"package\"][\"version\"]\n    if not isinstance(version, str) or not re.fullmatch(r\"(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\", version):\n        raise ValueError(\"SDK preview release version\")\n    return version\n\n\ndef qualification_proofs(client, source):\n    return {\n        \"ci\": successful_run(client, source, \".github/workflows/ci.yml\", \"push\", (\"Required verdict\",)),\n        \"qualification\": successful_run(\n            client, source, \".github/workflows/source-qualification.yml\", \"workflow_dispatch\",\n            (\"Source qualification ordinary harness\", \"Source qualification keep harness\",\n             \"Source qualification generation and repository checks\", \"Source qualification\"),\n        ),\n    }\n\n\ndef producer_inputs(client, source):\n    qualification_proofs(client, source)\n    run = successful_run(client, source, WORKFLOW, \"push\", (\"Build source preview\", \"Qualify source preview\"))\n    artifact = producer_artifact(client, source, run[\"run_id\"], run[\"run_attempt\"])\n    return {\"producer_run_id\": run[\"run_id\"], \"producer_run_attempt\": run[\"run_attempt\"],\n            \"payload_artifact_id\": artifact[\"id\"], \"payload_archive_sha256\": artifact[\"digest\"][7:]}\n\n\ndef admit(client, now=None):\n    source = os.environ[\"GITHUB_SHA\"]\n    proof, tag_sha, expected_ref = admit_tag(\n        client, source, now or datetime.now(timezone.utc)\n    )\n    version = source_version(client, source)\n    if version != proof[\"version\"]:\n        raise ValueError(\"SDK preview tag version mismatch\")\n    metadata = {\n        \"schema\": 1, \"repository\": REPOSITORY, \"version\": version,\n        \"source_sha\": source, \"tag\": \"sdk-preview-\" + source,\n        \"signer\": {\n            \"workflow_path\": WORKFLOW, \"workflow_ref\": expected_ref,\n            \"workflow_sha\": source,\n            \"run_id\": positive(int(os.environ[\"GITHUB_RUN_ID\"])),\n            \"run_attempt\": positive(int(os.environ[\"GITHUB_RUN_ATTEMPT\"])),\n        },\n        **qualification_proofs(client, source),\n    }\n    artifact = producer_artifact(client, source, proof[\"producer_run_id\"], proof[\"producer_run_attempt\"])\n    if artifact[\"id\"] != proof[\"payload_artifact_id\"] or artifact[\"digest\"] != \"sha256:\" + proof[\"payload_archive_sha256\"]:\n        raise ValueError(\"SDK preview annotated producer changed\")\n    root = Path(os.environ[\"RUNNER_TEMP\"])\n    with tempfile.TemporaryDirectory(prefix=\"sdk-preview-input-\", dir=root) as temporary:\n        staged = Path(temporary) / \"payload\"\n        download_verified_payload(client, artifact, staged)\n        if tag_reference(client, source) != tag_sha:\n            raise ValueError(\"SDK preview tag moved\")\n        verify_default_ancestry(client, source)\n        os.link(staged, root / \"velnor-actions-x86_64-unknown-linux-gnu\", follow_symlinks=False)\n    return metadata\n\n\ndef main():\n    signal.signal(signal.SIGALRM, deadline_alarm)\n    signal.setitimer(signal.ITIMER_REAL, 120)\n    metadata = admit(GitHub())\n    path = Path(os.environ[\"RUNNER_TEMP\"]) / \"source-preview-metadata.json\"\n    with path.open(\"x\", encoding=\"utf-8\") as output:\n        json.dump(metadata, output, sort_keys=True, separators=(\",\", \":\"))\n    with open(os.environ[\"GITHUB_OUTPUT\"], \"a\", encoding=\"utf-8\") as output:\n        output.write(\"source_sha=\" + metadata[\"source_sha\"] + \"\\n\")\n\n\ndef deadline_alarm(_number, _frame):\n    raise TimeoutError(\"source preview deadline\")\n\n\nif __name__ == \"__main__\":\n    try:\n        main()\n    except (OSError, ValueError, KeyError, TypeError, http.client.HTTPException):\n        print(\"source preview admission failed\", file=sys.stderr)\n        sys.exit(1)\n\nPY"
      - name: Retain exact source preview bytes
        id: upload-source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: source-preview-source
          path: ${{ runner.temp }}/source-preview-metadata.json
          retention-days: 1
      - name: Retain exact source preview bytes
        id: upload-payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: source-preview-qualified-payload
          path: ${{ runner.temp }}/velnor-actions-x86_64-unknown-linux-gnu
          retention-days: 1
  source-preview-build:
    name: Build source preview
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    if: ${{ github.event_name == 'push' && github.repository == 'tailrocks/velnor-new' && github.ref == 'refs/heads/main' && github.workflow_ref == 'tailrocks/velnor-new/.github/workflows/product-release-generator.yml@refs/heads/main' }}
    env:
      CARGO_TARGET_DIR: $RUNNER_TEMP/velnor/target/release-x86_64-unknown-linux-gnu
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "1"
          persist-credentials: "false"
      - name: Verify protected main producer source
        shell: bash
        run: "set -eu\ntest \"$GITHUB_EVENT_NAME\" = push\ntest \"$GITHUB_REF\" = refs/heads/main\ntest \"$GITHUB_WORKFLOW_SHA\" = \"$GITHUB_SHA\"\ntest \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\""
      - name: Setup Mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
        with:
          version: 2026.11.1
          sha256: 7129dbab31d698f9028db9374f7ba7987232b0426f837dcbce437130a61415f9
          install: "false"
          env: "false"
          cache: "false"
          cache_save: "false"
      - name: Resolve project tool versions
        env:
