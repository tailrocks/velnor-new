        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build-linux.outputs.artifact_id }}
          path: linux-assets
      - name: Validate exact downloaded candidate files
        shell: bash
        run: "set -euo pipefail\ndir='linux-assets'\ntest -d \"$dir\"\ntest ! -L \"$dir\"\nshopt -s dotglob nullglob\nentries=(\"$dir\"/*)\ntest \"${#entries[@]}\" -eq 3\ntotal=0\nfor path in \"${entries[@]}\"; do\n  case \"$path\" in\n    \"$dir/velnor-actions-0.1.64-x86_64-unknown-linux-gnu\"|\"$dir/velnor-actions-0.1.64-x86_64-unknown-linux-gnu.sha256\"|\"$dir/velnor-actions-0.1.64-x86_64-unknown-linux-gnu.provenance.json\") ;;\n    *) echo 'unexpected release artifact entry' >&2; exit 1 ;;\n  esac\n  test -f \"$path\"\n  test ! -L \"$path\"\n  test -s \"$path\"\n  test ! -x \"$path\"\n  links=\"$(find \"$path\" -type f -links 1 -print -quit)\"\n  test \"$links\" = \"$path\"\n  size=\"$(wc -c < \"$path\")\"\n  size=\"${size//[[:space:]]/}\"\n  [[ \"$size\" =~ ^[0-9]+$ ]] || exit 1\n  test \"$size\" -le 268435456\n  total=$((total + size))\n  test \"$total\" -le 268435456\ndone"
