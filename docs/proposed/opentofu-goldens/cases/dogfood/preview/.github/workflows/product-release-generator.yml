  attest-manifest:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    needs:
      - verify-release-caller
      - attest-linux
      - attest-macos
      - attest-macos-intel
      - candidate-manifest
      - build-linux
      - build-macos
      - build-macos-intel
    if: inputs.release_action == 'build'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "1"
          persist-credentials: "false"
          ref: ${{ inputs.source_sha }}
      - name: Attest generator release manifest
        uses: ./.github/actions/generator-release-attest-manifest # zizmor: ignore[self-repository]
        with:
          linux_artifact_id: ${{ needs.build-linux.outputs.artifact_id }}
          macos_arm64_artifact_id: ${{ needs.build-macos.outputs.artifact_id }}
          macos_x86_64_artifact_id: ${{ needs.build-macos-intel.outputs.artifact_id }}
          manifest_artifact_id: ${{ needs.candidate-manifest.outputs.artifact_id }}
          manifest_sha256: ${{ needs.candidate-manifest.outputs.manifest_sha256 }}
  publish-generator:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
    environment:
      name: generator-release
    needs:
      - verify-release-caller
      - attest-linux
      - attest-macos
      - attest-macos-intel
      - attest-manifest
      - candidate-manifest
      - build-linux
      - build-macos
      - build-macos-intel
    if: always() && inputs.release_action == 'build' && needs.attest-linux.result == 'success' && needs.attest-macos.result == 'success' && needs.attest-macos-intel.result == 'success' && needs.attest-manifest.result == 'success'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "1"
          persist-credentials: "false"
          ref: ${{ inputs.source_sha }}
      - name: Publish generator release
        uses: ./.github/actions/generator-release-publish # zizmor: ignore[self-repository]
        with:
          linux_artifact_id: ${{ needs.build-linux.outputs.artifact_id }}
          macos_arm64_artifact_id: ${{ needs.build-macos.outputs.artifact_id }}
          macos_x86_64_artifact_id: ${{ needs.build-macos-intel.outputs.artifact_id }}
          manifest_artifact_id: ${{ needs.candidate-manifest.outputs.artifact_id }}
          manifest_sha256: ${{ needs.candidate-manifest.outputs.manifest_sha256 }}
      - name: Upload verified immutable release acceptance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: generator-release-accepted-${{ github.sha }}
          path: "release-accepted/release-manifest.json\nrelease-accepted/release-acceptance.json"
          retention-days: 1
