== \"$run_attempt\" ]] || fail 'latest CI attempt changed during eligibility check'\n[[ \"$latest_status\" == 'completed' ]] || fail 'latest CI run restarted during eligibility check'\n[[ \"$latest_conclusion\" == 'success' ]] || fail 'latest CI run changed during eligibility check'\nassert_current_tip\n{\n  printf 'source_sha=%s\\n' \"$source_sha\"\n  printf 'workflow_authority_sha=%s\\n' \"$authority_sha\"\n  printf 'ci_run_id=%s\\n' \"$run_id\"\n  printf 'ci_attempt=%s\\n' \"$run_attempt\"\n} >> \"$GITHUB_OUTPUT\"\n}\n\nrelease_eligibility\ncreated_ref=\"$(gh api \"repos/$GITHUB_REPOSITORY/git/refs\" --method POST -f \"ref=refs/tags/$tag\" -f \"sha=$GITHUB_SHA\")\"\njq -e --arg tag \"$tag\" --arg sha \"$GITHUB_SHA\" '.ref == (\"refs/tags/\" + $tag) and .object.type == \"commit\" and .object.sha == $sha' <<<\"$created_ref\" > /dev/null\nassert_release_tag_source\ngh release create \"$tag\" --repo \"$GITHUB_REPOSITORY\" --verify-tag --target \"$GITHUB_SHA\" --title \"velnor-actions $tag\" --latest=false --draft --notes \"velnor-actions 0.1.64 built from $GITHUB_SHA.\"\nrelease_view=\"$(gh release view \"$tag\" --repo \"$GITHUB_REPOSITORY\" --json databaseId,tagName,isDraft)\"\nrelease_id=\"$(jq -er --arg tag \"$tag\" '.databaseId as $id | select(.tagName == $tag and .isDraft == true and ($id | type == \"number\" and floor == . and . > 0)) | .databaseId' <<<\"$release_view\")\"\n[[ \"$release_id\" =~ ^[1-9][0-9]*$ ]]\ngh release upload \"$tag\" --repo \"$GITHUB_REPOSITORY\" \\\n  'linux-assets/velnor-actions-0.1.64-x86_64-unknown-linux-gnu' \\\n  'linux-assets/velnor-actions-0.1.64-x86_64-unknown-linux-gnu.sha256' \\\n  'linux-assets/velnor-actions-0.1.64-x86_64-unknown-linux-gnu.provenance.json' \\\n  'macos-assets/velnor-actions-0.1.64-aarch64-apple-darwin' \\\n  'macos-assets/velnor-actions-0.1.64-aarch64-apple-darwin.sha256' \\\n  'macos-assets/velnor-actions-0.1.64-aarch64-apple-darwin.provenance.json' \\\n  'macos-intel-assets/velnor-actions-0.1.64-x86_64-appl