MS\" --repo \"$release_repository\" >/dev/null\nfamily_gh attestation verify \"assets/SHA256SUMS\" --repo \"$release_repository\" --source-ref refs/heads/main --source-digest \"$release_source_sha\" --signer-workflow \"$release_repository/$release_workflow_path\" --signer-digest \"$release_authority_sha\" >/dev/null\n"
