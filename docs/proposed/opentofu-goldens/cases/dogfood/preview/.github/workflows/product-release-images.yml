signature verification failed'\n  printf '::warning title=Release %s already published::%s is immutable at %s; source %s is NOT released. Bump the version to publish it.\\n' \\\n    \"$prepare_tag\" \"$prepare_tag\" \"$release_commit\" \"$source_sha\"\n  printf 'Release %s already published at %s; source %s was not released (no-op). Bump the version to release it.\\n' \\\n    \"$prepare_tag\" \"$release_commit\" \"$source_sha\" >> \"${GITHUB_STEP_SUMMARY:-/dev/null}\"\n  printf 'action=complete\\n' >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\n\ntemp_dir=\"$(mktemp -d)\" || fail 'could not create release verification directory'\ntrap 'rm -rf \"$temp_dir\"' EXIT\ngh release verify \"$prepare_tag\" --repo \"$repository\" >/dev/null \\\n  || fail 'release signature verification failed'\nmkdir -p \"$temp_dir/assets\" || fail 'could not create release asset directory'\ngh release download \"$prepare_tag\" --repo \"$repository\" --dir \"$temp_dir/assets\" --pattern 'RUNNER_IMAGE_MANIFEST.json' --pattern 'LICENSE' --pattern 'NOTICE' --pattern 'SHA256SUMS' || fail 'release asset download failed'\n(cd \"$temp_dir/assets\" && shasum -a 256 --check SHA256SUMS) || fail 'release asset checksum verification failed'\ngh release verify-asset \"$prepare_tag\" \"$temp_dir/assets/RUNNER_IMAGE_MANIFEST.json\" --repo \"$repository\" >/dev/null || fail 'release asset verification failed: assets/RUNNER_IMAGE_MANIFEST.json'\ngh attestation verify \"$temp_dir/assets/RUNNER_IMAGE_MANIFEST.json\" --repo \"$repository\" --source-ref refs/heads/main --source-digest \"$source_sha\" --signer-workflow \"$repository/.github/workflows/product-release-images.yml\" --signer-digest \"$authority_sha\" >/dev/null || fail 'asset attestation verification failed: assets/RUNNER_IMAGE_MANIFEST.json'\ngh release verify-asset \"$prepare_tag\" \"$temp_dir/assets/LICENSE\" --repo \"$repository\" >/dev/null || fail 'release asset verification failed: assets/LICENSE'\ngh attestation verify \"$temp_dir/assets/LICENSE\" --repo \"$repository\" --source-ref refs/heads/main --source-digest \"$source_sha\" --signer-workflow \"$repository/.github/workflows/product-release-images.yml\" --signer-digest \"$authority_sha\" >/dev/null || fail 'asset attestation verification failed: assets/LICENSE'\ngh release verify-asset \"$prepare_tag\" \"$temp_dir/assets/NOTICE\" --repo \"$repository\" >/dev/null || fail 'release asset verification failed: assets/NOTICE'\ngh attestation verify \"$temp_dir/assets/NOTICE\" --repo \"$repository\" --source-ref refs/heads/main --source-digest \"$source_sha\" --signer-workflow \"$repository/.github/workflows/product-release-images.yml\" --signer-digest \"$authority_sha\" >/dev/null || fail 'asset attestation verification failed: assets/NOTICE'\ngh release verify-asset \"$prepare_tag\" \"$temp_dir/assets/SHA256SUMS\" --repo \"$repository\" >/dev/null || fail 'release asset verification failed: assets/SHA256SUMS'\ngh attestation verify \"$temp_dir/assets/SHA256SUMS\" --repo \"$repository\" --source-ref refs/heads/main --source-digest \"$source_sha\" --signer-workflow \"$repository/.github/workflows/product-release-images.yml\" --signer-digest \"$authority_sha\" >/dev/null || fail 'asset attestation verification failed: assets/SHA256SUMS'\nprintf 'action=complete\\n' >> \"$GITHUB_OUTPUT\"\n\nVELNOR_PREPARE\n  then\n    rm -f \"$existing_output\"\n    family_fail 'already-published release failed idempotent revalidation'\n  fi\n  grep -Fqx 'action=complete' \"$existing_output\" || family_fail 'release is no longer complete'\n  rm -f \"$existing_output\"\n  exit 0\nfi\n[[ \"$release_action\" == build ]] || family_fail 'unknown preparation action'\n\nreleases=\"$(family_gh api --paginate --slurp \"repos/$release_repository/releases?per_page=100\")\"\nexisting=\"$(jq -r --arg tag \"$release_tag\" '[.[][]? | select(.tag_name == $tag)] | length' <<<\"$releases\")\"\n[[ \"$existing\" == 0 ]] || family_fail 'release appeared after preparation; no overwrite is allowed'\nrefs=\"$(family_gh api --paginate --slurp \"repos/$release_repository/git/matching-refs/tags/$release_tag?per_page=100\")\"\nexact_ref=\"$(jq -r --arg ref \"refs/tags/$release_tag\" '[.[][]? | select(.ref == $ref)] | length' <<<\"$refs\")\"\n[[ \"$exact_ref\" == 0 ]] || family_fail 'tag appeared after preparation; no overwrite is allowed'\n\n(cd \"./assets\" && shasum -a 256 --check SHA256SUMS) || fail 'release asset checksum verification failed'\nfor asset in \"${release_asset_paths[@]}\"; do\n  family_gh attestation verify \"$asset\" \\\n    --repo \"$release_repository\" \\\n    --source-ref refs/heads/main \\\n    --source-digest \"$release_source_sha\" \\\n    --signer-workflow \"$release_repository/$release_workflow_path\" \\\n    --signer-digest \"$release_authority_sha\" >/dev/null\ndone\n\ncheck_eligibility_identity\nfamily_gh api \\\n  -X POST \\\n  -f \"ref=refs/tags/$release_tag\" \\\n  -f \"sha=$release_source_sha\" \\\n  \"repos/$release_repository/git/refs\" >/dev/null\nassert_tag_target\nfamily_gh release create \"$release_tag\" \\\n  --repo \"$release_repository\" \\\n  --target \"$release_source_sha\" \\\n  --title \"$release_tag\" \\\n  --notes \"runner images built from $release_source_sha.\" \\\n  --latest=false \\\n  --verify-tag \\\n  --draft\nassert_tag_target\nfamily_gh release upload \"$release_tag\" 'assets/RUNNER_IMAGE_MANIFEST.json' 'assets/LICENSE' 'assets/NOTICE' 'assets/SHA256SUMS' --repo \"$release_repository\"\ncheck_eligibility_identity\nfamily_gh release edit \"$release_tag\" --draft=false --verify-tag --repo \"$release_repository\"\n\npublished=\"$(family_gh api \"repos/$release_repository/releases/tags/$release_tag\")\"\njq -e \\\n  --arg tag \"$release_tag\" \\\n  --arg sha \"$release_source_sha\" \\\n  --argjson expected \"$expected_assets\" \\\n  '.tag_name == $tag\n   and .target_commitish == $sha\n   and .draft == false\n   and .prerelease == false\n   and .immutable == true\n   and ([.assets[].name] | sort) == ($expected | sort)\