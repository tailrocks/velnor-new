  attest-images:
    name: Attest runner manifest
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    outputs:
      artifact_id: ${{ needs.build-images.outputs.artifact_id }}
    needs:
      - verify-release-caller
      - build-images
    if: inputs.release_action == 'build'
