        run: "set -eu\nexport LC_ALL=C\ncase \"$ARTIFACT_ID\" in ''|*[!0-9]*|0|0*) exit 1 ;; esac\nlength=\"${#ARTIFACT_ID}\"\nif [ \"$length\" -gt 16 ]; then exit 1; fi\nif [ \"$length\" -eq 16 ] && [ \"$ARTIFACT_ID\" -gt 9007199254740991 ]; then exit 1; fi"
      - name: Download built assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
