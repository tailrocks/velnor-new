      - name: Attest built artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: "assets/RUNNER_IMAGE_MANIFEST.json\nassets/LICENSE\nassets/NOTICE\nassets/SHA256SUMS"
  publish-images:
    name: Publish runner manifest
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      attestations: read
    needs:
      - verify-release-caller
      - attest-images
    if: always() && (inputs.release_action == 'complete' || (inputs.release_action == 'build' && (needs.attest-images.result == 'success')))
    steps:
      - name: Setup Mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
        with:
          version: 2026.11.1
          sha256: 7129dbab31d698f9028db9374f7ba7987232b0426f837dcbce437130a61415f9
