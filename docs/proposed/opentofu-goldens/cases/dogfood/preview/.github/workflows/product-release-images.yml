      - name: Build locked resource probe
        shell: bash
        run: "mise --no-config --no-env --no-hooks exec 'rust@'\"${VELNOR_TOOL_RUST}\" 'mr-boxington@'\"${VELNOR_TOOL_MR_BOXINGTON}\" -- mbx build --locked --manifest-path crates/velnor-runner/Cargo.toml --package velnor-resource-probe --bin velnor-resource-probe --release --target x86_64-unknown-linux-musl"
      - name: Qualify public resource-probe release admission
        shell: bash
        run: "mise --no-config --no-env --no-hooks exec 'rust@'\"${VELNOR_TOOL_RUST}\" 'mr-boxington@'\"${VELNOR_TOOL_MR_BOXINGTON}\" 'aqua:nextest-rs/nextest/cargo-nextest@'\"${VELNOR_TOOL_NEXTEST}\" -- mbx nextest run --locked --manifest-path crates/velnor-runner/Cargo.toml --package velnor-runner-host --test resource_probe_release_public --target x86_64-unknown-linux-gnu --no-tests fail"
      - name: Build locked native resource-probe producer
        shell: bash
        run: "mise --no-config --no-env --no-hooks exec 'rust@'\"${VELNOR_TOOL_RUST}\" 'mr-boxington@'\"${VELNOR_TOOL_MR_BOXINGTON}\" -- mbx build --locked --manifest-path crates/velnor-runner/Cargo.toml --package velnor-runner-host --bin velnor-resource-probe-release --target x86_64-unknown-linux-gnu"
      - name: Build and smoke-test resource-probe image
        shell: bash
        run: "set -euo pipefail\nproducer_target=\"$(cd -- \"${CARGO_TARGET_DIR:-crates/velnor-runner/target}\" && pwd -P)\"\nexport VELNOR_RESOURCE_PROBE_RELEASE_BIN=\"$producer_target/x86_64-unknown-linux-gnu/debug/velnor-resource-probe-release\"\nbash images/resource-probe/build-image.sh"
      - name: Verify image architectures and revisions
        env:
          VELNOR_SOURCE_SHA: ${{ inputs.source_sha }}
        run: "set -eu\n: \"${VELNOR_SOURCE_SHA:?}\"\nrunner=\"$(docker image inspect --format '{{.Architecture}}' velnor-runner:linux-amd64)\"\ndind=\"$(docker image inspect --format '{{.Architecture}}' velnor-dind:linux-amd64)\"\ntest \"$runner\" = amd64\ntest \"$dind\" = amd64\nrunner_revision=\"$(docker image inspect --format '{{ index .Config.Labels \"org.opencontainers.image.revision\" }}' velnor-runner:linux-amd64)\"\ndind_revision=\"$(docker image inspect --format '{{ index .Config.Labels \"org.opencontainers.image.revision\" }}' velnor-dind:linux-amd64)\"\ntest \"$runner_revision\" = \"$VELNOR_SOURCE_SHA\"\ntest \"$dind_revision\" = \"$VELNOR_SOURCE_SHA\""
      - name: Save image archives
        run: "set -eu\ndocker save --output velnor-runner-linux-amd64.tar velnor-runner:linux-amd64\ndocker save --output velnor-dind-linux-amd64.tar velnor-dind:linux-amd64\ntest -s velnor-runner-linux-amd64.tar\ntest -s velnor-dind-linux-amd64.tar\ntest -s velnor-resource-probe-linux-amd64.tar\ntest -s RESOURCE_PROBE_MANIFEST.json"
      - name: Checksum built bytes
        run: "set -eu\nsha256sum velnor-runner-linux-amd64.tar velnor-dind-linux-amd64.tar velnor-resource-probe-linux-amd64.tar RESOURCE_PROBE_MANIFEST.json LICENSE NOTICE > SHA256SUMS"
      - name: Upload image assets
        id: upload-assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: image-assets-${{ github.run_attempt }}
          path: "velnor-runner-linux-amd64.tar\nvelnor-dind-linux-amd64.tar\nvelnor-resource-probe-linux-amd64.tar\nRESOURCE_PROBE_MANIFEST.json\nLICENSE\nNOTICE\nSHA256SUMS"
          retention-days: 1
  attest-images:
    name: Attest runner images
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    outputs:
      artifact_id: ${{ needs.build-images.outputs.artifact_id }}
    needs:
      - verify-release-caller
      - build-images
    if: inputs.release_action == 'build'
    steps:
      - name: Validate producer artifact identity
        id: validate-producer-artifact-identity
        env:
          ARTIFACT_ID: ${{ needs.build-images.outputs.artifact_id }}
        run: "set -eu\nexport LC_ALL=C\ncase \"$ARTIFACT_ID\" in ''|*[!0-9]*|0|0*) exit 1 ;; esac\nlength=\"${#ARTIFACT_ID}\"\nif [ \"$length\" -gt 16 ]; then exit 1; fi\nif [ \"$length\" -eq 16 ] && [ \"$ARTIFACT_ID\" -gt 9007199254740991 ]; then exit 1; fi"
      - name: Download built assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        env:
          ARTIFACT_ID: ${{ needs.build-images.outputs.artifact_id }}
        with:
          artifact-ids: ${{ env.ARTIFACT_ID }}
          path: assets
      - name: Attest built artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: "assets/velnor-runner-linux-amd64.tar\nassets/velnor-dind-linux-amd64.tar\nassets/velnor-resource-probe-linux-amd64.tar\nassets/RESOURCE_PROBE_MANIFEST.json\nassets/LICENSE\nassets/NOTICE\nassets/SHA256SUMS"
  publish-images:
    name: Publish runner images
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      attestations: read
    needs:
      - verify-release-caller
      - attest-images
    if: always() && (inputs.release_action == 'complete' || (inputs.release_action == 'build' && (needs.attest-images.result == 'success')))
    steps:
      - name: Setup Mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
        with:
          version: 2026.11.1
          sha256: 7129dbab31d698f9028db9374f7ba7987232b0426f837dcbce437130a61415f9
          install: "false"
          env: "false"
          cache: "false"
          cache_save: "false"
      - name: Install pinned GitHub CLI
        shell: bash
        run: mise --no-config --no-env --no-hooks install gh@2.103.3
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "1"
          persist-credentials: "false"
          ref: ${{ inputs.source_sha }}
      - name: Validate producer artifact identity
        id: validate-producer-artifact-identity
        env:
          ARTIFACT_ID: ${{ needs.attest-images.outputs.artifact_id }}
        run: "set -eu\nexport LC_ALL=C\ncase \"$ARTIFACT_ID\" in ''|*[!0-9]*|0|0*) exit 1 ;; esac\nlength=\"${#ARTIFACT_ID}\"\nif [ \"$length\" -gt 16 ]; then exit 1; fi\nif [ \"$length\" -eq 16 ] && [ \"$ARTIFACT_ID\" -gt 9007199254740991 ]; then exit 1; fi"
        if: inputs.release_action == 'build'
      - name: Download built assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        env:
          ARTIFACT_ID: ${{ needs.attest-images.outputs.artifact_id }}
        with:
          artifact-ids: ${{ env.ARTIFACT_ID }}
          path: assets
        if: inputs.release_action == 'build'
      - name: Publish GitHub release
        id: publish-family-release
        env:
          GH_TOKEN: ${{ github.token }}
          VELNOR_RELEASE_ACTION: ${{ inputs.release_action }}
        run: "# SPDX-FileCopyrightText: 2026 Alexey Zhokhov\n# SPDX-License-Identifier: Apache-2.0\n\nset -euo pipefail\n\nreadonly release_confirmation_deadline=$((SECONDS + 120))\n\ngh() {\n  (\n    LD_PRELOAD=\"\" LD_LIBRARY_PATH=\"\" LD_AUDIT=\"\" LD_DEBUG=\"\" LD_PROFILE=\"\" GCONV_PATH=\"\" LOCPATH=\"\" PYTHONPATH=\"\" PYTHONHOME=\"\" PYTHONUSERBASE=\"\" /usr/bin/python3 -I -S -c \"exec(bytes.fromhex(\\\"\\\"))\" \"$@\" & _velnor_gh_pid=$!\n    ( sleep 60; kill -TERM \"$_velnor_gh_pid\" 2>/dev/null; sleep 5; kill -KILL \"$_velnor_gh_pid\" 2>/dev/null ) </dev/null >/dev/null 2>&1 & _velnor_gh_watch=$!\n    _velnor_gh_status=0\n    wait \"$_velnor_gh_pid\" || _velnor_gh_status=$?\n    kill -KILL \"$_velnor_gh_watch\" 2>/dev/null || true\n    wait \"$_velnor_gh_watch\" 2>/dev/null || true\n    exit \"$_velnor_gh_status\"\n  ) </dev/null\n}\nexport -f gh\ngh_until() {\n  local _velnor_deadline=\"$1\"\n  shift\n  (\n    _velnor_remaining=$((_velnor_deadline - SECONDS))\n    (( _velnor_remaining > 0 )) || exit 124\n    _velnor_timeout=60\n    _velnor_kill_after=5\n    if (( _velnor_remaining < _velnor_timeout + _velnor_kill_after )); then\n      _velnor_kill_after=$(( _velnor_remaining < _velnor_kill_after ? _velnor_remaining : _velnor_kill_after ))\n      _velnor_timeout=$((_velnor_remaining - _velnor_kill_after))\n    fi\n    LD_PRELOAD=\"\" LD_LIBRARY_PATH=\"\" LD_AUDIT=\"\" LD_DEBUG=\"\" LD_PROFILE=\"\" GCONV_PATH=\"\" LOCPATH=\"\" PYTHONPATH=\"\" PYTHONHOME=\"\" PYTHONUSERBASE=\"\" /usr/bin/python3 -I -S -c \"exec(bytes.fromhex(\\\"\\\"))\" \"$@\" & _velnor_gh_pid=$!\n    ( sleep \"$_velnor_timeout\"; kill -TERM \"$_velnor_gh_pid\" 2>/dev/null; sleep \"$_velnor_kill_after\"; kill -KILL \"$_velnor_gh_pid\" 2>/dev/null ) </dev/null >/dev/null 2>&1 & _velnor_gh_watch=$!\n    _velnor_gh_status=0\n    wait \"$_velnor_gh_pid\" || _velnor_gh_status=$?\n    kill -KILL \"$_velnor_gh_watch\" 2>/dev/null || true\n    wait \"$_velnor_gh_watch\" 2>/dev/null || true\n    (( SECONDS < _velnor_deadline )) || exit 124\n    exit \"$_velnor_gh_status\"\n  ) </dev/null\n}\nfamily_gh() { gh \"$@\"; }\n\nrelease_eligibility() {\nlocal -r repository='tailrocks/velnor-new'\nlocal -r ci_workflow_path='.github/workflows/ci.yml'\nlocal -r source_sha=\"${GITHUB_SHA-}\"\nlocal -r authority_sha=\"${GITHUB_WORKFLOW_SHA-}\"\n\nfail() {\n  printf 'release eligibility: %s\\n' \"$1\" >&2\n  exit 1\n}\n\nis_sha() {\n  local candidate=\"$1\"\n  [[ \"${#candidate}\" -eq 40 && \"$candidate\" != *[!0123456789abcdef]* ]]\n}\n\n[[ \"${GITHUB_REPOSITORY-}\" == \"$repository\" ]] || fail 'unexpected repository'\n[[ \"${GITHUB_REF-}\" == 'refs/heads/main' ]] || fail 'source ref is not main'\n[[ \"${GITHUB_WORKFLOW_REF-}\" == \"$repository/.github/workflows/product-release.yml@refs/heads/main\" ]] || fail 'unexpected workflow authority path or ref'\ncase \"${GITHUB_EVENT_NAME-}\" in\n  workflow_dispatch) ;;\n  *) fail 'event is not eligible' ;;\nesac\nis_sha \"$source_sha\" || fail 'source SHA is malformed'\nis_sha \"$authority_sha\" || fail 'workflow authority SHA is malformed'\n[[ \"$source_sha\" == \"$authority_sha\" ]] || fail 'workflow authority and source differ'\nlocal checkout_sha\ncheckout_sha=\"$(git rev-parse HEAD)\" || fail 'cannot read checked-out source SHA'\n[[ \"$checkout_sha\" == \"$source_sha\" ]] || fail 'checked-out source SHA differs'\n[[ -n \"${GH_TOKEN-}\" ]] || fail 'read-only GitHub token is missing'\n[[ -n \"${GITHUB_OUTPUT-}\" ]] || fail 'workflow output path is missing'\n\ngh_api() {\n  gh api \"$@\"\n}\n\ncurrent_main_sha() {\n  gh_api \"repos/$repository/commits/main\" | jq -er '.sha' \\\n    || fail 'main commit response is invalid'\n}\n\nlist_exact_source_ci_runs() {\n  local _velnor_label=\"$1\"\n  shift\n  local _velnor_listing _velnor_delay\n  for _velnor_delay in 3 6 12 24 45 ''; do\n    _velnor_listing=\"$(\"$@\")\" || return 1\n    if ! printf '%s\\n' \"$_velnor_listing\" | jq -e '[.[] | (.workflow_runs // [])[]] | length == 0' >/dev/null 2>&1; then\n      printf '%s\\n' \"$_velnor_listing\"\n      return 0\n    fi\n    [[ -n \"$_velnor_delay\" ]] || break\n    printf '%s: the CI run listing is empty; listing again in %ss\\n' \"$_velnor_label\" \"$_velnor_delay\" >&2\n    sleep \"$_velnor_delay\"\n  done\n  printf '%s: the CI run listing stayed empty after 6 attempts\\n' \"$_velnor_label\" >&2\n  printf '%s\\n' \"$_velnor_listing\"\n}\n\nlatest_ci_run() {\n  local listing\n  listing=\"$(list_exact_source_ci_runs 'release eligibility' gh_api --paginate --slurp -X GET \\\n    \"repos/$repository/actions/workflows/ci.yml/runs?head_sha=$source_sha&per_page=100\")\" \\\n    || fail 'CI run lookup failed'\n  printf '%s\\n' \"$listing\" | jq -c \\\n      --arg source_sha \"$source_sha\" \\\n      --arg workflow_path \"$ci_workflow_path\" \\\n      --arg repository \"$repository\" \\\n      '\n  [ .[] | (.workflow_runs // [])[] |\n    select(.path == $workflow_path\n      and .event == \"push\"\n      and .head_branch == \"main\"\n      and .head_sha == $source_sha\n      and .head_repository.full_name == $repository\n      and (.id | type) == \"number\"\n      and (.run_number | type) == \"number\"\n      and (.run_attempt | type) == \"number\")\n  ] as $runs\n  | if ($runs | length) == 0 then null\n    else\n      ($runs | sort_by([.run_number, .id])) as $ordered\n      | $ordered[-1] as $latest\n      | [$ordered[] | select(.run_number == $latest.run_number)] as $same_number\n      | if ($same_number | length) != 1\n        then error(\"ambiguous CI run number\")\n        else $latest\n        end\n    end\n' \\\n    || fail 'CI run response is invalid'\n}\n\nassert_current_tip() {\n  local current_sha\n  current_sha=\"$(current_main_sha)\" || fail 'main commit lookup failed'\n  [[ \"$current_sha\" == \"$source_sha\" ]] || fail 'source is no longer the main tip'\n}\n\nassert_required_job() {\n  local run_id=\"$1\"\n  local run_attempt=\"$2\"\n  local jobs required\n  jobs=\"$(gh_api --paginate --slurp -X GET \\\n    \"repos/$repository/actions/runs/$run_id/attempts/$run_attempt/jobs?per_page=100\")\" \\\n    || fail 'Required job lookup failed'\n  required=\"$(printf '%s\\n' \"$jobs\" | jq -c \\\n    --argjson run_id \"$run_id\" \\\n    --argjson run_attempt \"$run_attempt\" \\\n    --arg source_sha \"$source_sha\" \\\n    '\n  [ .[].jobs[]? | select(.name == \"Required\") ] as $required\n  | if ($required | length) != 1 then error(\"expected one Required job\")\n    else $required[0]\n      | if .run_id == $run_id\n          and .run_attempt == $run_attempt\n          and .head_sha == $source_sha\n          and .head_branch == \"main\"\n        then .\n        else error(\"Required job identity mismatch\")\n        end\n    end\n')\" || fail 'Required job response is invalid'\n  local status conclusion actual_run actual_sha actual_branch\n  status=\"$(jq -er '.status' <<<\"$required\")\" || fail 'Required job status is invalid'\n  conclusion=\"$(jq -er '.conclusion' <<<\"$required\")\" \\\n    || fail 'Required job conclusion is invalid'\n  actual_run=\"$(jq -er '.run_id' <<<\"$required\")\" || fail 'Required job run ID is invalid'\n  actual_sha=\"$(jq -er '.head_sha' <<<\"$required\")\" || fail 'Required job source SHA is invalid'\n  actual_branch=\"$(jq -er '.head_branch' <<<\"$required\")\" \\\n    || fail 'Required job branch is invalid'\n  [[ \"$status\" == 'completed' ]] || fail 'Required job is not complete'\n  [[ \"$conclusion\" == 'success' ]] || fail 'Required job did not succeed'\n  [[ \"$actual_run\" == \"$run_id\" ]] || fail 'Required job has a different run ID'\n  [[ \"$actual_sha\" == \"$source_sha\" ]] || fail 'Required job has a different source SHA'\n  [[ \"$actual_branch\" == 'main' ]] || fail 'Required job is not on main'\n}\n\nassert_current_tip\nrun=\"$(latest_ci_run)\" || fail 'latest CI run lookup failed'\n[[ \"$run\" != 'null' ]] || fail 'latest exact-source CI run is missing'\nstatus=\"$(jq -er '.status' <<<\"$run\")\" || fail 'latest CI run status is invalid'\n[[ \"$status\" == 'completed' ]] || fail 'latest exact-source CI run is not complete'\nrun_conclusion=\"$(jq -er '.conclusion' <<<\"$run\")\" \\\n  || fail 'latest CI run conclusion is invalid'\n[[ \"$run_conclusion\" == 'success' ]] || fail 'latest exact-source CI run did not succeed'\nrun_id=\"$(jq -er '.id' <<<\"$run\")\" || fail 'latest CI run ID is invalid'\nrun_attempt=\"$(jq -er '.run_attempt' <<<\"$run\")\" \\\n  || fail 'latest CI run attempt is invalid'\nassert_required_job \"$run_id\" \"$run_attempt\"\nlatest_again=\"$(latest_ci_run)\" || fail 'latest CI recheck failed'\nlatest_id=\"$(jq -er '.id' <<<\"$latest_again\")\" || fail 'latest CI recheck ID is invalid'\nlatest_attempt=\"$(jq -er '.run_attempt' <<<\"$latest_again\")\" \\\n  || fail 'latest CI recheck attempt is invalid'\nlatest_status=\"$(jq -er '.status' <<<\"$latest_again\")\" \\\n  || fail 'latest CI recheck status is invalid'\nlatest_conclusion=\"$(jq -er '.conclusion' <<<\"$latest_again\")\" \\\n  || fail 'latest CI recheck conclusion is invalid'\n[[ \"$latest_id\" == \"$run_id\" ]] || fail 'latest CI run changed during eligibility check'\n[[ \"$latest_attempt\" == \"$run_attempt\" ]] || fail 'latest CI attempt changed during eligibility check'\n[[ \"$latest_status\" == 'completed' ]] || fail 'latest CI run restarted during eligibility check'\n[[ \"$latest_conclusion\" == 'success' ]] || fail 'latest CI run changed during eligibility check'\nassert_current_tip\n{\n  printf 'source_sha=%s\\n' \"$source_sha\"\n  printf 'workflow_authority_sha=%s\\n' \"$authority_sha\"\n  printf 'ci_run_id=%s\\n' \"$run_id\"\n  printf 'ci_attempt=%s\\n' \"$run_attempt\"\n} >> \"$GITHUB_OUTPUT\"\n}\n\nrelease_eligibility\n\nreadonly release_repository='tailrocks/velnor-new'\nreadonly release_workflow_path='.github/workflows/product-release-images.yml'\nreadonly release_source_sha=\"$VELNOR_SOURCE_SHA\"\nreadonly release_authority_sha=\"$VELNOR_WORKFLOW_AUTHORITY_SHA\"\nreadonly release_ci_run_id=\"$VELNOR_CI_RUN_ID\"\nreadonly release_ci_attempt=\"$VELNOR_CI_ATTEMPT\"\nreadonly release_action=\"$VELNOR_RELEASE_ACTION\"\nreadonly tag_prefix='runner'\nreadonly fixed_tag=''\nif [[ -n \"$fixed_tag\" ]]; then\n  release_tag=\"$fixed_tag\"\nelse\n  release_tag=\"${tag_prefix}-${release_source_sha}\"\nfi\nreadonly release_tag\nreadonly expected_assets='[\"velnor-runner-linux-amd64.tar\",\"velnor-dind-linux-amd64.tar\",\"velnor-resource-probe-linux-amd64.tar\",\"RESOURCE_PROBE_MANIFEST.json\",\"LICENSE\",\"NOTICE\",\"SHA256SUMS\"]'\nreadonly release_asset_paths=('assets/velnor-runner-linux-amd64.tar' 'assets/velnor-dind-linux-amd64.tar' 'assets/velnor-resource-probe-linux-amd64.tar' 'assets/RESOURCE_PROBE_MANIFEST.json' 'assets/LICENSE' 'assets/NOTICE' 'assets/SHA256SUMS')\n\nfamily_fail() {\n  printf 'release publication (runner images): %s\\n' \"$1\" >&2\n  exit 1\n}\n\n[[ \"$release_source_sha\" == \"$GITHUB_SHA\" ]] || family_fail 'source output differs from event source'\n[[ \"$release_authority_sha\" == \"$release_source_sha\" ]] || family_fail 'workflow authority differs from source'\n[[ \"$release_ci_run_id\" =~ ^[0-9]+$ ]] || family_fail 'initial CI run ID is malformed'\n[[ \"$release_ci_attempt\" =~ ^[0-9]+$ ]] || family_fail 'initial CI attempt is malformed'\n[[ -n \"$GH_TOKEN\" ]] || family_fail 'GitHub token is missing'\n\ncheck_eligibility_identity() {\n  local output actual_source actual_authority actual_run actual_attempt\n  output=\"$(mktemp)\"\n  if ! (GITHUB_OUTPUT=\"$output\"; release_eligibility); then\n    rm -f \"$output\"\n    return 1\n  fi\n  actual_source=\"$(sed -n 's/^source_sha=//p' \"$output\")\"\n  actual_authority=\"$(sed -n 's/^workflow_authority_sha=//p' \"$output\")\"\n  actual_run=\"$(sed -n 's/^ci_run_id=//p' \"$output\")\"\n  actual_attempt=\"$(sed -n 's/^ci_attempt=//p' \"$output\")\"\n  rm -f \"$output\"\n  [[ \"$actual_source\" == \"$release_source_sha\" ]] || family_fail 'source changed after initial gate'\n  [[ \"$actual_authority\" == \"$release_authority_sha\" ]] || family_fail 'workflow authority changed after initial gate'\n  [[ \"$actual_run\" == \"$release_ci_run_id\" ]] || family_fail 'latest CI run changed after initial gate'\n  [[ \"$actual_attempt\" == \"$release_ci_attempt\" ]] || family_fail 'latest CI attempt changed after initial gate'\n}\n\nassert_tag_target() {\n  local reference tag_object object_type object_sha\n  reference=\"$(family_gh api \"repos/$release_repository/git/ref/tags/$release_tag\")\"\n  object_type=\"$(jq -er '.object.type' <<<\"$reference\")\"\n  object_sha=\"$(jq -er '.object.sha' <<<\"$reference\")\"\n  if [[ \"$object_type\" == tag ]]; then\n    tag_object=\"$(family_gh api \"repos/$release_repository/git/tags/$object_sha\")\"\n    object_type=\"$(jq -er '.object.type' <<<\"$tag_object\")\"\n    object_sha=\"$(jq -er '.object.sha' <<<\"$tag_object\")\"\n  fi\n  [[ \"$object_type\" == commit && \"$object_sha\" == \"$release_source_sha\" ]] || family_fail 'release tag does not resolve to the exact source commit'\n}\n\nif [[ \"$release_action\" == complete ]]; then\n  check_eligibility_identity\n  existing_output=\"$(mktemp)\"\n  if ! GITHUB_OUTPUT=\"$existing_output\" \\\n    VELNOR_SOURCE_SHA=\"$release_source_sha\" \\\n    VELNOR_WORKFLOW_AUTHORITY_SHA=\"$release_authority_sha\" \\\n    bash -s <<'VELNOR_PREPARE'\n# SPDX-FileCopyrightText: 2026 Alexey Zhokhov\n# SPDX-License-Identifier: Apache-2.0\n\nset -euo pipefail\n\nreadonly repository='tailrocks/velnor-new'\nreadonly source_sha=\"$VELNOR_SOURCE_SHA\"\nreadonly authority_sha=\"$VELNOR_WORKFLOW_AUTHORITY_SHA\"\nreadonly tag_prefix='runner'\nreadonly fixed_tag=''\nif [[ -n \"$fixed_tag\" ]]; then\n  prepare_tag=\"$fixed_tag\"\nelse\n  prepare_tag=\"${tag_prefix}-${source_sha}\"\nfi\nreadonly prepare_tag\nreadonly prepare_expected_assets='[\"velnor-runner-linux-amd64.tar\",\"velnor-dind-linux-amd64.tar\",\"velnor-resource-probe-linux-amd64.tar\",\"RESOURCE_PROBE_MANIFEST.json\",\"LICENSE\",\"NOTICE\",\"SHA256SUMS\"]'\n\nfail() {\n  printf 'release reconciliation (runner images): %s\\n' \"$1\" >&2\n  exit 1\n}\n\n[[ \"$source_sha\" =~ ^[0-9a-f]{40}$ ]] || fail 'source SHA is malformed'\n[[ \"$authority_sha\" == \"$source_sha\" ]] || fail 'workflow authority differs from source'\n[[ -n \"$GH_TOKEN\" ]] || fail 'read-only GitHub token is missing'\n\ngh() {\n  (\n    LD_PRELOAD=\"\" LD_LIBRARY_PATH=\"\" LD_AUDIT=\"\" LD_DEBUG=\"\" LD_PROFILE=\"\" GCONV_PATH=\"\" LOCPATH=\"\" PYTHONPATH=\"\" PYTHONHOME=\"\" PYTHONUSERBASE=\"\" /usr/bin/python3 -I -S -c \"exec(bytes.fromhex(\\\"\\\"))\" \"$@\" & _velnor_gh_pid=$!\n    ( sleep 60; kill -TERM \"$_velnor_gh_pid\" 2>/dev/null; sleep 5; kill -KILL \"$_velnor_gh_pid\" 2>/dev/null ) </dev/null >/dev/null 2>&1 & _velnor_gh_watch=$!\n    _velnor_gh_status=0\n    wait \"$_velnor_gh_pid\" || _velnor_gh_status=$?\n    kill -KILL \"$_velnor_gh_watch\" 2>/dev/null || true\n    wait \"$_velnor_gh_watch\" 2>/dev/null || true\n    exit \"$_velnor_gh_status\"\n  ) </dev/null\n}\nexport -f gh\n\nassert_tag_target() {\n  local reference tag_object object_type object_sha\n  reference=\"$(gh api \"repos/$repository/git/ref/tags/$prepare_tag\")\" \\\n    || fail 'release tag lookup failed'\n  object_type=\"$(jq -er '.object.type' <<<\"$reference\")\" \\\n    || fail 'release tag response is invalid'\n  object_sha=\"$(jq -er '.object.sha' <<<\"$reference\")\" \\\n    || fail 'release tag response is invalid'\n  if [[ \"$object_type\" == tag ]]; then\n    tag_object=\"$(gh api \"repos/$repository/git/tags/$object_sha\")\" \\\n      || fail 'annotated release tag lookup failed'\n    object_type=\"$(jq -er '.object.type' <<<\"$tag_object\")\" \\\n      || fail 'annotated release tag response is invalid'\n    object_sha=\"$(jq -er '.object.sha' <<<\"$tag_object\")\" \\\n      || fail 'annotated release tag response is invalid'\n  fi\n  [[ \"$object_type\" == commit && \"$object_sha\" == \"$release_commit\" ]] || fail 'tag does not resolve to the exact source commit'\n}\n\n# A fixed version tag is immutable and keeps the commit it was published from.\n# A later dispatch on an unchanged version therefore finds that release at an\n# earlier commit. Print `exact` or `earlier`; refuse any other relationship.\nclassify_release_commit() {\n  local relation\n  [[ \"$release_commit\" =~ ^[0-9a-f]{40}$ ]] || fail 'existing release target is not an exact commit'\n  if [[ \"$release_commit\" == \"$source_sha\" ]]; then\n    printf 'exact\\n'\n    return 0\n  fi\n  [[ -n \"$fixed_tag\" ]] || fail 'existing release target differs from the exact source commit'\n  relation=\"$(gh api \"repos/$repository/compare/$release_commit...$source_sha\" --jq '.status')\" \\\n    || fail 'release commit comparison failed'\n  [[ \"$relation\" == ahead ]] || fail \"published release commit is not an ancestor of the source (status: $relation)\"\n  printf 'earlier\\n'\n}\n\nreleases=\"$(gh api --paginate --slurp \"repos/$repository/releases?per_page=100\")\" \\\n  || fail 'release list request failed'\nmatches=\"$(jq -c --arg tag \"$prepare_tag\" '[.[][]? | select(.tag_name == $tag)]' <<<\"$releases\")\" \\\n  || fail 'release list response is invalid'\ncount=\"$(jq -r 'length' <<<\"$matches\")\" || fail 'release list match count is invalid'\ncase \"$count\" in\n  0)\n    refs=\"$(gh api --paginate --slurp \"repos/$repository/git/matching-refs/tags/$prepare_tag?per_page=100\")\" \\\n      || fail 'matching release tag lookup failed'\n    exact_ref=\"$(jq -r --arg ref \"refs/tags/$prepare_tag\" '[.[][]? | select(.ref == $ref)] | length' <<<\"$refs\")\" \\\n      || fail 'matching release tag response is invalid'\n    [[ \"$exact_ref\" == 0 ]] || fail 'tag exists without a published release; draft or orphan requires reconciliation'\n    printf 'action=build\\n' >> \"$GITHUB_OUTPUT\"\n    exit 0\n    ;;\n  1) ;;\n  *) fail 'multiple releases use the exact source tag' ;;\nesac\n\nrelease_commit=\"$(jq -r '.[0].target