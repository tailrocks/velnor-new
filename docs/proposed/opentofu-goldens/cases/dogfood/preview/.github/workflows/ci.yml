      - rust-velnor-runner-host
      - check-maintenance-helpers
      - actionlint
      - alint
      - cargo-deny
      - cargo-machete
      - zizmor
    if: ${{ !cancelled() }}
    steps:
      - *s2
      - *s6
      - *s7
      - *s8
