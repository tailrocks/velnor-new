  rust-velnor-actions-orchestrator:
    name: Rust / velnor-actions-orchestrator
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      MBX_BUILD_SCRIPT_EXECUTION: "0"
      MBX_CC: "0"
      MBX_GC_AUTO: "0"
      MBX_SHARE_OUT_DIR: "0"
      RUSTUP_TOOLCHAIN: 1.99.1
    needs:
      - plan
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
