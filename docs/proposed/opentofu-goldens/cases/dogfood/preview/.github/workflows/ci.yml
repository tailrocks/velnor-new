      VELNOR_RUN_KEY_ATTEMPT: ${{ needs.plan.outputs.plan_attempt || github.run_attempt }}
    permissions:
      contents: read
      actions: read
    needs:
      - plan
      - rust-velnor-actions-actionlint
      - rust-velnor-actions-cli
      - rust-velnor-actions-contract
      - rust-velnor-actions-mise
