      - name: Stage helper (pre-seed trust-on-review)
        run: sh -c 'unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN GITHUB_TOKEN MISE_GITHUB_TOKEN GH_TOKEN GH_HOST GH_CONFIG_DIR; mkdir -p $RUNNER_TEMP/velnor/bin && cp $RUNNER_TEMP/velnor/preseed/velnor-actions $RUNNER_TEMP/velnor/bin/velnor-actions-0.1.12 && chmod +x $RUNNER_TEMP/velnor/bin/velnor-actions-0.1.12'
      - name: Download plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: velnor-plan-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/velnor/r${{ github.run_id }}-a${{ github.run_attempt }}
      - name: Prepare pinned tools
        env:
          MISE_CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
        run: mise --no-config --no-env --no-hooks install rust@1.98.1 actionlint@1.7.12 shellcheck@0.11.0 zizmor@1.31.1 aqua:nextest-rs/nextest/cargo-nextest@0.9.148
      - name: Prepare Rust components
        env:
          CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
          RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
