  rust-velnor-runner-github:
    name: Rust / velnor-runner-github
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      CARGO_CACHE_AUTO_CLEAN_FREQUENCY: never
      MBX_BUILD_SCRIPT_EXECUTION: "0"
