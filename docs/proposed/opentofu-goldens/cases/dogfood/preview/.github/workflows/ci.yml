      - plan
    if: "!contains(needs.plan.outputs.not_affected_jobs, ',rust-velnor-runner-github,')"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
