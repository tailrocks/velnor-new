# Generated by Velnor Actions 0.1.19; edit .velnor/config.toml and regenerate.
name: Job image candidate
"on":
  push: {}
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build-image-candidate:
    name: Build Linux job image candidate
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      artifact_name: velnor-job-image-candidate-${{ github.run_attempt }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Use the exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install the Buildx plugin from .velnor/runner.lock
        shell: bash
        run: "python3 - \"$GITHUB_WORKSPACE/.velnor/runner.lock\" \"$RUNNER_TEMP/velnor-docker-config/cli-plugins/docker-buildx\" <<'PY'\nimport hashlib\nimport os\nfrom pathlib import Path\nimport re\nimport subprocess\nimport sys\nimport tempfile\nimport tomllib\n\nlock = tomllib.loads(Path(sys.argv[1]).read_text())\nversion = lock[\"buildx_version\"]\nasset_url = lock[\"buildx_asset_url\"]\nexpected_url = f\"https://github.com/docker/buildx/releases/download/v{version}/buildx-v{version}.linux-amd64\"\nexpected_sha256 = lock[\"buildx_sha256\"]\nif asset_url != expected_url or not re.fullmatch(r\"[0-9a-f]{64}\", expected_sha256):\n    raise SystemExit(\"The Buildx values in .velnor/runner.lock are incorrect.\")\n\nplugin = Path(sys.argv[2])\nplugin.parent.mkdir(parents=True, exist_ok=True, mode=0o700)\nplugin.parent.chmod(0o700)\nfd, temporary = tempfile.mkstemp(prefix=\".docker-buildx.\", dir=plugin.parent)\nos.close(fd)\ntry:\n    subprocess.run(\n        [\"curl\", \"--retry\", \"5\", \"--retry-delay\", \"2\", \"--retry-all-errors\",\n         \"--fail\", \"--silent\", \"--show-error\", \"--location\", \"--output\", temporary,\n         asset_url],\n        check=True,\n    )\n    with Path(temporary).open(\"rb\") as stream:\n        actual_sha256 = hashlib.file_digest(stream, \"sha256\").hexdigest()\n    if actual_sha256 != expected_sha256:\n        raise SystemExit(\"The Buildx checksum is different from the value in .velnor/runner.lock.\")\n    os.chmod(temporary, 0o755)\n    os.replace(temporary, plugin)\n    plugin.chmod(0o755)\nfinally:\n    if os.path.exists(temporary):\n        os.unlink(temporary)\nPY"
      - name: Build the job image candidate
        shell: bash
        run: "DOCKER_CONFIG=\"$RUNNER_TEMP/velnor-docker-config\" python3 images/job/ubuntu-26.04/candidate/candidate.py build --source-commit \"$GITHUB_SHA\" --archive \"$RUNNER_TEMP/job-image.oci.tar\" --record \"$RUNNER_TEMP/job-image-candidate.json\""
      - name: Store candidate archive and record
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: velnor-job-image-candidate-${{ github.run_attempt }}
          path: "${{ runner.temp }}/job-image.oci.tar\n${{ runner.temp }}/job-image-candidate.json"
          if-no-files-found: error
          retention-days: 30
  attest-image-candidate:
    name: Attest Linux job image candidate
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs:
      - build-image-candidate
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Use the exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Examine the uploaded artifact ID
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs.build-image-candidate.outputs.artifact_id }}
        run: "if [[ ! \"$ARTIFACT_ID\" =~ ^[1-9][0-9]*$ ]]; then\n  printf '%s\\n' 'The artifact ID is missing or incorrect.' >&2\n  exit 1\nfi"
      - name: Get the job image candidate from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build-image-candidate.outputs.artifact_id }}
          path: candidate
      - name: Do a check of source and archive identity
        shell: bash
        run: "python3 images/job/ubuntu-26.04/candidate/candidate.py validate --archive \"candidate/job-image.oci.tar\" --record \"candidate/job-image-candidate.json\""
      - name: Attest the exact candidate bytes
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: "candidate/job-image.oci.tar\ncandidate/job-image-candidate.json"
  publish-job-image:
    name: Publish Linux job image
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs:
      - build-image-candidate
      - attest-image-candidate
    concurrency:
      group: ${{ github.repository }}-job-image-publish
      cancel-in-progress: false
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: write
    steps:
      - name: Use the exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Examine the uploaded artifact ID
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs.build-image-candidate.outputs.artifact_id }}
        run: "if [[ ! \"$ARTIFACT_ID\" =~ ^[1-9][0-9]*$ ]]; then\n  printf '%s\\n' 'The artifact ID is missing or incorrect.' >&2\n  exit 1\nfi"
      - name: Get the job image candidate from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build-image-candidate.outputs.artifact_id }}
          path: candidate
      - name: Publish the verified job image
        shell: bash
        run: "python3 images/job/ubuntu-26.04/candidate/publish.py --root . --archive \"candidate/job-image.oci.tar\" --record \"candidate/job-image-candidate.json\" --result \"$RUNNER_TEMP/job-image-publication.json\""
        env:
          GH_TOKEN: ${{ github.token }}
          VELNOR_CANDIDATE_ARTIFACT_ID: ${{ needs.build-image-candidate.outputs.artifact_id }}
      - name: Store job image publication evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: velnor-job-image-publication-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/job-image-publication.json
          if-no-files-found: error
          retention-days: 7
