fail \"rust_installed_manifest_missing: $t/lib/rustlib/components\"; find \"$t\" ! -type f ! -type d > \"$d/special\"; test ! -s \"$d/special\" || fail \"rust_toolchain_file_unexpected: $t holds a symlink or a special file\"; awk -v comps=\"$t/lib/rustlib/components\" '\\''BEGIN { while ((getline line < comps) > 0) if (line != \"\") want[line] = 1 } /^\\[/ { key = \"\"; if ($0 ~ /^\\[pkg\\.[^]]*\\.target\\.[^]]*\\]$/) { s = substr($0, 6, length($0) - 6); p = index(s, \".target.\"); k = substr(s, 1, p - 1) \"-\" substr(s, p + 8); if (k in want) key = k } next } key != \"\" && $1 == \"xz_url\" { u = $3; gsub(/\"/, \"\", u); url[key] = u } key != \"\" && $1 == \"xz_hash\" { h = $3; gsub(/\"/, \"\", h); hash[key] = h } END { for (k in want) { if (!(k in url) || !(k in hash)) exit 1; print k, url[k], hash[k] } }'\\'' \"$d/channel.toml\" > \"$d/tarballs\" || fail \"rust_component_not_in_manifest: $t lists a component the verified channel-rust-$v.toml does not ship\"; test -s \"$d/tarballs\" || fail \"rust_installed_manifest_empty: $t lists no component\"; : > \"$d/expected\"; while read -r comp url hash; do case \"$comp\" in *[!A-Za-z0-9._-]*|\"\") fail \"rust_component_name_invalid: $comp\";; esac; case \"$url\" in https://static.rust-lang.org/dist/*.tar.xz) ;; *) fail \"rust_component_url_untrusted: $url\";; esac; if [ ! -f \"$r/$comp.$hash\" ]; then get \"$d/c.tar.xz\" \"$url\"; printf \"%s  %s\\n\" \"$hash\" \"$d/c.tar.xz\" > \"$d/c.sha256\"; $h -c \"$d/c.sha256\" >/dev/null || fail \"rust_component_tarball_digest_mismatch: $comp\"; rm -rf \"$d/x\"; mkdir \"$d/x\"; tar -xJf \"$d/c.tar.xz\" -C \"$d/x\" --strip-components=1; rm -f \"$d/c.tar.xz\"; : > \"$d/c.sums\"; while read -r sub; do case \"$sub\" in *[!A-Za-z0-9._-]*|\"\"|.|..) fail \"rust_component_name_invalid: $sub\";; esac; (cd \"$d/x/$sub\" && find . -type f ! -path ./manifest.in -exec $h {} +) >> \"$d/c.sums\"; done < \"$d/x/components\"; mv \"$d/c.sums\" \"$r/$comp.$hash\"; fi; cat \"$r/$comp.$hash\" >> \"$d/expected\"; done < \"$d/tarballs\"; (cd \"$t\" && find . -type f ! -path ./lib/rustlib/components ! -path \"./lib/rustlib/manifest-*\" ! -path ./lib/rustlib/multirust-channel-manifest.toml ! -path ./lib/rustlib/multirust-config.toml ! -path ./lib/rustlib/rust-installer-version -exec $h {} +) > \"$d/installed\"; LC_ALL=C sort -k2 \"$d/expected\" > \"$d/expected.sorted\"; LC_ALL=C sort -k2 \"$d/installed\" > \"$d/installed.sorted\"; if ! cmp -s \"$d/expected.sorted\" \"$d/installed.sorted\"; then LC_ALL=C diff \"$d/expected.sorted\" \"$d/installed.sorted\" | head -n 20 >&2 || true; fail \"rust_toolchain_bytes_mismatch: $t differs from the component tarballs of the verified channel-rust-$v.toml\"; fi; printf \"%s\\n\" \"velnor: Rust $v toolchain verified file by file against the component tarballs of channel-rust-$v.toml (SHA-256 $want)\"'"
      - name: Build exact-source native image maintenance
        shell: bash
        run: "set -euo pipefail\ntrusted_git() { /usr/bin/env -i PATH=/usr/bin:/bin GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_OPTIONAL_LOCKS=0 /usr/bin/git --git-dir=\"$GITHUB_WORKSPACE/.git\" --work-tree=\"$GITHUB_WORKSPACE\" -c core.fsmonitor=false \"$@\"; }\nsource_sha=\"$(trusted_git rev-parse --verify HEAD)\"\ntest \"$source_sha\" = \"$GITHUB_SHA\"\ntest \"$GITHUB_WORKFLOW_SHA\" = \"$GITHUB_SHA\"\nif ! trusted_git diff --cached --quiet --no-ext-diff --no-textconv --ignore-submodules=none || ! trusted_git diff --quiet --no-ext-diff --no-textconv --ignore-submodules=none; then\n  printf '%s\\n' 'The source checkout is not clean.' >&2\n  exit 1\nfi\nstatus_file=\"$(mktemp \"$RUNNER_TEMP/velnor-image-source-status.XXXXXXXX\")\"\ntrusted_git status --porcelain=v1 --untracked-files=all --ignore-submodules=none -z > \"$status_file\"\nif [[ -s \"$status_file\" ]]; then\n  printf '%s\\n' 'The source checkout is not clean.' >&2\n  exit 1\nfi\nenv -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_RUNTIME_TOKEN -u GITHUB_TOKEN -u MISE_GITHUB_TOKEN -u GH_TOKEN -u GH_HOST -u GH_CONFIG_DIR mise --no-config --no-env --no-hooks exec 'rust@'\"${VELNOR_TOOL_RUST}\" 'mr-boxington@'\"${VELNOR_TOOL_MR_BOXINGTON}\" -- mbx build --release --locked --package velnor-actions-cli --bin velnor-actions\ntest -f target/release/velnor-actions && test ! -L target/release/velnor-actions\numask 077\nimage_binary_dir=\"$(mktemp -d \"$RUNNER_TEMP/velnor-native-image-actions.XXXXXXXX\")\"\nimage_binary=\"$image_binary_dir/velnor-native-image-actions\"\n( set -o noclobber; cat target/release/velnor-actions > \"$image_binary\" )\nchmod 0500 \"$image_binary\"\nprintf 'VELNOR_NATIVE_IMAGE_ACTIONS=%s\\n' \"$image_binary\" >> \"$GITHUB_ENV\""
      - name: Verify native implementation source closure
        shell: bash
        run: "\"$VELNOR_NATIVE_IMAGE_ACTIONS\" image-maintenance check-job-source --root \"$GITHUB_WORKSPACE\" --source-commit \"$GITHUB_SHA\" --source-closure-path \"$RUNNER_TEMP/job-image-native-source-closure.json\""
      - name: Install the Buildx plugin from .velnor/runner.lock
        shell: bash
        run: "\"$VELNOR_NATIVE_IMAGE_ACTIONS\" image-maintenance install-buildx --root \"$GITHUB_WORKSPACE\" --runner-temp \"$RUNNER_TEMP\""
      - name: Build the job image candidate
        shell: bash
        run: "\"$VELNOR_NATIVE_IMAGE_ACTIONS\" image-maintenance build-job-candidate --root \"$GITHUB_WORKSPACE\" --source-commit \"$GITHUB_SHA\" --runner-temp \"$RUNNER_TEMP\" --archive-path \"$RUNNER_TEMP/job-image.oci.tar\" --record-path \"$RUNNER_TEMP/job-image-candidate.json\" --source-closure-path \"$RUNNER_TEMP/job-image-native-source-closure.json\""
      - name: Upload candidate archive and record
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: velnor-job-image-candidate-${{ github.run_attempt }}
          path: "${{ runner.temp }}/job-image.oci.tar\n${{ runner.temp }}/job-image-candidate.json\n${{ runner.temp }}/job-image-native-source-closure.json"
          if-no-files-found: error
          retention-days: 30
  attest-image-candidate:
    name: Attest Linux job image candidate
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs:
      - build-image-candidate
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Examine the uploaded artifact ID
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs.build-image-candidate.outputs.artifact_id }}
        run: "if [[ ! \"$ARTIFACT_ID\" =~ ^[1-9][0-9]*$ ]]; then\n  printf '%s\\n' 'The artifact ID is missing or incorrect.' >&2\n  exit 1\nfi"
      - name: Download the job image candidate from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build-image-candidate.outputs.artifact_id }}
          path: ${{ runner.temp }}/privatecandidate
      - name: Materialize fixed image authority implementation
        shell: bash
        run: "set -eu\ndir=\"$RUNNER_TEMP/velnor-image-authority\"\nrm -rf \"$dir\"\nmkdir -p \"$dir\"\ncat > \"$dir/job_image_authority_identity.py\" <<'VELNOR_IMAGE_AUTHORITY_EOF'\n# SPDX-FileCopyrightText: 2026 Alexey Zhokhov\n# SPDX-License-Identifier: Apache-2.0\n\"\"\"Fixed publication identity and GitHub authorization checks.\n\nData-only port of the authorization logic in\n``images/job/ubuntu-26.04/candidate/publish.py``. Every input arrives as\nalready-authenticated GitHub API data at the exact source SHA: the rendered\nauthority workflow performs the ``gh api`` and ``gh attestation verify``\ncalls, and this module only validates the returned payloads. It never reads\nprocess state, never starts new tasks, never touches a checkout, and never\nimports candidate code.\n\"\"\"\nimport json\nimport re\n\nREPOSITORY = \"tailrocks/velnor-new\"\nREPOSITORY_ID = 1390620900\nWORKFLOW = \"tailrocks/velnor-new/.github/workflows/job-image-candidate.yml\"\nARTIFACT_PREFIX = \"velnor-job-image-candidate-\"\nMAX_JSON_BYTES = 2 * 1024 * 1024\nIDENTITY_KEYS = {\n    \"repository\", \"repository_id\", \"event\", \"workflow_ref\", \"ref\",\n    \"authority_commit\", \"run_id\", \"run_attempt\", \"source\", \"artifact_id\",\n}\n\n\nclass AuthorityError(ValueError):\n    pass\n\n\ndef _unique_object(pairs):\n    result = {}\n    for key, value in pairs:\n        if key in result:\n            raise AuthorityError(f\"Duplicate JSON key: {key}\")\n        result[key] = value\n    return result\n\n\ndef _reject_constant(value):\n    raise AuthorityError(f\"JSON constant has an incorrect value: {value}.\")\n\n\ndef _json_bytes(data, label):\n    try:\n        return json.loads(data, object_pairs_hook=_unique_object, parse_constant=_reject_constant)\n    except (UnicodeDecodeError, json.JSONDecodeError) as error:\n        raise AuthorityError(f\"{label} has an incorrect format.\") from error\n\n\ndef _read_limited_file(path, limit, label):\n    if path.is_symlink() or not path.is_file():\n        raise AuthorityError(f\"{label} must be a regular file.\")\n    if path.stat().st_size > limit:\n        raise AuthorityError(f\"{label} exceeds its size limit.\")\n    with path.open(\"rb\") as stream:\n        data = stream.read(limit + 1)\n    if len(data) > limit:\n        raise AuthorityError(f\"{label} exceeds its size limit.\")\n    return data\n\n\ndef _sha1(value, label):\n    if not isinstance(value, str) or not re.fullmatch(r\"[0-9a-f]{40}\", value):\n        raise AuthorityError(f\"{label} is incorrect.\")\n    return value\n\n\ndef _run_id(value, label):\n    if type(value) is not int or value < 1:\n        raise AuthorityError(f\"{label} is incorrect.\")\n    return value\n\n\ndef load_identity(path):\n    return _json_bytes(_read_limited_file(path, MAX_JSON_BYTES, \"Publication identity\"), \"publication identity\")\n\n\ndef validate_identity(value):\n    if not isinstance(value, dict) or set(value) != IDENTITY_KEYS:\n        raise AuthorityError(\"Publication identity has unknown or missing fields.\")\n    if value[\"repository\"] != REPOSITORY:\n        raise AuthorityError(\"Publication repository is incorrect.\")\n    if value[\"ref\"] != \"refs/heads/main\" or value[\"event\"] != \"workflow_dispatch\":\n        raise AuthorityError(\"Publication is only for workflow_dispatch on refs/heads/main.\")\n    if value[\"workflow_ref\"] != f\"{WORKFLOW}@refs/heads/main\":\n        raise AuthorityError(\"Publication workflow authority is incorrect.\")\n    source = _sha1(value[\"source\"], \"Source SHA\")\n    authority = _sha1(value[\"authority_commit\"], \"Workflow authority SHA\")\n    if authority != source:\n        raise AuthorityError(\"Workflow authority SHA is different from source SHA.\")\n    if type(value[\"repository_id\"]) is not int or value[\"repository_id\"] != REPOSITORY_ID:\n        raise AuthorityError(\"GitHub repository ID is incorrect.\")\n    _run_id(value[\"run_id\"], \"Publication run ID\")\n    _run_id(value[\"run_attempt\"], \"Publication run attempt\")\n    _run_id(value[\"artifact_id\"], \"Candidate artifact ID\")\n    return value\n\n\ndef validate_repository(repository, tip, identity):\n    if (\n        not isinstance(repository, dict)\n        or repository.get(\"full_name\") != REPOSITORY\n        or type(repository.get(\"id\")) is not int\n        or repository[\"id\"] != REPOSITORY_ID\n        or identity[\"repository_id\"] != REPOSITORY_ID\n    ):\n        raise AuthorityError(\"GitHub repository ID is not the same as the canonical repository ID.\")\n    if not isinstance(tip, dict) or tip.get(\"sha\") != identity[\"source\"]:\n        raise AuthorityError(\"Source SHA is not the current main commit.\")\n    return identity[\"source\"]\n\n\ndef validate_candidate_identity(record, identity):\n    source = record.get(\"source\") if isinstance(record, dict) else None\n    if (\n        not isinstance(source, dict)\n        or source.get(\"commit\") != identity[\"source\"]\n        or source.get(\"ref\") != \"refs/heads/main\"\n    ):\n        raise AuthorityError(\"Candidate source is not the current main source.\")\n    if record.get(\"workflow\") != {\n        \"repository\": REPOSITORY,\n        \"repository_id\": identity[\"repository_id\"],\n        \"event\": \"workflow_dispatch\",\n        \"workflow_ref\": identity[\"workflow_ref\"],\n        \"authority_commit\": identity[\"source\"],\n        \"run_id\": identity[\"run_id\"],\n        \"run_attempt\": identity[\"run_attempt\"],\n    }:\n        raise AuthorityError(\"Candidate run identity is different from the publication run identity.\")\n    return record\n\n\ndef validate_artifact_record(value, identity):\n    if not isinstance(value, dict) or not isinstance(value.get(\"artifacts\"), list):\n        raise AuthorityError(\"Candidate artifact response has an incorrect format.\")\n    expected_name = f\"{ARTIFACT_PREFIX}{identity['run_attempt']}\"\n    matches = [\n        item for item in value[\"artifacts\"]\n        if isinstance(item, dict) and item.get(\"name\") == expected_name\n    ]\n    if len(matches) != 1:\n        raise AuthorityError(\"This workflow run must have one candidate artifact.\")\n    artifact = matches[0]\n    if (\n        artifact.get(\"id\") != identity[\"artifact_id\"]\n        or artifact.get(\"expired\") is not False\n        or artifact.get(\"workflow_run\", {}).get(\"id\") != identity[\"run_id\"]\n        or artifact.get(\"workflow_run\", {}).get(\"head_sha\") != identity[\"source\"]\n        or artifact.get(\"workflow_run\", {}).get(\"head_branch\") != \"main\"\n    ):\n        raise AuthorityError(\"Candidate artifact ID, expiry, or workflow run is incorrect.\")\n    return artifact[\"id\"]\n\n\ndef select_ci_run(value, source):\n    if not isinstance(value, dict) or not isinstance(value.get(\"workflow_runs\"), list):\n        raise AuthorityError(\"Canonical CI run response has an incorrect format.\")\n    runs = [\n        run for run in value[\"workflow_runs\"]\n        if isinstance(run, dict)\n        and run.get(\"path\") == \".github/workflows/ci.yml\"\n        and run.get(\"event\") == \"push\"\n        and run.get(\"head_branch\") == \"main\"\n        and run.get(\"head_sha\") == source\n        and isinstance(run.get(\"head_repository\"), dict)\n        and run[\"head_repository\"].get(\"full_name\") == REPOSITORY\n        and type(run.get(\"run_number\")) is int\n        and type(run.get(\"run_attempt\")) is int\n    ]\n    if not runs:\n        raise AuthorityError(\"No canonical main CI push run exists for this source.\")\n    runs.sort(key=lambda item: (item[\"run_number\"], item[\"id\"]))\n    latest = runs[-1]\n    same_number = [item for item in runs if item[\"run_number\"] == latest[\"run_number\"]]\n    if len(same_number) != 1 or latest.get(\"status\") != \"completed\" or latest.get(\"conclusion\") != \"success\":\n        raise AuthorityError(\"The latest canonical main CI run has no `success` conclusion.\")\n    return {\"run_id\": latest[\"id\"], \"run_attempt\": latest[\"run_attempt\"]}\n\n\ndef validate_attestation_output(value, source):\n    if not isinstance(value, list) or not value:\n        raise AuthorityError(\"Attestation verification output has no records.\")\n    for item in value:\n        try:\n            certificate = item[\"verificationResult\"][\"signature\"][\"certificate\"]\n            identifier = certificate[\"sourceRepositoryIdentifier\"]\n        except (KeyError, TypeError) as error:\n            raise AuthorityError(\"Attestation certificate has no repository identifier.\") from error\n        if not (\n            (type(identifier) is int and identifier == REPOSITORY_ID)\n            or (type(identifier) is str and identifier == str(REPOSITORY_ID))\n        ):\n            raise AuthorityError(\"Attestation certificate repository ID is incorrect.\")\n        if (\n            certificate.get(\"githubWorkflowRepository\") != REPOSITORY\n            or certificate.get(\"githubWorkflowSHA\") != source\n            or certificate.get(\"githubWorkflowRef\") != \"refs/heads/main\"\n            or certificate.get(\"githubWorkflowTrigger\") != \"workflow_dispatch\"\n            or certificate.get(\"sourceRepositoryRef\") != \"refs/heads/main\"\n            or certificate.get(\"sourceRepositoryDigest\") != source\n        ):\n            raise AuthorityError(\"Attestation certificate source or workflow identity is incorrect.\")\n    return len(value)\n\n\ndef validate_source_inputs(record_source, authenticated_source):\n    if not isinstance(authenticated_source, dict):\n        raise AuthorityError(\"Authenticated source data has an incorrect format.\")\n    commit = authenticated_source.get(\"commit\")\n    if not isinstance(commit, str) or not re.fullmatch(r\"[0-9a-f]{40}\", commit):\n        raise AuthorityError(\"Authenticated source commit is incorrect.\")\n    if not isinstance(record_source, dict) or record_source.get(\"commit\") != commit:\n        raise AuthorityError(\"Candidate source is not the authenticated source.\")\n    inputs = authenticated_source.get(\"inputs\")\n    if not isinstance(inputs, dict) or not inputs:\n        raise AuthorityError(\"Authenticated source inputs have an incorrect format.\")\n    for name, digest in inputs.items():\n        if not isinstance(name, str) or not name or \"\\\\\" in name or not isinstance(digest, str) or not re.fullmatch(r\"[0-9a-f]{64}\", digest):\n            raise AuthorityError(\"Source input hash is incorrect.\")\n    if record_source.get(\"inputs\") != inputs:\n        raise AuthorityError(\"Build input bytes changed after candidate creation.\")\n    return commit\n\n\ndef validate_build_lock(builder, buildx_version):\n    if not isinstance(buildx_version, str) or re.fullmatch(r\"\\d+\\.\\d+\\.\\d+\", buildx_version) is None:\n        raise AuthorityError(\"Authenticated Buildx version is incorrect.\")\n    match = re.fullmatch(r\"github\\.com/docker/buildx v(\\d+\\.\\d+\\.\\d+)(?: .+)?\", builder)\n    if match is None or match.group(1) != buildx_version:\n        raise AuthorityError(\"Candidate Buildx identity is not the same as the value in .velnor/runner.lock.\")\n    return builder\nVELNOR_IMAGE_AUTHORITY_EOF\ncat > \"$dir/job_image_authority_registry.py\" <<'VELNOR_IMAGE_AUTHORITY_EOF'\n# SPDX-FileCopyrightText: 2026 Alexey Zhokhov\n# SPDX-License-Identifier: Apache-2.0\n\"\"\"Fixed OCI registry origin, redirect, token, and response checks.\n\nData-only port of the registry logic in\n``images/job/ubuntu-26.04/candidate/publish.py``. The rendered authority\nworkflow performs the bounded HTTPS calls; this module only decides which\nURLs may be used, which redirects may be followed without credentials, and\nwhether a received response proves the requested bytes. It never opens a\nnetwork path and never sees registry credentials.\n\"\"\"\nimport hashlib\nimport json\nimport re\nfrom urllib.parse import parse_qsl, unquote, urlencode, urljoin, urlsplit, urlunsplit\n\nREGISTRY = \"ghcr.io\"\nDOWNLOAD_HOST = \"pkg-containers.githubusercontent.com\"\nPACKAGE = \"tailrocks/velnor-job\"\n\n\nclass AuthorityError(ValueError):\n    pass\n\n\ndef _unique_object(pairs):\n    result = {}\n    for key, value in pairs:\n        if key in result:\n            raise AuthorityError(f\"Duplicate JSON key: {key}\")\n        result[key] = value\n    return result\n\n\ndef _reject_constant(value):\n    raise AuthorityError(f\"JSON constant has an incorrect value: {value}.\")\n\n\ndef _token_json(data, label):\n    try:\n        return json.loads(data, object_pairs_hook=_unique_object, parse_constant=_reject_constant)\n    except (UnicodeDecodeError, json.JSONDecodeError) as error:\n        raise AuthorityError(f\"{label} has an incorrect format.\") from error\n\n\ndef registry_url(path):\n    return f\"https://{REGISTRY}/v2/{PACKAGE}/{path}\"\n\n\ndef blob_download_location(location, digest):\n    if any(ord(char) < 32 or ord(char) == 127 for char in location) or \"\\\\\" in location:\n        raise AuthorityError(\"Registry download URL has an incorrect character.\")\n    try:\n        parts = urlsplit(location)\n    except ValueError as error:\n        raise AuthorityError(\"Registry download URL has an incorrect format.\") from error\n    if (\n        parts.scheme != \"https\"\n        or parts.hostname != DOWNLOAD_HOST\n        or parts.port not in (None, 443)\n        or parts.username is not None\n        or parts.password is not None\n        or parts.fragment\n        or not parts.path.endswith(f\"/blobs/{digest}\")\n    ):\n        raise AuthorityError(\"Registry download URL is outside the permitted HTTPS location.\")\n    decoded = unquote(parts.path + parts.query)\n    if any(ord(char) < 32 or ord(char) == 127 for char in decoded) or \"\\\\\" in decoded:\n        raise AuthorityError(\"Registry download URL has an incorrect character.\")\n    return urlunsplit((\"\", \"\", parts.path, parts.query, \"\"))\n\n\ndef validate_upload_location(base, location):\n    if not location or len(location) > 4096 or \"\\\\\" in location or any(ord(char) < 32 or ord(char) == 127 for char in location):\n        raise AuthorityError(\"Registry upload location is missing or too long.\")\n    try:\n        location_parts = urlsplit(location)\n        raw_path = unquote(location_parts.path)\n        resolved = urljoin(base, location)\n        parsed = urlsplit(resolved)\n        port = parsed.port\n    except ValueError as error:\n        raise AuthorityError(\"Registry upload location is outside the fixed HTTPS upload path.\") from error\n    if any(part in {\".\", \"..\"} for part in raw_path.split(\"/\")):\n        raise AuthorityError(\"Registry upload location is outside the fixed HTTPS upload path.\")\n    decoded_path = unquote(parsed.path)\n    expected_prefixes = (\n        f\"/v2/{PACKAGE}/blobs/upload/\",\n        f\"/v2/{PACKAGE}/blobs/uploads/\",\n    )\n    query_values = parse_qsl(parsed.query, keep_blank_values=True)\n    if (\n        parsed.scheme != \"https\"\n        or parsed.hostname != REGISTRY\n        or port not in (None, 443)\n        or parsed.username is not None\n        or parsed.password is not None\n        or parsed.fragment\n        or not decoded_path.startswith(expected_prefixes)\n        or \"\\\\\" in decoded_path\n        or any(ord(char) < 32 for char in decoded_path)\n        or any(ord(char) == 127 for char in decoded_path)\n        or any(ord(char) < 32 or ord(char) == 127 for key, value in query_values for char in key + value)\n        or any(part in {\".\", \"..\"} for part in decoded_path.split(\"/\"))\n    ):\n        raise AuthorityError(\"Registry upload location is outside the fixed HTTPS upload path.\")\n    if any(not key for key, _ in query_values):\n        raise AuthorityError(\"Registry upload query has an incorrect format.\")\n    return resolved\n\n\ndef upload_target(location, digest):\n    try:\n        parts = urlsplit(location)\n    except ValueError as error:\n        raise AuthorityError(\"Registry upload location is outside the fixed HTTPS upload path.\") from error\n    query = parse_qsl(parts.query, keep_blank_values=True)\n    if any(key == \"digest\" for key, _ in query):\n        raise AuthorityError(\"Registry upload location contains a digest parameter.\")\n    if not isinstance(digest, str) or not re.fullmatch(r\"sha256:[0-9a-f]{64}\", digest):\n        raise AuthorityError(\"OCI blob descriptor is incorrect.\")\n    digest_query = urlencode({\"digest\": digest})\n    merged = f\"{parts.query}&{digest_query}\" if parts.query else digest_query\n    return urlunsplit((parts.scheme, parts.netloc, parts.path, merged, \"\"))\n\n\ndef parse_auth_challenge(value):\n    if not isinstance(value, str):\n        raise AuthorityError(\"Registry authentication challenge has an incorrect format.\")\n    match = re.fullmatch(r\"Bearer\\s+(.+)\", value)\n    if match is None:\n        raise AuthorityError(\"Registry authentication challenge has an incorrect format.\")\n    params = {}\n    remaining = match.group(1)\n    while remaining:\n        part = re.match(r'\\s*([A-Za-z][A-Za-z0-9_-]*)=\"([^\"\\\\]*)\"\\s*(?:,|$)', remaining)\n        if part is None or part.group(1) in params:\n            raise AuthorityError(\"Registry authentication challenge has an incorrect format.\")\n        params[part.group(1)] = part.group(2)\n        remaining = remaining[part.end():]\n    if (\n        set(params) - {\"realm\", \"service\", \"scope\"}\n        or params.get(\"realm\") != f\"https://{REGISTRY}/token\"\n        or params.get(\"service\") != REGISTRY\n    ):\n        raise AuthorityError(\"Registry authentication challenge has an incorrect format.\")\n    return params\n\n\ndef token_request_url(params):\n    if not isinstance(params, dict) or set(params) - {\"realm\", \"service\", \"scope\"}:\n        raise AuthorityError(\"Registry authentication challenge has an incorrect format.\")\n    query = urlencode({\"service\": \"ghcr.io\", \"scope\": f\"repository:{PACKAGE}:pull,push\"})\n    return f\"https://{REGISTRY}/token?{query}\"\n\n\ndef parse_token_payload(data):\n    value = _token_json(data, \"Registry token response\")\n    token = value.get(\"token\", value.get(\"access_token\")) if isinstance(value, dict) else None\n    if not isinstance(token, str) or not re.fullmatch(r\"[A-Za-z0-9._~=-]{16,8192}\", token):\n        raise AuthorityError(\"Registry token response has no token in the required format.\")\n    return token\n\n\ndef check_head_response(status, headers, digest, size):\n    if status == 404:\n        return False\n    if status != 200 or headers.get(\"docker-content-digest\") != digest:\n        raise AuthorityError(\"Registry digest HEAD verification failed.\")\n    if headers.get(\"content-length\") != str(size):\n        raise AuthorityError(\"Registry size HEAD verification failed.\")\n    return True\n\n\ndef redirect_target(path, digest, status, location):\n    if status not in (302, 307):\n        return None\n    if path != f\"/v2/{PACKAGE}/blobs/{digest}\":\n        raise AuthorityError(\"Registry manifest redirects are not permitted.\")\n    return blob_download_location(location, digest)\n\n\ndef check_get_response(status, headers, body, digest, size, expected):\n    if status != 200:\n        raise AuthorityError(f\"Registry GET status is incorrect: {status}.\")\n    if headers.get(\"content-length\") != str(size):\n        raise AuthorityError(\"Registry GET size is different from the specified size.\")\n    if headers.get(\"docker-content-digest\") not in (None, digest):\n        raise AuthorityError(\"Registry GET digest header is different from the requested digest.\")\n    if len(body) != size:\n        raise AuthorityError(\"Registry GET size is different from the specified size.\")\n    if hashlib.sha256(body).hexdigest() != digest.removeprefix(\"sha256:\"):\n        raise AuthorityError(\"Registry response bytes have an incorrect digest or size.\")\n    if body != expected:\n        raise AuthorityError(\"Registry retrieved bytes changed during publication.\")\n    return len(body)\nVELNOR_IMAGE_AUTHORITY_EOF\ncat > \"$dir/job_image_authority_publish.py\" <<'VELNOR_IMAGE_AUTHORITY_EOF'\n# SPDX-FileCopyrightText: 2026 Alexey Zhokhov\n# SPDX-License-Identifier: Apache-2.0\n\"\"\"Fixed image publication assembly, byte verification, and evidence.\n\nData-only port of the publication orchestration in\n``images/job/ubuntu-26.04/candidate/publish.py``. It binds the signed\nrecord to its archive and OCI graph, extracts and verifies blob bytes from\nthe local archive, publishes every blob and the platform manifest through\nan injected registry transport, verifies the remote bytes with HEAD and\nGET readback, and builds the signed publication evidence. It never\nruns candidate code, never reads process state or a checkout, never opens\na network path itself (the rendered authority step supplies a bounded\nstdlib transport). Every registry URL, redirect, and response is\nvalidated through the registry helpers passed in as ``registry`` (the\nsibling ``job_image_authority_registry`` module in the rendered body),\nso this module keeps its standard-library-only imports.\n\"\"\"\nimport hashlib\nimport json\nimport re\nimport tarfile\n\nEVIDENCE_SCHEMA = \"velnor.job-image-publication.v1\"\nPACKAGE = \"ghcr.io/tailrocks/velnor-job\"\nMAX_MANIFEST_BYTES = 2 * 1024 * 1024\nMAX_UPLOAD_BYTES = 1024**3\nMAX_RESULT_BYTES = 64 * 1024\n\n\nclass AuthorityError(ValueError):\n    pass\n\n\ndef _unique_object(pairs):\n    result = {}\n    for key, value in pairs:\n        if key in result:\n            raise AuthorityError(f\"Duplicate JSON key: {key}\")\n        result[key] = value\n    return result\n\n\ndef _reject_constant(value):\n    raise AuthorityError(f\"JSON constant has an incorrect value: {value}.\")\n\n\ndef _json_bytes(data, label):\n    try:\n        return json.loads(data, object_pairs_hook=_unique_object, parse_constant=_reject_constant)\n    except (UnicodeDecodeError, json.JSONDecodeError) as error:\n        raise AuthorityError(f\"{label} has an incorrect format.\") from error\n\n\ndef _sha(data):\n    return hashlib.sha256(data).hexdigest()\n\n\ndef check_record_binding(record, archive_digest, archive_size, oci):\n    if not isinstance(record, dict):\n        raise AuthorityError(\"Candidate record has an incorrect format.\")\n    if record.get(\"archive\") != {\"sha256\": archive_digest, \"size_bytes\": archive_size}:\n        raise AuthorityError(\"Candidate archive is not the same as the archive in its signed record.\")\n    if record.get(\"oci\") != oci:\n        raise AuthorityError(\"Candidate OCI graph is not the same as the graph in its signed record.\")\n    return record\n\n\ndef blob_descriptors(manifest):\n    config = manifest.get(\"config\") if isinstance(manifest, dict) else None\n    layers = manifest.get(\"layers\") if isinstance(manifest, dict) else None\n    if not isinstance(config, dict) or not isinstance(layers, list):\n        raise AuthorityError(\"OCI manifest blob descriptors are incorrect.\")\n    unique = {}\n    for descriptor in [config, *layers]:\n        if not isinstance(descriptor, dict):\n            raise AuthorityError(\"OCI blob descriptor is incorrect.\")\n        digest = descriptor.get(\"digest\")\n        size = descriptor.get(\"size\")\n        if (\n            not isinstance(digest, str)\n            or not re.fullmatch(r\"sha256:[0-9a-f]{64}\", digest)\n            or type(size) is not int\n            or not 1 <= size <= MAX_UPLOAD_BYTES\n        ):\n            raise AuthorityError(\"OCI blob descriptor is incorrect.\")\n        if digest in unique and unique[digest] != size:\n            raise AuthorityError(\"Repeated OCI blob digest has inconsistent sizes.\")\n        unique[digest] = size\n    return unique\n\n\ndef _archive_blob(archive, digest, limit):\n    try:\n        with tarfile.open(archive, \"r:\") as tar:\n            member = tar.getmember(f\"blobs/sha256/{digest}\")\n            if not member.isfile() or member.size < 0:\n                raise AuthorityError(\"OCI blob descriptor size is incorrect.\")\n            stream = tar.extractfile(member)\n            if stream is None:\n                raise AuthorityError(\"OCI blob is missing from archive.\")\n            with stream:\n                return stream.read(limit + 1)\n    except (OSError, KeyError, tarfile.TarError) as error:\n        raise AuthorityError(\"Cannot read OCI blob from archive.\") from error\n\n\ndef read_manifest_bytes(archive, digest, size):\n    if type(size) is not int or size > MAX_MANIFEST_BYTES:\n        raise AuthorityError(\"OCI manifest exceeds its size limit.\")\n    raw = _archive_blob(archive, digest.removeprefix(\"sha256:\"), MAX_MANIFEST_BYTES)\n    if len(raw) != size or _sha(raw) != digest.removeprefix(\"sha256:\"):\n        raise AuthorityError(\"OCI platform manifest bytes changed after validation.\")\n    return raw\n\n\ndef extract_blob(archive, digest, expected_size, directory):\n    hexdigest = digest.removeprefix(\"sha256:\")\n    if not re.fullmatch(r\"[0-9a-f]{64}\", hexdigest) or type(expected_size) is not int or expected_size > MAX_UPLOAD_BYTES:\n        raise AuthorityError(\"OCI blob descriptor size is incorrect.\")\n    output = directory / hexdigest\n    hasher = hashlib.sha256()\n    size = 0\n    try:\n        with tarfile.open(archive, \"r:\") as tar:\n            member = tar.getmember(f\"blobs/sha256/{hexdigest}\")\n            if not member.isfile() or member.size != expected_size:\n                raise AuthorityError(\"OCI blob descriptor size is incorrect.\")\n            source = tar.extractfile(member)\n            if source is None:\n                raise AuthorityError(\"OCI blob is missing from archive.\")\n            with source, output.open(\"xb\") as destination:\n                while chunk := source.read(1024 * 1024):\n                    size += len(chunk)\n                    if size > expected_size:\n                        raise AuthorityError(\"OCI blob exceeds descriptor size.\")\n                    hasher.update(chunk)\n                    destination.write(chunk)\n    except (OSError, KeyError, tarfile.TarError) as error:\n        raise AuthorityError(\"Cannot read OCI blob from archive.\") from error\n    if size != expected_size or hasher.hexdigest() != hexdigest:\n        raise AuthorityError(\"OCI blob bytes are not the same as the bytes identified by their descriptor.\")\n    return output\n\n\ndef check_record_source(record_source, identity_source):\n    \"\"\"Bind evidence to the validated candidate source; refuse relabeling.\n\n    The candidate bytes are already bound to the record by\n    ``check_record_binding``. This binds the record to the authenticated\n    identity so unchanged bytes can never be relabeled with another\n    source SHA.\n    \"\"\"\n    if (\n        not isinstance(identity_source, str)\n        or not re.fullmatch(r\"[0-9a-f]{40}\", identity_source)\n    ):\n        raise AuthorityError(\"Authenticated source is incorrect.\")\n    if (\n        not isinstance(record_source, dict)\n        or record_source.get(\"commit\") != identity_source\n    ):\n        raise AuthorityError(\"Candidate source is not the authenticated source.\")\n    if record_source.get(\"ref\") != \"refs/heads/main\":\n        raise AuthorityError(\"Candidate source is not the current main source.\")\n    return identity_source\n\n\ndef _b64encode(data):\n    \"\"\"Encode bytes with the standard Base64 alphabet (no new imports).\"\"\"\n    alphabet = \"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/\"\n    out = []\n    for index in range(0, len(data), 3):\n        chunk = data[index:index + 3]\n        unit = int.from_bytes(chunk, \"big\") << (8 * (3 - len(chunk)))\n        for shift in (18, 12, 6, 0):\n            out.append(alphabet[(unit >> shift) & 0x3F])\n        for position in range(3 - len(chunk)):\n            out[-1 - position] = \"=\"\n    return \"\".join(out)\n\n\ndef _request(transport, method, url, headers, body=None, length=0):\n    try:\n        return transport.request(method, url, headers, body=body, length=length)\n    except AuthorityError:\n        raise\n    except Exception as error:\n        raise AuthorityError(\"Registry request failed or timed out.\") from error\n\n\ndef fetch_registry_token(registry, transport, actor, password):\n    \"\"\"Exchange actor credentials for a pull/push registry token.\"\"\"\n    if (\n        not isinstance(actor, str)\n        or not actor\n        or any(ord(char) < 32 or ord(char) == 127 for char in actor)\n    ):\n        raise AuthorityError(\"Registry actor is incorrect.\")\n    if not isinstance(password, str) or not password:\n        raise AuthorityError(\"Registry token is missing.\")\n    challenge = _request(transport, \"GET\", f\"https://{registry.REGISTRY}/v2/\", {})\n    if challenge.status != 401:\n        raise AuthorityError(\"Registry did not ask for authentication.\")\n    params = registry.parse_auth_challenge(\n        challenge.headers.get(\"www-authenticate\", \"\")\n    )\n    url = registry.token_request_url(params)\n    basic = _b64encode(f\"{actor}:{password}\".encode())\n    response = _request(\n        transport,\n        \"GET\",\n        url,\n        {\"Authorization\": f\"Basic {basic}\", \"Accept\": \"application/json\"},\n    )\n    if response.status != 200:\n        raise AuthorityError(\"Registry token request failed.\")\n    return registry.parse_token_payload(response.body)\n\n\ndef _authorization(token):\n    if not isinstance(token, str) or not token:\n        raise AuthorityError(\"Registry token is missing.\")\n    return {\"Authorization\": f\"Bearer {token}\"}\n\n\ndef head_blob(registry, transport, token, digest, size):\n    \"\"\"Return True when the blob is already present; fail on any other state.\"\"\"\n    headers = _authorization(token)\n    headers[\"Accept\"] = \"application/octet-stream\"\n    response = _request(\n        transport, \"HEAD\", registry.registry_url(f\"blobs/{digest}\"), headers\n    )\n    return registry.check_head_response(\n        response.status, response.headers, digest, size\n    )\n\n\ndef _head_manifest(registry, transport, token, digest, size):\n    headers = _authorization(token)\n    headers[\"Accept\"] = \"application/vnd.oci.image.manifest.v1+json\"\n    response = _request(\n        transport, \"HEAD\", registry.registry_url(f\"manifests/{digest}\"), headers\n    )\n    return registry.check_head_response(\n        response.status, response.headers, digest, size\n    )\n\n\ndef _remote_bytes(registry, transport, token, kind, digest, size):\n    media = (\n        \"application/vnd.oci.image.manifest.v1+json\"\n        if kind == \"manifests\"\n        else \"application/octet-stream\"\n    )\n    url = registry.registry_url(f\"{kind}/{digest}\")\n    headers = _authorization(token)\n    headers[\"Accept\"] = media\n    response = _request(transport, \"GET\", url, headers)\n    request_path = f\"/v2/{registry.PACKAGE}/{kind}/{digest}\"\n    target = registry.redirect_target(\n        request_path, digest, response.status, response.headers.get(\"location\", \"\")\n    )\n    if target is None:\n        return response.status, response.headers, response.body\n    download_url = f\"https://{registry.DOWNLOAD_HOST}{target}\"\n    final = _request(\n        transport, \"GET\", download_url, {\"Accept\": \"application/octet-stream\"}\n    )\n    return final.status, final.headers, final.body\n\n\ndef verify_remote_blob(registry, transport, token, digest, expected, size):\n    \"\"\"GET the blob and prove the remote bytes equal the local bytes.\"\"\"\n    if not isinstance(expected, bytes) or len(expected) != size:\n        raise AuthorityError(\"OCI blob descriptor size is incorrect.\")\n    status, headers, body = _remote_bytes(registry, transport, token, \"blobs\", digest, size)\n    registry.check_get_response(status, headers, body, digest, size, expected)\n    return {\"digest\": digest, \"size\": size, \"remote_sha256\": digest.removeprefix(\"sha256:\")}\n\n\ndef verify_remote_manifest(registry, transport, token, manifest, digest, size):\n    \"\"\"GET the manifest and prove the remote bytes equal the local bytes.\"\"\"\n    if not isinstance(manifest, bytes) or len(manifest) != size:\n        raise AuthorityError(\"OCI manifest exceeds its size limit.\")\n    status, headers, body = _remote_bytes(registry, transport, token, \"manifests\", digest, size)\n    registry.check_get_response(status, headers, body, digest, size, manifest)\n    return {\n        \"digest\": digest,\n        \"size\": size,\n        \"remote_sha256\": digest.removeprefix(\"sha256:\"),\n    }\n\n\ndef _require_blob(digest, data):\n    if not isinstance(digest, str) or not re.fullmatch(r\"sha256:[0-9a-f]{64}\", digest):\n        raise AuthorityError(\"OCI blob descriptor is incorrect.\")\n    if (\n        not isinstance(data, bytes)\n        or len(data) < 1\n        or len(data) > MAX_UPLOAD_BYTES\n    ):\n        raise AuthorityError(\"OCI blob descriptor size is incorrect.\")\n\n\ndef _begin_upload(registry, transport, token):\n    start = registry.registry_url(\"blobs/uploads/\")\n    response = _request(\n        transport,\n        \"POST\",\n        start,\n        {**_authorization(token), \"Content-Length\": \"0\"},\n    )\n    if response.status != 202 or \"location\" not in response.headers:\n        raise AuthorityError(\"Registry upload session could not start.\")\n    return registry.validate_upload_location(start, response.headers[\"location\"])\n\n\ndef upload_blob(registry, transport, token, digest, data):\n    \"\"\"Upload one blob, then require HEAD to prove it landed.\"\"\"\n    size = len(data)\n    location = _begin_upload(registry, transport, token)\n    target = registry.upload_target(location, digest)\n    try:\n        response = _request(\n            transport,\n            \"PUT\",\n            target,\n            {**_authorization(token), \"Content-Type\": \"application/octet-stream\"},\n            body=data,\n            length=size,\n        )\n    except AuthorityError:\n        if head_blob(registry, transport, token, digest, size):\n            return\n        raise\n    if response.status != 201:\n        raise AuthorityError(\"Registry blob upload did not complete.\")\n    if not head_blob(registry, transport, token, digest, size):\n        raise AuthorityError(\"Registry blob is absent after upload.\")\n\n\ndef upload_manifest(registry, transport, token, manifest, digest):\n    \"\"\"Upload the platform manifest, then require HEAD to prove it landed.\"\"\"\n    size = len(manifest)\n    url = registry.registry_url(f\"manifests/{digest}\")\n    try:\n        response = _request(\n            transport,\n            \"PUT\",\n            url,\n            {\n                **_authorization(token),\n                \"Content-Type\": \"application/vnd.oci.image.manifest.v1+json\",\n            },\n            body=manifest,\n            length=size,\n        )\n    except AuthorityError:\n        if _head_manifest(registry, transport, token, digest, size):\n            verify_remote_manifest(registry, transport, token, manifest, digest, size)\n            return\n        raise\n    if response.status != 201:\n        raise AuthorityError(\"Registry manifest upload did not complete.\")\n    if response.headers.get(\"docker-content-digest\") not in (None, digest):\n        raise AuthorityError(\n            \"Registry response has a manifest digest that is different from the requested digest.\"\n        )\n    if not _head_manifest(registry, transport, token, digest, size):\n        raise AuthorityError(\"Registry manifest is absent after upload.\")\n    verify_remote_manifest(registry, transport, token, manifest, digest, size)\n\n\ndef publish_blob(registry, transport, token, digest, data):\n    \"\"\"Upload a blob when absent, then prove the remote bytes with HEAD and GET.\"\"\"\n    _require_blob(digest, data)\n    size = len(data)\n    if not head_blob(registry, transport, token, digest, size):\n        upload_blob(registry, transport, token, digest, data)\n    verify_remote_blob(registry, transport, token, digest, data, size)\n    return {\n        \"digest\": digest,\n        \"size\": size,\n        \"remote_sha256\": digest.removeprefix(\"sha256:\"),\n    }\n\n\ndef publish_manifest_receipt(registry, transport, token, manifest):\n    \"\"\"Upload the platform manifest when absent, then prove the remote bytes.\"\"\"\n    if (\n        not isinstance(manifest, bytes)\n        or len(manifest) < 1\n        or len(manifest) > MAX_MANIFEST_BYTES\n    ):\n        raise AuthorityError(\"OCI manifest exceeds its size limit.\")\n    digest = \"sha256:\" + _sha(manifest)\n    size = len(manifest)\n    if not _head_manifest(registry, transport, token, digest, size):\n        upload_manifest(registry, transport, token, manifest, digest)\n    verify_remote_manifest(registry, transport, token, manifest, digest, size)\n    return {\n        \"digest\": digest,\n        \"size\": size,\n        \"remote_sha256\": digest.removeprefix(\"sha256:\"),\n    }\n\n\ndef publish_image(registry, transport, token, manifest, blobs):\n    \"\"\"Publish every blob and the platform manifest; prove every remote byte.\n\n    Returns a publication proof binding each descriptor digest and the\n    manifest digest to verified remote bytes. Anything missing, mismatched,\n    or changed raises instead of reporting PASS.\n    \"\"\"\n    if not isinstance(token, str) or not token:\n        raise AuthorityError(\"Registry token is missing.\")\n    if (\n        not isinstance(manifest, bytes)\n        or len(manifest) < 1\n        or len(manifest) > MAX_MANIFEST_BYTES\n    ):\n        raise AuthorityError(\"OCI manifest exceeds its size limit.\")\n    manifest_value = _json_bytes(manifest, \"OCI manifest\")\n    expected = blob_descriptors(manifest_value)\n    if not isinstance(blobs, dict) or set(blobs) != set(expected):\n        raise AuthorityError(\n            \"Publication blob set is not the same as the OCI manifest descriptors.\"\n        )\n    for digest, size in expected.items():\n        if not isinstance(blobs[digest], bytes) or len(blobs[digest]) != size:\n            raise AuthorityError(\"OCI blob descriptor size is incorrect.\")\n    receipts = {}\n    for digest in sorted(expected):\n        receipts[digest] = publish_blob(registry, transport, token, digest, blobs[digest])\n    manifest_receipt = publish_manifest_receipt(registry, transport, token, manifest)\n    for digest in sorted(expected):\n        verify_remote_blob(registry, transport, token, digest, blobs[digest], expected[digest])\n    return {\"blobs\": receipts, \"manifest\": manifest_receipt}\n\n\ndef check_publication_proof(proof, manifest):\n    \"\"\"Prove a publication proof covers exactly this manifest and its blobs.\"\"\"\n    if (\n        not isinstance(manifest, bytes)\n        or len(manifest) < 1\n        or len(manifest) > MAX_MANIFEST_BYTES\n    ):\n        raise AuthorityError(\"OCI manifest exceeds its size limit.\")\n    manifest_value = _json_bytes(manifest, \"OCI manifest\")\n    expected = blob_descriptors(manifest_value)\n    if not isinstance(proof, dict) or set(proof) != {\"blobs\", \"manifest\"}:\n        raise AuthorityError(\"Registry blob publication is not proven.\")\n    manifest_digest = \"sha256:\" + _sha(manifest)\n    if proof[\"manifest\"] != {\n        \"digest\": manifest_digest,\n        \"size\": len(manifest),\n        \"remote_sha256\": manifest_digest.removeprefix(\"sha256:\"),\n    }:\n        raise AuthorityError(\"Registry manifest publication is not proven.\")\n    blobs = proof[\"blobs\"]\n    if not isinstance(blobs, dict) or set(blobs) != set(expected):\n        raise AuthorityError(\"Registry blob publication is not proven.\")\n    for digest, size in expected.items():\n        if blobs[digest] != {\n            \"digest\": digest,\n            \"size\": size,\n            \"remote_sha256\": digest.removeprefix(\"sha256:\"),\n        }:\n            raise AuthorityError(\"Registry blob publication is not proven.\")\n    return proof\n\n\ndef build_evidence(identity, ci, record_archive, oci, manifest, record_sha256, record_source, publication):\n    manifest_value = _json_bytes(manifest, \"OCI manifest\")\n    if not isinstance(manifest_value, dict):\n        raise AuthorityError(\"OCI platform manifest has an incorrect format.\")\n    source_commit = check_record_source(record_source, identity[\"source\"])\n    check_publication_proof(publication, manifest)\n    config = manifest_value.get(\"config\", {})\n    layers = manifest_value.get(\"layers\", [])\n    evidence = {\n        \"schema\": EVIDENCE_SCHEMA,\n        \"status\": \"PASS\",\n        \"package\": PACKAGE,\n        \"digest_reference\": f\"{PACKAGE}@{oci['platform_manifest_digest']}\",\n        \"private_package_access_gate\": \"not_proven\",\n        \"archive\": {\"sha256\": record_archive[\"sha256\"], \"size_bytes\": record_archive[\"size_bytes\"]},\n        \"source\": source_commit,\n        \"workflow\": {\n            \"ref\": identity[\"workflow_ref\"],\n            \"authority_sha\": identity[\"source\"],\n            \"run_id\": identity[\"run_id\"],\n            \"run_attempt\": identity[\"run_attempt\"],\n            \"artifact_id\": identity[\"artifact_id\"],\n        },\n        \"ci\": ci,\n        \"oci\": {\n            \"platform\": \"linux/amd64\",\n            \"archive_index_digest\": \"sha256:\" + oci[\"archive_index_digest\"],\n            \"manifest_digest\": oci[\"platform_manifest_digest\"],\n            \"manifest_size_bytes\": len(manifest),\n            \"config_digest\": config.get(\"digest\"),\n            \"layer_digests\": [layer.get(\"digest\") for layer in layers],\n        },\n        \"record_sha256\": record_sha256,\n    }\n    encoded = (json.dumps(evidence, sort_keys=True, separators=(\",\", \":\")) + \"\\n\").encode()\n    if len(encoded) > MAX_RESULT_BYTES:\n        raise AuthorityError(\"Publication evidence exceeds its size limit.\")\n    return encoded\n\n\ndef validate_evidence(value):\n    expected_keys = {\n        \"schema\", \"status\", \"package\", \"digest_reference\",\n        \"private_package_access_gate\", \"archive\", \"source\", \"workflow\",\n        \"ci\", \"oci\", \"record_sha256\",\n    }\n    if not isinstance(value, dict) or set(value) != expected_keys:\n        raise AuthorityError(\"Publication evidence has unknown or missing fields.\")\n    if value[\"schema\"] != EVIDENCE_SCHEMA or value[\"status\"] != \"PASS\":\n        raise AuthorityError(\"Publication evidence schema or status is incorrect.\")\n    if value[\"package\"] != PACKAGE:\n        raise AuthorityError(\"Publication evidence package is incorrect.\")\n    oci = value.get(\"oci\")\n    if not isinstance(oci, dict) or oci.get(\"platform\") != \"linux/amd64\":\n        raise AuthorityError(\"Publication evidence OCI platform is incorrect.\")\n    for name in (\"manifest_digest\", \"config_digest\"):\n        digest = oci.get(name)\n        if not isinstance(digest, str) or not re.fullmatch(r\"sha256:[0-9a-f]{64}\", digest):\n            raise AuthorityError(f\"Publication evidence {name} is incorrect.\")\n    if type(oci.get(\"manifest_size_bytes\")) is not int or oci[\"manifest_size_bytes\"] < 1:\n        raise AuthorityError(\"Publication evidence manifest size is incorrect.\")\n    if (\n        not isinstance(oci.get(\"layer_digests\"), list)\n        or not oci[\"layer_digests\"]\n        or any(not isinstance(item, str) or not re.fullmatch(r\"sha256:[0-9a-f]{64}\", item) for item in oci[\"layer_digests\"])\n    ):\n        raise AuthorityError(\"Publication evidence layer digests are incorrect.\")\n    index_digest = oci.get(\"archive_index_digest\")\n    if not isinstance(index_digest, str) or not re.fullmatch(r\"sha256:[0-9a-f]{64}\", index_digest):\n        raise AuthorityError(\"Publication evidence archive index digest is incorrect.\")\n    if value[\"digest_reference\"] != f\"{PACKAGE}@{oci['manifest_digest']}\":\n        raise AuthorityError(\"Publication evidence digest reference is incorrect.\")\n    if not isinstance(value.get(\"source\"), str) or not re.fullmatch(r\"[0-9a-f]{40}\", value[\"source\"]):\n        raise AuthorityError(\"Publication evidence source is incorrect.\")\n    archive = value.get(\"archive\")\n    if (\n        not isinstance(archive, dict)\n        or not isinstance(archive.get(\"sha256\"), str)\n        or not re.fullmatch(r\"[0-9a-f]{64}\", archive[\"sha256\"])\n        or type(archive.get(\"size_bytes\")) is not int\n        or archive[\"size_bytes\"] < 1\n    ):\n        raise AuthorityError(\"Publication evidence archive is incorrect.\")\n    workflow = value.get(\"workflow\")\n    if not isinstance(workflow, dict) or set(workflow) != {\"ref\", \"authority_sha\", \"run_id\", \"run_attempt\", \"artifact_id\"}:\n        raise AuthorityError(\"Publication evidence workflow has unknown or missing fields.\")\n    if (\n        not isinstance(workflow.get(\"ref\"), str)\n        or not workflow[\"ref\"].endswith(\"@refs/heads/main\")\n        or not isinstance(workflow.get(\"authority_sha\"), str)\n        or not re.fullmatch(r\"[0-9a-f]{40}\", workflow[\"authority_sha\"])\n    ):\n        raise AuthorityError(\"Publication evidence workflow identity is incorrect.\")\n    for name in (\"run_id\", \"run_attempt\", \"artifact_id\"):\n        if type(workflow.get(name)) is not int or workflow[name] < 1:\n            raise AuthorityError(f\"Publication evidence workflow {name} is incorrect.\")\n    ci = value.get(\"ci\")\n    if (\n        not isinstance(ci, dict)\n        or set(ci) != {\"run_id\", \"run_attempt\"}\n        or type(ci.get(\"run_id\")) is not int\n        or type(ci.get(\"run_attempt\")) is not int\n    ):\n        raise AuthorityError(\"Publication evidence CI identity is incorrect.\")\n    if not isinstance(value.get(\"record_sha256\"), str) or not re.fullmatch(r\"[0-9a-f]{64}\", value[\"record_sha256\"]):\n        raise AuthorityError(\"Publication evidence record digest is incorrect.\")\n    if value.get(\"private_package_access_gate\") != \"not_proven\":\n        raise AuthorityError(\"Publication evidence access gate is incorrect.\")\n    return value\nVELNOR_IMAGE_AUTHORITY_EOF\ncat > \"$dir/job_image_authority_record.py\" <<'VELNOR_IMAGE_AUTHORITY_EOF'\n# SPDX-FileCopyrightText: 2026 Alexey Zhokhov\n# SPDX-License-Identifier: Apache-2.0\nimport json\nimport re\n\nSCHEMA = \"velnor.job-image-candidate.v1\"\nMAX_RECORD_BYTES = 1024**2\nINPUT_PATHS = (\n    \".velnor/runner.lock\",\n    \"images/job/ubuntu-26.04/Dockerfile\",\n    \"images/job/ubuntu-26.04/README.md\",\n    \"images/job/ubuntu-26.04/build-test.sh\",\n    \"images/job/ubuntu-26.04/candidate/candidate.py\",\n)\nRECORD_KEYS = {\n    \"schema\", \"source\", \"workflow\", \"platform\", \"build\", \"archive\", \"oci\"\n}\nSOURCE_KEYS = {\"commit\", \"ref\", \"inputs\"}\nWORKFLOW_KEYS = {\n    \"repository\", \"repository_id\", \"event\", \"workflow_ref\", \"authority_commit\",\n    \"run_id\", \"run_attempt\",\n}\nBUILD_KEYS = {\n    \"builder\", \"platform\", \"arguments\", \"exporter\", \"provenance\",\n    \"compression\", \"force_compression\",\n}\nARCHIVE_KEYS = {\"sha256\", \"size_bytes\"}\nOCI_KEYS = {\n    \"archive_index_digest\", \"archive_index_size_bytes\", \"platform_manifest_digest\",\n    \"platform_manifest_size_bytes\", \"image_configuration_digest\",\n    \"image_configuration_size_bytes\", \"layer_digests\",\n}\n\n\nclass AuthorityError(ValueError):\n    pass\n\n\ndef _unique_object(pairs):\n    result = {}\n    for key, value in pairs:\n        if key in result:\n            raise AuthorityError(f\"Duplicate JSON key: {key}\")\n        result[key] = value\n    return result\n\n\ndef _json_bytes(data, label):\n    try:\n        return json.loads(data, object_pairs_hook=_unique_object, parse_constant=_reject_constant)\n    except (UnicodeDecodeError, json.JSONDecodeError) as error:\n        raise AuthorityError(f\"{label} JSON has an incorrect format.\") from error\n\n\ndef _reject_constant(value):\n    raise AuthorityError(f\"JSON constant has an incorrect value: {value}.\")\n\n\ndef _exact_keys(value, expected, label):\n    if not isinstance(value, dict) or set(value) != expected:\n        raise AuthorityError(f\"{label} has unknown or missing fields.\")\n    return value\n\n\ndef _digest(value, label):\n    if not isinstance(value, str) or not re.fullmatch(r\"sha256:[0-9a-f]{64}\", value):\n        raise AuthorityError(f\"{label} must be a lowercase SHA-256 digest.\")\n    return value\n\n\ndef _read_limited_file(path, limit, label):\n    if path.is_symlink() or not path.is_file():\n        raise AuthorityError(f\"{label} must be a regular file.\")\n    if path.stat().st_size > limit:\n        raise AuthorityError(f\"{label} exceeds its size limit.\")\n    with path.open(\"rb\") as stream:\n        data = stream.read(limit + 1)\n    if len(data) > limit:\n        raise AuthorityError(f\"{label} exceeds its size limit.\")\n    return data\n\n\ndef load_record(path):\n    return _json_bytes(_read_limited_file(path, MAX_RECORD_BYTES, \"Candidate record\"), \"candidate record\")\n\n\ndef validate_record(value):\n    record = _exact_keys(value, RECORD_KEYS, \"Candidate record\")\n    if record[\"schema\"] != SCHEMA or record[\"platform\"] != \"linux/amd64\":\n        raise AuthorityError(\"Candidate schema or platform is incorrect.\")\n    source = _exact_keys(record[\"source\"], SOURCE_KEYS, \"Source\")\n    if not isinstance(source[\"commit\"], str) or not re.fullmatch(r\"[0-9a-f]{40}\", source[\"commit\"]) or not isinstance(source[\"ref\"], str) or not source[\"ref\"].startswith(\"refs/\"):\n        raise AuthorityError(\"Source identity is incorrect.\")\n    if not isinstance(source[\"inputs\"], dict) or set(source[\"inputs\"]) != set(INPUT_PATHS):\n        raise AuthorityError(\"The source input list is incomplete or unknown.\")\n    for name, digest in source[\"inputs\"].items():\n        if not isinstance(name, str) or not isinstance(digest, str) or not re.fullmatch(r\"[0-9a-f]{64}\", digest):\n            raise AuthorityError(\"Source input hash is incorrect.\")\n    workflow = _exact_keys(record[\"workflow\"], WORKFLOW_KEYS, \"Workflow\")\n    if not isinstance(workflow[\"repository\"], str) or not re.fullmatch(r\"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\", workflow[\"repository\"]):\n        raise AuthorityError(\"Workflow repository identity is incorrect.\")\n    if type(workflow[\"repository_id\"]) is not int or workflow[\"repository_id\"] < 1:\n        raise AuthorityError(\"Workflow repository ID is incorrect.\")\n    if not isinstance(workflow[\"event\"], str) or not re.fullmatch(r\"[a-z_]+\", workflow[\"event\"]):\n        raise AuthorityError(\"Workflow event is incorrect.\")\n    if (\n        not isinstance(workflow[\"workflow_ref\"], str)\n        or not workflow[\"workflow_ref\"].startswith(f\"{workflow['repository']}/.github/workflows/\")\n        or \"@refs/\" not in workflow[\"workflow_ref\"]\n    ):\n        raise AuthorityError(\"Workflow ref is incorrect.\")\n    if not isinstance(workflow[\"authority_commit\"], str) or not re.fullmatch(r\"[0-9a-f]{40}\", workflow[\"authority_commit\"]):\n        raise AuthorityError(\"Workflow authority commit is incorrect.\")\n    for name in (\"run_id\", \"run_attempt\"):\n        if type(workflow[name]) is not int or workflow[name] < 1:\n            raise AuthorityError(f\"Workflow {name} is incorrect.\")\n    build = _exact_keys(record[\"build\"], BUILD_KEYS, \"Build\")\n    if (\n        not isinstance(build[\"builder\"], str)\n        or re.fullmatch(r\"github\\.com/docker/buildx v\\d+\\.\\d+\\.\\d+(?: .+)?\", build[\"builder\"]) is None\n        or build[\"platform\"] != \"linux/amd64\"\n        or build[\"exporter\"] != \"oci\"\n        or build[\"provenance\"] != \"disabled\"\n        or build[\"compression\"] != \"gzip\"\n        or build[\"force_compression\"] is not True\n    ):\n        raise AuthorityError(\"Build identity is incorrect.\")\n    if build[\"arguments\"] != []:\n        raise AuthorityError(\"Build arguments must be empty.\")\n    archive = _exact_keys(record[\"archive\"], ARCHIVE_KEYS, \"Archive\")\n    if not isinstance(archive[\"sha256\"], str) or not re.fullmatch(r\"[0-9a-f]{64}\", archive[\"sha256\"]) or type(archive[\"size_bytes\"]) is not int or archive[\"size_bytes\"] < 1:\n        raise AuthorityError(\"Archive identity is incorrect.\")\n    oci = _exact_keys(record[\"oci\"], OCI_KEYS, \"OCI\")\n    for name in (\"archive_index_digest\",):\n        if not isinstance(oci[name], str) or not re.fullmatch(r\"[0-9a-f]{64}\", oci[name]):\n            raise AuthorityError(f\"OCI {name} is incorrect.\")\n    for name in (\n        \"archive_index_size_bytes\", \"platform_manifest_size_bytes\",\n        \"image_configuration_size_bytes\",\n    ):\n        if type(oci[name]) is not int or oci[name] < 1:\n            raise AuthorityError(f\"OCI {name} is incorrect.\")\n    _digest(oci[\"platform_manifest_digest\"], \"OCI platform manifest digest\")\n    _digest(oci[\"image_configuration_digest\"], \"OCI image configuration digest\")\n    if not isinstance(oci[\"layer_digests\"], list) or not oci[\"layer_digests\"]:\n        raise AuthorityError(\"OCI layer digest list is incorrect.\")\n    for digest in oci[\"layer_digests\"]:\n        _digest(digest, \"OCI layer digest\")\n    return record\nVELNOR_IMAGE_AUTHORITY_EOF\ncat > \"$dir/job_image_authority_oci.py\" <<'VELNOR_IMAGE_AUTHORITY_EOF'\n# SPDX-FileCopyrightText: 2026 Alexey Zhokhov\n# SPDX-License-Identifier: Apache-2.0\nimport gzip\nimport hashlib\nimport json\nfrom pathlib import PurePosixPath\nimport re\nimport tarfile\nimport zlib\n\nPLATFORM = {\"architecture\": \"amd64\", \"os\": \"linux\"}\nMAX_ARCHIVE_BYTES = 4 * 1024**3\nMAX_ARCHIVE_CONTENT_BYTES = 4 * 1024**3\nMAX_ARCHIVE_MEMBERS = 128\nMAX_BLOB_BYTES = 1024**3\nMAX_UNCOMPRESSED_BYTES = 4 * 1024**3\nMAX_LAYER_MEMBERS = 1_000_000\nMAX_TAR_EXTENSION_BYTES = 1024**2\nMAX_TAR_EXTENSION_TOTAL_BYTES = 4 * 1024**2\nLAYER_MEDIA_TYPES = {\n    \"application/vnd.oci.image.layer.v1.tar\",\n    \"application/vnd.oci.image.layer.v1.tar+gzip\",\n    \"application/vnd.oci.image.layer.nondistributable.v1.tar\",\n    \"application/vnd.oci.image.layer.nondistributable.v1.tar+gzip\",\n}\n\n\nclass AuthorityError(ValueError):\n    pass\n\n\ndef _unique_object(pairs):\n    result = {}\n    for key, value in pairs:\n        if key in result:\n            raise AuthorityError(f\"Duplicate JSON key: {key}\")\n        result[key] = value\n    return result\n\n\ndef _json_bytes(data, label):\n    try:\n        return json.loads(data, object_pairs_hook=_unique_object, parse_constant=_reject_constant)\n    except (UnicodeDecodeError, json.JSONDecodeError) as error:\n        raise AuthorityError(f\"{label} JSON has an incorrect format.\") from error\n\n\ndef _reject_constant(value):\n    raise AuthorityError(f\"JSON constant has an incorrect value: {value}.\")\n\n\ndef _sha(data):\n    return hashlib.sha256(data).hexdigest()\n\n\ndef _hash_stream(stream, byte_limit=None):\n    digest = hashlib.sha256()\n    size = 0\n    while chunk := stream.read(1024 * 1024):\n        digest.update(chunk)\n        size += len(chunk)\n        if byte_limit is not None and size > byte_limit:\n            raise AuthorityError(\"OCI archive content exceeds its size limit.\")\n    return digest.hexdigest(), size\n\n\ndef _safe_member(name):\n    path = PurePosixPath(name)\n    normalized = str(path)\n    if path.is_absolute() or \"..\" in path.parts or normalized != name or name in {\"\", \".\"}:\n        raise AuthorityError(\"OCI archive contains a path that is not safe.\")\n    return name\n\n\ndef _tar_member_size(header):\n    field = header[124:136]\n    if field[0] & 0x80:\n        value = int.from_bytes(field, \"big\", signed=False) & ((1 << (8 * len(field) - 1)) - 1)\n    else:\n        try:\n            value = int(field.strip(b\"\\0 \") or b\"0\", 8)\n        except ValueError as error:\n            raise AuthorityError(\"Tar archive has an incorrect member size.\") from error\n    if value < 0:\n        raise AuthorityError(\"Tar archive has a negative member size.\")\n    return value\n\n\ndef _scan_tar_extensions(stream):\n    extension_total = 0\n    while header := stream.read(512):\n        if len(header) != 512:\n            return\n        if header == bytes(512):\n            return\n        size = _tar_member_size(header)\n        if header[156:157] in {b\"x\", b\"g\", b\"L\", b\"K\"}:\n            if size > MAX_TAR_EXTENSION_BYTES:\n                raise AuthorityError(\"Tar extension header exceeds its size limit.\")\n            extension_total += size\n            if extension_total > MAX_TAR_EXTENSION_TOTAL_BYTES:\n                raise AuthorityError(\"Tar extension headers exceed their total size limit.\")\n        remaining = (size + 511) // 512 * 512\n        while remaining:\n            chunk = stream.read(min(1024 * 1024, remaining))\n            if not chunk:\n                return\n            remaining -= len(chunk)\n\n\ndef _scan_archive_extensions(path):\n    try:\n        with path.open(\"rb\") as source:\n            prefix = source.read(6)\n            if prefix.startswith((b\"\\x1f\\x8b\", b\"BZh\", b\"\\xfd7zXZ\\x00\")):\n                raise AuthorityError(\"OCI archive must use an uncompressed tar format.\")\n            source.seek(0)\n            _scan_tar_extensions(_LayerHashReader(source, MAX_ARCHIVE_CONTENT_BYTES))\n    except (OSError, EOFError, zlib.error) as error:\n        raise AuthorityError(\"OCI archive extension scan failed.\") from error\n\n\ndef _layer_path(name):\n    path = PurePosixPath(name)\n    if path.is_absolute() or \"..\" in path.parts:\n        raise AuthorityError(\"OCI layer has a path that is not safe.\")\n    normalized = str(path)\n    if normalized in {\"\", \".\"}:\n        return \".\"\n    return normalized\n\n\nclass _LayerHashReader:\n    def __init__(self, stream, byte_limit):\n        self.stream = stream\n        self.byte_limit = byte_limit\n        self.digest = hashlib.sha256()\n        self.size = 0\n\n    def read(self, size=-1):\n        data = self.stream.read(size)\n        self.size += len(data)\n        if self.size > self.byte_limit:\n            raise AuthorityError(\"OCI image layers exceed their uncompressed size limit.\")\n        self.digest.update(data)\n        return data\n\n\ndef _load_archive(path):\n    json_files = {}\n    blob_files = {}\n    seen = set()\n    content_size = 0\n    if path.is_symlink() or not path.is_file():\n        raise AuthorityError(\"OCI archive must be a regular file.\")\n    if path.stat().st_size > MAX_ARCHIVE_BYTES:\n        raise AuthorityError(\"OCI archive exceeds its file size limit.\")\n    _scan_archive_extensions(path)\n    try:\n        archive = tarfile.open(path, mode=\"r:\")\n    except (tarfile.TarError, OSError) as error:\n        raise AuthorityError(\"Cannot read OCI archive.\") from error\n    with archive:\n        for member in archive:\n            if len(seen) >= MAX_ARCHIVE_MEMBERS:\n                raise AuthorityError(\"OCI archive has too many entries.\")\n            directory = member.isdir()\n            raw_name = member.name.removesuffix(\"/\") if directory else member.name\n            name = _safe_member(raw_name)\n            if len(name) > 1024:\n                raise AuthorityError(\"OCI archive path exceeds its size limit.\")\n            if name in seen:\n                raise AuthorityError(f\"Duplicate archive path: {name}\")\n            seen.add(name)\n            if directory:\n                if name not in {\"blobs\", \"blobs/sha256\"}:\n                    raise AuthorityError(f\"Unexpected OCI archive directory: {name}\")\n                continue\n            if not member.isfile():\n                raise AuthorityError(f\"OCI archive entry is not a regular file: {name}\")\n            if member.size < 0 or member.size > MAX_BLOB_BYTES:\n                raise AuthorityError(\"OCI archive entry exceeds its size limit.\")\n            content_size += member.size\n            if content_size > MAX_ARCHIVE_CONTENT_BYTES:\n                raise AuthorityError(\"OCI archive content exceeds its size limit.\")\n            if name not in {\"oci-layout\", \"index.json\"} and not re.fullmatch(\n                r\"blobs/sha256/[0-9a-f]{64}\", name\n            ):\n                raise AuthorityError(f\"Unexpected OCI archive path: {name}\")\n            stream = archive.extractfile(member)\n            if stream is None:\n                raise AuthorityError(\"Cannot read OCI archive entry.\")\n            with stream:\n                if name.startswith(\"blobs/\"):\n                    if len(blob_files) >= 64:\n                        raise AuthorityError(\"OCI archive has too many blobs.\")\n                    blob_files[name.removeprefix(\"blobs/sha256/\")] = member.size\n                else:\n                    if member.size > 1024 * 1024:\n                        raise AuthorityError(f\"OCI metadata file is too large: {name}\")\n                    json_files[name] = stream.read()\n    if set(json_files) != {\"oci-layout\", \"index.json\"}:\n        raise AuthorityError(\"OCI archive must contain oci-layout and index.json.\")\n    return json_files, blob_files\n\n\ndef verify_oci_archive(path):\n    json_files, blobs = _load_archive(path)\n    layout = _json_bytes(json_files[\"oci-layout\"], \"OCI layout\")\n    if set(layout) != {\"imageLayoutVersion\"}:\n        raise AuthorityError(\"OCI layout has unknown or missing fields.\")\n    if layout[\"imageLayoutVersion\"] != \"1.0.0\":\n        raise AuthorityError(\"Unsupported OCI layout version.\")\n\n    index = _json_bytes(json_files[\"index.json\"], \"OCI index\")\n    if not isinstance(index, dict) or set(index) - {\"schemaVersion\", \"mediaType\", \"manifests\", \"annotations\"}:\n        raise AuthorityError(\"OCI index has unknown fields.\")\n    if index.get(\"schemaVersion\") != 2 or not isinstance(index.get(\"manifests\"), list):\n        raise AuthorityError(\"OCI index schema is incorrect.\")\n    manifests = index[\"manifests\"]\n    if len(manifests) != 1:\n        raise AuthorityError(\"OCI index must select one platform manifest.\")\n    descriptor = manifests[0]\n    required = {\"mediaType\", \"digest\", \"size\", \"platform\"}\n    if not isinstance(descriptor, dict) or not required.issubset(descriptor) or set(descriptor) - (\n        required | {\"annotations\"}\n    ):\n        raise AuthorityError(\"OCI platform descriptor has unknown or missing fields.\")\n    if type(descriptor[\"size\"]) is not int or descriptor[\"size\"] < 1:\n        raise AuthorityError(\"OCI manifest size is incorrect.\")\n    if index.get(\"mediaType\", \"application/vnd.oci.image.index.v1+json\") != \"application/vnd.oci.image.index.v1+json\":\n        raise AuthorityError(\"OCI index media type is incorrect.\")\n    if descriptor[\"platform\"] != PLATFORM:\n        raise AuthorityError(\"OCI archive platform is not linux/amd64.\")\n    manifest_digest = _digest(descriptor[\"digest\"], \"Manifest digest\")\n    manifest_hex = manifest_digest.removeprefix(\"sha256:\")\n    manifest_size = blobs.get(manifest_hex)\n    if manifest_size is None:\n        raise AuthorityError(\"OCI manifest blob is missing.\")\n    if manifest_size != descriptor[\"size\"]:\n        raise AuthorityError(\"OCI manifest size is not the same as its descriptor size.\")\n    manifest_raw = _read_blob(path, manifest_hex)\n    if _sha(manifest_raw) != manifest_hex:\n        raise AuthorityError(\"OCI manifest blob has an incorrect digest.\")\n    manifest = _json_bytes(manifest_raw, \"OCI manifest\")\n    if not isinstance(manifest, dict) or manifest.get(\"schemaVersion\") != 2:\n        raise AuthorityError(\"OCI manifest schema is incorrect.\")\n    if manifest.get(\"mediaType\") != \"application/vnd.oci.image.manifest.v1+json\":\n        raise AuthorityError(\"OCI manifest media type is incorrect.\")\n    if descriptor[\"mediaType\"] != manifest[\"mediaType\"]:\n        raise AuthorityError(\"OCI index and manifest media types are different.\")\n    if set(manifest) - {\"schemaVersion\", \"mediaType\", \"config\", \"layers\", \"annotations\"}:\n        raise AuthorityError(\"OCI manifest has unknown fields.\")\n    config = _descriptor(manifest.get(\"config\"), \"config\")\n    if config[\"mediaType\"] != \"application/vnd.oci.image.config.v1+json\":\n        raise AuthorityError(\"OCI image configuration media type is incorrect.\")\n    layers = manifest.get(\"layers\")\n    if not isinstance(layers, list) or not layers:\n        raise AuthorityError(\"OCI manifest must contain image layers.\")\n    referenced = {}\n    _record_blob_descriptor(referenced, {\n        \"hex\": manifest_hex,\n        \"size\": len(manifest_raw),\n        \"mediaType\": manifest[\"mediaType\"],\n    })\n    _record_blob_descriptor(referenced, config)\n    layer_digests = []\n    for layer in layers:\n        entry = _descriptor(layer, \"layer\")\n        if entry[\"mediaType\"] not in LAYER_MEDIA_TYPES:\n            raise AuthorityError(\"OCI layer media type is incorrect.\")\n        _record_blob_descriptor(referenced, entry)\n        layer_digests.append(entry[\"digest\"])\n    if set(blobs) != set(referenced):\n        raise AuthorityError(\"OCI archive has missing or unreferenced blobs.\")\n    for digest, (size, _media_type) in referenced.items():\n        if blobs[digest] != size:\n            raise AuthorityError(\"OCI blob size is not the same as its descriptor size.\")\n    config_raw = _read_blob(path, config[\"hex\"])\n    if _sha(config_raw) != config[\"hex\"]:\n        raise AuthorityError(\"OCI image configuration blob has an incorrect digest.\")\n    config_data = _json_bytes(config_raw, \"OCI image configuration\")\n    if not isinstance(config_data, dict) or config_data.get(\"os\") != \"linux\" or config_data.get(\"architecture\") != \"amd64\":\n        raise AuthorityError(\"OCI image configuration platform is not linux/amd64.\")\n    rootfs = config_data.get(\"rootfs\")\n    diff_ids = rootfs.get(\"diff_ids\") if isinstance(rootfs, dict) else None\n    if (\n        not isinstance(rootfs, dict)\n        or rootfs.get(\"type\") != \"layers\"\n        or not isinstance(diff_ids, list)\n        or len(diff_ids) != len(layers)\n        or any(not isinstance(item, str) or not re.fullmatch(r\"sha256:[0-9a-f]{64}\", item) for item in diff_ids)\n    ):\n        raise AuthorityError(\"OCI image configuration has incorrect DiffID data for its manifest layers.\")\n    uncompressed_total = 0\n    member_total = 0\n    for layer, expected_diff_id in zip(layers, diff_ids):\n        entry = _descriptor(layer, \"layer\")\n        remaining = MAX_UNCOMPRESSED_BYTES - uncompressed_total\n        actual_digest, layer_size, member_count = _layer_diff_id(\n            path, entry[\"hex\"], entry[\"mediaType\"], remaining,\n            MAX_LAYER_MEMBERS - member_total,\n        )\n        if f\"sha256:{actual_digest}\" != expected_diff_id:\n            raise AuthorityError(\"OCI layer DiffID is not the same as the digest of its uncompressed bytes.\")\n        uncompressed_total += layer_size\n        member_total += member_count\n        if member_total > MAX_LAYER_MEMBERS:\n            raise AuthorityError(\"OCI image has too many layer paths.\")\n        if uncompressed_total > MAX_UNCOMPRESSED_BYTES:\n            raise AuthorityError(\"OCI image layers exceed their uncompressed size limit.\")\n    for digest in referenced:\n        if digest not in {manifest_hex, config[\"hex\"]}:\n            actual_digest, actual_size = _hash_blob(path, digest)\n            if actual_digest != digest or actual_size != referenced[digest][0]:\n                raise AuthorityError(\"OCI blob bytes are not the same as the bytes identified by their descriptor.\")\n    index_raw = json_files[\"index.json\"]\n    return {\n        \"archive_index_digest\": _sha(index_raw),\n        \"archive_index_size_bytes\": len(index_raw),\n        \"platform_manifest_digest\": manifest_digest,\n        \"platform_manifest_size_bytes\": len(manifest_raw),\n        \"image_configuration_digest\": config[\"digest\"],\n        \"image_configuration_size_bytes\": len(config_raw),\n        \"layer_digests\": layer_digests,\n    }\n\n\ndef _descriptor(value, label):\n    if not isinstance(value, dict) or not {\"mediaType\", \"digest\", \"size\"}.issubset(value):\n        raise AuthorityError(f\"OCI {label} descriptor is incorrect.\")\n    digest = _digest(value[\"digest\"], f\"OCI {label} digest\")\n    size = value[\"size\"]\n    if type(size) is not int or size < 0:\n        raise AuthorityError(f\"OCI {label} size is incorrect.\")\n    if not isinstance(value[\"mediaType\"], str):\n        raise AuthorityError(f\"OCI {label} media type is incorrect.\")\n    return {\"digest\": digest, \"hex\": digest.removeprefix(\"sha256:\"), \"size\": size, \"mediaType\": value[\"mediaType\"]}\n\n\ndef _digest(value, label):\n    if not isinstance(value, str) or not re.fullmatch(r\"sha256:[0-9a-f]{64}\", value):\n        raise AuthorityError(f\"{label} must be a lowercase SHA-256 digest.\")\n    return value\n\n\ndef _record_blob_descriptor(referenced, descriptor):\n    metadata = (descriptor[\"size\"], descriptor[\"mediaType\"])\n    existing = referenced.get(descriptor[\"hex\"])\n    if existing is not None and existing != metadata:\n        raise AuthorityError(\"OCI descriptors for the same blob have different size or media type values.\")\n    referenced[descriptor[\"hex\"]] = metadata\n\n\ndef _read_blob(path, digest):\n    with tarfile.open(path, mode=\"r:\") as archive:\n        stream = archive.extractfile(f\"blobs/sha256/{digest}\")\n        if stream is None:\n            raise AuthorityError(\"OCI graph references a missing blob.\")\n        with stream:\n            data = stream.read(64 * 1024 * 1024 + 1)\n            if len(data) > 64 * 1024 * 1024:\n                raise AuthorityError(\"OCI metadata blob is too large.\")\n            return data\n\n\ndef _hash_blob(path, digest):\n    try:\n        archive = tarfile.open(path, mode=\"r:\")\n    except (tarfile.TarError, OSError) as error:\n        raise AuthorityError(\"Cannot read OCI archive.\") from error\n    with archive:\n        stream = archive.extractfile(f\"blobs/sha256/{digest}\")\n        if stream is None:\n            raise AuthorityError(\"OCI graph references a missing blob.\")\n        with stream:\n            return _hash_stream(stream, MAX_BLOB_BYTES)\n\n\ndef _layer_diff_id(path, digest, media_type, byte_limit, member_limit):\n    try:\n        archive = tarfile.open(path, mode=\"r:\")\n    except (tarfile.TarError, OSError) as error:\n        raise AuthorityError(\"Cannot read OCI archive.\") from error\n    with archive:\n        stream = archive.extractfile(f\"blobs/sha256/{digest}\")\n        if stream is None:\n            raise AuthorityError(\"OCI manifest references a missing layer.\")\n        with stream:\n            try:\n                first_stream = gzip.GzipFile(fileobj=stream) if media_type.endswith(\"+gzip\") else stream\n                _scan_tar_extensions(_LayerHashReader(first_stream, byte_limit))\n                stream.seek(0)\n                uncompressed = gzip.GzipFile(fileobj=stream) if media_type.endswith(\"+gzip\") else stream\n                reader = _LayerHashReader(uncompressed, byte_limit)\n                paths = set()\n                with tarfile.open(fileobj=reader, mode=\"r|\") as layer_tar:\n                    for member in layer_tar:\n                        if len(paths) + 1 > member_limit:\n                            raise AuthorityError(\"OCI layer has too many paths.\")\n                        normalized = _layer_path(member.name)\n                        if normalized in paths:\n                            raise AuthorityError(f\"OCI layer repeats a path: {normalized}\")\n                        paths.add(normalized)\n                while reader.read(1024 * 1024):\n                    pass\n                return reader.digest.hexdigest(), reader.size, len(paths)\n            except (tarfile.TarError, OSError, EOFError, zlib.error) as error:\n                raise AuthorityError(\"OCI layer is not a tar archive.\") from error\n\n\ndef _hash_file(path):\n    with path.open(\"rb\") as stream:\n        return _hash_stream(stream)\nVELNOR_IMAGE_AUTHORITY_EOF\ncat > \"$dir/job_image_authority_tar.py\" <<'VELNOR_IMAGE_AUTHORITY_EOF'\n# SPDX-FileCopyrightText: 2026 Alexey Zhokhov\n# SPDX-License-Identifier: Apache-2.0\nimport hashlib\nfrom pathlib import PurePosixPath\nimport zlib\n\nMAX_ARCHIVE_CONTENT_BYTES = 4 * 1024**3\nMAX_TAR_EXTENSION_BYTES = 1024**2\nMAX_TAR_EXTENSION_TOTAL_BYTES = 4 * 1024**2\n\n\nclass AuthorityError(ValueError):\n    pass\n\n\ndef _sha(data):\n    return hashlib.sha256(data).hexdigest()\n\n\ndef _hash_stream(stream, byte_limit=None):\n    digest = hashlib.sha256()\n    size = 0\n    while chunk := stream.read(1024 * 1024):\n        digest.update(chunk)\n        size += len(chunk)\n        if byte_limit is not None and size > byte_limit:\n            raise AuthorityError(\"OCI archive content exceeds its size limit.\")\n    return digest.hexdigest(), size\n\n\ndef _safe_member(name):\n    path = PurePosixPath(name)\n    normalized = str(path)\n    if path.is_absolute() or \"..\" in path.parts or normalized != name or name in {\"\", \".\"}:\n        raise AuthorityError(\"OCI archive contains a path that is not safe.\")\n    return name\n\n\ndef _tar_member_size(header):\n    field = header[124:136]\n    if field[0] & 0x80:\n        value = int.from_bytes(field, \"big\", signed=False) & ((1 << (8 * len(field) - 1)) - 1)\n    else:\n        try:\n            value = int(field.strip(b\"\\0 \") or b\"0\", 8)\n        except ValueError as error:\n            raise AuthorityError(\"Tar archive has an incorrect member size.\") from error\n    if value < 0:\n        raise AuthorityError(\"Tar archive has a negative member size.\")\n    return value\n\n\ndef _scan_tar_extensions(stream):\n    extension_total = 0\n    while header := stream.read(512):\n        if len(header) != 512:\n            return\n        if header == bytes(512):\n            return\n        size = _tar_member_size(header)\n        if header[156:157] in {b\"x\", b\"g\", b\"L\", b\"K\"}:\n            if size > MAX_TAR_EXTENSION_BYTES:\n                raise AuthorityError(\"Tar extension header exceeds its size limit.\")\n            extension_total += size\n            if extension_total > MAX_TAR_EXTENSION_TOTAL_BYTES:\n                raise AuthorityError(\"Tar extension headers exceed their total size limit.\")\n        remaining = (size + 511) // 512 * 512\n        while remaining:\n            chunk = stream.read(min(1024 * 1024, remaining))\n            if not chunk:\n                return\n            remaining -= len(chunk)\n\n\ndef _scan_archive_extensions(path):\n    try:\n        with path.open(\"rb\") as source:\n            prefix = source.read(6)\n            if prefix.startswith((b\"\\x1f\\x8b\", b\"BZh\", b\"\\xfd7zXZ\\x00\")):\n                raise AuthorityError(\"OCI archive must use an uncompressed tar format.\")\n            source.seek(0)\n            _scan_tar_extensions(_LayerHashReader(source, MAX_ARCHIVE_CONTENT_BYTES))\n    except (OSError, EOFError, zlib.error) as error:\n        raise AuthorityError(\"OCI archive extension scan failed.\") from error\n\n\ndef _layer_path(name):\n    path = PurePosixPath(name)\n    if path.is_absolute() or \"..\" in path.parts:\n        raise AuthorityError(\"OCI layer has a path that is not safe.\")\n    normalized = str(path)\n    if normalized in {\"\", \".\"}:\n        return \".\"\n    return normalized\n\n\nclass _LayerHashReader:\n    def __init__(self, stream, byte_limit):\n        self.stream = stream\n        self.byte_limit = byte_limit\n        self.digest = hashlib.sha256()\n        self.size = 0\n\n    def read(self, size=-1):\n        data = self.stream.read(size)\n        self.size += len(data)\n        if self.size > self.byte_limit:\n            raise AuthorityError(\"OCI image layers exceed their uncompressed size limit.\")\n        self.digest.update(data)\n        return data\nVELNOR_IMAGE_AUTHORITY_EOF\nprintf 'VELNOR_IMAGE_AUTHORITY_DIR=%s\\n' \"$dir\" >> \"$GITHUB_ENV\"\n"
      - name: Verify candidate bytes with the fixed authority body
        shell: bash
        run: "set -euo pipefail\nauthority=\"$VELNOR_IMAGE_AUTHORITY_DIR\"\narchive=\"$RUNNER_TEMP/privatecandidate/job-image.oci.tar\"\nrecord=\"$RUNNER_TEMP/privatecandidate/job-image-candidate.json\"\npython3 - \"$authority\" \"$record\" \"$archive\" <<'VELNOR_IMAGE_VERIFY_EOF'\nimport hashlib\nimport sys\nsys.path.insert(0, sys.argv[1])\nfrom pathlib import Path\nimport job_image_authority_oci as oci_module\nimport job_image_authority_publish as publish_module\nimport job_image_authority_record as record_module\nrecord_path = Path(sys.argv[2])\narchive_path = Path(sys.argv[3])\nrecord = record_module.validate_record(record_module.load_record(record_path))\nverified = oci_module.verify_oci_archive(archive_path)\nraw = archive_path.read_bytes()\npublish_module.check_record_binding(\n    record,\n    hashlib.sha256(raw).hexdigest(),\n    len(raw),\n    verified,\n)\nprint(\"fixed authority body accepted the candidate bytes\")\nVELNOR_IMAGE_VERIFY_EOF\n"
      - name: Attest all candidate bytes.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: "${{ runner.temp }}/privatecandidate/job-image.oci.tar\n${{ runner.temp }}/privatecandidate/job-image-candidate.json\n${{ runner.temp }}/privatecandidate/job-image-native-source-closure.json"
  publish-job-image:
    name: Publish Linux job image
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs:
      - build-image-candidate
      - attest-image-candidate
    concurrency:
      group: ${{ github.repository }}-job-image-publish
      cancel-in-progress: false
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: write
    steps:
      - name: Examine the uploaded artifact ID
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs.build-image-candidate.outputs.artifact_id }}
        run: "if [[ ! \"$ARTIFACT_ID\" =~ ^[1-9][0-9]*$ ]]; then\n  printf '%s\\n' 'The artifact ID is missing or incorrect.' >&2\n  exit 1\nfi"
      - name: Download the job image candidate from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build-image-candidate.outputs.artifact_id }}
          path: candidate
      - name: Materialize fixed image authority implementation
        shell: bash
        run: "set -eu\ndir=\"$RUNNER_TEMP/velnor-image-authority\"\nrm -rf \"$dir\"\nmkdir -p \"$dir\"\ncat > \"$dir/job_image_authority_identity.py\" <<'VELNOR_IMAGE_AUTHORITY_EOF'\n# SPDX-FileCopyrightText: 2026 Alexey Zhokhov\n# SPDX-License-Identifier: Apache-2.0\n\"\"\"Fixed publication identity and GitHub authorization checks.\n\nData-only port of the authorization logic in\n``images/job/ubuntu-26.04/candidate/publish.py``. Every input arrives as\nalready-authenticated GitHub API data at the exact source SHA: the rendered\nauthority workflow performs the ``gh api`` and ``gh attestation verify``\ncalls, and this module only validates the returned payloads. It never reads\nprocess state, never starts new tasks, never touches a checkout, and never\nimports candidate code.\n\"\"\"\nimport json\nimport re\n\nREPOSITORY = \"tailrocks/velnor-new\"\nREPOSITORY_ID = 1390620900\nWORKFLOW = \"tailrocks/velnor-new/.github/workflows/job-image-candidate.yml\"\nARTIFACT_PREFIX = \"velnor-job-image-candidate-\"\nMAX_JSON_BYTES = 2 * 1024 * 1024\nIDENTITY_KEYS = {\n    \"repository\", \"repository_id\", \"event\", \"workflow_ref\", \"ref\",\n    \"authority_commit\", \"run_id\", \"run_attempt\", \"source\", \"artifact_id\",\n}\n\n\nclass AuthorityError(ValueError):\n    pass\n\n\ndef _unique_object(pairs):\n    result = {}\n    for key, value in pairs:\n        if key in result:\n            raise AuthorityError(f\"Duplicate JSON key: {key}\")\n        result[key] = value\n    return result\n\n\ndef _reject_constant(value):\n    raise AuthorityError(f\"JSON constant has an incorrect value: {value}.\")\n\n\ndef _json_bytes(data, label):\n    try:\n        return json.loads(data, object_pairs_hook=_unique_object, parse_constant=_reject_constant)\n    except (UnicodeDecodeError, json.JSONDecodeError) as error:\n        raise AuthorityError(f\"{label} has an incorrect format.\") from error\n\n\ndef _read_limited_file(path, limit, label):\n    if path.is_symlink() or not path.is_file():\n        raise AuthorityError(f\"{label} must be a regular file.\")\n    if path.stat().st_size > limit:\n        raise AuthorityError(f\"{label} exceeds its size limit.\")\n    with path.open(\"rb\") as stream:\n        data = stream.read(limit + 1)\n    if len(data) > limit:\n        raise AuthorityError(f\"{label} exceeds its size limit.\")\n    return data\n\n\ndef _sha1(value, label):\n    if not isinstance(value, str) or not re.fullmatch(r\"[0-9a-f]{40}\", value):\n        raise AuthorityError(f\"{label} is incorrect.\")\n    return value\n\n\ndef _run_id(value, label):\n    if type(value) is not int or value < 1:\n        raise AuthorityError(f\"{label} is incorrect.\")\n    return value\n\n\ndef load_identity(path):\n    return _json_bytes(_read_limited_file(path, MAX_JSON_BYTES, \"Publication identity\"), \"publication identity\")\n\n\ndef validate_identity(value):\n    if not isinstance(value, dict) or set(value) != IDENTITY_KEYS:\n        raise AuthorityError(\"Publication identity has unknown or missing fields.\")\n    if value[\"repository\"] != REPOSITORY:\n        raise AuthorityError(\"Publication repository is incorrect.\")\n    if value[\"ref\"] != \"refs/heads/main\" or value[\"event\"] != \"workflow_dispatch\":\n        raise AuthorityError(\"Publication is only for workflow_dispatch on refs/heads/main.\")\n    if value[\"workflow_ref\"] != f\"{WORKFLOW}@refs/heads/main\":\n        raise AuthorityError(\"Publication workflow authority is incorrect.\")\n    source = _sha1(value[\"source\"], \"Source SHA\")\n    authority = _sha1(value[\"authority_commit\"], \"Workflow authority SHA\")\n    if authority != source:\n        raise AuthorityError(\"Workflow authority SHA is different from source SHA.\")\n    if type(value[\"repository_id\"]) is not int or value[\"repository_id\"] != REPOSITORY_ID:\n        raise AuthorityError(\"GitHub repository ID is incorrect.\")\n    _run_id(value[\"run_id\"], \"Publication run ID\")\n    _run_id(value[\"run_attempt\"], \"Publication run attempt\")\n    _run_id(value[\"artifact_id\"], \"Candidate artifact ID\")\n    return value\n\n\ndef validate_repository(repository, tip, identity):\n    if (\n        not isinstance(repository, dict)\n        or repository.get(\"full_name\") != REPOSITORY\n        or type(repository.get(\"id\")) is not int\n        or repository[\"id\"] != REPOSITORY_ID\n        or identity[\"repository_id\"] != REPOSITORY_ID\n    ):\n        raise AuthorityError(\"GitHub repository ID is not the same as the canonical repository ID.\")\n    if not isinstance(tip, dict) or tip.get(\"sha\") != identity[\"source\"]:\n        raise AuthorityError(\"Source SHA is not the current main commit.\")\n    return identity[\"source\"]\n\n\ndef validate_candidate_identity(record, identity):\n    source = record.get(\"source\") if isinstance(record, dict) else None\n    if (\n        not isinstance(source, dict)\n        or source.get(\"commit\") != identity[\"source\"]\n        or source.get(\"ref\") != \"refs/heads/main\"\n    ):\n        raise AuthorityError(\"Candidate source is not the current main source.\")\n    if record.get(\"workflow\") != {\n        \"repository\": REPOSITORY,\n        \"repository_id\": identity[\"repository_id\"],\n        \"event\": \"workflow_dispatch\",\n        \"workflow_ref\": identity[\"workflow_ref\"],\n        \"authority_commit\": identity[\"source\"],\n        \"run_id\": identity[\"run_id\"],\n        \"run_attempt\": identity[\"run_attempt\"],\n    }:\n        raise AuthorityError(\"Candidate run identity is different from the publication run identity.\")\n    return record\n\n\ndef validate_artifact_record(value, identity):\n    if not isinstance(value, dict) or not isinstance(value.get(\"artifacts\"), list):\n        raise AuthorityError(\"Candidate artifact response has an incorrect format.\")\n    expected_name = f\"{ARTIFACT_PREFIX}{identity['run_attempt']}\"\n    matches = [\n        item for item in value[\"artifacts\"]\n        if isinstance(item, dict) and item.get(\"name\") == expected_name\n    ]\n    if len(matches) != 1:\n        raise AuthorityError(\"This workflow run must have one candidate artifact.\")\n    artifact = matches[0]\n    if (\n        artifact.get(\"id\") != identity[\"artifact_id\"]\n        or artifact.get(\"expired\") is not False\n        or artifact.get(\"workflow_run\", {}).get(\"id\") != identity[\"run_id\"]\n        or artifact.get(\"workflow_run\", {}).get(\"head_sha\") != identity[\"source\"]\n        or artifact.get(\"workflow_run\", {}).get(\"head_branch\") != \"main\"\n    ):\n        raise AuthorityError(\"Candidate artifact ID, expiry, or workflow run is incorrect.\")\n    return artifact[\"id\"]\n\n\ndef select_ci_run(value, source):\n    if not isinstance(value, dict) or not isinstance(value.get(\"workflow_runs\"), list):\n        raise AuthorityError(\"Canonical CI run response has an incorrect format.\")\n    runs = [\n        run for run in value[\"workflow_runs\"]\n        if isinstance(run, dict)\n        and run.get(\"path\") == \".github/workflows/ci.yml\"\n        and run.get(\"event\") == \"push\"\n        and run.get(\"head_branch\") == \"main\"\n        and run.get(\"head_sha\") == source\n        and isinstance(run.get(\"head_repository\"), dict)\n        and run[\"head_repository\"].get(\"full_name\") == REPOSITORY\n        and type(run.get(\"run_number\")) is int\n        and type(run.get(\"run_attempt\")) is int\n    ]\n    if not runs:\n        raise AuthorityError(\"No canonical main CI push run exists for this source.\")\n    runs.sort(key=lambda item: (item[\"run_number\"], item[\"id\"]))\n    latest = runs[-1]\n    same_number = [item for item in runs if item[\"run_number\"] == latest[\"run_number\"]]\n    if len(same_number) != 1 or latest.get(\"status\") != \"completed\" or latest.get(\"conclusion\") != \"success\":\n        raise AuthorityError(\"The latest canonical main CI run has no `success` conclusion.\")\n    return {\"run_id\": latest[\"id\"], \"run_attempt\": latest[\"run_attempt\"]}\n\n\ndef validate_attestation_output(value, source):\n    if not isinstance(value, list) or not value:\n        raise AuthorityError(\"Attestation verification output has no records.\")\n    for item in value:\n        try:\n            certificate = item[\"verificationResult\"][\"signature\"][\"certificate\"]\n            identifier = certificate[\"sourceRepositoryIdentifier\"]\n        except (KeyError, TypeError) as error:\n            raise AuthorityError(\"Attestation certificate has no repository identifier.\") from error\n        if not (\n            (type(identifier) is int and identifier == REPOSITORY_ID)\n            or (type(identifier) is str and identifier == str(REPOSITORY_ID))\n        ):\n            raise AuthorityError(\"Attestation certificate repository ID is incorrect.\")\n        if (\n            certificate.get(\"githubWorkflowRepository\") != REPOSITORY\n            or certificate.get(\"githubWorkflowSHA\") != source\n            or certificate.get(\"githubWorkflowRef\") != \"refs/heads/main\"\n            or certificate.get(\"githubWorkflowTrigger\") != \"workflow_dispatch\"\n            or certificate.get(\"sourceRepositoryRef\") != \"refs/heads/main\"\n            or certificate.get(\"sourceRepositoryDigest\") != source\n        ):\n            raise AuthorityError(\"Attestation certificate source or workflow identity is incorrect.\")\n    return len(value)\n\n\ndef validate_source_inputs(record_source, authenticated_source):\n    if not isinstance(authenticated_source, dict):\n        raise AuthorityError(\"Authenticated source data has an incorrect format.\")\n    commit = authenticated_source.get(\"commit\")\n    if not isinstance(commit, str) or not re.fullmatch(r\"[0-9a-f]{40}\", commit):\n        raise AuthorityError(\"Authenticated source commit is incorrect.\")\n    if not isinstance(record_source, dict) or record_source.get(\"commit\") != commit:\n        raise AuthorityError(\"Candidate source is not the authenticated source.\")\n    inputs = authenticated_source.get(\"inputs\")\n    if not isinstance(inputs, dict) or not inputs:\n        raise AuthorityError(\"Authenticated source inputs have an incorrect format.\")\n    for name, digest in inputs.items():\n        if not isinstance(name, str) or not name or \"\\\\\" in name or not isinstance(digest, str) or not re.fullmatch(r\"[0-9a-f]{64}\", digest):\n            raise AuthorityError(\"Source input hash is incorrect.\")\n    if record_source.get(\"inputs\") != inputs:\n        raise AuthorityError(\"Build input bytes changed after candidate creation.\")\n    return commit\n\n\ndef validate_build_lock(builder, buildx_version):\n    if not isinstance(buildx_version, str) or re.fullmatch(r\"\\d+\\.\\d+\\.\\d+\", buildx_version) is None:\n        raise AuthorityError(\"Authenticated Buildx version is incorrect.\")\n    match = re.fullmatch(r\"github\\.com/docker/buildx v(\\d+\\.\\d+\\.\\d+)(?: .+)?\", builder)\n    if match is None or match.group(1) != buildx_version:\n        raise AuthorityError(\"Candidate Buildx identity is not the same as the value in .velnor/runner.lock.\")\n    return builder\nVELNOR_IMAGE_AUTHORITY_EOF\ncat > \"$dir/job_image_authority_registry.py\" <<'VELNOR_IMAGE_AUTHORITY_EOF'\n# SPDX-FileCopyrightText: 2026 Alexey Zhokhov\n# SPDX-License-Identifier: Apache-2.0\n\"\"\"Fixed OCI registry origin, redirect, token, and response checks.\n\nData-only port of the registry logic in\n``images/job/ubuntu-26.04/candidate/publish.py``. The rendered authority\nworkflow performs the bounded HTTPS calls; this module only decides which\nURLs may be used, which redirects may be followed without credentials, and\nwhether a received response proves the requested bytes. It never opens a\nnetwork path and never sees registry credentials.\n\"\"\"\nimport hashlib\nimport json\nimport re\nfrom urllib.parse import parse_qsl, unquote, urlencode, urljoin, urlsplit, urlunsplit\n\nREGISTRY = \"ghcr.io\"\nDOWNLOAD_HOST = \"pkg-containers.githubusercontent.com\"\nPACKAGE = \"tailrocks/velnor-job\"\n\n\nclass AuthorityError(ValueError):\n    pass\n\n\ndef _unique_object(pairs):\n    result = {}\n    for key, value in pairs:\n        if key in result:\n            raise AuthorityError(f\"Duplicate JSON key: {key}\")\n        result[key] = value\n    return result\n\n\ndef _reject_constant(value):\n    raise AuthorityError(f\"JSON constant has an incorrect value: {value}.\")\n\n\ndef _token_json(data, label):\n    try:\n        return json.loads(data, object_pairs_hook=_unique_object, parse_constant=_reject_constant)\n    except (UnicodeDecodeError, json.JSONDecodeError) as error:\n        raise AuthorityError(f\"{label} has an incorrect format.\") from error\n\n\ndef registry_url(path):\n    return f\"https://{REGISTRY}/v2/{PACKAGE}/{path}\"\n\n\ndef blob_download_location(location, digest):\n    if any(ord(char) < 32 or ord(char) == 127 for char in location) or \"\\\\\" in location:\n        raise AuthorityError(\"Registry download URL has an incorrect character.\")\n    try:\n        parts = urlsplit(location)\n    except ValueError as error:\n        raise AuthorityError(\"Registry download URL has an incorrect format.\") from error\n    if (\n        parts.scheme != \"https\"\n        or parts.hostname != DOWNLOAD_HOST\n        or parts.port not in (None, 443)\n        or parts.username is not None\n        or parts.password is not None\n        or parts.fragment\n        or not parts.path.endswith(f\"/blobs/{digest}\")\n    ):\n        raise AuthorityError(\"Registry download URL is outside the permitted HTTPS location.\")\n    decoded = unquote(parts.path + parts.query)\n    if any(ord(char) < 32 or ord(char) == 127 for char in decoded) or \"\\\\\" in decoded:\n        raise AuthorityError(\"Registry download URL has an incorrect character.\")\n    return urlunsplit((\"\", \"\", parts.path, parts.query, \"\"))\n\n\ndef validate_upload_location(base, location):\n    if not location or len(location) > 4096 or \"\\\\\" in location or any(ord(char) < 32 or ord(char) == 127 for char in location):\n        raise AuthorityError(\"Registry upload location is missing or too long.\")\n    try:\n        location_parts = urlsplit(location)\n        raw_path = unquote(location_parts.path)\n        resolved = urljoin(base, location)\n        parsed = urlsplit(resolved)\n        port = parsed.port\n    except ValueError as error:\n        raise AuthorityError(\"Registry upload location is outside the fixed HTTPS upload path.\") from error\n    if any(part in {\".\", \"..\"} for part in raw_path.split(\"/\")):\n        raise AuthorityError(\"Registry upload location is outside the fixed HTTPS upload path.\")\n    decoded_path = unquote(parsed.path)\n    expected_prefixes = (\n        f\"/v2/{PACKAGE}/blobs/upload/\",\n        f\"/v2/{PACKAGE}/blobs/uploads/\",\n    )\n    query_values = parse_qsl(parsed.query, keep_blank_values=True)\n    if (\n        parsed.scheme != \"https\"\n        or parsed.hostname != REGISTRY\n        or port not in (None, 443)\n        or parsed.username is not None\n        or parsed.password is not None\n        or parsed.fragment\n        or not decoded_path.startswith(expected_prefixes)\n        or \"\\\\\" in decoded_path\n        or any(ord(char) < 32 for char in decoded_path)\n        or any(ord(char) == 127 for char in decoded_path)\n        or any(ord(char) < 32 or ord(char) == 127 for key, value in query_values for char in key + value)\n        or any(part in {\".\", \"..\"} for part in decoded_path.split(\"/\"))\n    ):\n        raise AuthorityError(\"Registry upload location is outside the fixed HTTPS upload path.\")\n    if any(not key for key, _ in query_values):\n        raise AuthorityError(\"Registry upload query has an incorrect format.\")\n    return resolved\n\n\ndef upload_target(location, digest):\n    try:\n        parts = urlsplit(location)\n    except ValueError as error:\n        raise AuthorityError(\"Registry upload location is outside the fixed HTTPS upload path.\") from error\n    query = parse_qsl(parts.query, keep_blank_values=True)\n    if any(key == \"digest\" for key, _ in query):\n        raise AuthorityError(\"Registry upload location contains a digest parameter.\")\n    if not isinstance(digest, str) or not re.fullmatch(r\"sha256:[0-9a-f]{64}\", digest):\n        raise AuthorityError(\"OCI blob descriptor is incorrect.\")\n    digest_query = urlencode({\"digest\": digest})\n    merged = f\"{parts.query}&{digest_query}\" if parts.query else digest_query\n    return urlunsplit((parts.scheme, parts.netloc, parts.path, merged, \"\"))\n\n\ndef parse_auth_challenge(value):\n    if not isinstance(value, str):\n        raise AuthorityError(\"Registry authentication challenge has an incorrect format.\")\n    match = re.fullmatch(r\"Bearer\\s+(.+)\", value)\n    if match is None:\n        raise AuthorityError(\"Registry authentication challenge has an incorrect format.\")\n    params = {}\n    remaining = match.group(1)\n    while remaining:\n        part = re.match(r'\\s*([A-Za-z][A-Za-z0-9_-]*)=\"([^\"\\\\]*)\"\\s*(?:,|$)', remaining)\n        if part is None or part.group(1) in params:\n            raise AuthorityError(\"Registry authentication challenge has an incorrect format.\")\n        params[part.group(1)] = part.group(2)\n        remaining = remaining[part.end():]\n    if (\n        set(params) - {\"realm\", \"service\", \"scope\"}\n        or params.get(\"realm\") != f\"https://{REGISTRY}/token\"\n        or params.get(\"service\") != REGISTRY\n    ):\n        raise AuthorityError(\"Registry authentication challenge has an incorrect format.\")\n    return params\n\n\ndef token_request_url(params):\n    if not isinstance(params, dict) or set(params) - {\"realm\", \"service\", \"scope\"}:\n        raise AuthorityError(\"Registry authentication challenge has an incorrect format.\")\n    query = urlencode({\"service\": \"ghcr.io\", \"scope\": f\"repository:{PACKAGE}:pull,push\"})\n    return f\"https://{REGISTRY}/token?{query}\"\n\n\ndef parse_token_payload(data):\n    value = _token_json(data, \"Registry token response\")\n    token = value.get(\"token\", value.get(\"access_token\")) if isinstance(value, dict) else None\n    if not isinstance(token, str) or not re.fullmatch(r\"[A-Za-z0-9._~=-]{16,8192}\", token):\n        raise AuthorityError(\"Registry token response has no token in the required format.\")\n    return token\n\n\ndef check_head_response(status, headers, digest, size):\n    if status == 404:\n        return False\n    if status != 200 or headers.get(\"docker-content-digest\") != digest:\n        raise AuthorityError(\"Registry digest HEAD verification failed.\")\n    if headers.get(\"content-length\") != str(size):\n        raise AuthorityError(\"Registry size HEAD verification failed.\")\n    return True\n\n\ndef redirect_target(path, digest, status, location):\n    if status not in (302, 307):\n        return None\n    if path != f\"/v2/{PACKAGE}/blobs/{digest}\":\n        raise AuthorityError(\"Registry manifest redirects are not permitted.\")\n    return blob_download_location(location, digest)\n\n\ndef check_get_response(status, headers, body, digest, size, expected):\n    if status != 200:\n        raise AuthorityError(f\"Registry GET status is incorrect: {status}.\")\n    if headers.get(\"content-length\") != str(size):\n        raise AuthorityError(\"Registry GET size is different from the specified size.\")\n    if headers.get(\"docker-content-digest\") not in (None, digest):\n        raise AuthorityError(\"Registry GET digest header is different from the requested digest.\")\n    if len(body) != size:\n        raise AuthorityError(\"Registry GET size is different from the specified size.\")\n    if hashlib.sha256(body).hexdigest() != digest.removeprefix(\"sha256:\"):\n        raise AuthorityError(\"Registry response bytes have an incorrect digest or size.\")\n    if body != expected:\n        raise AuthorityError(\"Registry retrieved bytes changed during publication.\")\n    return len(body)\nVELNOR_IMAGE_AUTHORITY_EOF\ncat > \"$dir/job_image_authority_publish.py\" <<'VELNOR_IMAGE_AUTHORITY_EOF'\n# SPDX-FileCopyrightText: 2026 Alexey Zhokhov\n# SPDX-License-Identifier: Apache-2.0\n\"\"\"Fixed image publication assembly, byte verification, and evidence.\n\nData-only port of the publication orchestration in\n``images/job/ubuntu-26.04/candidate/publish.py``. It binds the signed\nrecord to its archive and OCI graph, extracts and verifies blob bytes from\nthe local archive, publishes every blob and the platform manifest through\nan injected registry transport, verifies the remote bytes with HEAD and\nGET readback, and builds the signed publication evidence. It never\nruns candidate code, never reads process state or a checkout, never opens\na network path itself (the rendered authority step supplies a bounded\nstdlib transport). Every registry URL, redirect, and response is\nvalidated through the registry helpers passed in as ``registry`` (the\nsibling ``job_image_authority_registry`` module in the rendered body),\nso this module keeps its standard-library-only imports.\n\"\"\"\nimport hashlib\nimport json\nimport re\nimport tarfile\n\nEVIDENCE_SCHEMA = \"velnor.job-image-publication.v1\"\nPACKAGE = \"ghcr.io/tailrocks/velnor-job\"\nMAX_MANIFEST_BYTES = 2 * 1024 * 1024\nMAX_UPLOAD_BYTES = 1024**3\nMAX_RESULT_BYTES = 64 * 1024\n\n\nclass AuthorityError(ValueError):\n    pass\n\n\ndef _unique_object(pairs):\n    result = {}\n    for key, value in pairs:\n        if key in result:\n            raise AuthorityError(f\"Duplicate JSON key: {key}\")\n        result[key] = value\n    return result\n\n\ndef _reject_constant(value):\n    raise AuthorityError(f\"JSON constant has an incorrect value: {value}.\")\n\n\ndef _json_bytes(data, label):\n    try:\n        return json.loads(data, object_pairs_hook=_unique_object, parse_constant=_reject_constant)\n    except (UnicodeDecodeError, json.JSONDecodeError) as error:\n        raise AuthorityError(f\"{label} has an incorrect format.\") from error\n\n\ndef _sha(data):\n    return hashlib.sha256(data).hexdigest()\n\n\ndef check_record_binding(record, archive_digest, archive_size, oci):\n    if not isinstance(record, dict):\n        raise AuthorityError(\"Candidate record has an incorrect format.\")\n    if record.get(\"archive\") != {\"sha256\": archive_digest, \"size_bytes\": archive_size}:\n        raise AuthorityError(\"Candidate archive is not the same as the archive in its signed record.\")\n    if record.get(\"oci\") != oci:\n        raise AuthorityError(\"Candidate OCI graph is not the same as the graph in its signed record.\")\n    return record\n\n\ndef blob_descriptors(manifest):\n    config = manifest.get(\"config\") if isinstance(manifest, dict) else None\n    layers = manifest.get(\"layers\") if isinstance(manifest, dict) else None\n    if not isinstance(config, dict) or not isinstance(layers, list):\n        raise AuthorityError(\"OCI manifest blob descriptors are incorrect.\")\n    unique = {}\n    for descriptor in [config, *layers]:\n        if not isinstance(descriptor, dict):\n            raise AuthorityError(\"OCI blob descriptor is incorrect.\")\n        digest = descriptor.get(\"digest\")\n        size = descriptor.get(\"size\")\n        if (\n            not isinstance(digest, str)\n            or not re.fullmatch(r\"sha256:[0-9a-f]{64}\", digest)\n            or type(size) is not int\n            or not 1 <= size <= MAX_UPLOAD_BYTES\n        ):\n            raise AuthorityError(\"OCI blob descriptor is incorrect.\")\n        if digest in unique and unique[digest] != size:\n            raise AuthorityError(\"Repeated OCI blob digest has inconsistent sizes.\")\n        unique[digest] = size\n    return unique\n\n\ndef _archive_blob(archive, digest, limit):\n    try:\n        with tarfile.open(archive, \"r:\") as tar:\n            member = tar.getmember(f\"blobs/sha256/{digest}\")\n            if not member.isfile() or member.size < 0:\n                raise AuthorityError(\"OCI blob descriptor size is incorrect.\")\n            stream = tar.extractfile(member)\n            if stream is None:\n                raise AuthorityError(\"OCI blob is missing from archive.\")\n            with stream:\n                return stream.read(limit + 1)\n    except (OSError, KeyError, tarfile.TarError) as error:\n        raise AuthorityError(\"Cannot read OCI blob from archive.\") from error\n\n\ndef read_manifest_bytes(archive, digest, size):\n    if type(size) is not int or size > MAX_MANIFEST_BYTES:\n        raise AuthorityError(\"OCI manifest exceeds its size limit.\")\n    raw = _archive_blob(archive, digest.removeprefix(\"sha256:\"), MAX_MANIFEST_BYTES)\n    if len(raw) != size or _sha(raw) != digest.removeprefix(\"sha256:\"):\n        raise AuthorityError(\"OCI platform manifest bytes changed after validation.\")\n    return raw\n\n\ndef extract_blob(archive, digest, expected_size, directory):\n    hexdigest = digest.removeprefix(\"sha256:\")\n    if not re.fullmatch(r\"[0-9a-f]{64}\", hexdigest) or type(expected_size) is not int or expected_size > MAX_UPLOAD_BYTES:\n        raise AuthorityError(\"OCI blob descriptor size is incorrect.\")\n    output = directory / hexdigest\n    hasher = hashlib.sha256()\n    size = 0\n    try:\n        with tarfile.open(archive, \"r:\") as tar:\n            member = tar.getmember(f\"blobs/sha256/{hexdigest}\")\n            if not member.isfile() or member.size != expected_size:\n                raise AuthorityError(\"OCI blob descriptor size is incorrect.\")\n            source = tar.extractfile(member)\n            if source is None:\n                raise AuthorityError(\"OCI blob is missing from archive.\")\n            with source, output.open(\"xb\") as destination:\n                while chunk := source.read(1024 * 1024):\n                    size += len(chunk)\n                    if size > expected_size:\n                        raise AuthorityError(\"OCI blob exceeds descriptor size.\")\n                    hasher.update(chunk)\n                    destination.write(chunk)\n    except (OSError, KeyError, tarfile.TarError) as error:\n        raise AuthorityError(\"Cannot read OCI blob from archive.\") from error\n    if size != expected_size or hasher.hexdigest() != hexdigest:\n        raise AuthorityError(\"OCI blob bytes are not the same as the bytes identified by their descriptor.\")\n    return output\n\n\ndef check_record_source(record_source, identity_source):\n    \"\"\"Bind evidence to the validated candidate source; refuse relabeling.\n\n    The candidate bytes are already bound to the record by\n    ``check_record_binding``. This binds the record to the authenticated\n    identity so unchanged bytes can never be relabeled with another\n    source SHA.\n    \"\"\"\n    if (\n        not isinstance(identity_source, str)\n        or not re.fullmatch(r\"[0-9a-f]{40}\", identity_source)\n    ):\n        raise AuthorityError(\"Authenticated source is incorrect.\")\n    if (\n        not isinstance(record_source, dict)\n        or record_source.get(\"commit\") != identity_source\n    ):\n        raise AuthorityError(\"Candidate source is not the authenticated source.\")\n    if record_source.get(\"ref\") != \"refs/heads/main\":\n        raise AuthorityError(\"Candidate source is not the current main source.\")\n    return identity_source\n\n\ndef _b64encode(data):\n    \"\"\"Encode bytes with the standard Base64 alphabet (no new imports).\"\"\"\n    alphabet = \"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/\"\n    out = []\n    for index in range(0, len(data), 3):\n        chunk = data[index:index + 3]\n        unit = int.from_bytes(chunk, \"big\") << (8 * (3 - len(chunk)))\n        for shift in (18, 12, 6, 0):\n            out.append(alphabet[(unit >> shift) & 0x3F])\n        for position in range(3 - len(chunk)):\n            out[-1 - position] = \"=\"\n    return \"\".join(out)\n\n\ndef _request(transport, method, url, headers, body=None, length=0):\n    try:\n        return transport.request(method, url, headers, body=body, length=length)\n    except AuthorityError:\n        raise\n    except Exception as error:\n        raise AuthorityError(\"Registry request failed or timed out.\") from error\n\n\ndef fetch_registry_token(registry, transport, actor, password):\n    \"\"\"Exchange actor credentials for a pull/push registry token.\"\"\"\n    if (\n        not isinstance(actor, str)\n        or not actor\n        or any(ord(char) < 32 or ord(char) == 127 for char in actor)\n    ):\n        raise AuthorityError(\"Registry actor is incorrect.\")\n    if not isinstance(password, str) or not password:\n        raise AuthorityError(\"Registry token is missing.\")\n    challenge = _request(transport, \"GET\", f\"https://{registry.REGISTRY}/v2/\", {})\n    if challenge.status != 401:\n        raise AuthorityError(\"Registry did not ask for authentication.\")\n    params = registry.parse_auth_challenge(\n        challenge.headers.get(\"www-authenticate\", \"\")\n    )\n    url = registry.token_request_url(params)\n    basic = _b64encode(f\"{actor}:{password}\".encode())\n    response = _request(\n        transport,\n        \"GET\",\n        url,\n        {\"Authorization\": f\"Basic {basic}\", \"Accept\": \"application/json\"},\n    )\n    if response.status != 200:\n        raise AuthorityError(\"Registry token request failed.\")\n    return registry.parse_token_payload(response.body)\n\n\ndef _authorization(token):\n    if not isinstance(token, str) or not token:\n        raise AuthorityError(\"Registry token is missing.\")\n    return {\"Authorization\": f\"Bearer {token}\"}\n\n\ndef head_blob(registry, transport, token, digest, size):\n    \"\"\"Return True when the blob is already present; fail on any other state.\"\"\"\n    headers = _authorization(token)\n    headers[\"Accept\"] = \"application/octet-stream\"\n    response = _request(\n        transport, \"HEAD\", registry.registry_url(f\"blobs/{digest}\"), headers\n    )\n    return registry.check_head_response(\n        response.status, response.headers, digest, size\n    )\n\n\ndef _head_manifest(registry, transport, token, digest, size):\n    headers = _authorization(token)\n    headers[\"Accept\"] = \"application/vnd.oci.image.manifest.v1+json\"\n    response = _request(\n        transport, \"HEAD\", registry.registry_url(f\"manifests/{digest}\"), headers\n    )\n    return registry.check_head_response(\n        response.status, response.headers, digest, size\n    )\n\n\ndef _remote_bytes(registry, transport, token, kind, digest, size):\n    media = (\n        \"application/vnd.oci.image.manifest.v1+json\"\n        if kind == \"manifests\"\n        else \"application/octet-stream\"\n    )\n    url = registry.registry_url(f\"{kind}/{digest}\")\n    headers = _authorization(token)\n    headers[\"Accept\"] = media\n    response = _request(transport, \"GET\", url, headers)\n    request_path = f\"/v2/{registry.PACKAGE}/{kind}/{digest}\"\n    target = registry.redirect_target(\n        request_path, digest, response.status, response.headers.get(\"location\", \"\")\n    )\n    if target is None:\n        return response.status, response.headers, response.body\n    download_url = f\"https://{registry.DOWNLOAD_HOST}{target}\"\n    final = _request(\n        transport, \"GET\", download_url, {\"Accept\": \"application/octet-stream\"}\n    )\n    return final.status, final.headers, final.body\n\n\ndef verify_remote_blob(registry, transport, token, digest, expected, size):\n    \"\"\"GET the blob and prove the remote bytes equal the local bytes.\"\"\"\n    if not isinstance(expected, bytes) or len(expected) != size:\n        raise AuthorityError(\"OCI blob descriptor size is incorrect.\")\n    status, headers, body = _remote_bytes(registry, transport, token, \"blobs\", digest, size)\n    registry.check_get_response(status, headers, body, digest, size, expected)\n    return {\"digest\": digest, \"size\": size, \"remote_sha256\": digest.removeprefix(\"sha256:\")}\n\n\ndef verify_remote_manifest(registry, transport, token, manifest, digest, size):\n    \"\"\"GET the manifest and prove the remote bytes equal the local bytes.\"\"\"\n    if not isinstance(manifest, bytes) or len(manifest) != size:\n        raise AuthorityError(\"OCI manifest exceeds its size limit.\")\n    status, headers, body = _remote_bytes(registry, transport, token, \"manifests\", digest, size)\n    registry.check_get_response(status, headers, body, digest, size, manifest)\n    return {\n        \"digest\": digest,\n        \"size\": size,\n        \"remote_sha256\": digest.removeprefix(\"sha256:\"),\n    }\n\n\ndef _require_blob(digest, data):\n    if not isinstance(digest, str) or not re.fullmatch(r\"sha256:[0-9a-f]{64}\", digest):\n        raise AuthorityError(\"OCI blob descriptor is incorrect.\")\n    if (\n        not isinstance(data, bytes)\n        or len(data) < 1\n        or len(data) > MAX_UPLOAD_BYTES\n    ):\n        raise AuthorityError(\"OCI blob descriptor size is incorrect.\")\n\n\ndef _begin_upload(registry, transport, token):\n    start = registry.registry_url(\"blobs/uploads/\")\n    response = _request(\n        transport,\n        \"POST\",\n        start,\n        {**_authorization(token), \"Content-Length\": \"0\"},\n    )\n    if response.status != 202 or \"location\" not in response.headers:\n        raise AuthorityError(\"Registry upload session could not start.\")\n    return registry.validate_upload_location(start, response.headers[\"location\"])\n\n\ndef upload_blob(registry, transport, token, digest, data):\n    \"\"\"Upload one blob, then require HEAD to prove it landed.\"\"\"\n    size = len(data)\n    location = _begin_upload(registry, transport, token)\n    target = registry.upload_target(location, digest)\n    try:\n        response = _request(\n            transport,\n            \"PUT\",\n            target,\n            {**_authorization(token), \"Content-Type\": \"application/octet-stream\"},\n            body=data,\n            length=size,\n        )\n    except AuthorityError:\n        if head_blob(registry, transport, token, digest, size):\n            return\n        raise\n    if response.status != 201:\n        raise AuthorityError(\"Registry blob upload did not complete.\")\n    if not head_blob(registry, transport, token, digest, size):\n        raise AuthorityError(\"Registry blob is absent after upload.\")\n\n\ndef upload_manifest(registry, transport, token, manifest, digest):\n    \"\"\"Upload the platform manifest, then require HEAD to prove it landed.\"\"\"\n    size = len(manifest)\n    url = registry.registry_url(f\"manifests/{digest}\")\n    try:\n        response = _request(\n            transport,\n            \"PUT\",\n            url,\n            {\n                **_authorization(token),\n                \"Content-Type\": \"application/vnd.oci.image.manifest.v1+json\",\n            },\n            body=manifest,\n            length=size,\n        )\n    except AuthorityError:\n        if _head_manifest(registry, transport, token, digest, size):\n            verify_remote_manifest(registry, transport, token, manifest, digest, size)\n            return\n        raise\n    if response.status != 201:\n        raise AuthorityError(\"Registry manifest upload did not complete.\")\n    if response.headers.get(\"docker-content-digest\") not in (None, digest):\n        raise AuthorityError(\n            \"Registry response has a manifest digest that is different from the requested digest.\"\n        )\n    if not _head_manifest(registry, transport, token, digest, size):\n        raise AuthorityError(\"Registry manifest is absent after upload.\")\n    verify_remote_manifest(registry, transport, token, manifest, digest, size)\n\n\ndef publish_blob(registry, transport, token, digest, data):\n    \"\"\"Upload a blob when absent, then prove the remote bytes with HEAD and GET.\"\"\"\n    _require_blob(digest, data)\n    size = len(data)\n    if not head_blob(registry, transport, token, digest, size):\n        upload_blob(registry, transport, token, digest, data)\n    verify_remote_blob(registry, transport, token, digest, data, size)\n    return {\n        \"digest\": digest,\n        \"size\": size,\n        \"remote_sha256\": digest.removeprefix(\"sha256:\"),\n    }\n\n\ndef publish_manifest_receipt(registry, transport, token, manifest):\n    \"\"\"Upload the platform manifest when absent, then prove the remote bytes.\"\"\"\n    if (\n        not isinstance(manifest, bytes)\n        or len(manifest) < 1\n        or len(manifest) > MAX_MANIFEST_BYTES\n    ):\n        raise AuthorityError(\"OCI manifest exceeds its size limit.\")\n    digest = \"sha256:\" + _sha(manifest)\n    size = len(manifest)\n    if not _head_manifest(registry, transport, token, digest, size):\n        upload_manifest(registry, transport, token, manifest, digest)\n    verify_remote_manifest(registry, transport, token, manifest, digest, size)\n    return {\n        \"digest\": digest,\n        \"size\": size,\n        \"remote_sha256\": digest.removeprefix(\"sha256:\"),\n    }\n\n\ndef publish_image(registry, transport, token, manifest, blobs):\n    \"\"\"Publish every blob and the platform manifest; prove every remote byte.\n\n    Returns a publication proof binding each descriptor digest and the\n    manifest digest to verified remote bytes. Anything missing, mismatched,\n    or changed raises instead of reporting PASS.\n    \"\"\"\n    if not isinstance(token, str) or not token:\n        raise AuthorityError(\"Registry token is missing.\")\n    if (\n        not isinstance(manifest, bytes)\n        or len(manifest) < 1\n        or len(manifest) > MAX_MANIFEST_BYTES\n    ):\n        raise AuthorityError(\"OCI manifest exceeds its size limit.\")\n    manifest_value = _json_bytes(manifest, \"OCI manifest\")\n    expected = blob_descriptors(manifest_value)\n    if not isinstance(blobs, dict) or set(blobs) != set(expected):\n        raise AuthorityError(\n            \"Publication blob set is not the same as the OCI manifest descriptors.\"\n        )\n    for digest, size in expected.items():\n        if not isinstance(blobs[digest], bytes) or len(blobs[digest]) != size:\n            raise AuthorityError(\"OCI blob descriptor size is incorrect.\")\n    receipts = {}\n    for digest in sorted(expected):\n        receipts[digest] = publish_blob(registry, transport, token, digest, blobs[digest])\n    manifest_receipt = publish_manifest_receipt(registry, transport, token, manifest)\n    for digest in sorted(expected):\n        verify_remote_blob(registry, transport, token, digest, blobs[digest], expected[digest])\n    return {\"blobs\": receipts, \"manifest\": manifest_receipt}\n\n\ndef check_publication_proof(proof, manifest):\n    \"\"\"Prove a publication proof covers exactly this manifest and its blobs.\"\"\"\n    if (\n        not isinstance(manifest, bytes)\n        or len(manifest) < 1\n        or len(manifest) > MAX_MANIFEST_BYTES\n    ):\n        raise AuthorityError(\"OCI manifest exceeds its size limit.\")\n    manifest_value = _json_bytes(manifest, \"OCI manifest\")\n    expected = blob_descriptors(manifest_value)\n    if not isinstance(proof, dict) or set(proof) != {\"blobs\", \"manifest\"}:\n        raise AuthorityError(\"Registry blob publication is not proven.\")\n    manifest_digest = \"sha256:\" + _sha(manifest)\n    if proof[\"manifest\"] != {\n        \"digest\": manifest_digest,\n        \"size\": len(manifest),\n        \"remote_sha256\": manifest_digest.removeprefix(\"sha256:\"),\n    }:\n        raise AuthorityError(\"Registry manifest publication is not proven.\")\n    blobs = proof[\"blobs\"]\n    if not isinstance(blobs, dict) or set(blobs) != set(expected):\n        raise AuthorityError(\"Registry blob publication is not proven.\")\n    for digest, size in expected.items():\n        if blobs[digest] != {\n            \"digest\": digest,\n            \"size\": size,\n            \"remote_sha256\": digest.removeprefix(\"sha256:\"),\n        }:\n            raise AuthorityError(\"Registry blob publication is not proven.\")\n    return proof\n\n\ndef build_evidence(identity, ci, record_archive, oci, manifest, record_sha256, record_source, publication):\n    manifest_value = _json_bytes(manifest, \"OCI manifest\")\n    if not isinstance(manifest_value, dict):\n        raise AuthorityError(\"OCI platform manifest has an incorrect format.\")\n    source_commit = check_record_source(record_source, identity[\"source\"])\n    check_publication_proof(publication, manifest)\n    config = manifest_value.get(\"config\", {})\n    layers = manifest_value.get(\"layers\", [])\n    evidence = {\n        \"schema\": EVIDENCE_SCHEMA,\n        \"status\": \"PASS\",\n        \"package\": PACKAGE,\n        \"digest_reference\": f\"{PACKAGE}@{oci['platform_manifest_digest']}\",\n        \"private_package_access_gate\": \"not_proven\",\n        \"archive\": {\"sha256\": record_archive[\"sha256\"], \"size_bytes\": record_archive[\"size_bytes\"]},\n        \"source\": source_commit,\n        \"workflow\": {\n            \"ref\": identity[\"workflow_ref\"],\n            \"authority_sha\": identity[\"source\"],\n            \"run_id\": identity[\"run_id\"],\n            \"run_attempt\": identity[\"run_attempt\"],\n            \"artifact_id\": identity[\"artifact_id\"],\n        },\n        \"ci\": ci,\n        \"oci\": {\n            \"platform\": \"linux/amd64\",\n            \"archive_index_digest\": \"sha256:\" + oci[\"archive_index_digest\"],\n            \"manifest_digest\": oci[\"platform_manifest_digest\"],\n            \"manifest_size_bytes\": len(manifest),\n            \"config_digest\": config.get(\"digest\"),\n            \"layer_digests\": [layer.get(\"digest\") for layer in layers],\n        },\n        \"record_sha256\": record_sha256,\n    }\n    encoded = (json.dumps(evidence, sort_keys=True, separators=(\",\", \":\")) + \"\\n\").encode()\n    if len(encoded) > MAX_RESULT_BYTES:\n        raise AuthorityError(\"Publication evidence exceeds its size limit.\")\n    return encoded\n\n\ndef validate_evidence(value):\n    expected_keys = {\n        \"schema\", \"status\", \"package\", \"digest_reference\",\n        \"private_package_access_gate\", \"archive\", \"source\", \"workflow\",\n        \"ci\", \"oci\", \"record_sha256\",\n    }\n    if not isinstance(value, dict) or set(value) != expected_keys:\n        raise AuthorityError(\"Publication evidence has unknown or missing fields.\")\n    if value[\"schema\"] != EVIDENCE_SCHEMA or value[\"status\"] != \"PASS\":\n        raise AuthorityError(\"Publication evidence schema or status is incorrect.\")\n    if value[\"package\"] != PACKAGE:\n        raise AuthorityError(\"Publication evidence package is incorrect.\")\n    oci = value.get(\"oci\")\n    if not isinstance(oci, dict) or oci.get(\"platform\") != \"linux/amd64\":\n        raise AuthorityError(\"Publication evidence OCI platform is incorrect.\")\n    for name in (\"manifest_digest\", \"config_digest\"):\n        digest = oci.get(name)\n        if not isinstance(digest, str) or not re.fullmatch(r\"sha256:[0-9a-f]{64}\", digest):\n            raise AuthorityError(f\"Publication evidence {name} is incorrect.\")\n    if type(oci.get(\"manifest_size_bytes\")) is not int or oci[\"manifest_size_bytes\"] < 1:\n        raise AuthorityError(\"Publication evidence manifest size is incorrect.\")\n    if (\n        not isinstance(oci.get(\"layer_digests\"), list)\n        or not oci[\"layer_digests\"]\n        or any(not isinstance(item, str) or not re.fullmatch(r\"sha256:[0-9a-f]{64}\", item) for item in oci[\"layer_digests\"])\n    ):\n        raise AuthorityError(\"Publication evidence layer digests are incorrect.\")\n    index_digest = oci.get(\"archive_index_digest\")\n    if not isinstance(index_digest, str) or not re.fullmatch(r\"sha256:[0-9a-f]{64}\", index_digest):\n        raise AuthorityError(\"Publication evidence archive index digest is incorrect.\")\n    if value[\"digest_reference\"] != f\"{PACKAGE}@{oci['manifest_digest']}\":\n        raise AuthorityError(\"Publication evidence digest reference is incorrect.\")\n    if not isinstance(value.get(\"source\"), str) or not re.fullmatch(r\"[0-9a-f]{40}\", value[\"source\"]):\n        raise AuthorityError(\"Publication evidence source is incorrect.\")\n    archive = value.get(\"archive\")\n    if (\n        not isinstance(archive, dict)\n        or not isinstance(archive.get(\"sha256\"), str)\n        or not re.fullmatch(r\"[0-9a-f]{64}\", archive[\"sha256\"])\n        or type(archive.get(\"size_bytes\")) is not int\n        or archive[\"size_bytes\"] < 1\n    ):\n        raise AuthorityError(\"Publication evidence archive is incorrect.\")\n    workflow = value.get(\"workflow\")\n    if not isinstance(workflow, dict) or set(workflow) != {\"ref\", \"authority_sha\", \"run_id\", \"run_attempt\", \"artifact_id\"}:\n        raise AuthorityError(\"Publication evidence workflow has unknown or missing fields.\")\n    if (\n        not isinstance(workflow.get(\"ref\"), str)\n        or not workflow[\"ref\"].endswith(\"@refs/heads/main\")\n        or not isinstance(workflow.get(\"authority_sha\"), str)\n        or not re.fullmatch(r\"[0-9a-f]{40}\", workflow[\"authority_sha\"])\n    ):\n        raise AuthorityError(\"Publication evidence workflow identity is incorrect.\")\n    for name in (\"run_id\", \"run_attempt\", \"artifact_id\"):\n        if type(workflow.get(name)) is not int or workflow[name] < 1:\n            raise AuthorityError(f\"Publication evidence workflow {name} is incorrect.\")\n    ci = value.get(\"ci\")\n    if (\n        not isinstance(ci, dict)\n        or set(ci) != {\"run_id\", \"run_attempt\"}\n        or type(ci.get(\"run_id\")) is not int\n        or type(ci.get(\"run_attempt\")) is not int\n    ):\n        raise AuthorityError(\"Publication evidence CI identity is incorrect.\")\n    if not isinstance(value.get(\"record_sha256\"), str) or not re.fullmatch(r\"[0-9a-f]{64}\", value[\"record_sha256\"]):\n        raise AuthorityError(\"Publication evidence record digest is incorrect.\")\n    if value.get(\"private_package_access_gate\") != \"not_proven\":\n        raise AuthorityError(\"Publication evidence access gate is incorrect.\")\n    return value\nVELNOR_IMAGE_AUTHORITY_EOF\ncat > \"$dir/job_image_authority_record.py\" <<'VELNOR_IMAGE_AUTHORITY_EOF'\n# SPDX-FileCopyrightText: 2026 Alexey Zhokhov\n# SPDX-License-Identifier: Apache-2.0\nimport json\nimport re\n\nSCHEMA = \"velnor.job-image-candidate.v1\"\nMAX_RECORD_BYTES = 1024**2\nINPUT_PATHS = (\n    \".velnor/runner.lock\",\n    \"images/job/ubuntu-26.04/Dockerfile\",\n    \"images/job/ubuntu-26.04/README.md\",\n    \"images/job/ubuntu-26.04/build-test.sh\",\n    \"images/job/ubuntu-26.04/candidate/candidate.py\",\n)\nRECORD_KEYS = {\n    \"schema\", \"source\", \"workflow\", \"platform\", \"build\", \"archive\", \"oci\"\n}\nSOURCE_KEYS = {\"commit\", \"ref\", \"inputs\"}\nWORKFLOW_KEYS = {\n    \"repository\", \"repository_id\", \"event\", \"workflow_ref\", \"authority_commit\",\n    \"run_id\", \"run_attempt\",\n}\nBUILD_KEYS = {\n    \"builder\", \"platform\", \"arguments\", \"exporter\", \"provenance\",\n    \"compression\", \"force_compression\",\n}\nARCHIVE_KEYS = {\"sha256\", \"size_bytes\"}\nOCI_KEYS = {\n    \"archive_index_digest\", \"archive_index_size_bytes\", \"platform_manifest_digest\",\n    \"platform_manifest_size_bytes\", \"image_configuration_digest\",\n    \"image_configuration_size_bytes\", \"layer_digests\",\n}\n\n\nclass AuthorityError(ValueError):\n    pass\n\n\ndef _unique_object(pairs):\n    result = {}\n    for key, value in pairs:\n        if key in result:\n            raise AuthorityError(f\"Duplicate JSON key: {key}\")\n        result[key] = value\n    return result\n\n\ndef _json_bytes(data, label):\n    try:\n        return json.loads(data, object_pairs_hook=_unique_object, parse_constant=_reject_constant)\n    except (UnicodeDecodeError, json.JSONDecodeError) as error:\n        raise AuthorityError(f\"{label} JSON has an incorrect format.\") from error\n\n\ndef _reject_constant(value):\n    raise AuthorityError(f\"JSON constant has an incorrect value: {value}.\")\n\n\ndef _exact_keys(value, expected, label):\n    if not isinstance(value, dict) or set(value) != expected:\n        raise AuthorityError(f\"{label} has unknown or missing fields.\")\n    return value\n\n\ndef _digest(value, label):\n    if not isinstance(value, str) or not re.fullmatch(r\"sha256:[0-9a-f]{64}\", value):\n        raise AuthorityError(f\"{label} must be a lowercase SHA-256 digest.\")\n    return value\n\n\ndef _read_limited_file(path, limit, label):\n    if path.is_symlink() or not path.is_file():\n        raise AuthorityError(f\"{label} must be a regular file.\")\n    if path.stat().st_size > limit:\n        raise AuthorityError(f\"{label} exceeds its size limit.\")\n    with path.open(\"rb\") as stream:\n        data = stream.read(limit + 1)\n    if len(data) > limit:\n        raise AuthorityError(f\"{label} exceeds its size limit.\")\n    return data\n\n\ndef load_record(path):\n    return _json_bytes(_read_limited_file(path, MAX_RECORD_BYTES, \"Candidate record\"), \"candidate record\")\n\n\ndef validate_record(value):\n    record = _exact_keys(value, RECORD_KEYS, \"Candidate record\")\n    if record[\"schema\"] != SCHEMA or record[\"platform\"] != \"linux/amd64\":\n        raise AuthorityError(\"Candidate schema or platform is incorrect.\")\n    source = _exact_keys(record[\"source\"], SOURCE_KEYS, \"Source\")\n    if not isinstance(source[\"commit\"], str) or not re.fullmatch(r\"[0-9a-f]{40}\", source[\"commit\"]) or not isinstance(source[\"ref\"], str) or not source[\"ref\"].startswith(\"refs/\"):\n        raise AuthorityError(\"Source identity is incorrect.\")\n    if not isinstance(source[\"inputs\"], dict) or set(source[\"inputs\"]) != set(INPUT_PATHS):\n        raise AuthorityError(\"The source input list is incomplete or unknown.\")\n    for name, digest in source[\"inputs\"].items():\n        if not isinstance(name, str) or not isinstance(digest, str) or not re.fullmatch(r\"[0-9a-f]{64}\", digest):\n            raise AuthorityError(\"Source input hash is incorrect.\")\n    workflow = _exact_keys(record[\"workflow\"], WORKFLOW_KEYS, \"Workflow\")\n    if not isinstance(workflow[\"repository\"], str) or not re.fullmatch(r\"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\", workflow[\"repository\"]):\n        raise AuthorityError(\"Workflow repository identity is incorrect.\")\n    if type(workflow[\"repository_id\"]) is not int or workflow[\"repository_id\"] < 1:\n        raise AuthorityError(\"Workflow repository ID is incorrect.\")\n    if not isinstance(workflow[\"event\"], str) or not re.fullmatch(r\"[a-z_]+\", workflow[\"event\"]):\n        raise AuthorityError(\"Workflow event is incorrect.\")\n    if (\n        not isinstance(workflow[\"workflow_ref\"], str)\n        or not workflow[\"workflow_ref\"].startswith(f\"{workflow['repository']}/.github/workflows/\")\n        or \"@refs/\" not in workflow[\"workflow_ref\"]\n    ):\n        raise AuthorityError(\"Workflow ref is incorrect.\")\n    if not isinstance(workflow[\"authority_commit\"], str) or not re.fullmatch(r\"[0-9a-f]{40}\", workflow[\"authority_commit\"]):\n        raise AuthorityError(\"Workflow authority commit is incorrect.\")\n    for name in (\"run_id\", \"run_attempt\"):\n        if type(workflow[name]) is not int or workflow[name] < 1:\n            raise AuthorityError(f\"Workflow {name} is incorrect.\")\n    build = _exact_keys(record[\"build\"], BUILD_KEYS, \"Build\")\n    if (\n        not isinstance(build[\"builder\"], str)\n        or re.fullmatch(r\"github\