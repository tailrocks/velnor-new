        if: "!contains(needs.plan.outputs.covered_tasks, ',stack/rust/crates/a/doctest/default,')"
        uses: ./.github/actions/declared-task-0 # zizmor: ignore[self-repository]
        with: {"digest": "b3-6c1c74a98af050290f1b630c43a1f6af600bb59bcb13c356930d7c480b7a8e03"}
      - name: Documentation
        if: "!contains(needs.plan.outputs.covered_tasks, ',stack/rust/crates/a/doc/default,')"
        uses: ./.github/actions/declared-task-0 # zizmor: ignore[self-repository]
        with: {"digest": "b3-1581f48a269a7de08fff3a2f10cddb8daac1b75baa42088e5365f2de38a42db6"}
      - name: Upload crate reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: error
          name: velnor-crate-r${{ github.run_id }}-a${{ github.run_attempt }}-rust-a
          path: ${{ runner.temp }}/velnor/r${{ github.run_id }}-a${{ github.run_attempt }}
          retention-days: "30"
      - name: Save Mise tools
        if: success() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.ref_protected == true && steps.v2.outputs.enabled == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
