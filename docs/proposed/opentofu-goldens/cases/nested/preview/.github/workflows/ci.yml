        uses: ./.github/actions/declared-task-0 # zizmor: ignore[self-repository]
        with: {"digest": "b3-37d38562ab6aab191e857b6840a9a9761578b4cc560646f0d8cf086dfb1bcd97"}
      - name: Upload crate reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: velnor-crate-r${{ github.run_id }}-a${{ github.run_attempt }}-rust-a
          path: ${{ runner.temp }}/velnor/r${{ github.run_id }}-a${{ github.run_attempt }}
          retention-days: "30"
      - name: Save Mise tools
        if: success() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.ref_protected == true && steps.v2.outputs.enabled == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: mise-tools-v2-${{steps.v2.outputs.identity}}
          path: "~/.local/share/mise\n${{ runner.temp }}/velnor/rustup\n${{ runner.temp }}/velnor/cargo/.crates.toml\n${{ runner.temp }}/velnor/cargo/.crates2.json\n${{ runner.temp }}/velnor/cargo/bin"
  rust-lib:
    name: Rust / lib
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      VELNOR_ASSET_SHA256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      VELNOR_ASSET_URL: https://github.com/tailrocks/velnor-new/releases/download/v0.1.8/velnor-actions-0.1.8-x86_64-unknown-linux-gnu
      VELNOR_RELEASE_COMMIT: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    needs:
      - plan
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
      - name: V2 identity
        id: v2
        uses: ./.github/actions/velnor-tools-prelude-u26 # zizmor: ignore[self-repository]
        with:
          d: 3d6ab7007f84254482dc8693f8c26d9545c676489302bf8e167fbbd085e8de03
      - name: Restore Mise tools
        if: steps.v2.outputs.enabled == 'true'
        uses: ./.github/actions/velnor-tools-cache-restore # zizmor: ignore[self-repository]
        with:
          key: mise-tools-v2-${{steps.v2.outputs.identity}}
          seed-admitted: ${{ steps.v2.outputs.seed_admitted }}
      - name: Setup Mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
        with:
          cache: "false"
          cache_save: "false"
          env: "false"
          install: "false"
          sha256: 6ab6646b52b83f6bbd51c9d0d3ae54264ffa90efd1ac6d7c0ec5a86bbc6a0030
          version: 2026.10.9
      - name: Acquire Velnor
        run: "sh -c 'unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN GITHUB_TOKEN MISE_GITHUB_TOKEN GH_TOKEN GH_HOST GH_CONFIG_DIR; d=\"$RUNNER_TEMP/velnor/bin/velnor-actions-0.1.8\"&&mkdir -p \"${d%/*}\"&&s=\"/opt/velnor/seed/generator/${d##*/}\"&&p=\"$VELNOR_ASSET_SHA256  \"&&if [ -f \"$s\" ]&&echo \"$p$s\"|sha256sum -c -;then cp \"$s\" \"$d\";else curl -fsSL --retry 5 --retry-all-errors --proto '\\''=https'\\'' --tlsv1.2 \"$VELNOR_ASSET_URL\" -o \"$d\"&&echo \"$p$d\"|sha256sum -c -;fi&&chmod +x \"$d\"'"
      - name: Download plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: velnor-plan-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/velnor/r${{ github.run_id }}-a${{ github.run_attempt }}
      - name: Prepare pinned tools
        env:
          MISE_CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
        run: mise --no-config --no-env --no-hooks install rust@1.99.0 actionlint@1.7.12 shellcheck@0.11.0 zizmor@1.30.1
      - name: Prepare Rust components
        env:
          CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
          RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
        run: mise --no-config --no-env --no-hooks exec rust@1.99.0 -- rustup component add --toolchain 1.99.0-x86_64-unknown-linux-gnu clippy rustfmt
      - name: Restore Cargo sources
        if: github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: velnor-v1-sources-x86_64-unknown-linux-gnu-1.99.0-${{hashFiles('Cargo.lock')}}
          path: "${{ runner.temp }}/velnor/cargo/registry/index\n${{ runner.temp }}/velnor/cargo/registry/cache\n${{ runner.temp }}/velnor/cargo/git/db"
          restore-keys: velnor-v1-sources-x86_64-unknown-linux-gnu-1.99.0-
      - name: Fetch Cargo sources
        env:
          MISE_CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
        run: "sh -c 'mkdir -p \"$RUNNER_TEMP/velnor/cargo-clean\" && cd \"$RUNNER_TEMP/velnor/cargo-clean\" && if mise --no-config --no-env --no-hooks exec rust@1.99.0 -- cargo metadata --locked --offline --manifest-path \"$GITHUB_WORKSPACE/Cargo.toml\" >/dev/null 2>&1; then echo \"velnor: sources hit, skipping fetch\"; else echo \"velnor: sources miss (source_missing), fetching\"; mise --no-config --no-env --no-hooks exec rust@1.99.0 -- cargo fetch --locked --manifest-path \"$GITHUB_WORKSPACE/Cargo.toml\"; fi'"
      - name: Clippy
        if: "!contains(needs.plan.outputs.covered_tasks, ',stack/rust/nested/lib/clippy/default,')"
        uses: ./.github/actions/declared-task-0 # zizmor: ignore[self-repository]
        with: {"digest": "b3-7f919a8c8617357db78764543f7ac52ca3c1d8363c0a95859b455e3343847477"}
      - name: Unit and integration tests
        if: "!contains(needs.plan.outputs.covered_tasks, ',stack/rust/nested/lib/test/default,')"
        uses: ./.github/actions/declared-task-0 # zizmor: ignore[self-repository]
        with: {"digest": "b3-088095a86bb02ae8dd0cb3bd328567c1e1999cf45214ae8f3d80eb473e7e7acb"}
      - name: Doctests
        if: "!contains(needs.plan.outputs.covered_tasks, ',stack/rust/nested/lib/doctest/default,')"
        uses: ./.github/actions/declared-task-0 # zizmor: ignore[self-repository]
        with: {"digest": "b3-0c1ae342dfaab3cb1874c20523515cee163365a81468973e575d5efdff7ba3a5"}
      - name: Documentation
        if: "!contains(needs.plan.outputs.covered_tasks, ',stack/rust/nested/lib/doc/default,')"
        uses: ./.github/actions/declared-task-0 # zizmor: ignore[self-repository]
        with: {"digest": "b3-3b70acdb91b5040d4872b52e989f30d90d605d4848e52187a5b9df15762ae16c"}
      - name: Upload crate reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: velnor-crate-r${{ github.run_id }}-a${{ github.run_attempt }}-rust-lib
          path: ${{ runner.temp }}/velnor/r${{ github.run_id }}-a${{ github.run_attempt }}
          retention-days: "30"
