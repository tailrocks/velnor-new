        with: {"digest": "b3-28091d8f0a0c29a847a4d1780a392b4d98dc179d49304f00f7fb13d4cf33112f"}
      - name: Documentation
        if: "!contains(needs.plan.outputs.covered_tasks, ',stack/rust/crates/a/doc/default,')"
        uses: ./.github/actions/declared-task-0 # zizmor: ignore[self-repository]
        with: {"digest": "b3-a1a10364cde3ea0049d24f144e79332c1f81020fac5d7093a20a6028122f6852"}
      - name: Upload crate reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
