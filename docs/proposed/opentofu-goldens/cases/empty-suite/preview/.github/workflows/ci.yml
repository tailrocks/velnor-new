        with:
          persist-credentials: "false"
      - name: Setup Mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550
        with:
          cache: "false"
          cache_save: "false"
          env: "false"
          install: "false"
