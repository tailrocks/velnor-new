  required-gate:
    name: Required
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      VELNOR_RUN_KEY_ATTEMPT: ${{ github.run_attempt }}
    needs:
      - required
    if: ${{ always() }}
    steps:
      - name: Fail unless the verdict passed
        if: ${{ always() && needs.required.result != 'success' }}
        run: env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_RUNTIME_TOKEN -u GITHUB_TOKEN -u MISE_GITHUB_TOKEN -u GH_TOKEN -u GH_HOST -u GH_CONFIG_DIR false
