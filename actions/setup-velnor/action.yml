name: Set up velnor-ci
description: Installs a released velnor-ci after checking its SHA-256, and adds it to PATH.
inputs:
  version:
    description: The velnor-ci version to install, as MAJOR.MINOR.PATCH.
    required: true
  sha256-linux-x64:
    description: The SHA-256 of the linux-x64 binary. Required on Linux X64 runners.
    required: false
    default: ''
  sha256-linux-arm64:
    description: The SHA-256 of the linux-arm64 binary. Required on Linux ARM64 runners.
    required: false
    default: ''
  sha256-macos-arm64:
    description: Ignored. velnor-ci has no macOS build since 2026-11-19; the input stays so generated workflows keep passing it.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Install velnor-ci
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        SHA256_LINUX_X64: ${{ inputs.sha256-linux-x64 }}
        SHA256_LINUX_ARM64: ${{ inputs.sha256-linux-arm64 }}
        RELEASES: https://github.com/tailrocks/velnor-new/releases/download
      run: |
        set -euo pipefail
        fail() { echo "::error title=setup-velnor::$1"; exit 1; }
        digest() {
          if command -v sha256sum > /dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi | cut -d ' ' -f 1
        }
        [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "version '$VERSION' must be MAJOR.MINOR.PATCH, digits only"
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) platform=linux-x64; expected="$SHA256_LINUX_X64" ;;
          Linux-ARM64) platform=linux-arm64; expected="$SHA256_LINUX_ARM64" ;;
          *) fail "velnor-ci has no build for $RUNNER_OS $RUNNER_ARCH" ;;
        esac
        [ -n "$expected" ] || fail "no SHA-256 was given for $platform"
        [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || fail "the SHA-256 for $platform is not 64 lowercase hex digits"
        MAX_BYTES=268435456
        bounded_copy() {
          head -c "$((MAX_BYTES + 1))" "$1" > "$2" 2> /dev/null &
          reader=$!
          for _ in $(seq 1 12); do
            kill -0 "$reader" 2> /dev/null || break
            sleep 0.05
          done
          if kill -0 "$reader" 2> /dev/null; then
            kill "$reader" 2> /dev/null || true
            wait "$reader" 2> /dev/null || true
            return 1
          fi
          wait "$reader" || return 1
          [ "$(wc -c < "$2")" -le "$MAX_BYTES" ]
        }
        arch="$(echo "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
        dir=
        if [ -n "${RUNNER_TOOL_CACHE:-}" ]; then
          dir="$RUNNER_TOOL_CACHE/velnor-ci/$VERSION/$arch"
          mkdir -p "$dir" 2> /dev/null || dir=
        fi
        staging="$(mktemp -d "$RUNNER_TEMP/velnor-ci-staging.XXXXXX")"
        trap 'rm -rf "$staging"' EXIT
        verified=
        for source in cache download; do
          rm -f "$staging/velnor-ci"
          if [ "$source" = cache ]; then
            [ -n "$dir" ] && [ -f "$dir/velnor-ci" ] && [ ! -L "$dir/velnor-ci" ] && [ -x "$dir/velnor-ci" ] || continue
            bounded_copy "$dir/velnor-ci" "$staging/velnor-ci" || continue
          else
            downloaded=
            for tag in "tools-v$VERSION" "rust-ci-v$VERSION"; do
              echo "Downloading $RELEASES/$tag/velnor-ci-$platform"
              if curl --fail --silent --show-error --location --retry 3 --max-filesize "$MAX_BYTES" --output "$staging/velnor-ci" "$RELEASES/$tag/velnor-ci-$platform"; then
                downloaded=1
                break
              fi
              rm -f "$staging/velnor-ci"
            done
            [ -n "$downloaded" ] || fail "downloading velnor-ci $VERSION $platform from the release tag tools-v$VERSION or rust-ci-v$VERSION failed, or the file is larger than $MAX_BYTES bytes"
            [ "$(wc -c < "$staging/velnor-ci")" -le "$MAX_BYTES" ] || fail "the velnor-ci $VERSION $platform download is larger than $MAX_BYTES bytes"
          fi
          if [ "$(digest "$staging/velnor-ci")" = "$expected" ]; then
            verified="$source"
            break
          fi
          echo "::warning title=setup-velnor::the $source copy of velnor-ci $VERSION does not match the SHA-256 $expected"
        done
        [ -n "$verified" ] || fail "SHA-256 mismatch for velnor-ci $VERSION $platform: expected $expected, downloaded $(digest "$staging/velnor-ci"). velnor-ci was not installed"
        bin="$RUNNER_TEMP/velnor-ci-bin"
        rm -rf "$bin"
        mkdir -p "$bin"
        cp "$staging/velnor-ci" "$bin/velnor-ci"
        chmod +x "$bin/velnor-ci"
        if [ "$verified" = cache ]; then
          echo "velnor-ci $VERSION is in the tool cache at $dir, so the download is skipped"
        else
          chmod +x "$staging/velnor-ci"
          entry=
          if [ -n "$dir" ] && entry="$(mktemp "$dir/.velnor-ci.XXXXXX" 2> /dev/null)" && cp "$staging/velnor-ci" "$entry" 2> /dev/null && chmod +x "$entry" && mv -f "$entry" "$dir/velnor-ci" 2> /dev/null; then
            echo "Verified SHA-256 $expected and installed velnor-ci $VERSION in $dir"
          else
            [ -z "$entry" ] || rm -f "$entry"
            echo "::warning title=setup-velnor::could not publish velnor-ci $VERSION to the tool cache; this job is not affected"
            echo "Verified SHA-256 $expected and installed velnor-ci $VERSION in $bin"
          fi
        fi
        echo "$bin" >> "$GITHUB_PATH"
