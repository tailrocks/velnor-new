name: Set up velnor-ci
description: Installs velnor-ci from a released archive after checking the archive's SHA-256, and adds it to PATH.
inputs:
  version:
    description: The velnor-ci version to install, as MAJOR.MINOR.PATCH.
    required: true
  sha256-linux-x64:
    description: The SHA-256 of the linux-x64 archive (velnor-ci-x86_64-unknown-linux-musl.tar.gz). Required on Linux X64 runners.
    required: false
    default: ''
  sha256-linux-arm64:
    description: The SHA-256 of the linux-arm64 archive (velnor-ci-aarch64-unknown-linux-musl.tar.gz). Required on Linux ARM64 runners.
    required: false
    default: ''
  sha256-macos-arm64:
    description: Ignored. velnor-ci has no macOS build since 2026-11-19; the input stays so generated workflows keep passing it.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Install velnor-ci
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        SHA256_LINUX_X64: ${{ inputs.sha256-linux-x64 }}
        SHA256_LINUX_ARM64: ${{ inputs.sha256-linux-arm64 }}
        RELEASES: https://github.com/tailrocks/velnor-new/releases/download
      run: |
        set -euo pipefail
        fail() { echo "::error title=setup-velnor::$1"; exit 1; }
        digest() {
          if command -v sha256sum > /dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi | cut -d ' ' -f 1
        }
        flush() {
          sync "$1" 2> /dev/null || sync
        }
        [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "version '$VERSION' must be MAJOR.MINOR.PATCH, digits only"
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) platform=linux-x64; triple=x86_64-unknown-linux-musl; expected="$SHA256_LINUX_X64" ;;
          Linux-ARM64) platform=linux-arm64; triple=aarch64-unknown-linux-musl; expected="$SHA256_LINUX_ARM64" ;;
          *) fail "velnor-ci has no build for $RUNNER_OS $RUNNER_ARCH" ;;
        esac
        [ -n "$expected" ] || fail "no SHA-256 was given for $platform"
        [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || fail "the SHA-256 for $platform is not 64 lowercase hex digits"
        archive="velnor-ci-$triple.tar.gz"
        MAX_BYTES=268435456
        bounded_copy() {
          head -c "$((MAX_BYTES + 1))" "$1" > "$2" 2> /dev/null &
          reader=$!
          for _ in $(seq 1 12); do
            kill -0 "$reader" 2> /dev/null || break
            sleep 0.05
          done
          if kill -0 "$reader" 2> /dev/null; then
            kill "$reader" 2> /dev/null || true
            wait "$reader" 2> /dev/null || true
            return 2
          fi
          wait "$reader" || return 1
          [ "$(wc -c < "$2")" -le "$MAX_BYTES" ]
        }
        clear_entry() {
          if [ -d "$1" ] || [ -L "$1" ]; then rm -rf -- "$1"; fi
        }
        copy_extracted() {
          head -c "$((MAX_BYTES + 1))" "$1" > "$2" 2> /dev/null || return 1
          [ "$(wc -c < "$2")" -le "$MAX_BYTES" ]
        }
        case "$(uname -s)" in
          Darwin | *BSD) no_follow=-h ;;
          *) no_follow=-T ;;
        esac
        publish_entry() {
          mv -f "$no_follow" "$1" "$2" 2> /dev/null && [ -f "$2" ] && [ ! -L "$2" ] && [ "$(digest "$2")" = "$expected" ]
        }
        mtime_of() {
          stat -c %Y "$1" 2> /dev/null || stat -f %m "$1" 2> /dev/null
        }
        prune_quarantine() {
          [ -n "$dir" ] || return 0
          quarantined="$(find "$dir" -maxdepth 1 \( -type f -o -type l \) -name '.velnor-ci.evict.*' 2> /dev/null | while IFS= read -r path; do
            mtime="$(mtime_of "$path")" || continue
            [ -n "$mtime" ] || continue
            printf '%s %s\n' "$mtime" "$path"
          done | sort -k1,1nr -k2r)" || return 0
          rank=0
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            rank=$((rank + 1))
            [ "$rank" -gt 3 ] || continue
            rm -f -- "${line#* }" 2> /dev/null || true
          done <<< "$quarantined"
        }
        evict_store_entry() {
          quarantine="$dir/.velnor-ci.evict.$$.$RANDOM$RANDOM"
          if mv -n "$no_follow" "$dir/$archive" "$quarantine" 2> /dev/null; then
            if [ -n "${1:-}" ]; then
              echo "::warning title=setup-velnor::removed the tool-cache copy of $archive for velnor-ci $VERSION $1"
              rm -f "$quarantine" 2> /dev/null || true
            elif [ "$(digest "$quarantine")" = "$expected" ]; then
              mv -n "$no_follow" "$quarantine" "$dir/$archive" 2> /dev/null || true
              if [ -e "$quarantine" ]; then
                echo "::warning title=setup-velnor::the verified copy of $archive for velnor-ci $VERSION is kept at $quarantine, because the store entry path is taken"
                prune_quarantine
              fi
            else
              echo "::warning title=setup-velnor::removed the tool-cache copy of $archive for velnor-ci $VERSION, which is not the archive with SHA-256 $expected"
              rm -f "$quarantine" 2> /dev/null || true
            fi
          else
            echo "::warning title=setup-velnor::could not remove the tool-cache copy of $archive for velnor-ci $VERSION, which is not the archive with SHA-256 $expected"
          fi
          return 0
        }
        arch="$(echo "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
        dir=
        if [ -n "${RUNNER_TOOL_CACHE:-}" ]; then
          dir="$RUNNER_TOOL_CACHE/velnor-ci/$VERSION/$arch"
          mkdir -p "$dir" 2> /dev/null || dir=
        fi
        staging="$(mktemp -d "$RUNNER_TEMP/velnor-ci-staging.XXXXXX")"
        trap 'rm -rf "$staging"' EXIT
        verified=
        archive_file=
        last=
        downloads=0
        for source in cache download download; do
          file="$(mktemp "$staging/$archive.XXXXXX")"
          if [ "$source" = cache ]; then
            n=1
            if [ -n "$dir" ] && [ -f "$dir/$archive" ] && [ ! -L "$dir/$archive" ]; then
              if [ -n "$(find "$dir/$archive" -size +"${MAX_BYTES}c" 2> /dev/null)" ]; then
                rm -f "$file"
                evict_store_entry "without reading it, because it is larger than $MAX_BYTES bytes"
                continue
              fi
              rc=0
              bounded_copy "$dir/$archive" "$file" || rc=$?
              if [ "$rc" -ne 0 ]; then
                rm -f "$file" 2> /dev/null || true
                if [ "$rc" -eq 2 ]; then
                  echo "::warning title=setup-velnor::the tool-cache copy of $archive for velnor-ci $VERSION could not be read in time, so it is not used and is kept"
                elif [ "$(digest "$dir/$archive")" = "$expected" ]; then
                  echo "::warning title=setup-velnor::the tool-cache copy of $archive for velnor-ci $VERSION could not be copied to $RUNNER_TEMP, so it is not used and is kept"
                else
                  evict_store_entry "because it could not be read"
                fi
                continue
              fi
            else
              rm -f "$file"
              if [ -n "$dir" ] && { [ -e "$dir/$archive" ] || [ -L "$dir/$archive" ]; }; then
                echo "::warning title=setup-velnor::removed the tool-cache entry at $dir/$archive for velnor-ci $VERSION, which is not a regular file"
                clear_entry "$dir/$archive" 2> /dev/null || true
              fi
              continue
            fi
          else
            downloads=$((downloads + 1))
            n=$downloads
            downloaded=
            for tag in "tools-v$VERSION" "rust-ci-v$VERSION"; do
              echo "Downloading $RELEASES/$tag/$archive"
              if curl --fail --silent --show-error --location --retry 3 --max-time 600 --retry-max-time 900 --max-filesize "$MAX_BYTES" --output "$file" "$RELEASES/$tag/$archive"; then
                downloaded=1
                break
              fi
              rm -f "$file"
            done
            [ -n "$downloaded" ] || fail "downloading $archive for velnor-ci $VERSION from the release tag tools-v$VERSION or rust-ci-v$VERSION failed, or the file is larger than $MAX_BYTES bytes"
            [ "$(wc -c < "$file")" -le "$MAX_BYTES" ] || fail "the $archive download for velnor-ci $VERSION is larger than $MAX_BYTES bytes"
          fi
          got="$(digest "$file")"
          size="$(wc -c < "$file" | tr -d ' ')"
          echo "$source attempt $n: expected SHA-256 $expected, received $got ($size bytes)"
          last="received $got ($size bytes)"
          if [ "$got" = "$expected" ]; then
            verified="$source"
            archive_file="$file"
            break
          fi
          rm -f "$file"
          if [ "$source" = cache ]; then
            evict_store_entry
          else
            echo "::warning title=setup-velnor::download attempt $n of $archive for velnor-ci $VERSION does not match the SHA-256 $expected"
          fi
        done
        [ -n "$verified" ] || fail "SHA-256 mismatch for velnor-ci $VERSION $platform: expected $expected, last attempt $last. velnor-ci was not installed"
        extract="$staging/extract"
        mkdir "$extract"
        listing="$(env -u TAR_OPTIONS tar --list --gzip --file "$archive_file")" || fail "reading the members of $archive failed. velnor-ci was not installed"
        named=0
        while IFS= read -r member; do
          if [ "$member" = velnor-ci ]; then named=$((named + 1)); fi
        done <<< "$listing"
        [ "$named" -eq 1 ] || fail "$archive must hold exactly one velnor-ci member, found $named. velnor-ci was not installed"
        (ulimit -f "$((MAX_BYTES / 1024 + 1))"; env -u TAR_OPTIONS tar --extract --gzip --no-same-owner --no-recursion --file "$archive_file" --directory "$extract" velnor-ci) || fail "extracting velnor-ci from $archive failed. velnor-ci was not installed"
        [ -f "$extract/velnor-ci" ] && [ ! -L "$extract/velnor-ci" ] || fail "$archive does not hold velnor-ci as a regular file. velnor-ci was not installed"
        copy_extracted "$extract/velnor-ci" "$staging/velnor-ci" || fail "velnor-ci in $archive is larger than $MAX_BYTES bytes. velnor-ci was not installed"
        bin="$RUNNER_TEMP/velnor-ci-bin"
        rm -rf "$bin"
        mkdir -p "$bin"
        cp "$staging/velnor-ci" "$bin/velnor-ci"
        chmod +x "$bin/velnor-ci"
        if [ "$verified" = cache ]; then
          echo "$archive for velnor-ci $VERSION is in the tool cache at $dir, so the download is skipped"
        else
          entry=
          if [ -n "$dir" ] && entry="$(mktemp "$dir/.velnor-ci.XXXXXX" 2> /dev/null)" && cp "$archive_file" "$entry" 2> /dev/null && flush "$entry" && clear_entry "$dir/$archive" 2> /dev/null && publish_entry "$entry" "$dir/$archive"; then
            echo "Verified SHA-256 $expected and installed velnor-ci $VERSION in $dir"
          else
            [ -z "$entry" ] || rm -f "$entry"
            echo "::warning title=setup-velnor::could not publish velnor-ci $VERSION to the tool cache; this job is not affected"
            echo "Verified SHA-256 $expected and installed velnor-ci $VERSION in $bin"
          fi
        fi
        echo "$bin" >> "$GITHUB_PATH"
