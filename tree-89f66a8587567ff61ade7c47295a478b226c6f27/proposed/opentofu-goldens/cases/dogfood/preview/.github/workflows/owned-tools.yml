    env:
      OWNED_TOOL_NAME: ${{ matrix.tool }}
      OWNED_TOOL_TARGET: ${{ matrix.target }}
      OWNED_TOOL_SOURCE_JSON: ${{ matrix.source }}
      OWNED_CANDIDATE_NAME: owned-candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.tool }}-${{ matrix.target }}
    steps:
      - name: Checkout qualification policy afresh
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Admit exact immutable candidate artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: "python3 scripts/download-owned-tool-candidate.py --name \"$OWNED_CANDIDATE_NAME\" --output \"$RUNNER_TEMP/velnor-owned-candidate\""
      - name: Qualify exact native candidate bytes
        shell: bash
        run: "python3 scripts/qualify-owned-tool.py --tool \"$OWNED_TOOL_NAME\" --target \"$OWNED_TOOL_TARGET\" --candidate-directory \"$RUNNER_TEMP/velnor-owned-candidate\" --receipt \"$RUNNER_TEMP/velnor-owned-candidate/qualified-receipt-$OWNED_TOOL_TARGET.json\" --report \"$RUNNER_TEMP/velnor-owned-candidate/native-report-$OWNED_TOOL_TARGET.json\""
      - name: Retain independent qualification evidence once
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: owned-qualification-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.tool }}-${{ matrix.target }}
          path: ${{ runner.temp }}/velnor-owned-candidate
          if-no-files-found: error
          retention-days: 7
          overwrite: false
