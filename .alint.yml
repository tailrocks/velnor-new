# Repository policy, enforced by asamarts/alint as the generated lint-alint job
# (`[[lint]]` in .velnor/rust-ci.toml; the pin is in mise.toml).
# Local rules cover generic file/path requirements and agent-instruction
# file integrity only, plus the `no-doctests` content rule (decision X76).
# No dependency-architecture, Rust-syntax, or test-layout claims: Alint
# cannot inspect those (see docs/proposed/rust-quality-contract.md §1, §4).
#
# `extends` pins the five pr-1 R04 bundles (OSS, GitHub Actions, Rust,
# lockfiles, no-tracked-artifacts), deduped: the review example repeats
# the GHA bundle. Verified on the pinned alint 0.22.1 (`alint
# validate-config` loads 55 bundled rules; `alint check
# --fail-on-warning` is green). Re-verify every bundle/level change with
# the pinned binary: `alint validate-config` plus `alint check`.
# Rust edition 2024 is NOT a literal `toml_path_equals` rule here: every
# member declares `edition.workspace = true`, so literal equality on
# `$.package.edition` would reject all seven manifests. Adoption §4
# requires the inheritance-aware form instead, enforced and tested by the
# Rust policy suite (`cargo metadata` effective edition plus TOML
# inheritance predicates).
#
# Schema: alint config model (`version` + `rules`, each rule with
# id/kind/level). The `command` rules are trusted: the top-level one checks
# only each AGENTS.md's sibling CLAUDE.md pointer file, which Alint has no native
# exact-content rule to express. Its `pair` rule checks existence only;
# the command below checks the regular-file type and exact pointer body on
# the CI Linux runner. Generated trees must not emit symlinks: plugin
# installers reject packages that contain symlink entries.
# Validate with the pinned alint binary: `alint validate-config`.
# The 80-line function/method limit (§5, "using Clippy accounting") is NOT
# expressed here — alint ships no function-level rule kind. It is enforced
# by Clippy (`too_many_lines = "deny"` + `too-many-lines-threshold = 80`).
#
# §5 limits are hard errors. No baseline/ratchet: oversized files MUST be
# split, never grandfathered (relabeling or exclusion to satisfy limits is
# forbidden by §5).
version: 1

# `fixtures/` holds adversarial test inputs (incl. a symlink loop and an
# escape symlink the walker cannot traverse). It is not Velnor-owned
# product code, so it is excluded from the walked index (ARCH-1.12).
ignore:
  - "fixtures/**"
  # Recovery snapshots and scratch prototypes are retained only for
  # provenance; they are not active first-party source or instruction files.

extends:
  - alint://bundled/oss-baseline@v1
  - alint://bundled/ci/github-actions@v1
  - alint://bundled/rust@v1
  - url: alint://bundled/hygiene/lockfiles@v1
    except:
      - lockfiles-no-nested-cargo
      - lockfiles-no-nested-npm
  - alint://bundled/hygiene/no-tracked-artifacts@v1

rules:
  # Required repo-shape files (rust-quality-contract §1 / RQ-1.1).
  - id: required-files
    kind: file_exists
    paths:
      - Cargo.toml
      - Cargo.lock
      - clippy.toml
      - deny.toml
      - rustfmt.toml
      - CODEOWNERS
      - .alint.yml
      - .config/nextest.toml
      - AGENTS.md
    level: error
    message: "Repo-shape file is missing (rust-quality-contract §1)"

  # Run against each real AGENTS.md and check its sibling. `pair` only checks
  # partner existence and cannot enforce file type or exact content; this
  # trusted command requires a regular (non-symlink) file with the single
  # `@AGENTS.md` import line. `.github/` is generated output owned by the
  # pinned generator and verified byte-exact by the generation-diff job,
  # so it stays out of this maintained-file rule.
  - id: claude-is-agents-pointer
    kind: command
    paths:
      include: ["**/AGENTS.md"]
      exclude: [".github/**"]
    command:
      - sh
      - -c
      - 'dir=$(dirname "$1") && test -f "$dir/CLAUDE.md" && test ! -L "$dir/CLAUDE.md" && printf "@AGENTS.md\n" | cmp -s - "$dir/CLAUDE.md"'
      - alint-claude-pointer
      - "{path}"
    level: error
    message: "Each AGENTS.md must have a sibling CLAUDE.md regular file with the @AGENTS.md pointer body"

  # Keep instruction files concise so they fit in agent context by default.
  - id: agent-instructions-max-lines
    kind: file_max_lines
    paths: "**/AGENTS.md"
    max_lines: 100
    level: error
    message: "AGENTS.md exceeds 100 lines; move detailed guidance into docs"

  - id: agent-instructions-max-size
    kind: file_max_size
    paths: "**/AGENTS.md"
    max_bytes: 16384
    level: error
    message: "AGENTS.md exceeds 16 KiB; move detailed guidance into docs"

  - id: crates-only
    kind: file_absent
    paths:
      include: ["**/*.rs"]
      exclude:
        - "crates/*/src/**"
        - "crates/*/tests/**"
        - "crates/*/benches/**"
        - "crates/*/examples/**"
        - "crates/*/fixtures/**"
        - "crates/*/testdata/**"
        - "crates/*/build.rs"
        - "crates/*/build_support/**"
        - "crates/velnor-test-support/**"
        - "generator/samples/**"
    level: error
    message: "Rust sources MUST live in canonical crate dirs (ARCH-1.10 strict placement)"

  # The root workspace lists its members explicitly. A crate directory that is
  # missing from `[workspace] members` would silently skip every root gate.
  - id: crates-listed-in-workspace
    kind: command
    paths:
      include: ["crates/*/Cargo.toml"]
    command:
      - sh
      - -c
      - 'grep -qxF "    \"$(dirname "$1")\"," Cargo.toml'
      - alint-workspace-member
      - "{path}"
    level: error
    message: "Every crates/*/Cargo.toml must have its directory listed in the root Cargo.toml [workspace] members"

  # Snapshot .source duplicates are forbidden everywhere: compare against the
  # live file, merge the best hunks, delete the snapshot. No .source file has
  # a legitimate reason to exist (fixtures/** stays globally ignored).
  - id: velnor-no-source-suffix
    kind: file_absent
    paths:
      include: ["**/*.source"]
    level: error
    message: "Snapshot .source duplicates are forbidden; merge into the live file"

  - id: velnor-no-stray-cargo-lock
    kind: file_absent
    paths:
      include: ["**/Cargo.lock"]
      exclude:
        - Cargo.lock
        - "generator/samples/**/Cargo.lock"
    level: error
    message: "Stray Cargo.lock. Only the root lock is resolved."

  - id: no-old-crate-paths
    kind: file_content_forbidden
    paths:
      include:
        - "scripts/**"
        - "images/**"
        - "mise.toml"
        - ".velnor/**"
        - "deny.toml"
        - ".config/**"
        - "AGENTS.md"
        - "README.md"
        - "docs/goals.md"
        - "docs/roadmap.md"
        - "docs/proposed/**"
        - "docs/content/**"
        - "local/README.md"
        - "generator/*.md"
      exclude:
        - "scripts/generator-release/**"
        - "scripts/test-native-hk-fmt.sh"
    pattern: 'ci-helper/crates|generator/crates|local/crates|crates/velnor-runner/|crates/test_support'
    level: error
    message: "Crates live in crates/velnor-* under the root workspace; use the new path"

  - id: no-absolute-local-paths
    kind: file_content_forbidden
    paths:
      include: ["**/*"]
      exclude:
        - ".alint.yml"
        - "docs/implemented/evidence/freshness-2026-10-20/agreement.json"
        - "docs/implemented/evidence/freshness-2026-10-20/first/035fc4486c0e2b8c.json"
        - "docs/implemented/evidence/freshness-2026-10-20/first/17c5fcc7d8439008.json"
