        - "docs/implemented/evidence/freshness-2026-10-20/second/e7bcb9aa10aaebf4.json"
        - "docs/implemented/evidence/freshness-2026-10-20/second/edb59db018f13a3c.json"
        - "docs/implemented/evidence/freshness-2026-10-20/second/f3a532f3cfaa4871.json"
        - "docs/implemented/evidence/freshness-2026-10-20/second/observations.json"
        - "docs/implemented/evidence/freshness-2026-10-24/qualification/update-set-pin-regressions-final.stderr"
        - "docs/implemented/evidence/freshness-2026-10-24/qualification/update-set-pin-regressions-initial.stderr"
    pattern: '(?m)(?:^|[^A-Za-z0-9._-])(?:/Users/[A-Za-z0-9._-]+(?:[/\s"\x27\x60):,\]]|$)|/home/(?:[^r/\s][A-Za-z0-9._-]*|r[^u/\s][A-Za-z0-9._-]*|ru[^n/\s][A-Za-z0-9._-]*|run[^n/\s][A-Za-z0-9._-]*|runn[^e/\s][A-Za-z0-9._-]*|runne[^r/\s][A-Za-z0-9._-]*|runner[A-Za-z0-9._-]+|r|ru|run|runn|runne)(?:[/\s"\x27\x60):,\]]|$)|/private/tmp/claude-|/root/)'
    level: error
    message: "Absolute home-directory path in a tracked file: use a repo-relative path, a relative link or a generic placeholder"

  - id: no-local-temp-paths
    kind: file_content_forbidden
    paths:
      include: ["**/*.md", "**/*.json", "**/*.txt"]
      exclude:
        - ".alint.yml"
        - "docs/implemented/evidence/freshness-2026-10-24/alint-0.20.0-to-0.20.1-compare.json"
        - "docs/implemented/evidence/freshness-2026-10-24/qualification/binary-checksums-verified.txt"
        - "docs/implemented/evidence/freshness-2026-10-24/qualification/commands.txt"
    pattern: '(?m)(?:^|[^A-Za-z0-9._/-])(?:/private/(?:tmp|var)/[A-Za-z0-9_]|/tmp/[A-Za-z0-9_]*[-._0-9])'
    level: error
    message: "Local temp path in a doc or evidence file: use a repo-relative path, a relative link or <tmp>/... as the placeholder. Plain /tmp/example style examples are allowed."

  - id: ci-gen-release-profile
    kind: file_content_forbidden
    paths:
      include:
        - ".github/workflows/release.yml"
        - ".velnor/workflows.toml"
        - ".github/actions/**"
        - "scripts/**"
        - "images/**"
        - "mise.toml"
    pattern: 'cargo build[^\n]*--release\b[^\n]*(velnor-ci|velnor-gen|ci-helper|generator/Cargo)|cargo build[^\n]*(velnor-ci|velnor-gen|ci-helper|generator/Cargo)[^\n]*--release\b|/release/velnor-(ci|gen)\b|(ci-helper|generator)/target'
    level: error
    message: "velnor-ci and velnor-gen ship with the size-tuned release-tools profile: build them with `cargo build --profile release-tools -p <package>` and copy from target/<triple>/release-tools/"

  - id: velnor-no-stray-npm-lock
    kind: file_absent
    paths:
      include: ["**/package-lock.json"]
      exclude:
        - package-lock.json
        - qualification/testcontainers/package-lock.json
    level: error
    message: "Stray package-lock.json. Only the root lock and qualification/testcontainers/package-lock.json are allowed."

  - id: rust-max-lines
    kind: file_max_lines
    paths:
      include:
        - "**/*.rs"
      exclude:
        - "**/fixtures/**"
        - "**/testdata/**"
    max_lines: 400
    level: error
    message: "Rust source exceeds 400 physical lines (rust-quality-contract §5)"

  - id: lib-main-max-lines
    kind: file_max_lines
    paths:
      include:
        - "crates/*/src/lib.rs"
        - "crates/*/src/main.rs"
    max_lines: 150
    level: error
    message: "src/lib.rs and src/main.rs MUST stay under 150 physical lines (§5)"

  - id: no-doctests-scanner
    kind: file_exists
    paths:
      - scripts/no-doctests.py
    level: error
    message: "The doc scanner is required: the no-doctests rule runs scripts/no-doctests.py, so a missing scanner must fail the lint instead of passing."

  - id: no-doctests
    kind: command
    paths:
      include:
        - "scripts/no-doctests.py"
    command:
      - python3
      - scripts/no-doctests.py
    level: error
    message: "Doctests are off by decision (Cargo `doctest = false`). A doc comment (`///`, `//!`, `/** */` or `/*! */`) or a `#[doc]` attribute must not hold a doc fence (``` or ~~~) at the start of a line, an indented doc code block, or an `include_str!` include. The check reads Rust tokens, so string literals are not doc comments and an inline run of backticks is not a fence. Do not add one; a decision is needed first."
