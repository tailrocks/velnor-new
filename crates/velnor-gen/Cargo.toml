[package]
name = "velnor-gen"
version = "0.1.108"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "velnor-gen"
path = "src/main.rs"
test = false

[[test]]
name = "it"
path = "tests/it/main.rs"

[dependencies]
velnor-model.workspace = true
velnor-rust.workspace = true
velnor-render.workspace = true
velnor-release.workspace = true
velnor-workflows.workspace = true
clap.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
toml.workspace = true

[dev-dependencies]
similar.workspace = true
velnor-test-support = { version = "=0.0.0", path = "../velnor-test-support" }
