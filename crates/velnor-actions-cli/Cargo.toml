[package]
name = "velnor-actions-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[[bin]]
name = "velnor-actions"
path = "src/main.rs"

[dependencies]
velnor-actions-orchestrator = { version = "=0.1.51", path = "../velnor-actions-orchestrator" }
velnor-actions-freshness = { version = "=0.1.51", path = "../velnor-actions-freshness" }
clap = { version = "=4.6.7", features = ["derive"] }
rustix = { version = "=1.1.5", features = ["fs"] }
serde_json = { workspace = true }

[lints]
workspace = true

[[test]]
name = "velnor_cli"
path = "tests/velnor_cli.rs"

[dev-dependencies]
toml = { version = "=1.1.8" }
proc-macro2 = "=1.0.107"
sha2 = "=0.11.1"
syn = { version = "=3.0.9", features = ["full", "visit"] }
