[package]
name = "velnor-actions-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[[bin]]
name = "velnor-actions"
path = "src/main.rs"

[dependencies]
velnor-actions-contract = { version = "=0.1.0", path = "../velnor-actions-contract" }
velnor-actions-orchestrator = { version = "=0.1.0", path = "../velnor-actions-orchestrator" }
clap = { version = "=4.6.7", features = ["derive"] }

[lints]
workspace = true

[[test]]
name = "velnor_cli"
path = "tests/velnor_cli.rs"
