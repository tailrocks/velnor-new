[package]
name = "velnor-actions-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[[bin]]
name = "velnor-actions"
path = "src/main.rs"

[dependencies]
velnor-actions-contract = { version = "=0.1.12", path = "../velnor-actions-contract" }
velnor-actions-orchestrator = { version = "=0.1.12", path = "../velnor-actions-orchestrator" }
velnor-actions-freshness = { version = "=0.1.12", path = "../velnor-actions-freshness" }
blake3 = "=1.8.7"
clap = { version = "=4.6.7", features = ["derive"] }
rustix = { version = "=1.1.5", features = ["fs", "process"] }

[lints]
workspace = true

[[test]]
name = "velnor_cli"
path = "tests/velnor_cli.rs"

[dev-dependencies]
proc-macro2 = "=1.0.107"
sha2 = "=0.11.1"
tempfile = { version = "=3.27.0" }
serde_json = { workspace = true }
syn = { version = "=3.0.9", features = ["full", "visit"] }
unicode-general-category = "=1.1.0"

[[example]]
name = "validate_commit_trailers"
path = "examples/validate_commit_trailers.rs"
test = true
