[package]
name = "velnor-actions-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[[bin]]
name = "velnor-actions"
path = "src/main.rs"
test = false

[[example]]
name = "qualification-diagnostics"
path = "examples/qualification_diagnostics.rs"
test = false

[[test]]
name = "velnor_cli"
path = "tests/velnor_cli.rs"

[[test]]
name = "api2026_pull_context_public"
path = "tests/api2026_pull_context_public.rs"

[[test]]
name = "preview_source_selection_public"
path = "tests/preview_source_selection_public.rs"

[[test]]
name = "candidate_freshness_public"
path = "tests/candidate_freshness_public.rs"

[[test]]
name = "bun_private_repository_public"
path = "tests/bun_private_repository_public.rs"

[[test]]
name = "bun_assets_handoff_public"
path = "tests/bun_assets_handoff_public.rs"

[[test]]
name = "review_completion_public"
path = "tests/review_completion_public.rs"

[dependencies]
serde_json = { workspace = true }
velnor-actions-orchestrator = { version = "=0.1.63", path = "../velnor-actions-orchestrator" }
velnor-actions-freshness = { version = "=0.1.63", path = "../velnor-actions-freshness" }
clap = { version = "=4.6.7", features = ["derive"] }

[lints]
workspace = true

[dev-dependencies]
velnor-actions-contract = { version = "=0.1.63", path = "../velnor-actions-contract" }
velnor-actions-mise = { version = "=0.1.63", path = "../velnor-actions-mise" }
proc-macro2 = "=1.0.107"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
rustix = { version = "=1.1.5", features = ["fs", "process"] }
sha2 = "=0.11.1"
syn = { version = "=3.0.9", features = ["full", "visit"] }
tempfile = "=3.27.0"
toml = "=1.1.8"
