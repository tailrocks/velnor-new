[package]
name = "velnor-actions-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[[bin]]
name = "velnor-actions"
path = "src/main.rs"
test = false

[dependencies]
serde_json = { workspace = true }
velnor-actions-orchestrator = { version = "=0.1.54", path = "../velnor-actions-orchestrator" }
velnor-actions-freshness = { version = "=0.1.54", path = "../velnor-actions-freshness" }
clap = { version = "=4.6.7", features = ["derive"] }

[lints]
workspace = true

[dev-dependencies]
proc-macro2 = "=1.0.107"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
rustix = { version = "=1.1.5", features = ["fs", "process"] }
sha2 = "=0.11.1"
syn = { version = "=3.0.9", features = ["full", "visit"] }
