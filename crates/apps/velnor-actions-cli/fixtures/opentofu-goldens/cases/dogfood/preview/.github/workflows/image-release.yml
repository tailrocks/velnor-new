        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: error
          name: image-assets
          path: "velnor-runner-linux-amd64.tar\nvelnor-dind-linux-amd64.tar\nSHA256SUMS"
