name: Generator release
"on":
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: generator-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-release-source:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "1"
          persist-credentials: "false"
      - name: Setup Mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5
        with:
          version: 2026.9.18
          sha256: d24fe0bf7e613824ad99f7b8dac3f2b381a37b9f75f84dd250855217095a8de4
          install: "false"
          env: "false"
          cache: "false"
          cache_save: "false"
      - name: Install pinned release gate tools
        shell: bash
        run: mise --no-config --no-env --no-hooks install gh@2.102.0 actionlint@1.7.12 shellcheck@0.11.0 zizmor@1.30.1
      - name: Run actionlint
        shell: bash
        run: mise --no-config --no-env --no-hooks exec actionlint@1.7.12 shellcheck@0.11.0 -- actionlint -color
      - name: Run zizmor
        shell: bash
        run: mise --no-config --no-env --no-hooks exec zizmor@1.30.1 -- zizmor --no-online-audits --config .zizmor.yml .github/workflows
      - name: Require successful CI at exact main SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: "gh() { mise --no-config --no-env --no-hooks exec gh@2.102.0 -- gh \"$@\"; }\nexport -f gh\nset -eu\ntest \"$GITHUB_REPOSITORY\" = 'tailrocks/velnor-new'\ntest \"$GITHUB_REF\" = 'refs/heads/main'\ntest \"$GITHUB_EVENT_NAME\" = 'workflow_dispatch'\ntest \"$GITHUB_WORKFLOW_SHA\" = \"$GITHUB_SHA\"\ntest \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\"\nruns=\"$(gh api --paginate --slurp \"repos/tailrocks/velnor-new/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&per_page=100\")\"\nrun=\"$(printf '%s\\n' \"$runs\" | jq -ce --arg sha \"$GITHUB_SHA\" --arg repo 'tailrocks/velnor-new' '[.[] | (.workflow_runs // [])[] | select(.path == \".github/workflows/ci.yml\" and .head_sha == $sha and .head_branch == \"main\" and .head_repository.full_name == $repo and .event == \"push\")] | sort_by([.run_number, .id]) | last // error(\"no exact-source main CI run\")')\"\ntest \"$(printf '%s\\n' \"$run\" | jq -r .status)\" = completed\ntest \"$(printf '%s\\n' \"$run\" | jq -r .conclusion)\" = success\nrun_id=\"$(printf '%s\\n' \"$run\" | jq -r .id)\"\nattempt=\"$(printf '%s\\n' \"$run\" | jq -r .run_attempt)\"\njobs=\"$(gh api --paginate --slurp \"repos/tailrocks/velnor-new/actions/runs/$run_id/attempts/$attempt/jobs?per_page=100\")\"\nprintf '%s\\n' \"$jobs\" | jq -e --arg sha \"$GITHUB_SHA\" '[.[] | (.jobs // [])[] | select(.name == \"Required\" and .head_sha == $sha and .head_branch == \"main\" and .status == \"completed\" and .conclusion == \"success\")] | length == 1' >/dev/null\ntest \"$(gh api repos/tailrocks/velnor-new/commits/main --jq .sha)\" = \"$GITHUB_SHA\""
      - name: Check release freshness gate
        shell: bash
        run: bash scripts/check-freshness.sh
      - name: Recheck default-branch source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: "gh() { mise --no-config --no-env --no-hooks exec gh@2.102.0 -- gh \"$@\"; }\nexport -f gh\nset -eu\ntest \"$GITHUB_REF\" = \"refs/heads/main\"\ntest \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\"\ntest \"$(gh api repos/tailrocks/velnor-new/commits/main --jq .sha)\" = \"$GITHUB_SHA\""
  build-linux:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
    needs:
      - verify-release-source
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "1"
          persist-credentials: "false"
      - name: Build Linux velnor-actions
        uses: ./.github/actions/generator-release-build-linux # zizmor: ignore[self-repository]
      - name: Upload Linux assets
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: generator-linux-assets
          path: generator-linux-assets.tar
          retention-days: 1
  qualify-linux:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    needs:
      - build-linux
      - candidate-manifest
    permissions: {}
    steps:
      - name: Fetch exact public source without an action post hook
        shell: bash
        run: "set -eu\npython3 - \"$GITHUB_WORKSPACE\" \"$GITHUB_REPOSITORY\" \"$GITHUB_SHA\" <<'PY'\nimport os\nimport re\nimport subprocess\nimport sys\n\nworkspace, repository, commit = sys.argv[1:]\nif repository != \"tailrocks/velnor-new\" or re.fullmatch(r\"[0-9a-f]{40}\", commit) is None:\n    raise SystemExit(\"qualification source identity is invalid\")\n\nenvironment = os.environ.copy()\nfor name in tuple(environment):\n    if name.startswith(\"GIT_\") or name in {\n        \"ACTIONS_ID_TOKEN_REQUEST_TOKEN\",\n        \"ACTIONS_ID_TOKEN_REQUEST_URL\",\n        \"ACTIONS_RUNTIME_TOKEN\",\n        \"GITHUB_TOKEN\",\n        \"GH_TOKEN\",\n        \"MISE_GITHUB_TOKEN\",\n    }:\n        environment.pop(name, None)\nenvironment.update(\n    GIT_CONFIG_GLOBAL=os.devnull,\n    GIT_CONFIG_NOSYSTEM=\"1\",\n    GIT_TERMINAL_PROMPT=\"0\",\n)\n\ndef run_git(*arguments, timeout):\n    subprocess.run(\n        [\"git\", *arguments],\n        cwd=workspace,\n        env=environment,\n        check=True,\n        timeout=timeout,\n    )\n\nrun_git(\"init\", \"--quiet\", timeout=10)\nrun_git(\n    \"-c\",\n    \"credential.helper=\",\n    \"fetch\",\n    \"--quiet\",\n    \"--depth=1\",\n    \"--no-tags\",\n    f\"https://github.com/{repository}.git\",\n    commit,\n    timeout=60,\n)\nrun_git(\"checkout\", \"--quiet\", \"--detach\", \"FETCH_HEAD\", timeout=10)\nhead = subprocess.run(\n    [\"git\", \"rev-parse\", \"HEAD\"],\n    cwd=workspace,\n    env=environment,\n    check=True,\n    capture_output=True,\n    text=True,\n    timeout=5,\n).stdout.strip()\nif head != commit:\n    raise SystemExit(\"qualification source does not match the requested commit\")\nPY"
      - name: Qualify Linux velnor-actions
        uses: ./.github/actions/generator-release-qualify-linux # zizmor: ignore[self-repository]
        with:
          artifact_id: ${{ needs.build-linux.outputs.artifact_id }}
          manifest_artifact_id: ${{ needs.candidate-manifest.outputs.artifact_id }}
          manifest_sha256: ${{ needs.candidate-manifest.outputs.manifest_sha256 }}
  attest-linux:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    needs:
      - build-linux
      - qualify-linux
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "1"
          persist-credentials: "false"
      - name: Attest Linux velnor-actions
        uses: ./.github/actions/generator-release-attest-linux # zizmor: ignore[self-repository]
        with:
          artifact_id: ${{ needs.build-linux.outputs.artifact_id }}
  build-macos:
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
    needs:
      - verify-release-source
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "1"
          persist-credentials: "false"
      - name: Build macOS velnor-actions
        uses: ./.github/actions/generator-release-build-macos # zizmor: ignore[self-repository]
      - name: Upload macOS assets
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: generator-macos-assets
          path: generator-macos-assets.tar
          retention-days: 1
  qualify-macos:
    runs-on: macos-15
    timeout-minutes: 120
    needs:
      - build-macos
      - candidate-manifest
    permissions: {}
    steps:
      - name: Fetch exact public source without an action post hook
        shell: bash
        run: "set -eu\npython3 - \"$GITHUB_WORKSPACE\" \"$GITHUB_REPOSITORY\" \"$GITHUB_SHA\" <<'PY'\nimport os\nimport re\nimport subprocess\nimport sys\n\nworkspace, repository, commit = sys.argv[1:]\nif repository != \"tailrocks/velnor-new\" or re.fullmatch(r\"[0-9a-f]{40}\", commit) is None:\n    raise SystemExit(\"qualification source identity is invalid\")\n\nenvironment = os.environ.copy()\nfor name in tuple(environment):\n    if name.startswith(\"GIT_\") or name in {\n        \"ACTIONS_ID_TOKEN_REQUEST_TOKEN\",\n        \"ACTIONS_ID_TOKEN_REQUEST_URL\",\n        \"ACTIONS_RUNTIME_TOKEN\",\n        \"GITHUB_TOKEN\",\n        \"GH_TOKEN\",\n        \"MISE_GITHUB_TOKEN\",\n    }:\n        environment.pop(name, None)\nenvironment.update(\n    GIT_CONFIG_GLOBAL=os.devnull,\n    GIT_CONFIG_NOSYSTEM=\"1\",\n    GIT_TERMINAL_PROMPT=\"0\",\n)\n\ndef run_git(*arguments, timeout):\n    subprocess.run(\n        [\"git\", *arguments],\n        cwd=workspace,\n        env=environment,\n        check=True,\n        timeout=timeout,\n    )\n\nrun_git(\"init\", \"--quiet\", timeout=10)\nrun_git(\n    \"-c\",\n    \"credential.helper=\",\n    \"fetch\",\n    \"--quiet\",\n    \"--depth=1\",\n    \"--no-tags\",\n    f\"https://github.com/{repository}.git\",\n    commit,\n    timeout=60,\n)\nrun_git(\"checkout\", \"--quiet\", \"--detach\", \"FETCH_HEAD\", timeout=10)\nhead = subprocess.run(\n    [\"git\", \"rev-parse\", \"HEAD\"],\n    cwd=workspace,\n    env=environment,\n    check=True,\n    capture_output=True,\n    text=True,\n    timeout=5,\n).stdout.strip()\nif head != commit:\n    raise SystemExit(\"qualification source does not match the requested commit\")\nPY"
      - name: Qualify macOS velnor-actions
        uses: ./.github/actions/generator-release-qualify-macos # zizmor: ignore[self-repository]
        with:
          artifact_id: ${{ needs.build-macos.outputs.artifact_id }}
          manifest_artifact_id: ${{ needs.candidate-manifest.outputs.artifact_id }}
          manifest_sha256: ${{ needs.candidate-manifest.outputs.manifest_sha256 }}
  attest-macos:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    needs:
      - build-macos
      - qualify-macos
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "1"
          persist-credentials: "false"
      - name: Attest macOS velnor-actions
        uses: ./.github/actions/generator-release-attest-macos # zizmor: ignore[self-repository]
        with:
          artifact_id: ${{ needs.build-macos.outputs.artifact_id }}
  build-macos-intel:
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
    needs:
      - verify-release-source
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "1"
          persist-credentials: "false"
      - name: Build macOS x86_64 velnor-actions
        uses: ./.github/actions/generator-release-build-macos-intel # zizmor: ignore[self-repository]
      - name: Upload macOS x86_64 assets
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: generator-macos-intel-assets
          path: generator-macos-intel-assets.tar
          retention-days: 1
  qualify-macos-intel:
    runs-on: macos-15-intel
    timeout-minutes: 120
    needs:
      - build-macos-intel
      - candidate-manifest
    permissions: {}
    steps:
      - name: Fetch exact public source without an action post hook
        shell: bash
        run: "set -eu\npython3 - \"$GITHUB_WORKSPACE\" \"$GITHUB_REPOSITORY\" \"$GITHUB_SHA\" <<'PY'\nimport os\nimport re\nimport subprocess\nimport sys\n\nworkspace, repository, commit = sys.argv[1:]\nif repository != \"tailrocks/velnor-new\" or re.fullmatch(r\"[0-9a-f]{40}\", commit) is None:\n    raise SystemExit(\"qualification source identity is invalid\")\n\nenvironment = os.environ.copy()\nfor name in tuple(environment):\n    if name.startswith(\"GIT_\") or name in {\n        \"ACTIONS_ID_TOKEN_REQUEST_TOKEN\",\n        \"ACTIONS_ID_TOKEN_REQUEST_URL\",\n        \"ACTIONS_RUNTIME_TOKEN\",\n        \"GITHUB_TOKEN\",\n        \"GH_TOKEN\",\n        \"MISE_GITHUB_TOKEN\",\n    }:\n        environment.pop(name, None)\nenvironment.update(\n    GIT_CONFIG_GLOBAL=os.devnull,\n    GIT_CONFIG_NOSYSTEM=\"1\",\n    GIT_TERMINAL_PROMPT=\"0\",\n)\n\ndef run_git(*arguments, timeout):\n    subprocess.run(\n        [\"git\", *arguments],\n        cwd=workspace,\n        env=environment,\n        check=True,\n        timeout=timeout,\n    )\n\nrun_git(\"init\", \"--quiet\", timeout=10)\nrun_git(\n    \"-c\",\n    \"credential.helper=\",\n    \"fetch\",\n    \"--quiet\",\n    \"--depth=1\",\n    \"--no-tags\",\n    f\"https://github.com/{repository}.git\",\n    commit,\n    timeout=60,\n)\nrun_git(\"checkout\", \"--quiet\", \"--detach\", \"FETCH_HEAD\", timeout=10)\nhead = subprocess.run(\n    [\"git\", \"rev-parse\", \"HEAD\"],\n    cwd=workspace,\n    env=environment,\n    check=True,\n    capture_output=True,\n    text=True,\n    timeout=5,\n).stdout.strip()\nif head != commit:\n    raise SystemExit(\"qualification source does not match the requested commit\")\nPY"
      - name: Qualify macOS x86_64 velnor-actions
        uses: ./.github/actions/generator-release-qualify-macos-intel # zizmor: ignore[self-repository]
        with:
          artifact_id: ${{ needs.build-macos-intel.outputs.artifact_id }}
          manifest_artifact_id: ${{ needs.candidate-manifest.outputs.artifact_id }}
          manifest_sha256: ${{ needs.candidate-manifest.outputs.manifest_sha256 }}
  attest-macos-intel:
    runs-on: macos-15-intel
    timeout-minutes: 20
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    needs:
      - build-macos-intel
      - qualify-macos-intel
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "1"
          persist-credentials: "false"
      - name: Attest macOS x86_64 velnor-actions
        uses: ./.github/actions/generator-release-attest-macos-intel # zizmor: ignore[self-repository]
        with:
          artifact_id: ${{ needs.build-macos-intel.outputs.artifact_id }}
  candidate-manifest:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
    needs:
      - verify-release-source
      - build-linux
      - build-macos
      - build-macos-intel
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      manifest_sha256: ${{ steps.manifest_digest.outputs.manifest_sha256 }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "1"
          persist-credentials: "false"
      - name: Setup Mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5
        with:
          version: 2026.9.18
          sha256: d24fe0bf7e613824ad99f7b8dac3f2b381a37b9f75f84dd250855217095a8de4
          install: "false"
          env: "false"
          cache: "false"
          cache_save: "false"
      - name: Download exact build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build-linux.outputs.artifact_id }}
          path: linux-assets
      - name: Prevalidate and extract uploaded candidate archive
        shell: bash
        run: "set -eu\nbash scripts/with-owned-archive-guard.sh -- python3 scripts/generator-release/extract-candidate.py 'linux-assets/generator-linux-assets.tar' 'linux-assets' 'velnor-actions-0.1.7-x86_64-unknown-linux-gnu' 'velnor-actions-0.1.7-x86_64-unknown-linux-gnu.sha256' 'velnor-actions-0.1.7-x86_64-unknown-linux-gnu.provenance.json'"
      - name: Verify extracted candidate file types and executable mode
        shell: bash
        run: "set -eu\ntest -f linux-assets/velnor-actions-0.1.7-x86_64-unknown-linux-gnu\ntest ! -L linux-assets/velnor-actions-0.1.7-x86_64-unknown-linux-gnu\ntest -x linux-assets/velnor-actions-0.1.7-x86_64-unknown-linux-gnu\ntest -f linux-assets/velnor-actions-0.1.7-x86_64-unknown-linux-gnu.sha256\ntest ! -L linux-assets/velnor-actions-0.1.7-x86_64-unknown-linux-gnu.sha256\ntest ! -x linux-assets/velnor-actions-0.1.7-x86_64-unknown-linux-gnu.sha256\ntest -f linux-assets/velnor-actions-0.1.7-x86_64-unknown-linux-gnu.provenance.json\ntest ! -L linux-assets/velnor-actions-0.1.7-x86_64-unknown-linux-gnu.provenance.json\ntest ! -x linux-assets/velnor-actions-0.1.7-x86_64-unknown-linux-gnu.provenance.json"
      - name: Verify source-bound build record
        shell: bash
        run: "set -eu\ndigest=\"$(awk -v expected='velnor-actions-0.1.7-x86_64-unknown-linux-gnu' 'NR == 1 { if (NF != 2 || length($1) != 64 || $1 !~ /^[0-9a-f]+$/ || $2 != expected) exit 1; print $1; next } { exit 1 } END { if (NR != 1) exit 1 }' 'linux-assets/velnor-actions-0.1.7-x86_64-unknown-linux-gnu.sha256')\"\njq -e --arg version \"0.1.7\" --arg repository \"$GITHUB_REPOSITORY\" --arg commit \"$GITHUB_SHA\" --arg target \"x86_64-unknown-linux-gnu\" --arg asset \"velnor-actions-0.1.7-x86_64-unknown-linux-gnu\" --arg sha256 \"$digest\" --arg rust '1.98.1' --arg mr_boxington '1.21.1' '.schema == 1 and .version == $version and .repository == $repository and .commit == $commit and .target == $target and .asset == $asset and .sha256 == $sha256 and .toolchain.rust == $rust and .toolchain[\"mr-boxington\"] == $mr_boxington' linux-assets/velnor-actions-0.1.7-x86_64-unknown-linux-gnu.provenance.json > /dev/null"
      - name: Download exact build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build-macos.outputs.artifact_id }}
          path: macos-assets
      - name: Prevalidate and extract uploaded candidate archive
        shell: bash
        run: "set -eu\nbash scripts/with-owned-archive-guard.sh -- python3 scripts/generator-release/extract-candidate.py 'macos-assets/generator-macos-assets.tar' 'macos-assets' 'velnor-actions-0.1.7-aarch64-apple-darwin' 'velnor-actions-0.1.7-aarch64-apple-darwin.sha256' 'velnor-actions-0.1.7-aarch64-apple-darwin.provenance.json'"
      - name: Verify extracted candidate file types and executable mode
        shell: bash
        run: "set -eu\ntest -f macos-assets/velnor-actions-0.1.7-aarch64-apple-darwin\ntest ! -L macos-assets/velnor-actions-0.1.7-aarch64-apple-darwin\ntest -x macos-assets/velnor-actions-0.1.7-aarch64-apple-darwin\ntest -f macos-assets/velnor-actions-0.1.7-aarch64-apple-darwin.sha256\ntest ! -L macos-assets/velnor-actions-0.1.7-aarch64-apple-darwin.sha256\ntest ! -x macos-assets/velnor-actions-0.1.7-aarch64-apple-darwin.sha256\ntest -f macos-assets/velnor-actions-0.1.7-aarch64-apple-darwin.provenance.json\ntest ! -L macos-assets/velnor-actions-0.1.7-aarch64-apple-darwin.provenance.json\ntest ! -x macos-assets/velnor-actions-0.1.7-aarch64-apple-darwin.provenance.json"
      - name: Verify source-bound build record
        shell: bash
        run: "set -eu\ndigest=\"$(awk -v expected='velnor-actions-0.1.7-aarch64-apple-darwin' 'NR == 1 { if (NF != 2 || length($1) != 64 || $1 !~ /^[0-9a-f]+$/ || $2 != expected) exit 1; print $1; next } { exit 1 } END { if (NR != 1) exit 1 }' 'macos-assets/velnor-actions-0.1.7-aarch64-apple-darwin.sha256')\"\njq -e --arg version \"0.1.7\" --arg repository \"$GITHUB_REPOSITORY\" --arg commit \"$GITHUB_SHA\" --arg target \"aarch64-apple-darwin\" --arg asset \"velnor-actions-0.1.7-aarch64-apple-darwin\" --arg sha256 \"$digest\" --arg rust '1.98.1' --arg mr_boxington '1.21.1' '.schema == 1 and .version == $version and .repository == $repository and .commit == $commit and .target == $target and .asset == $asset and .sha256 == $sha256 and .toolchain.rust == $rust and .toolchain[\"mr-boxington\"] == $mr_boxington' macos-assets/velnor-actions-0.1.7-aarch64-apple-darwin.provenance.json > /dev/null"
      - name: Download exact build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build-macos-intel.outputs.artifact_id }}
          path: macos-intel-assets
      - name: Prevalidate and extract uploaded candidate archive
        shell: bash
        run: "set -eu\nbash scripts/with-owned-archive-guard.sh -- python3 scripts/generator-release/extract-candidate.py 'macos-intel-assets/generator-macos-intel-assets.tar' 'macos-intel-assets' 'velnor-actions-0.1.7-x86_64-apple-darwin' 'velnor-actions-0.1.7-x86_64-apple-darwin.sha256' 'velnor-actions-0.1.7-x86_64-apple-darwin.provenance.json'"
      - name: Verify extracted candidate file types and executable mode
        shell: bash
        run: "set -eu\ntest -f macos-intel-assets/velnor-actions-0.1.7-x86_64-apple-darwin\ntest ! -L macos-intel-assets/velnor-actions-0.1.7-x86_64-apple-darwin\ntest -x macos-intel-assets/velnor-actions-0.1.7-x86_64-apple-darwin\ntest -f macos-intel-assets/velnor-actions-0.1.7-x86_64-apple-darwin.sha256\ntest ! -L macos-intel-assets/velnor-actions-0.1.7-x86_64-apple-darwin.sha256\ntest ! -x macos-intel-assets/velnor-actions-0.1.7-x86_64-apple-darwin.sha256\ntest -f macos-intel-assets/velnor-actions-0.1.7-x86_64-apple-darwin.provenance.json\ntest ! -L macos-intel-assets/velnor-actions-0.1.7-x86_64-apple-darwin.provenance.json\ntest ! -x macos-intel-assets/velnor-actions-0.1.7-x86_64-apple-darwin.provenance.json"
      - name: Verify source-bound build record
        shell: bash
        run: "set -eu\ndigest=\"$(awk -v expected='velnor-actions-0.1.7-x86_64-apple-darwin' 'NR == 1 { if (NF != 2 || length($1) != 64 || $1 !~ /^[0-9a-f]+$/ || $2 != expected) exit 1; print $1; next } { exit 1 } END { if (NR != 1) exit 1 }' 'macos-intel-assets/velnor-actions-0.1.7-x86_64-apple-darwin.sha256')\"\njq -e --arg version \"0.1.7\" --arg repository \"$GITHUB_REPOSITORY\" --arg commit \"$GITHUB_SHA\" --arg target \"x86_64-apple-darwin\" --arg asset \"velnor-actions-0.1.7-x86_64-apple-darwin\" --arg sha256 \"$digest\" --arg rust '1.98.1' --arg mr_boxington '1.21.1' '.schema == 1 and .version == $version and .repository == $repository and .commit == $commit and .target == $target and .asset == $asset and .sha256 == $sha256 and .toolchain.rust == $rust and .toolchain[\"mr-boxington\"] == $mr_boxington' macos-intel-assets/velnor-actions-0.1.7-x86_64-apple-darwin.provenance.json > /dev/null"
      - name: Create canonical candidate manifest from verified build bytes
        shell: bash
        run: "test \"$GITHUB_WORKFLOW_SHA\" = \"$GITHUB_SHA\"\nbash scripts/generator-release/create-release-manifest.sh '0.1.7' 'tailrocks/velnor-new' '1.98.1' '1.21.1'"
      - name: Stage canonical candidate manifest
        shell: bash
        run: "set -eu\nmkdir -p manifest-assets\nmv release-manifest.json manifest-assets/release-manifest.json"
      - name: Record canonical manifest digest
        id: manifest_digest
        shell: bash
        run: "set -eu\ndigest=\"$(sha256sum 'manifest-assets/release-manifest.json' | awk 'NR == 1 { print $1; next } { exit 1 } END { if (NR != 1) exit 1 }')\"\ntest \"${#digest}\" -eq 64\nprintf 'manifest_sha256=%s\\n' \"$digest\" >> \"$GITHUB_OUTPUT\""
      - name: Upload same-run release manifest
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: generator-release-manifest
          path: manifest-assets/release-manifest.json
          retention-days: 1
  attest-manifest:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    needs:
      - candidate-manifest
      - build-linux
      - build-macos
      - build-macos-intel
      - attest-linux
      - attest-macos
      - attest-macos-intel
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "1"
          persist-credentials: "false"
      - name: Attest generator release manifest
        uses: ./.github/actions/generator-release-attest-manifest # zizmor: ignore[self-repository]
        with:
          linux_artifact_id: ${{ needs.build-linux.outputs.artifact_id }}
          macos_arm64_artifact_id: ${{ needs.build-macos.outputs.artifact_id }}
          macos_x86_64_artifact_id: ${{ needs.build-macos-intel.outputs.artifact_id }}
          manifest_artifact_id: ${{ needs.candidate-manifest.outputs.artifact_id }}
          manifest_sha256: ${{ needs.candidate-manifest.outputs.manifest_sha256 }}
  publish-generator:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
    needs:
      - attest-linux
      - attest-macos
      - attest-macos-intel
      - attest-manifest
      - candidate-manifest
      - build-linux
      - build-macos
      - build-macos-intel
    environment:
      name: generator-release
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "1"
          persist-credentials: "false"
      - name: Publish generator release
        uses: ./.github/actions/generator-release-publish # zizmor: ignore[self-repository]
        with:
          linux_artifact_id: ${{ needs.build-linux.outputs.artifact_id }}
          macos_arm64_artifact_id: ${{ needs.build-macos.outputs.artifact_id }}
          macos_x86_64_artifact_id: ${{ needs.build-macos-intel.outputs.artifact_id }}
          manifest_artifact_id: ${{ needs.candidate-manifest.outputs.artifact_id }}
          manifest_sha256: ${{ needs.candidate-manifest.outputs.manifest_sha256 }}
      - name: Upload verified immutable release acceptance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: generator-release-accepted-${{ github.sha }}
          path: "release-accepted/release-manifest.json\nrelease-accepted/release-acceptance.json"
          retention-days: 1
