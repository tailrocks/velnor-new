name: Attest generator release manifest
description: Shared steps for Attest generator release manifest
inputs:
  linux_artifact_id:
    description: Artifact ID from the Linux x86_64 build job
    required: true
  macos_arm64_artifact_id:
    description: Artifact ID from the macOS arm64 build job
    required: true
  macos_x86_64_artifact_id:
    description: Artifact ID from the macOS x86_64 build job
    required: true
  manifest_artifact_id:
    description: Artifact ID of the canonical same-run manifest
    required: true
  manifest_sha256:
    description: SHA-256 of the canonical same-run manifest bytes
    required: true
runs:
  using: composite
  steps:
    - name: Setup Mise
      uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5
      with:
        version: 2026.9.18
        sha256: d24fe0bf7e613824ad99f7b8dac3f2b381a37b9f75f84dd250855217095a8de4
        install: "false"
        env: "false"
        cache: "false"
        cache_save: "false"
    - name: Install pinned GitHub CLI
      shell: bash
      run: mise --no-config --no-env --no-hooks install gh@2.102.0
    - name: Download x86_64-unknown-linux-gnu candidate assets
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: ${{ inputs.linux_artifact_id }}
        path: linux-assets
    - name: Prevalidate and extract uploaded candidate archive
      shell: bash
      run: "set -eu\nbash scripts/with-owned-archive-guard.sh -- python3 scripts/generator-release/extract-candidate.py 'linux-assets/generator-linux-assets.tar' 'linux-assets' 'velnor-actions-0.1.1-x86_64-unknown-linux-gnu' 'velnor-actions-0.1.1-x86_64-unknown-linux-gnu.sha256' 'velnor-actions-0.1.1-x86_64-unknown-linux-gnu.provenance.json'"
    - name: Verify extracted candidate file types and executable mode
      shell: bash
      run: "set -eu\ntest -f linux-assets/velnor-actions-0.1.1-x86_64-unknown-linux-gnu\ntest ! -L linux-assets/velnor-actions-0.1.1-x86_64-unknown-linux-gnu\ntest -x linux-assets/velnor-actions-0.1.1-x86_64-unknown-linux-gnu\ntest -f linux-assets/velnor-actions-0.1.1-x86_64-unknown-linux-gnu.sha256\ntest ! -L linux-assets/velnor-actions-0.1.1-x86_64-unknown-linux-gnu.sha256\ntest ! -x linux-assets/velnor-actions-0.1.1-x86_64-unknown-linux-gnu.sha256\ntest -f linux-assets/velnor-actions-0.1.1-x86_64-unknown-linux-gnu.provenance.json\ntest ! -L linux-assets/velnor-actions-0.1.1-x86_64-unknown-linux-gnu.provenance.json\ntest ! -x linux-assets/velnor-actions-0.1.1-x86_64-unknown-linux-gnu.provenance.json"
    - name: Verify source-bound candidate provenance
      shell: bash
      run: "set -eu\ndigest=\"$(awk -v expected='velnor-actions-0.1.1-x86_64-unknown-linux-gnu' 'NR == 1 { if (NF != 2 || length($1) != 64 || $1 !~ /^[0-9a-f]+$/ || $2 != expected) exit 1; print $1; next } { exit 1 } END { if (NR != 1) exit 1 }' 'linux-assets/velnor-actions-0.1.1-x86_64-unknown-linux-gnu.sha256')\"\njq -e --arg version \"0.1.1\" --arg repository \"$GITHUB_REPOSITORY\" --arg commit \"$GITHUB_SHA\" --arg target \"x86_64-unknown-linux-gnu\" --arg asset \"velnor-actions-0.1.1-x86_64-unknown-linux-gnu\" --arg sha256 \"$digest\" --arg rust '1.98.1' --arg mr_boxington '1.21.1' '.schema == 1 and .version == $version and .repository == $repository and .commit == $commit and .target == $target and .asset == $asset and .sha256 == $sha256 and .toolchain.rust == $rust and .toolchain[\"mr-boxington\"] == $mr_boxington' linux-assets/velnor-actions-0.1.1-x86_64-unknown-linux-gnu.provenance.json > /dev/null"
    - name: Download aarch64-apple-darwin candidate assets
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: ${{ inputs.macos_arm64_artifact_id }}
        path: macos-assets
    - name: Prevalidate and extract uploaded candidate archive
      shell: bash
      run: "set -eu\nbash scripts/with-owned-archive-guard.sh -- python3 scripts/generator-release/extract-candidate.py 'macos-assets/generator-macos-assets.tar' 'macos-assets' 'velnor-actions-0.1.1-aarch64-apple-darwin' 'velnor-actions-0.1.1-aarch64-apple-darwin.sha256' 'velnor-actions-0.1.1-aarch64-apple-darwin.provenance.json'"
    - name: Verify extracted candidate file types and executable mode
      shell: bash
      run: "set -eu\ntest -f macos-assets/velnor-actions-0.1.1-aarch64-apple-darwin\ntest ! -L macos-assets/velnor-actions-0.1.1-aarch64-apple-darwin\ntest -x macos-assets/velnor-actions-0.1.1-aarch64-apple-darwin\ntest -f macos-assets/velnor-actions-0.1.1-aarch64-apple-darwin.sha256\ntest ! -L macos-assets/velnor-actions-0.1.1-aarch64-apple-darwin.sha256\ntest ! -x macos-assets/velnor-actions-0.1.1-aarch64-apple-darwin.sha256\ntest -f macos-assets/velnor-actions-0.1.1-aarch64-apple-darwin.provenance.json\ntest ! -L macos-assets/velnor-actions-0.1.1-aarch64-apple-darwin.provenance.json\ntest ! -x macos-assets/velnor-actions-0.1.1-aarch64-apple-darwin.provenance.json"
    - name: Verify source-bound candidate provenance
      shell: bash
      run: "set -eu\ndigest=\"$(awk -v expected='velnor-actions-0.1.1-aarch64-apple-darwin' 'NR == 1 { if (NF != 2 || length($1) != 64 || $1 !~ /^[0-9a-f]+$/ || $2 != expected) exit 1; print $1; next } { exit 1 } END { if (NR != 1) exit 1 }' 'macos-assets/velnor-actions-0.1.1-aarch64-apple-darwin.sha256')\"\njq -e --arg version \"0.1.1\" --arg repository \"$GITHUB_REPOSITORY\" --arg commit \"$GITHUB_SHA\" --arg target \"aarch64-apple-darwin\" --arg asset \"velnor-actions-0.1.1-aarch64-apple-darwin\" --arg sha256 \"$digest\" --arg rust '1.98.1' --arg mr_boxington '1.21.1' '.schema == 1 and .version == $version and .repository == $repository and .commit == $commit and .target == $target and .asset == $asset and .sha256 == $sha256 and .toolchain.rust == $rust and .toolchain[\"mr-boxington\"] == $mr_boxington' macos-assets/velnor-actions-0.1.1-aarch64-apple-darwin.provenance.json > /dev/null"
    - name: Download x86_64-apple-darwin candidate assets
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: ${{ inputs.macos_x86_64_artifact_id }}
        path: macos-intel-assets
    - name: Prevalidate and extract uploaded candidate archive
      shell: bash
      run: "set -eu\nbash scripts/with-owned-archive-guard.sh -- python3 scripts/generator-release/extract-candidate.py 'macos-intel-assets/generator-macos-intel-assets.tar' 'macos-intel-assets' 'velnor-actions-0.1.1-x86_64-apple-darwin' 'velnor-actions-0.1.1-x86_64-apple-darwin.sha256' 'velnor-actions-0.1.1-x86_64-apple-darwin.provenance.json'"
    - name: Verify extracted candidate file types and executable mode
      shell: bash
      run: "set -eu\ntest -f macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin\ntest ! -L macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin\ntest -x macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin\ntest -f macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin.sha256\ntest ! -L macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin.sha256\ntest ! -x macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin.sha256\ntest -f macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin.provenance.json\ntest ! -L macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin.provenance.json\ntest ! -x macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin.provenance.json"
    - name: Verify source-bound candidate provenance
      shell: bash
      run: "set -eu\ndigest=\"$(awk -v expected='velnor-actions-0.1.1-x86_64-apple-darwin' 'NR == 1 { if (NF != 2 || length($1) != 64 || $1 !~ /^[0-9a-f]+$/ || $2 != expected) exit 1; print $1; next } { exit 1 } END { if (NR != 1) exit 1 }' 'macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin.sha256')\"\njq -e --arg version \"0.1.1\" --arg repository \"$GITHUB_REPOSITORY\" --arg commit \"$GITHUB_SHA\" --arg target \"x86_64-apple-darwin\" --arg asset \"velnor-actions-0.1.1-x86_64-apple-darwin\" --arg sha256 \"$digest\" --arg rust '1.98.1' --arg mr_boxington '1.21.1' '.schema == 1 and .version == $version and .repository == $repository and .commit == $commit and .target == $target and .asset == $asset and .sha256 == $sha256 and .toolchain.rust == $rust and .toolchain[\"mr-boxington\"] == $mr_boxington' macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin.provenance.json > /dev/null"
    - name: Download exact canonical candidate manifest
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: ${{ inputs.manifest_artifact_id }}
        path: manifest-assets
    - name: Verify canonical candidate manifest digest
      env:
        VELNOR_RELEASE_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      shell: bash
      run: "set -eu\nexpected=\"$VELNOR_RELEASE_MANIFEST_SHA256\"\nactual=\"$(sha256sum 'manifest-assets/release-manifest.json' | awk 'NR == 1 { print $1; next } { exit 1 } END { if (NR != 1) exit 1 }')\"\ntest \"${#expected}\" -eq 64\ntest \"$actual\" = \"$expected\""
    - name: Rebuild and compare the canonical candidate manifest
      shell: bash
      run: "bash scripts/generator-release/create-release-manifest.sh '0.1.1' 'tailrocks/velnor-new' '1.98.1' '1.21.1'\ncmp release-manifest.json manifest-assets/release-manifest.json"
    - name: Attest built artifacts
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-path: manifest-assets/release-manifest.json
    - name: Fetch and verify manifest attestation bundle
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: "gh() { mise --no-config --no-env --no-hooks exec gh@2.102.0 -- gh \"$@\"; }\nexport -f gh\nset -eu\ntest \"$GITHUB_WORKFLOW_SHA\" = \"$GITHUB_SHA\"\nmkdir -p release-attestations\ntest \"$GITHUB_WORKFLOW_SHA\" = \"$GITHUB_SHA\"\nsubject='manifest-assets/release-manifest.json'\ndigest=\"$(if command -v sha256sum >/dev/null 2>&1; then\n  sha256sum \"$subject\" | awk 'NR == 1 { print $1; next } { exit 1 } END { if (NR != 1) exit 1 }'\nelif command -v shasum >/dev/null 2>&1; then\n  shasum -a 256 \"$subject\" | awk 'NR == 1 { print $1; next } { exit 1 } END { if (NR != 1) exit 1 }'\nelse\n  echo 'no SHA-256 utility is available' >&2\n  exit 1\nfi)\"\ntest \"${#digest}\" -eq 64\ncase \"$digest\" in *[!0123456789abcdef]*|'') exit 1 ;; esac\nbundle=\"sha256:${digest}.jsonl\"\ntest ! -e \"$bundle\"\ndownloaded=false\nfor attempt in 1 2 3 4 5; do\n  if gh attestation download \"$subject\" --repo \"$GITHUB_REPOSITORY\" --predicate-type https://slsa.dev/provenance/v1 --limit 10 && test -s \"$bundle\"; then downloaded=true; break; fi\n  if test \"$attempt\" -lt 5; then sleep 3; fi\ndone\ntest \"$downloaded\" = true\ngh attestation verify \"$subject\" --repo \"$GITHUB_REPOSITORY\" --bundle \"$bundle\" --source-digest \"$GITHUB_SHA\" --source-ref refs/heads/main --signer-workflow \"${GITHUB_REPOSITORY}/.github/workflows/generator-release.yml\" --signer-digest \"$GITHUB_SHA\" > /dev/null\nmv \"$bundle\" \"release-attestations/release-manifest.json.intoto.jsonl\""
    - name: Upload verified manifest attestation bundle
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        if-no-files-found: error
        name: generator-release-manifest-attestations
        path: release-attestations/release-manifest.json.intoto.jsonl
        retention-days: 1
