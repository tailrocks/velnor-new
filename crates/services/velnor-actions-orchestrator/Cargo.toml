[package]
name = "velnor-actions-orchestrator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[dependencies]
flate2 = { workspace = true }
lzma-rust2 = { workspace = true }
tar = { workspace = true }
zip = { workspace = true }
velnor-actions-actionlint = { version = "=0.1.1", path = "../../adapters/velnor-actions-actionlint" }
velnor-actions-contract = { version = "=0.1.1", path = "../../core/velnor-actions-contract" }
velnor-actions-contract-config = { version = "=0.1.1", path = "../../core/velnor-actions-contract-config" }
velnor-actions-contract-planning = { version = "=0.1.1", path = "../../core/velnor-actions-contract-planning" }
velnor-actions-contract-release = { version = "=0.1.1", path = "../../core/velnor-actions-contract-release" }
velnor-actions-contract-workflow = { version = "=0.1.1", path = "../../core/velnor-actions-contract-workflow" }
velnor-actions-mise = { version = "=0.1.1", path = "../../adapters/velnor-actions-mise" }
velnor-actions-rust = { version = "=0.1.1", path = "../../adapters/velnor-actions-rust" }
velnor-actions-rust-core = { version = "=0.1.1", path = "../../adapters/velnor-actions-rust-core" }
velnor-actions-tofu = { version = "=0.1.1", path = "../../adapters/velnor-actions-tofu" }
velnor-actions-tofu-core = { version = "=0.1.1", path = "../../adapters/velnor-actions-tofu-core" }
velnor-actions-workflow-cache = { version = "=0.1.1", path = "../velnor-actions-workflow-cache" }
velnor-actions-workflow-release = { version = "=0.1.1", path = "../velnor-actions-workflow-release" }
velnor-actions-workflow-renderer = { version = "=0.1.1", path = "../velnor-actions-workflow-renderer" }
velnor-actions-workflow-steps = { version = "=0.1.1", path = "../velnor-actions-workflow-steps" }
velnor-actions-workflow-tree = { version = "=0.1.1", path = "../velnor-actions-workflow-tree" }
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true, features = ["alloc", "oid"] }
tempfile = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true

[[test]]
name = "velnor_orchestrator"
path = "tests/main.rs"

[[test]]
name = "validation_failure"
path = "tests/validation_failure.rs"

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
velnor-actions-contract = { version = "=0.1.1", path = "../../core/velnor-actions-contract" }
