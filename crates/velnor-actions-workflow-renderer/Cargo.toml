[package]
name = "velnor-actions-workflow-renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[lib]
test = false

[features]
test-render-capture = []

[dependencies]
serde = { workspace = true }
sha2 = { workspace = true }
toml = { version = "=1.1.8" }
rustix = { version = "=1.1.5", features = ["fs"] }
velnor-actions-actionlint = { version = "=0.1.57", path = "../velnor-actions-actionlint" }
velnor-actions-contract = { version = "=0.1.57", path = "../velnor-actions-contract" }
velnor-actions-mise = { version = "=0.1.57", path = "../velnor-actions-mise" }
velnor-actions-tofu = { version = "=0.1.57", path = "../velnor-actions-tofu" }

[dev-dependencies]
tempfile = { version = "=3.27.0" }
velnor-actions-mise = { version = "=0.1.57", path = "../velnor-actions-mise" }

[lints]
workspace = true

