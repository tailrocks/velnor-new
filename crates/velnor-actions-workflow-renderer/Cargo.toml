[package]
name = "velnor-actions-workflow-renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[lib]
doctest = false
test = false

[features]
test-render-capture = []

[dependencies]
base64 = { workspace = true }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
semver = { version = "=1.0.28" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = { version = "=1.1.8" }
rustix = { version = "=1.1.5", features = ["fs"] }
velnor-actions-actionlint = { version = "=0.1.78", path = "../velnor-actions-actionlint" }
velnor-actions-bun = { version = "=0.1.78", path = "../velnor-actions-bun" }
velnor-actions-dbt = { version = "=0.1.78", path = "../velnor-actions-dbt" }
velnor-actions-contract = { version = "=0.1.78", path = "../velnor-actions-contract" }
velnor-actions-mise = { version = "=0.1.78", path = "../velnor-actions-mise" }
velnor-actions-rust = { version = "=0.1.78", path = "../velnor-actions-rust" }
velnor-actions-tofu = { version = "=0.1.78", path = "../velnor-actions-tofu" }

[dev-dependencies]
serde-saphyr = "=2.1.0"
tempfile = { version = "=3.27.0" }
velnor-actions-mise = { version = "=0.1.78", path = "../velnor-actions-mise" }

[[test]]
name = "velnor_workflow_renderer"
path = "tests/velnor_workflow_renderer.rs"

[[test]]
name = "generator_release_prepare_public"
path = "tests/generator_release_prepare_public.rs"

[[test]]
name = "product_release_binary_public"
path = "tests/product_release_binary_public.rs"

[[test]]
name = "prune_tools"
path = "tests/prune_tools.rs"

[[test]]
name = "mbx_stats"
path = "tests/mbx_stats.rs"

[[test]]
name = "prune_state"
path = "tests/prune_state.rs"

[[test]]
name = "rust_tree_digest_pin"
path = "tests/rust_tree_digest_pin.rs"

[lints]
workspace = true


[[test]]
name = "crate_release_version_public"
path = "tests/crate_release_version_public.rs"

[[test]]
name = "source_preview_bootstrap_public"
path = "tests/source_preview_bootstrap_public.rs"

[[test]]
name = "source_preview_crypto_public"
path = "tests/source_preview_crypto_public.rs"

[[test]]
name = "source_preview_exec_public"
path = "tests/source_preview_exec_public.rs"

[[test]]
name = "source_preview_loader_public"
path = "tests/source_preview_loader_public.rs"

[[test]]
name = "cargo_source_handoff_public"
path = "tests/cargo_source_handoff_public.rs"

[[test]]
name = "premerge_event_proof_public"
path = "tests/premerge_event_proof_public.rs"
[[test]]
