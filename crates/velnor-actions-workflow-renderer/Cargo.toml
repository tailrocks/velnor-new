[package]
name = "velnor-actions-workflow-renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[lib]
test = false

[features]
test-render-capture = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = { version = "=1.1.8" }
rustix = { version = "=1.1.5", features = ["fs"] }
velnor-actions-actionlint = { version = "=0.1.67", path = "../velnor-actions-actionlint" }
velnor-actions-bun = { version = "=0.1.67", path = "../velnor-actions-bun" }
velnor-actions-dbt = { version = "=0.1.67", path = "../velnor-actions-dbt" }
velnor-actions-contract = { version = "=0.1.67", path = "../velnor-actions-contract" }
velnor-actions-mise = { version = "=0.1.67", path = "../velnor-actions-mise" }
velnor-actions-rust = { version = "=0.1.67", path = "../velnor-actions-rust" }
velnor-actions-tofu = { version = "=0.1.67", path = "../velnor-actions-tofu" }

[dev-dependencies]
tempfile = { version = "=3.27.0" }
velnor-actions-mise = { version = "=0.1.67", path = "../velnor-actions-mise" }

[[test]]
name = "velnor_workflow_renderer"
path = "tests/velnor_workflow_renderer.rs"

[[test]]
name = "generator_release_prepare_public"
path = "tests/generator_release_prepare_public.rs"

[[test]]
name = "product_release_binary_public"
path = "tests/product_release_binary_public.rs"

[lints]
workspace = true

