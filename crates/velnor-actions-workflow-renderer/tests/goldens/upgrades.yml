        run: "# Upgrade patch filter, shared by every upgrades.yml job that builds, checks\n# or applies the patch. It validates the patch itself and the index the patch\n# produces; it never relies on `git apply` rejecting anything.\n#\n# Rules: only upgrade-owned paths; no rename or copy; every file is a regular\n# non-executable file (mode 100644), so no symlink, gitlink or mode change;\n# only generated `.github/**` files may be deleted; no binary change\n# (`velnor_upgrade_binary_allowed` names none).\nvelnor_upgrade_path_owned() {\n  case \"$1\" in\n    mise.toml|.mise.toml|mise.lock|.mise.lock|.velnor/release-manifest.json|.github/*) return 0 ;;\n    rust-toolchain.toml|*/rust-toolchain.toml|rust-toolchain|*/rust-toolchain) return 0 ;;\n    Cargo.toml|Cargo.lock|*/Cargo.toml|*/Cargo.lock) return 0 ;;\n    package.json|bun.lock|*/package.json|*/bun.lock) return 0 ;;\n    gradle/libs.versions.toml|*/gradle/libs.versions.toml|gradle.lockfile|*/gradle.lockfile) return 0 ;;\n    gradle/verification-metadata.xml|*/gradle/verification-metadata.xml) return 0 ;;\n  esac\n  return 1\n}\nvelnor_upgrade_deletable() { case \"$1\" in .github/*) return 0 ;; esac; return 1; }\nvelnor_upgrade_binary_allowed() { return 1; }\n# Plain relative path: no empty, `.` or `..` segment, no `.git` segment in\n# any case, and only portable characters.\nvelnor_upgrade_path_sane() {\n  case \"$1\" in ''|/*|*/|*//*|*[!A-Za-z0-9._/@+-]*) return 1 ;; esac\n  case \"/$1/\" in */./*|*/../*) return 1 ;; esac\n  case \"/$(printf '%s' \"$1\" | LC_ALL=C tr '[:upper:]' '[:lower:]')/\" in */.git/*) return 1 ;; esac\n  return 0\n}\nvelnor_upgrade_reject() { printf '::error::%s: %s\\n' \"$1\" \"$2\"; return 1; }\n\n# Check one patch file's text: headers, file count and per-file paths.\nvelnor_upgrade_check_patch() {\n  local patch=$1 headers files line rec added rest path\n  local numstat=$patch.numstat\n  test -s \"$patch\" || { velnor_upgrade_reject upgrade_patch_malformed \"empty patch\"; return 1; }\n  if LC_ALL=C grep -q \"$(printf '\\r')\" \"$patch\"; then velnor_upgrade_reject upgrade_patch_malformed \"carriage return\"; return 1; fi\n  # Header lines never start with a hunk prefix, so an anchored match sees\n  # exactly what `git apply` parses as a header.\n  line=$(LC_ALL=C grep -n -m 1 -E '^(rename|copy) (from|to) |^(dis)?similarity index ' \"$patch\" || true)\n  [ -z \"$line\" ] || { velnor_upgrade_reject upgrade_patch_rename_rejected \"$line\"; return 1; }\n  line=$(LC_ALL=C grep -n -m 1 -E '^GIT binary patch|^Binary files |^(literal|delta) [0-9]' \"$patch\" || true)\n  [ -z \"$line\" ] || { velnor_upgrade_reject upgrade_patch_binary_rejected \"$line\"; return 1; }\n  line=$(LC_ALL=C grep -n -m 1 -E '^(old|new) mode ' \"$patch\" || true)\n  [ -z \"$line\" ] || { velnor_upgrade_reject upgrade_patch_mode_rejected \"$line\"; return 1; }\n  line=$(LC_ALL=C awk '/^(new|deleted) file mode / && $NF != \"100644\" { print NR \": \" $0; exit }' \"$patch\")\n  case \"$line\" in\n    '') ;;\n    *' 120000') velnor_upgrade_reject upgrade_patch_symlink_rejected \"$line\"; return 1 ;;\n    *) velnor_upgrade_reject upgrade_patch_mode_rejected \"$line\"; return 1 ;;\n  esac\n  line=$(LC_ALL=C awk '/^index [0-9a-f]+[.][.][0-9a-f]+ / && $3 != \"100644\" { print NR \": \" $0; exit }' \"$patch\")\n  case \"$line\" in\n    '') ;;\n    *' 120000') velnor_upgrade_reject upgrade_patch_symlink_rejected \"$line\"; return 1 ;;\n    *) velnor_upgrade_reject upgrade_patch_mode_rejected \"$line\"; return 1 ;;\n  esac\n  # Every file patch is a `diff --git` section: a traditional patch section\n  # would appear in the numstat without a matching header.\n  headers=$(LC_ALL=C grep -c '^diff --git ' \"$patch\" || true)\n  git apply --numstat -z \"$patch\" > \"$numstat\" || { velnor_upgrade_reject upgrade_patch_malformed \"git apply --numstat failed\"; return 1; }\n  files=0\n  while IFS= read -r -d '' rec; do\n    files=$((files + 1))\n    added=${rec%%$'\\t'*}\n    rest=${rec#*$'\\t'}\n    path=${rest#*$'\\t'}\n    if [ -z \"$path\" ]; then velnor_upgrade_reject upgrade_patch_rename_rejected \"file $files\"; return 1; fi\n    velnor_upgrade_path_sane \"$path\" || { velnor_upgrade_reject upgrade_patch_path_rejected \"$path\"; return 1; }\n    velnor_upgrade_path_owned \"$path\" || { velnor_upgrade_reject upgrade_patch_path_rejected \"$path\"; return 1; }\n    if [ \"$added\" = - ] && ! velnor_upgrade_binary_allowed \"$path\"; then velnor_upgrade_reject upgrade_patch_binary_rejected \"$path\"; return 1; fi\n  done < \"$numstat\"\n  [ \"$files\" -gt 0 ] && [ \"$files\" = \"$headers\" ] || { velnor_upgrade_reject upgrade_patch_malformed \"$files file patches, $headers git headers\"; return 1; }\n}\n\n# Check what the index holds against HEAD, entry by entry, with rename\n# detection off so a move shows as its deletion plus its addition.\n# `velnor_upgrade_check_index strict` fails on the first violation;\n# `velnor_upgrade_check_index drop` unstages it and prints `<code> <path>`.\nvelnor_upgrade_check_index() {\n  local mode=$1 meta path old new status code rec added rest\n  local raw numstat\n  raw=$(mktemp) numstat=$(mktemp)\n  if ! git diff --cached --raw -z --no-renames --no-ext-diff HEAD -- > \"$raw\" \\\n    || ! git diff --cached --numstat -z --no-renames --no-ext-diff HEAD -- > \"$numstat\"; then\n    velnor_upgrade_reject upgrade_patch_malformed \"git diff --cached failed\"; return 1\n  fi\n  while IFS= read -r -d '' meta && IFS= read -r -d '' path; do\n    old=${meta#:}; old=${old%% *}\n    new=${meta#:* }; new=${new%% *}\n    status=${meta##* }\n    code=\n    if ! velnor_upgrade_path_sane \"$path\" || ! velnor_upgrade_path_owned \"$path\"; then code=upgrade_patch_path_rejected\n    else\n      case \"$status:$old:$new\" in\n        M:100644:100644|A:000000:100644) ;;\n        D:100644:000000) velnor_upgrade_deletable \"$path\" || code=upgrade_patch_delete_rejected ;;\n        A:000000:120000|M:*:120000|T:*:120000) code=upgrade_patch_symlink_rejected ;;\n        D:*) code=upgrade_patch_delete_rejected ;;\n        *) code=upgrade_patch_mode_rejected ;;\n      esac\n    fi\n    if [ -n \"$code\" ]; then\n      if [ \"$mode\" = strict ]; then velnor_upgrade_reject \"$code\" \"$path\"; return 1; fi\n      git reset --quiet -- \"$path\" || return 1\n      printf '%s %s\\n' \"$code\" \"$path\"\n    fi\n  done < \"$raw\"\n  while IFS= read -r -d '' rec; do\n    added=${rec%%$'\\t'*}\n    rest=${rec#*$'\\t'}\n    path=${rest#*$'\\t'}\n    if [ \"$added\" = - ] && ! velnor_upgrade_binary_allowed \"$path\"; then\n      if [ \"$mode\" = strict ]; then velnor_upgrade_reject upgrade_patch_binary_rejected \"$path\"; return 1; fi\n      git reset --quiet -- \"$path\" || return 1\n      printf '%s %s\\n' upgrade_patch_binary_rejected \"$path\"\n    fi\n  done < \"$numstat\"\n  rm -f \"$raw\" \"$numstat\"\n}\n\n# Check a patch against HEAD in a scratch index, never the worktree, so a\n# rejected patch writes nothing: text first, then the index it would produce.\nvelnor_upgrade_check_patch_applies() {\n  local patch=$1 index=$2\n  velnor_upgrade_check_patch \"$patch\" || return 1\n  rm -f \"$index\"\n  (\n    export GIT_INDEX_FILE=$index\n    git read-tree HEAD || exit 1\n    git -c core.hooksPath=/dev/null apply --cached \"$patch\" \\\n      || { velnor_upgrade_reject upgrade_patch_malformed \"git apply --cached failed\"; exit 1; }\n    velnor_upgrade_check_index strict\n  )\n}\n\n# What `velnor-actions generate` needs before it runs, shared by prepare and\n# verify: the Velnor-pinned validators it executes (`VELNOR_GENERATE_TOOLS`),\n# the project Rust for its offline `cargo metadata`, and every tracked Cargo\n# workspace's sources. Installs are fresh (this workflow restores no tool\n# cache) and run outside the project configuration (`--no-config`); the\n# Rust is verified file by file (`VELNOR_VERIFY_RUST_SCRIPT`) before use.\nvelnor_generate_prerequisites() {\n  local roots rust root\n  # shellcheck disable=SC2086 # one exact tool spec per word\n  mise --no-config --no-env --no-hooks install $VELNOR_GENERATE_TOOLS || return 1\n  roots=$(git ls-files -- Cargo.lock '*/Cargo.lock' | xargs -r -n1 dirname | sort -u)\n  [ -n \"$roots\" ] || return 0\n  mise trust --yes . >/dev/null || return 1\n  rust=$(mise ls --local --json | jq -r '(.rust // .[\"core:rust\"] // [])[0].requested_version // empty') || return 1\n  case \"$rust\" in\n    *[!0-9.]*|'') printf '::error::upgrade_regenerate_rust_unknown: no exact Rust pin (%s)\\n' \"$rust\"; return 1 ;;\n  esac\n  mise --no-config --no-env --no-hooks install \"rust@$rust\" || return 1\n  # Nothing runs the fresh toolchain before it matches its pinned tarballs.\n  VELNOR_TOOL_RUST=$rust sh -c \"$VELNOR_VERIFY_RUST_SCRIPT\" || return 1\n  for root in $roots; do\n    mise --no-config --no-env --no-hooks exec \"rust@$rust\" -- cargo fetch --locked --manifest-path \"$root/Cargo.toml\" || return 1\n  done\n}\n\nset -euo pipefail\n: \"${VELNOR_UPGRADE_DIR:?}\" \"${GITHUB_OUTPUT:?}\"\ndir=$VELNOR_UPGRADE_DIR\nrm -rf \"$dir/out\"\nmkdir -p \"$dir/out\"\nprintf '%s\\n' \"$VELNOR_CATALOG_BUMPER_SOURCE\" > \"$dir/bump-gradle-catalog.py\"\nsummary=$dir/out/summary.md\nfailures=$dir/failures.md\n: > \"$dir/changes.md\"\n: > \"$failures\"\nchanged() { printf -- '- %s\\n' \"$1\" >> \"$dir/changes.md\"; printf 'velnor: %s\\n' \"$1\"; }\nfailed() { printf -- '- %s\\n' \"$1\" >> \"$failures\"; printf '::warning::%s\\n' \"$1\"; }\nnewer() { [ \"$1\" != \"$2\" ] && [ \"$(printf '%s\\n%s\\n' \"$1\" \"$2\" | sort -V | tail -n 1)\" = \"$2\" ]; }\n\n# 1. Velnor itself: the newest stable release, verified (digest and build\n# provenance) by the previous step before any repository code ran. The patch\n# may select only that release, and verify regenerates with it.\nmanifest=.velnor/release-manifest.json\nverified=$dir/velnor/release-manifest.json\ncurrent_velnor=$(jq -r .version \"$manifest\")\nlatest_velnor=$(jq -r .version \"$verified\")\nif newer \"$latest_velnor\" \"$current_velnor\"; then\n  echo \"::error::upgrade_velnor_pinned_ahead: $manifest pins velnor-actions $current_velnor, newer than the latest stable release $latest_velnor\"\n  exit 1\nfi\nif ! cmp -s \"$verified\" \"$manifest\"; then\n  cp \"$verified\" \"$manifest\"\n  changed \"velnor-actions $current_velnor -> $latest_velnor\"\nfi\nversion=$latest_velnor\n\n# 2. Mise tools other than Rust, then Rust (kept separate so a Rust release\n# the new Velnor catalog does not know yet can be rolled back alone).\nmise_files=$(git ls-files -- mise.toml .mise.toml mise.lock .mise.lock)\n# rust-toolchain files mirror the Mise Rust version (owner layout); they move\n# with it and roll back with it.\ntoolchain_files=$(git ls-files -- rust-toolchain.toml '*/rust-toolchain.toml' rust-toolchain '*/rust-toolchain')\nrust_files=\"$mise_files $toolchain_files\"\n# Portable in-place rewrite (no GNU `sed -i`) of the toolchain `channel`,\n# in either TOML string quoting; it fails unless the file then names the new\n# Rust, so an unrecognised layout rolls the Rust scope back.\nset_channel() {\n  sed -E -e \"s/^([[:space:]]*channel[[:space:]]*=[[:space:]]*\\\")[0-9]+[.][0-9]+[.][0-9]+(\\\")/\\1$new_rust\\2/\" \\\n    -e \"s/^([[:space:]]*channel[[:space:]]*=[[:space:]]*')[0-9]+[.][0-9]+[.][0-9]+(')/\\1$new_rust\\2/\" \"$1\" > \"$1.velnor-next\" \\\n    && mv \"$1.velnor-next\" \"$1\" \\\n    && grep -Eq \"^[[:space:]]*channel[[:space:]]*=[[:space:]]*[\\\"']${new_rust}[\\\"']\" \"$1\"\n}\nmirror_rust() {\n  new_rust=$(mise ls --local --json | jq -r '(.rust // .[\"core:rust\"] // [])[0].requested_version // empty')\n  [ -n \"$new_rust\" ] || return 0\n  for file in $toolchain_files; do\n    case \"$file\" in\n      *.toml) set_channel \"$file\" || return 1 ;;\n      *)\n        if grep -q '^[[:space:]]*\\[' \"$file\"; then\n          set_channel \"$file\" || return 1\n        else\n          printf '%s\\n' \"$new_rust\" > \"$file\"\n        fi\n        ;;\n    esac\n  done\n}\nlock_mise() {\n  if git ls-files --error-unmatch mise.lock >/dev/null 2>&1; then\n    mise lock --platform linux-x64,linux-arm64,macos-arm64\n  fi\n}\nif [ -n \"$mise_files\" ]; then\n  mise trust --yes . >/dev/null\n  before=$(mise ls --local --json)\n  tools=$(printf '%s' \"$before\" | jq -r 'keys[] | select(. != \"rust\" and . != \"core:rust\")')\n  if [ -n \"$tools\" ]; then\n    # shellcheck disable=SC2086 # one tool name per word\n    if mise upgrade --bump $tools && lock_mise; then :; else failed \"mise upgrade --bump failed for: $(printf '%s' \"$tools\" | tr '\\n' ' ')\"; git checkout -- $mise_files; fi\n  fi\n  mkdir -p \"$dir/pre-rust\"\n  for file in $rust_files; do mkdir -p \"$dir/pre-rust/$(dirname \"$file\")\"; cp \"$file\" \"$dir/pre-rust/$file\"; done\n  if printf '%s' \"$before\" | jq -e 'has(\"rust\") or has(\"core:rust\")' >/dev/null; then\n    if mise upgrade --bump rust && lock_mise && mirror_rust; then :; else failed \"mise upgrade --bump rust failed\"; for file in $rust_files; do cp \"$dir/pre-rust/$file\" \"$file\"; done; fi\n  fi\n  after=$(mise ls --local --json)\n  printf '%s\\n%s\\n' \"$before\" \"$after\" | jq -rs '\n    (.[0] | map_values(.[0].requested_version // .[0].version)) as $old\n    | (.[1] | map_values(.[0].requested_version // .[0].version)) as $new\n    | $new | to_entries[] | select($old[.key] != .value)\n    | \"\\(.key) \\($old[.key] // \"new\") -> \\(.value)\"' | while IFS= read -r line; do changed \"$line\"; done\nfi\n\n# 3. Cargo: every tracked lockfile, incompatible and pinned requirements too.\ncargo_roots=$(git ls-files -- Cargo.lock '*/Cargo.lock' | xargs -r -n1 dirname | sort -u)\nif [ -n \"$cargo_roots\" ]; then\n  mise install \"cargo:cargo-edit@$VELNOR_CARGO_EDIT_VERSION\" >/dev/null\n  for root in $cargo_roots; do\n    manifest_path=\"$root/Cargo.toml\"\n    cp \"$root/Cargo.lock\" \"$dir/Cargo.lock.before\"\n    if mise exec \"cargo:cargo-edit@$VELNOR_CARGO_EDIT_VERSION\" -- cargo upgrade --incompatible --pinned --manifest-path \"$manifest_path\" \\\n      && mise exec -- cargo update --manifest-path \"$manifest_path\" \\\n      && mise exec -- cargo metadata --locked --format-version 1 --manifest-path \"$manifest_path\" >/dev/null; then\n      if ! cmp -s \"$dir/Cargo.lock.before\" \"$root/Cargo.lock\"; then changed \"Cargo dependencies in $root\"; fi\n    else\n      failed \"Cargo upgrade in $root failed (private git sources need the fetch credential; resolve by hand)\"\n      git diff --name-only -- \"$root\" | { grep -E '(^|/)Cargo[.](toml|lock)$' || true; } | xargs -r git checkout --\n    fi\n  done\nfi\n\n# 4. npm through Bun: every tracked bun.lock, lifecycle scripts off.\nfor root in $(git ls-files -- bun.lock '*/bun.lock' | xargs -r -n1 dirname | sort -u); do\n  if (cd \"$root\" && mise exec -- bun update --latest --ignore-scripts); then\n    if ! git diff --quiet -- \"$root/package.json\" \"$root/bun.lock\"; then changed \"npm dependencies in $root\"; fi\n  else\n    failed \"bun update --latest in $root failed (private npm scopes need the registry credential; resolve by hand)\"\n    git checkout -- \"$root/package.json\" \"$root/bun.lock\"\n  fi\ndone\n\n# 5. Gradle version catalogs: [versions] entries referenced by libraries and\n# plugins move to the newest stable release on Maven Central or the Gradle\n# Plugin Portal; then the build refreshes its locks and verification data.\nfor catalog in $(git ls-files -- 'gradle/libs.versions.toml' '*/gradle/libs.versions.toml'); do\n  if python3 -I \"$dir/bump-gradle-catalog.py\" \"$catalog\" >> \"$dir/changes.md\"; then :; else\n    failed \"Gradle catalog $catalog could not be bumped\"; git checkout -- \"$catalog\"; continue\n  fi\n  root=$(dirname \"$(dirname \"$catalog\")\")\n  if git diff --quiet -- \"$catalog\"; then continue; fi\n  if [ -x \"$root/gradlew\" ]; then\n    (cd \"$root\" && ./gradlew --no-daemon --quiet --write-locks --write-verification-metadata sha256 dependencies) \\\n      || failed \"Gradle lock and verification refresh in $root failed; run it by hand\"\n  fi\ndone\n\n# 6. Regenerate .github/ (and every generated file) with the selected Velnor.\ngenerate() { velnor_generate_prerequisites > \"$dir/generate.log\" 2>&1 && \"$dir/velnor/bin/velnor-actions\" generate >> \"$dir/generate.log\" 2>&1; }\nrust_bumped() {\n  [ -d \"$dir/pre-rust\" ] || return 1\n  for file in $rust_files; do cmp -s \"$dir/pre-rust/$file\" \"$file\" || return 0; done\n  return 1\n}\nif ! generate; then\n  if rust_bumped; then\n    # Whatever made regeneration fail after the Rust bump, the Rust scope\n    # rolls back alone and the rest of the upgrade still ships.\n    reason=$(grep -m 1 'velnor-actions:' \"$dir/generate.log\" | cut -c1-240 || true)\n    for file in $rust_files; do cp \"$dir/pre-rust/$file\" \"$file\"; done\n    if grep -q 'rust_channel_manifest_not_catalogued' \"$dir/generate.log\"; then\n      failed \"the newest Rust is not in velnor-actions $version's channel-manifest catalog yet; Rust stays pinned until a Velnor release adds it\"\n    else\n      failed \"regenerating with the Rust bump failed (${reason:-see the job log}); Rust stays pinned\"\n    fi\n    generate || { cat \"$dir/generate.log\"; failed \"velnor-actions generate failed; .github/ is not regenerated\"; }\n  else\n    cat \"$dir/generate.log\"\n    failed \"velnor-actions generate failed; .github/ is not regenerated\"\n  fi\nfi\n\n# 7. Keep only what the patch filter admits (upgrade-owned regular files,\n# no rename, mode change, symlink, foreign deletion or binary); anything\n# else is unstaged and reported, not shipped.\ngit add -A\nvelnor_upgrade_check_index drop > \"$dir/rejected\"\nwhile read -r code path; do failed \"unexpected change left out of the upgrade ($code): $path\"; done < \"$dir/rejected\"\n{\n  echo \"Velnor upgrades every pin to the latest stable release (no cooldown).\"\n  echo\n  echo \"## Changes\"\n  if [ -s \"$dir/changes.md\" ]; then cat \"$dir/changes.md\"; else echo \"- regenerated files only\"; fi\n  if [ -s \"$failures\" ]; then echo; echo \"## Needs migration\"; cat \"$failures\"; fi\n} > \"$summary\"\n# A scope that failed and rolled back is behind even when nothing else\n# changed: the freshness gate reports it as `upgrade_scope_needs_migration`.\nif [ -s \"$failures\" ]; then\n  delimiter=\"velnor-failures-$(od -An -N8 -tx1 /dev/urandom | tr -d ' \\n')\"\n  {\n    echo \"failed=true\"\n    echo \"failures<<$delimiter\"\n    cat \"$failures\"\n    echo \"$delimiter\"\n  } >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"failed=false\" >> \"$GITHUB_OUTPUT\"\nfi\nif git diff --cached --quiet; then\n  echo \"changed=false\" >> \"$GITHUB_OUTPUT\"\n  cat \"$summary\"\n  exit 0\nfi\ngit diff --cached --no-renames --full-index --no-ext-diff --no-textconv > \"$dir/out/upgrade.patch\"\n# Self-check: publish runs exactly this filter again before it trusts a byte.\nvelnor_upgrade_check_patch_applies \"$dir/out/upgrade.patch\" \"$dir/check.index\" || exit 1\necho \"changed=true\" >> \"$GITHUB_OUTPUT\"\ncat \"$summary\"\n"
      - name: Upload the upgrade patch
        if: steps.bump.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: velnor-upgrade
          path: ${{ runner.temp }}/velnor-upgrades/out
          retention-days: "3"
          if-no-files-found: error
  verify:
    name: Verify the upgrade patch
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    outputs:
      tree: ${{ steps.verify.outputs.tree }}
      patch_sha256: ${{ steps.verify.outputs.patch_sha256 }}
      workflows: ${{ steps.verify.outputs.workflows }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "1"
          persist-credentials: "false"
      - name: Setup Mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde
        with:
          cache: "false"
          cache_save: "false"
          env: "false"
          install: "false"
          sha256: fe6dd17e68e09682b31d2e7bb7bb755d22636ac1af5d94621e300f2ca9e9fe8a
          version: 2026.10.17
      - name: Resolve project tool versions
        run: "set -eu\n: \"${GITHUB_ENV:?missing GITHUB_ENV}\"\n: \"${RUNNER_TEMP:?missing RUNNER_TEMP}\"\nvelnor_dir=\"$RUNNER_TEMP/velnor-project-tool\"\nvelnor_db=\"$velnor_dir/declared\"\nvelnor_tab=$(printf '\\t')\nvelnor_safe() { printf '%s' \"$1\" | cut -c1-64 | tr -c 'A-Za-z0-9._/@+-' '?'; }\nvelnor_fail() { printf 'velnor: %s\\n' \"$1\" >&2; exit 1; }\nvelnor_mise() { mise --no-config --no-env --no-hooks \"$@\"; }\nrm -rf \"$velnor_dir\"\nmkdir -p \"$velnor_dir\"\n: > \"$velnor_db\"\nvelnor_regular() {\n  if [ -L \"$1\" ] || [ ! -f \"$1\" ]; then velnor_fail \"$1 must be a regular file\"; fi\n}\nvelnor_toml() {\n  cp -- \"$1\" \"$velnor_dir/src.toml\"\n  velnor_mise config get -f \"$velnor_dir/src.toml\" > /dev/null 2>&1 || velnor_fail \"$1 is not valid TOML\"\n}\nvelnor_tools() {\n  velnor_toml \"$1\"\n  if velnor_mise config get -f \"$velnor_dir/src.toml\" tools > \"$velnor_dir/tools\" 2>/dev/null; then\n    awk -v file=\"$1\" '\nfunction unq(s) {\n  if (s ~ /^\"[^\"\\\\]*\"$/ || s ~ /^\\047[^\\047]*\\047$/) { return substr(s, 2, length(s) - 2) }\n  return s\n}\nBEGIN { OFS = \"\\t\"; cur = \"\"; multi = \"\" }\n{\n  line = $0\n  if (multi != \"\") { if (index(line, multi) > 0) { multi = \"\" } next }\n  if (line ~ /^[ \\t]*(#|$)/) { next }\n  if (line ~ /^[ \\t]*\\[/) {\n    hdr = line\n    sub(/^[ \\t]*\\[+[ \\t]*/, \"\", hdr)\n    sub(/[ \\t]*\\]+[ \\t]*$/, \"\", hdr)\n    cur = unq(hdr)\n    if (cur == \"\") { cur = \"?\" }\n    next\n  }\n  eq = index(line, \" = \")\n  if (eq == 0) { next }\n  k = unq(substr(line, 1, eq - 1))\n  v = substr(line, eq + 3)\n  if (v ~ /^\"\"\"/ || v ~ /^\\047\\047\\047/) {\n    d = substr(v, 1, 3)\n    if (index(substr(v, 4), d) == 0) { multi = d }\n    v = d\n  } else {\n    v = unq(v)\n  }\n  if (cur == \"\") { print file, k, v } else if (k == \"version\") { print file, cur, v }\n}' \"$velnor_dir/tools\" >> \"$velnor_db\"\n  fi\n}\nvelnor_tool_versions() {\n  awk -v file=\"$1\" '\nBEGIN { OFS = \"\\t\" }\n{\n  sub(/[ \\t]*#.*$/, \"\")\n  if ($0 ~ /^[ \\t]*$/) { next }\n  line = $0\n  sub(/^[ \\t]+/, \"\", line)\n  k = line\n  sub(/[ \\t].*$/, \"\", k)\n  v = line\n  if (v == k) { v = \"\" } else { sub(/^[^ \\t]+[ \\t]+/, \"\", v); sub(/[ \\t]+$/, \"\", v) }\n  print file, k, v\n}' \"$1\" >> \"$velnor_db\"\n}\nvelnor_toolchain() {\n  if grep -q '^[[:space:]]*\\[' \"$1\"; then\n    velnor_toml \"$1\"\n    if velnor_mise config get -f \"$velnor_dir/src.toml\" toolchain.channel > \"$velnor_dir/channel\" 2>/dev/null; then\n      awk -v file=\"$1\" 'BEGIN { OFS = \"\\t\" } NR == 1 { v = $0; next } { v = v \" \" $0 } END { print file, \"rust\", v }' \"$velnor_dir/channel\" >> \"$velnor_db\"\n    fi\n  else\n    printf '%s\\t%s\\t%s\\n' \"$1\" rust \"$(tr -d ' \\t\\r\\n' < \"$1\")\" >> \"$velnor_db\"\n  fi\n}\nvelnor_exact() {\n  case \"$2\" in\n    ''|*[!0-9.]*|.*|*.|*..*|*.*.*.*|0[0-9]*|*.0[0-9]*) velnor_fail \"$1 must declare one exact X.Y.Z version, not '$(velnor_safe \"$2\")'\" ;;\n    *.*.*) ;;\n    *) velnor_fail \"$1 must declare one exact X.Y.Z version, not '$(velnor_safe \"$2\")'\" ;;\n  esac\n}\nvelnor_tool() {\n  name=$1\n  shift\n  resolved=\n  origin=\n  while IFS=\"$velnor_tab\" read -r file key value; do\n    matched=0\n    for want in \"$@\"; do\n      if [ \"$key\" = \"$want\" ]; then matched=1; fi\n    done\n    if [ \"$matched\" = 0 ]; then continue; fi\n    velnor_exact \"$file $key\" \"$value\"\n    if [ -n \"$resolved\" ] && [ \"$resolved\" != \"$value\" ]; then\n      velnor_fail \"$name: $file $key declares $value, $origin declares $resolved\"\n    fi\n    if [ -z \"$resolved\" ]; then origin=\"$file $key\"; fi\n    resolved=$value\n  done < \"$velnor_db\"\n  [ -n \"$resolved\" ] || velnor_fail \"$name: the project config no longer declares this tool; regenerate the workflow\"\n  printf '%s=%s\\n' \"$name\" \"$resolved\" >> \"$GITHUB_ENV\"\n  if [ \"$name\" = VELNOR_TOOL_RUST ] && [ \"${velnor_export_rustup-0}\" = 1 ]; then\n    printf 'RUSTUP_TOOLCHAIN=%s\\n' \"$resolved\" >> \"$GITHUB_ENV\"\n  fi\n  printf 'velnor: %s=%s\\n' \"$name\" \"$resolved\"\n}\n# shellcheck disable=SC2016 # awk program text: awk, not the shell, expands it\nvelnor_lock_awk='BEGIN { q = \"\\\"\"; e1 = \"[[tools.\" key \"]]\"; e2 = \"[[tools.\" q key q \"]]\"; e3 = \"[tools.\" key \"]\"; e4 = \"[tools.\" q key q \"]\"; s1 = \"[tools.\" key \".\"; s2 = \"[tools.\" q key q \".\"; p1 = s1 q \"platforms.\" platform q \"]\"; p2 = s2 q \"platforms.\" platform q \"]\"; p3 = s1 \"platforms.\" platform \"]\"; p4 = s2 \"platforms.\" platform \"]\"; want = \"version = \" q version q; inline = q \"platforms.\" platform q \" = {\"; state = 0 }\n{ line = $0; sub(/^[ \\t]+/, \"\", line); sub(/[ \\t\\r]+$/, \"\", line) }\nline == \"\" || substr(line, 1, 1) == \"#\" { next }\nsubstr(line, 1, 1) == \"[\" {\n  matched = state == 2 || state == 3 || state == 4; other = state == 1 || state == 5\n  if (line == e1 || line == e2 || line == e3 || line == e4) state = 1\n  else if (line == p1 || line == p2 || line == p3 || line == p4) state = matched ? 3 : (other ? 5 : 0)\n  else if (index(line, s1) == 1 || index(line, s2) == 1) state = matched ? 4 : (other ? 5 : 0)\n  else state = 0\n  next\n}\nstate == 1 && line == want { state = 2; next }\nstate == 3 && (index(line, \"checksum = \") == 1 || index(line, \"url = \") == 1) { print lock \" \" key \" \" line; next }\nstate == 2 && index(line, inline) == 1 {\n  if (match(line, /checksum = \"[^\"]*\"/)) print lock \" \" key \" \" substr(line, RSTART, RLENGTH)\n  if (match(line, /[{ ,]url = \"[^\"]*\"/)) print lock \" \" key \" \" substr(line, RSTART + 1, RLENGTH - 1)\n}'\nvelnor_lock() {\n  name=$1\n  shift\n  case \"${RUNNER_OS-}:${RUNNER_ARCH-}\" in\n    Linux:X64) platform=linux-x64 ;;\n    Linux:ARM64) platform=linux-arm64 ;;\n    macOS:X64) platform=macos-x64 ;;\n    macOS:ARM64) platform=macos-arm64 ;;\n    Windows:X64) platform=windows-x64 ;;\n    Windows:ARM64) platform=windows-arm64 ;;\n    *) velnor_fail \"$name: unsupported runner platform '${RUNNER_OS-}:${RUNNER_ARCH-}'\" ;;\n  esac\n  : > \"$velnor_dir/lock\"\n  for lock in $velnor_locks; do\n    if [ ! -e \"$lock\" ] && [ ! -L \"$lock\" ]; then continue; fi\n    velnor_regular \"$lock\"\n    for key in \"$@\"; do\n      awk -v lock=\"$lock\" -v key=\"$key\" -v version=\"$resolved\" -v platform=\"$platform\" \"$velnor_lock_awk\" \"$lock\" >> \"$velnor_dir/lock\" || velnor_fail \"$lock could not be read\"\n    done\n  done\n  lock_digest=unlocked\n  if [ -s \"$velnor_dir/lock\" ]; then\n    if command -v sha256sum >/dev/null 2>&1; then\n      lock_digest=$(sha256sum < \"$velnor_dir/lock\") || velnor_fail \"$name: lock digest failed\"\n    else\n      lock_digest=$(shasum -a 256 < \"$velnor_dir/lock\") || velnor_fail \"$name: lock digest failed\"\n    fi\n    lock_digest=${lock_digest%% *}\n    case \"$lock_digest\" in\n      *[!0-9a-f]*) velnor_fail \"$name: lock digest is not hexadecimal\" ;;\n    esac\n    [ \"${#lock_digest}\" -eq 64 ] || velnor_fail \"$name: lock digest is not SHA-256\"\n  fi\n  printf '%s=%s\\n' \"$name\" \"$lock_digest\" >> \"$GITHUB_ENV\"\n  printf 'velnor: %s=%s\\n' \"$name\" \"$lock_digest\"\n}\nvelnor_locks='mise.lock .mise.lock'\nfor velnor_file in mise.toml .mise.toml mise.*.toml .mise.*.toml .config/mise.toml .config/mise.*.toml .config/mise/config.toml .config/mise/config.*.toml .config/mise/conf.d/*.toml mise/config.toml mise/config.*.toml .mise/config.toml .mise/config.*.toml; do\n  if [ ! -e \"$velnor_file\" ] && [ ! -L \"$velnor_file\" ]; then continue; fi\n  velnor_regular \"$velnor_file\"\n  velnor_tools \"$velnor_file\"\ndone\nif [ -e .tool-versions ] || [ -L .tool-versions ]; then\n  velnor_regular .tool-versions\n  velnor_tool_versions .tool-versions\nfi\nif [ -e rust-toolchain.toml ] || [ -L rust-toolchain.toml ]; then\n  velnor_regular rust-toolchain.toml\n  velnor_toolchain rust-toolchain.toml\nfi\nif [ -e rust-toolchain ] || [ -L rust-toolchain ]; then\n  velnor_regular rust-toolchain\n  velnor_toolchain rust-toolchain\nfi\nvelnor_tool VELNOR_TOOL_RUST 'rust' 'core:rust'\nrm -rf \"$velnor_dir\"\n" # zizmor: ignore[github-env]
      - name: Install the pinned GitHub CLI
        run: mise --no-config --no-env --no-hooks install gh@2.102.1
      - name: Install the pinned generate validators
        run: mise --no-config --no-env --no-hooks install jactionlint@2.3.0 shellcheck@0.11.0
      - name: Verify jactionlint
        shell: sh
        run: set -eu; echo verify-jactionlint
      - name: Download the upgrade patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: velnor-upgrade
          path: ${{ runner.temp }}/velnor-upgrades
      - name: Resolve and verify the latest Velnor release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VELNOR_UPGRADE_DIR: ${{ runner.temp }}/velnor-upgrades
          VELNOR_GH_VERSION: 2.102.1
        run: "set -euo pipefail\n: \"${GH_TOKEN:?}\" \"${VELNOR_UPGRADE_DIR:?}\" \"${VELNOR_GH_VERSION:?}\"\n# Resolve the newest stable velnor-actions release and verify it before any\n# job runs it: the release manifest and the Linux binary must each carry a\n# build-provenance attestation from Velnor's generator release workflow on\n# `main` at the manifest's commit, and the binary must match the manifest's\n# SHA-256. Runs before any repository code; the read-only `github.token` it\n# holds never reaches a later step.\nvelnor_gh() { mise --no-config --no-env --no-hooks exec \"gh@$VELNOR_GH_VERSION\" -- gh \"$@\"; }\nrepository=tailrocks/velnor-new\nsigner=\"$repository/.github/workflows/product-release-generator.yml\"\nout=$VELNOR_UPGRADE_DIR/velnor\nrm -rf \"$out\"\nmkdir -p \"$out/bin\"\nfail() { printf '::error::%s: %s\\n' \"$1\" \"$2\"; exit 1; }\nsha256_of() {\n  if command -v sha256sum >/dev/null 2>&1; then sha256sum \"$1\"; else shasum -a 256 \"$1\"; fi | cut -d' ' -f1\n}\nattested() {\n  velnor_gh attestation verify \"$1\" --bundle \"$1.intoto.jsonl\" --repo \"$repository\" \\\n    --signer-workflow \"$signer\" --source-ref refs/heads/main \\\n    --source-digest \"$2\" --signer-digest \"$2\" >/dev/null \\\n    || fail upgrade_velnor_provenance_unverified \"$(basename \"$1\") has no valid $signer attestation at $2\"\n}\ntag=$(velnor_gh api \"repos/$repository/releases?per_page=100\" --jq '\n  [ .[] | select(.draft == false and .prerelease == false\n      and (.tag_name | test(\"^v[0-9]+[.][0-9]+[.][0-9]+$\"))) ]\n  | sort_by(.tag_name | ltrimstr(\"v\") | split(\".\") | map(tonumber))\n  | last | .tag_name // empty')\n[ -n \"$tag\" ] || fail upgrade_velnor_release_missing \"no stable velnor-actions release in $repository\"\nversion=${tag#v}\nvelnor_gh release download \"$tag\" --repo \"$repository\" --dir \"$out\" \\\n  --pattern release-manifest.json --pattern release-manifest.json.intoto.jsonl\nmanifest=$out/release-manifest.json\njq -e --arg version \"$version\" '.schema == 1 and .repository == \"tailrocks/velnor-new\" and .version == $version and (.commit | test(\"^[0-9a-f]{40}$\"))' \"$manifest\" >/dev/null \\\n  || fail upgrade_velnor_manifest_invalid \"$tag release manifest failed validation\"\ncommit=$(jq -r .commit \"$manifest\")\nattested \"$manifest\" \"$commit\"\nname=velnor-actions-$version-x86_64-unknown-linux-gnu\nasset=$(jq -r '[.targets[] | select(.target == \"x86_64-unknown-linux-gnu\")] | if length == 1 then .[0].artifact else empty end' \"$manifest\")\ndigest=$(jq -r '[.targets[] | select(.target == \"x86_64-unknown-linux-gnu\")] | if length == 1 then .[0].sha256 else empty end' \"$manifest\")\n[ \"$asset\" = \"https://github.com/$repository/releases/download/$tag/$name\" ] || fail upgrade_velnor_asset_untrusted \"$asset\"\ncase \"$digest\" in *[!0-9a-f]*|'') fail upgrade_velnor_manifest_invalid \"$tag Linux digest\" ;; esac\n[ \"${#digest}\" = 64 ] || fail upgrade_velnor_manifest_invalid \"$tag Linux digest\"\nvelnor_gh release download \"$tag\" --repo \"$repository\" --dir \"$out\" --pattern \"$name\" --pattern \"$name.intoto.jsonl\"\n[ \"$(sha256_of \"$out/$name\")\" = \"$digest\" ] || fail upgrade_velnor_digest_mismatch \"$name\"\nattested \"$out/$name\" \"$commit\"\nmv \"$out/$name\" \"$out/bin/velnor-actions\"\nchmod 755 \"$out/bin/velnor-actions\"\necho \"velnor: verified velnor-actions $version ($commit)\"\n"
      - name: Regenerate .github/ and compare it with the patch
        id: verify
        shell: bash
        env:
          VELNOR_UPGRADE_DIR: ${{ runner.temp }}/velnor-upgrades
          VELNOR_GENERATE_TOOLS: jactionlint@2.3.0 shellcheck@0.11.0
          VELNOR_VERIFY_RUST_SCRIPT: "v=\"${{ env.VELNOR_TOOL_RUST }}\"; echo verify \"$v\""
        run: "# Upgrade patch filter, shared by every upgrades.yml job that builds, checks\n# or applies the patch. It validates the patch itself and the index the patch\n# produces; it never relies on `git apply` rejecting anything.\n#\n# Rules: only upgrade-owned paths; no rename or copy; every file is a regular\n# non-executable file (mode 100644), so no symlink, gitlink or mode change;\n# only generated `.github/**` files may be deleted; no binary change\n# (`velnor_upgrade_binary_allowed` names none).\nvelnor_upgrade_path_owned() {\n  case \"$1\" in\n    mise.toml|.mise.toml|mise.lock|.mise.lock|.velnor/release-manifest.json|.github/*) return 0 ;;\n    rust-toolchain.toml|*/rust-toolchain.toml|rust-toolchain|*/rust-toolchain) return 0 ;;\n    Cargo.toml|Cargo.lock|*/Cargo.toml|*/Cargo.lock) return 0 ;;\n    package.json|bun.lock|*/package.json|*/bun.lock) return 0 ;;\n    gradle/libs.versions.toml|*/gradle/libs.versions.toml|gradle.lockfile|*/gradle.lockfile) return 0 ;;\n    gradle/verification-metadata.xml|*/gradle/verification-metadata.xml) return 0 ;;\n  esac\n  return 1\n}\nvelnor_upgrade_deletable() { case \"$1\" in .github/*) return 0 ;; esac; return 1; }\nvelnor_upgrade_binary_allowed() { return 1; }\n# Plain relative path: no empty, `.` or `..` segment, no `.git` segment in\n# any case, and only portable characters.\nvelnor_upgrade_path_sane() {\n  case \"$1\" in ''|/*|*/|*//*|*[!A-Za-z0-9._/@+-]*) return 1 ;; esac\n  case \"/$1/\" in */./*|*/../*) return 1 ;; esac\n  case \"/$(printf '%s' \"$1\" | LC_ALL=C tr '[:upper:]' '[:lower:]')/\" in */.git/*) return 1 ;; esac\n  return 0\n}\nvelnor_upgrade_reject() { printf '::error::%s: %s\\n' \"$1\" \"$2\"; return 1; }\n\n# Check one patch file's text: headers, file count and per-file paths.\nvelnor_upgrade_check_patch() {\n  local patch=$1 headers files line rec added rest path\n  local numstat=$patch.numstat\n  test -s \"$patch\" || { velnor_upgrade_reject upgrade_patch_malformed \"empty patch\"; return 1; }\n  if LC_ALL=C grep -q \"$(printf '\\r')\" \"$patch\"; then velnor_upgrade_reject upgrade_patch_malformed \"carriage return\"; return 1; fi\n  # Header lines never start with a hunk prefix, so an anchored match sees\n  # exactly what `git apply` parses as a header.\n  line=$(LC_ALL=C grep -n -m 1 -E '^(rename|copy) (from|to) |^(dis)?similarity index ' \"$patch\" || true)\n  [ -z \"$line\" ] || { velnor_upgrade_reject upgrade_patch_rename_rejected \"$line\"; return 1; }\n  line=$(LC_ALL=C grep -n -m 1 -E '^GIT binary patch|^Binary files |^(literal|delta) [0-9]' \"$patch\" || true)\n  [ -z \"$line\" ] || { velnor_upgrade_reject upgrade_patch_binary_rejected \"$line\"; return 1; }\n  line=$(LC_ALL=C grep -n -m 1 -E '^(old|new) mode ' \"$patch\" || true)\n  [ -z \"$line\" ] || { velnor_upgrade_reject upgrade_patch_mode_rejected \"$line\"; return 1; }\n  line=$(LC_ALL=C awk '/^(new|deleted) file mode / && $NF != \"100644\" { print NR \": \" $0; exit }' \"$patch\")\n  case \"$line\" in\n    '') ;;\n    *' 120000') velnor_upgrade_reject upgrade_patch_symlink_rejected \"$line\"; return 1 ;;\n    *) velnor_upgrade_reject upgrade_patch_mode_rejected \"$line\"; return 1 ;;\n  esac\n  line=$(LC_ALL=C awk '/^index [0-9a-f]+[.][.][0-9a-f]+ / && $3 != \"100644\" { print NR \": \" $0; exit }' \"$patch\")\n  case \"$line\" in\n    '') ;;\n    *' 120000') velnor_upgrade_reject upgrade_patch_symlink_rejected \"$line\"; return 1 ;;\n    *) velnor_upgrade_reject upgrade_patch_mode_rejected \"$line\"; return 1 ;;\n  esac\n  # Every file patch is a `diff --git` section: a traditional patch section\n  # would appear in the numstat without a matching header.\n  headers=$(LC_ALL=C grep -c '^diff --git ' \"$patch\" || true)\n  git apply --numstat -z \"$patch\" > \"$numstat\" || { velnor_upgrade_reject upgrade_patch_malformed \"git apply --numstat failed\"; return 1; }\n  files=0\n  while IFS= read -r -d '' rec; do\n    files=$((files + 1))\n    added=${rec%%$'\\t'*}\n    rest=${rec#*$'\\t'}\n    path=${rest#*$'\\t'}\n    if [ -z \"$path\" ]; then velnor_upgrade_reject upgrade_patch_rename_rejected \"file $files\"; return 1; fi\n    velnor_upgrade_path_sane \"$path\" || { velnor_upgrade_reject upgrade_patch_path_rejected \"$path\"; return 1; }\n    velnor_upgrade_path_owned \"$path\" || { velnor_upgrade_reject upgrade_patch_path_rejected \"$path\"; return 1; }\n    if [ \"$added\" = - ] && ! velnor_upgrade_binary_allowed \"$path\"; then velnor_upgrade_reject upgrade_patch_binary_rejected \"$path\"; return 1; fi\n  done < \"$numstat\"\n  [ \"$files\" -gt 0 ] && [ \"$files\" = \"$headers\" ] || { velnor_upgrade_reject upgrade_patch_malformed \"$files file patches, $headers git headers\"; return 1; }\n}\n\n# Check what the index holds against HEAD, entry by entry, with rename\n# detection off so a move shows as its deletion plus its addition.\n# `velnor_upgrade_check_index strict` fails on the first violation;\n# `velnor_upgrade_check_index drop` unstages it and prints `<code> <path>`.\nvelnor_upgrade_check_index() {\n  local mode=$1 meta path old new status code rec added rest\n  local raw numstat\n  raw=$(mktemp) numstat=$(mktemp)\n  if ! git diff --cached --raw -z --no-renames --no-ext-diff HEAD -- > \"$raw\" \\\n    || ! git diff --cached --numstat -z --no-renames --no-ext-diff HEAD -- > \"$numstat\"; then\n    velnor_upgrade_reject upgrade_patch_malformed \"git diff --cached failed\"; return 1\n  fi\n  while IFS= read -r -d '' meta && IFS= read -r -d '' path; do\n    old=${meta#:}; old=${old%% *}\n    new=${meta#:* }; new=${new%% *}\n    status=${meta##* }\n    code=\n    if ! velnor_upgrade_path_sane \"$path\" || ! velnor_upgrade_path_owned \"$path\"; then code=upgrade_patch_path_rejected\n    else\n      case \"$status:$old:$new\" in\n        M:100644:100644|A:000000:100644) ;;\n        D:100644:000000) velnor_upgrade_deletable \"$path\" || code=upgrade_patch_delete_rejected ;;\n        A:000000:120000|M:*:120000|T:*:120000) code=upgrade_patch_symlink_rejected ;;\n        D:*) code=upgrade_patch_delete_rejected ;;\n        *) code=upgrade_patch_mode_rejected ;;\n      esac\n    fi\n    if [ -n \"$code\" ]; then\n      if [ \"$mode\" = strict ]; then velnor_upgrade_reject \"$code\" \"$path\"; return 1; fi\n      git reset --quiet -- \"$path\" || return 1\n      printf '%s %s\\n' \"$code\" \"$path\"\n    fi\n  done < \"$raw\"\n  while IFS= read -r -d '' rec; do\n    added=${rec%%$'\\t'*}\n    rest=${rec#*$'\\t'}\n    path=${rest#*$'\\t'}\n    if [ \"$added\" = - ] && ! velnor_upgrade_binary_allowed \"$path\"; then\n      if [ \"$mode\" = strict ]; then velnor_upgrade_reject upgrade_patch_binary_rejected \"$path\"; return 1; fi\n      git reset --quiet -- \"$path\" || return 1\n      printf '%s %s\\n' upgrade_patch_binary_rejected \"$path\"\n    fi\n  done < \"$numstat\"\n  rm -f \"$raw\" \"$numstat\"\n}\n\n# Check a patch against HEAD in a scratch index, never the worktree, so a\n# rejected patch writes nothing: text first, then the index it would produce.\nvelnor_upgrade_check_patch_applies() {\n  local patch=$1 index=$2\n  velnor_upgrade_check_patch \"$patch\" || return 1\n  rm -f \"$index\"\n  (\n    export GIT_INDEX_FILE=$index\n    git read-tree HEAD || exit 1\n    git -c core.hooksPath=/dev/null apply --cached \"$patch\" \\\n      || { velnor_upgrade_reject upgrade_patch_malformed \"git apply --cached failed\"; exit 1; }\n    velnor_upgrade_check_index strict\n  )\n}\n\n# What `velnor-actions generate` needs before it runs, shared by prepare and\n# verify: the Velnor-pinned validators it executes (`VELNOR_GENERATE_TOOLS`),\n# the project Rust for its offline `cargo metadata`, and every tracked Cargo\n# workspace's sources. Installs are fresh (this workflow restores no tool\n# cache) and run outside the project configuration (`--no-config`); the\n# Rust is verified file by file (`VELNOR_VERIFY_RUST_SCRIPT`) before use.\nvelnor_generate_prerequisites() {\n  local roots rust root\n  # shellcheck disable=SC20