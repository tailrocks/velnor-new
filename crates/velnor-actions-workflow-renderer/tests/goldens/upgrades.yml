      - name: Install the pinned GitHub CLI
        run: mise --no-config --no-env --no-hooks install gh@2.102.1
      - name: Install the pinned generate validators
        run: mise --no-config --no-env --no-hooks install jactionlint@2.3.0 shellcheck@0.11.0
