se-manifest.json\" \\\n    || fail upgrade_velnor_manifest_unverified \"the patch selects a Velnor release this job did not verify\"\nelse\n  fail upgrade_velnor_manifest_unverified \".velnor/release-manifest.json is missing\"\nfi\n# Regenerate from trusted inputs only: the default branch checkout, which\n# hard decision 4 keeps version-free in `.github/`, plus the verified manifest.\ncp \"$dir/velnor/release-manifest.json\" .velnor/release-manifest.json\nvelnor_generate_prerequisites\n\"$dir/velnor/bin/velnor-actions\" generate > \"$dir/generate.log\" 2>&1 \\\n  || { cat \"$dir/generate.log\"; fail upgrade_regenerate_failed \"velnor-actions generate failed on the default branch\"; }\ngit add -A -- .github .velnor/release-manifest.json\nexpected=$(git write-tree)\nsubtree() { git rev-parse --verify --quiet \"$1:$2\" || echo absent; }\nif [ \"$(subtree \"$expected\" .github)\" != \"$(subtree \"$prepared\" .github)\" ]; then\n  git diff --no-renames --stat \"$expected\" \"$prepared\" -- .github\n  fail upgrade_patch_github_mismatch \"prepare's .github/ differs from this job's regeneration; nothing is published\"\nfi\n# `workflows: write` only when the push really changes a workflow file.\nworkflows=\nif [ \"$(subtree HEAD .github/workflows)\" != \"$(subtree \"$prepared\" .github/workflows)\" ]; then workflows='write'; fi\nsha=$(if command -v sha256sum >/dev/null 2>&1; then sha256sum \"$patch\"; else shasum -a 256 \"$patch\"; fi | cut -d' ' -f1)\n{\n  echo \"tree=$prepared\"\n  echo \"patch_sha256=$sha\"\n  echo \"workflows=$workflows\"\n} >> \"$GITHUB_OUTPUT\"\necho \"velnor: the patch's .github/ is exactly the verified regeneration (tree $prepared)\"\n"
  publish:
    name: Open or update the upgrade pull request
    needs: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "1"
          persist-credentials: "false"
      - name: Setup Mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde
        with:
          cache: "false"
          cache_save: "false"
          env: "false"
          install: "false"
          sha256: fe6dd17e68e09682b31d2e7bb7bb755d22636ac1af5d94621e300f2ca9e9fe8a
          version: 2026.10.17
      - name: Install the pinned GitHub CLI
        run: mise --no-config --no-env --no-hooks install gh@2.102.1
      - name: Download the upgrade patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: velnor-upgrade
          path: ${{ runner.temp }}/velnor-upgrades
      - name: Check the patch is the verified upgrade
        shell: bash
        env:
          VELNOR_UPGRADE_DIR: ${{ runner.temp }}/velnor-upgrades
          VELNOR_VERIFIED_TREE: ${{ needs.verify.outputs.tree }}
          VELNOR_VERIFIED_PATCH_SHA256: ${{ needs.verify.outputs.patch_sha256 }}
        run: "# Upgrade patch filter, shared by every upgrades.yml job that builds, checks\n# or applies the patch. It validates the patch itself and the index the patch\n# produces; it never relies on `git apply` rejecting anything.\n#\n# Rules: only upgrade-owned paths; no rename or copy; every file is a regular\n# non-executable file (mode 100644), so no symlink, gitlink or mode change;\n# only generated `.github/**` files may be deleted; no binary change\n# (`velnor_upgrade_binary_allowed` names none).\nvelnor_upgrade_path_owned() {\n  case \"$1\" in\n    mise.toml|.mise.toml|mise.lock|.mise.lock|.velnor/release-manifest.json|.github/*) return 0 ;;\n    rust-toolchain.toml|*/rust-toolchain.toml|rust-toolchain|*/rust-toolchain) return 0 ;;\n    Cargo.toml|Cargo.lock|*/Cargo.toml|*/Cargo.lock) return 0 ;;\n    package.json|bun.lock|*/package.json|*/bun.lock) return 0 ;;\n    gradle/libs.versions.toml|*/gradle/libs.versions.toml|gradle.lockfile|*/gradle.lockfile) return 0 ;;\n    gradle/verification-metadata.xml|*/gradle/verification-metadata.xml) return 0 ;;\n  esac\n  return 1\n}\nvelnor_upgrade_deletable() { case \"$1\" in .github/*) return 0 ;; esac; return 1; }\nvelnor_upgrade_binary_allowed() { return 1; }\n# Plain relative path: no empty, `.` or `..` segment, no `.git` segment in\n# any case, and only portable characters.\nvelnor_upgrade_path_sane() {\n  case \"$1\" in ''|/*|*/|*//*|*[!A-Za-z0-9._/@+-]*) return 1 ;; esac\n  case \"/$1/\" in */./*|*/../*) return 1 ;; esac\n  case \"/$(printf '%s' \"$1\" | LC_ALL=C tr '[:upper:]' '[:lower:]')/\" in */.git/*) return 1 ;; esac\n  return 0\n}\nvelnor_upgrade_reject() { printf '::error::%s: %s\\n' \"$1\" \"$2\"; return 1; }\n\n# Check one patch file's text: headers, file count and per-file paths.\nvelnor_upgrade_check_patch() {\n  local patch=$1 headers files line rec added rest path\n  local numstat=$patch.numstat\n  test -s \"$patch\" || { velnor_upgrade_reject upgrade_patch_malformed \"empty patch\"; return 1; }\n  if LC_ALL=C grep -q \"$(printf '\\r')\" \"$patch\"; then velnor_upgrade_reject upgrade_patch_malformed \"carriage return\"; return 1; fi\n  # Header lines never start with a hunk prefix, so an anchored match sees\n  # exactly what `git apply` parses as a header.\n  line=$(LC_ALL=C grep -n -m 1 -E '^(rename|copy) (from|to) |^(dis)?similarity index ' \"$patch\" || true)\n  [ -z \"$line\" ] || { velnor_upgrade_reject upgrade_patch_rename_rejected \"$line\"; return 1; }\n  line=$(LC_ALL=C grep -n -m 1 -E '^GIT binary patch|^Binary files |^(literal|delta) [0-9]' \"$patch\" || true)\n  [ -z \"$line\" ] || { velnor_upgrade_reject upgrade_patch_binary_rejected \"$line\"; return 1; }\n  line=$(LC_ALL=C grep -n -m 1 -E '^(old|new) mode ' \"$patch\" || true)\n  [ -z \"$line\" ] || { velnor_upgrade_reject upgrade_patch_mode_rejected \"$line\"; return 1; }\n  line=$(LC_ALL=C awk '/^(new|deleted) file mode / && $NF != \"100644\" { print NR \": \" $0; exit }' \"$patch\")\n  case \"$line\" in\n    '') ;;\n    *' 120000') velnor_upgrade_reject upgrade_patch_symlink_rejected \"$line\"; return 1 ;;\n    *) velnor_upgrade_reject upgrade_patch_mode_rejected \"$line\"; return 1 ;;\n  esac\n  line=$(LC_ALL=C awk '/^index [0-9a-f]+[.][.][0-9a-f]+ / && $3 != \"100644\" { print NR \": \" $0; exit }' \"$patch\")\n  case \"$line\" in\n    '') ;;\n    *' 120000') velnor_upgrade_reject upgrade_patch_symlink_rejected \"$line\"; return 1 ;;\n    *) velnor_upgrade_reject upgrade_patch_mode_rejected \"$line\"; return 1 ;;\n  esac\n  # Every file patch is a `diff --git` section: a traditional patch section\n  # would appear in the numstat without a matching header.\n  headers=$(LC_ALL=C grep -c '^diff --git ' \"$patch\" || true)\n  git apply --numstat -z \"$patch\" > \"$numstat\" || { velnor_upgrade_reject upgrade_patch_malformed \"git apply --numstat failed\"; return 1; }\n  files=0\n  while IFS= read -r -d '' rec; do\n    files=$((files + 1))\n    added=${rec%%$'\\t'*}\n    rest=${rec#*$'\\t'}\n    path=${rest#*$'\\t'}\n    if [ -z \"$path\" ]; then velnor_upgrade_reject upgrade_patch_rename_rejected \"file $files\"; return 1; fi\n    velnor_upgrade_path_sane \"$path\" || { velnor_upgrade_reject upgrade_patch_path_rejected \"$path\"; return 1; }\n    velnor_upgrade_path_owned \"$path\" || { velnor_upgrade_reject upgrade_patch_path_rejected \"$path\"; return 1; }\n    if [ \"$added\" = - ] && ! velnor_upgrade_binary_allowed \"$path\"; then velnor_upgrade_reject upgrade_patch_binary_rejected \"$path\"; return 1; fi\n  done < \"$numstat\"\n  [ \"$files\" -gt 0 ] && [ \"$files\" = \"$headers\" ] || { velnor_upgrade_reject upgrade_patch_malformed \"$files file patches, $headers git headers\"; return 1; }\n}\n\n# Check what the index holds against HEAD, entry by entry, with rename\n# detection off so a move shows as its deletion plus its addition.\n# `velnor_upgrade_check_index strict` fails on the first violation;\n# `velnor_upgrade_check_index drop` unstages it and prints `<code> <path>`.\nvelnor_upgrade_check_index() {\n  local mode=$1 meta path old new status code rec added rest\n  local raw numstat\n  raw=$(mktemp) numstat=$(mktemp)\n  if ! git diff --cached --raw -z --no-renames --no-ext-diff HEAD -- > \"$raw\" \\\n    || ! git diff --cached --numstat -z --no-renames --no-ext-diff HEAD -- > \"$numstat\"; then\n    velnor_upgrade_reject upgrade_patch_malformed \"git diff --cached failed\"; return 1\n  fi\n  while IFS= read -r -d '' meta && IFS= read -r -d '' path; do\n    old=${meta#:}; old=${old%% *}\n    new=${meta#:* }; new=${new%% *}\n    status=${meta##* }\n    code=\n    if ! velnor_upgrade_path_sane \"$path\" || ! velnor_upgrade_path_owned \"$path\"; then code=upgrade_patch_path_rejected\n    else\n      case \"$status:$old:$new\" in\n        M:100644:100644|A:000000:100644) ;;\n        D:100644:000000) velnor_upgrade_deletable \"$path\" || code=upgrade_patch_delete_rejected ;;\n        A:000000:120000|M:*:120000|T:*:120000) code=upgrade_patch_symlink_rejected ;;\n        D:*) code=upgrade_patch_delete_rejected ;;\n        *) code=upgrade_patch_mode_rejected ;;\n      esac\n    fi\n    if [ -n \"$code\" ]; then\n      if [ \"$mode\" = strict ]; then velnor_upgrade_reject \"$code\" \"$path\"; return 1; fi\n      git reset --quiet -- \"$path\" || return 1\n      printf '%s %s\\n' \"$code\" \"$path\"\n    fi\n  done < \"$raw\"\n  while IFS= read -r -d '' rec; do\n    added=${rec%%$'\\t'*}\n    rest=${rec#*$'\\t'}\n    path=${rest#*$'\\t'}\n    if [ \"$added\" = - ] && ! velnor_upgrade_binary_allowed \"$path\"; then\n      if [ \"$mode\" = strict ]; then velnor_upgrade_reject upgrade_patch_binary_rejected \"$path\"; return 1; fi\n      git reset --quiet -- \"$path\" || return 1\n      printf '%s %s\\n' upgrade_patch_binary_rejected \"$path\"\n    fi\n  done < \"$numstat\"\n  rm -f \"$raw\" \"$numstat\"\n}\n\n# Check a patch against HEAD in a scratch index, never the worktree, so a\n# rejected patch writes nothing: text first, then the index it would produce.\nvelnor_upgrade_check_patch_applies() {\n  local patch=$1 index=$2\n  velnor_upgrade_check_patch \"$patch\" || return 1\n  rm -f \"$index\"\n  (\n    export GIT_INDEX_FILE=$index\n    git read-tree HEAD || exit 1\n    git -c core.hooksPath=/dev/null apply --cached \"$patch\" \\\n      || { velnor_upgrade_reject upgrade_patch_malformed \"git apply --cached failed\"; exit 1; }\n    velnor_upgrade_check_index strict\n  )\n}\n\nset -euo pipefail\n: \"${VELNOR_UPGRADE_DIR:?}\" \"${VELNOR_VERIFIED_TREE:?}\" \"${VELNOR_VERIFIED_PATCH_SHA256:?}\"\n# Runs before the App token exists: the patch must be byte-for-byte the one\n# the verify job regenerated against, pass the filter again, and apply to\n# exactly the tree that job accepted.\ndir=$VELNOR_UPGRADE_DIR\npatch=$dir/upgrade.patch\nfail() { printf '::error::%s: %s\\n' \"$1\" \"$2\"; exit 1; }\ntest -s \"$patch\" || fail upgrade_patch_unverified \"the upgrade patch is missing\"\nsha=$(if command -v sha256sum >/dev/null 2>&1; then sha256sum \"$patch\"; else shasum -a 256 \"$patch\"; fi | cut -d' ' -f1)\n[ \"$sha\" = \"$VELNOR_VERIFIED_PATCH_SHA256\" ] || fail upgrade_patch_unverified \"the downloaded patch is not the patch the verify job checked\"\nvelnor_upgrade_check_patch_applies \"$patch\" \"$dir/check.index\" || exit 1\ngit -c core.hooksPath=/dev/null apply --index \"$patch\"\nvelnor_upgrade_check_index strict || exit 1\n[ \"$(git write-tree)\" = \"$VELNOR_VERIFIED_TREE\" ] || fail upgrade_patch_unverified \"the applied tree is not the tree the verify job accepted\"\necho \"velnor: the patch is the verified upgrade (tree $VELNOR_VERIFIED_TREE)\"\n"
      - name: Mint a short-lived token for this repository only
        id: upgrade-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.VELNOR_DEPS_APP_ID }}
          private-key: ${{ secrets.VELNOR_DEPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: ${{ needs.verify.outputs.workflows }}
          skip-token-revoke: false
      - name: Push the upgrade branch and open or update its pull request
        shell: bash
        env:
          GH_TOKEN: ${{ steps.upgrade-token.outputs.token }}
          VELNOR_UPGRADE_DIR: ${{ runner.temp }}/velnor-upgrades
          VELNOR_VERIFIED_TREE: ${{ needs.verify.outputs.tree }}
          VELNOR_VERIFIED_PATCH_SHA256: ${{ needs.verify.outputs.patch_sha256 }}
          VELNOR_UPGRADE_BRANCH: velnor/upgrades
          VELNOR_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VELNOR_GH_VERSION: 2.102.1
        run: "set -euo pipefail\n: \"${GH_TOKEN:?}\" \"${VELNOR_UPGRADE_DIR:?}\" \"${VELNOR_UPGRADE_BRANCH:?}\" \"${VELNOR_DEFAULT_BRANCH:?}\" \"${GITHUB_REPOSITORY:?}\" \"${VELNOR_VERIFIED_TREE:?}\"\ndir=$VELNOR_UPGRADE_DIR\nvelnor_gh() { mise --no-config --no-env --no-hooks exec \"gh@${VELNOR_GH_VERSION:?}\" -- gh \"$@\"; }\n# The previous step, which held no token, left the index at exactly the tree\n# the verify job accepted; nothing else is ever committed.\ntree=$(git write-tree)\n[ \"$tree\" = \"$VELNOR_VERIFIED_TREE\" ] || { echo \"::error::upgrade_patch_unverified: the index is not the verified tree\"; exit 1; }\nbase=$(git rev-parse HEAD)\nvelnor_gh auth setup-git --hostname github.com\nparents=(-p \"$base\")\nif git ls-remote --exit-code --heads origin \"$VELNOR_UPGRADE_BRANCH\" >/dev/null 2>&1; then\n  git fetch --quiet --no-tags --depth=1 origin \"refs/heads/$VELNOR_UPGRADE_BRANCH\"\n  previous=$(git rev-parse FETCH_HEAD)\n  if [ \"$(git rev-parse \"FETCH_HEAD^{tree}\")\" = \"$tree\" ]; then\n    echo \"velnor: $VELNOR_UPGRADE_BRANCH already carries this upgrade\"\n    pushed=false\n  else\n    # A merge of the previous upgrade head and the current default branch:\n    # the branch only fast-forwards (never a force push) and the pull\n    # request diff stays exactly this upgrade.\n    parents=(-p \"$previous\" -p \"$base\")\n    pushed=true\n  fi\nelse\n  pushed=true\nfi\nif [ \"$pushed\" = true ]; then\n  export GIT_AUTHOR_NAME=\"Velnor Upgrades\" GIT_AUTHOR_EMAIL=\"velnor-upgrades@users.noreply.github.com\"\n  export GIT_COMMITTER_NAME=\"$GIT_AUTHOR_NAME\" GIT_COMMITTER_EMAIL=\"$GIT_AUTHOR_EMAIL\"\n  {\n    echo \"chore(deps): upgrade to the latest stable releases\"\n    echo\n    cat \"$dir/summary.md\"\n    echo\n    echo \"Signed-off-by: $GIT_AUTHOR_NAME <$GIT_AUTHOR_EMAIL>\"\n  } > \"$dir/message\"\n  commit=$(git commit-tree \"$tree\" \"${parents[@]}\" -F \"$dir/message\")\n  git push --quiet origin \"$commit:refs/heads/$VELNOR_UPGRADE_BRANCH\"\nfi\nnumber=$(velnor_gh pr list --repo \"$GITHUB_REPOSITORY\" --head \"$VELNOR_UPGRADE_BRANCH\" --state open --json number --jq '.[0].number // empty')\nif [ -n \"$number\" ]; then\n  velnor_gh pr edit \"$number\" --repo \"$GITHUB_REPOSITORY\" --body-file \"$dir/summary.md\"\n  echo \"velnor: updated upgrade pull request #$number\"\nelse\n  velnor_gh pr create --repo \"$GITHUB_REPOSITORY\" --base \"$VELNOR_DEFAULT_BRANCH\" --head \"$VELNOR_UPGRADE_BRANCH\" \\\n    --title \"chore(deps): upgrade to the latest stable releases\" --body-file \"$dir/summary.md\"\nfi\n"
  freshness:
    name: Freshness gate
    needs: prepare
    if: ${{ always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Setup Mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde
        with:
          cache: "false"
          cache_save: "false"
          env: "false"
          install: "false"
          sha256: fe6dd17e68e09682b31d2e7bb7bb755d22636ac1af5d94621e300f2ca9e9fe8a
          version: 2026.10.17
      - name: Install the pinned GitHub CLI
        run: mise --no-config --no-env --no-hooks install gh@2.102.1
      - name: Fail while a pin lags or the upgrade pull request is stuck
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VELNOR_PREPARE_RESULT: ${{ needs.prepare.result }}
          VELNOR_STALE: ${{ needs.prepare.outputs.changed }}
          VELNOR_SCOPE_FAILED: ${{ needs.prepare.outputs.failed }}
          VELNOR_SCOPE_FAILURES: ${{ needs.prepare.outputs.failures }}
          VELNOR_STUCK_DAYS: "3"
          VELNOR_UPGRADE_BRANCH: velnor/upgrades
          VELNOR_GH_VERSION: 2.102.1
        run: "set -euo pipefail\n: \"${GH_TOKEN:?}\" \"${GITHUB_REPOSITORY:?}\" \"${VELNOR_UPGRADE_BRANCH:?}\" \"${VELNOR_STUCK_DAYS:?}\"\nvelnor_gh() { mise --no-config --no-env --no-hooks exec \"gh@${VELNOR_GH_VERSION:?}\" -- gh \"$@\"; }\nstatus=0\ncase \"${VELNOR_PREPARE_RESULT:-}\" in\n  success) ;;\n  *) echo \"::error::upgrade_prepare_failed: the upgrade job ended '${VELNOR_PREPARE_RESULT:-unknown}', so freshness is unknown\"; status=1 ;;\nesac\nif [ \"${VELNOR_SCOPE_FAILED:-}\" = true ]; then\n  echo \"::error::upgrade_scope_needs_migration: at least one upgrade scope failed and was rolled back, so its pins stay behind; resolve it by hand:\"\n  # Each line is indented, so prepared text never starts a workflow command.\n  printf '%s\\n' \"${VELNOR_SCOPE_FAILURES:-}\" | sed 's/^/    /'\n  status=1\nfi\nif [ \"${VELNOR_STALE:-}\" = true ]; then\n  echo \"::error::pins_not_latest: at least one pin is older than the latest stable release; merge the '$VELNOR_UPGRADE_BRANCH' pull request\"\n  status=1\nfi\ncreated=$(velnor_gh pr list --repo \"$GITHUB_REPOSITORY\" --head \"$VELNOR_UPGRADE_BRANCH\" --state open --json createdAt --jq '.[0].createdAt // empty')\nif [ -n \"$created\" ]; then\n  age_days=$(jq -nr --arg created \"$created\" '(now - ($created | fromdateiso8601)) / 86400 | floor')\n  if [ \"$age_days\" -gt \"$VELNOR_STUCK_DAYS\" ]; then\n    echo \"::error::upgrade_pull_request_stuck: the '$VELNOR_UPGRADE_BRANCH' pull request has been open $age_days days (limit $VELNOR_STUCK_DAYS)\"\n    status=1\n  fi\nfi\nif [ \"$status\" = 0 ]; then echo \"velnor: every pin is the latest stable release\"; fi\nexit \"$status\"\n"
