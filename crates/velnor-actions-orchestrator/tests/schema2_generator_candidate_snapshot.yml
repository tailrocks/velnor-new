      - name: Install pinned Intel Rust target
        shell: bash
        run: "set -eu\n\ncatalog_version() {\n  awk -F '\"' -v name=\"$1\" '\n    $1 == \"pub const \" name \": &str = \" && $3 == \";\" {\n      value = $2\n      count += 1\n    }\n    END {\n      if (count != 1 || value !~ /^[0-9]+\\.[0-9]+\\.[0-9]+$/) exit 1\n      print value\n    }\n  ' crates/velnor-actions-mise/src/catalog.rs\n}\n\nRUST_VERSION=\"$(catalog_version RUST_VERSION)\"\nmise --no-config --no-env --no-hooks exec \"rust@$RUST_VERSION\" -- rustup target add x86_64-apple-darwin\nmise --no-config --no-env --no-hooks exec \"rust@$RUST_VERSION\" -- rustup target list --installed | grep -Fx x86_64-apple-darwin"
