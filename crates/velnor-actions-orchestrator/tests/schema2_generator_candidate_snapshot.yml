        shell: bash
        run: "set -eu\n\ncatalog_version() {\n  awk -F '\"' -v name=\"$1\" '\n    $1 == \"pub const \" name \": &str = \" && $3 == \";\" {\n      value = $2\n      count += 1\n    }\n    END {\n      if (count != 1 || value !~ /^[0-9]+\\.[0-9]+\\.[0-9]+$/) exit 1\n      print value\n    }\n  ' crates/velnor-actions-mise/src/catalog.rs\n}\n\n\ntest \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\"\nRUST_VERSION=\"$(catalog_version RUST_VERSION)\"\nMBX_VERSION=\"$(catalog_version MR_BOXINGTON_VERSION)\"\ndigest=\"$(shasum -a 256 velnor-actions-0.1.1-aarch64-apple-darwin | awk 'NR == 1 && length($1) == 64 && $1 !~ /[^0-9a-f]/ { print $1; next } { exit 1 } END { if (NR != 1) exit 1 }')\"\ntest -s velnor-actions-0.1.1-aarch64-apple-darwin.sha256\njq -n --arg version \"0.1.1\" --arg repository \"$GITHUB_REPOSITORY\" --arg commit \"$GITHUB_SHA\" --arg target \"aarch64-apple-darwin\" --arg asset \"velnor-actions-0.1.1-aarch64-apple-darwin\" --arg sha256 \"$digest\" --arg rust \"$RUST_VERSION\" --arg mr_boxington \"$MBX_VERSION\" '{\"schema\":1,\"version\":$version,\"repository\":$repository,\"commit\":$commit,\"target\":$target,\"asset\":$asset,\"sha256\":$digest,\"toolchain\":{\"rust\":$rust,\"mr-boxington\":$mr_boxington}}' > velnor-actions-0.1.1-aarch64-apple-darwin.provenance.json\nchmod 644 velnor-actions-0.1.1-aarch64-apple-darwin.provenance.json\ntest -s velnor-actions-0.1.1-aarch64-apple-darwin.provenance.json\n"
