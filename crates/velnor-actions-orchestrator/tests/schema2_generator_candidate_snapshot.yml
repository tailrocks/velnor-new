name: Generator candidate qualification
"on":
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
permissions:
  actions: read
  contents: read
jobs:
  candidate-gate:
    name: Pull-request candidate source gate
    if: github.event_name == 'pull_request' && github.repository == 'tailrocks/velnor-new' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      run_id: ${{ steps.candidate-context.outputs.run_id }}
      run_attempt: ${{ steps.candidate-context.outputs.run_attempt }}
      source_sha: ${{ steps.candidate-context.outputs.source_sha }}
    steps:
      - name: Check out pull-request merge SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Bind workflow authority to merge candidate source
        id: candidate-context
        env:
          VELNOR_PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: "set -eu\ntest \"$GITHUB_EVENT_NAME\" = \"pull_request\"\ntest \"$GITHUB_REPOSITORY\" = \"tailrocks/velnor-new\"\n[[ \"$VELNOR_PR_NUMBER\" =~ ^[1-9][0-9]*$ ]]\ntest \"$GITHUB_REF\" = \"refs/pull/$VELNOR_PR_NUMBER/merge\"\ntest \"$GITHUB_WORKFLOW_REF\" = \"$GITHUB_REPOSITORY/.github/workflows/generator-candidate-qualification.yml@$GITHUB_REF\"\ntest \"$GITHUB_WORKFLOW_SHA\" = \"$GITHUB_SHA\"\n[[ \"$GITHUB_SHA\" =~ ^[0-9a-f]{40}$ ]]\ntest \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\"\n[[ \"$GITHUB_RUN_ID\" =~ ^[1-9][0-9]*$ ]]\n[[ \"$GITHUB_RUN_ATTEMPT\" =~ ^[1-9][0-9]*$ ]]\n{\n  printf 'run_id=%s\\n' \"$GITHUB_RUN_ID\"\n  printf 'run_attempt=%s\\n' \"$GITHUB_RUN_ATTEMPT\"\n  printf 'source_sha=%s\\n' \"$GITHUB_SHA\"\n} >> \"$GITHUB_OUTPUT\"\n"
  candidate-build-linux-x64:
    name: Build pull-request candidate / Linux x86_64
    if: needs.candidate-gate.result == 'success' && needs.candidate-gate.outputs.run_id == github.run_id && needs.candidate-gate.outputs.run_attempt == github.run_attempt && needs.candidate-gate.outputs.source_sha == github.sha
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    needs:
      - candidate-gate
    outputs:
      run_id: ${{ steps.candidate-context.outputs.run_id }}
      run_attempt: ${{ steps.candidate-context.outputs.run_attempt }}
      source_sha: ${{ steps.candidate-context.outputs.source_sha }}
      asset_id: ${{ steps.candidate-assets.outputs.artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Check out pull-request merge SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Setup pinned Mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5
        with:
          cache: false
          env: false
          install: false
          version: 2026.9.18
      - name: Bind workflow authority to merge candidate source
        id: candidate-context
        env:
          VELNOR_PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: "set -eu\ntest \"$GITHUB_EVENT_NAME\" = \"pull_request\"\ntest \"$GITHUB_REPOSITORY\" = \"tailrocks/velnor-new\"\n[[ \"$VELNOR_PR_NUMBER\" =~ ^[1-9][0-9]*$ ]]\ntest \"$GITHUB_REF\" = \"refs/pull/$VELNOR_PR_NUMBER/merge\"\ntest \"$GITHUB_WORKFLOW_REF\" = \"$GITHUB_REPOSITORY/.github/workflows/generator-candidate-qualification.yml@$GITHUB_REF\"\ntest \"$GITHUB_WORKFLOW_SHA\" = \"$GITHUB_SHA\"\n[[ \"$GITHUB_SHA\" =~ ^[0-9a-f]{40}$ ]]\ntest \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\"\n[[ \"$GITHUB_RUN_ID\" =~ ^[1-9][0-9]*$ ]]\n[[ \"$GITHUB_RUN_ATTEMPT\" =~ ^[1-9][0-9]*$ ]]\n{\n  printf 'run_id=%s\\n' \"$GITHUB_RUN_ID\"\n  printf 'run_attempt=%s\\n' \"$GITHUB_RUN_ATTEMPT\"\n  printf 'source_sha=%s\\n' \"$GITHUB_SHA\"\n} >> \"$GITHUB_OUTPUT\"\n"
      - name: Install catalog tools and verify MBX
        shell: bash
        run: "set -eu\n\ncatalog_version() {\n  awk -F '\"' -v name=\"$1\" '\n    $1 == \"pub const \" name \": &str = \" && $3 == \";\" {\n      value = $2\n      count += 1\n    }\n    END {\n      if (count != 1 || value !~ /^[0-9]+\\.[0-9]+\\.[0-9]+$/) exit 1\n      print value\n    }\n  ' crates/velnor-actions-mise/src/catalog.rs\n}\n\n\ntest \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\"\nRUST_VERSION=\"$(catalog_version RUST_VERSION)\"\nMBX_VERSION=\"$(catalog_version MR_BOXINGTON_VERSION)\"\nmise --no-config --no-env --no-hooks install \"rust@$RUST_VERSION\" \"mr-boxington@$MBX_VERSION\"\nmbx_path=\"$(mise --no-config --no-env --no-hooks exec \"rust@$RUST_VERSION\" \"mr-boxington@$MBX_VERSION\" -- which mbx)\"\nmbx_desc=\"$(file -b \"$mbx_path\")\"\ncase \"$RUNNER_OS:$(uname -m):$mbx_desc\" in\n  Linux:x86_64:*ELF*x86-64*) ;;\n  macOS:arm64:*Mach-O*arm64*) ;;\n  *) echo \"MBX binary does not match official runner architecture: $mbx_desc\" >&2; exit 1 ;;\nesac\nmbx_version=\"$(mise --no-config --no-env --no-hooks exec \"rust@$RUST_VERSION\" \"mr-boxington@$MBX_VERSION\" -- mbx --version)\"\ncase \"$mbx_version\" in\n  *\"$MBX_VERSION\"*) ;;\n  *) echo \"unexpected MBX version: $mbx_version\" >&2; exit 1 ;;\nesac\n"
      - name: Build exact pull-request source
        shell: bash
        run: "\nset -eu\n\ncatalog_version() {\n  awk -F '\"' -v name=\"$1\" '\n    $1 == \"pub const \" name \": &str = \" && $3 == \";\" {\n      value = $2\n      count += 1\n    }\n    END {\n      if (count != 1 || value !~ /^[0-9]+\\.[0-9]+\\.[0-9]+$/) exit 1\n      print value\n    }\n  ' crates/velnor-actions-mise/src/catalog.rs\n}\n\ntest \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\"\ntest \"$RUNNER_OS:$(uname -m)\" = \"Linux:x86_64\"\nRUST_VERSION=\"$(catalog_version RUST_VERSION)\"\nMBX_VERSION=\"$(catalog_version MR_BOXINGTON_VERSION)\"\nmbx_stats() {\n  mise --no-config --no-env --no-hooks exec \"rust@$RUST_VERSION\" \"mr-boxington@$MBX_VERSION\" -- mbx stats --json\n}\nbefore=\"$(mbx_stats | jq -er '.savings.builds | select(type == \"number\")')\"\nmise --no-config --no-env --no-hooks exec \"rust@$RUST_VERSION\" \"mr-boxington@$MBX_VERSION\" -- mbx build --release --locked --package velnor-actions-cli --bin velnor-actions\nafter=\"$(mbx_stats | jq -er '.savings.builds | select(type == \"number\")')\"\ntest \"$after\" -gt \"$before\" || { echo \"MBX did not record this build\" >&2; exit 1; }\nasset=\"velnor-actions-0.1.1-x86_64-unknown-linux-gnu\"\ncp \"target/release/velnor-actions\" \"$asset\"\ntest -s \"$asset\"\ndesc=\"$(file -b \"$asset\")\"\ncase \"$desc\" in *ELF*x86-64*) ;; *) echo \"wrong Linux target: $desc\" >&2; exit 1 ;; esac\nsha256sum \"$asset\" > \"velnor-actions-0.1.1-x86_64-unknown-linux-gnu.sha256\"\ntest -s \"velnor-actions-0.1.1-x86_64-unknown-linux-gnu.sha256\"\n"
      - name: Record source-bound candidate provenance
        shell: bash
        run: "set -eu\n\ncatalog_version() {\n  awk -F '\"' -v name=\"$1\" '\n    $1 == \"pub const \" name \": &str = \" && $3 == \";\" {\n      value = $2\n      count += 1\n    }\n    END {\n      if (count != 1 || value !~ /^[0-9]+\\.[0-9]+\\.[0-9]+$/) exit 1\n      print value\n    }\n  ' crates/velnor-actions-mise/src/catalog.rs\n}\n\n\ntest \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\"\nRUST_VERSION=\"$(catalog_version RUST_VERSION)\"\nMBX_VERSION=\"$(catalog_version MR_BOXINGTON_VERSION)\"\ndigest=\"$(sha256sum velnor-actions-0.1.1-x86_64-unknown-linux-gnu | awk 'NR == 1 && length($1) == 64 && $1 !~ /[^0-9a-f]/ { print $1; next } { exit 1 } END { if (NR != 1) exit 1 }')\"\ntest -s velnor-actions-0.1.1-x86_64-unknown-linux-gnu.sha256\njq -n --arg version \"0.1.1\" --arg repository \"$GITHUB_REPOSITORY\" --arg commit \"$GITHUB_SHA\" --arg target \"x86_64-unknown-linux-gnu\" --arg asset \"velnor-actions-0.1.1-x86_64-unknown-linux-gnu\" --arg sha256 \"$digest\" --arg rust \"$RUST_VERSION\" --arg mr_boxington \"$MBX_VERSION\" '{\"schema\":1,\"version\":$version,\"repository\":$repository,\"commit\":$commit,\"target\":$target,\"asset\":$asset,\"sha256\":$digest,\"toolchain\":{\"rust\":$rust,\"mr-boxington\":$mr_boxington}}' > velnor-actions-0.1.1-x86_64-unknown-linux-gnu.provenance.json\nchmod 644 velnor-actions-0.1.1-x86_64-unknown-linux-gnu.provenance.json\ntest -s velnor-actions-0.1.1-x86_64-unknown-linux-gnu.provenance.json\n"
      - name: Upload pull-request candidate assets
        id: candidate-assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: error
          name: generator-pr-candidate-linux-x64-assets-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: "velnor-actions-0.1.1-x86_64-unknown-linux-gnu\nvelnor-actions-0.1.1-x86_64-unknown-linux-gnu.sha256\nvelnor-actions-0.1.1-x86_64-unknown-linux-gnu.provenance.json"
          retention-days: 1
  candidate-build-macos-arm64:
    name: Build pull-request candidate / macOS arm64
    if: needs.candidate-gate.result == 'success' && needs.candidate-gate.outputs.run_id == github.run_id && needs.candidate-gate.outputs.run_attempt == github.run_attempt && needs.candidate-gate.outputs.source_sha == github.sha
    runs-on: macos-15
    timeout-minutes: 120
    needs:
      - candidate-gate
    outputs:
      run_id: ${{ steps.candidate-context.outputs.run_id }}
      run_attempt: ${{ steps.candidate-context.outputs.run_attempt }}
