        run: "set -eu\ncandidate_dir=\"assets\"\ncandidate=\"$candidate_dir/velnor-actions-0.1.1-x86_64-apple-darwin\"\nsidecar=\"$candidate_dir/velnor-actions-0.1.1-x86_64-apple-darwin.sha256\"\nprovenance=\"$candidate_dir/velnor-actions-0.1.1-x86_64-apple-darwin.provenance.json\"\nmanifest=\"manifest-assets/release-manifest.json\"\ntest -f \"$candidate\" && test ! -L \"$candidate\" && test -s \"$candidate\"\ntest -f \"$sidecar\" && test ! -L \"$sidecar\" && test -s \"$sidecar\"\ntest -f \"$provenance\" && test ! -L \"$provenance\" && test -s \"$provenance\"\ntest -f \"$manifest\" && test ! -L \"$manifest\" && test -s \"$manifest\"\nchmod +x \"$candidate\"\nentries=\"$(find \"$candidate_dir\" -mindepth 1 -maxdepth 1 -print | wc -l | tr -d ' ')\"\ntest \"$entries\" = 3\nmanifest_entries=\"$(find \"manifest-assets\" -mindepth 1 -maxdepth 1 -print | wc -l | tr -d ' ')\"\ntest \"$manifest_entries\" = 1\ncatalog_version() {\n  awk -F '\"' -v name=\"$1\" '$1 == \"pub const \" name \": &str = \" && $3 == \";\" { value = $2; count += 1 } END { if (count != 1 || value !~ /^[0-9]+\\.[0-9]+\\.[0-9]+$/) exit 1; print value }' crates/velnor-actions-mise/src/catalog.rs\n}\ntest \"$GITHUB_WORKFLOW_SHA\" = \"$GITHUB_SHA\"\ntest \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\"\nmanifest_line=\"$(shasum -a 256 \"$manifest\")\"\nmanifest_sha=\"${manifest_line%% *}\"\ntest \"$manifest_sha\" = \"$VELNOR_RELEASE_MANIFEST_SHA256\"\njq -e --arg version \"0.1.1\" --arg repository \"tailrocks/velnor-new\" --arg commit \"$GITHUB_SHA\" --arg linux_target \"x86_64-unknown-linux-gnu\" --arg arm_target \"aarch64-apple-darwin\" --arg x64_target \"x86_64-apple-darwin\" --arg linux_asset \"velnor-actions-0.1.1-x86_64-unknown-linux-gnu\" --arg arm_asset \"velnor-actions-0.1.1-aarch64-apple-darwin\" --arg x64_asset \"velnor-actions-0.1.1-x86_64-apple-darwin\" --arg tag \"v0.1.1\" '\n  .schema == 1 and .version == $version and .repository == $repository and .commit == $commit and\n  (.targets | length == 3) and\n  [.targets[].target] == [$linux_target, $arm_target, $x64_target] and\n  all(.targets[];\n    (.sha256 | test(\"^[0-9a-f]{64}$\")) and\n    ((.target == $linux_target and .artifact == (\"https://github.com/\" + $repository + \"/releases/download/\" + $tag + \"/\" + $linux_asset)) or\n     (.target == $arm_target and .artifact == (\"https://github.com/\" + $repository + \"/releases/download/\" + $tag + \"/\" + $arm_asset)) or\n     (.target == $x64_target and .artifact == (\"https://github.com/\" + $repository + \"/releases/download/\" + $tag + \"/\" + $x64_asset)))\n  )\n' \"$manifest\" >/dev/null\nexpected=\"$(jq -er --arg target \"x86_64-apple-darwin\" '[.targets[] | select(.target == $target)] | if length == 1 then .[0].sha256 else error(\"target_digest_missing\") end' \"$manifest\")\"\ncase \"$expected\" in ''|*[!0-9a-f]*) exit 1 ;; esac\ntest \"${#expected}\" -eq 64\nsidecar_hash=\"$(awk -v name=\"velnor-actions-0.1.1-x86_64-apple-darwin\" 'NR != 1 || NF != 2 || $2 != name || length($1) != 64 || $1 !~ /^[0-9a-f]+$/ { exit 1 } { print $1 } END { if (NR != 1) exit 1 }' \"$sidecar\")\"\ntest \"$sidecar_hash\" = \"$expected\"\nactual_line=\"$(shasum -a 256 \"$candidate\")\"\nactual=\"${actual_line%% *}\"\ntest \"$actual\" = \"$expected\"\njq -e --arg version \"0.1.1\" --arg repository \"$GITHUB_REPOSITORY\" --arg commit \"$GITHUB_SHA\" --arg target \"x86_64-apple-darwin\" --arg asset \"velnor-actions-0.1.1-x86_64-apple-darwin\" --arg sha256 \"$expected\" --arg rust \"$(catalog_version RUST_VERSION)\" --arg mbx \"$(catalog_version MR_BOXINGTON_VERSION)\" '.schema == 1 and .version == $version and .repository == $repository and .commit == $commit and .target == $target and .asset == $asset and .sha256 == $sha256 and .toolchain.rust == $rust and .toolchain[\"mr-boxington\"] == $mbx' \"$provenance\" >/dev/null\ntest \"$(./\"$candidate\" --version)\" = \"velnor-actions 0.1.1\"\ndesc=\"$(file -b \"$candidate\")\"\ntest \"$RUNNER_OS:$(uname -m)\" = \"macOS:x86_64\"\ncase \"$desc\" in\n  *Mach-O*x86_64*) test \"$(sysctl -in sysctl.proc_translated 2>/dev/null || printf 0)\" != 1 && test \"$(lipo -archs \"$candidate\")\" = x86_64 ;;\n  *) echo \"candidate target mismatch: $desc\" >&2; exit 1 ;;\nesac\n"
      - name: Run candidate generation and fixture qualification
        env:
          VELNOR_RELEASE_MANIFEST_SHA256: ${{ needs.candidate-prepare-manifest.outputs.manifest_sha256 }}
        shell: bash
        run: "set -eu\ncandidate=\"$GITHUB_WORKSPACE/assets/velnor-actions-0.1.1-x86_64-apple-darwin\"\nmanifest=\"$GITHUB_WORKSPACE/manifest-assets/release-manifest.json\"\nmanifest_line=\"$(shasum -a 256 \"$manifest\")\"\nmanifest_sha=\"${manifest_line%% *}\"\ntest \"$manifest_sha\" = \"$VELNOR_RELEASE_MANIFEST_SHA256\"\nexpected=\"$(jq -er --arg target \"x86_64-apple-darwin\" '[.targets[] | select(.target == $target)] | if length == 1 then .[0].sha256 else error(\"target_digest_missing\") end' \"$manifest\")\"\ncheck_candidate() {\n  actual_line=\"$(shasum -a 256 \"$candidate\")\"\n  actual=\"${actual_line%% *}\"\n  test \"$actual\" = \"$expected\"\n}\ncheck_candidate\ncatalog_version() {\n  awk -F '\"' -v name=\"$1\" '$1 == \"pub const \" name \": &str = \" && $3 == \";\" { value = $2; count += 1 } END { if (count != 1 || value !~ /^[0-9]+\\.[0-9]+\\.[0-9]+$/) exit 1; print value }' crates/velnor-actions-mise/src/catalog.rs\n}\nrust_version=\"$(catalog_version RUST_VERSION)\"\nactionlint_version=\"$(catalog_version ACTIONLINT_VERSION)\"\nshellcheck_version=\"$(catalog_version SHELLCHECK_VERSION)\"\nzizmor_version=\"$(catalog_version ZIZMOR_VERSION)\"\nrun_candidate() {\n  status=0\n  mise --no-config --no-env --no-hooks exec \"rust@$rust_version\" \"actionlint@$actionlint_version\" \"shellcheck@$shellcheck_version\" \"zizmor@$zizmor_version\" -- \"$candidate\" \"$@\" || status=\"$?\"\n  check_candidate || return 1\n  return \"$status\"\n}\ntemp=\"$(mktemp -d \"$RUNNER_TEMP/velnor-release-qualification.XXXXXXXX\")\"\ntrap 'rm -rf \"$temp\"' EXIT\nprepare_repo() {\n  case_name=\"$1\"\n  repo=\"$temp/$case_name\"\n  mkdir -p \"$repo\"\n  cp -R \"$GITHUB_WORKSPACE/fixtures/parity/$case_name/input/.\" \"$repo/\"\n  git -C \"$repo\" init -q\n  git -C \"$repo\" -c user.name='Velnor release qualification' -c user.email='release-qualification@users.noreply.github.com' add --all\n  git -C \"$repo\" -c user.name='Velnor release qualification' -c user.email='release-qualification@users.noreply.github.com' commit -qm 'qualification fixture'\n}\nfor case_name in minimal-cargo multi-crate ignored-stack; do\n  prepare_repo \"$case_name\"\n  repo=\"$temp/$case_name\"\n  preview=\"$temp/$case_name-preview\"\n  (cd \"$repo\" && run_candidate plan > \"$temp/$case_name-plan.stdout\" 2> \"$temp/$case_name-plan.stderr\")\n  test ! -s \"$temp/$case_name-plan.stderr\"\n  repo_path=\"$(cd \"$repo\" && pwd -P)\"\n  head=\"$(git -C \"$repo\" rev-parse HEAD)\"\n  grep -Fq \"Repository: $repo_path\" \"$temp/$case_name-plan.stdout\"\n  sed -e \"s|Repository: $repo_path|Repository: <repo>|g\" -e \"s|$head|<head>|g\" \"$temp/$case_name-plan.stdout\" > \"$temp/$case_name-plan.normalized.txt\"\n  cmp \"$temp/$case_name-plan.normalized.txt\" \"$GITHUB_WORKSPACE/fixtures/parity/$case_name/expected/plan.txt\"\n  (cd \"$repo\" && run_candidate generate --output-dir \"$preview\" > \"$temp/$case_name-generate.stdout\" 2> \"$temp/$case_name-generate.stderr\")\n  cmp \"$preview/.github/workflows/ci.yml\" \"$GITHUB_WORKSPACE/fixtures/parity/$case_name/expected/ci.yml\"\n  cmp \"$preview/.github/actionlint.yaml\" \"$GITHUB_WORKSPACE/fixtures/parity/$case_name/expected/actionlint.yaml\"\n  test -z \"$(git -C \"$repo\" status --porcelain)\"\n  check_candidate\ndone\nfor case_name in malformed malformed-ignored; do\n  prepare_repo \"$case_name\"\n  repo=\"$temp/$case_name\"\n  status=0\n  (cd \"$repo\" && run_candidate plan > \"$temp/$case_name-plan.stdout\" 2> \"$temp/$case_name-plan.stderr\") || status=\"$?\"\n  test \"$status\" = \"$(cat \"$GITHUB_WORKSPACE/fixtures/parity/$case_name/expected/plan.exit\")\"\n  sed 's/\\(malformed_manifest:Cargo.toml: \\).*/\\1<cargo-diagnostic>/' \"$temp/$case_name-plan.stderr\" > \"$temp/$case_name-plan.normalized.stderr\"\n  cmp \"$temp/$case_name-plan.normalized.stderr\" \"$GITHUB_WORKSPACE/fixtures/parity/$case_name/expected/plan.stderr.txt\"\n  test -z \"$(git -C \"$repo\" status --porcelain)\"\n  check_candidate\ndone\nmise --no-config --no-env --no-hooks exec \"rust@$rust_version\" -- scripts/capture-opentofu-goldens.sh check-release \"$candidate\" \"$manifest\" \"$VELNOR_RELEASE_MANIFEST_SHA256\"\ncheck_candidate\n"
  candidate-qualification-required:
    name: Qualify pull-request candidate / all targets
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs:
      - candidate-gate
      - candidate-prepare-manifest
      - candidate-build-linux-x64
      - candidate-build-macos-arm64
      - candidate-build-macos-x64
      - candidate-qualify-linux-x64
      - candidate-qualify-macos-arm64
      - candidate-qualify-macos-x64
    permissions: {}
    steps:
      - name: Require current-run candidate tasks
        env:
          VELNOR_EXPECT_RUN_ID: ${{ github.run_id }}
          VELNOR_EXPECT_RUN_ATTEMPT: ${{ github.run_attempt }}
          VELNOR_EXPECT_SOURCE_SHA: ${{ github.sha }}
          VELNOR_NEEDS_CANDIDATE_GATE_RESULT: ${{ needs.candidate-gate.result }}
          VELNOR_NEEDS_CANDIDATE_GATE_RUN_ID: ${{ needs.candidate-gate.outputs.run_id }}
          VELNOR_NEEDS_CANDIDATE_GATE_RUN_ATTEMPT: ${{ needs.candidate-gate.outputs.run_attempt }}
          VELNOR_NEEDS_CANDIDATE_GATE_SOURCE_SHA: ${{ needs.candidate-gate.outputs.source_sha }}
          VELNOR_NEEDS_CANDIDATE_PREPARE_MANIFEST_RESULT: ${{ needs.candidate-prepare-manifest.result }}
          VELNOR_NEEDS_CANDIDATE_PREPARE_MANIFEST_RUN_ID: ${{ needs.candidate-prepare-manifest.outputs.run_id }}
          VELNOR_NEEDS_CANDIDATE_PREPARE_MANIFEST_RUN_ATTEMPT: ${{ needs.candidate-prepare-manifest.outputs.run_attempt }}
          VELNOR_NEEDS_CANDIDATE_PREPARE_MANIFEST_SOURCE_SHA: ${{ needs.candidate-prepare-manifest.outputs.source_sha }}
          VELNOR_NEEDS_CANDIDATE_BUILD_LINUX_X64_RESULT: ${{ needs.candidate-build-linux-x64.result }}
          VELNOR_NEEDS_CANDIDATE_BUILD_LINUX_X64_RUN_ID: ${{ needs.candidate-build-linux-x64.outputs.run_id }}
          VELNOR_NEEDS_CANDIDATE_BUILD_LINUX_X64_RUN_ATTEMPT: ${{ needs.candidate-build-linux-x64.outputs.run_attempt }}
          VELNOR_NEEDS_CANDIDATE_BUILD_LINUX_X64_SOURCE_SHA: ${{ needs.candidate-build-linux-x64.outputs.source_sha }}
          VELNOR_NEEDS_CANDIDATE_BUILD_MACOS_ARM64_RESULT: ${{ needs.candidate-build-macos-arm64.result }}
          VELNOR_NEEDS_CANDIDATE_BUILD_MACOS_ARM64_RUN_ID: ${{ needs.candidate-build-macos-arm64.outputs.run_id }}
          VELNOR_NEEDS_CANDIDATE_BUILD_MACOS_ARM64_RUN_ATTEMPT: ${{ needs.candidate-build-macos-arm64.outputs.run_attempt }}
          VELNOR_NEEDS_CANDIDATE_BUILD_MACOS_ARM64_SOURCE_SHA: ${{ needs.candidate-build-macos-arm64.outputs.source_sha }}
          VELNOR_NEEDS_CANDIDATE_BUILD_MACOS_X64_RESULT: ${{ needs.candidate-build-macos-x64.result }}
          VELNOR_NEEDS_CANDIDATE_BUILD_MACOS_X64_RUN_ID: ${{ needs.candidate-build-macos-x64.outputs.run_id }}
          VELNOR_NEEDS_CANDIDATE_BUILD_MACOS_X64_RUN_ATTEMPT: ${{ needs.candidate-build-macos-x64.outputs.run_attempt }}
          VELNOR_NEEDS_CANDIDATE_BUILD_MACOS_X64_SOURCE_SHA: ${{ needs.candidate-build-macos-x64.outputs.source_sha }}
          VELNOR_NEEDS_CANDIDATE_QUALIFY_LINUX_X64_RESULT: ${{ needs.candidate-qualify-linux-x64.result }}
          VELNOR_NEEDS_CANDIDATE_QUALIFY_LINUX_X64_RUN_ID: ${{ needs.candidate-qualify-linux-x64.outputs.run_id }}
          VELNOR_NEEDS_CANDIDATE_QUALIFY_LINUX_X64_RUN_ATTEMPT: ${{ needs.candidate-qualify-linux-x64.outputs.run_attempt }}
          VELNOR_NEEDS_CANDIDATE_QUALIFY_LINUX_X64_SOURCE_SHA: ${{ needs.candidate-qualify-linux-x64.outputs.source_sha }}
          VELNOR_NEEDS_CANDIDATE_QUALIFY_MACOS_ARM64_RESULT: ${{ needs.candidate-qualify-macos-arm64.result }}
          VELNOR_NEEDS_CANDIDATE_QUALIFY_MACOS_ARM64_RUN_ID: ${{ needs.candidate-qualify-macos-arm64.outputs.run_id }}
          VELNOR_NEEDS_CANDIDATE_QUALIFY_MACOS_ARM64_RUN_ATTEMPT: ${{ needs.candidate-qualify-macos-arm64.outputs.run_attempt }}
          VELNOR_NEEDS_CANDIDATE_QUALIFY_MACOS_ARM64_SOURCE_SHA: ${{ needs.candidate-qualify-macos-arm64.outputs.source_sha }}
          VELNOR_NEEDS_CANDIDATE_QUALIFY_MACOS_X64_RESULT: ${{ needs.candidate-qualify-macos-x64.result }}
          VELNOR_NEEDS_CANDIDATE_QUALIFY_MACOS_X64_RUN_ID: ${{ needs.candidate-qualify-macos-x64.outputs.run_id }}
          VELNOR_NEEDS_CANDIDATE_QUALIFY_MACOS_X64_RUN_ATTEMPT: ${{ needs.candidate-qualify-macos-x64.outputs.run_attempt }}
          VELNOR_NEEDS_CANDIDATE_QUALIFY_MACOS_X64_SOURCE_SHA: ${{ needs.candidate-qualify-macos-x64.outputs.source_sha }}
        shell: bash
        run: "set -eu\ntest \"$VELNOR_NEEDS_CANDIDATE_GATE_RESULT\" = \"success\"\ntest \"$VELNOR_NEEDS_CANDIDATE_GATE_RUN_ID\" = \"$VELNOR_EXPECT_RUN_ID\"\ntest \"$VELNOR_NEEDS_CANDIDATE_GATE_RUN_ATTEMPT\" = \"$VELNOR_EXPECT_RUN_ATTEMPT\"\ntest \"$VELNOR_NEEDS_CANDIDATE_GATE_SOURCE_SHA\" = \"$VELNOR_EXPECT_SOURCE_SHA\"\ntest \"$VELNOR_NEEDS_CANDIDATE_PREPARE_MANIFEST_RESULT\" = \"success\"\ntest \"$VELNOR_NEEDS_CANDIDATE_PREPARE_MANIFEST_RUN_ID\" = \"$VELNOR_EXPECT_RUN_ID\"\ntest \"$VELNOR_NEEDS_CANDIDATE_PREPARE_MANIFEST_RUN_ATTEMPT\" = \"$VELNOR_EXPECT_RUN_ATTEMPT\"\ntest \"$VELNOR_NEEDS_CANDIDATE_PREPARE_MANIFEST_SOURCE_SHA\" = \"$VELNOR_EXPECT_SOURCE_SHA\"\ntest \"$VELNOR_NEEDS_CANDIDATE_BUILD_LINUX_X64_RESULT\" = \"success\"\ntest \"$VELNOR_NEEDS_CANDIDATE_BUILD_LINUX_X64_RUN_ID\" = \"$VELNOR_EXPECT_RUN_ID\"\ntest \"$VELNOR_NEEDS_CANDIDATE_BUILD_LINUX_X64_RUN_ATTEMPT\" = \"$VELNOR_EXPECT_RUN_ATTEMPT\"\ntest \"$VELNOR_NEEDS_CANDIDATE_BUILD_LINUX_X64_SOURCE_SHA\" = \"$VELNOR_EXPECT_SOURCE_SHA\"\ntest \"$VELNOR_NEEDS_CANDIDATE_BUILD_MACOS_ARM64_RESULT\" = \"success\"\ntest \"$VELNOR_NEEDS_CANDIDATE_BUILD_MACOS_ARM64_RUN_ID\" = \"$VELNOR_EXPECT_RUN_ID\"\ntest \"$VELNOR_NEEDS_CANDIDATE_BUILD_MACOS_ARM64_RUN_ATTEMPT\" = \"$VELNOR_EXPECT_RUN_ATTEMPT\"\ntest \"$VELNOR_NEEDS_CANDIDATE_BUILD_MACOS_ARM64_SOURCE_SHA\" = \"$VELNOR_EXPECT_SOURCE_SHA\"\ntest \"$VELNOR_NEEDS_CANDIDATE_BUILD_MACOS_X64_RESULT\" = \"success\"\ntest \"$VELNOR_NEEDS_CANDIDATE_BUILD_MACOS_X64_RUN_ID\" = \"$VELNOR_EXPECT_RUN_ID\"\ntest \"$VELNOR_NEEDS_CANDIDATE_BUILD_MACOS_X64_RUN_ATTEMPT\" = \"$VELNOR_EXPECT_RUN_ATTEMPT\"\ntest \"$VELNOR_NEEDS_CANDIDATE_BUILD_MACOS_X64_SOURCE_SHA\" = \"$VELNOR_EXPECT_SOURCE_SHA\"\ntest \"$VELNOR_NEEDS_CANDIDATE_QUALIFY_LINUX_X64_RESULT\" = \"success\"\ntest \"$VELNOR_NEEDS_CANDIDATE_QUALIFY_LINUX_X64_RUN_ID\" = \"$VELNOR_EXPECT_RUN_ID\"\ntest \"$VELNOR_NEEDS_CANDIDATE_QUALIFY_LINUX_X64_RUN_ATTEMPT\" = \"$VELNOR_EXPECT_RUN_ATTEMPT\"\ntest \"$VELNOR_NEEDS_CANDIDATE_QUALIFY_LINUX_X64_SOURCE_SHA\" = \"$VELNOR_EXPECT_SOURCE_SHA\"\ntest \"$VELNOR_NEEDS_CANDIDATE_QUALIFY_MACOS_ARM64_RESULT\" = \"success\"\ntest \"$VELNOR_NEEDS_CANDIDATE_QUALIFY_MACOS_ARM64_RUN_ID\" = \"$VELNOR_EXPECT_RUN_ID\"\ntest \"$VELNOR_NEEDS_CANDIDATE_QUALIFY_MACOS_ARM64_RUN_ATTEMPT\" = \"$VELNOR_EXPECT_RUN_ATTEMPT\"\ntest \"$VELNOR_NEEDS_CANDIDATE_QUALIFY_MACOS_ARM64_SOURCE_SHA\" = \"$VELNOR_EXPECT_SOURCE_SHA\"\ntest \"$VELNOR_NEEDS_CANDIDATE_QUALIFY_MACOS_X64_RESULT\" = \"success\"\ntest \"$VELNOR_NEEDS_CANDIDATE_QUALIFY_MACOS_X64_RUN_ID\" = \"$VELNOR_EXPECT_RUN_ID\"\ntest \"$VELNOR_NEEDS_CANDIDATE_QUALIFY_MACOS_X64_RUN_ATTEMPT\" = \"$VELNOR_EXPECT_RUN_ATTEMPT\"\ntest \"$VELNOR_NEEDS_CANDIDATE_QUALIFY_MACOS_X64_SOURCE_SHA\" = \"$VELNOR_EXPECT_SOURCE_SHA\"\n"
