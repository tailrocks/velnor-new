name: Build macOS x86_64 velnor-actions
description: Shared steps for Build macOS x86_64 velnor-actions
runs:
  using: composite
  steps:
    - name: Setup Mise
      uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
      with:
        version: 2026.10.7
        sha256: f5171e341518a57e8c4e9280e28443e35d66212c51164c83be76794e0a78b014
        install: "false"
        env: "false"
        cache: "false"
        cache_save: "false"
    - name: Install pinned Rust and MBX
      env:
        GITHUB_TOKEN: ${{ github.token }}
      shell: bash
      run: "set -eu\n: \"${GITHUB_TOKEN:?missing workflow token}\"\nmise --no-config --no-env --no-hooks install rust@1.98.1 mr-boxington@1.21.1"
    - name: Install x86_64-apple-darwin Rust target
      shell: bash
      run: mise --no-config --no-env --no-hooks exec rust@1.98.1 -- rustup target add --toolchain 1.98.1-aarch64-apple-darwin x86_64-apple-darwin
    - name: Build velnor-actions with MBX
      shell: bash
      run: "set -eu\nenv -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_RUNTIME_TOKEN -u GITHUB_TOKEN -u MISE_GITHUB_TOKEN -u GH_TOKEN -u GH_HOST -u GH_CONFIG_DIR mise --no-config --no-env --no-hooks exec rust@1.98.1 mr-boxington@1.21.1 -- mbx build --release --locked --package velnor-actions-cli --bin velnor-actions --target x86_64-apple-darwin\ncp target/x86_64-apple-darwin/release/velnor-actions velnor-actions-0.1.6-x86_64-apple-darwin\ntest -s velnor-actions-0.1.6-x86_64-apple-darwin"
    - name: Verify Mach-O x86_64 architecture
      shell: bash
      run: "set -eu\ndesc=\"$(file -b velnor-actions-0.1.6-x86_64-apple-darwin)\"\ncase \"$desc\" in\n  *Mach-O*x86_64*) ;;\n  *) echo \"not a x86_64 Mach-O: $desc\" >&2; exit 1 ;;\nesac"
    - name: Checksum built bytes
      shell: bash
      run: "set -eu\nshasum -a 256 velnor-actions-0.1.6-x86_64-apple-darwin > velnor-actions-0.1.6-x86_64-apple-darwin.sha256"
    - name: Record candidate provenance
      shell: bash
      run: "set -eu\ndigest=\"$(awk -v expected='velnor-actions-0.1.6-x86_64-apple-darwin' 'NR == 1 { if (NF != 2 || length($1) != 64 || $1 !~ /^[0-9a-f]+$/ || $2 != expected) exit 1; print $1; next } { exit 1 } END { if (NR != 1) exit 1 }' 'velnor-actions-0.1.6-x86_64-apple-darwin.sha256')\"\njq -n --arg repository \"$GITHUB_REPOSITORY\" --arg commit \"$GITHUB_SHA\" --arg target \"x86_64-apple-darwin\" --arg asset \"velnor-actions-0.1.6-x86_64-apple-darwin\" --arg sha256 \"$digest\" --arg rust '1.98.1' --arg mr_boxington '1.21.1' '{\"schema\":1,\"version\":\"0.1.6\",\"repository\":$repository,\"commit\":$commit,\"target\":$target,\"asset\":$asset,\"sha256\":$sha256,\"toolchain\":{\"rust\":$rust,\"mr-boxington\":$mr_boxington}}' > velnor-actions-0.1.6-x86_64-apple-darwin.provenance.json\nchmod 755 velnor-actions-0.1.6-x86_64-apple-darwin\nchmod 644 velnor-actions-0.1.6-x86_64-apple-darwin.sha256 velnor-actions-0.1.6-x86_64-apple-darwin.provenance.json\ntest -s velnor-actions-0.1.6-x86_64-apple-darwin.provenance.json\ntest -s velnor-actions-0.1.6-x86_64-apple-darwin"
    - name: Package candidate preserving executable mode
      shell: bash
      run: "set -eu\ntar -cf generator-macos-intel-assets.tar velnor-actions-0.1.6-x86_64-apple-darwin velnor-actions-0.1.6-x86_64-apple-darwin.sha256 velnor-actions-0.1.6-x86_64-apple-darwin.provenance.json\ntest -s generator-macos-intel-assets.tar"
