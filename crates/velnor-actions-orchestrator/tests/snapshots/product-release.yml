name: Velnor product releases
"on":
  workflow_dispatch: {}
concurrency:
  group: ${{ github.repository }}-product-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release-eligibility:
    name: Check release source eligibility
    runs-on: ubuntu-26.04
    timeout-minutes: 70
    permissions:
      actions: read
      contents: read
    outputs:
      source_sha: ${{ steps.check.outputs.source_sha }}
      workflow_authority_sha: ${{ steps.check.outputs.workflow_authority_sha }}
      ci_run_id: ${{ steps.check.outputs.ci_run_id }}
      ci_attempt: ${{ steps.check.outputs.ci_attempt }}
    steps:
      - name: Check out exact event source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "1"
          persist-credentials: "false"
          ref: ${{ github.sha }}
      - name: Setup Mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.10.6
          sha256: 3f44343eebc7e0d6623bcea46e304864f02dff648edd75c82871b53cc697b366
          install: "false"
          env: "false"
          cache: "false"
          cache_save: "false"
      - name: Install pinned release gate tools
        shell: bash
        run: mise --no-config --no-env --no-hooks install gh@2.102.0 actionlint@1.7.12 shellcheck@0.11.0 zizmor@1.30.1
      - name: Run actionlint
        shell: bash
        run: mise --no-config --no-env --no-hooks exec actionlint@1.7.12 shellcheck@0.11.0 -- actionlint -color
      - name: Run zizmor
        shell: bash
        run: env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_RUNTIME_TOKEN -u GITHUB_TOKEN -u MISE_GITHUB_TOKEN -u GH_TOKEN -u GH_HOST -u GH_CONFIG_DIR mise --no-config --no-env --no-hooks exec zizmor@1.30.1 -- zizmor --no-online-audits --config .zizmor.yml .github/workflows
      - name: Check release freshness
        shell: bash
        run: bash scripts/check-freshness.sh
      - name: Verify main and latest Required CI
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: "set -euo pipefail\n\ngh() {\n  (\n    mise --no-config --no-env --no-hooks exec gh@2.102.0 -- gh \"$@\" & _velnor_gh_pid=$!\n    ( sleep 60; kill -TERM \"$_velnor_gh_pid\" 2>/dev/null; sleep 5; kill -KILL \"$_velnor_gh_pid\" 2>/dev/null ) </dev/null >/dev/null 2>&1 & _velnor_gh_watch=$!\n    _velnor_gh_status=0\n    wait \"$_velnor_gh_pid\" || _velnor_gh_status=$?\n    kill -KILL \"$_velnor_gh_watch\" 2>/dev/null || true\n    wait \"$_velnor_gh_watch\" 2>/dev/null || true\n    exit \"$_velnor_gh_status\"\n  ) </dev/null\n}\nexport -f gh\n\nrelease_eligibility() {\nlocal -r repository='tailrocks/velnor-new'\nlocal -r ci_workflow_path='.github/workflows/ci.yml'\nlocal -r source_sha=\"${GITHUB_SHA-}\"\nlocal -r authority_sha=\"${GITHUB_WORKFLOW_SHA-}\"\n\nfail() {\n  printf 'release eligibility: %s\\n' \"$1\" >&2\n  exit 1\n}\n\nis_sha() {\n  local candidate=\"$1\"\n  [[ \"${#candidate}\" -eq 40 && \"$candidate\" != *[!0123456789abcdef]* ]]\n}\n\n[[ \"${GITHUB_REPOSITORY-}\" == \"$repository\" ]] || fail 'unexpected repository'\n[[ \"${GITHUB_REF-}\" == 'refs/heads/main' ]] || fail 'source ref is not main'\n[[ \"${GITHUB_WORKFLOW_REF-}\" == \"$repository/.github/workflows/product-release.yml@refs/heads/main\" ]] || fail 'unexpected workflow authority path or ref'\ncase \"${GITHUB_EVENT_NAME-}\" in\n  workflow_dispatch) ;;\n  *) fail 'event is not eligible' ;;\nesac\nis_sha \"$source_sha\" || fail 'source SHA is malformed'\nis_sha \"$authority_sha\" || fail 'workflow authority SHA is malformed'\n[[ \"$source_sha\" == \"$authority_sha\" ]] || fail 'workflow authority and source differ'\nlocal checkout_sha\ncheckout_sha=\"$(git rev-parse HEAD)\" || fail 'cannot read checked-out source SHA'\n[[ \"$checkout_sha\" == \"$source_sha\" ]] || fail 'checked-out source SHA differs'\n[[ -n \"${GH_TOKEN-}\" ]] || fail 'read-only GitHub token is missing'\n[[ -n \"${GITHUB_OUTPUT-}\" ]] || fail 'workflow output path is missing'\n\nlocal poll_limit=\"${VELNOR_RELEASE_CI_POLL_LIMIT:-240}\"\nlocal poll_seconds=\"${VELNOR_RELEASE_CI_POLL_SECONDS:-15}\"\n[[ \"$poll_limit\" =~ ^[1-9][0-9]*$ ]] || fail 'poll limit is invalid'\n[[ \"$poll_seconds\" =~ ^[0-9]+$ ]] || fail 'poll interval is invalid'\n\ngh_api() {\n  gh api \"$@\"\n}\n\ncurrent_main_sha() {\n  gh_api \"repos/$repository/commits/main\" | jq -er '.sha' \\\n    || fail 'main commit response is invalid'\n}\n\nlatest_ci_run() {\n  gh_api --paginate --slurp -X GET \\\n    \"repos/$repository/actions/workflows/ci.yml/runs?head_sha=$source_sha&branch=main&event=push&per_page=100\" \\\n    | jq -c \\\n        --arg source_sha \"$source_sha\" \\\n        --arg workflow_path \"$ci_workflow_path\" \\\n        --arg repository \"$repository\" \\\n        '\n  [ .[] | (.workflow_runs // [])[] |\n    select(.path == $workflow_path\n      and .event == \"push\"\n      and .head_branch == \"main\"\n      and .head_sha == $source_sha\n      and .head_repository.full_name == $repository\n      and (.id | type) == \"number\"\n      and (.run_number | type) == \"number\"\n      and (.run_attempt | type) == \"number\")\n  ] as $runs\n  | if ($runs | length) == 0 then null\n    else\n      ($runs | sort_by([.run_number, .id])) as $ordered\n      | $ordered[-1] as $latest\n      | [$ordered[] | select(.run_number == $latest.run_number)] as $same_number\n      | if ($same_number | length) != 1\n        then error(\"ambiguous CI run number\")\n        else $latest\n        end\n    end\n' \\\n    || fail 'CI run response is invalid'\n}\n\nassert_current_tip() {\n  local current_sha\n  current_sha=\"$(current_main_sha)\" || fail 'main commit lookup failed'\n  [[ \"$current_sha\" == \"$source_sha\" ]] || fail 'source is no longer the main tip'\n}\n\nassert_required_job() {\n  local run_id=\"$1\"\n  local run_attempt=\"$2\"\n  local jobs required\n  jobs=\"$(gh_api --paginate --slurp -X GET \\\n    \"repos/$repository/actions/runs/$run_id/attempts/$run_attempt/jobs?per_page=100\")\" \\\n    || fail 'Required job lookup failed'\n  required=\"$(printf '%s\\n' \"$jobs\" | jq -c \\\n    --argjson run_id \"$run_id\" \\\n    --argjson run_attempt \"$run_attempt\" \\\n    --arg source_sha \"$source_sha\" \\\n    '\n  [ .[].jobs[]? | select(.name == \"Required\") ] as $required\n  | if ($required | length) != 1 then error(\"expected one Required job\")\n    else $required[0]\n      | if .run_id == $run_id\n          and .run_attempt == $run_attempt\n          and .head_sha == $source_sha\n          and .head_branch == \"main\"\n        then .\n        else error(\"Required job identity mismatch\")\n        end\n    end\n')\" || fail 'Required job response is invalid'\n  local status conclusion actual_run actual_sha actual_branch\n  status=\"$(jq -er '.status' <<<\"$required\")\" || fail 'Required job status is invalid'\n  conclusion=\"$(jq -er '.conclusion' <<<\"$required\")\" \\\n    || fail 'Required job conclusion is invalid'\n  actual_run=\"$(jq -er '.run_id' <<<\"$required\")\" || fail 'Required job run ID is invalid'\n  actual_sha=\"$(jq -er '.head_sha' <<<\"$required\")\" || fail 'Required job source SHA is invalid'\n  actual_branch=\"$(jq -er '.head_branch' <<<\"$required\")\" \\\n    || fail 'Required job branch is invalid'\n  [[ \"$status\" == 'completed' ]] || fail 'Required job is not complete'\n  [[ \"$conclusion\" == 'success' ]] || fail 'Required job did not succeed'\n  [[ \"$actual_run\" == \"$run_id\" ]] || fail 'Required job has a different run ID'\n  [[ \"$actual_sha\" == \"$source_sha\" ]] || fail 'Required job has a different source SHA'\n  [[ \"$actual_branch\" == 'main' ]] || fail 'Required job is not on main'\n}\n\nlocal successful=false\nlocal attempt=0\nwhile [[ \"$attempt\" -lt \"$poll_limit\" ]]; do\n  assert_current_tip\n  run=\"$(latest_ci_run)\" || fail 'latest CI run lookup failed'\n  if [[ \"$run\" != 'null' ]]; then\n    status=\"$(jq -er '.status' <<<\"$run\")\" || fail 'latest CI run status is invalid'\n    case \"$status\" in\n      completed)\n        run_conclusion=\"$(jq -er '.conclusion' <<<\"$run\")\" \\\n          || fail 'latest CI run conclusion is invalid'\n        [[ \"$run_conclusion\" == 'success' ]] || fail 'latest exact-source CI run did not succeed'\n        run_id=\"$(jq -er '.id' <<<\"$run\")\" || fail 'latest CI run ID is invalid'\n        run_attempt=\"$(jq -er '.run_attempt' <<<\"$run\")\" \\\n          || fail 'latest CI run attempt is invalid'\n        assert_required_job \"$run_id\" \"$run_attempt\"\n        latest_again=\"$(latest_ci_run)\" || fail 'latest CI recheck failed'\n        latest_id=\"$(jq -er '.id' <<<\"$latest_again\")\" || fail 'latest CI recheck ID is invalid'\n        latest_attempt=\"$(jq -er '.run_attempt' <<<\"$latest_again\")\" \\\n          || fail 'latest CI recheck attempt is invalid'\n        latest_status=\"$(jq -er '.status' <<<\"$latest_again\")\" \\\n          || fail 'latest CI recheck status is invalid'\n        latest_conclusion=\"$(jq -er '.conclusion' <<<\"$latest_again\")\" \\\n          || fail 'latest CI recheck conclusion is invalid'\n        [[ \"$latest_id\" == \"$run_id\" ]] || fail 'latest CI run changed during eligibility check'\n        [[ \"$latest_attempt\" == \"$run_attempt\" ]] || fail 'latest CI attempt changed during eligibility check'\n        [[ \"$latest_status\" == 'completed' ]] || fail 'latest CI run restarted during eligibility check'\n        [[ \"$latest_conclusion\" == 'success' ]] || fail 'latest CI run changed during eligibility check'\n        assert_current_tip\n        printf 'source_sha=%s\\n' \"$source_sha\" >> \"$GITHUB_OUTPUT\"\n        printf 'workflow_authority_sha=%s\\n' \"$authority_sha\" >> \"$GITHUB_OUTPUT\"\n        printf 'ci_run_id=%s\\n' \"$run_id\" >> \"$GITHUB_OUTPUT\"\n        printf 'ci_attempt=%s\\n' \"$run_attempt\" >> \"$GITHUB_OUTPUT\"\n        successful=true; break\n        ;;\n      queued|in_progress|pending|waiting|requested) ;;\n      *) fail 'latest exact-source CI run has an unknown status' ;;\n    esac\n  fi\n  attempt=$((attempt + 1))\n  if [[ \"$attempt\" -lt \"$poll_limit\" ]]; then\n    sleep \"$poll_seconds\"\n  fi\ndone\n[[ \"$successful\" == true ]] || fail 'latest exact-source CI run did not become successful before timeout'\n}\n\nrelease_eligibility\nexit 0\n"
  prepare-images:
    name: Prepare runner images release
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs:
      - release-eligibility
    permissions:
      attestations: read
      actions: read
      contents: read
    outputs:
      action: ${{ steps.reconcile.outputs.action }}
    steps:
      - name: Setup Mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.10.6
          sha256: 3f44343eebc7e0d6623bcea46e304864f02dff648edd75c82871b53cc697b366
          install: "false"
          env: "false"
          cache: "false"
          cache_save: "false"
      - name: Install pinned GitHub CLI
        shell: bash
        run: mise --no-config --no-env --no-hooks install gh@2.102.0
      - name: Reconcile immutable family release
        id: reconcile
        env:
          GH_TOKEN: ${{ github.token }}
          VELNOR_SOURCE_SHA: ${{ needs.release-eligibility.outputs.source_sha }}
          VELNOR_WORKFLOW_AUTHORITY_SHA: ${{ needs.release-eligibility.outputs.workflow_authority_sha }}
        run: "set -euo pipefail\n\nreadonly repository='tailrocks/velnor-new'\nreadonly source_sha=\"$VELNOR_SOURCE_SHA\"\nreadonly authority_sha=\"$VELNOR_WORKFLOW_AUTHORITY_SHA\"\nreadonly tag_prefix='runner'\nreadonly fixed_tag=''\nif [[ -n \"$fixed_tag\" ]]; then\n  prepare_tag=\"$fixed_tag\"\nelse\n  prepare_tag=\"${tag_prefix}-${source_sha}\"\nfi\nreadonly prepare_tag\nreadonly prepare_expected_assets='[\"velnor-runner-linux-amd64.tar\",\"velnor-dind-linux-amd64.tar\",\"velnor-resource-probe-linux-amd64.tar\",\"RESOURCE_PROBE_MANIFEST.json\",\"SHA256SUMS\"]'\n\nfail() {\n  printf 'release reconciliation (runner images): %s\\n' \"$1\" >&2\n  exit 1\n}\n\n[[ \"$source_sha\" =~ ^[0-9a-f]{40}$ ]] || fail 'source SHA is malformed'\n[[ \"$authority_sha\" == \"$source_sha\" ]] || fail 'workflow authority differs from source'\n[[ -n \"$GH_TOKEN\" ]] || fail 'read-only GitHub token is missing'\n\ngh() {\n  (\n    mise --no-config --no-env --no-hooks exec gh@2.102.0 -- gh \"$@\" & _velnor_gh_pid=$!\n    ( sleep 60; kill -TERM \"$_velnor_gh_pid\" 2>/dev/null; sleep 5; kill -KILL \"$_velnor_gh_pid\" 2>/dev/null ) </dev/null >/dev/null 2>&1 & _velnor_gh_watch=$!\n    _velnor_gh_status=0\n    wait \"$_velnor_gh_pid\" || _velnor_gh_status=$?\n    kill -KILL \"$_velnor_gh_watch\" 2>/dev/null || true\n    wait \"$_velnor_gh_watch\" 2>/dev/null || true\n    exit \"$_velnor_gh_status\"\n  ) </dev/null\n}\nexport -f gh\n\nassert_tag_target() {\n  local reference tag_object object_type object_sha\n  reference=\"$(gh api \"repos/$repository/git/ref/tags/$prepare_tag\")\" \\\n    || fail 'release tag lookup failed'\n  object_type=\"$(jq -er '.object.type' <<<\"$reference\")\" \\\n    || fail 'release tag response is invalid'\n  object_sha=\"$(jq -er '.object.sha' <<<\"$reference\")\" \\\n    || fail 'release tag response is invalid'\n  if [[ \"$object_type\" == tag ]]; then\n    tag_object=\"$(gh api \"repos/$repository/git/tags/$object_sha\")\" \\\n      || fail 'annotated release tag lookup failed'\n    object_type=\"$(jq -er '.object.type' <<<\"$tag_object\")\" \\\n      || fail 'annotated release tag response is invalid'\n    object_sha=\"$(jq -er '.object.sha' <<<\"$tag_object\")\" \\\n      || fail 'annotated release tag response is invalid'\n  fi\n  [[ \"$object_type\" == commit && \"$object_sha\" == \"$source_sha\" ]] || fail 'tag does not resolve to the exact source commit'\n}\n\nreleases=\"$(gh api --paginate --slurp \"repos/$repository/releases?per_page=100\")\" \\\n  || fail 'release list request failed'\nmatches=\"$(jq -c --arg tag \"$prepare_tag\" '[.[][]? | select(.tag_name == $tag)]' <<<\"$releases\")\" \\\n  || fail 'release list response is invalid'\ncount=\"$(jq -r 'length' <<<\"$matches\")\" || fail 'release list match count is invalid'\ncase \"$count\" in\n  0)\n    refs=\"$(gh api --paginate --slurp \"repos/$repository/git/matching-refs/tags/$prepare_tag?per_page=100\")\" \\\n      || fail 'matching release tag lookup failed'\n    exact_ref=\"$(jq -r --arg ref \"refs/tags/$prepare_tag\" '[.[][]? | select(.ref == $ref)] | length' <<<\"$refs\")\" \\\n      || fail 'matching release tag response is invalid'\n    [[ \"$exact_ref\" == 0 ]] || fail 'tag exists without a published release; draft or orphan requires reconciliation'\n    printf 'action=build\\n' >> \"$GITHUB_OUTPUT\"\n    exit 0\n    ;;\n  1) ;;\n  *) fail 'multiple releases use the exact source tag' ;;\nesac\n\njq -e \\\n  --arg tag \"$prepare_tag\" \\\n  --arg sha \"$source_sha\" \\\n  --argjson expected \"$prepare_expected_assets\" \\\n  '.[0] as $release\n   | $release.tag_name == $tag\n     and $release.target_commitish == $sha\n     and $release.draft == false\n     and $release.prerelease == false\n     and $release.immutable == true\n     and ([$release.assets[].name] | sort) == ($expected | sort)\n     and all($release.assets[];\n       .state == \"uploaded\"\n       and (.size | type == \"number\" and . > 0)\n       and (.digest | type == \"string\" and test(\"^sha256:[0-9a-f]{64}$\")))' \\\n  <<<\"$matches\" >/dev/null || fail 'existing release metadata, immutability, or asset set does not match'\nassert_tag_target\n\ntemp_dir=\"$(mktemp -d)\" || fail 'could not create release verification directory'\ntrap 'rm -rf \"$temp_dir\"' EXIT\ngh release verify \"$prepare_tag\" --repo \"$repository\" >/dev/null \\\n  || fail 'release signature verification failed'\nmkdir -p \"$temp_dir/assets\" || fail 'could not create release asset directory'\ngh release download \"$prepare_tag\" --repo \"$repository\" --dir \"$temp_dir/assets\" --pattern 'velnor-runner-linux-amd64.tar' --pattern 'velnor-dind-linux-amd64.tar' --pattern 'velnor-resource-probe-linux-amd64.tar' --pattern 'RESOURCE_PROBE_MANIFEST.json' --pattern 'SHA256SUMS' || fail 'release asset download failed'\n(cd \"$temp_dir/assets\" && shasum -a 256 --check SHA256SUMS) || fail 'release asset checksum verification failed'\ngh release verify-asset \"$prepare_tag\" \"$temp_dir/assets/velnor-runner-linux-amd64.tar\" --repo \"$repository\" >/dev/null || fail 'release asset verification failed: assets/velnor-runner-linux-amd64.tar'\ngh attestation verify \"$temp_dir/assets/velnor-runner-linux-amd64.tar\" --repo \"$repository\" --source-ref refs/heads/main --source-digest \"$source_sha\" --signer-workflow \"$repository/.github/workflows/product-release-images.yml\" --signer-digest \"$authority_sha\" >/dev/null || fail 'asset attestation verification failed: assets/velnor-runner-linux-amd64.tar'\ngh release verify-asset \"$prepare_tag\" \"$temp_dir/assets/velnor-dind-linux-amd64.tar\" --repo \"$repository\" >/dev/null || fail 'release asset verification failed: assets/velnor-dind-linux-amd64.tar'\ngh attestation verify \"$temp_dir/assets/velnor-dind-linux-amd64.tar\" --repo \"$repository\" --source-ref refs/heads/main --source-digest \"$source_sha\" --signer-workflow \"$repository/.github/workflows/product-release-images.yml\" --signer-digest \"$authority_sha\" >/dev/null || fail 'asset attestation verification failed: assets/velnor-dind-linux-amd64.tar'\ngh release verify-asset \"$prepare_tag\" \"$temp_dir/assets/velnor-resource-probe-linux-amd64.tar\" --repo \"$repository\" >/dev/null || fail 'release asset verification failed: assets/velnor-resource-probe-linux-amd64.tar'\ngh attestation verify \"$temp_dir/assets/velnor-resource-probe-linux-amd64.tar\" --repo \"$repository\" --source-ref refs/heads/main --source-digest \"$source_sha\" --signer-workflow \"$repository/.github/workflows/product-release-images.yml\" --signer-digest \"$authority_sha\" >/dev/null || fail 'asset attestation verification failed: assets/velnor-resource-probe-linux-amd64.tar'\ngh release verify-asset \"$prepare_tag\" \"$temp_dir/assets/RESOURCE_PROBE_MANIFEST.json\" --repo \"$repository\" >/dev/null || fail 'release asset verification failed: assets/RESOURCE_PROBE_MANIFEST.json'\ngh attestation verify \"$temp_dir/assets/RESOURCE_PROBE_MANIFEST.json\" --repo \"$repository\" --source-ref refs/heads/main --source-digest \"$source_sha\" --signer-workflow \"$repository/.github/workflows/product-release-images.yml\" --signer-digest \"$authority_sha\" >/dev/null || fail 'asset attestation verification failed: assets/RESOURCE_PROBE_MANIFEST.json'\ngh release verify-asset \"$prepare_tag\" \"$temp_dir/assets/SHA256SUMS\" --repo \"$repository\" >/dev/null || fail 'release asset verification failed: assets/SHA256SUMS'\ngh attestation verify \"$temp_dir/assets/SHA256SUMS\" --repo \"$repository\" --source-ref refs/heads/main --source-digest \"$source_sha\" --signer-workflow \"$repository/.github/workflows/product-release-images.yml\" --signer-digest \"$authority_sha\" >/dev/null || fail 'asset attestation verification failed: assets/SHA256SUMS'\nprintf 'action=complete\\n' >> \"$GITHUB_OUTPUT\"\n"
  release-images:
    name: Run runner images release graph
    uses: ./.github/workflows/product-release-images.yml # zizmor: ignore[self-repository]
    needs:
      - release-eligibility
      - prepare-images
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    with:
      source_sha: ${{ needs.release-eligibility.outputs.source_sha }}
      workflow_authority_sha: ${{ needs.release-eligibility.outputs.workflow_authority_sha }}
      ci_run_id: ${{ needs.release-eligibility.outputs.ci_run_id }}
      ci_attempt: ${{ needs.release-eligibility.outputs.ci_attempt }}
      release_action: ${{ needs.prepare-images.outputs.action }}
      caller_run_id: ${{ github.run_id }}
      caller_attempt: ${{ github.run_attempt }}
  prepare-binary:
    name: Prepare velnor-host binary release
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs:
      - release-eligibility
    permissions:
      attestations: read
      actions: read
      contents: read
    outputs:
      action: ${{ steps.reconcile.outputs.action }}
    steps:
      - name: Setup Mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.10.6
          sha256: 3f44343eebc7e0d6623bcea46e304864f02dff648edd75c82871b53cc697b366
          install: "false"
          env: "false"
          cache: "false"
          cache_save: "false"
      - name: Install pinned GitHub CLI
        shell: bash
        run: mise --no-config --no-env --no-hooks install gh@2.102.0
      - name: Reconcile immutable family release
        id: reconcile
        env:
          GH_TOKEN: ${{ github.token }}
          VELNOR_SOURCE_SHA: ${{ needs.release-eligibility.outputs.source_sha }}
          VELNOR_WORKFLOW_AUTHORITY_SHA: ${{ needs.release-eligibility.outputs.workflow_authority_sha }}
        run: "set -euo pipefail\n\nreadonly repository='tailrocks/velnor-new'\nreadonly source_sha=\"$VELNOR_SOURCE_SHA\"\nreadonly authority_sha=\"$VELNOR_WORKFLOW_AUTHORITY_SHA\"\nreadonly tag_prefix='binary'\nreadonly fixed_tag=''\nif [[ -n \"$fixed_tag\" ]]; then\n  prepare_tag=\"$fixed_tag\"\nelse\n  prepare_tag=\"${tag_prefix}-${source_sha}\"\nfi\nreadonly prepare_tag\nreadonly prepare_expected_assets='[\"velnor-host\",\"velnor-runner-attestation-helper\",\"BINARY_RELEASE_MANIFEST.json\",\"SHA256SUMS\"]'\n\nfail() {\n  printf 'release reconciliation (velnor-host binary): %s\\n' \"$1\" >&2\n  exit 1\n}\n\n[[ \"$source_sha\" =~ ^[0-9a-f]{40}$ ]] || fail 'source SHA is malformed'\n[[ \"$authority_sha\" == \"$source_sha\" ]] || fail 'workflow authority differs from source'\n[[ -n \"$GH_TOKEN\" ]] || fail 'read-only GitHub token is missing'\n\ngh() {\n  (\n    mise --no-config --no-env --no-hooks exec gh@2.102.0 -- gh \"$@\" & _velnor_gh_pid=$!\n    ( sleep 60; kill -TERM \"$_velnor_gh_pid\" 2>/dev/null; sleep 5; kill -KILL \"$_velnor_gh_pid\" 2>/dev/null ) </dev/null >/dev/null 2>&1 & _velnor_gh_watch=$!\n    _velnor_gh_status=0\n    wait \"$_velnor_gh_pid\" || _velnor_gh_status=$?\n    kill -KILL \"$_velnor_gh_watch\" 2>/dev/null || true\n    wait \"$_velnor_gh_watch\" 2>/dev/null || true\n    exit \"$_velnor_gh_status\"\n  ) </dev/null\n}\nexport -f gh\n\nassert_tag_target() {\n  local reference tag_object object_type object_sha\n  reference=\"$(gh api \"repos/$repository/git/ref/tags/$prepare_tag\")\" \\\n    || fail 'release tag lookup failed'\n  object_type=\"$(jq -er '.object.type' <<<\"$reference\")\" \\\n    || fail 'release tag response is invalid'\n  object_sha=\"$(jq -er '.object.sha' <<<\"$reference\")\" \\\n    || fail 'release tag response is invalid'\n  if [[ \"$object_type\" == tag ]]; then\n    tag_object=\"$(gh api \"repos/$repository/git/tags/$object_sha\")\" \\\n      || fail 'annotated release tag lookup failed'\n    object_type=\"$(jq -er '.o