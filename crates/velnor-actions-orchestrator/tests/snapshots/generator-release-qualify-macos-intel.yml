name: Qualify macOS x86_64 velnor-actions
description: Shared steps for Qualify macOS x86_64 velnor-actions
inputs:
  artifact_id:
    description: Artifact ID from this target's build job
    required: true
runs:
  using: composite
  steps:
    - name: Download built asset archive
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: ${{ inputs.artifact_id }}
        path: macos-intel-assets
    - name: Prevalidate and extract uploaded candidate archive
      shell: bash
      run: "set -eu\npython3 scripts/generator-release/extract-candidate.py 'macos-intel-assets/generator-macos-intel-assets.tar' 'macos-intel-assets' 'velnor-actions-0.1.1-x86_64-apple-darwin' 'velnor-actions-0.1.1-x86_64-apple-darwin.sha256' 'velnor-actions-0.1.1-x86_64-apple-darwin.provenance.json'"
    - name: Verify extracted candidate file types and executable mode
      shell: bash
      run: "set -eu\ntest -f macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin\ntest ! -L macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin\ntest -x macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin\ntest -f macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin.sha256\ntest ! -L macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin.sha256\ntest ! -x macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin.sha256\ntest -f macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin.provenance.json\ntest ! -L macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin.provenance.json\ntest ! -x macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin.provenance.json"
    - name: Verify candidate provenance record
      shell: bash
      run: "set -eu\ndigest=\"$(awk -v expected='velnor-actions-0.1.1-x86_64-apple-darwin' 'NR == 1 { if (NF != 2 || length($1) != 64 || $1 !~ /^[0-9a-f]+$/ || $2 != expected) exit 1; print $1; next } { exit 1 } END { if (NR != 1) exit 1 }' 'macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin.sha256')\"\njq -e --arg version \"0.1.1\" --arg repository \"$GITHUB_REPOSITORY\" --arg commit \"$GITHUB_SHA\" --arg target \"x86_64-apple-darwin\" --arg asset \"velnor-actions-0.1.1-x86_64-apple-darwin\" --arg sha256 \"$digest\" --arg rust 1.98.1 --arg mr_boxington 1.21.1 '.schema == 1 and .version == $version and .repository == $repository and .commit == $commit and .target == $target and .asset == $asset and .sha256 == $sha256 and .toolchain.rust == $rust and .toolchain[\"mr-boxington\"] == $mr_boxington' macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin.provenance.json > /dev/null"
    - name: Verify downloaded checksum sidecar
      shell: bash
      run: "set -eu\ncd macos-intel-assets\nshasum -a 256 --check velnor-actions-0.1.1-x86_64-apple-darwin.sha256"
    - name: Qualify downloaded candidate
      shell: bash
      run: "set -eu\nunset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN GITHUB_TOKEN GH_TOKEN MISE_GITHUB_TOKEN GH_HOST GH_CONFIG_DIR\ntest \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\"\ntest \"$(./macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin --version)\" = \"velnor-actions 0.1.1\"\nscripts/capture-opentofu-goldens.sh check-release \"$GITHUB_WORKSPACE/macos-intel-assets/velnor-actions-0.1.1-x86_64-apple-darwin\""
