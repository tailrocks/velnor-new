name: Publish generator release
description: Shared steps for Publish generator release
inputs:
  linux_artifact_id:
    description: Artifact ID from the Linux x86_64 build job
    required: true
  macos_arm64_artifact_id:
    description: Artifact ID from the macOS arm64 build job
    required: true
  macos_x86_64_artifact_id:
    description: Artifact ID from the macOS x86_64 build job
    required: true
  manifest_artifact_id:
    description: Artifact ID of the canonical same-run manifest
    required: true
  manifest_sha256:
    description: SHA-256 of the canonical same-run manifest bytes
    required: true
runs:
  using: composite
  steps:
    - name: Setup Mise
      uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
      with:
        version: 2026.10.6
        sha256: 3f44343eebc7e0d6623bcea46e304864f02dff648edd75c82871b53cc697b366
        install: "false"
        env: "false"
        cache: "false"
        cache_save: "false"
    - name: Install pinned GitHub CLI
      shell: bash
      run: mise --no-config --no-env --no-hooks install gh@2.102.0
    - name: Download exact release build artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: ${{ inputs.linux_artifact_id }}
        path: linux-assets
    - name: Prevalidate and extract uploaded candidate archive
      shell: bash
      run: "set -eu\nbash scripts/with-owned-archive-guard.sh -- python3 scripts/generator-release/extract-candidate.py 'linux-assets/generator-linux-assets.tar' 'linux-assets' 'velnor-actions-0.1.5-x86_64-unknown-linux-gnu' 'velnor-actions-0.1.5-x86_64-unknown-linux-gnu.sha256' 'velnor-actions-0.1.5-x86_64-unknown-linux-gnu.provenance.json'"
    - name: Verify extracted candidate file types and executable mode
      shell: bash
      run: "set -eu\ntest -f linux-assets/velnor-actions-0.1.5-x86_64-unknown-linux-gnu\ntest ! -L linux-assets/velnor-actions-0.1.5-x86_64-unknown-linux-gnu\ntest -x linux-assets/velnor-actions-0.1.5-x86_64-unknown-linux-gnu\ntest -f linux-assets/velnor-actions-0.1.5-x86_64-unknown-linux-gnu.sha256\ntest ! -L linux-assets/velnor-actions-0.1.5-x86_64-unknown-linux-gnu.sha256\ntest ! -x linux-assets/velnor-actions-0.1.5-x86_64-unknown-linux-gnu.sha256\ntest -f linux-assets/velnor-actions-0.1.5-x86_64-unknown-linux-gnu.provenance.json\ntest ! -L linux-assets/velnor-actions-0.1.5-x86_64-unknown-linux-gnu.provenance.json\ntest ! -x linux-assets/velnor-actions-0.1.5-x86_64-unknown-linux-gnu.provenance.json"
    - name: Download exact release build artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: ${{ inputs.macos_arm64_artifact_id }}
        path: macos-assets
    - name: Prevalidate and extract uploaded candidate archive
      shell: bash
      run: "set -eu\nbash scripts/with-owned-archive-guard.sh -- python3 scripts/generator-release/extract-candidate.py 'macos-assets/generator-macos-assets.tar' 'macos-assets' 'velnor-actions-0.1.5-aarch64-apple-darwin' 'velnor-actions-0.1.5-aarch64-apple-darwin.sha256' 'velnor-actions-0.1.5-aarch64-apple-darwin.provenance.json'"
    - name: Verify extracted candidate file types and executable mode
      shell: bash
      run: "set -eu\ntest -f macos-assets/velnor-actions-0.1.5-aarch64-apple-darwin\ntest ! -L macos-assets/velnor-actions-0.1.5-aarch64-apple-darwin\ntest -x macos-assets/velnor-actions-0.1.5-aarch64-apple-darwin\ntest -f macos-assets/velnor-actions-0.1.5-aarch64-apple-darwin.sha256\ntest ! -L macos-assets/velnor-actions-0.1.5-aarch64-apple-darwin.sha256\ntest ! -x macos-assets/velnor-actions-0.1.5-aarch64-apple-darwin.sha256\ntest -f macos-assets/velnor-actions-0.1.5-aarch64-apple-darwin.provenance.json\ntest ! -L macos-assets/velnor-actions-0.1.5-aarch64-apple-darwin.provenance.json\ntest ! -x macos-assets/velnor-actions-0.1.5-aarch64-apple-darwin.provenance.json"
    - name: Download exact release build artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: ${{ inputs.macos_x86_64_artifact_id }}
        path: macos-intel-assets
    - name: Prevalidate and extract uploaded candidate archive
      shell: bash
      run: "set -eu\nbash scripts/with-owned-archive-guard.sh -- python3 scripts/generator-release/extract-candidate.py 'macos-intel-assets/generator-macos-intel-assets.tar' 'macos-intel-assets' 'velnor-actions-0.1.5-x86_64-apple-darwin' 'velnor-actions-0.1.5-x86_64-apple-darwin.sha256' 'velnor-actions-0.1.5-x86_64-apple-darwin.provenance.json'"
    - name: Verify extracted candidate file types and executable mode
      shell: bash
      run: "set -eu\ntest -f macos-intel-assets/velnor-actions-0.1.5-x86_64-apple-darwin\ntest ! -L macos-intel-assets/velnor-actions-0.1.5-x86_64-apple-darwin\ntest -x macos-intel-assets/velnor-actions-0.1.5-x86_64-apple-darwin\ntest -f macos-intel-assets/velnor-actions-0.1.5-x86_64-apple-darwin.sha256\ntest ! -L macos-intel-assets/velnor-actions-0.1.5-x86_64-apple-darwin.sha256\ntest ! -x macos-intel-assets/velnor-actions-0.1.5-x86_64-apple-darwin.sha256\ntest -f macos-intel-assets/velnor-actions-0.1.5-x86_64-apple-darwin.provenance.json\ntest ! -L macos-intel-assets/velnor-actions-0.1.5-x86_64-apple-darwin.provenance.json\ntest ! -x macos-intel-assets/velnor-actions-0.1.5-x86_64-apple-darwin.provenance.json"
    - name: Download canonical same-run release manifest
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: ${{ inputs.manifest_artifact_id }}
        path: manifest-assets
    - name: Verify canonical manifest digest
      env:
        VELNOR_RELEASE_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      shell: bash
      run: "set -eu\nexpected=\"$VELNOR_RELEASE_MANIFEST_SHA256\"\nactual=\"$(sha256sum 'manifest-assets/release-manifest.json' | awk 'NR == 1 { print $1; next } { exit 1 } END { if (NR != 1) exit 1 }')\"\ntest \"${#expected}\" -eq 64\ntest \"$actual\" = \"$expected\""
    - name: Download verified release attestation bundles
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: generator-linux-assets-attestations
        path: release-attestations
    - name: Download verified release attestation bundles
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: generator-macos-assets-attestations
        path: release-attestations
    - name: Download verified release attestation bundles
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: generator-macos-intel-assets-attestations
        path: release-attestations
    - name: Download verified release attestation bundles
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: generator-release-manifest-attestations
        path: release-attestations
    - name: Fetch and verify signed release attestations
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: "gh() {\n  (\n    mise --no-config --no-env --no-hooks exec gh@2.102.0 -- gh \"$@\" & _velnor_gh_pid=$!\n    ( sleep 60; kill -TERM \"$_velnor_gh_pid\" 2>/dev/null; sleep 5; kill -KILL \"$_velnor_gh_pid\" 2>/dev/null ) </dev/null >/dev/null 2>&1 & _velnor_gh_watch=$!\n    _velnor_gh_status=0\n    wait \"$_velnor_gh_pid\" || _velnor_gh_status=$?\n    kill -KILL \"$_velnor_gh_watch\" 2>/dev/null || true\n    wait \"$_velnor_gh_watch\" 2>/dev/null || true\n    exit \"$_velnor_gh_status\"\n  ) </dev/null\n}\nexport -f gh\nset -eu\ntest \"$GITHUB_WORKFLOW_SHA\" = \"$GITHUB_SHA\"\ntest -f 'release-attestations/velnor-actions-0.1.5-x86_64-unknown-linux-gnu.intoto.jsonl'\ntest ! -L 'release-attestations/velnor-actions-0.1.5-x86_64-unknown-linux-gnu.intoto.jsonl'\ntest -s 'release-attestations/velnor-actions-0.1.5-x86_64-unknown-linux-gnu.intoto.jsonl'\ngh attestation verify 'linux-assets/velnor-actions-0.1.5-x86_64-unknown-linux-gnu' --repo \"$GITHUB_REPOSITORY\" --bundle 'release-attestations/velnor-actions-0.1.5-x86_64-unknown-linux-gnu.intoto.jsonl' --source-digest \"$GITHUB_SHA\" --source-ref refs/heads/main --signer-workflow \"${GITHUB_REPOSITORY}/.github/workflows/product-release-generator.yml\" --signer-digest \"$GITHUB_SHA\" > /dev/null\ntest -f 'release-attestations/velnor-actions-0.1.5-x86_64-unknown-linux-gnu.sha256.intoto.jsonl'\ntest ! -L 'release-attestations/velnor-actions-0.1.5-x86_64-unknown-linux-gnu.sha256.intoto.jsonl'\ntest -s 'release-attestations/velnor-actions-0.1.5-x86_64-unknown-linux-gnu.sha256.intoto.jsonl'\ngh attestation verify 'linux-assets/velnor-actions-0.1.5-x86_64-unknown-linux-gnu.sha256' --repo \"$GITHUB_REPOSITORY\" --bundle 'release-attestations/velnor-actions-0.1.5-x86_64-unknown-linux-gnu.sha256.intoto.jsonl' --source-digest \"$GITHUB_SHA\" --source-ref refs/heads/main --signer-workflow \"${GITHUB_REPOSITORY}/.github/workflows/product-release-generator.yml\" --signer-digest \"$GITHUB_SHA\" > /dev/null\ntest -f 'release-attestations/velnor-actions-0.1.5-x86_64-unknown-linux-gnu.provenance.json.intoto.jsonl'\ntest ! -L 'release-attestations/velnor-actions-0.1.5-x86_64-unknown-linux-gnu.provenance.json.intoto.jsonl'\ntest -s 'release-attestations/velnor-actions-0.1.5-x86_64-unknown-linux-gnu.provenance.json.intoto.jsonl'\ngh attestation verify 'linux-assets/velnor-actions-0.1.5-x86_64-unknown-linux-gnu.provenance.json' --repo \"$GITHUB_REPOSITORY\" --bundle 'release-attestations/velnor-actions-0.1.5-x86_64-unknown-linux-gnu.provenance.json.intoto.jsonl' --source-digest \"$GITHUB_SHA\" --source-ref refs/heads/main --signer-workflow \"${GITHUB_REPOSITORY}/.github/workflows/product-release-generator.yml\" --signer-digest \"$GITHUB_SHA\" > /dev/null\ntest -f 'release-attestations/velnor-actions-0.1.5-aarch64-apple-darwin.intoto.jsonl'\ntest ! -L 'release-attestations/velnor-actions-0.1.5-aarch64-apple-darwin.intoto.jsonl'\ntest -s 'release-attestations/velnor-actions-0.1.5-aarch64-apple-darwin.intoto.jsonl'\ngh attestation verify 'macos-assets/velnor-actions-0.1.5-aarch64-apple-darwin' --repo \"$GITHUB_REPOSITORY\" --bundle 'release-attestations/velnor-actions-0.1.5-aarch64-apple-darwin.intoto.jsonl' --source-digest \"$GITHUB_SHA\" --source-ref refs/heads/main --signer-workflow \"${GITHUB_REPOSITORY}/.github/workflows/product-release-generator.yml\" --signer-digest \"$GITHUB_SHA\" > /dev/null\ntest -f 'release-attestations/velnor-actions-0.1.5-aarch64-apple-darwin.sha256.intoto.jsonl'\ntest ! -L 'release-attestations/velnor-actions-0.1.5-aarch64-apple-darwin.sha256.intoto.jsonl'\ntest -s 'release-attestations/velnor-actions-0.1.5-aarch64-apple-darwin.sha256.intoto.jsonl'\ngh attestation verify 'macos-assets/velnor-actions-0.1.5-aarch64-apple-darwin.sha256' --repo \"$GITHUB_REPOSITORY\" --bundle 'release-attestations/velnor-actions-0.1.5-aarch64-apple-darwin.sha256.intoto.jsonl' --source-digest \"$GITHUB_SHA\" --source-ref refs/heads/main --signer-workflow \"${GITHUB_REPOSITORY}/.github/workflows/product-release-generator.yml\" --signer-digest \"$GITHUB_SHA\" > /dev/null\ntest -f 'release-attestations/velnor-actions-0.1.5-aarch64-apple-darwin.provenance.json.intoto.jsonl'\ntest ! -L 'release-attestations/velnor-actions-0.1.5-aarch64-apple-darwin.provenance.json.intoto.jsonl'\ntest -s 'release-attestations/velnor-actions-0.1.5-aarch64-apple-darwin.provenance.json.intoto.jsonl'\ngh attestation verify 'macos-assets/velnor-actions-0.1.5-aarch64-apple-darwin.provenance.json' --repo \"$GITHUB_REPOSITORY\" --bundle 'release-attestations/velnor-actions-0.1.5-aarch64-apple-darwin.provenance.json.intoto.jsonl' --source-digest \"$GITHUB_SHA\" --source-ref refs/heads/main --signer-workflow \"${GITHUB_REPOSITORY}/.github/workflows/product-release-generator.yml\" --signer-digest \"$GITHUB_SHA\" > /dev/null\ntest -f 'release-attestations/velnor-actions-0.1.5-x86_64-apple-darwin.intoto.jsonl'\ntest ! -L 'release-attestations/velnor-actions-0.1.5-x86_64-apple-darwin.intoto.jsonl'\ntest -s 'release-attestations/velnor-actions-0.1.5-x86_64-apple-darwin.intoto.jsonl'\ngh attestation verify 'macos-intel-assets/velnor-actions-0.1.5-x86_64-apple-darwin' --repo \"$GITHUB_REPOSITORY\" --bundle 'release-attestations/velnor-actions-0.1.5-x86_64-apple-darwin.intoto.jsonl' --source-digest \"$GITHUB_SHA\" --source-ref refs/heads/main --signer-workflow \"${GITHUB_REPOSITORY}/.github/workflows/product-release-generator.yml\" --signer-digest \"$GITHUB_SHA\" > /dev/null\ntest -f 'release-attestations/velnor-actions-0.1.5-x86_64-apple-darwin.sha256.intoto.jsonl'\ntest ! -L 'release-attestations/velnor-actions-0.1.5-x86_64-apple-darwin.sha256.intoto.jsonl'\ntest -s 'release-attestations/velnor-actions-0.1.5-x86_64-apple-darwin.sha256.intoto.jsonl'\ngh attestation verify 'macos-intel-assets/velnor-actions-0.1.5-x86_64-apple-darwin.sha256' --repo \"$GITHUB_REPOSITORY\" --bundle 'release-attestations/velnor-actions-0.1.5-x86_64-apple-darwin.sha256.intoto.jsonl' --source-digest \"$GITHUB_SHA\" --source-ref refs/heads/main --signer-workflow \"${GITHUB_REPOSITORY}/.github/workflows/product-release-generator.yml\" --signer-digest \"$GITHUB_SHA\" > /dev/null\ntest -f 'release-attestations/velnor-actions-0.1.5-x86_64-apple-darwin.provenance.json.intoto.jsonl'\ntest ! -L 'release-attestations/velnor-actions-0.1.5-x86_64-apple-darwin.provenance.json.intoto.jsonl'\ntest -s 'release-attestations/velnor-actions-0.1.5-x86_64-apple-darwin.provenance.json.intoto.jsonl'\ngh attestation verify 'macos-intel-assets/velnor-actions-0.1.5-x86_64-apple-darwin.provenance.json' --repo \"$GITHUB_REPOSITORY\" --bundle 'release-attestations/velnor-actions-0.1.5-x86_64-apple-darwin.provenance.json.intoto.jsonl' --source-digest \"$GITHUB_SHA\" --source-ref refs/heads/main --signer-workflow \"${GITHUB_REPOSITORY}/.github/workflows/product-release-generator.yml\" --signer-digest \"$GITHUB_SHA\" > /dev/null\ntest -f 'release-attestations/release-manifest.json.intoto.jsonl'\ntest ! -L 'release-attestations/release-manifest.json.intoto.jsonl'\ntest -s 'release-attestations/release-manifest.json.intoto.jsonl'\ngh attestation verify 'manifest-assets/release-manifest.json' --repo \"$GITHUB_REPOSITORY\" --bundle 'release-attestations/release-manifest.json.intoto.jsonl' --source-digest \"$GITHUB_SHA\" --source-ref refs/heads/main --signer-workflow \"${GITHUB_REPOSITORY}/.github/workflows/product-release-generator.yml\" --signer-digest \"$GITHUB_SHA\" > /dev/null"
    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: "gh() {\n  (\n    mise --no-config --no-env --no-hooks exec gh@2.102.0 -- gh \"$@\" & _velnor_gh_pid=$!\n    ( sleep 60; kill -TERM \"$_velnor_gh_pid\" 2>/dev/null; sleep 5; kill -KILL \"$_velnor_gh_pid\" 2>/dev/null ) </dev/null >/dev/null 2>&1 & _velnor_gh_watch=$!\n    _velnor_gh_status=0\n    wait \"$_velnor_gh_pid\" || _velnor_gh_status=$?\n    kill -KILL \"$_velnor_gh_watch\" 2>/dev/null || true\n    wait \"$_velnor_gh_watch\" 2>/dev/null || true\n    exit \"$_velnor_gh_status\"\n  ) </dev/null\n}\nexport -f gh\nset -eu\ntag='v0.1.5'\nrelease_tmp=\"$(mktemp -d)\"\ntrap 'rm -rf \"$release_tmp\"' EXIT\nassert_release_tag_source() {\n  local reference object kind digest next\n  local -a seen=()\n  reference=\"$(gh api \"repos/$GITHUB_REPOSITORY/git/ref/tags/$tag\")\"\n  object=\"$(jq -ce '.object | select(type == \"object\")' <<<\"$reference\")\"\n  for _ in 1 2 3 4 5 6 7 8; do\n    kind=\"$(jq -er '.type' <<<\"$object\")\"\n    digest=\"$(jq -er '.sha | select(type == \"string\" and test(\"^[0-9a-f]{40}$\"))' <<<\"$object\")\"\n    case \"$kind\" in\n      commit)\n        [[ \"$digest\" == \"$GITHUB_SHA\" ]] || return 1\n        return 0\n        ;;\n      tag)\n        for previous in \"${seen[@]}\"; do [[ \"$previous\" != \"$digest\" ]] || return 1; done\n        seen+=(\"$digest\")\n        next=\"$(gh api \"repos/$GITHUB_REPOSITORY/git/tags/$digest\")\"\n        object=\"$(jq -ce '.object | select(type == \"object\")' <<<\"$next\")\"\n        ;;\n      *) return 1 ;;\n    esac\n  done\n  return 1\n}\nverify_release_metadata() {\n  local response=\"$1\" expected_draft=\"$2\"\n  jq -e --argjson release_id \"$release_id\" --arg tag \"$tag\" --arg source \"$GITHUB_SHA\" --arg api_url \"https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id\" --arg html_url \"https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag\" --argjson expected_draft \"$expected_draft\" '.id == $release_id and .tag_name == $tag and .target_commitish == $source and