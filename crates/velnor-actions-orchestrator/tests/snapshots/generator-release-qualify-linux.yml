name: Qualify Linux velnor-actions
description: Shared steps for Qualify Linux velnor-actions
inputs:
  artifact_id:
    description: Artifact ID from this target's build job
    required: true
  manifest_artifact_id:
    description: Artifact ID of the canonical candidate manifest
    required: true
  manifest_sha256:
    description: SHA-256 of the canonical candidate manifest bytes
    required: true
runs:
  using: composite
  steps:
    - name: Setup Mise
      uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde
      with:
        version: 2026.10.17
        sha256: fe6dd17e68e09682b31d2e7bb7bb755d22636ac1af5d94621e300f2ca9e9fe8a
        install: "false"
        env: "false"
        cache: "false"
        cache_save: "false"
    - name: Install pinned qualification tools
      shell: bash
      run: mise --no-config --no-env --no-hooks install rust@1.99.1 actionlint@1.7.12 shellcheck@0.11.0 zizmor@1.31.1
    - name: Download built asset archive
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: ${{ inputs.artifact_id }}
        path: linux-assets
    - name: Prevalidate and extract uploaded candidate archive
      shell: bash
      run: "set -eu\nbash scripts/with-owned-archive-guard.sh -- python3 scripts/generator-release/extract-candidate.py 'linux-assets/generator-linux-assets.tar' 'linux-assets' 'velnor-actions-@COMPILED_RELEASE_VERSION@-x86_64-unknown-linux-gnu' 'velnor-actions-@COMPILED_RELEASE_VERSION@-x86_64-unknown-linux-gnu.sha256' 'velnor-actions-@COMPILED_RELEASE_VERSION@-x86_64-unknown-linux-gnu.provenance.json'"
    - name: Verify extracted candidate file types and executable mode
      shell: bash
      run: "set -eu\ntest -f linux-assets/velnor-actions-@COMPILED_RELEASE_VERSION@-x86_64-unknown-linux-gnu\ntest ! -L linux-assets/velnor-actions-@COMPILED_RELEASE_VERSION@-x86_64-unknown-linux-gnu\ntest -x linux-assets/velnor-actions-@COMPILED_RELEASE_VERSION@-x86_64-unknown-linux-gnu\ntest -f linux-assets/velnor-actions-@COMPILED_RELEASE_VERSION@-x86_64-unknown-linux-gnu.sha256\ntest ! -L linux-assets/velnor-actions-@COMPILED_RELEASE_VERSION@-x86_64-unknown-linux-gnu.sha256\ntest ! -x linux-assets/velnor-actions-@COMPILED_RELEASE_VERSION@-x86_64-unknown-linux-gnu.sha256\ntest -f linux-assets/velnor-actions-@COMPILED_RELEASE_VERSION@-x86_64-unknown-linux-gnu.provenance.json\ntest ! -L linux-assets/velnor-actions-@COMPILED_RELEASE_VERSION@-x86_64-unknown-linux-gnu.provenance.json\ntest ! -x linux-assets/velnor-actions-@COMPILED_RELEASE_VERSION@-x86_64-unknown-linux-gnu.provenance.json"
    - name: Download canonical same-run candidate manifest
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: ${{ inputs.manifest_artifact_id }}
        path: manifest-assets
    - name: Verify candidate provenance record
      shell: bash
      run: "set -eu\ndigest=\"$(awk -v expected='velnor-actions-@COMPILED_RELEASE_VERSION@-x86_64-unknown-linux-gnu' 'NR == 1 { if (NF != 2 || length($1) != 64 || $1 !~ /^[0-9a-f]+$/ || $2 != expected) exit 1; print $1; next } { exit 1 } END { if (NR != 1) exit 1 }' 'linux-assets/velnor-actions-@COMPILED_RELEASE_VERSION@-x86_64-unknown-linux-gnu.sha256')\"\njq -e --arg version \"@COMPILED_RELEASE_VERSION@\" --arg repository \"$GITHUB_REPOSITORY\" --arg commit \"$GITHUB_SHA\" --arg target \"x86_64-unknown-linux-gnu\" --arg asset \"velnor-actions-@COMPILED_RELEASE_VERSION@-x86_64-unknown-linux-gnu\" --arg sha256 \"$digest\" --arg rust '1.99.1' --arg mr_boxington '1.26.0' '.schema == 1 and .version == $version and .repository == $repository and .commit == $commit and .target == $target and .asset == $asset and .sha256 == $sha256 and .toolchain.rust == $rust and .toolchain[\"mr-boxington\"] == $mr_boxington' linux-assets/velnor-actions-@COMPILED_RELEASE_VERSION@-x86_64-unknown-linux-gnu.provenance.json > /dev/null"
    - name: Verify downloaded checksum sidecar
      shell: bash
      run: "set -eu\ncd linux-assets\nsha256sum --check velnor-actions-@COMPILED_RELEASE_VERSION@-x86_64-unknown-linux-gnu.sha256"
    - name: Qualify downloaded candidate
      env:
        VELNOR_RELEASE_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      shell: bash
      run: "set -eu\nunset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN GITHUB_TOKEN GH_TOKEN MISE_GITHUB_TOKEN GH_HOST GH_CONFIG_DIR\ntest \"$GITHUB_WORKFLOW_SHA\" = \"$GITHUB_SHA\"\ntest \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\"\ntest \"$(./linux-assets/velnor-actions-@COMPILED_RELEASE_VERSION@-x86_64-unknown-linux-gnu --version)\" = \"velnor-actions @COMPILED_RELEASE_VERSION@\"\nscripts/capture-opentofu-goldens.sh check-release \"$GITHUB_WORKSPACE/linux-assets/velnor-actions-@COMPILED_RELEASE_VERSION@-x86_64-unknown-linux-gnu\" \"$GITHUB_WORKSPACE/manifest-assets/release-manifest.json\" \"$VELNOR_RELEASE_MANIFEST_SHA256\""
