        with:
          ref: ${{ github.sha }}
          persist-credentials: "false"
      - name: Setup Mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550
        with:
          cache: "false"
          cache_save: "false"
          env: "false"
          install: "false"
          sha256: dac5d6db5e315d8e4f096c6ead9279d342e09fdcb5c373d0df5c7dcce8195746
          version: 2026.10.17
      - name: Verify selected ref, version, and binary digest
        shell: bash
        env:
          MISE_VERSION: 2026.10.17
          MISE_SHA256: dac5d6db5e315d8e4f096c6ead9279d342e09fdcb5c373d0df5c7dcce8195746
        run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\"\nversion=\"$(mise --version)\"\ncase \"$version\" in \"$MISE_VERSION macos-x64 (\"[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]\")\") ;; *) echo \"unexpected Mise version: $version\" >&2; exit 1 ;; esac\nbinary=\"$(command -v mise)\"\nactual=\"$(shasum -a 256 \"$binary\" | awk '{print $1}')\"\ntest \"$actual\" = \"$MISE_SHA256\""
