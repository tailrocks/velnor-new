name: Qualification
"on":
  workflow_dispatch:
    inputs:
      mode:
        type: string
        required: false
        default: both
permissions:
  contents: read
jobs:
  verify-hosted:
    name: Verify / GitHub hosted / Linux x64
    if: inputs.mode == 'both'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Qualify hosted lane
        run: echo qualification-hosted
  verify-scale-set:
    name: Verify / Velnor Scale Set / Linux x64
    if: inputs.mode == 'both'
    runs-on: [velnor, ubuntu-26.04-scale-set]
    timeout-minutes: 5
    defaults:
      run:
        shell: bash -e {0}
    steps:
      - name: Qualify scale-set lane
        run: echo qualification-scale-set
  compare:
    name: Compare hosted and Velnor execution
    if: inputs.mode == 'both'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs:
      - verify-hosted
      - verify-scale-set
    steps:
      - name: Compare lanes
        run: echo compare-lanes
  js-hosted:
    name: JavaScript actions / GitHub hosted
    if: inputs.mode == 'features' || inputs.mode == 'js'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
      - name: Record checkout
        run: git rev-parse HEAD
      - name: Run JavaScript
        run: "node -e 'console.log(\"js-action-ok\")'"
  js-scale-set:
    name: JavaScript actions / Velnor Scale Set
    if: inputs.mode == 'features' || inputs.mode == 'js'
    runs-on: [velnor, ubuntu-26.04-scale-set]
    timeout-minutes: 5
    defaults:
      run:
        shell: bash -e {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
      - name: Record checkout
        run: git rev-parse HEAD
      - name: Run JavaScript
        run: "node -e 'console.log(\"js-action-ok\")'"
  services-hosted:
    name: Services / GitHub hosted
    if: inputs.mode == 'features' || inputs.mode == 'services'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    services:
      redis:
        image: redis:8.10.2-alpine@sha256:2d3814be5e9b06a30a0be54770b7e12052e7e79ec85271aefd34875c1f393b23
        options: "--health-cmd \"redis-cli ping\" --health-interval 5s --health-timeout 5s --health-retries 12"
        ports:
          - "6379:6379"
    steps:
      - name: Localhost port
        run: timeout 20 bash -c 'until echo >/dev/tcp/127.0.0.1/6379; do sleep 1; done'
  services-scale-set:
    name: Services / Velnor Scale Set
    if: inputs.mode == 'features' || inputs.mode == 'services'
    runs-on: [velnor, ubuntu-26.04-scale-set]
    timeout-minutes: 5
    defaults:
      run:
        shell: bash -e {0}
    services:
      redis:
        image: redis:8.10.2-alpine@sha256:2d3814be5e9b06a30a0be54770b7e12052e7e79ec85271aefd34875c1f393b23
        options: "--health-cmd \"redis-cli ping\" --health-interval 5s --health-timeout 5s --health-retries 12"
        ports:
          - "6379:6379"
    steps:
      - name: Localhost port
        run: timeout 20 bash -c 'until echo >/dev/tcp/127.0.0.1/6379; do sleep 1; done'
  artifacts-hosted:
    name: Artifacts / GitHub hosted
    if: inputs.mode == 'features' || inputs.mode == 'artifacts'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Write proof
        run: echo g4-artifact > g4-proof.txt
      - name: Upload proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: g4-proof-hosted
          path: g4-proof.txt
          if-no-files-found: error
  artifacts-scale-set:
    name: Artifacts / Velnor Scale Set
    if: inputs.mode == 'features' || inputs.mode == 'artifacts'
    runs-on: [velnor, ubuntu-26.04-scale-set]
    timeout-minutes: 5
    defaults:
      run:
        shell: bash -e {0}
    permissions:
      contents: read
      actions: write
    steps:
      - name: Write proof
        run: echo g4-artifact > g4-proof.txt
      - name: Upload proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: g4-proof-scale-set
          path: g4-proof.txt
          if-no-files-found: error
  buildx-hosted:
    name: Buildx / GitHub hosted
    if: inputs.mode == 'features' || inputs.mode == 'buildx'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Buildx probe
        run: docker buildx version && printf 'FROM scratch\n' > Dockerfile && docker buildx build --progress=plain -t velnor-g4:probe .
  buildx-scale-set:
    name: Buildx / Velnor Scale Set
    if: inputs.mode == 'features' || inputs.mode == 'buildx'
    runs-on: [velnor, ubuntu-26.04-scale-set]
    timeout-minutes: 5
    defaults:
      run:
        shell: bash -e {0}
    steps:
      - name: Buildx probe
        run: docker buildx version && printf 'FROM scratch\n' > Dockerfile && docker buildx build --progress=plain -t velnor-g4:probe .
  expect-fail-hosted:
    name: Expected negative / GitHub hosted
    if: inputs.mode == 'negative'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Intentional failure
        run: echo expected-negative && exit 1
  expect-fail-scale-set:
    name: Expected negative / Velnor Scale Set
    if: inputs.mode == 'negative'
    runs-on: [velnor, ubuntu-26.04-scale-set]
    timeout-minutes: 5
    defaults:
      run:
        shell: bash -e {0}
    steps:
      - name: Intentional failure
        run: echo expected-negative && exit 1
  composite-hosted:
    name: Composite / GitHub hosted
    if: inputs.mode == 'composite'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
      - name: Local composite
        uses: ./qualification/actions/composite # zizmor: ignore[self-repository]
  composite-scale-set:
    name: Composite / Velnor Scale Set
    if: inputs.mode == 'composite'
    runs-on: [velnor, ubuntu-26.04-scale-set]
    timeout-minutes: 5
    defaults:
      run:
        shell: bash -e {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
      - name: Local composite
        uses: ./qualification/actions/composite # zizmor: ignore[self-repository]
  js-pin-hosted:
    name: Pinned JavaScript / GitHub hosted
    if: inputs.mode == 'js-pin'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Pinned script
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: console.log('js-pin-ok')
  js-pin-scale-set:
    name: Pinned JavaScript / Velnor Scale Set
    if: inputs.mode == 'js-pin'
    runs-on: [velnor, ubuntu-26.04-scale-set]
    timeout-minutes: 5
    defaults:
      run:
        shell: bash -e {0}
    steps:
      - name: Pinned script
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: console.log('js-pin-ok')
  docker-action-hosted:
    name: Docker action / GitHub hosted
    if: inputs.mode == 'docker-action'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
      - name: Local docker
        uses: ./qualification/actions/docker # zizmor: ignore[self-repository]
  docker-action-scale-set:
    name: Docker action / Velnor Scale Set
    if: inputs.mode == 'docker-action'
    runs-on: [velnor, ubuntu-26.04-scale-set]
    timeout-minutes: 5
    defaults:
      run:
        shell: bash -e {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
      - name: Local docker
        uses: ./qualification/actions/docker # zizmor: ignore[self-repository]
  container-hosted:
    name: Container / GitHub hosted
    if: inputs.mode == 'container'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    defaults:
      run:
        shell: sh -e {0}
    container: alpine:3.24.2@sha256:d56c381f961d307a21b3ca004cf1e3910f106644aefb1f43e654c8a56c4fd395
    services:
      redis:
        image: redis:8.10.2-alpine@sha256:2d3814be5e9b06a30a0be54770b7e12052e7e79ec85271aefd34875c1f393b23
        options: "--health-cmd \"redis-cli ping\" --health-interval 5s --health-timeout 5s --health-retries 12"
        ports:
          - "6379:6379"
    steps:
      - name: Service DNS
        shell: sh
        run: "i=0; while [ \"$i\" -lt 20 ]; do nc -z -w 1 redis 6379 && exit 0; i=$((i+1)); sleep 1; done; exit 1"
  container-scale-set:
    name: Container / Velnor Scale Set
    if: inputs.mode == 'container'
    runs-on: [velnor, ubuntu-26.04-scale-set]
    timeout-minutes: 5
    defaults:
      run:
        shell: sh -e {0}
    container: alpine:3.24.2@sha256:d56c381f961d307a21b3ca004cf1e3910f106644aefb1f43e654c8a56c4fd395
    services:
      redis:
        image: redis:8.10.2-alpine@sha256:2d3814be5e9b06a30a0be54770b7e12052e7e79ec85271aefd34875c1f393b23
        options: "--health-cmd \"redis-cli ping\" --health-interval 5s --health-timeout 5s --health-retries 12"
        ports:
          - "6379:6379"
    steps:
      - name: Service DNS
        shell: sh
        run: "i=0; while [ \"$i\" -lt 20 ]; do nc -z -w 1 redis 6379 && exit 0; i=$((i+1)); sleep 1; done; exit 1"
  outputs-scale-set:
    name: Outputs / Velnor Scale Set
    if: inputs.mode == 'outputs'
    runs-on: [velnor, ubuntu-26.04-scale-set]
    timeout-minutes: 5
    defaults:
      run:
        shell: bash -e {0}
    outputs:
      proof: ${{ steps.emit.outputs.proof }}
    steps:
      - name: Write output env and path
        id: emit
        run: "mkdir -p \"$RUNNER_TEMP/g4-bin\" && printf '%s\\n' '#!/bin/sh' 'echo path-ok' > \"$RUNNER_TEMP/g4-bin/g4-path-ok\" && chmod +x \"$RUNNER_TEMP/g4-bin/g4-path-ok\" && echo proof=outputs-ok >> \"$GITHUB_OUTPUT\" && echo G4_ENV=outputs-ok >> \"$GITHUB_ENV\" && echo \"$RUNNER_TEMP/g4-bin\" >> \"$GITHUB_PATH\""
      - name: Check env and path
        run: "test \"$G4_ENV\" = outputs-ok && g4-path-ok | grep -qx path-ok"
  outputs-hosted:
    name: Outputs / GitHub hosted
    if: inputs.mode == 'outputs'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs:
      - outputs-scale-set
    steps:
      - name: Check job output
        env:
          PROOF: ${{ needs.outputs-scale-set.outputs.proof }}
        run: "test \"$PROOF\" = outputs-ok"
  mask-hosted:
    name: Mask / GitHub hosted
    if: inputs.mode == 'mask'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Mask canary
        run: "echo \"::add-mask::g4-mask-canary\" && echo g4-mask-canary"
  mask-scale-set:
    name: Mask / Velnor Scale Set
    if: inputs.mode == 'mask'
    runs-on: [velnor, ubuntu-26.04-scale-set]
    timeout-minutes: 5
    defaults:
      run:
        shell: bash -e {0}
    steps:
      - name: Mask canary
        run: "echo \"::add-mask::g4-mask-canary\" && echo g4-mask-canary"
  cache-scale-set:
    name: Cache / Velnor Scale Set
    if: inputs.mode == 'cache'
    runs-on: [velnor, ubuntu-26.04-scale-set]
    timeout-minutes: 5
    defaults:
      run:
        shell: bash -e {0}
    permissions:
      contents: read
      actions: write
    steps:
      - name: Write cache file
        run: echo cache-ok > g4-cache.txt
      - name: Save cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: g4-cache.txt
          key: g4-cache-${{ github.run_id }}
  cache-hosted:
    name: Cache / GitHub hosted
    if: inputs.mode == 'cache'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs:
      - cache-scale-set
    permissions:
      contents: read
      actions: write
    steps:
      - name: Restore cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: g4-cache.txt
          key: g4-cache-${{ github.run_id }}
          fail-on-cache-miss: "true"
      - name: Check restore
        run: grep -qx cache-ok g4-cache.txt
  empty-cache-hosted:
    name: Empty cache / GitHub hosted
    if: inputs.mode == 'empty-cache'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Restore absent cache
        id: empty
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: g4-cache.txt
          key: g4-empty-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          fail-on-cache-miss: "false"
      - name: Require cache miss
        env:
          HIT: ${{ steps.empty.outputs.cache-hit }}
        run: "test -z \"$HIT\" || test \"$HIT\" = false"
      - name: Write spaced path
        run: "mkdir -p \"g4 cache\" && printf '%s\n' cache-ok > \"g4 cache/note.txt\""
      - name: Save spaced path
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: "g4 cache/note.txt"
          key: g4-space-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - name: Remove spaced path
        run: "rm -f \"g4 cache/note.txt\""
      - name: Restore spaced path
        id: space
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: "g4 cache/note.txt"
          key: g4-space-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          fail-on-cache-miss: "true"
      - name: Require spaced restore
        env:
          HIT: ${{ steps.space.outputs.cache-hit }}
        run: "grep -qx cache-ok \"g4 cache/note.txt\" && test \"$HIT\" = true"
  empty-cache-scale-set:
    name: Empty cache / Velnor Scale Set
    if: inputs.mode == 'empty-cache'
    runs-on: [velnor, ubuntu-26.04-scale-set]
    timeout-minutes: 5
    defaults:
      run:
        shell: bash -e {0}
    permissions:
      contents: read
      actions: write
    steps:
      - name: Restore absent cache
        id: empty
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: g4-cache.txt
          key: g4-empty-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          fail-on-cache-miss: "false"
      - name: Require cache miss
        env:
          HIT: ${{ steps.empty.outputs.cache-hit }}
        run: "test -z \"$HIT\" || test \"$HIT\" = false"
      - name: Write spaced path
        run: "mkdir -p \"g4 cache\" && printf '%s\n' cache-ok > \"g4 cache/note.txt\""
      - name: Save spaced path
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: "g4 cache/note.txt"
          key: g4-space-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - name: Remove spaced path
        run: "rm -f \"g4 cache/note.txt\""
      - name: Restore spaced path
        id: space
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: "g4 cache/note.txt"
          key: g4-space-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          fail-on-cache-miss: "true"
      - name: Require spaced restore
        env:
          HIT: ${{ steps.space.outputs.cache-hit }}
        run: "grep -qx cache-ok \"g4 cache/note.txt\" && test \"$HIT\" = true"
  oidc-hosted:
    name: OIDC / GitHub hosted
    if: inputs.mode == 'oidc'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Require OIDC request URL
        run: "test -n \"$ACTIONS_ID_TOKEN_REQUEST_URL\""
  oidc-scale-set:
    name: OIDC / Velnor Scale Set
    if: inputs.mode == 'oidc'
    runs-on: [velnor, ubuntu-26.04-scale-set]
    timeout-minutes: 5
    defaults:
      run:
        shell: bash -e {0}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Require OIDC request URL
        run: "test -n \"$ACTIONS_ID_TOKEN_REQUEST_URL\""
  post-fail-hosted:
    name: Post failure / GitHub hosted
    if: inputs.mode == 'post-fail'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
      - name: Main fails post runs
        uses: ./qualification/actions/post-fail # zizmor: ignore[self-repository]
  post-fail-scale-set:
    name: Post failure / Velnor Scale Set
    if: inputs.mode == 'post-fail'
    runs-on: [velnor, ubuntu-26.04-scale-set]
    timeout-minutes: 5
    defaults:
      run:
        shell: bash -e {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
      - name: Main fails post runs
        uses: ./qualification/actions/post-fail # zizmor: ignore[self-repository]
  cancel-hosted:
    name: Cancel / GitHub hosted
    if: inputs.mode == 'cancel'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Sleep until cancelled
        run: sleep 180
  cancel-scale-set:
    name: Cancel / Velnor Scale Set
    if: inputs.mode == 'cancel'
    runs-on: [velnor, ubuntu-26.04-scale-set]
    timeout-minutes: 5
    defaults:
      run:
        shell: bash -e {0}
    steps:
      - name: Sleep until cancelled
        run: sleep 180
  compose-hosted:
    name: Compose / GitHub hosted
    if: inputs.mode == 'compose'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
      - name: Start compose
        run: docker compose -f qualification/compose/stack.yml up -d --wait
      - name: Prove both services
        run: "docker compose -f qualification/compose/stack.yml ps --services --status running > \"$RUNNER_TEMP/g4-compose-ps\" && grep -qx api \"$RUNNER_TEMP/g4-compose-ps\" && grep -qx db \"$RUNNER_TEMP/g4-compose-ps\""
      - name: Remove compose
        run: docker compose -f qualification/compose/stack.yml down --volumes
      - name: Record compose
        run: echo compose-ok
  compose-scale-set:
    name: Compose / Velnor Scale Set
    if: inputs.mode == 'compose'
    runs-on: [velnor, ubuntu-26.04-scale-set]
    timeout-minutes: 5
    defaults:
      run:
        shell: bash -e {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
      - name: Start compose
        run: docker compose -f qualification/compose/stack.yml up -d --wait
      - name: Prove both services
        run: "docker compose -f qualification/compose/stack.yml ps --services --status running > \"$RUNNER_TEMP/g4-compose-ps\" && grep -qx api \"$RUNNER_TEMP/g4-compose-ps\" && grep -qx db \"$RUNNER_TEMP/g4-compose-ps\""
      - name: Remove compose
        run: docker compose -f qualification/compose/stack.yml down --volumes
      - name: Record compose
        run: echo compose-ok
  bind-hosted:
    name: Bind / GitHub hosted
    if: inputs.mode == 'bind'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Bind workspace file
        run: "printf '%s\\n' bind-ok > \"$GITHUB_WORKSPACE/g4-bind.txt\" && docker run --rm -v \"$GITHUB_WORKSPACE/g4-bind.txt:/g4-bind.txt:ro\" alpine:3.24.2@sha256:d56c381f961d307a21b3ca004cf1e3910f106644aefb1f43e654c8a56c4fd395 cat /g4-bind.txt > \"$RUNNER_TEMP/g4-bind-out\" && grep -qx bind-ok \"$RUNNER_TEMP/g4-bind-out\""
  bind-scale-set:
    name: Bind / Velnor Scale Set
    if: inputs.mode == 'bind'
    runs-on: [velnor, ubuntu-26.04-scale-set]
    timeout-minutes: 5
    defaults:
      run:
        shell: bash -e {0}
    steps:
      - name: Bind workspace file
        run: "printf '%s\\n' bind-ok > \"$GITHUB_WORKSPACE/g4-bind.txt\" && docker run --rm -v \"$GITHUB_WORKSPACE/g4-bind.txt:/g4-bind.txt:ro\" alpine:3.24.2@sha256:d56c381f961d307a21b3ca004cf1e3910f106644aefb1f43e654c8a56c4fd395 cat /g4-bind.txt > \"$RUNNER_TEMP/g4-bind-out\" && grep -qx bind-ok \"$RUNNER_TEMP/g4-bind-out\""
  cancel-service-hosted:
    name: Cancel service / GitHub hosted
    if: inputs.mode == 'cancel-service'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    services:
      redis:
        image: redis:8.10.2-alpine@sha256:2d3814be5e9b06a30a0be54770b7e12052e7e79ec85271aefd34875c1f393b23
        options: "--health-cmd \"redis-cli ping\" --health-interval 5s --health-timeout 5s --health-retries 12"
        ports:
          - "6379:6379"
    steps:
      - name: Probe service then sleep
        run: "i=0; while [ \"$i\" -lt 30 ]; do nc -z -w 1 127.0.0.1 6379 && break; i=$((i+1)); sleep 1; done; nc -z -w 1 127.0.0.1 6379 && echo service-up && sleep 900"
  cancel-service-scale-set:
