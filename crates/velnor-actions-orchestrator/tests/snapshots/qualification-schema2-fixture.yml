\"$rustc_path\" -vV > \"$probe_dir/rustc-vv\"; mise --no-config --no-env --no-hooks exec rust@1.99.1 -- \"$probe_dir/mbx-rustc\" \"$rustc_path\" -vV > \"$probe_dir/mbx-rustc-vv\"; cmp -s \"$probe_dir/rustc-vv\" \"$probe_dir/mbx-rustc-vv\" || { printf '\\''%s\\n'\\'' '\\''mbx-rustc -vV differs from rustc -vV'\\'' >&2; exit 1; }; mbx_disk_sample() { boundary=$1; case \"${RUNNER_TEMP:-}\" in /*) ;; *) printf '\\''%s\\n'\\'' '\\''MBX_DISK_SAMPLE_ERROR runner_temp_not_absolute'\\'' >&2; return 0 ;; esac; if [ -d \"$RUNNER_TEMP\" ] && [ ! -L \"$RUNNER_TEMP\" ]; then printf '\\''MBX_DISK_SAMPLE boundary=%s volume=runner_temp blocks_kib\\n'\\'' \"$boundary\"; if df -Pk \"$RUNNER_TEMP\"; then :; else printf '\\''MBX_DISK_SAMPLE_ERROR boundary=%s command=df_blocks\\n'\\'' \"$boundary\" >&2; fi; printf '\\''MBX_DISK_SAMPLE boundary=%s volume=runner_temp inodes\\n'\\'' \"$boundary\"; if df -Pi \"$RUNNER_TEMP\"; then :; else printf '\\''MBX_DISK_SAMPLE_ERROR boundary=%s command=df_inodes\\n'\\'' \"$boundary\" >&2; fi; else printf '\\''MBX_DISK_SAMPLE_ERROR boundary=%s runner_temp_not_real_directory\\n'\\'' \"$boundary\" >&2; return 0; fi; store_path=\"$RUNNER_TEMP/velnor/mbx\"; if [ \"${MBX_CACHE_DIR:-}\" = \"$store_path\" ] && [ -d \"$store_path\" ] && [ ! -L \"$store_path\" ]; then printf '\\''MBX_DISK_ALLOCATED_KIB boundary=%s root=mbx_store\\n'\\'' \"$boundary\"; if du -sk \"$store_path\"; then :; else printf '\\''MBX_DISK_SAMPLE_ERROR boundary=%s path=mbx_store command=du\\n'\\'' \"$boundary\" >&2; fi; else printf '\\''MBX_DISK_SAMPLE_ERROR boundary=%s path=mbx_store_unavailable\\n'\\'' \"$boundary\" >&2; fi; target_path=\"${target_dir:-target}\"; if [ ! -d \"$target_path\" ]; then for candidate in */target crates/*/target \"$RUNNER_TEMP/velnor/target\"; do if [ -d \"$candidate\" ]; then target_path=\"$candidate\"; break; fi; done; fi; if [ -L \"$target_path\" ]; then printf '\\''MBX_DISK_SAMPLE_ERROR boundary=%s path=target_is_symlink\\n'\\'' \"$boundary\" >&2; elif [ -d \"$target_path\" ]; then printf '\\''MBX_DISK_ALLOCATED_KIB boundary=%s root=target\\n'\\'' \"$boundary\"; if du -sk \"$target_path\"; then :; else printf '\\''MBX_DISK_SAMPLE_ERROR boundary=%s path=target command=du\\n'\\'' \"$boundary\" >&2; fi; else printf '\\''MBX_DISK_ALLOCATED_KIB boundary=%s root=target state=absent\\n'\\'' \"$boundary\"; fi; }; mbx_disk_sample after-cache-restore'"
      - name: Build and record the fixture digest
        id: build
        shell: bash
        run: "set -eu\noutput=$(bash scripts/qualification/paired-sdk-build.sh \"$RUNNER_TEMP/paired-sdk-artifact\")\ncase \"$output\" in binary_sha256=*) digest=${output#binary_sha256=} ;; *) exit 1 ;; esac\ncase \"$digest\" in *[!0123456789abcdef]*|'') exit 1 ;; esac\ntest \"${#digest}\" -eq 64\nprintf 'binary_sha256=%s\\n' \"$digest\" >> \"$GITHUB_OUTPUT\"\ntest -f \"$RUNNER_TEMP/paired-sdk-artifact/velnor-testcontainers-tls-fixture\" && test -s \"$RUNNER_TEMP/paired-sdk-artifact/velnor-testcontainers-tls-fixture\"\ntest -f \"$RUNNER_TEMP/paired-sdk-artifact/manifest.txt\" && test -s \"$RUNNER_TEMP/paired-sdk-artifact/manifest.txt\""
      - name: Upload paired SDK fixture
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: velnor-paired-sdk-${{ github.run_id }}-${{ github.run_attempt }}
          path: "${{ runner.temp }}/paired-sdk-artifact/velnor-testcontainers-tls-fixture\n${{ runner.temp }}/paired-sdk-artifact/manifest.txt"
          if-no-files-found: error
          retention-days: 1
  paired-sdk-tls:
    name: Verify paired SDK HTTPS
    if: inputs.mode == 'paired-sdk-tls'
    runs-on: [velnor, ubuntu-26.04-scale-set]
    timeout-minutes: 30
    needs:
      - paired-sdk-build
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
      - name: Download this run's fixture
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.paired-sdk-build.outputs.artifact_id }}
          path: ${{ runner.temp }}/paired-sdk-artifact
      - name: Run Node and Rust HTTPS checks
        shell: bash
        env:
          VELNOR_PAIRED_SDK_BINARY_SHA256: ${{ needs.paired-sdk-build.outputs.binary_sha256 }}
        run: "bash scripts/qualification/paired-sdk-run.sh \"$RUNNER_TEMP/paired-sdk-artifact\""
