name: Generator release
"on":
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify-release-source:
    name: Verify generator release source
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "1"
          persist-credentials: "false"
      - name: Setup Mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5
        with:
          cache: "false"
          env: "false"
          install: "false"
          version: 2026.9.18
      - name: Install pinned release gate tools
        shell: bash
        run: mise --no-config --no-env --no-hooks install rust@1.98.1 gh@2.102.0
      - name: Require successful CI at exact main SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: "set -eu\ntest \"$GITHUB_REPOSITORY\" = 'tailrocks/velnor-new'\ntest \"$GITHUB_REF\" = 'refs/heads/main'\ntest \"$GITHUB_EVENT_NAME\" = 'workflow_dispatch'\ntest \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\"\ntest \"$(mise --no-config --no-env --no-hooks exec gh@2.102.0 -- gh api repos/tailrocks/velnor-new/commits/main --jq .sha)\" = \"$GITHUB_SHA\"\nruns=\"$(mise --no-config --no-env --no-hooks exec gh@2.102.0 -- gh api --paginate --slurp \"repos/tailrocks/velnor-new/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&per_page=100\")\"\nrun=\"$(printf '%s\\n' \"$runs\" | jq -ce --arg sha \"$GITHUB_SHA\" --arg repo 'tailrocks/velnor-new' '[.[] | (.workflow_runs // [])[] | select(.path == \".github/workflows/ci.yml\" and .head_sha == $sha and .head_branch == \"main\" and .head_repository.full_name == $repo and .event == \"push\")] | sort_by([.run_number, .id]) | last // error(\"no exact-source main CI run\")')\"\ntest \"$(printf '%s\\n' \"$run\" | jq -r .status)\" = completed\ntest \"$(printf '%s\\n' \"$run\" | jq -r .conclusion)\" = success\nrun_id=\"$(printf '%s\\n' \"$run\" | jq -r .id)\"\nattempt=\"$(printf '%s\\n' \"$run\" | jq -r .run_attempt)\"\njobs=\"$(mise --no-config --no-env --no-hooks exec gh@2.102.0 -- gh api --paginate --slurp \"repos/tailrocks/velnor-new/actions/runs/$run_id/attempts/$attempt/jobs?per_page=100\")\"\nprintf '%s\\n' \"$jobs\" | jq -e --arg sha \"$GITHUB_SHA\" '[.[] | (.jobs // [])[] | select(.name == \"Required\" and .head_sha == $sha and .head_branch == \"main\" and .status == \"completed\" and .conclusion == \"success\")] | length == 1' >/dev/null\ntest \"$(mise --no-config --no-env --no-hooks exec gh@2.102.0 -- gh api repos/tailrocks/velnor-new/commits/main --jq .sha)\" = \"$GITHUB_SHA\""
      - name: Check release freshness gate
        shell: bash
        run: bash scripts/check-freshness.sh
      - name: Recheck default-branch source
        shell: bash
        run: "set -eu\ntest \"$GITHUB_REF\" = \"refs/heads/main\"\ntest \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\"\ntest \"$(mise --no-config --no-env --no-hooks exec gh@2.102.0 -- gh api repos/tailrocks/velnor-new/commits/main --jq .sha)\" = \"$GITHUB_SHA\""
  build-linux:
    name: Build Linux velnor-actions
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
    needs:
      - verify-release-source
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "1"
          persist-credentials: "false"
      - name: Setup Mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5
        with:
          cache: "false"
          env: "false"
          install: "false"
          version: 2026.9.18
      - name: Install pinned Rust and MBX
        shell: bash
        run: mise --no-config --no-env --no-hooks install rust@1.98.1 mr-boxington@1.21.1
      - name: Build velnor-actions with MBX
        shell: bash
        run: "set -eu\nenv -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_RUNTIME_TOKEN -u GITHUB_TOKEN -u MISE_GITHUB_TOKEN -u GH_TOKEN -u GH_HOST -u GH_CONFIG_DIR mise --no-config --no-env --no-hooks exec rust@1.98.1 mr-boxington@1.21.1 -- mbx build --release --locked --package velnor-actions-cli --bin velnor-actions\ncp target/release/velnor-actions velnor-actions-0.1.0-x86_64-unknown-linux-gnu\ntest -s velnor-actions-0.1.0-x86_64-unknown-linux-gnu"
      - name: Verify ELF architecture
        shell: bash
        run: "set -eu\ndesc=\"$(file -b velnor-actions-0.1.0-x86_64-unknown-linux-gnu)\"\ncase \"$desc\" in\n  *ELF*x86-64*) ;;\n  *) echo \"not an x86-64 ELF: $desc\" >&2; exit 1 ;;\nesac"
      - name: Checksum built bytes
        shell: bash
        run: "set -eu\nsha256sum velnor-actions-0.1.0-x86_64-unknown-linux-gnu > velnor-actions-0.1.0-x86_64-unknown-linux-gnu.sha256"
      - name: Record candidate provenance
        shell: bash
        run: "set -eu\ndigest=\"$(awk 'NR == 1 && NF == 2 { print $1; next } { exit 1 } END { if (NR != 1) exit 1 }' velnor-actions-0.1.0-x86_64-unknown-linux-gnu.sha256)\"\ntest \"${#digest}\" -eq 64\ncase \"$digest\" in *[!0123456789abcdef]*|'') exit 1 ;; esac\njq -n --arg repository \"$GITHUB_REPOSITORY\" --arg commit \"$GITHUB_SHA\" --arg target \"x86_64-unknown-linux-gnu\" --arg asset \"velnor-actions-0.1.0-x86_64-unknown-linux-gnu\" --arg sha256 \"$digest\" --arg rust 1.98.1 --arg mr_boxington 1.21.1 '{\"schema\":1,\"version\":\"0.1.0\",\"repository\":$repository,\"commit\":$commit,\"target\":$target,\"asset\":$asset,\"sha256\":$sha256,\"toolchain\":{\"rust\":$rust,\"mr-boxington\":$mr_boxington}}' > velnor-actions-0.1.0-x86_64-unknown-linux-gnu.provenance.json\ntest -s velnor-actions-0.1.0-x86_64-unknown-linux-gnu.provenance.json\ntest -s velnor-actions-0.1.0-x86_64-unknown-linux-gnu"
      - name: Package candidate preserving executable mode
        shell: bash
        run: "set -eu\ntar -cf generator-linux-assets.tar velnor-actions-0.1.0-x86_64-unknown-linux-gnu velnor-actions-0.1.0-x86_64-unknown-linux-gnu.sha256 velnor-actions-0.1.0-x86_64-unknown-linux-gnu.provenance.json\ntest -s generator-linux-assets.tar"
      - name: Upload Linux assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: error
          name: generator-linux-assets
          path: generator-linux-assets.tar
          retention-days: 1
  attest-linux:
    name: Attest Linux velnor-actions
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    needs:
      - build-linux
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "1"
          persist-credentials: "false"
      - name: Setup Mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5
        with:
          cache: "false"
          env: "false"
          install: "false"
          version: 2026.9.18
      - name: Install pinned candidate qualification tools
        shell: bash
        run: "set -eu\nmise --no-config --no-env --no-hooks install actionlint@1.7.12 shellcheck@0.11.0 zizmor@1.30.1"
      - name: Download built asset archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: generator-linux-assets
          path: linux-assets
      - name: Extract uploaded candidate archive
        shell: bash
        run: "set -eu\narchive=linux-assets/generator-linux-assets.tar\nexpected=$(printf '%s\\n%s\\n%s' 'velnor-actions-0.1.0-x86_64-unknown-linux-gnu' 'velnor-actions-0.1.0-x86_64-unknown-linux-gnu.sha256' 'velnor-actions-0.1.0-x86_64-unknown-linux-gnu.provenance.json')\ntest \"$(tar -tf \"$archive\")\" = \"$expected\"\ntar -xf \"$archive\" -C linux-assets\ntest -f linux-assets/velnor-actions-0.1.0-x86_64-unknown-linux-gnu\ntest ! -L linux-assets/velnor-actions-0.1.0-x86_64-unknown-linux-gnu\ntest -x linux-assets/velnor-actions-0.1.0-x86_64-unknown-linux-gnu\ntest -f linux-assets/velnor-actions-0.1.0-x86_64-unknown-linux-gnu.sha256\ntest ! -L linux-assets/velnor-actions-0.1.0-x86_64-unknown-linux-gnu.sha256\ntest -f linux-assets/velnor-actions-0.1.0-x86_64-unknown-linux-gnu.provenance.json\ntest ! -L linux-assets/velnor-actions-0.1.0-x86_64-unknown-linux-gnu.provenance.json"
      - name: Verify downloaded checksum sidecar
        shell: bash
        run: "set -eu\ncd linux-assets\nsha256sum --check velnor-actions-0.1.0-x86_64-unknown-linux-gnu.sha256"
      - name: Verify candidate provenance record
        shell: bash
        run: "set -eu\ndigest=\"$(awk 'NR == 1 && NF == 2 { print $1; next } { exit 1 } END { if (NR != 1) exit 1 }' linux-assets/velnor-actions-0.1.0-x86_64-unknown-linux-gnu.sha256)\"\ntest \"${#digest}\" -eq 64\njq -e --arg version \"0.1.0\" --arg repository \"$GITHUB_REPOSITORY\" --arg commit \"$GITHUB_SHA\" --arg target \"x86_64-unknown-linux-gnu\" --arg asset \"velnor-actions-0.1.0-x86_64-unknown-linux-gnu\" --arg sha256 \"$digest\" --arg rust 1.98.1 --arg mr_boxington 1.21.1 '.schema == 1 and .version == $version and .repository == $repository and .commit == $commit and .target == $target and .asset == $asset and .sha256 == $sha256 and .toolchain.rust == $rust and .toolchain[\"mr-boxington\"] == $mr_boxington' linux-assets/velnor-actions-0.1.0-x86_64-unknown-linux-gnu.provenance.json > /dev/null"
      - name: Qualify downloaded candidate
        shell: bash
        run: "set -eu\ntest \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\"\ntest \"$(./linux-assets/velnor-actions-0.1.0-x86_64-unknown-linux-gnu --version)\" = \"velnor-actions 0.1.0\"\npreview=\"$RUNNER_TEMP/velnor-generator-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\"\n./linux-assets/velnor-actions-0.1.0-x86_64-unknown-linux-gnu generate --output-dir \"$preview\"\ndiff -r --brief .github \"$preview/.github\"\nmise --no-config --no-env --no-hooks exec actionlint@1.7.12 shellcheck@0.11.0 -- actionlint -color\nmise --no-config --no-env --no-hooks exec zizmor@1.30.1 -- zizmor --no-online-audits --config .zizmor.yml .github/workflows"
      - name: Attest built artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: "linux-assets/velnor-actions-0.1.0-x86_64-unknown-linux-gnu\nlinux-assets/velnor-actions-0.1.0-x86_64-unknown-linux-gnu.sha256\nlinux-assets/velnor-actions-0.1.0-x86_64-unknown-linux-gnu.provenance.json"
