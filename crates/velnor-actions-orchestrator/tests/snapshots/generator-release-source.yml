name: Fetch exact public source without an action post hook
description: Shared steps for Fetch exact public source without an action post hook
runs:
  using: composite
  steps:
    - name: Fetch exact public source without an action post hook
      shell: bash
      run: "set -eu\npython3 - \"$GITHUB_WORKSPACE\" \"$GITHUB_REPOSITORY\" \"$GITHUB_SHA\" <<'PY'\nimport os\nimport re\nimport subprocess\nimport sys\n\nworkspace, repository, commit = sys.argv[1:]\nif repository != \"tailrocks/velnor-new\" or re.fullmatch(r\"[0-9a-f]{40}\", commit) is None:\n    raise SystemExit(\"qualification source identity is invalid\")\n\nenvironment = os.environ.copy()\nfor name in tuple(environment):\n    if name.startswith(\"GIT_\") or name in {\n        \"ACTIONS_ID_TOKEN_REQUEST_TOKEN\",\n        \"ACTIONS_ID_TOKEN_REQUEST_URL\",\n        \"ACTIONS_RUNTIME_TOKEN\",\n        \"GITHUB_TOKEN\",\n        \"GH_TOKEN\",\n        \"MISE_GITHUB_TOKEN\",\n    }:\n        environment.pop(name, None)\nenvironment.update(\n    GIT_CONFIG_GLOBAL=os.devnull,\n    GIT_CONFIG_NOSYSTEM=\"1\",\n    GIT_TERMINAL_PROMPT=\"0\",\n)\n\ndef run_git(*arguments, timeout):\n    subprocess.run(\n        [\"git\", *arguments],\n        cwd=workspace,\n        env=environment,\n        check=True,\n        timeout=timeout,\n    )\n\nrun_git(\"init\", \"--quiet\", timeout=10)\nrun_git(\n    \"-c\",\n    \"credential.helper=\",\n    \"fetch\",\n    \"--quiet\",\n    \"--depth=1\",\n    \"--no-tags\",\n    f\"https://github.com/{repository}.git\",\n    commit,\n    timeout=60,\n)\nrun_git(\"checkout\", \"--quiet\", \"--detach\", \"FETCH_HEAD\", timeout=10)\nhead = subprocess.run(\n    [\"git\", \"rev-parse\", \"HEAD\"],\n    cwd=workspace,\n    env=environment,\n    check=True,\n    capture_output=True,\n    text=True,\n    timeout=5,\n).stdout.strip()\nif head != commit:\n    raise SystemExit(\"qualification source does not match the requested commit\")\nPY"
