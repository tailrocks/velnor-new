name: Attest macOS velnor-actions
description: Shared steps for Attest macOS velnor-actions
inputs:
  artifact_id:
    description: Artifact ID from this target's build job
    required: true
runs:
  using: composite
  steps:
    - name: Setup Mise
      uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
      with:
        version: 2026.10.6
        sha256: bbcea7b0f844d026424a4c8335357a15a2f5c9e9132c9408de990d9be6f26101
        install: "false"
        env: "false"
        cache: "false"
        cache_save: "false"
    - name: Install pinned GitHub CLI
      shell: bash
      run: mise --no-config --no-env --no-hooks install gh@2.102.0
    - name: Download built asset archive
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: ${{ inputs.artifact_id }}
        path: macos-assets
    - name: Prevalidate and extract uploaded candidate archive
      shell: bash
      run: "set -eu\nbash scripts/with-owned-archive-guard.sh -- python3 scripts/generator-release/extract-candidate.py 'macos-assets/generator-macos-assets.tar' 'macos-assets' 'velnor-actions-0.1.6-aarch64-apple-darwin' 'velnor-actions-0.1.6-aarch64-apple-darwin.sha256' 'velnor-actions-0.1.6-aarch64-apple-darwin.provenance.json'"
    - name: Verify extracted candidate file types and executable mode
      shell: bash
      run: "set -eu\ntest -f macos-assets/velnor-actions-0.1.6-aarch64-apple-darwin\ntest ! -L macos-assets/velnor-actions-0.1.6-aarch64-apple-darwin\ntest -x macos-assets/velnor-actions-0.1.6-aarch64-apple-darwin\ntest -f macos-assets/velnor-actions-0.1.6-aarch64-apple-darwin.sha256\ntest ! -L macos-assets/velnor-actions-0.1.6-aarch64-apple-darwin.sha256\ntest ! -x macos-assets/velnor-actions-0.1.6-aarch64-apple-darwin.sha256\ntest -f macos-assets/velnor-actions-0.1.6-aarch64-apple-darwin.provenance.json\ntest ! -L macos-assets/velnor-actions-0.1.6-aarch64-apple-darwin.provenance.json\ntest ! -x macos-assets/velnor-actions-0.1.6-aarch64-apple-darwin.provenance.json"
    - name: Verify candidate provenance record
      shell: bash
      run: "set -eu\ndigest=\"$(awk -v expected='velnor-actions-0.1.6-aarch64-apple-darwin' 'NR == 1 { if (NF != 2 || length($1) != 64 || $1 !~ /^[0-9a-f]+$/ || $2 != expected) exit 1; print $1; next } { exit 1 } END { if (NR != 1) exit 1 }' 'macos-assets/velnor-actions-0.1.6-aarch64-apple-darwin.sha256')\"\njq -e --arg version \"0.1.6\" --arg repository \"$GITHUB_REPOSITORY\" --arg commit \"$GITHUB_SHA\" --arg target \"aarch64-apple-darwin\" --arg asset \"velnor-actions-0.1.6-aarch64-apple-darwin\" --arg sha256 \"$digest\" --arg rust '1.98.1' --arg mr_boxington '1.21.1' '.schema == 1 and .version == $version and .repository == $repository and .commit == $commit and .target == $target and .asset == $asset and .sha256 == $sha256 and .toolchain.rust == $rust and .toolchain[\"mr-boxington\"] == $mr_boxington' macos-assets/velnor-actions-0.1.6-aarch64-apple-darwin.provenance.json > /dev/null"
    - name: Verify downloaded checksum sidecar
      shell: bash
      run: "set -eu\ncd macos-assets\nshasum -a 256 --check velnor-actions-0.1.6-aarch64-apple-darwin.sha256"
    - name: Attest built artifacts
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-path: "macos-assets/velnor-actions-0.1.6-aarch64-apple-darwin\nmacos-assets/velnor-actions-0.1.6-aarch64-apple-darwin.sha256\nmacos-assets/velnor-actions-0.1.6-aarch64-apple-darwin.provenance.json"
    - name: Fetch and verify candidate attestation bundles
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: "gh() {\n  (\n    mise --no-config --no-env --no-hooks exec gh@2.102.0 -- gh \"$@\" & _velnor_gh_pid=$!\n    ( sleep 60; kill -TERM \"$_velnor_gh_pid\" 2>/dev/null; sleep 5; kill -KILL \"$_velnor_gh_pid\" 2>/dev/null ) </dev/null >/dev/null 2>&1 & _velnor_gh_watch=$!\n    _velnor_gh_status=0\n    wait \"$_velnor_gh_pid\" || _velnor_gh_status=$?\n    kill -KILL \"$_velnor_gh_watch\" 2>/dev/null || true\n    wait \"$_velnor_gh_watch\" 2>/dev/null || true\n    exit \"$_velnor_gh_status\"\n  ) </dev/null\n}\nexport -f gh\nset -eu\nmkdir -p release-attestations\ntest \"$GITHUB_WORKFLOW_SHA\" = \"$GITHUB_SHA\"\nsubject='macos-assets/velnor-actions-0.1.6-aarch64-apple-darwin'\ndigest=\"$(if command -v sha256sum >/dev/null 2>&1; then\n  sha256sum \"$subject\" | awk 'NR == 1 { print $1; next } { exit 1 } END { if (NR != 1) exit 1 }'\nelif command -v shasum >/dev/null 2>&1; then\n  shasum -a 256 \"$subject\" | awk 'NR == 1 { print $1; next } { exit 1 } END { if (NR != 1) exit 1 }'\nelse\n  echo 'no SHA-256 utility is available' >&2\n  exit 1\nfi)\"\ntest \"${#digest}\" -eq 64\ncase \"$digest\" in *[!0123456789abcdef]*|'') exit 1 ;; esac\nbundle=\"sha256:${digest}.jsonl\"\ntest ! -e \"$bundle\"\ndownloaded=false\nfor attempt in 1 2 3 4 5; do\n  if gh attestation download \"$subject\" --repo \"$GITHUB_REPOSITORY\" --predicate-type https://slsa.dev/provenance/v1 --limit 10 && test -s \"$bundle\"; then downloaded=true; break; fi\n  if test \"$attempt\" -lt 5; then sleep 3; fi\ndone\ntest \"$downloaded\" = true\ngh attestation verify \"$subject\" --repo \"$GITHUB_REPOSITORY\" --bundle \"$bundle\" --source-digest \"$GITHUB_SHA\" --source-ref refs/heads/main --signer-workflow \"${GITHUB_REPOSITORY}/.github/workflows/product-release-generator.yml\" --signer-digest \"$GITHUB_SHA\" > /dev/null\nmv \"$bundle\" \"release-attestations/velnor-actions-0.1.6-aarch64-apple-darwin.intoto.jsonl\"\ntest \"$GITHUB_WORKFLOW_SHA\" = \"$GITHUB_SHA\"\nsubject='macos-assets/velnor-actions-0.1.6-aarch64-apple-darwin.sha256'\ndigest=\"$(if command -v sha256sum >/dev/null 2>&1; then\n  sha256sum \"$subject\" | awk 'NR == 1 { print $1; next } { exit 1 } END { if (NR != 1) exit 1 }'\nelif command -v shasum >/dev/null 2>&1; then\n  shasum -a 256 \"$subject\" | awk 'NR == 1 { print $1; next } { exit 1 } END { if (NR != 1) exit 1 }'\nelse\n  echo 'no SHA-256 utility is available' >&2\n  exit 1\nfi)\"\ntest \"${#digest}\" -eq 64\ncase \"$digest\" in *[!0123456789abcdef]*|'') exit 1 ;; esac\nbundle=\"sha256:${digest}.jsonl\"\ntest ! -e \"$bundle\"\ndownloaded=false\nfor attempt in 1 2 3 4 5; do\n  if gh attestation download \"$subject\" --repo \"$GITHUB_REPOSITORY\" --predicate-type https://slsa.dev/provenance/v1 --limit 10 && test -s \"$bundle\"; then downloaded=true; break; fi\n  if test \"$attempt\" -lt 5; then sleep 3; fi\ndone\ntest \"$downloaded\" = true\ngh attestation verify \"$subject\" --repo \"$GITHUB_REPOSITORY\" --bundle \"$bundle\" --source-digest \"$GITHUB_SHA\" --source-ref refs/heads/main --signer-workflow \"${GITHUB_REPOSITORY}/.github/workflows/product-release-generator.yml\" --signer-digest \"$GITHUB_SHA\" > /dev/null\nmv \"$bundle\" \"release-attestations/velnor-actions-0.1.6-aarch64-apple-darwin.sha256.intoto.jsonl\"\ntest \"$GITHUB_WORKFLOW_SHA\" = \"$GITHUB_SHA\"\nsubject='macos-assets/velnor-actions-0.1.6-aarch64-apple-darwin.provenance.json'\ndigest=\"$(if command -v sha256sum >/dev/null 2>&1; then\n  sha256sum \"$subject\" | awk 'NR == 1 { print $1; next } { exit 1 } END { if (NR != 1) exit 1 }'\nelif command -v shasum >/dev/null 2>&1; then\n  shasum -a 256 \"$subject\" | awk 'NR == 1 { print $1; next } { exit 1 } END { if (NR != 1) exit 1 }'\nelse\n  echo 'no SHA-256 utility is available' >&2\n  exit 1\nfi)\"\ntest \"${#digest}\" -eq 64\ncase \"$digest\" in *[!0123456789abcdef]*|'') exit 1 ;; esac\nbundle=\"sha256:${digest}.jsonl\"\ntest ! -e \"$bundle\"\ndownloaded=false\nfor attempt in 1 2 3 4 5; do\n  if gh attestation download \"$subject\" --repo \"$GITHUB_REPOSITORY\" --predicate-type https://slsa.dev/provenance/v1 --limit 10 && test -s \"$bundle\"; then downloaded=true; break; fi\n  if test \"$attempt\" -lt 5; then sleep 3; fi\ndone\ntest \"$downloaded\" = true\ngh attestation verify \"$subject\" --repo \"$GITHUB_REPOSITORY\" --bundle \"$bundle\" --source-digest \"$GITHUB_SHA\" --source-ref refs/heads/main --signer-workflow \"${GITHUB_REPOSITORY}/.github/workflows/product-release-generator.yml\" --signer-digest \"$GITHUB_SHA\" > /dev/null\nmv \"$bundle\" \"release-attestations/velnor-actions-0.1.6-aarch64-apple-darwin.provenance.json.intoto.jsonl\""
    - name: Upload verified candidate attestation bundles
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        if-no-files-found: error
        name: generator-macos-assets-attestations
        path: "release-attestations/velnor-actions-0.1.6-aarch64-apple-darwin.intoto.jsonl\nrelease-attestations/velnor-actions-0.1.6-aarch64-apple-darwin.sha256.intoto.jsonl\nrelease-attestations/velnor-actions-0.1.6-aarch64-apple-darwin.provenance.json.intoto.jsonl"
        retention-days: 1
