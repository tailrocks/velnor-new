[package]
name = "velnor-actions-orchestrator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[features]
test-render-capture = ["velnor-actions-workflow-renderer/test-render-capture"]

[dependencies]
base64 = { workspace = true }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
lzma-rust2 = { version = "=0.23.0", default-features = false, features = ["std", "xz"] }
tar = { version = "=0.4.46", default-features = false }
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2"] }
velnor-actions-actionlint = { version = "=0.1.40", path = "../velnor-actions-actionlint" }
velnor-actions-ansible = { version = "=0.1.40", path = "../velnor-actions-ansible" }
velnor-actions-bun = { version = "=0.1.40", path = "../velnor-actions-bun" }
velnor-actions-contract = { version = "=0.1.40", path = "../velnor-actions-contract" }
velnor-actions-dbt = { version = "=0.1.40", path = "../velnor-actions-dbt" }
velnor-actions-mise = { version = "=0.1.40", path = "../velnor-actions-mise" }
velnor-actions-rust = { version = "=0.1.40", path = "../velnor-actions-rust" }
velnor-actions-tofu = { version = "=0.1.40", path = "../velnor-actions-tofu" }
velnor-actions-gradle = { version = "=0.1.40", path = "../velnor-actions-gradle" }
velnor-actions-workflow-renderer = { version = "=0.1.40", path = "../velnor-actions-workflow-renderer" }
rustix = { version = "=1.1.5", features = ["fs", "process"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sha1-checked = { version = "=0.10.0", default-features = false }
tempfile = { version = "=3.27.0" }
thiserror = { workspace = true }
toml = { version = "=1.1.8" }

# This dependency selects zip's pure-Rust deflate backend through feature
# unification; archive parsing calls it transitively through `zip`.
[package.metadata.cargo-machete]
ignored = ["flate2"]

[lints]
workspace = true

[[test]]
name = "velnor_orchestrator"
path = "tests/velnor_orchestrator.rs"

[[test]]
name = "validation_failure"
path = "tests/validation_failure.rs"

[dev-dependencies]
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
serde_json = { workspace = true }
syn = { version = "=3.0.9", default-features = false, features = ["full", "parsing", "printing", "visit"] }
tempfile = { version = "=3.27.0" }
velnor-actions-contract = { version = "=0.1.40", path = "../velnor-actions-contract" }
