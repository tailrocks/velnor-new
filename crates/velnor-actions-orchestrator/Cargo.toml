[package]
name = "velnor-actions-orchestrator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[[test]]
name = "controller_approval_public"
path = "tests/controller_approval_public.rs"

[[test]]
name = "homebrew_adoption_seed_public"
path = "tests/homebrew_adoption_seed_public.rs"

[[test]]
name = "velnor_orchestrator"
path = "tests/velnor_orchestrator.rs"

[[test]]
name = "task_report_public"
path = "tests/task_report_public.rs"

[[test]]
name = "workflow_configuration_public"
path = "tests/workflow_configuration_public.rs"

[lib]
test = true

[features]
test-render-capture = ["velnor-actions-workflow-renderer/test-render-capture"]

[dependencies]
velnor-archive-guard = { version = "=0.1.61", path = "../velnor-archive-guard" }
base64 = { workspace = true }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
lzma-rust2 = { version = "=0.23.0", default-features = false, features = ["std", "xz"] }
tar = { version = "=0.4.46", default-features = false }
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2"] }
velnor-actions-actionlint = { version = "=0.1.61", path = "../velnor-actions-actionlint" }
velnor-actions-ansible = { version = "=0.1.61", path = "../velnor-actions-ansible" }
velnor-actions-bun = { version = "=0.1.61", path = "../velnor-actions-bun" }
velnor-actions-contract = { version = "=0.1.61", path = "../velnor-actions-contract" }
velnor-actions-dbt = { version = "=0.1.61", path = "../velnor-actions-dbt" }
velnor-actions-mise = { version = "=0.1.61", path = "../velnor-actions-mise" }
velnor-actions-rust = { version = "=0.1.61", path = "../velnor-actions-rust" }
velnor-actions-tofu = { version = "=0.1.61", path = "../velnor-actions-tofu" }
velnor-actions-gradle = { version = "=0.1.61", path = "../velnor-actions-gradle" }
velnor-actions-workflow-renderer = { version = "=0.1.61", path = "../velnor-actions-workflow-renderer" }
rustix = { version = "=1.1.5", features = ["fs", "process"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sha1-checked = { version = "=0.10.0", default-features = false }
tempfile = { version = "=3.27.0" }
thiserror = { workspace = true }
toml = { version = "=1.1.8" }
rustls = { version = "=0.23.46", default-features = false, features = ["ring"] }
rustls-native-certs = { version = "=0.8.5", default-features = false }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls-no-provider"] }

# This dependency selects zip's pure-Rust deflate backend through feature
# unification; archive parsing calls it transitively through `zip`.
[package.metadata.cargo-machete]
ignored = ["flate2"]

[lints]
workspace = true

[dev-dependencies]
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
serde_json = { workspace = true }
syn = { version = "=3.0.9", default-features = false, features = ["full", "parsing", "printing", "visit"] }
tempfile = { version = "=3.27.0" }
velnor-actions-contract = { version = "=0.1.61", path = "../velnor-actions-contract" }
