[package]
name = "velnor-actions-orchestrator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
lzma-rust2 = { version = "=0.21.0", default-features = false, features = ["std", "xz"] }
tar = { version = "=0.4.46", default-features = false }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }
velnor-actions-actionlint = { version = "=0.1.4", path = "../velnor-actions-actionlint" }
velnor-actions-contract = { version = "=0.1.4", path = "../velnor-actions-contract" }
velnor-actions-mise = { version = "=0.1.4", path = "../velnor-actions-mise" }
velnor-actions-rust = { version = "=0.1.4", path = "../velnor-actions-rust" }
velnor-actions-tofu = { version = "=0.1.4", path = "../velnor-actions-tofu" }
velnor-actions-workflow-renderer = { version = "=0.1.4", path = "../velnor-actions-workflow-renderer" }
rustix = { version = "=1.1.5", features = ["fs"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { version = "=0.11.0" }
tempfile = { version = "=3.27.0" }
thiserror = { workspace = true }
toml = { version = "=0.9.12" }

# This dependency selects zip's pure-Rust deflate backend through feature
# unification; archive parsing calls it transitively through `zip`.
[package.metadata.cargo-machete]
ignored = ["flate2"]

[lints]
workspace = true

[[test]]
name = "velnor_orchestrator"
path = "tests/velnor_orchestrator.rs"

[[test]]
name = "validation_failure"
path = "tests/validation_failure.rs"

[dev-dependencies]
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
serde_json = { workspace = true }
syn = { version = "=3.0.6", default-features = false, features = ["full", "parsing", "printing", "visit"] }
tempfile = { version = "=3.27.0" }
velnor-actions-contract = { version = "=0.1.4", path = "../velnor-actions-contract" }
