[package]
name = "velnor-actions-orchestrator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[dependencies]
velnor-actions-actionlint = { version = "=0.1.1", path = "../velnor-actions-actionlint" }
velnor-actions-contract = { version = "=0.1.1", path = "../velnor-actions-contract" }
velnor-actions-mise = { version = "=0.1.1", path = "../velnor-actions-mise" }
velnor-actions-rust = { version = "=0.1.1", path = "../velnor-actions-rust" }
velnor-actions-tofu = { version = "=0.1.1", path = "../velnor-actions-tofu" }
velnor-actions-workflow-renderer = { version = "=0.1.1", path = "../velnor-actions-workflow-renderer" }
rustix = { version = "=1.1.5", features = ["fs"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { version = "=0.11.0" }
tempfile = { version = "=3.27.0" }
thiserror = { workspace = true }
toml = { version = "=0.9.12" }

[lints]
workspace = true

[[test]]
name = "velnor_orchestrator"
path = "tests/velnor_orchestrator.rs"

[[test]]
name = "validation_failure"
path = "tests/validation_failure.rs"

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { version = "=3.27.0" }
velnor-actions-contract = { version = "=0.1.1", path = "../velnor-actions-contract" }
