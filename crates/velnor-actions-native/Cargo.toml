[package]
name = "velnor-actions-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[[bin]]
name = "velnor-archive-guard"
path = "bin/velnor-archive-guard.rs"

[dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
velnor-actions-contract = { version = "=0.1.0", path = "../velnor-actions-contract" }

[build-dependencies]
sha2 = { version = "=0.11.0", default-features = false }

[lints]
workspace = true

[[test]]
name = "velnor_native"
path = "tests/velnor_native.rs"

[[test]]
name = "archive_guard_cli"
path = "tests/archive_guard_cli.rs"

[dev-dependencies]
sha2 = { version = "=0.11.0", default-features = false }
syn = { version = "=3.0.6", default-features = false, features = ["full", "parsing", "visit"] }
