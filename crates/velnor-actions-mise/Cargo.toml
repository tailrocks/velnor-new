[package]
name = "velnor-actions-mise"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]
velnor-actions-contract = { version = "=0.1.18", path = "../velnor-actions-contract" }
serde = { workspace = true }
serde_json = { workspace = true }
rustix = { version = "=1.1.5", features = ["fs", "process"] }
sha2 = { workspace = true }

[[test]]
name = "velnor_mise"
path = "tests/velnor_mise.rs"

[dev-dependencies]
syn = { version = "=3.0.9", default-features = false, features = ["full", "parsing", "visit"] }
velnor-actions-tofu = { version = "=0.1.18", path = "../velnor-actions-tofu" }
