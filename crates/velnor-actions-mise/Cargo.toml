[package]
name = "velnor-actions-mise"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[[test]]
name = "velnor_mise"
path = "tests/velnor_mise.rs"

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
velnor-actions-contract = { version = "=0.1.76", path = "../velnor-actions-contract" }
serde = { workspace = true }
serde_json = { workspace = true }
rustix = { version = "=1.1.5", features = ["fs", "process"] }
sha2 = { workspace = true }
toml = { version = "=1.1.8" }

[dev-dependencies]
velnor-actions-tofu = { version = "=0.1.76", path = "../velnor-actions-tofu" }
tempfile = { version = "=3.27.0" }

[features]
release-git-rehearsal = []

[[test]]
name = "release_git_rehearsal"
path = "tests/release_git_rehearsal.rs"
required-features = ["release-git-rehearsal"]
