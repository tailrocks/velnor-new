[package]
name = "velnor-runner-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[[test]]
name = "resource_probe_release_public"
path = "tests/resource_probe_release_public.rs"

[[test]]
name = "runner_image_qualification_public"
path = "tests/runner_image_qualification_public.rs"

[[test]]
name = "guest_image_identity_pure"
path = "tests/guest_image_identity_pure.rs"

[[test]]
name = "image_session_public"
path = "tests/image_session_public.rs"

[[test]]
name = "registry_projection_cache_pure"
path = "tests/registry_projection_cache_pure.rs"

[[test]]
name = "registry_acquisition_public"
path = "tests/registry_acquisition_public.rs"

[[test]]
name = "registry_journal_public"
path = "tests/registry_journal_public.rs"

[[test]]
name = "runner_manifest_admission_public"
path = "tests/runner_manifest_admission_public.rs"

[[test]]
name = "scaleset_installation_public"
path = "tests/scaleset_installation_public.rs"

[[test]]
name = "runner_platform_public"
path = "tests/runner_platform_public.rs"

[[bin]]
name = "velnor-resource-probe-release"
path = "src/bin/velnor_resource_probe_release.rs"
test = false

[lib]
doctest = false
test = true

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
bollard = { workspace = true }
bytes = { version = "=1.12.1" }
flate2 = { workspace = true }
futures-util = { version = "=0.3.34" }
getrandom = { workspace = true }
httpdate = "=1.0.3"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
libc = { version = "=0.2.191" }
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "system-proxy", "stream"] }
rustix = { workspace = true, features = ["process"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = { version = "=0.4.46" }
tempfile = { version = "=3.27.0" }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
toml = { workspace = true }
turso = { workspace = true }
uuid = { version = "=1.28.0", features = ["v4"] }
zeroize = { workspace = true }
velnor-runner-image-manifest = { version = "=0.1.0", path = "../velnor-runner-image-manifest" }
velnor-runner-core = { version = "=0.1.0", path = "../velnor-runner-core" }
velnor-runner-qualification = { version = "=0.1.0", path = "../velnor-runner-qualification" }
velnor-runner-github = { version = "=0.1.0", path = "../velnor-runner-github" }
velnor-resource-probe = { version = "=0.1.0", path = "../velnor-resource-probe" }


[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "mac_qualification_facade_public"
path = "tests/mac_qualification_facade_public.rs"
