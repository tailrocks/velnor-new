[package]
name = "velnor-runner-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[[test]]
name = "resource_probe_release_public"
path = "tests/resource_probe_release_public.rs"

[[test]]
name = "runner_image_manifest_public"
path = "tests/runner_image_manifest_public.rs"

[[test]]
name = "runner_image_qualification_public"
path = "tests/runner_image_qualification_public.rs"

[[bin]]
name = "velnor-resource-probe-release"
path = "src/bin/velnor_resource_probe_release.rs"
test = false

[lib]
test = false

[lints]
workspace = true

[dependencies]
base64 = { version = "=0.23.1" }
bollard = { workspace = true }
flate2 = { workspace = true }
futures-util = { version = "=0.3.34" }
getrandom = { workspace = true }
libc = { workspace = true }
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "system-proxy", "stream"] }
rustix = { workspace = true, features = ["process"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = { version = "=0.4.46" }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
turso = { workspace = true }
uuid = { version = "=1.28.0", features = ["v4"] }
zeroize = { workspace = true }
velnor-actions-contract = { version = "=0.1.69", path = "../../../velnor-actions-contract" }
velnor-runner-core = { version = "=0.1.0", path = "../velnor-runner-core" }
velnor-runner-github = { version = "=0.1.0", path = "../velnor-runner-github" }

[dev-dependencies]
tempfile = { version = "=3.27.0" }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0" }
