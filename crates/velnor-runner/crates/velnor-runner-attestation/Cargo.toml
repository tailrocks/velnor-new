[package]
name = "velnor-runner-attestation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "velnor-runner-attestation-helper"
path = "src/main.rs"

[dependencies]
async-trait = { version = "=0.1.92" }
base64 = { version = "=0.23.1" }
bytes = { version = "=1.12.1" }
der = { version = "=0.7.10" }
futures-util = { version = "=0.3.34" }
libc = { workspace = true }
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "system-proxy", "stream"] }
rustix = { workspace = true, features = ["process"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sigstore-trust-root = { version = "=0.15.0", default-features = false }
sigstore-verify = { version = "=0.15.0", default-features = false, features = ["aws-lc-rs", "native-tls"] }
snap = { version = "=1.1.2" }
tokio = { workspace = true, features = ["fs"] }
tough = { version = "=0.24.0", default-features = false }
url = { version = "=2.5.8" }
x509-cert = { version = "=0.2.5" }

[dev-dependencies]
aws-lc-rs = { version = "=1.18.2" }
jiff = { version = "=0.2.38", features = ["serde"] }
tempfile = { version = "=3.27.0" }
