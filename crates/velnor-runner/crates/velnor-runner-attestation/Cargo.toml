[package]
name = "velnor-runner-attestation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "velnor-runner-attestation-helper"
path = "src/main.rs"

[dependencies]
async-trait = "=0.1.92"
base64 = "=0.23.1"
bytes = "=1.12.1"
der = "=0.7.10"
futures-util = "=0.3.34"
libc = "=0.2.190"
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "system-proxy", "stream"] }
rustix = { version = "=1.1.5", default-features = false, features = ["process"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
sigstore-trust-root = { version = "=0.11.0", default-features = false }
sigstore-verify = { version = "=0.11.0", default-features = false, features = ["native-tls"] }
snap = "=1.1.2"
tokio = { version = "=1.49.0", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "time"] }
tough = { version = "=0.24.0", default-features = false }
url = "=2.5.8"
x509-cert = "=0.2.5"

[dev-dependencies]
aws-lc-rs = "=1.18.1"
jiff = { version = "=0.2.31", features = ["serde"] }
tempfile = "=3.27.0"
