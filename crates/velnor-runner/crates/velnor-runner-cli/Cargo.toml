[package]
name = "velnor-runner-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[features]
local-mode = ["velnor-runner-host/local-mode"]

[lints]
workspace = true

[dependencies]
clap = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
rustix = { workspace = true }
velnor-runner-core = { version = "=0.1.0", path = "../velnor-runner-core" }
velnor-runner-host = { version = "=0.1.0", path = "../velnor-runner-host" }

[dev-dependencies]
tempfile = { version = "=3.27.0" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
security-framework = { version = "=3.7.0" }

[lib]
doctest = false
name = "velnor_runner_cli"
path = "src/lib.rs"

[[bin]]
name = "velnor-host"
path = "src/main.rs"
test = false
