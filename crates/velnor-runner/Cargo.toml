[package]
name = "velnor-runner"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[features]
test-support = []
live-sandbox = ["test-support"]

[package.metadata.cargo-machete]
ignored = ["flate2"]

[lints]
workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "velnor-runner"
path = "src/main.rs"
test = false

[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["test-support"]

[[test]]
name = "sandbox_live"
path = "tests/sandbox_live/main.rs"
required-features = ["live-sandbox"]

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
flate2 = { workspace = true }
futures-util = { workspace = true }
jiff = { version = "=1.0.1", default-features = false, features = ["std", "tzdb-bundle-always"] }
reqwest = { workspace = true }
ring = { workspace = true }
regex-automata = { workspace = true }
rustix = { workspace = true }
zeroize = { workspace = true }
serde = { workspace = true }
serde-saphyr = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
tar = { version = "=0.4.46", default-features = false }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tokio-tungstenite = { workspace = true }
url = { workspace = true }
velnor-model = { workspace = true }
uuid = { workspace = true }
velnor-cache-rules = { path = "../velnor-cache-rules", version = "=0.0.0" }
zip = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = { workspace = true }
libc = { workspace = true }
seccompiler = { workspace = true }

[dev-dependencies]
rsa = { workspace = true }
serde-saphyr = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
