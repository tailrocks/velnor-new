[workspace]
members = [
    "crates/velnor-runner-core",
    "crates/velnor-runner-github",
    "crates/velnor-runner-host",
    "crates/velnor-runner-cli",
]
exclude = []
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151" }
thiserror = { version = "=2.0.21" }
clap = { version = "=4.6.7", features = ["derive"] }
tokio = { version = "=1.49.0", features = ["rt-multi-thread", "macros", "time", "io-util", "sync", "net"] }
bollard = { version = "=0.21.1", default-features = false, features = ["pipe"] }
turso = { version = "=0.8.1" }
zeroize = { version = "=1.8.1", features = ["derive"] }
toml = { version = "=0.9.12" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unexpected_cfgs = "deny"
unfulfilled_lint_expectations = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
too_many_lines = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
mem_forget = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
let_underscore_future = "deny"
let_underscore_must_use = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
allow_attributes = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
