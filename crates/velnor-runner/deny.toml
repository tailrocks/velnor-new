# cargo-deny policy for the pinned cargo-deny 0.20 schema.
# Same allowlist as the generator workspace.

[advisories]
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    # zlib-rs (velnor-runner-host -> flate2) requires Zlib; the generator allowlist is unchanged.
    "Zlib",
]
confidence-threshold = 0.8
