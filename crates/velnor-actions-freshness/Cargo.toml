[package]
name = "velnor-actions-freshness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[package.metadata.velnor]
v1-task-owner = "repository-maintenance"

[dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring"] }
rustls-native-certs = { version = "=0.8.4", default-features = false }
rustix = { version = "=1.1.5", features = ["fs", "process"] }
serde_json = { workspace = true }
syn = { version = "=3.0.6", default-features = false, features = ["full", "parsing"] }
toml = { version = "=0.9.12" }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls-no-provider"] }

[[test]]
name = "velnor_actions_freshness"
path = "tests/freshness_contract.rs"

[lints]
workspace = true
