[package]
name = "velnor-actions-freshness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[lib]
doctest = true
test = true

[package.metadata.velnor]
v1-task-owner = "repository-maintenance"

[dependencies]
serde = { workspace = true }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring"] }
rustls-native-certs = { version = "=0.8.5", default-features = false }
rustix = { version = "=1.1.6", features = ["fs", "process"] }
serde_json = { workspace = true }
syn = { version = "=3.0.10", features = ["full", "visit"] }
toml = { version = "=1.1.8" }
ureq = { version = "=3.5.2", default-features = false, features = ["rustls-no-provider"] }

[lints]
workspace = true
