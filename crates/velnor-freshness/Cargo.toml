[package]
name = "velnor-freshness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[lib]
doctest = true
test = true

[[bin]]
name = "velnor-freshness"
path = "src/main.rs"
test = false

[[test]]
name = "freshness_path_dependencies"
path = "tests/freshness_path_dependencies.rs"

[[test]]
name = "freshness_bin"
path = "tests/freshness_bin.rs"

[package.metadata.velnor]
v1-task-owner = "repository-maintenance"

[dependencies]
serde = { workspace = true }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring"] }
rustls-native-certs = { version = "=0.8.5", default-features = false }
rustix = { version = "=1.1.6", features = ["fs", "process"] }
serde_json = { workspace = true }
syn = { version = "=3.0.9", features = ["full", "visit"] }
toml = { version = "=1.1.8" }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls-no-provider"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
