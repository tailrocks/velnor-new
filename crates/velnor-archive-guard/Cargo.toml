[package]
name = "velnor-archive-guard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[package.metadata.velnor]
v1-task-owner = "repository-maintenance"

[lib]
path = "src/lib.rs"
test = true

[[bin]]
name = "velnor-archive-guard"
path = "src/bin/velnor_archive_guard.rs"
test = false

[[test]]
name = "oci_candidate_configuration_public"
path = "tests/oci_candidate_configuration_public.rs"

[dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
serde = { workspace = true }
rustix = { version = "=1.1.5", default-features = false, features = ["fs", "process", "std"] }
serde_json = { workspace = true }
sha2 = { version = "=0.11.1", default-features = false }
tar = { version = "=0.4.46", default-features = false }

[build-dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["fs", "process", "std"] }
sha2 = { version = "=0.11.1", default-features = false }

[dev-dependencies]
tempfile = { version = "=3.27.0" }

[lints]
workspace = true
