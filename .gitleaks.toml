# gitleaks configuration: the default rules, plus one narrow allowlist. The rules are NOT weakened.
[extend]
useDefault = true

# Reason: `matrix_key` values are velnor job-matrix identifiers, `m-` plus 16 hex digits (crates/velnor-actions-contract
# `MatrixKey`), generated into .github/velnor/task-execution-manifest-v1.json, plan fixtures and goldens. They are not
# credentials, and they change on every regeneration, so line-based fingerprints in .gitleaksignore cannot follow them.
# Scoped to the generic-api-key rule and that exact key/value shape.
[[allowlists]]
description = "velnor matrix_key identifiers"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''matrix_key"?\s*[:=]\s*"m-[0-9a-f]{16}"''']
