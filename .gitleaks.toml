# Gitleaks and BetterLeaks config; BetterLeaks reads this when -c is given (the pre-push hook and CI pass it).
# Uses upstream defaults. The allowlists are narrow: a secret pattern, exact test-fixture
# paths, and vendored action bundles. Other reviewed findings are fingerprints in .gitleaksignore.
[extend]
useDefault = true

[[allowlists]]
description = "matrix_key task-digest ids (m-<16 hex>), not credentials"
regexes = ['''^m-[0-9a-f]{16}$''']

[[allowlists]]
description = "test fixtures and tests with fake tokens, keys or public upstream material; vendored action bundles"
paths = [
  '''^crates/velnor-ci/tests/it/cache_credential_scrub(_hardening)?\.rs$''',
  '''^crates/velnor-ci/tests/it/cache_private_repo\.rs$''',
  '''^crates/velnor-ci/tests/it/public_probe\.rs$''',
  '''^crates/velnor-ci/tests/it/audit/selection\.rs$''',
  '''^crates/velnor-ci/tests/it/data/app_token/TEST-ONLY-not-a-secret-rsa-pkcs[18]\.pem$''',
  '''^crates/velnor-runner/crates/velnor-runner-attestation/tests/fixtures/tough/snakeoil\.pem$''',
  '''^generator/crates/velnor-gen/tests/it/detect_private\.rs$''',
  '''^crates/velnor-runner/crates/velnor-runner-host/src/launch/gate/removal_tests\.rs$''',
  '''^crates/velnor-actions-contract/src/(config/dbt|workflow/qualification_cache_lineage)_tests\.rs$''',
  '''^crates/core/velnor-actions-contract-workflow/src/workflow/artifact_build/tests\.rs$''',
  '''^crates/services/velnor-actions-orchestrator-internal/tests/impl_artifact_export\.rs$''',
  '''^crates/velnor-actions-mise/tests/impl_mise_env_policy\.rs$''',
  '''^crates/mise-util/src/http/tests/auth\.rs$''',
  '''^e2e-win/env_cache_venv\.Tests\.ps1$''',
  '''^e2e/(backend|cli|env|secrets)/test_''',
  '''^scripts/hosted_phase_measurement/tests/''',
  '''^docs/\.vitepress/theme/showreel/test/captures/''',
  '''^dist/((save|restore|save-only|restore-only)/)?index\.js$''',
]
