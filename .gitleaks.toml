[[allowlists]]
description = "test fixture: fake password in the audit selection test"
condition = "AND"
paths = [
  '''^crates/velnor-ci/tests/it/audit/selection\.rs$''',
]
regexTarget = "secret"
regexes = [
  '''^hunter2\-credential$''',
]

[[allowlists]]
description = "test fixture: fake password in the public probe test"
condition = "AND"
paths = [
  '''^crates/velnor-ci/tests/it/public_probe\.rs$''',
]
regexTarget = "secret"
regexes = [
  '''^pass$''',
]

[[allowlists]]
description = "test fixture: fake secret in the private repository cache test"
condition = "AND"
paths = [
  '''^crates/velnor-ci/tests/it/cache_private_repo\.rs$''',
]
regexTarget = "secret"
regexes = [
  '''^secret$''',
]

[[allowlists]]
description = "test fixture: fake credentials in the private detection test"
condition = "AND"
paths = [
  '''^crates/velnor\-gen/tests/it/detect_private\.rs$''',
  '''^generator/crates/velnor\-gen/tests/it/detect_private\.rs$''',
]
regexTarget = "secret"
regexes = [
  '''^hunter2$''',
  '''^pw$''',
]

[[allowlists]]
description = "test fixture: fake password in the dbt config test"
condition = "AND"
paths = [
  '''^crates/velnor\-actions\-contract/src/config/dbt_tests\.rs$''',
]
regexTarget = "secret"
regexes = [
  '''^velnor$''',
]
