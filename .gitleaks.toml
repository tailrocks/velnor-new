[extend]
useDefault = true

[[allowlists]]
description = "matrix_key task-digest ids (m-<16 hex>), not credentials"
regexes = ['''^m-[0-9a-f]{16}$''']

[[allowlists]]
description = "cache-sources fixture: only the known fake x-access-token value in this file, so a real credential added later is still reported"
condition = "AND"
paths = [
  '''^crates/velnor-ci/tests/it/cache_sources_restored\.rs$''',
]
regexTarget = "secret"
regexes = [
  '''^ghs_secret$''',
]

[[allowlists]]
description = "test fixture: fake key in the qualification cache lineage test"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = [
  '''^crates/velnor-actions-contract/src/workflow/qualification_cache_lineage_tests\.rs$''',
]
regexes = [
  '''^qualification\-k1$''',
]

[[allowlists]]
description = "dbt contract proposal: the placeholder service credential, in this one document only"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^docs/proposed/dbt-contract\.md$''']
regexTarget = "secret"
regexes = ['''^example-org$''']

[[allowlists]]
description = "test fixture: fake key in the mise env policy test"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = [
  '''^crates/velnor-actions-mise/tests/impl_mise_env_policy\.rs$''',
]
regexes = [
  '''^VELNOR_P07_DECLARED$''',
]

[[allowlists]]
description = "test fixture: fake token in the removal test"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = [
  '''^crates/velnor-runner/crates/velnor-runner-host/src/launch/gate/removal_tests\.rs$''',
]
regexes = [
  '''^fedcba9876543210fedcba9876543210$''',
]

