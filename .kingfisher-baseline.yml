# Kingfisher baseline: reviewed false positives (class a: placeholder / test fixture), generated by the 2026-10-22 security-audit triage.
# Consumed with --baseline-file by the hk kingfisher steps. Exact finding fingerprints only; the rules are NOT weakened.
# A possibly real credential is never baselined; those are tracked for rotation by the owner.
# Reasons (all findings in this baseline fall under one of these):
#   - velnor generated manifest: sha256 digests / action pins, not credentials
#   - generated CI matrix key / task digest / cache key, not a credential
#   - sha256 digest in generated evidence/parity data, not a credential
#   - bundled third-party action code (azure-storage emulator well-known devstoreaccount1 constants, protobuf descriptor base64 tables), not credentials
#   - test fixture in a redaction/secret-handling test (fake token, short dummy key body, placeholder URI)
#   - git commit hash / sha1 mistaken for a secret
#   - recorded source snapshot: matrix key ids (m-...) and env var names, not credentials
#   - age private key generated for the vendored mise e2e/unit tests (test fixture, protects nothing)
#   - matrix key id constants (m-...) and env var names in source, not credentials
#   - prose in Markdown documentation matched by a keyword rule, no literal credential
#   - documentation/example connection URI with literal USER:PASS placeholders
#   - unit-test GitLab oauth token placeholder gloas-def456
#   - public search-only Algolia key embedded in the documentation site config (public by design)
#   - snakeoil RSA test key from the tough TUF test fixtures, not used anywhere real
#   - sha256 content key in recorded test capture, not a credential
#   - documentation example env block with the local-development default DBT password
#   - hex signature/digest value in recorded qualification evidence, not a credential
#   - unit-test URI me:mine@rubygems placeholder
#   - base64 of the word 'test...' used as a test value
#   - prose in Markdown documentation mentioning password, no literal value
#   - unit-test URI with placeholder git:secret credentials
#   - local-development default / placeholder value
#   - documentation example value my_password
#   - CI cache key name, not a credential
#   - AWS documentation example secret key (wJalrXUtnFEMI/K7MDENG...EXAMPLEKEY) in signing tests/docs, not a credential
#   - Cloudflare account ID (an identifier, not a secret) in a publishing script
#   - Cloudflare account ID / shell env wiring in a publishing script, no credential
#   - Cloudflare account ID / shell variable references in a publishing script, no credential
#   - committed CI log: Azure storage account NAME of the public GitHub Actions results host (a name, not a key)
#   - documentation prose, no credential
#   - low-confidence match on an identifier string literal in test code, no credential
