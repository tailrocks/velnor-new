[package]
name = "velnor-runner-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
bollard = { workspace = true }
getrandom = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
zeroize = { workspace = true }
velnor-runner-apparmor = { version = "=0.1.1", path = "../velnor-runner-apparmor" }
velnor-runner-core = { version = "=0.1.1", path = "../velnor-runner-core" }
velnor-runner-docker-spec = { version = "=0.1.1", path = "../velnor-runner-docker-spec" }
velnor-runner-github = { version = "=0.1.1", path = "../velnor-runner-github" }
velnor-runner-host-config = { version = "=0.1.1", path = "../velnor-runner-host-config" }
velnor-runner-journal = { version = "=0.1.1", path = "../velnor-runner-journal" }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { workspace = true }

[dev-dependencies]
velnor-runner-apparmor = { version = "=0.1.1", path = "../velnor-runner-apparmor", features = ["test-support"] }
velnor-runner-launch = { version = "=0.1.1", path = "../velnor-runner-launch" }
