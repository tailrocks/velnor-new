    name: MBX objects cache / protected-main writer
    if: inputs.mode == 'mbx-cache-roundtrip' && github.ref == 'refs/heads/main' && github.ref_protected == true
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    env:
      MBX_GC_AUTO: "1"
      MBX_SHARE_OUT_DIR: "0"
