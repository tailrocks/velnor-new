[package]
name = "velnor-ci"
version = "0.1.83"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "velnor-ci"
path = "src/main.rs"
test = false

[[test]]
name = "it"
path = "tests/it/main.rs"

[dependencies]
clap = { version = "=4.6.7", features = ["derive", "string"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154" }
libc = "=0.2.191"
nix = { version = "=0.31.3", default-features = false, features = ["signal", "user"] }
signal-hook = { version = "=0.3.18", default-features = false, features = ["iterator"] }
velnor-gen = { version = "=0.1.83", path = "../../../generator/crates/velnor-gen" }
velnor-model = { version = "=0.0.0", path = "../../../generator/crates/velnor-model" }
velnor-release = { version = "=0.0.0", path = "../../../generator/crates/velnor-release" }
velnor-rust = { version = "=0.0.0", path = "../../../generator/crates/velnor-rust" }
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
ring = { version = "=0.17.14", default-features = false }
nix = { version = "=0.31.3", default-features = false, features = ["signal"] }
