[package]
name = "velnor-ci"
version = "0.1.79"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "velnor-ci"
path = "src/main.rs"
test = false

[[test]]
name = "it"
path = "tests/it/main.rs"

[dependencies]
clap = { version = "=4.6.7", features = ["derive", "string"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154" }
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }
