[profile.ci]
retries = 0
test-threads = "num-cpus"
status-level = "all"
final-status-level = "flaky"

[profile.default]
slow-timeout = { period = "2s", terminate-after = 1 }

[[profile.default.overrides]]
filter = "test(io_restore_cargo::) | test(io_cold_targets::) | test(io_shared_targets::) | test(io_foreign_targets::) | test(io_restored_targets::) | test(io_snapshot_storage::) | test(io_inputs_scope::)"
slow-timeout = { period = "30s", terminate-after = 1 }
