[profile.ci]
retries = 0
test-threads = "num-cpus"
status-level = "all"
final-status-level = "flaky"

[profile.default]
slow-timeout = { period = "2s", terminate-after = 1 }

[[profile.default.overrides]]
filter = 'test(repeated_directory_declarations_share_the_audit_scan_budget) | test(distinct_declared_trees_cannot_exceed_the_audit_scan_budget)'
threads-required = "num-test-threads"
slow-timeout = { period = "120s", terminate-after = 1 }

[[profile.default.overrides]]
filter = "test(crates_mirror)"
success-output = "immediate"
threads-required = "num-test-threads"

[[profile.ci.overrides]]
filter = "test(crates_mirror)"
success-output = "immediate"
threads-required = "num-test-threads"
