name: Qualify macOS velnor-actions
description: Shared steps for Qualify macOS velnor-actions
inputs:
  artifact_id:
    description: Artifact ID from this target's build job
    required: true
  manifest_artifact_id:
    description: Artifact ID of the canonical candidate manifest
    required: true
  manifest_sha256:
    description: SHA-256 of the canonical candidate manifest bytes
    required: true
runs:
  using: composite
  steps:
    - name: Setup Mise
      uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
      with:
        version: 2026.10.5
        sha256: 41c4028257d30f5f5742c99247c461f417143d6c7301f167a0c185247c8f206e
        install: "false"
        env: "false"
        cache: "false"
        cache_save: "false"
    - name: Install pinned qualification tools
      shell: bash
      run: mise --no-config --no-env --no-hooks install rust@1.98.1 actionlint@1.7.12 shellcheck@0.11.0 zizmor@1.30.1
    - name: Download built asset archive
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: ${{ inputs.artifact_id }}
        path: macos-assets
    - name: Prevalidate and extract uploaded candidate archive
      shell: bash
      run: "set -eu\nbash scripts/with-owned-archive-guard.sh -- python3 scripts/generator-release/extract-candidate.py 'macos-assets/generator-macos-assets.tar' 'macos-assets' 'velnor-actions-0.1.5-aarch64-apple-darwin' 'velnor-actions-0.1.5-aarch64-apple-darwin.sha256' 'velnor-actions-0.1.5-aarch64-apple-darwin.provenance.json'"
    - name: Verify extracted candidate file types and executable mode
      shell: bash
      run: "set -eu\ntest -f macos-assets/velnor-actions-0.1.5-aarch64-apple-darwin\ntest ! -L macos-assets/velnor-actions-0.1.5-aarch64-apple-darwin\ntest -x macos-assets/velnor-actions-0.1.5-aarch64-apple-darwin\ntest -f macos-assets/velnor-actions-0.1.5-aarch64-apple-darwin.sha256\ntest ! -L macos-assets/velnor-actions-0.1.5-aarch64-apple-darwin.sha256\ntest ! -x macos-assets/velnor-actions-0.1.5-aarch64-apple-darwin.sha256\ntest -f macos-assets/velnor-actions-0.1.5-aarch64-apple-darwin.provenance.json\ntest ! -L macos-assets/velnor-actions-0.1.5-aarch64-apple-darwin.provenance.json\ntest ! -x macos-assets/velnor-actions-0.1.5-aarch64-apple-darwin.provenance.json"
    - name: Download canonical same-run candidate manifest
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: ${{ inputs.manifest_artifact_id }}
        path: manifest-assets
    - name: Verify candidate provenance record
      shell: bash
      run: "set -eu\ndigest=\"$(awk -v expected='velnor-actions-0.1.5-aarch64-apple-darwin' 'NR == 1 { if (NF != 2 || length($1) != 64 || $1 !~ /^[0-9a-f]+$/ || $2 != expected) exit 1; print $1; next } { exit 1 } END { if (NR != 1) exit 1 }' 'macos-assets/velnor-actions-0.1.5-aarch64-apple-darwin.sha256')\"\njq -e --arg version \"0.1.5\" --arg repository \"$GITHUB_REPOSITORY\" --arg commit \"$GITHUB_SHA\" --arg target \"aarch64-apple-darwin\" --arg asset \"velnor-actions-0.1.5-aarch64-apple-darwin\" --arg sha256 \"$digest\" --arg rust '1.98.1' --arg mr_boxington '1.21.1' '.schema == 1 and .version == $version and .repository == $repository and .commit == $commit and .target == $target and .asset == $asset and .sha256 == $sha256 and .toolchain.rust == $rust and .toolchain[\"mr-boxington\"] == $mr_boxington' macos-assets/velnor-actions-0.1.5-aarch64-apple-darwin.provenance.json > /dev/null"
    - name: Verify downloaded checksum sidecar
      shell: bash
      run: "set -eu\ncd macos-assets\nshasum -a 256 --check velnor-actions-0.1.5-aarch64-apple-darwin.sha256"
    - name: Qualify downloaded candidate
      env:
        VELNOR_RELEASE_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      shell: bash
      run: "set -eu\nunset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN GITHUB_TOKEN GH_TOKEN MISE_GITHUB_TOKEN GH_HOST GH_CONFIG_DIR\ntest \"$GITHUB_WORKFLOW_SHA\" = \"$GITHUB_SHA\"\ntest \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\"\ntest \"$(./macos-assets/velnor-actions-0.1.5-aarch64-apple-darwin --version)\" = \"velnor-actions 0.1.5\"\nscripts/capture-opentofu-goldens.sh check-release \"$GITHUB_WORKSPACE/macos-assets/velnor-actions-0.1.5-aarch64-apple-darwin\" \"$GITHUB_WORKSPACE/manifest-assets/release-manifest.json\" \"$VELNOR_RELEASE_MANIFEST_SHA256\""
