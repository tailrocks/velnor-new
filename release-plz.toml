# One root workspace (#1290, #731). Every release tag carries a group prefix and
# there is no bare `v<version>` tag (owner decision, #1429):
#
#   tools-v<version>   velnor-ci and velnor-gen, always released together
#   runner-v<version>  the runner
#
# The old engine (velnor-actions-*) has no group: it is being deleted and never
# releases through release-plz. Every other package is not released either.
#
# Release-plz never diffs a `release = false` crate, so the runner's internal
# crates carry their own `release = true` entry in the runner version group.
# The tools group is only velnor-ci and velnor-gen: the other tools crates are
# internal at 0.0.0 and pinned `=0.0.0`, so they must not join the version group.
# A group lists its lead first. The lead owns the tag and the GitHub release;
# the other members keep the lead's `git_tag_name` (it finds their baseline tag)
# and turn their own tag and release off. `release-plz -o json` lists every
# member with the lead's tag, so a consumer dedupes releases by tag.

[workspace]
release = false
release_always = false
semver_check = false
git_only = true
git_release_draft = true
pr_branch_prefix = "release-plz-"

# Group "tools". Lead: owns the tag and the GitHub release.
[[package]]
name = "velnor-ci"
release = true
git_tag_name = "tools-v{{ version }}"
version_group = "tools"

[[package]]
name = "velnor-gen"
release = true
git_tag_name = "tools-v{{ version }}"
version_group = "tools"
git_tag_enable = false
git_release_enable = false

# Group "runner". Lead: owns the tag and the GitHub release.
[[package]]
name = "velnor-runner-cli"
release = true
git_tag_name = "runner-v{{ version }}"
version_group = "runner"

[[package]]
name = "velnor-resource-probe"
release = true
git_tag_name = "runner-v{{ version }}"
version_group = "runner"
git_tag_enable = false
git_release_enable = false

[[package]]
name = "velnor-runner-attestation"
release = true
git_tag_name = "runner-v{{ version }}"
version_group = "runner"
git_tag_enable = false
git_release_enable = false

[[package]]
name = "velnor-runner-core"
release = true
git_tag_name = "runner-v{{ version }}"
version_group = "runner"
git_tag_enable = false
git_release_enable = false

[[package]]
name = "velnor-runner-github"
release = true
git_tag_name = "runner-v{{ version }}"
version_group = "runner"
git_tag_enable = false
git_release_enable = false

[[package]]
name = "velnor-runner-host"
release = true
git_tag_name = "runner-v{{ version }}"
version_group = "runner"
git_tag_enable = false
git_release_enable = false

[[package]]
name = "velnor-runner-image-manifest"
release = true
git_tag_name = "runner-v{{ version }}"
version_group = "runner"
git_tag_enable = false
git_release_enable = false

[[package]]
name = "velnor-runner-qualification"
release = true
git_tag_name = "runner-v{{ version }}"
version_group = "runner"
git_tag_enable = false
git_release_enable = false
