# One root workspace (#1290, #731): velnor-runner-cli tags `runner-v<version>`;
# there is no family tag. Every other package is not released by release-plz.

[workspace]
release = false
release_always = false
semver_check = false
git_only = true
git_release_draft = true
pr_branch_prefix = "release-plz-"

[[package]]
name = "velnor-runner-cli"
release = true
git_tag_name = "runner-v{{ version }}"
