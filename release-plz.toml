# CI tools workspace: velnor-actions-cli tags `v<version>` (#1290, #731). The
# runner workspace (crates/velnor-runner) is a separate root with its own
# `runner-v<version>` tags; there is no family tag.

[workspace]
release = false
release_always = false
semver_check = false
git_only = true
git_release_draft = true
pr_branch_prefix = "release-plz-actions-"

[[package]]
name = "velnor-actions-cli"
release = true
git_tag_name = "v{{ version }}"
