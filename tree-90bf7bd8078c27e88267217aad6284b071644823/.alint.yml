# S2 consumer adapter: extend the materialized strict profile, add the
# one command rule the trust gate requires to live in the adopter's own
# top-level config (never via extends).
#
# Policy: tailrocks/rust-repository-policy v0.1.1
# (sha256 3aeb63a996df1f453b07e1647282ff7005b84306a02ce2d8bea63e6c66b424d5),
# materialized into .cache/rust-policy/ (gitignored; CI re-materializes
# before `alint check`). Helper `rust-repository-policy` must be on PATH.
#
# Replaces the pre-rollout Velnor-local config (5 bundle extends + 9 local
# rules: required-files, claude-is-agents-symlink,
# agent-instructions-max-lines, agent-instructions-max-size, crates-only,
# velnor-no-stray-cargo-lock, velnor-no-stray-npm-lock, rust-max-lines,
# lib-main-max-lines). Reconciliation is sequenced in
# docs/content/development/rust-policy-rollout.mdx: overlapping size rules
# stay dropped (policy owns them); Velnor-specific rules return as
# adapter-local additions once the migration slices land.
version: 1
# Anti-evasion MUST be repeated here: `respect_gitignore: false` set in
# the extended profile does NOT propagate to the consumer (probed
# 2026-10-06 on alint 0.17.0: a gitignored 500-line file passed
# size-file-400 through the extends chain until this line was added).
respect_gitignore: false
extends:
  - ./.cache/rust-policy/profiles/rust-strict-v1.yml
rules:
  - id: policy-gaps
    kind: command_idempotent
    command: ["rust-repository-policy", "check-gaps", "--root", "."]
    files_from: stdout
    files_pattern: "^\\S+ (\\S+?):\\d+:"
    level: error
