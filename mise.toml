wrappers = { cargo = { command = "mbx", env = { MBX_CARGO_SHIM_MODE = "1" } } }
[tools]
rust = "1.99.1"
# `mbx` binary required by wrappers.cargo.command above (P07-9). Generated
# CI reads every version in this table at run time (hard decision 5); clean
# checkouts resolve MBX from this file via `mise install`, never globally.
mr-boxington = "1.25.0"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.148"

[tasks.test-maintenance-helpers]
description = "Run repository-only maintenance helper test suites"
run = '''
set -e
cargo --config build.jobs=2 nextest run --locked --manifest-path Cargo.toml --package velnor-actions-freshness --no-tests fail --jobs 2
cargo --config build.jobs=2 nextest run --locked --manifest-path Cargo.toml --package velnor-archive-guard --no-tests fail --jobs 2
'''
