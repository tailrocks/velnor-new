min_version = "2026.10.17"

[tools]
# Owner standard layout (split-plan hk/STANDARD.md): `mr_boxington = true`
# plus `[wrappers.cargo]` run every `cargo` through MBX; rust-toolchain.toml
# mirrors this Rust version. Generated CI reads every version in this table
# at run time (hard decision 4); clean checkouts resolve MBX from this file
# via `mise install`, never globally.
rust = { version = "1.99.1", mr_boxington = true }
mr-boxington = "1.26.0"
hk = "2.8.0"
cargo-binstall = "1.26.0"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.149"

[settings]
cargo.binstall = true
idiomatic_version_file_enable_tools = ["rust"]
lockfile = true

[wrappers.cargo]
command = "mbx"
env = { MBX_CARGO_SHIM_MODE = "1" }

[tasks.test-maintenance-helpers]
description = "Run repository-only maintenance helper test suites"
run = '''
set -e
cargo --config build.jobs=2 nextest run --locked --manifest-path Cargo.toml --package velnor-actions-freshness --no-tests fail --jobs 2
cargo --config build.jobs=2 nextest run --locked --manifest-path Cargo.toml --package velnor-archive-guard --no-tests fail --jobs 2
'''
