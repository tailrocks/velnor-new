min_version = "2026.10.18"

[tools]
# Owner standard layout: `mr_boxington = true` plus `[wrappers.cargo]` run
# every `cargo` through MBX. rust-toolchain.toml mirrors this rust entry
# exactly (channel, components, targets): Mise ignores the file's options,
# rustup-only tools read only the file, and generation fails on drift. Generated CI reads every version in this table
# at run time (hard decision 4); clean checkouts resolve MBX from this file
# via `mise install`, never globally.
rust = { version = "1.99.1", profile = "minimal", components = [
  "clippy",
  "rustfmt",
], targets = [
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
], mr_boxington = true }
mr-boxington = { version = "1.28.0", workflow = "release.yml@refs/heads/main" }
bun = "1.4.4"
hk = "2.8.0"
cargo-binstall = "1.26.0"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.150"
# Workflow linting (hard decision 10): CI reads these versions at run time,
# and hk's check-only jactionlint step runs the same binaries locally.
jactionlint = "2.3.0"
shellcheck = "0.11.0"
# Owner hk standard (hk.pkl): secret scanners for the pre-commit, pre-push and
# security-audit hooks, and the tools behind the stack builtins.
kingfisher = "2.14.0"
betterleaks = "1.9.0"
gitleaks = "8.30.1"
rumdl = "0.3.0"
cargo-deny = "0.20.2"
opentofu = "1.13.2"

[settings]
cargo.binstall = true
idiomatic_version_file_enable_tools = ["rust"]
lockfile = true

[wrappers.cargo]
command = "mbx"
env = { MBX_CARGO_SHIM_MODE = "1" }

[tasks.test-maintenance-helpers]
description = "Run repository-only maintenance helper test suites"
run = '''
set -eu
ROOT="$(git rev-parse --show-toplevel)"
cd "$ROOT"
bash images/resource-probe/test_build_runner_images.sh
TEST_MEMBERS="$(VELNOR_INTERNAL_OP=repo-policy-v1 \
  VELNOR_REPO_POLICY_ACTION=test-members \
  VELNOR_REPO_POLICY_ROOT="$ROOT" \
  VELNOR_REPO_POLICY_MANIFEST_PATH='' \
  cargo --config build.jobs=2 run --quiet --locked --package velnor-actions-cli --bin velnor-actions)"
for package in velnor-actions-freshness velnor-archive-guard; do
  case " $TEST_MEMBERS " in
    *" $package "*)
      cargo --config build.jobs=2 nextest run --locked --manifest-path Cargo.toml --package "$package" --no-tests fail --jobs 2
      ;;
    *)
      echo "skip: $package (Cargo metadata has no test-enabled targets)"
      ;;
  esac
done
'''
